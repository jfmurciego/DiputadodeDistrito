# PROYECTO: Diputado de Distrito
# COMPONENTE: política nacional de generación territorial
# VERSIÓN: 1.7.3
# FECHA: 2026-11-01
# CAMBIOS: 1.6.0: piloto Congreso Huesca (K=2, límites ±15 %, municipios indivisibles hasta el techo).
#   1.5.2: umbral de atomicidad municipal 1,5 en la Comunidad Valenciana (antes solo en su contrato, #336).
#   1.5.1: umbral de atomicidad municipal 1,25 en Andalucía, País Vasco y Cataluña.
#   1.5.0: exenciones estructurales de suelo en Ibiza (07-C04), Tenerife (38-C01) y 35-C02.
#   1.4.0: structural_floor_exemptions por territorio; Menorca (07-C02) exenta del suelo.
#   1.3.0: Melilla baja a suelo 0,50 y tolerancia 0,50 (con 0,70 la M04 no encuentra partición conexa).
#   1.2.0: admite population_limits por territorio.
# CAMBIOS 1.7.0: alta de 48 provincias del Congreso con herramientas/generar_provincias_congreso.py (K del reparto N06).
# CAMBIOS 1.7.1: provincia de Santa Cruz de Tenerife con partición por islas (Tenerife y grupo occidental).
# CAMBIOS 1.7.2: Baleares y Las Palmas con islas agrupadas y reparto fijado por el propietario.
# CAMBIOS 1.7.3: techo 116 % en Congreso Cádiz y 127 % en Congreso Baleares (decisión del propietario, 01-11-2026).
# ANTERIOR: legacy/configuracion/politica_generacion_territorial_2025_v1.7.2_cadiz_20261101.yaml
# ESTADO: candidato
# FUNCIÓN: materializar de forma uniforme contratos ejecutables y distinguir tamaño institucional de K de la política DDD de reparto.
schema: ddd-generation-policy/1.0
edition: '2025'
defaults:
  population_floor_ratio: 0.80
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  municipality_atomicity_limit_ratio: 1.75
  district_apportionment: hamilton
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  require_auditable_district_catalogue: true
territories:
  andalucia:
    k: 109
    k_source: norma
    partition_mode: province_hamilton
    rationale: "K=109 conserva el tamaño vigente del Parlamento de Andalucía como regla institucional ex ante."
    population_limits:
      municipality_atomicity_limit_ratio: 1.25
      decided_at: "2026-10-29"
      evidence: "run 40891753503: M05 NO_FEASIBLE_REPAIR_FOUND; 4 distritos bajo suelo en Cádiz (11) y Sevilla (41), ratios 0,25-0,70"
      rationale: "Decisión del propietario (opción B, 29-10-2026): con 1,75 los municipios medianos son indivisibles y M05 no puede reabsorber los distritos residuales bajo el suelo; con 1,25 puede dividirlos."
  aragon: {k: 67, k_source: historico_no_registrado, partition_mode: province_hamilton, rationale: "K=67 conserva el baseline institucional heredado y ya gobernado por el contrato de Aragón."}
