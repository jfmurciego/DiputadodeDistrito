        evidence: "run 40891796781: M05 NO_FEASIBLE_REPAIR_FOUND; DIAG_DISTRITO 56 = Sant Joan de Labritja (07050) sola, 6.809 hab., ratio 0,33"
        rationale: "Decisión del propietario (opción A, 29-10-2026). Ibiza (8 distritos, 159.180 hab.) no admite partición sobre el suelo con la disciplina municipal: Sant Josep y Sant Antoni son indivisibles y Sant Joan no completa distrito sin dejar por debajo del suelo a los de Eivissa y Santa Eulària."
