notes:
  - Cada valor usa la misma configuración territorial y las mismas cuatro semillas.
  - Se guarda una fila por semilla y surcharge; el mapa seleccionado no sustituye a las otras cadenas.
  - La línea base se recalcula desde su CSV canónico, cuya huella SHA-256 esperada queda fijada en este contrato experimental.
  - La línea base se evalúa también con las restricciones duras vigentes y se etiqueta como referencia histórica, no como alternativa promovible.
  - La retención se normaliza también contra el máximo teórico impuesto por objetivo × 1,12.
  - El barrido no modifica el contrato territorial, el catálogo, el visor ni ningún mapa promovido.
