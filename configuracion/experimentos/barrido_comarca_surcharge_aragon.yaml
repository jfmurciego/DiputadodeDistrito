  - comarcas_divididas
  - comarcas_divididas_evitables
  - retencion_comarcal
  - retencion_techo_teorico
  - retencion_sobre_maximo
  - polsby_popper_min
  - polsby_popper_median
  - max_relative_deviation
promotion: forbidden
publication: false
