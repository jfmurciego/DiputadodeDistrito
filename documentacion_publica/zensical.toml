  { "Inicio" = "index.md" },
  { "Método" = "metodo.md" },
  { "Fuentes y derechos de uso" = "fuentes.md" },
  { "Datos abiertos y licencia" = "datos-abiertos.md" },
  { "Cómo citar" = "citar.md" },
  { "Archivo con R2" = "archivo-r2.md" },
]
[project.theme]
