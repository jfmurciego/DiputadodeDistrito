# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# FECHA: 2026-11-03
# ESTADO: portal documental inicial; publicación pendiente
# ANTERIOR: archivo nuevo
[project]
site_name = "DDD · Documentación e investigación"
site_description = "Método, fuentes y evidencias de Diputado de Distrito"
site_author = "Proyecto Diputado de Distrito"
repo_url = "https://github.com/jfmurciego/DiputadodeDistrito"
repo_name = "Diputado de Distrito"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = false
nav = [
  { "Inicio" = "index.md" },
  { "Empezar" = "empezar.md" },
  { "Arquitectura M01–M08" = "arquitectura.md" },
  { "Fuentes y derechos de uso" = "fuentes.md" },
  { "Ejecuciones y escenarios" = "ejecuciones.md" },
  { "Auditoría de conservación" = "auditoria.md" },
  { "Archivo con R2" = "archivo-r2.md" },
  { "Publicación del portal" = "publicacion.md" },
  { "Plan de trabajo" = "plan.md" },
]
[project.theme]
language = "es"
font = false
features = ["navigation.sections", "navigation.top", "content.code.copy", "search.highlight"]
[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "amber"
[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
