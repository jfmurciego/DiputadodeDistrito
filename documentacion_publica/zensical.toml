# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.2.0
# FECHA: 2026-11-19
# ESTADO: portal público estable (T-73)
# CAMBIOS: 1.2.0 (T-423): tema de la V4 (extra_css estilos/v4.css) y cabecera, menú único y pie de la V4 (custom_dir overrides/). MOTIVO: un solo diseño.
# ANTERIOR: legacy/documentacion_publica/zensical_v1.1.0_20261119.toml
[project]
site_name = "DDD · Documentación e investigación"
site_description = "Método, fuentes y evidencias de Diputado de Distrito"
site_author = "Proyecto Diputado de Distrito"
repo_url = "https://github.com/jfmurciego/DiputadodeDistrito"
repo_name = "Diputado de Distrito"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = false
extra_css = ["estilos/v4.css"]
nav = [
  { "Inicio" = "index.md" },
  { "Método" = "metodo.md" },
  { "Fuentes y derechos de uso" = "fuentes.md" },
  { "Datos abiertos y licencia" = "datos-abiertos.md" },
  { "Cómo citar" = "citar.md" },
  { "Archivo con R2" = "archivo-r2.md" },
]
[project.theme]
custom_dir = "overrides"
language = "es"
font = false
features = ["navigation.sections", "navigation.top", "content.code.copy", "search.highlight"]
[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "amber"
[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
