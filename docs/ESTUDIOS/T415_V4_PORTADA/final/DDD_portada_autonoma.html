<main id="contenido" tabindex="-1"><section class="detail-hero"><div class="wrap"><div class="kicker">Sistema representativo · Contexto del proyecto</div><h1>Comprender</h1><p>El proyecto plantea una representación vinculada al territorio. Esta página introduce sus conceptos y da acceso a los mapas y a sus publicaciones.</p></div></section><div class="wrap detail-content"><section class="detail-panel"><header><h2>Sistema y distritos</h2></header><div class="contents"><p>La circunscripción delimita el territorio al que se atribuyen escaños. Un mapa electoral permite explorar criterios de delimitación, población, relación entre territorio y representación, y resultados agregados.</p><p>La propuesta Diputado de Distrito plantea una estructura de representación territorial que debe distinguirse de los resultados de elecciones celebradas bajo el sistema vigente.</p><p><a class="page-action" href="https://diputadodedistrito.es/v3/">Abrir el visor interactivo</a></p></div></section><aside class="detail-panel"><header><h2>Publicaciones y datos</h2></header><div class="contents"><p>La investigación se documentará con metodología, fuentes, versiones y registro individual de cada mapa.</p><p><a class="page-action" href="#registro">Consultar auditoría y registro</a></p></div></aside></div></main>

    const search = root.querySelector('[data-doi-search]');
    const data = Array.isArray(window.DDD_MAPS)
      ? window.DDD_MAPS.filter(x => x && typeof x === 'object') : [];
    const create = (tag, cls, value) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      n.textContent = String(value ?? '');
      return n;
    };
    const normalise = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es');
    const validDoi = doi => typeof doi === 'string' && /^10\.\d{4,9}\/[^\s\u0000-\u001f\u007f]+$/.test(doi);
    function render() {
      list.replaceChildren();
      const q = normalise(search ? search.value.trim() : '');
      const records = data.filter(x => normalise([x.nombre, x.territorio, x.id, x.nivel].filter(Boolean).join(' ')).includes(q));
      if (!records.length) {
        list.append(create('p', 'empty', data.length
          ? 'Ningún mapa coincide con la búsqueda.'
          : 'Todavía no hay fichas de mapas incorporadas a este catálogo.'));
        return;
      }
      records.forEach(x => {
        const row = create('article', 'catalog-item', '');
        const label = create('div', '', '');
        label.append(create('strong', '', x.nombre || x.id || 'Mapa'));
        label.append(create('small', '', [x.territorio, x.version ? 'Versión ' + x.version : '', x.fecha].filter(Boolean).join(' · ')));
        let link;
        if (validDoi(x.doi)) {
          link = create('a', 'doi-anchor', x.doi);
          link.href = 'https://doi.org/' + encodeURIComponent(x.doi).replace(/%2F/gi, '/');
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        } else {
          link = create('span', 'doi-anchor', 'DOI pendiente de incorporar');
        }
        row.append(label, link);
        list.append(row);
      });
    }
    if (search) search.addEventListener('input', render, {signal});
    render();
  }
  window.DDDInit = init;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => init(), {once: true});
  else init();
})();

</script>
<script>

(function () {
  'use strict';
  const root = document.getElementById('ddd-app');
  const pages = {"inicio":{"title":"Diputado de Distrito | Portada","description":"Diputado de Distrito: presentación de un proyecto de estudio de la representación y el sistema electoral en España. Consulta el visor y la investigación verificable.","bodyClass":""},"comprender":{"title":"Comprender | Diputado de Distrito","description":"","bodyClass":""},"registro":{"title":"Auditoría y registro | Diputado de Distrito","description":"","bodyClass":""}};
  const anchors = { investigacion: 'inicio', 'sobre-autor': 'registro', juridica: 'registro' };
  let activeView = null;
  let renderedURL = null;

  function decoded(value) {
    try { return decodeURIComponent(value); } catch (_) { return value; }
  }
  function route(hash) {
    const value = (hash || '').replace(/^#/, '');
    const slash = value.indexOf('/');
    const head = decoded(slash < 0 ? value : value.slice(0, slash));
    const tail = slash < 0 ? '' : decoded(value.slice(slash + 1));
    if (Object.prototype.hasOwnProperty.call(pages, head)) return { view: head, anchor: tail };
    if (Object.prototype.hasOwnProperty.call(anchors, head)) return { view: anchors[head], anchor: head };
    return { view: 'inicio', anchor: '' };
  }
  function saveScroll() {
    try {
      history.replaceState(Object.assign({}, history.state || {}, {
        dddScroll: window.scrollY
      }), '', location.href);
    } catch (_) { /* Algunos visores restringen history sobre archivos locales. */ }
  }
  function position(view, restore) {
    requestAnimationFrame(function () {
      const target = view.anchor ? document.getElementById(view.anchor) : null;
      const hasSaved = restore && history.state && Number.isFinite(history.state.dddScroll);
      if (hasSaved) {
        window.scrollTo({ top: history.state.dddScroll, left: 0, behavior: 'instant' });
      } else if (target) {
        target.scrollIntoView({ block: 'start', behavior: 'instant' });
      } else {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      }
    });
  }
  function render(options) {
    const settings = options || {};
    const view = route(location.hash);
    const changed = activeView !== view.view;
    if (changed) {
      const template = document.getElementById('ddd-view-' + view.view);
      root.replaceChildren(template.content.cloneNode(true));
      document.body.className = pages[view.view].bodyClass || '';
      document.title = pages[view.view].title;
      const description = document.querySelector('meta[name="description"]');
      if (description) description.content = pages[view.view].description || '';
      activeView = view.view;
      if (typeof window.DDDInit === 'function') window.DDDInit(root);
      if (settings.focus) {
        const heading = root.querySelector('main h1, h1');
        if (heading) {
          const hadIndex = heading.hasAttribute('tabindex');
          if (!hadIndex) heading.setAttribute('tabindex', '-1');
          heading.focus({ preventScroll: true });
          if (!hadIndex) heading.addEventListener('blur', function () {
            heading.removeAttribute('tabindex');
          }, { once: true });
        }
      }
      document.dispatchEvent(new CustomEvent('ddd:route', { detail: view }));
    }
    renderedURL = location.href;
    position(view, Boolean(settings.restore));
  }
  document.addEventListener('click', function (event) {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey ||
        event.shiftKey || event.altKey) return;
    const link = event.target instanceof Element ? event.target.closest('a[href]') : null;
    if (!link || !root.contains(link) || link.hasAttribute('download') ||
        (link.target && link.target !== '_self')) return;
    const href = link.getAttribute('href');
    if (!href || href.charAt(0) !== '#') return;
    event.preventDefault();
    saveScroll();
    if (location.hash !== href) {
      try {
        history.pushState({ dddScroll: 0 }, '', href);
      } catch (_) {
        location.hash = href;
        return;
      }
    }
    render({ focus: true });
  });
  window.addEventListener('popstate', function () { render({ restore: true, focus: true }); });
  window.addEventListener('hashchange', function () {
    if (renderedURL !== location.href) render({ focus: true });
  });
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  render({ restore: true });
})();

</script>
