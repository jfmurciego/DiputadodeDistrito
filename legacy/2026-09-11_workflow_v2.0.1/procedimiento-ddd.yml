# PROYECTO: Diputado de Distrito
# VERSIÓN: 2.0.1
# NOMBRE DE VERSIÓN: Ejecución modular con caché separada
# FECHA: 2026-09-11
# ESTADO: candidato
# ANTERIOR: legacy/2026-09-11_github_pre_modulos/.github/workflows/run-ddd.yml
name: Procedimiento DDD — Aragón

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        type: choice
        required: true
        default: iterativo
        options: [iterativo, completo]

permissions:
  contents: read

jobs:
  ejecutar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Restaurar base preparada
        id: cache-base
        uses: actions/cache@v4
        with:
          path: .cache/ddd/base
          key: ddd-aragon-base-${{ hashFiles('inputs/MANIFEST.sha256', 'modulos/01_preparar_base_territorial.py', 'modulos/02_construir_adyacencias.py', 'modulos/03_construir_grafo.py', 'ddd_core/config.py', 'configuracion/aragon_2025.yaml') }}

      - name: Verificar entrada electoral
        shell: bash
        run: |
          set -euo pipefail
          test -f inputs/rtve_aragon_2026_secciones.json || { echo "Falta inputs/rtve_aragon_2026_secciones.json"; exit 20; }

      - name: Verificar fuentes de base cuando sean necesarias
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for f in inputs/seccionado_2025.zip inputs/65034.csv.zip; do
            test -f "$f" || { echo "Falta $f"; exit 20; }
          done
          test ! -f inputs/MANIFEST.sha256 || sha256sum -c inputs/MANIFEST.sha256

      - name: Construir entorno reproducible
        run: docker build --pull -t ddd:${{ github.sha }} .

      - name: Ejecutar procedimiento
        shell: bash
        run: |
          mkdir -p output .cache/ddd/base
          docker run --rm \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            -e DDD_MODO="${{ inputs.modo }}" \
            -e DDD_PARAMS="configuracion/aragon_2025.yaml" \
            -v "$PWD/output:/app/output" \
            -v "$PWD/.cache/ddd:/app/.cache/ddd" \
            ddd:${GITHUB_SHA}

      - name: Guardar resultados y trazabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddd-aragon-${{ github.run_id }}-${{ github.sha }}
          path: output/**
          if-no-files-found: warn
          retention-days: 90
