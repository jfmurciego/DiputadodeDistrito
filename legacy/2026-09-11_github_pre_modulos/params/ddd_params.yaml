# ddd_params.yaml — contrato único para TODO el pipeline (Steps 1..8)
# Paths relativos resueltos contra io.project_root.path.
# Steps 4 y 5 son baseline recuperado; las mejoras algorítmicas se versionan aparte.

meta:
  run_name: aragon_2025
  year: 2025
  scope: provincial

io:
  project_root:
    path: ..
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ""
      section_key_col: CUSEC
    population_cip:
      paths:
        - inputs/65034.csv.zip
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: ["Total"]
        edad_total_values: ["Todas las edades"]
    comarcas:
      enabled: false
      path: inputs/comarcas_aragon.csv
      join:
        comarcas_key_col: MUN_KEY
  output:
    dir: output

steps:
  step1_build_sections:
    province_codes: [22, 44, 50]
    drop_missing_population: false
    out_geojson: output/{run_name}_step1_secciones_population.geojson.zip
    out_report: output/{run_name}_step1_report.json
  step2_export_edges:
    in_geojson: output/{run_name}_step1_secciones_population.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: output/{run_name}_step2_edges.jsonl
    predicate: touches
    min_shared_border_m: 0.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 50
    log_every: 10000
  step3_build_graph:
    in_geojson: output/{run_name}_step1_secciones_population.geojson.zip
    in_edges_jsonl: output/{run_name}_step2_edges.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_{year}
    out_graph_json: output/{run_name}_step3_graph.json
    out_report: output/{run_name}_step3_report.json
  step4_seed_districts:
    in_graph_json: output/{run_name}_step3_graph.json
    in_geojson: output/{run_name}_step1_secciones_population.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_{year}
    k_districts: 67
    seed: 12345
    out_geojson: output/{run_name}_step4_seed_districts.geojson.zip
    out_report: output/{run_name}_step4_report.json
  step5_optimize_swaps:
    in_graph_json: output/{run_name}_step3_graph.json
    in_geojson: output/{run_name}_step4_seed_districts.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_{year}
    district_field: district_id
    iters: 20000
    seed: 12345
    out_geojson: output/{run_name}_step5_optimized_districts.geojson.zip
    out_report: output/{run_name}_step5_report.json
  step6_export_final:
    in_geojson: output/{run_name}_step5_optimized_districts.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_{year}
    out_summary_csv: output/{run_name}_step6_district_summary.csv
    out_geojson: output/{run_name}_step6_sections.geojson.zip
    out_district_geojson: output/{run_name}_step6_districts.geojson.zip
    expected_districts: 67
    strict_expected_k: true
  step7_elections:
    in_geojson: output/{run_name}_step6_sections.geojson.zip
    section_id_field: CUSEC_KEY
    district_field: district_id
    results_files:
      - inputs/rtve_aragon_2026_secciones.json
    csv_sep: auto
    party_col: PARTIDO
    votes_col: VOTOS
    json_rtve_enabled: true
    json_rtve_zonas_path: mapa.zonas
    json_rtve_section_field: cod
    json_rtve_party_list_field: lp
    json_rtve_party_field: s
    json_rtve_votes_field: v
    blocs:
      PP: derecha
      VOX: derecha
      SALF: derecha
      PSOE: izquierda
      "IU- MOVIMIENTO SUMAR": izquierda
      CHA: izquierda
      PAR: centro
      EXISTE: otros
      "PODEMOS -AV": izquierda
    out_district_party_csv: output/{run_name}_step7_district_party_results.csv
    out_district_summary_csv: output/{run_name}_step7_district_summary_results.csv
    out_sections_enriched_geojson: output/{run_name}_step7_sections_with_results.geojson.zip
  step8_join_results:
    in_district_geojson: output/{run_name}_step6_districts.geojson.zip
    in_district_summary_csv: output/{run_name}_step7_district_summary_results.csv
    out_districts_with_results_geojson: output/{run_name}_step8_districts_results.geojson.zip

validation:
  population_floor_ratio: 0.80
  population_cap_ratio: 1.75
  expected_districts: 67
  require_graph_contiguity: true
