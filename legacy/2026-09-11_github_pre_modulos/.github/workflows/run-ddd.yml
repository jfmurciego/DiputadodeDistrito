name: DDD Aragón Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ddd:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify required inputs
        shell: bash
        run: |
          set -euo pipefail
          for f in inputs/seccionado_2025.zip inputs/65034.csv.zip inputs/rtve_aragon_2026_secciones.json; do
            test -f "$f" || { echo "Missing $f"; exit 20; }
          done
          if test -f inputs/MANIFEST.sha256; then
            sha256sum -c inputs/MANIFEST.sha256
          fi

      - name: Build deterministic runtime image
        run: docker build --pull -t ddd:${{ github.sha }} .

      - name: Run pipeline end-to-end
        shell: bash
        run: |
          mkdir -p output
          docker run --rm \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            -v "$PWD/output:/app/output" \
            ddd:${GITHUB_SHA}

      - name: Upload outputs, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddd-aragon-${{ github.run_id }}
          path: |
            output/**
          if-no-files-found: warn
          retention-days: 30
