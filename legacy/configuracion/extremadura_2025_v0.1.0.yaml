# PROYECTO: Diputado de Distrito
# TERRITORIO: Extremadura
# VERSIÓN: 0.1.0
# NOMBRE DE VERSIÓN: Inventario territorial M01
# FECHA: 2026-09-11
# ESTADO: inventario — no habilita distritación
# QUÉ HACE: define únicamente la extracción reproducible de las secciones censales y población 2025 de Badajoz y Cáceres desde las fuentes nacionales ya versionadas.
# CAMBIOS: primer contrato del tercer territorio; limita deliberadamente el alcance a M01 y no fija K, reparto, tolerancias ni reglas municipales.
# MOTIVO: medir portabilidad real del motor sin copiar prematuramente decisiones de Aragón o Castilla y León.
# ANTERIOR: ninguno — primer contrato Extremadura.

meta:
  procedure_name: Diputado de Distrito
  territory_id: extremadura
  territory: Extremadura
  run_name: extremadura_2025
  year: 2025
  scope: provincial
  schema_version: 0.1.0
  status: inventory_m01

io:
  project_root: {path: ../../..}
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
  cache: {dir: "territorios/extremadura/.cache/ddd/preparacion/{run_name}"}

territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['06','10']
  status: inventory_only
  notes:
    - EXT-01 no adopta K ni coeficientes territoriales de otros casos.
    - M01 debe probar primero que las fuentes nacionales cubren Extremadura sin pérdidas ni transformaciones específicas.

modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['06','10']
    drop_missing_population: false
    out_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"

validation:
  expected_province_codes: ['06','10']
  require_unique_section_id: true
  require_non_null_population: true
