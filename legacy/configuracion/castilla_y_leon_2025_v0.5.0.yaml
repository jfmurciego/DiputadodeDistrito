# PROYECTO: Diputado de Distrito
# TERRITORIO: Castilla y León
# VERSIÓN: 0.5.0
# NOMBRE DE VERSIÓN: Grafo provincial continuo con puentes topológicos explícitos
# FECHA: 2026-09-11
# ESTADO: candidato CYL-02
# QUÉ HACE: prepara M01-M03 y declara la mínima reparación topológica necesaria para que cada provincia sea conectable sin cruzar barreras provinciales.
# CAMBIOS: añade seis puentes auditables: cuatro componentes administrativos/exclaves y dos huecos cartográficos de Burgos.
# MOTIVO: hacer compatibles contigüidad y provincia infranqueable sin buffers globales ni excepciones hardcodeadas en el motor.
# ANTERIOR: legacy/configuracion/castilla_y_leon_2025_v0.4.0.yaml

meta:
  procedure_name: Diputado de Distrito
  territory_id: castilla_y_leon
  territory: Castilla y León
  run_name: castilla_y_leon_2025
  year: 2025
  scope: provincial
  schema_version: 0.5.0
  status: preparation_m03

io:
  project_root: {path: ../../..}
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
    comarcas:
      enabled: false
      path: territorios/castilla_y_leon/inputs/COMARCAS_OPCIONAL.csv
      join: {comarcas_key_col: MUN_KEY}
  cache: {dir: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}"}
  runs: {dir: "territorios/castilla_y_leon/resultados/ejecuciones/{run_id}"}

territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['05','09','24','34','37','40','42','47','49']
  k_districts: null
  district_apportionment: null
  population_floor_ratio: null
  population_cap_ratio: null
  target_tolerance_ratio: null
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: TODO
  notes:
    - No copiar K, Hamilton, 0.80/1.75/0.12 ni reglas municipales de Aragón sin decisión explícita.
    - M01 aceptado: 3.506 secciones, 2.401.221 habitantes, 0 población ausente.
    - Los puentes topológicos son excepciones explícitas del contrato de conectividad; no alteran geometrías ni fronteras provinciales.

modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['05','09','24','34','37','40','42','47','49']
    drop_missing_population: false
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"
  modulo_02_construir_adyacencias:
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    out_edges_jsonl: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    predicate: touches
    min_shared_border_m: 0.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
      - {u: '0910901001', v: '0921904001', edge_type: administrative_enclave, reason: 'Enclave de Treviño enlazado al cuerpo principal de Burgos por la sección burgalesa más próxima (Miranda de Ebro).', source: 'CYL-02 audit'}
      - {u: '0922301001', v: '0941401001', edge_type: cartographic_gap, reason: 'Monasterio de la Sierra: hueco de 758 m en el seccionado hasta Valle de Valdelaguna.', source: 'CYL-02 geometry audit'}
      - {u: '0915401001', v: '0933001001', edge_type: cartographic_gap, reason: 'Hacinas: hueco de 622 m en el seccionado hasta Salas de los Infantes.', source: 'CYL-02 geometry audit'}
      - {u: '3403201001', v: '3413501001', edge_type: administrative_exclave, reason: 'Berzosilla: exclave palentino; enlace mínimo al cuerpo principal de Palencia (Pomar de Valdivia).', source: 'CYL-02 audit'}
      - {u: '3424201001', v: '3412101001', edge_type: administrative_exclave, reason: 'Villodrigo: exclave palentino dentro de Burgos; enlace mínimo a Palenzuela.', source: 'CYL-02 audit'}
      - {u: '4713401001', v: '4718301001', edge_type: administrative_exclave, reason: 'Roales de Campos + Quintanilla del Molar: exclave vallisoletano; enlace mínimo a Valdunquillo.', source: 'CYL-02 audit'}
  modulo_03_construir_grafo:
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    in_edges_jsonl: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    out_graph_json: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json"

validation:
  expected_province_codes: ['05','09','24','34','37','40','42','47','49']
  expected_sections_geometry: 3506
  expected_population_total_2025: 2401221
  expected_topology_bridges: 6
  require_unique_section_id: true
  require_non_null_population: true
  require_graph_contiguity: true
  require_one_graph_component_per_province: true
