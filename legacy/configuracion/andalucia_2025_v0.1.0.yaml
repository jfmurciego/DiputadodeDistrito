# PROYECTO: Diputado de Distrito
# TERRITORIO: Andalucía
# VERSIÓN: 0.1.0
# NOMBRE DE VERSIÓN: Inventario territorial AND-01
# FECHA: 2026-09-11
# ESTADO: preparación M01 — no habilita distritación
# QUÉ HACE: filtra las ocho provincias andaluzas desde las fuentes nacionales versionadas y prepara secciones censales con población 2025.
# CAMBIOS: primera configuración de Andalucía; deliberadamente no define M02+, K operativo ni coeficientes de distritación.
# MOTIVO: medir primero la portabilidad y el volumen real del mayor territorio poblacional del programa antes de introducir decisiones algorítmicas.
# ANTERIOR: ninguno — primera versión del territorio.

meta:
  procedure_name: Diputado de Distrito
  territory_id: andalucia
  territory: Andalucía
  run_name: andalucia_2025
  year: 2025
  scope: provincial
  schema_version: 0.1.0
  status: inventory_m01

io:
  project_root: {path: ../../..}
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
  cache: {dir: "territorios/andalucia/.cache/ddd/preparacion/{run_name}"}

territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['04','11','14','18','21','23','29','41']
  status: inventory_only
  notes:
    - AND-01 usa exclusivamente las fuentes nacionales ya reconstruibles desde GitHub.
    - La fuente normativa verificada registra K institucional 109, pero esta primera ejecución no lo usa para distritar.
    - No se heredan tolerancias, suelo, techo, atomicidad ni pasarelas de Aragón, Castilla y León o Extremadura.
    - El resultado de M01 fijará recuentos y población observados antes de abrir la auditoría topológica.

modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['04','11','14','18','21','23','29','41']
    drop_missing_population: false
    out_geojson: "territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"

validation:
  expected_province_codes: ['04','11','14','18','21','23','29','41']
  require_unique_section_id: true
  require_non_null_population: true
  province_field: CPRO
  municipality_field: CUMUN
  municipality_name_field: NMUN
