# PROYECTO: Diputado de Distrito
# TERRITORIO: Extremadura
# VERSIÓN: 0.5.0
# NOMBRE DE VERSIÓN: Contrato reproducible c020 F1.4
# FECHA: 2026-09-12
# ESTADO: candidato F1.4 — M01-M06 experimental
# QUÉ HACE: conserva M01-M03 y declara explícitamente K=65, reparto 41/24, c020, atomicidad 1.10 y ratios 0.85/1.50/0.10 para reproducir M04-M06.
# CAMBIOS: eleva al YAML el contrato experimental antes inyectado por workflows; añade M04-M06 y rutas de evidencia sin promover la solución.
# MOTIVO: cerrar la deuda de reproducibilidad de Extremadura y decidir su promoción mediante una ejecución canónica.
# ANTERIOR: legacy/configuracion/extremadura_2025_v0.4.0.yaml

meta:
  procedure_name: Diputado de Distrito
  territory_id: extremadura
  territory: Extremadura
  run_name: extremadura_2025
  year: 2025
  scope: provincial
  schema_version: 0.5.0
  status: experimental_m01_m06_candidate

io:
  project_root: {path: ../../..}
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
  cache: {dir: "territorios/extremadura/.cache/ddd/preparacion/{run_name}"}
  runs: {dir: "territorios/extremadura/resultados/ejecuciones/{run_id}"}

territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['06','10']
  k_districts: 65
  district_apportionment: hamilton
  population_floor_ratio: 0.85
  population_cap_ratio: 1.50
  target_tolerance_ratio: 0.10
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: internal_connected_chunks_c020
  municipality_atomicity_limit_ratio: 1.10
  internal_partition_chunk_ratio: 0.20
  require_auditable_district_catalogue: true
  promotion_status: experimental
  notes:
    - K=65 y el reparto Hamilton 41 Badajoz / 24 Cáceres son el contrato territorial evaluado.
    - Los ratios 0.85/1.50/0.10 son los del candidato tight que hizo factible M04; son más estrictos que Aragón y Castilla y León y no se heredan de ellos.
    - La atomicidad 1.10 identifica municipios que requieren partición interna; c020 forma unidades conexas con objetivo aproximado de 0.20×target.
    - EXT-19 fue diagnóstico dirigido, no un operador general ni una solución aplicada; queda fuera del contrato canónico.
    - La promoción exige M01-M06 con K, cuotas, contigüidad, hard y tolerancia completa. Si falla, la salida se conserva como bloqueo reproducible.

partitioning:
  strategy: connected_internal_units
  partition_unit_field: M04_PARTITION_UNIT
  atomicity_ratio: 1.10
  chunk_ratio: 0.20
  source: c020

modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['06','10']
    drop_missing_population: false
    out_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"
  modulo_02_construir_adyacencias:
    in_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    out_edges_jsonl: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
      - u: '0604405005'
        v: '0604405003'
        edge_type: administrative_bridge
        reason: 'Componente censal físicamente separada de Don Benito; enlace al nodo del mismo municipio más próximo auditado (~2074 m).'
        source: 'EXT-02 auditoría geométrica reproducible'
      - u: '0604405006'
        v: '0604405004'
        edge_type: administrative_bridge
        reason: 'Componente censal físicamente separada de Don Benito; enlace al nodo del mismo municipio más próximo auditado (~869 m).'
        source: 'EXT-02 auditoría geométrica reproducible'
  modulo_03_construir_grafo:
    in_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    in_edges_jsonl: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    out_graph_json: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    out_report: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json"
  modulo_04_generar_semillas:
    in_graph_json: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    in_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m04_input.geojson"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    province_field: CPRO
    municipality_field: M04_PARTITION_UNIT
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 65
    municipality_atomicity_limit_ratio: 1.10
    seed: 12345
    out_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m04.geojson.zip"
    out_report: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m04_report.json"
  modulo_05_optimizar_distritos:
    in_graph_json: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    in_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m04_polished.geojson.zip"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 30000
    swap_polish_max: 200
    seed: 12345
    out_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m05.geojson.zip"
    out_report: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m05_report.json"
  modulo_06_consolidar_distritos:
    in_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m05.geojson.zip"
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: "POP_{year}"
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 65
    strict_expected_k: true
    out_summary_csv: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m06_resumen_distritos.csv"
    out_catalog_csv: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m06_catalogo_distritos.csv"
    out_composition_csv: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m06_composicion_distritos.csv"
    out_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m06_secciones.geojson.zip"
    out_district_geojson: "territorios/extremadura/.cache/ddd/preparacion/{run_name}/c020/m06_distritos.geojson.zip"

validation:
  expected_province_codes: ['06','10']
  expected_sections_geometry: 964
  expected_population_total_2025: 1053345
  expected_districts: 65
  population_floor_ratio: 0.85
  population_cap_ratio: 1.50
  target_tolerance_ratio: 0.10
  province_apportionment: hamilton
  province_districts: {'06': 41, '10': 24}
  require_unique_section_id: true
  require_non_null_population: true
  province_field: CPRO
  municipality_field: CUMUN
  municipality_name_field: NMUN
  require_one_graph_component_per_province: true
  require_connected_municipalities: true
  require_single_province_per_district: true
  require_graph_contiguity: true
  require_municipality_discipline: true
  municipality_atomicity_limit_ratio: 1.10
  max_mixed_districts_per_split_municipality: 1
  require_zero_outside_tolerance_after_m05: true
  require_m06_population_conservation: true
  require_m06_assignment_identity_with_m05: true
