# PROYECTO: Diputado de Distrito
# COMPONENTE: catálogo de fuentes oficiales
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Catálogo declarativo INE
# FECHA: 2026-09-17
# ESTADO: candidato
# FUNCIÓN: describir las fuentes oficiales reutilizables sin lógica territorial.
# CAMBIOS: extrae endpoints, formatos y reglas de consulta fuera de cualquier territorio.
# MOTIVO: desacoplar adquisición oficial de Aragón y habilitar evaluación territorial genérica.
# ANTERIOR: fuentes/normativa/extremadura_sistema_electoral_2026.md
schema: ddd-official-source-catalog/1.0
sources:
  poblacion_por_sexo_y_edad:
    business_name: Población por sexo y edad
    provider: Instituto Nacional de Estadística
    provider_abbreviation: INE
    kind: static_csv
    edition_policy: annual
    format: csv
    url: https://www.ine.es/jaxiT3/files/t/csv_bdsc/65034.csv
    output_name: poblacion_por_sexo_y_edad.csv
    provenance_required: true
  secciones_censales:
    business_name: Secciones censales
    provider: Instituto Nacional de Estadística
    provider_abbreviation: INE
    kind: ogc_features
    edition_policy: annual
    format: geojson
    collection_template: WMS_INE_SECCIONES_G01:Secciones_{edition}
    endpoint_template: https://www.ine.es/geoserver/ogc/features/v1/collections/WMS_INE_SECCIONES_G01%3ASecciones_{edition}/items
    territorial_filter_field: CPRO
    feature_filter: "TIPO='SECCION'"
    section_id_field: CUSEC
    output_name: secciones_censales_{edition}.geojson
    provenance_required: true
