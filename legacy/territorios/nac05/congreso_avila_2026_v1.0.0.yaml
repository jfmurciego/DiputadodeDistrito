# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0 · FECHA: 2026-11-11 · ESTADO: candidato (sin generación)
# QUÉ ES: contrato M01-M06 de la edición 2026 (legislatura de la elección general del 29-11-2026) con la pareja
#   INE 2025/2025 (configuracion/decisiones/congreso_referencia_territorial_2025_2026.json; D-65, D-80).
#   Materializado en local por la ruta de producción (adquisición OGC Secciones_2025 + 65034 de inputs/partes y
#   herramientas/materializar_contrato_generacion.py); package_sha256 es el del paquete local: lo sustituye la 01.
# ANTERIOR: ninguna (fichero nuevo)
