    out_report: territorios/congreso_avila/.cache/ddd/preparacion/{run_name}/congreso_avila_2026_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/congreso_avila/.cache/ddd/preparacion/{run_name}/congreso_avila_2026_m05_distritos_optimizados.geojson.zip
