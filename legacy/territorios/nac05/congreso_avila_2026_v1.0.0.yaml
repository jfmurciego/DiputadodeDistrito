  admin_level_2_role: municipality
  province_codes: &id001
  - '05'
  k_districts: 1
  k_source: formula
  k_rationale: 'Congreso: K=1 es la cuota de Ávila (CPRO 05) en N06-OWNER-20261012-K, con
    K_i igual al mayor entre 1 y la parte entera de (P_i + 60.000) entre 120.000, y K2025
    = 407.'
