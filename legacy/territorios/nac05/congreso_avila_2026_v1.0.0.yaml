    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 1
    municipality_atomicity_limit_ratio: 1.15
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/congreso_avila/.cache/ddd/preparacion/{run_name}/congreso_avila_2026_m04_semillas.geojson.zip
    out_report: territorios/congreso_avila/.cache/ddd/preparacion/{run_name}/congreso_avila_2026_m04_informe.json
  modulo_05_optimizar_distritos:
    in_graph_json: territorios/congreso_avila/.cache/ddd/preparacion/{run_name}/congreso_avila_2026_m03_grafo.json
    in_geojson: territorios/congreso_avila/.cache/ddd/preparacion/{run_name}/congreso_avila_2026_m04_semillas.geojson.zip
