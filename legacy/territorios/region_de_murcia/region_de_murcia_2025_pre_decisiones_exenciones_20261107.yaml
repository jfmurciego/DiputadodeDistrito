  runs:
    dir: territorios/region_de_murcia/resultados/ejecuciones/{run_id}
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - '30'
  status: generation_ready
  notes:
  - R022 congeló 1224 secciones y 1586989 habitantes sin faltantes.
  - R023 justificó 2 pasarelas; no se añade ninguna excepción no auditada.
  - K y M04 permanecen pendientes.
  k_districts: 45
  k_source: norma
  k_rationale: K=45 conserva el tamaño vigente de la Asamblea Regional de Murcia como
    regla institucional ex ante.
  k_reference_scope: institutional_or_contractual_reference
  k_reference_source: null
  apportionment_source: ddd_design_policy
  legal_apportionment_reused: false
  legal_apportionment_context: null
  district_apportionment: hamilton
  population_floor_ratio: 0.8
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  limits_profile: standard-1.0.0
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.75
  require_auditable_district_catalogue: true
modulos:
  modulo_01_preparar_base_territorial:
    province_codes:
    - '30'
    drop_missing_population: false
    out_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    out_report: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:25830
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
    - u: '3003008005'
      v: '3003008002'
      admin_scope: municipality:30030
      edge_type: municipal_discontinuity
      reason: 'Murcia: componente censal municipal separada; enlace intramunicipal
        mínimo auditado (~1698 m).'
      source: R023 run 34688393979
    - u: '3003501007'
      v: '3003501005'
      admin_scope: municipality:30035
      edge_type: municipal_discontinuity
      reason: 'San Javier: componente municipal separada; enlace intramunicipal mínimo
        auditado (~3179 m).'
      source: R023 run 34688393979
  modulo_03_construir_grafo:
    in_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_2023
    out_graph_json: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    out_report: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 45
    municipality_atomicity_limit_ratio: 1.75
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m04_semillas.geojson.zip
    out_report: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m04_informe.json
  modulo_05_optimizar_distritos:
    population_repair:
      enabled: true
      strategy: private_annealing
      seed: 0
      max_candidates: 5000000
      max_seconds: 600.0
    in_graph_json: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2023
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 45
    strict_expected_k: true
    out_summary_csv: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m06_resumen_distritos.csv
    out_catalog_csv: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m06_catalogo_distritos.csv
    out_composition_csv: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m06_composicion_distritos.csv
    out_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m06_secciones.geojson.zip
    out_district_geojson: territorios/region_de_murcia/.cache/ddd/preparacion/{run_name}/region_de_murcia_2025_m06_distritos.geojson.zip
