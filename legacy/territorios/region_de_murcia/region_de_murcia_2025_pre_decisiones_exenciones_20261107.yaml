meta:
  procedure_name: Diputado de Distrito
  territory_id: region_de_murcia
  territory: Región de Murcia
  run_name: region_de_murcia_2025
  year: 2025
  scope: provincial
  schema_version: 1.0.0
  status: generation_ready
  schema_family: ddd-territory
  contract_level: production_m01_m06
  contract_schema_version: 1.0.0
  production_authorization: AUTHORIZED
  source_population_year: 2023
  source_section_year: 2023
io:
  project_root:
    path: ../../..
  input:
    seccionado:
      path: inputs/seccionado_2023.zip
      layer: ''
      section_key_col: CUSEC
      container: zip
      materialized_format: shapefile
      archive_member: ''
    population_cip:
      paths:
      - inputs/65034.csv.zip
      sep: ;
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
