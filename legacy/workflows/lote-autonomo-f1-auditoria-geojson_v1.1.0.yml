# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.1.0
# NOMBRE: Lote autónomo F1 — auditoría y GeoJSON
# ESTADO: preparado; sólo ejecución manual
# QUÉ HACE: ejecuta en paralelo regeneraciones M01–M06 de Aragón y Castilla y León, produce GeoJSON visibles y audita la deuda F1.
# REGLA: cada rama captura su error; el cierre se ejecuta siempre y marca el estado después de recoger todos los resultados.
# CAMBIO: la auditoría extrae y compara explícitamente los tres contratos territoriales.
name: Lote autónomo F1 — auditoría y GeoJSON
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  aragon_geojson:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Aragón M01-M06 y GeoJSON
        shell: bash
        run: |
          set +e
          mkdir -p lote/aragon .cache/ddd/preparacion ejecuciones/lote-aragon-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-lote-aragon:$GITHUB_SHA .
          docker run --rm -e PARAMS=territorios/aragon/config/aragon_2025.yaml -e DDD_RUN_ID=lote-aragon-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/.cache/ddd:/app/.cache/ddd" -v "$PWD/ejecuciones:/app/ejecuciones" --entrypoint bash ddd-lote-aragon:$GITHUB_SHA -lc 'set -e; for n in 01_preparar_base_territorial 02_construir_adyacencias 03_construir_grafo 04_generar_semillas 05_optimizar_distritos 06_consolidar_distritos; do python modulos/$n.py --params "$PARAMS"; done'
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import os,pathlib,zipfile
          b=pathlib.Path("ejecuciones")/("lote-aragon-"+os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]);o=pathlib.Path("lote/aragon")
          for s,t in [("aragon_2025_m06_distritos.geojson.zip","aragon_distritos.geojson"),("aragon_2025_m06_secciones.geojson.zip","aragon_secciones.geojson")]:
            with zipfile.ZipFile(b/s) as z:o.joinpath(t).write_bytes(z.read(next(x for x in z.namelist() if x.endswith(".geojson"))))
          PY
          fi
          printf '{"territorio":"aragon","exit_code":%s}\n' "$rc" > lote/aragon/estado.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: lote-aragon, path: lote/aragon/}

  cyl_geojson:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - name: Castilla y León M01-M06 y GeoJSON
        shell: bash
        run: |
          set +e
          mkdir -p lote/castilla_y_leon
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-lote-cyl:$GITHUB_SHA .
          docker run --rm -e PARAMS=territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/castilla_y_leon:/app/territorios/castilla_y_leon" --entrypoint bash ddd-lote-cyl:$GITHUB_SHA -lc 'set -e; for n in 01_preparar_base_territorial 02_construir_adyacencias 03_construir_grafo 04_generar_semillas 05_optimizar_distritos 06_consolidar_distritos; do python modulos/$n.py --params "$PARAMS"; done'
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY'
          import pathlib,zipfile
          b=pathlib.Path("territorios/castilla_y_leon/.cache/ddd/preparacion/castilla_y_leon_2025");o=pathlib.Path("lote/castilla_y_leon")
          for s,t in [("castilla_y_leon_2025_m06_distritos.geojson.zip","castilla_y_leon_distritos.geojson"),("castilla_y_leon_2025_m06_secciones.geojson.zip","castilla_y_leon_secciones.geojson")]:
            with zipfile.ZipFile(b/s) as z:o.joinpath(t).write_bytes(z.read(next(x for x in z.namelist() if x.endswith(".geojson"))))
          PY
          fi
          printf '{"territorio":"castilla_y_leon","exit_code":%s}\n' "$rc" > lote/castilla_y_leon/estado.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: lote-cyl, path: lote/castilla_y_leon/}

  auditoria_f1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Auditar deuda conocida
        shell: bash
        run: |
          set +e
          mkdir -p lote/auditoria
          python3 - <<'PY'
          import csv,json,pathlib,statistics
          r=pathlib.Path(".");out={"findings":[],"contracts":{},"compactness":{},"margins":{}}
          for k,p in [("aragon",r/"territorios/aragon/config/aragon_2025.yaml"),("castilla_y_leon",r/"territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml"),("extremadura",r/"territorios/extremadura/config/extremadura_2025.yaml")]:
            lines=p.read_text(encoding="utf-8").splitlines()
            out["contracts"][k]={x.strip().split(":",1)[0]:x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith(("population_floor_ratio:","population_cap_ratio:","target_tolerance_ratio:","municipality_atomicity_limit_ratio:"))}
          a=r/"resultados/ejecuciones";b=r/"territorios/aragon/resultados/ejecuciones"
          if a.exists() and b.exists():
            common={p.relative_to(a) for p in a.rglob("*") if p.is_file()} & {p.relative_to(b) for p in b.rglob("*") if p.is_file()}
            out["findings"].append({"id":"duplicate_root_aragon_evidence","files":len(common),"equal":sum((a/p).read_bytes()==(b/p).read_bytes() for p in common)})
          for k,p,pop,n,cap in [("aragon",r/"territorios/aragon/resultados/ejecuciones/gh-34599224954-1/M06/catalogo_distritos.csv",1364621,67,1.75),("castilla_y_leon",r/"territorios/castilla_y_leon/resultados/ejecuciones/gh-34701897922-1/M06/catalogo_distritos.csv",2401221,82,1.75),("extremadura",r/"territorios/extremadura/resultados/ejecuciones/gh-34703213474-1/M06/catalogo_distritos.csv",1053345,65,1.50)]:
            rows=list(csv.DictReader(p.open(encoding="utf-8")));q=[float(x["polsby_popper"]) for x in rows];d=[float(x["district_pop"]) for x in rows]
            out["compactness"][k]={"median":statistics.median(q),"minimum":min(q),"below_0_15":sum(x<.15 for x in q)}
            out["margins"][k]={"hard_cap":pop/n*cap,"max_district_pop":max(d),"margin_to_cap":pop/n*cap-max(d)}
          pathlib.Path("lote/auditoria/AUDITORIA_F1.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          rc=$?
          printf '{"component":"auditoria_f1","exit_code":%s}\n' "$rc" > lote/auditoria/estado.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: lote-auditoria, path: lote/auditoria/}

  cierre:
    if: always()
    needs: [aragon_geojson, cyl_geojson, auditoria_f1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with: {pattern: lote-*, path: lote-recibido}
      - name: Resumir y persistir todo
        shell: bash
        run: |
          set +e
          mkdir -p lote-final
          find lote-recibido -name estado.json -exec cat {} \; | tee lote-final/ESTADOS.txt
          python3 - <<'PY'
          import json,pathlib,os
          s=[]
          for p in pathlib.Path("lote-recibido").rglob("estado.json"):
            s.append(json.loads(p.read_text()))
          pathlib.Path("lote-final/RUN_SUMMARY.json").write_text(json.dumps({"run_id":os.environ["GITHUB_RUN_ID"],"statuses":s},ensure_ascii=False,indent=2))
          PY
          dest=resultados/lotes_autonomos/gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          mkdir -p "$dest"; cp -R lote-recibido lote-final "$dest/"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"; git diff --cached --quiet || git commit -m "data: lote autónomo F1 $GITHUB_RUN_ID"; git push
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: lote-f1-completo, path: lote-final/}
      - name: Fallar sólo después de terminar todo
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open("lote-final/RUN_SUMMARY.json"))
          raise SystemExit(1 if any(int(x.get("exit_code",1)) for x in s["statuses"]) else 0)
          PY
