# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Migración única de gobernanza R015
# FECHA: 2026-09-11
# ESTADO: temporal de un solo uso
# QUÉ HACE: ejecuta la migración R015 que archiva versiones activas, normaliza cabeceras y actualiza la trazabilidad; después se auto-retira.
# CAMBIOS: primera y única versión.
# MOTIVO: aplicar cambios mecánicos sobre cuerpos de código ya validados sin reescribirlos manualmente.
# ORIGEN: R015
name: R015 — Migración de gobernanza
on:
  push:
    branches: [main]
    paths:
      - herramientas/r015_patch_components.py
      - .github/workflows/r015-migracion.yml
permissions:
  contents: write
jobs:
  migrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ejecutar migración R015
        run: python herramientas/r015_patch_components.py
      - name: Comprobar y publicar migración
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "R015 no produjo cambios"; exit 1; }
          git commit -m "R015: normalize headers and preserve active predecessors"
          git pull --rebase origin main
          git push origin HEAD:main
