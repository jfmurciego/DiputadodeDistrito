# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.1.0
# NOMBRE DE VERSIÓN: Resultados ligeros en git
# FECHA: 2026-11-07
# ESTADO: candidato
# QUÉ HACE: cuando cambia orchestracion/publicaciones_visor.json en main, regenera datos/resultados/ (CSV por territorio y
#   MANIFEST.json) con herramientas/resultados_ligeros.py y lo empuja con la app de registro. Si ningún canonical_m08
#   cambió, la herramienta no modifica nada y no hay commit.
# CAMBIOS: 1.1.0: también regenera los votos por partido (resultados_partidos.py) y se dispara al cambiar datos/composicion/MANIFEST.json (T-67). 1.0.0: versión inicial (T-53).
# MOTIVO: los análisis no deben descargar los ZIP M08.
# ANTERIOR: legacy/workflows/resultados-ligeros_v1.0.0_20261107.yml
name: Resultados ligeros
on:
  push:
    branches: [main]
    paths:
      - 'orchestracion/publicaciones_visor.json'
      - 'datos/composicion/MANIFEST.json'
permissions:
  contents: write
concurrency:
  group: ddd-resultados-ligeros
  cancel-in-progress: false
  queue: max
jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Regenerar y empujar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          python herramientas/resultados_ligeros.py
          python herramientas/resultados_partidos.py
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          git add -A datos/resultados
          if git diff --cached --quiet; then echo "Sin cambios en resultados."; exit 0; fi
          git commit -m "datos: resultados ligeros desde canonical_m08"
          for intento in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rechazado (intento $intento)"
            git pull --rebase origin main
          done
          exit 1
