# PROYECTO: Diputado de Distrito
# CLASE: experimental
# VERSIÓN: 1.0.1
# NOMBRE: Prueba causal EXT-03 granular-open M04→M05 — reparación de esquema
# FECHA: 2026-09-11
# ESTADO: diagnóstico; no promovible.
# QUÉ HACE: ejecuta tight granular, elimina el campo OGR defectuoso ddd_unit_id, lo recrea como texto escalar y prueba M05.
# CAMBIOS: drop explícito de ddd_unit_id previo y recreación con lista Python de str; v1.0.0 se preserva en legacy.
# MOTIVO: el primer run no llegó a M05 porque GeoJSON conservó el esquema StringList de ddd_unit_id aunque sus valores se sustituyeran.
# ANTERIOR: legacy/workflows/extremadura-m05-granular-probe_v1.0.0.yml
name: EXT-03 — Prueba granular M04-M05

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  granular-m05:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: {PARAMS: territorios/extremadura/config/extremadura_2025.yaml}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Reconstruir fuentes
        run: bash inputs/partes/reconstruir_fuentes.sh
      - name: Construir entorno
        run: docker build --pull -t ddd-ext-m05:${GITHUB_SHA} .
      - name: Ejecutar M01-M03
        run: |
          set -euo pipefail
          mkdir -p territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext-m05:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'
      - name: Preparar tight granular
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-m05:${GITHUB_SHA} -c '
          import copy,io,json,pathlib,zipfile,yaml
          import geopandas as gpd
          root=pathlib.Path("/app");base=root/"territorios/extremadura/.cache/ddd/preparacion/extremadura_2025"
          cfg=yaml.safe_load((root/"territorios/extremadura/config/extremadura_2025.yaml").read_text())
          with zipfile.ZipFile(base/"extremadura_2025_m01_secciones_poblacion.geojson.zip") as z:
              n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          g["CUMUN"]=g["CUMUN"].astype(str);g["CUSEC_KEY"]=g["CUSEC_KEY"].astype(str);target=int(g.POP_2025.sum())/65
          floor,cap,tol,atomic=.85,1.50,.10,1.10;limit=target*atomic;mp=g.groupby("CUMUN").POP_2025.sum();oversized=set(mp[mp>limit].index.astype(str))
          g["M04_MUN"]=g["CUMUN"];mask=g["CUMUN"].isin(oversized);g.loc[mask,"M04_MUN"]=g.loc[mask,"CUMUN"]+"#"+g.loc[mask,"CUSEC_KEY"]
          geo=base/"extremadura_2025_m04_input_tight.geojson";g.to_file(geo,driver="GeoJSON")
          c=copy.deepcopy(cfg);c["meta"]["status"]="ext03_granular_m05_probe";c.setdefault("modulos",{})["modulo_04_generar_semillas"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_input_tight.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_MUN","municipality_name_field":"NMUN","k_districts":65,"municipality_atomicity_limit_ratio":atomic,"seed":12345,"out_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_probe.geojson.zip","out_report":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_probe_informe.json"}
          c["validation"].update({"expected_districts":65,"population_floor_ratio":floor,"population_cap_ratio":cap,"target_tolerance_ratio":tol,"province_districts":{"06":41,"10":24}})
          (root/"territorios/extremadura/config/.generated_ext03_m05.yaml").write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True));(root/"territorios/extremadura/.cache/ddd/probes").mkdir(parents=True,exist_ok=True);(root/"territorios/extremadura/.cache/ddd/probes/ext03_m05_manifest.json").write_text(json.dumps({"oversized":sorted(oversized),"target":target,"atomic_limit":limit},indent=2))'
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd
      - name: M04 base y recrear unidades
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-m05:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params territorios/extremadura/config/.generated_ext03_m05.yaml
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-m05:${GITHUB_SHA} -c '
          import io,pathlib,zipfile,yaml
          import geopandas as gpd
          root=pathlib.Path("/app");base=root/"territorios/extremadura/.cache/ddd/preparacion/extremadura_2025";zp=base/"extremadura_2025_m04_probe.geojson.zip"
          with zipfile.ZipFile(zp) as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          g=g.drop(columns=["ddd_unit_id"],errors="ignore");g["CUSEC_KEY"]=[str(x) for x in g["CUSEC_KEY"]];g["CUMUN"]=[str(x) for x in g["CUMUN"]];g["M04_MUN"]=[str(x) for x in g["M04_MUN"]]
          g["ddd_unit_id"]=[str(p).zfill(2)+":"+str(m)+":G" for p,m in zip(g["CPRO"],g["M04_MUN"])];g["ddd_closed_urban"]=[False]*len(g)
          tmp=base/"repaired.geojson";g.to_file(tmp,driver="GeoJSON");zp.unlink();
          with zipfile.ZipFile(zp,"w",zipfile.ZIP_DEFLATED) as z:z.write(tmp,arcname="repaired.geojson")
          tmp.unlink();cfg=yaml.safe_load((root/"territorios/extremadura/config/.generated_ext03_m05.yaml").read_text());cfg["modulos"]["modulo_05_optimizar_distritos"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_probe.geojson.zip","id_field":"CUSEC_KEY","pop_field":"POP_{year}","district_field":"district_id","province_field":"CPRO","municipality_field":"CUMUN","greedy_moves_limit":1000,"anneal_iters":30000,"seed":12345,"out_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m05_probe.geojson.zip","out_report":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m05_probe_informe.json"};(root/"territorios/extremadura/config/.generated_ext03_m05.yaml").write_text(yaml.safe_dump(cfg,sort_keys=False,allow_unicode=True))'
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd
      - name: Ejecutar M05 y auditar
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-m05:${GITHUB_SHA} modulos/05_optimizar_distritos.py --params territorios/extremadura/config/.generated_ext03_m05.yaml
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-m05:${GITHUB_SHA} -c '
          import io,json,pathlib,zipfile
          import geopandas as gpd
          base=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025");probe=pathlib.Path("/app/territorios/extremadura/.cache/ddd/probes")
          with zipfile.ZipFile(base/"extremadura_2025_m05_probe.geojson.zip") as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          target=g.POP_2025.sum()/65;pops=g.groupby("district_id").POP_2025.sum();splits=g.groupby("CUMUN").district_id.nunique();rep=json.loads((base/"extremadura_2025_m05_probe_informe.json").read_text())
          out={"districts":int(g.district_id.nunique()),"outside_10":int(((pops-target).abs()>target*.10).sum()),"max_abs_deviation":float(((pops-target).abs()/target).max()),"min_pop":int(pops.min()),"max_pop":int(pops.max()),"split_municipalities":{str(k):int(v) for k,v in splits[splits>1].items()},"m05_report":rep};(probe/"ext03_m05_results.json").write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False));assert out["districts"]==65'
      - name: Publicar EXT-03 M05
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT03-M05-${{ github.run_id }}
          path: |
            territorios/extremadura/.cache/ddd/probes/ext03_m05_manifest.json
            territorios/extremadura/.cache/ddd/probes/ext03_m05_results.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m04_probe_informe.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m05_probe_informe.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m05_probe.geojson.zip
