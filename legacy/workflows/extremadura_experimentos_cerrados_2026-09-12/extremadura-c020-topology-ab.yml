# PROYECTO: Diputado de Distrito
# CLASE: experimental
# VERSIÓN: 1.0.0
# NOMBRE: EXT-13 — A/B de un movimiento topológico M04 antes de M05
# FECHA: 2026-09-11
# ESTADO: experimento; no modifica motores activos.
# QUÉ HACE: reproduce c020/M04, audita movimientos topológicos, aplica exactamente el mejor candidato
# guarded_population, mide fragilidad antes/después y ejecuta M05 v7.5.2 sobre la variante resultante.
# MOTIVO: EXT-12 Run 34647432729 encontró 70 movimientos que reducen fragilidad sin aumentar hard, outside
# ni maxdev. Debe comprobarse si una única mejora topológica inicial conduce a un mínimo M05 final mejor.
# ANTERIOR: ninguno — workflow nuevo.
name: EXT-13 — C020 topology A-B

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
      ROOTBASE: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
      BASE: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/ext13
      CFG: territorios/extremadura/config/.generated_ext13_c020.yaml
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-ext13:${GITHUB_SHA} .
      - name: M01-M03
        run: |
          set -euo pipefail
          mkdir -p "$BASE"
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext13:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'
      - name: Construir c020
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} herramientas/construir_unidades_internas_m04.py \
            --geojson "$ROOTBASE/extremadura_2025_m01_secciones_poblacion.geojson.zip" \
            --graph "$ROOTBASE/extremadura_2025_m03_grafo.json" \
            --out-geojson "$BASE/m04_input.geojson" --out-report "$BASE/units_report.json" \
            --k 65 --id-field CUSEC_KEY --municipality-field CUMUN --population-field POP_2025 \
            --partition-unit-field M04_PARTITION_UNIT --atomicity-ratio 1.10 --chunk-ratio 0.20
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd
      - name: Generar configuración
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} -c '
          import copy,pathlib,yaml
          root=pathlib.Path("/app");cfg=yaml.safe_load((root/"territorios/extremadura/config/extremadura_2025.yaml").read_text());c=copy.deepcopy(cfg);base="territorios/extremadura/.cache/ddd/preparacion/{run_name}/ext13"
          c["modulos"]["modulo_04_generar_semillas"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":base+"/m04_input.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_PARTITION_UNIT","municipality_name_field":"NMUN","k_districts":65,"municipality_atomicity_limit_ratio":1.10,"seed":12345,"out_geojson":base+"/m04.geojson.zip","out_report":base+"/m04_report.json"}
          c["modulos"]["modulo_05_optimizar_distritos"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":base+"/m04_topology.geojson.zip","id_field":"CUSEC_KEY","pop_field":"POP_{year}","district_field":"district_id","province_field":"CPRO","municipality_field":"CUMUN","greedy_moves_limit":1000,"anneal_iters":30000,"swap_polish_max":200,"seed":12345,"out_geojson":base+"/m05_topology.geojson.zip","out_report":base+"/m05_topology_report.json"}
          c["validation"].update({"expected_districts":65,"population_floor_ratio":.85,"population_cap_ratio":1.50,"target_tolerance_ratio":.10,"province_districts":{"06":41,"10":24}})
          (root/"territorios/extremadura/config/.generated_ext13_c020.yaml").write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True))'
      - name: M04 + auditoría base
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params "$CFG"
          python herramientas/reparar_propiedad_geojson_zip.py --zip "$BASE/m04.geojson.zip" --property ddd_unit_id --province-field CPRO --unit-field M04_PARTITION_UNIT --suffix P
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} herramientas/auditar_fragilidad_topologica.py --params "$CFG" --geojson "$BASE/m04.geojson.zip" --out "$BASE/fragility_m04_before.json"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} herramientas/auditar_movimientos_topologicos_m04.py --params "$CFG" --geojson "$BASE/m04.geojson.zip" --out "$BASE/topology_moves.json" --top 200
      - name: Aplicar un movimiento topológico
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} herramientas/aplicar_mejor_movimiento_topologico_m04.py \
            --in-geojson "$BASE/m04.geojson.zip" --audit-json "$BASE/topology_moves.json" \
            --out-geojson "$BASE/m04_topology.geojson.zip" --out-report "$BASE/topology_move_applied.json"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} herramientas/auditar_fragilidad_topologica.py --params "$CFG" --geojson "$BASE/m04_topology.geojson.zip" --out "$BASE/fragility_m04_after.json"
      - name: M05 sobre variante topológica
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} modulos/05_optimizar_distritos.py --params "$CFG"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} herramientas/auditar_fragilidad_topologica.py --params "$CFG" --geojson "$BASE/m05_topology.geojson.zip" --out "$BASE/fragility_m05_after.json"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext13:${GITHUB_SHA} -c '
          import io,json,pathlib,zipfile,geopandas as gpd
          b=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/ext13")
          with zipfile.ZipFile(b/"m05_topology.geojson.zip") as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          target=g.POP_2025.sum()/65;p=g.groupby("district_id").POP_2025.sum();rep=json.loads((b/"m05_topology_report.json").read_text());o={"outside_10":int(((p-target).abs()>target*.10).sum()),"max_abs_deviation":float(((p-target).abs()/target).max()),"sq_error":float((((p-target)/target)**2).sum()),"min_pop":int(p.min()),"max_pop":int(p.max()),"accepted_swaps":int((rep.get("swap_polish") or {}).get("accepted_swaps",0))};(b/"summary.json").write_text(json.dumps(o,indent=2));print(json.dumps(o))'
      - name: Publicar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT13-topology-ab-${{ github.run_id }}
          path: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/ext13/
