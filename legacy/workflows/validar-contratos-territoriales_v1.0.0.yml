# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE: Puerta de contratos territoriales de producción
# FECHA: 2026-09-13
# ESTADO: vigente — R034
# QUÉ HACE: certifica que los contratos publicados de Aragón y Castilla y León pueden entrar en la cadena común M01-M06; no ejecuta módulos territoriales.
# MOTIVO: rechazar configuración incompleta, incoherente o fuera del repositorio antes de consumir cálculo.
# ANTERIOR: ninguno — workflow nuevo.
name: Validar contratos territoriales

on:
  push:
    branches: [main]
    paths:
      - 'ddd_core/config.py'
      - 'ddd_core/territory_contract.py'
      - 'herramientas/validar_contrato_territorial.py'
      - 'schemas/territory-production-contract.schema.json'
      - 'territorios/aragon/config/aragon_2025.yaml'
      - 'territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml'
      - 'inputs/MANIFEST.sha256'
      - 'tests/test_territory_contract_admission.py'
      - '.github/workflows/validar-contratos-territoriales.yml'
  pull_request:
    paths:
      - 'ddd_core/config.py'
      - 'ddd_core/territory_contract.py'
      - 'herramientas/validar_contrato_territorial.py'
      - 'schemas/territory-production-contract.schema.json'
      - 'territorios/**/config/*.yaml'
      - 'inputs/MANIFEST.sha256'
      - 'tests/test_territory_contract_admission.py'
      - '.github/workflows/validar-contratos-territoriales.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puerta_admision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Instalar parser YAML
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Probar admisión y rechazos
        run: python -m unittest tests.test_territory_contract_admission -v
      - name: Emitir certificados sin cálculo territorial
        run: |
          python herramientas/validar_contrato_territorial.py --territory aragon --params territorios/aragon/config/aragon_2025.yaml --output certificados/contrato-aragon.json
          python herramientas/validar_contrato_territorial.py --territory castilla_y_leon --params territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml --output certificados/contrato-castilla-y-leon.json
      - uses: actions/upload-artifact@v6
        with:
          name: certificados-contratos-${{ github.run_id }}
          path: certificados
