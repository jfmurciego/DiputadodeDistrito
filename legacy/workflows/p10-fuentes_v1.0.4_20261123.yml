# PROYECTO: Diputado de Distrito
# CLASE: interfaz humana de preparación de fuentes
# VERSIÓN: 1.0.4
# CAMBIOS 1.0.4: T-448 (D-202): con el tipo «Espejo de fuente oficial», `territorio` es la clave de una entrada de configuracion/espejos_fuentes_oficiales.json
#   (minúsculas, cifras y guiones, p. ej. ine-censo2011-1mun00; la herramienta comprueba que esté declarada), no un código nacNN/autNN. Resto idéntico a la 1.0.3.
# ANTERIOR (1.0.3): legacy/workflows/p10-fuentes_v1.0.3_20261123.yml
# CAMBIOS 1.0.3: T-449 (D-183, D-188), sobre la 1.0.2 de main (#888): opción de `tipo` «Espejo de fuente oficial» (solo botón) y job aislado `p13_espejo`:
#   con `territorio` = una entrada de configuracion/espejos_fuentes_oficiales.json (hoy aut08), baja desde el runner la fuente oficial (datos.gob.es; la nube
#   no llega), mide sha256/bytes y la sube en solo lectura a R2 en fuentes/<organismo>/<año>/ con manifiesto.json (herramientas/espejo_fuente_oficial.py;
#   nunca sobrescribe). Sin registro en main y sin la app de registro (sin entorno). El log lleva `ESPEJO_MANIFIESTO` y el volcado CSV de cada hoja.
#   Solo desde main; bajada y medida en un paso sin secretos, subida condicional (If-None-Match) en otro; grupo de concurrencia propio
#   `ddd-espejo-fuente-<territorio>`. Los jobs p11_* y p12_*, idénticos a la 1.0.2.
# ANTERIOR (1.0.2): legacy/workflows/p10-fuentes_v1.0.2_20261123.yml
# CAMBIOS 1.0.2: T-379 PR 2a (D-147, opción a; D-162, opción A), puesta al día sobre main el 23-11: todo job que usa la app de registro (DDD_REGISTRO_APP_*) declara un entorno limitado a main (`registro`, sin revisores; P40 `publicar` sigue en `github-pages` y P70 `podar` en `produccion`): desde una rama o una PR esos jobs no reciben los secretos. Resto idéntico.
# ANTERIOR (1.0.1): legacy/workflows/p10-fuentes_v1.0.1_20261123.yml
# CAMBIOS 1.0.1: T-379 PR 2b (D-163, 2b mínima): `contents: read` en todo el fichero (el push a main va con el token de la app de registro,
#   que no depende de GITHUB_TOKEN: `contents: read` NO es barrera para ese push; sin la app, la credencial falla en vez de caer en github.token);
#   entrada oculta `campana` (workflow_call; vacía = como antes). Con campaña, los jobs (en P30, los pasos) que registran en main se saltan.
#   Con campaña, P10 fuerza `persist_state=false` (P11 y P12): sin registro, `p11_resultado`/`p12_resultado` terminan en verde (PERSISTENCE_NOT_REQUIRED).
# ANTERIOR (1.0.0): legacy/workflows/p10-fuentes_v1.0.0_20261117b.yml
# FECHA: 2026-11-23
# ESTADO: candidato
# CAMBIOS: T-375 (D-136 y D-151, migración paso 6): fichero nuevo; sustituye a preparacion-fuentes.yml 1.4.14 («P10 Fuentes — P11 Territoriales») y preparacion-resultados-electorales.yml 1.0.17 («P10 Fuentes — P12 Electorales»),
#   borrados (copias en legacy/workflows/). Los cinco jobs de P11 y los cuatro de P12 pasan con los MISMOS pasos, comandos, permisos, salidas y registro, con ids `p11_*` y `p12_*`; solo corre el del `tipo` elegido.
# MOTIVO: un solo botón «P10 Fuentes»: `tipo` (P11 territoriales | P12 electorales), `territorio` (UN código por ejecución, como P20/P30, D-148/D-151; varios en paralelo los lanza P00), `eleccion` (vigente | ensayo 2026-11-29; solo P12) y
#   «regenerar aunque exista» (desmarcado). Edición fijada en el código (2025). Reutilizar automático: se reutiliza el paquete registrado si sigue descargable y compatible y se regenera si caducó (P12: antes `exit 44`; el digest nuevo
#   sustituye al registrado; el digest distinto del registrado sigue fallando, código 45). Acepta también ids de época `<t>_hAAAA_MM` (D-150).
# EXCLUSIÓN POR TERRITORIO: `concurrency` de workflow, mismos grupos que antes (`ddd-territorial-prod-<territorio>-<edición>` y `ddd-electoral-prod-<territorio>`, `queue: max`); `ddd-catalog-promotion` sigue en los jobs `*_registrar`.
#   El territorio del grupo es el ID CANÓNICO (aut12) en los dos caminos: el botón recibe el código y la 00 y «Legislatura» pasan `territory_id` (no el nombre del catálogo), así que dos ejecuciones del mismo territorio se excluyen aunque una venga del botón y otra de la 00.
#   Pérdida TRANSITORIA declarada: la 00 sigue pasando el NOMBRE del catálogo a `produccion-distritos.yml` y su reutilizable de generación territorial y `incorporacion-resultados-electorales.yml` (grupos `ddd-territorial-prod-<nombre>-<edición>` y `ddd-electoral-prod-<nombre>`), así que P10 (id canónico) no se excluye con ellos hasta que P20 (#880) y P30 (#866, T-376) —que calculan su grupo con el id canónico resuelto internamente— sustituyan a esos workflows; no hay campañas mientras tanto (D-149).
#   Con la edición vacía (botón) el grupo de P11 usa `2025`, la edición fijada, para coincidir con P30.
# P12 desde el botón: la edición es la fijada en el código (2025: `inputs.data_edition || '2025'` en el resolver).
# workflow_call (entradas técnicas ocultas; la 00 y «Legislatura vigente»): `tipo` territoriales|electorales; `territory_id` el id canónico del territorio (aut12, no «Galicia»); `data_edition` vacía = edición y años del catálogo vigente (solo P11);
#   `eleccion` vacía = vigente; `source_year`, `population_year`, `section_year`, `source_ref`, `recover_run_id` y `recover_artifact_sha256` vacíos = sin valor (solo P11 salvo `source_ref`); `reutilizar_si_ya_preparada`,
#   `persist_state` y `allow_source_gap_success` booleanos (en el botón llegan vacíos: persistir obligatorio, sin hueco de fuente). Salidas = unión de las dos anteriores (las del tipo no ejecutado salen vacías).
# ANTERIOR: ninguna (fichero nuevo); sustituye a legacy/workflows/preparacion-fuentes_v1.4.14_20261116.yml y legacy/workflows/preparacion-resultados-electorales_v1.0.17_20261116.yml
name: P10 Fuentes

on:
  workflow_call:
    inputs:
      campana: {required: false, type: string, default: ''}  # T-379 2b (D-163): id de campaña de P00; no vacía = ruta de campaña (sin registro en main)
      tipo: {required: true, type: string}
      territory_id: {required: true, type: string}
      data_edition: {required: false, type: string, default: ''}
      source_year: {required: false, type: string, default: ''}
      population_year: {required: false, type: string, default: ''}
      section_year: {required: false, type: string, default: ''}
      reutilizar_si_ya_preparada: {required: false, type: boolean, default: true}
      source_ref: {required: false, type: string, default: ''}
      persist_state: {required: false, type: boolean, default: true}
      recover_run_id: {required: false, type: string, default: ''}
      recover_artifact_sha256: {required: false, type: string, default: ''}
      allow_source_gap_success: {required: false, type: boolean, default: false}
      eleccion: {required: false, type: string, default: ''}
    outputs:
      territory_id:
        value: ${{ jobs.p11_resolver.outputs.territory_id || jobs.p12_resolver.outputs.territory_id }}
      edition:
        value: ${{ jobs.p11_resolver.outputs.edition || jobs.p12_resolver.outputs.edition }}
      artifact_name:
        value: ${{ jobs.p11_territoriales.outputs.artifact_name || jobs.p12_electorales.outputs.artifact_name }}
      artifact_digest:
        value: ${{ jobs.p11_territoriales.outputs.artifact_digest || jobs.p12_electorales.outputs.artifact_digest }}
      prepared_source_ref:
        value: ${{ jobs.p11_generation_pending.outputs.prepared_source_ref }}
      codauto:
        value: ${{ jobs.p12_resolver.outputs.codauto }}
      electoral_outcome:
        value: ${{ jobs.p12_electorales.outputs.electoral_outcome }}
      electoral_skip_reason:
        value: ${{ jobs.p12_electorales.outputs.electoral_skip_reason }}
  workflow_dispatch:
    inputs:
      tipo:
        description: Qué fuentes preparar
        required: true
        default: P11 territoriales
        type: choice
        options:
          - P11 territoriales
          - P12 electorales
          - Espejo de fuente oficial
      territorio:
        description: Un código de territorio (p. ej. aut13 o nac28)
        required: true
        type: string
      eleccion:
        description: Elección (solo P12; el ensayo no persiste ni registra)
        required: true
        default: vigente
        type: choice
        options:
          - vigente
          - ensayo 2026-11-29
      regenerar:
        description: Regenerar aunque ya exista
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ inputs.tipo == 'Espejo de fuente oficial' && format('ddd-espejo-fuente-{0}', inputs.territorio) || contains(inputs.tipo, 'electorales') && format('ddd-electoral-prod-{0}', inputs.territory_id || inputs.territorio) || format('ddd-territorial-prod-{0}-{1}', inputs.territory_id || inputs.territorio, inputs.data_edition || '2025') }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read  # T-379 2b (D-163): el push a main va con el token de la app de registro, no con GITHUB_TOKEN
  actions: read

env:
  ELECCIONESDB_SNAPSHOT_SHA256: 668f8eeefe0c19f427367ee2b44f0050c30b93d39f7300fad3d6f381966d91fc

jobs:
  entrada:
    name: Comprobar entradas de P10
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Comprobar tipo, territorio y elección
        shell: bash
        env:
          TIPO: ${{ inputs.tipo }}
          TERRITORIO: ${{ inputs.territorio }}
          TERRITORIO_LLAMADA: ${{ inputs.territory_id }}
          ELECCION: ${{ inputs.eleccion }}
        run: |
          set -euo pipefail
          case "$TIPO" in
            territoriales|"P11 territoriales"|electorales|"P12 electorales"|"Espejo de fuente oficial") ;;
            *) echo "::error::Tipo de fuentes no reconocido: $TIPO"; exit 2 ;;
          esac
          case "${ELECCION:-vigente}" in
            vigente|"ensayo 2026-11-29") ;;
            *) echo "::error::Elección no reconocida: $ELECCION"; exit 2 ;;
          esac
          if [[ "$TIPO" == *territoriales && "${ELECCION:-vigente}" != vigente ]]; then
            echo "::error::La elección solo se elige en P12 electorales."; exit 2
          fi
          if [[ "$TIPO" == "Espejo de fuente oficial" ]]; then
            # Espejo (T-448): una clave de configuracion/espejos_fuentes_oficiales.json; la herramienta comprueba que esté declarada.
            [[ "$TERRITORIO" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || {
              echo "::error::Espejo inválido: «$TERRITORIO» (una clave de configuracion/espejos_fuentes_oficiales.json, p. ej. ine-censo2011-1mun00)."; exit 2
            }
          elif [[ -z "$TERRITORIO_LLAMADA" ]]; then
            # Botón: un solo código.
            [[ "$TERRITORIO" =~ ^(nac|aut)[0-9]{2}(-350)?(_h[0-9]{4}_[0-9]{2})?$ ]] || {
              echo "::error::Código de territorio inválido: «$TERRITORIO» (un solo código, p. ej. aut13, nac28 o nac22_h2019_11)."; exit 2
            }
          fi
          echo "### P10 Fuentes: $TIPO · ${TERRITORIO_LLAMADA:-$TERRITORIO} · elección ${ELECCION:-vigente}" >> "$GITHUB_STEP_SUMMARY"

  p11_resolver:
    name: Resolver preparación desde catálogo
    needs: entrada
    if: ${{ contains(inputs.tipo, 'territoriales') }}
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      edition: ${{ steps.resolve.outputs.edition }}
      reuse_enabled: ${{ steps.resolve.outputs.reuse_enabled }}
      registered_run_id: ${{ steps.resolve.outputs.registered_run_id }}
      registered_artifact_name: ${{ steps.resolve.outputs.registered_artifact_name }}
      registered_artifact_sha256: ${{ steps.resolve.outputs.registered_artifact_sha256 }}
      explicit_recovery: ${{ steps.resolve.outputs.explicit_recovery }}
      source_year: ${{ steps.resolve.outputs.source_year }}
      population_year: ${{ steps.resolve.outputs.population_year }}
      section_year: ${{ steps.resolve.outputs.section_year }}
      persist_state: ${{ steps.resolve.outputs.persist_state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env:
          TERRITORY: ${{ (inputs.territory_id || inputs.territorio) }}
          EDITION_INPUT: ${{ inputs.data_edition || '' }}
          SOURCE_YEAR_INPUT: ${{ inputs.source_year || '' }}
          POPULATION_YEAR_INPUT: ${{ inputs.population_year || '' }}
          SECTION_YEAR_INPUT: ${{ inputs.section_year || '' }}
          REUSE_INPUT: ${{ toJSON(inputs.reutilizar_si_ya_preparada) }}
          REGENERAR_INPUT: ${{ inputs.regenerar }}
          PERSIST_INPUT: ${{ inputs.campana && 'false' || toJSON(inputs.persist_state) }}
          RECOVERY_RUN_ID: ${{ inputs.recover_run_id || '' }}
          RECOVERY_SHA256: ${{ inputs.recover_artifact_sha256 || '' }}
        run: |
          set -euo pipefail
          python herramientas/catalogo_preparacion.py --root-dir . validate

          # workflow_call hereda el evento del caller; no usar github.event_name para
          # distinguir una ejecución manual directa de una llamada reutilizable.
          # data_edition es obligatoria en workflow_call y no existe en workflow_dispatch.
          if [[ -z "$EDITION_INPUT" ]]; then
            current="$(python herramientas/resolver_preparacion_legislatura.py --root-dir . --territory "$TERRITORY")"
            plan="$(jq -ce '.plans | if length == 1 then .[0] else error("La preparación manual exige exactamente un territorio") end' <<<"$current")"
            EDITION="$(jq -r .project_edition <<<"$plan")"
            population_year="$(jq -r .population_year_selected <<<"$plan")"
            section_year="$(jq -r .section_year_selected <<<"$plan")"
            TERRITORY="$(jq -r .territory_id <<<"$plan")"
            reuse_enabled=true
            [[ "$REGENERAR_INPUT" == true ]] && reuse_enabled=false  # T-375: «regenerar aunque exista» del botón de P10
            persist_requested=true
            RECOVERY_RUN_ID=""
            RECOVERY_SHA256=""
          else
            EDITION="$EDITION_INPUT"
            legacy_year="$SOURCE_YEAR_INPUT"
            population_year="$POPULATION_YEAR_INPUT"
            section_year="$SECTION_YEAR_INPUT"
            [[ -n "$population_year" ]] || population_year="$legacy_year"
            [[ -n "$section_year" ]] || section_year="$legacy_year"
            reuse_enabled="$REUSE_INPUT"
            persist_requested="$PERSIST_INPUT"
          fi

          [[ -n "$EDITION" ]] || { echo "::error::Edición interna no resuelta."; exit 40; }
          [[ -n "$population_year" && -n "$section_year" ]] || {
            echo "::error::Contrato temporal incompleto: faltan años de población o seccionado."
            exit 40
          }
          persist_json="$(python herramientas/evaluar_persistencia_preparacion.py resolve --requested "$persist_requested")"
          echo "persist_state=$(jq -r '.persist_state|tostring' <<<"$persist_json")" >> "$GITHUB_OUTPUT"
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "reuse_enabled=$reuse_enabled" >> "$GITHUB_OUTPUT"
          [[ "$population_year" =~ ^20[0-9]{2}$ ]] || { echo "::error::Año de población inválido: $population_year"; exit 40; }
          [[ "$section_year" =~ ^20[0-9]{2}$ ]] || { echo "::error::Año de seccionado inválido: $section_year"; exit 40; }
          echo "population_year=$population_year" >> "$GITHUB_OUTPUT"
          echo "section_year=$section_year" >> "$GITHUB_OUTPUT"
          if [[ "$population_year" == "$section_year" ]]; then echo "source_year=$population_year" >> "$GITHUB_OUTPUT"; else echo "source_year=" >> "$GITHUB_OUTPUT"; fi
          row="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY" --edition "$EDITION")"
          TERRITORY="$(jq -r .territory_id <<<"$row")"
          python herramientas/resolver_fuentes_territorio.py declaration --territory "$TERRITORY" --edition "$EDITION" --population-year "$population_year" --section-year "$section_year" >/dev/null
          preflight="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY" --edition "$EDITION")"
          echo "territory_id=$TERRITORY" >> "$GITHUB_OUTPUT"
          if [[ -n "$RECOVERY_RUN_ID" || -n "$RECOVERY_SHA256" ]]; then
            echo "explicit_recovery=true" >> "$GITHUB_OUTPUT"
            [[ "$(jq -r '.persist_state|tostring' <<<"$persist_json")" == true ]] || { echo "::error::La recuperación durable exige persist_state=true."; exit 41; }
            [[ "$GITHUB_REF_NAME" == main ]] || { echo "::error::La recuperación durable solo se permite en main."; exit 41; }
            [[ "$reuse_enabled" == true ]] || { echo "::error::La recuperación exige reutilización habilitada."; exit 41; }
            [[ -n "$RECOVERY_RUN_ID" && -n "$RECOVERY_SHA256" ]] || { echo "::error::Recuperación requiere run y SHA-256 juntos."; exit 41; }
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Run de recuperación inválido."; exit 41; }
            RECOVERY_SHA256="${RECOVERY_SHA256#sha256:}"
            [[ "$RECOVERY_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::SHA-256 de recuperación inválido."; exit 41; }
            [[ "$(jq -r '.registered' <<<"$preflight")" == false ]] || { echo "::error::La fuente ya tiene registro durable; se rechaza la recuperación explícita."; exit 41; }
            echo "registered_run_id=$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_name=ddd-source-package-$(jq -r .territory_id <<<"$row")-$EDITION-$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_sha256=${RECOVERY_SHA256,,}" >> "$GITHUB_OUTPUT"
          else
            echo "explicit_recovery=false" >> "$GITHUB_OUTPUT"
            registered_population_year="$(jq -r '.population_year // .source_year // empty' <<<"$preflight")"
            registered_section_year="$(jq -r '.section_year // .source_year // empty' <<<"$preflight")"
            if [[ "$(jq -r '.registered|tostring' <<<"$preflight")" == true && "$registered_population_year" == "$population_year" && "$registered_section_year" == "$section_year" ]]; then
              echo "registered_run_id=$(jq -r '.run_id // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_name=$(jq -r '.artifact_name // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_sha256=$(jq -r '.artifact_sha256 // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
            else
              echo "registered_run_id=" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_name=" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_sha256=" >> "$GITHUB_OUTPUT"
            fi
          fi

  p11_territoriales:
    name: Preparar fuentes territoriales
    needs: p11_resolver
    runs-on: ubuntu-24.04
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ (inputs.territory_id || inputs.territorio) }}
      TERRITORY_ID: ${{ needs.p11_resolver.outputs.territory_id }}
      EDITION: ${{ needs.p11_resolver.outputs.edition }}
      POPULATION_YEAR: ${{ needs.p11_resolver.outputs.population_year }}
      SECTION_YEAR: ${{ needs.p11_resolver.outputs.section_year }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
      EVIDENCE_DIR: .ddd-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          token: ${{ github.token }}
      - name: Instalar dependencias de resolución territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Instalar entorno geoespacial para reutilización
        if: ${{ needs.p11_resolver.outputs.reuse_enabled == 'true' && needs.p11_resolver.outputs.registered_run_id != '' }}
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Verificar entorno geoespacial para reutilización
        if: ${{ needs.p11_resolver.outputs.reuse_enabled == 'true' && needs.p11_resolver.outputs.registered_run_id != '' }}
        run: python -c "import geopandas, pandas, shapely, pyproj, pyogrio, yaml"
      - name: Generar declaración territorial desde fuentes oficiales
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration \
            --territory "$TERRITORY" \
            --edition "$EDITION" \
            --population-year "$POPULATION_YEAR" \
            --section-year "$SECTION_YEAR" \
            --output "$SOURCE_DECLARATION"
          test -s "$SOURCE_DECLARATION"
      - id: previous
        name: Recuperar fuente territorial registrada
        if: ${{ needs.p11_resolver.outputs.reuse_enabled == 'true' && needs.p11_resolver.outputs.registered_run_id != '' }}
        shell: bash
        env:
          REGISTERED_RUN_ID: ${{ needs.p11_resolver.outputs.registered_run_id }}
          REGISTERED_ARTIFACT_NAME: ${{ needs.p11_resolver.outputs.registered_artifact_name }}
          REGISTERED_ARTIFACT_SHA256: ${{ needs.p11_resolver.outputs.registered_artifact_sha256 }}
          EXPLICIT_RECOVERY: ${{ needs.p11_resolver.outputs.explicit_recovery }}
        run: |
          set -euo pipefail
          arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REGISTERED_RUN_ID/artifacts?per_page=100")"
          named="$(jq -c --arg n "$REGISTERED_ARTIFACT_NAME" '[.artifacts[]|select(.name==$n)]' <<<"$arts")"
          [[ "$(jq 'length' <<<"$named")" -le 1 ]] || { echo "::error::Artefacto territorial registrado ambiguo: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"; exit 44; }
          match="$(jq -c '[.[]|select(.expired|not)] | if length==1 then .[0] else empty end' <<<"$named")"
          if [[ -z "$match" ]]; then
            # La recuperación exacta solo admite esos bytes. En la reutilización ordinaria,
            # caducado o eliminado no contradice la identidad registrada: se vuelve a adquirir
            # desde la fuente oficial y el registro apuntará al paquete nuevo.
            [[ "$EXPLICIT_RECOVERY" != true ]] || { echo "::error::Artefacto territorial registrado no disponible: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"; exit 44; }
            echo "::warning::Artefacto territorial registrado no disponible (caducado o eliminado): $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID); se prepara de nuevo desde la fuente oficial."
            echo "reused_candidate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_digest="$(jq -r '.digest // empty' <<<"$match" | sed 's/^sha256://')"
          [[ "$actual_digest" == "$REGISTERED_ARTIFACT_SHA256" ]] || { echo "::error::Digest de artefacto territorial no coincide con el registro."; exit 45; }
          rm -rf .ddd-source-package
          gh run download "$REGISTERED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$REGISTERED_ARTIFACT_NAME" --dir .ddd-source-package
          rc=0
          python -m herramientas.seleccionar_paquete_fuentes --package .ddd-source-package --territory-id "$TERRITORY_ID" --edition "$EDITION" --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR" || rc=$?
          if [[ "$rc" == 3 ]]; then
            # T-336: el paquete registrado es de un id de territorio NO canónico: no se reutiliza, se adquiere de nuevo.
            echo "::warning::Paquete registrado $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID) con id de territorio no canónico: se rechaza y se adquiere de nuevo (T-336)."
            {
              echo "### Fuentes del P10: ADQUIRIRÁ (paquete registrado rechazado)"
              echo "- Paquete registrado: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"
              echo "- Motivo: territory_id del paquete distinto del canónico $TERRITORY_ID"
            } >> "$GITHUB_STEP_SUMMARY"
            # El paquete viejo NO debe quedar en el directorio de trabajo: la política lo leería y devolvería REUSE.
            rm -rf .ddd-source-package
            echo "reused_candidate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$rc" == 0 ]] || exit "$rc"
          # Cinturón: si se reutiliza, el id de manifiesto y de los 3 documentos es EXACTAMENTE el canónico, o falla.
          python - "$TERRITORY_ID" <<'PY' || { echo "::error::Reutilización de un paquete con id no canónico (T-336)."; exit 46; }
          import sys
          from pathlib import Path
          from herramientas.politica_reutilizacion_fuentes import paquete_territory_mismatch
          m = paquete_territory_mismatch(Path(".ddd-source-package"), sys.argv[1])
          if m:
              print("; ".join(m)); raise SystemExit(1)
          PY
          {
            echo "### Fuentes del P10: REUTILIZÓ"
            echo "- Paquete: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID), territory_id verificado == $TERRITORY_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "run_id=$REGISTERED_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$REGISTERED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "reused_candidate=true" >> "$GITHUB_OUTPUT"
      - name: Instalar entorno geoespacial para el paquete de R2
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - id: r2
        name: Paquete P10 desde R2 (consulta al INE sin descargar)
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_BUCKET || '' }}
        run: |
          python herramientas/p10_desde_r2.py preparar --territory "$TERRITORY_ID" --edition "$EDITION" \
            --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR" --out .ddd-source-package --declaration "$SOURCE_DECLARATION"
      - name: Resumen de fuentes (adquiere)
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        run: |
          echo "### Fuentes del P10: ADQUIERE desde la fuente oficial (sin paquete reutilizable para $TERRITORY_ID)" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        with:
          context: .
          pull: true
          load: true
          tags: ddd-source-preparation:${{ github.sha }}
          cache-from: type=gha,scope=ddd-source-preparation-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-source-preparation-${{ github.sha }}
      - id: mode
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        run: |
          mode="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA} - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          from pathlib import Path
          d=yaml.safe_load((Path('/app')/sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or '')
          PY
          )"
          case "$mode" in official_live|verified_snapshot) ;; *) echo "::error::Modo productivo inválido: $mode"; exit 40;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' && steps.mode.outputs.mode == 'verified_snapshot' }}
        run: bash inputs/partes/reconstruir_fuentes.sh
      - id: acquire
        name: Adquirir y congelar fuentes
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        run: |
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA}             -m herramientas.ejecutar_fuentes_workflow             --declaration "/app/$SOURCE_DECLARATION" --working /app/.ddd-source-package             --checkpoint-out /app/.ddd-source-checkpoint --acquisition-evidence "/app/$EVIDENCE_DIR"             --environment production --acquisition-mode '${{ steps.mode.outputs.mode }}' --root-dir /app
      - name: Publicar diagnóstico de adquisición fallida
        if: ${{ failure() && steps.acquire.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-source-diagnostics-${{ needs.p11_resolver.outputs.territory_id }}-${{ needs.p11_resolver.outputs.edition }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - id: meta
        name: Identificar paquete territorial
        run: echo "artifact_name=ddd-source-package-${{ needs.p11_resolver.outputs.territory_id }}-${{ needs.p11_resolver.outputs.edition }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-source-package-${{ needs.p11_resolver.outputs.territory_id }}-${{ needs.p11_resolver.outputs.edition }}-${{ github.run_id }}
          path: .ddd-source-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  p11_registrar:
    name: Registrar fuentes territoriales preparadas
    needs: [p11_resolver, p11_territoriales]
    outputs:
      artifact_sha256: ${{ steps.register.outputs.artifact_sha256 }}
      package_sha256: ${{ steps.register.outputs.package_sha256 }}
      promotion_sha: ${{ steps.register.outputs.promotion_sha }}
    if: ${{ (needs.p11_territoriales.result == 'success' && needs.p11_resolver.outputs.persist_state == 'true') && !inputs.campana }}
    environment: registro
    runs-on: ubuntu-24.04
    concurrency:
      group: ddd-catalog-promotion
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ (inputs.territory_id || inputs.territorio) }}
      TERRITORY_ID: ${{ needs.p11_resolver.outputs.territory_id }}
      EDITION: ${{ needs.p11_resolver.outputs.edition }}
      POPULATION_YEAR: ${{ needs.p11_resolver.outputs.population_year }}
      SECTION_YEAR: ${{ needs.p11_resolver.outputs.section_year }}
      ARTIFACT_NAME: ddd-source-package-${{ needs.p11_resolver.outputs.territory_id }}-${{ needs.p11_resolver.outputs.edition }}-${{ github.run_id }}
      ARTIFACT_SHA256: ${{ needs.p11_territoriales.outputs.artifact_digest }}
      TARGET_BRANCH: ${{ github.ref_name }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "::error::Sin la app de registro (DDD_REGISTRO_APP_*): GITHUB_TOKEN es de solo lectura (T-379 2b, D-163)."; exit 1; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Instalar entorno geoespacial de registro
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Verificar entorno geoespacial de registro
        run: python -c "import geopandas, pandas, shapely, pyproj, pyogrio, yaml"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ddd-source-package-${{ needs.p11_resolver.outputs.territory_id }}-${{ needs.p11_resolver.outputs.edition }}-${{ github.run_id }}
          path: .ddd-source-package
      - id: register
        name: Registrar preparación territorial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration             --territory "$TERRITORY" --edition "$EDITION" --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR" --output "$SOURCE_DECLARATION"
          python -m herramientas.promover_catalogo_tras_preparacion             --root-dir .             --territory-id "$TERRITORY_ID"             --edition "$EDITION"             --package .ddd-source-package             --source-declaration "$SOURCE_DECLARATION"             --run-id "$GITHUB_RUN_ID"             --artifact-name "$ARTIFACT_NAME"             --artifact-sha256 "$ARTIFACT_SHA256"             --source-commit "$GITHUB_SHA"             --persist             --target-branch "$TARGET_BRANCH"             --max-attempts 4 > .ddd-catalog-promotion.json
          echo "artifact_sha256=$(jq -r .artifact_sha256 .ddd-catalog-promotion.json)" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$(jq -r .package_sha256 .ddd-catalog-promotion.json)" >> "$GITHUB_OUTPUT"
          python herramientas/catalogo_preparacion.py --root-dir . validate
          durable="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY_ID" --edition "$EDITION")"
          [[ "$(jq -r .run_id <<<"$durable")" == "$GITHUB_RUN_ID" ]] || { echo "::error::El registro territorial durable no apunta al run actual."; exit 48; }
          [[ "$(jq -r .artifact_name <<<"$durable")" == "$ARTIFACT_NAME" ]] || { echo "::error::El registro territorial durable no conserva el artefacto esperado."; exit 49; }
          [[ "$(jq -r .artifact_sha256 <<<"$durable")" == "${ARTIFACT_SHA256#sha256:}" ]] || { echo "::error::El registro territorial durable no conserva el SHA-256 esperado."; exit 50; }
          promotion_sha="$(jq -r .promotion_sha .ddd-catalog-promotion.json)"
          [[ "$promotion_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit de promoción inválido."; exit 51; }
          [[ "$(git rev-parse HEAD)" == "$promotion_sha" ]] || { echo "::error::El checkout final no coincide con la promoción durable."; exit 52; }
          echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"

  p11_generation_pending:
    name: Registrar evaluación de generación pendiente
    needs: [p11_resolver, p11_registrar]
    if: ${{ (always() && needs.p11_resolver.result == 'success' && needs.p11_registrar.result == 'success' && needs.p11_resolver.outputs.persist_state == 'true') && !inputs.campana }}
    environment: registro
    runs-on: ubuntu-24.04
    outputs:
      prepared_source_ref: ${{ steps.persist.outputs.prepared_source_ref }}
    env:
      TERRITORY_ID: ${{ needs.p11_resolver.outputs.territory_id }}
      EDITION: ${{ needs.p11_resolver.outputs.edition }}
      RUN_ID: ${{ github.run_id }}
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.p11_registrar.outputs.promotion_sha }}
          token: ${{ github.token }}
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "::error::Sin la app de registro (DDD_REGISTRO_APP_*): GITHUB_TOKEN es de solo lectura (T-379 2b, D-163)."; exit 1; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: candidate
        name: Materializar estado PENDING ligado a la fuente acreditada
        shell: bash
        run: |
          set -euo pipefail
          contract_path="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY_ID" --edition "$EDITION" | jq -r '.contract_path')"
          [[ -n "$contract_path" && "$contract_path" != null ]] || {
            echo "::error::La fuente acreditada no tiene contrato territorial efectivo."
            exit 56
          }
          python - "$TERRITORY_ID" "$EDITION" "$RUN_ID" "$contract_path" <<'PY'
          import json,sys
          from pathlib import Path
          from herramientas.materializar_evidencia_pre_m04 import build_generation_evaluation
          territory_id,edition,run_id,contract_path=sys.argv[1:]
          payload=build_generation_evaluation(
              root_dir=Path("."),
              territory_id=territory_id,
              edition=edition,
              run_id=int(run_id),
              status="PENDING",
              stage="SOURCE_PREPARED",
              reason="Fuente territorial acreditada; habilitación de generación todavía no evaluada.",
          )
          Path(".ddd-generation-pending.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY
          echo "contract_path=$contract_path" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: persist
        name: Persistir diagnóstico con el escritor concurrente común
        env:
          CONTRACT_PATH: ${{ steps.candidate.outputs.contract_path }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          source_ref="$(python -m herramientas.persistir_evidencia_pre_m04_operacional             --root-dir .             --territory-id "$TERRITORY_ID"             --edition "$EDITION"             --run-id "$RUN_ID"             --contract-path "$CONTRACT_PATH"             --candidate-evidence .ddd-generation-pending.json             --source-commit "$SOURCE_COMMIT"             --target-branch "$TARGET_BRANCH"             --result-json .ddd-generation-pending-persistence.json)" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Persistencia PENDING falló (exit $rc); ver .ddd-generation-pending-persistence.json"
            if [[ -f .ddd-generation-pending-persistence.json ]]; then cat .ddd-generation-pending-persistence.json; fi
            exit "$rc"
          fi
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Persistencia PENDING no devolvió un commit durable."
            exit 57
          }
          echo "prepared_source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  p11_resultado:
    name: Verificar resultado durable de preparación
    needs: [p11_resolver, p11_territoriales, p11_registrar, p11_generation_pending]
    if: ${{ always() && needs.p11_resolver.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Exigir registro cuando la persistencia es obligatoria
        env:
          PREPARATION_RESULT: ${{ needs.p11_territoriales.result }}
          REGISTRATION_RESULT: ${{ needs.p11_registrar.result }}
          PERSIST_STATE: ${{ needs.p11_resolver.outputs.persist_state }}
          GENERATION_PENDING_RESULT: ${{ needs.p11_generation_pending.result }}
        run: |
          if [[ "$PERSIST_STATE" == true && "$PREPARATION_RESULT" == success && "$GENERATION_PENDING_RESULT" != success ]]; then
            echo "::error::La fuente fue preparada, pero no quedó persistido su estado PENDING de generación: $GENERATION_PENDING_RESULT"
            exit 56
          fi
          python herramientas/evaluar_persistencia_preparacion.py terminal \
            --preparation-result "$PREPARATION_RESULT" \
            --registration-result "$REGISTRATION_RESULT" \
            --persist-state "$PERSIST_STATE"

  p12_resolver:
    name: Resolver preparación electoral
    needs: entrada
    if: ${{ contains(inputs.tipo, 'electorales') }}
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      codauto: ${{ steps.resolve.outputs.codauto }}
      edition: ${{ steps.resolve.outputs.edition }}
      election_id: ${{ steps.resolve.outputs.election_id }}
      election_date: ${{ steps.resolve.outputs.election_date }}
      contract_path: ${{ steps.resolve.outputs.contract_path }}
      electoral_declaration: ${{ steps.resolve.outputs.electoral_declaration }}
      registered_run_id: ${{ steps.resolve.outputs.registered_run_id }}
      registered_artifact_name: ${{ steps.resolve.outputs.registered_artifact_name }}
      registered_artifact_sha256: ${{ steps.resolve.outputs.registered_artifact_sha256 }}
      persist_state: ${{ steps.resolve.outputs.persist_state }}
      ensayo: ${{ steps.resolve.outputs.ensayo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.source_ref || github.sha }}', token: '${{ github.token }}'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env: {TERRITORY: '${{ (inputs.territory_id || inputs.territorio) }}', EDITION: "${{ inputs.data_edition || '2025' }}", PERSIST_INPUT: "${{ inputs.campana && 'false' || toJSON(inputs.persist_state) }}", ELECCION: '${{ inputs.eleccion }}'}
        run: |
          set -euo pipefail
          persist_json="$(python herramientas/evaluar_persistencia_preparacion.py resolve --requested "$PERSIST_INPUT")"
          persist="$(jq -r '.persist_state|tostring' <<<"$persist_json")"
          python herramientas/catalogo_preparacion.py --root-dir . validate
          current="$(python herramientas/resolver_eleccion_vigente.py --for-preparation --root-dir . --territory "$TERRITORY" --edition "$EDITION")"
          edition="$(jq -r .territorial_edition <<<"$current")"; [[ "$edition" == "$EDITION" ]] || exit 41
          row="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY" --edition "$edition")"
          ensayo=false; election_id="$(jq -r .election_id <<<"$current")"; election_date="$(jq -r .election_date <<<"$current")"
          if [[ "$ELECCION" == "ensayo 2026-11-29" ]]; then
            rehearsal="$(python herramientas/resolver_ensayo_electoral.py --root-dir . --territory-id "$(jq -r .territory_id <<<"$current")")"
            ensayo=true; election_id="$(jq -r .election_id <<<"$rehearsal")"; election_date="$(jq -r .election_date <<<"$rehearsal")"
            persist=false
          elif [[ -n "$ELECCION" && "$ELECCION" != "vigente" ]]; then
            echo "::error::Valor de eleccion no reconocido: $ELECCION"; exit 42
          fi
          echo "persist_state=$persist" >> "$GITHUB_OUTPUT"; echo "ensayo=$ensayo" >> "$GITHUB_OUTPUT"
          echo "territory_id=$(jq -r .territory_id <<<"$current")" >> "$GITHUB_OUTPUT"
          echo "codauto=$(jq -r .codauto <<<"$current")" >> "$GITHUB_OUTPUT"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"; echo "election_id=$election_id" >> "$GITHUB_OUTPUT"; echo "election_date=$election_date" >> "$GITHUB_OUTPUT"
          preflight="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind electoral --territory "$TERRITORY" --edition "$EDITION")"
          echo "contract_path=$(jq -r '.contract_path // empty' <<<"$row")" >> "$GITHUB_OUTPUT"; echo "electoral_declaration=$(jq -r .declaration <<<"$current")" >> "$GITHUB_OUTPUT"
          # El ensayo nunca reutiliza un paquete registrado (es de otra elección).
          [[ "$ensayo" == true ]] && preflight='{}'
          echo "registered_run_id=$(jq -r '.run_id // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"; echo "registered_artifact_name=$(jq -r '.artifact_name // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"; echo "registered_artifact_sha256=$(jq -r '.artifact_sha256 // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"

  p12_electorales:
    name: Preparar resultados electorales
    needs: p12_resolver
    runs-on: ubuntu-24.04
    outputs: {artifact_digest: '${{ steps.upload.outputs.artifact-digest }}', artifact_name: '${{ steps.meta.outputs.artifact_name }}', adapter: '${{ steps.mode.outputs.adapter }}', source_status: '${{ steps.policy.outputs.source_status }}', production_eligible: '${{ steps.policy.outputs.production_eligible }}', electoral_outcome: '${{ steps.outcome.outputs.electoral_outcome }}', electoral_skip_reason: '${{ steps.outcome.outputs.electoral_skip_reason }}'}
    env: {GH_TOKEN: '${{ github.token }}', TERRITORY_ID: '${{ needs.p12_resolver.outputs.territory_id }}', EDITION: '${{ needs.p12_resolver.outputs.edition }}', PARAMS: '${{ needs.p12_resolver.outputs.contract_path }}', DECLARATION: '${{ needs.p12_resolver.outputs.electoral_declaration }}', ELECTION_ID: '${{ needs.p12_resolver.outputs.election_id }}', ELECTION_DATE: '${{ needs.p12_resolver.outputs.election_date }}', ENSAYO: '${{ needs.p12_resolver.outputs.ensayo }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.source_ref || github.sha }}'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 openpyxl==3.1.5
      - id: previous
        name: Recuperar paquete electoral registrado
        if: ${{ (inputs.reutilizar_si_ya_preparada || (inputs.territorio != '' && !inputs.regenerar)) && needs.p12_resolver.outputs.registered_run_id != '' }}
        env: {REGISTERED_RUN_ID: '${{ needs.p12_resolver.outputs.registered_run_id }}', REGISTERED_ARTIFACT_NAME: '${{ needs.p12_resolver.outputs.registered_artifact_name }}', REGISTERED_ARTIFACT_SHA256: '${{ needs.p12_resolver.outputs.registered_artifact_sha256 }}'}
        run: |
          set -euo pipefail
          arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REGISTERED_RUN_ID/artifacts?per_page=100")"; match="$(jq -c --arg n "$REGISTERED_ARTIFACT_NAME" '.artifacts[]|select(.name==$n and (.expired|not))' <<<"$arts" | head -1)"
          # T-375 (D-136, reutilizar automático): caducado o eliminado no contradice la identidad registrada: se prepara de nuevo.
          [[ -n "$match" ]] || { echo "::warning::Artefacto electoral registrado no disponible (caducado o eliminado): $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID); se prepara de nuevo."; { echo "### Paquete electoral: PREPARARÁ (registrado no disponible)"; echo "- Registrado: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID), caducado o eliminado"; } >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          actual_digest="$(jq -r '.digest // empty' <<<"$match" | sed 's/^sha256://')"; [[ "$actual_digest" == "$REGISTERED_ARTIFACT_SHA256" ]] || { echo "::error::Digest de artefacto electoral no coincide con el registro."; exit 45; }
          mkdir -p .ddd-electoral-previous; gh run download "$REGISTERED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$REGISTERED_ARTIFACT_NAME" --dir .ddd-electoral-previous; test -s .ddd-electoral-previous/manifest.json
          # T-349: igualdad EXACTA con el id canónico (sin alias): un paquete registrado con otro id no se reutiliza, se prepara de nuevo.
          declared="$(jq -r '.territory_id // empty' .ddd-electoral-previous/manifest.json)"
          if [[ "$declared" != "$TERRITORY_ID" || "$REGISTERED_ARTIFACT_NAME" != "ddd-electoral-package-$TERRITORY_ID-$EDITION-$REGISTERED_RUN_ID" ]]; then
            echo "::warning::Paquete electoral registrado $REGISTERED_ARTIFACT_NAME (territory_id=$declared) no es del id canónico $TERRITORY_ID: se rechaza y se prepara de nuevo (T-349)."
            { echo "### Paquete electoral: PREPARARÁ (registrado rechazado)"; echo "- Registrado: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID), territory_id=$declared"; echo "- Motivo: distinto del canónico $TERRITORY_ID"; } >> "$GITHUB_STEP_SUMMARY"
            rm -rf .ddd-electoral-previous
            exit 0
          fi
          { echo "### Paquete electoral: REUTILIZÓ"; echo "- Paquete: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID), territory_id verificado == $TERRITORY_ID"; } >> "$GITHUB_STEP_SUMMARY"
          echo "run_id=$REGISTERED_RUN_ID" >> "$GITHUB_OUTPUT"; echo "artifact_name=$REGISTERED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - id: mode
        name: Identificar adaptador de adquisición
        run: |
          set -euo pipefail
          adapter=generic
          set +e
          python herramientas/resolver_adquisicion_electoral_especial.py \
            --root-dir . \
            --election-id "$ELECTION_ID" \
            --territory-id "$TERRITORY_ID" \
            --election-date "$ELECTION_DATE" \
            --output .ddd-special-acquisition.json >/dev/null
          special_rc=$?
          set -e
          if [[ "$special_rc" == 0 ]]; then
            adapter=official_snapshot
          elif [[ "$special_rc" != 3 ]]; then
            exit "$special_rc"
          elif python - "$ELECTION_ID" <<'PY'
          import sys
          from herramientas.adaptador_eleccionesdb import ELECTIONS
          raise SystemExit(0 if sys.argv[1] in ELECTIONS else 1)
          PY
          then
            adapter=eleccionesdb
          else
            set +e
            python herramientas/fuente_infoelectoral_mesas.py resolve \
              --root-dir . \
              --election-id "$ELECTION_ID" \
              --territory-id "$TERRITORY_ID" \
              --election-date "$ELECTION_DATE" \
              --output .ddd-infoelectoral-contract.json >/dev/null
            infoelectoral_rc=$?
            set -e
            if [[ "$infoelectoral_rc" == 0 ]]; then
              adapter=infoelectoral_mesas
            elif [[ "$infoelectoral_rc" != 3 ]]; then
              exit "$infoelectoral_rc"
            fi
          fi
          if [[ "$adapter" != "official_snapshot" && "$adapter" != "eleccionesdb" && "$adapter" != "infoelectoral_mesas" ]]; then
            set +e
            python herramientas/resolver_contrato_minsait_provisional.py \
              --root-dir . \
              --election-id "$ELECTION_ID" \
              --territory-id "$TERRITORY_ID" \
              --election-date "$ELECTION_DATE" \
              --output .ddd-minsait-contract.json >/dev/null
            rc=$?
            set -e
            if [[ "$rc" == 0 ]]; then
              adapter=minsait_provisional
            elif [[ "$rc" != 3 ]]; then
              exit "$rc"
            fi
          fi
          if [[ "$ENSAYO" == true && "$adapter" != "minsait_provisional" ]]; then
            echo "::error::El ensayo exige el adaptador minsait_provisional con contrato rehearsal (adaptador resuelto: $adapter)"; exit 57
          fi
          echo "adapter=$adapter" >> "$GITHUB_OUTPUT"
      - name: Adquirir snapshot oficial especializado
        if: ${{ steps.mode.outputs.adapter == 'official_snapshot' && steps.previous.outputs.run_id == '' }}
        run: |
          set -euo pipefail
          workers="$(jq -r '.provider_config.workers // 16' .ddd-special-acquisition.json)"
          python herramientas/preparar_snapshot_electoral_oficial.py \
            --root-dir . \
            --election-id "$ELECTION_ID" \
            --territory-id "$TERRITORY_ID" \
            --election-date "$ELECTION_DATE" \
            --edition "$EDITION" \
            --snapshot-out .ddd-official-electoral-snapshot \
            --package-out .ddd-electoral-package \
            --workers "$workers"
      - name: Conservar checkpoint de adquisición oficial si existe
        if: ${{ always() && steps.mode.outputs.adapter == 'official_snapshot' && steps.previous.outputs.run_id == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ddd-electoral-official-checkpoint-${{ needs.p12_resolver.outputs.territory_id }}-${{ github.run_id }}
          path: |
            .ddd-official-electoral-snapshot/.checkpoint-sections
            .ddd-official-electoral-snapshot/.checkpoint-meta.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Conservar snapshot oficial adquirido
        if: ${{ steps.mode.outputs.adapter == 'official_snapshot' && steps.previous.outputs.run_id == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ddd-electoral-official-snapshot-${{ needs.p12_resolver.outputs.territory_id }}-${{ github.run_id }}
          path: .ddd-official-electoral-snapshot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Recuperar snapshot EleccionesDB durable y verificar huella
        if: ${{ steps.mode.outputs.adapter == 'eleccionesdb' && steps.previous.outputs.run_id == '' }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ddd-eleccionesdb-snapshot&per_page=100")"
          art="$(jq -c '.artifacts|map(select(.expired|not))|sort_by(.created_at)|last' <<<"$meta")"
          [[ "$art" != "null" && -n "$art" ]] || { echo "::error::Snapshot EleccionesDB durable ausente"; exit 51; }
          aid="$(jq -r .id <<<"$art")"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > snapshot.zip
          mkdir snapshot; unzip -q snapshot.zip -d snapshot
          test -s snapshot/ddd-eleccionesdb-snapshot.sqlite; test -s snapshot/ddd-eleccionesdb-snapshot.json
          declared="$(jq -r .snapshot_sha256 snapshot/ddd-eleccionesdb-snapshot.json)"; actual="$(sha256sum snapshot/ddd-eleccionesdb-snapshot.sqlite|awk '{print $1}')"
          retrieved_at="$(jq -r '.retrieved_at // empty' snapshot/ddd-eleccionesdb-snapshot.json)"
          [[ "$declared" == "$ELECCIONESDB_SNAPSHOT_SHA256" && "$actual" == "$ELECCIONESDB_SNAPSHOT_SHA256" ]] || { echo "::error::Huella del snapshot EleccionesDB ausente o modificada"; exit 52; }
          [[ "$retrieved_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*(Z|[+-][0-9]{2}:[0-9]{2})$ ]] || { echo "::error::retrieved_at verificable ausente o inválido en snapshot EleccionesDB"; exit 54; }
      - name: Recuperar CSV Minsait provisional gobernado
        if: ${{ steps.mode.outputs.adapter == 'minsait_provisional' && steps.previous.outputs.run_id == '' }}
        run: |
          set -euo pipefail
          test -s .ddd-minsait-contract.json
          source_url="$(jq -r .source_url .ddd-minsait-contract.json)"
          source_sha256="$(jq -r .source_sha256 .ddd-minsait-contract.json)"
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 120 \
            -o minsait-provisional.csv "$source_url"
          actual="$(sha256sum minsait-provisional.csv | awk '{print $1}')"
          [[ "$actual" == "$source_sha256" ]] || {
            echo "::error::Huella del CSV Minsait provisional no coincide con el contrato"
            exit 53
          }
      - name: Recuperar y convertir ZIP oficial Infoelectoral por mesa
        if: ${{ steps.mode.outputs.adapter == 'infoelectoral_mesas' && steps.previous.outputs.run_id == '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -s .ddd-infoelectoral-contract.json
          source_url="$(jq -r .source_url .ddd-infoelectoral-contract.json)"
          source_sha256="$(jq -r .source_sha256 .ddd-infoelectoral-contract.json)"
          # T-299: primero R2 (ARC-E, sha256 del índice); 3 = no está (o sin credenciales) y se sigue con la URL oficial y el espejo.
          nombre_zip="$(basename "$source_url")"
          rc_r2=0; python herramientas/fuente_r2.py bajar "$nombre_zip" infoelectoral-mesas.zip || rc_r2=$?
          [[ "$rc_r2" == 0 || "$rc_r2" == 3 ]] || exit "$rc_r2"
          # El servidor de Infoelectoral corta peticiones sin cabecera de navegador.
          if [[ "$rc_r2" != 0 ]] && ! curl --fail --location --retry 2 --connect-timeout 15 --max-time 300 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Referer: https://infoelectoral.interior.gob.es/" \
            -o infoelectoral-mesas.zip "$source_url"; then
            # Interior rechaza las IP de los runners: espejo íntegro en un release del repositorio.
            mirror_tag="$(jq -r '.mirror.release_tag // empty' .ddd-infoelectoral-contract.json)"
            mirror_asset="$(jq -r '.mirror.asset // empty' .ddd-infoelectoral-contract.json)"
            [[ -n "$mirror_tag" && -n "$mirror_asset" ]] || {
              echo "::error::URL oficial Infoelectoral inaccesible y el contrato no declara espejo"
              exit 22
            }
            echo "::warning::URL oficial inaccesible; se usa el espejo $mirror_tag/$mirror_asset"
            rm -f infoelectoral-mesas.zip
            gh release download "$mirror_tag" -R "$GITHUB_REPOSITORY" -p "$mirror_asset" -O infoelectoral-mesas.zip
          fi
          actual="$(sha256sum infoelectoral-mesas.zip | awk '{print $1}')"
          [[ "$actual" == "$source_sha256" ]] || {
            echo "::error::Huella del ZIP Infoelectoral no coincide con el contrato"
            exit 53
          }
          if [[ "$rc_r2" != 0 && -n "${R2_BUCKET:-}" && -n "${AWS_ACCESS_KEY_ID:-}" ]]; then
            python herramientas/fuente_r2.py subir "$nombre_zip" infoelectoral-mesas.zip || echo "::warning::T-299: no se pudo subir el ZIP a R2"
          fi
          python herramientas/fuente_infoelectoral_mesas.py convert \
            --root-dir . --election-id "$ELECTION_ID" --territory-id "$TERRITORY_ID" \
            --election-date "$ELECTION_DATE" --zip infoelectoral-mesas.zip \
            --csv infoelectoral-mesas.csv --output .ddd-infoelectoral-conversion.json
          jq -c '{polling_stations,sections,parties,candidate_votes,blank_votes,null_votes,voters,cera_excluded}' .ddd-infoelectoral-conversion.json
      - id: prepare
        name: Preparar paquete electoral con contrato común
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          adapter="${{ steps.mode.outputs.adapter }}"
          # T-291 (D-65): la noche de las generales 2026 va sobre los mapas vigentes (edición 2025, seccionado 2023).
          equivalence_args=()
          general_2026="$(python -c 'import yaml; print(yaml.safe_load(open("configuracion/elecciones_generales_2026.yaml", encoding="utf-8"))["election_date"])')"
          if [[ "$ELECTION_DATE" == "$general_2026" && "$EDITION" == "2025" ]]; then
            equivalence_args=(--section-equivalence configuracion/equivalencia_seccionado_ine_2026_a_2023.csv)
          fi
          if [[ "$adapter" == "official_snapshot" ]]; then
            if [[ -n "${{ steps.previous.outputs.run_id }}" ]]; then
              cp -a .ddd-electoral-previous .ddd-electoral-package
            else
              test -s .ddd-electoral-package/manifest.json
              [[ "$(jq -r '.acquisition.kind // empty' .ddd-electoral-package/manifest.json)" == "official_api_snapshot" ]] || {
                echo "::error::El proveedor oficial no produjo un paquete con estrategia acreditada"
                exit 55
              }
            fi
          elif [[ "$adapter" == "eleccionesdb" ]]; then
            if [[ -n "${{ steps.previous.outputs.run_id }}" ]]; then
              cp -a .ddd-electoral-previous .ddd-electoral-package
            else
              retrieved_at="$(jq -r .retrieved_at snapshot/ddd-eleccionesdb-snapshot.json)"
              python herramientas/adaptador_eleccionesdb.py --sqlite snapshot/ddd-eleccionesdb-snapshot.sqlite --election-id "$ELECTION_ID" --out .ddd-electoral-package --snapshot-sha256 "$ELECCIONESDB_SNAPSHOT_SHA256" --edition "$EDITION" --retrieved-at "$retrieved_at"
            fi
          elif [[ "$adapter" == "infoelectoral_mesas" ]]; then
            if [[ -n "${{ steps.previous.outputs.run_id }}" ]]; then
              cp -a .ddd-electoral-previous .ddd-electoral-package
            else
              test -s .ddd-infoelectoral-conversion.json
              c=.ddd-infoelectoral-contract.json
              python herramientas/adaptador_minsait_csv.py \
                --source infoelectoral-mesas.csv \
                --out .ddd-electoral-package \
                --territory-id "$TERRITORY_ID" \
                --election-id "$ELECTION_ID" \
                --election-date "$ELECTION_DATE" \
                --edition "$EDITION" \
                --expected-sha256 "$(jq -r .csv_sha256 .ddd-infoelectoral-conversion.json)" \
                --expected-ccaa "$(jq -r .expected.ccaa "$c")" \
                --expected-provinces 1 \
                --expected-sections "$(jq -r .expected.sections "$c")" \
                --expected-polling-stations "$(jq -r .expected.polling_stations "$c")" \
                --expected-candidate-votes "$(jq -r .expected.candidate_votes "$c")" \
                --source-url "$(jq -r .source_url "$c")" \
                --publisher "$(jq -r .publisher "$c")" \
                --source-status DEFINITIVE \
                --definitive-reference-publisher "$(jq -r .official_totals.publisher "$c")" \
                --definitive-reference-url "$(jq -r .source_url "$c")" \
                --definitive-candidate-votes "$(jq -r .expected.candidate_votes "$c")" \
                --expected-delta-definitive-minus-provisional 0 \
                --production-eligible \
                --source-class official \
                --adapter-label infoelectoral_mesas/1.0 \
                "${equivalence_args[@]}"
            fi
          elif [[ "$adapter" == "minsait_provisional" ]]; then
            if [[ -n "${{ steps.previous.outputs.run_id }}" ]]; then
              cp -a .ddd-electoral-previous .ddd-electoral-package
            else
              test -s .ddd-minsait-contract.json
              expected_ccaa="$(jq -r .expected.ccaa .ddd-minsait-contract.json)"
              expected_provinces="$(jq -r .expected.provinces .ddd-minsait-contract.json)"
              expected_sections="$(jq -r .expected.sections .ddd-minsait-contract.json)"
              expected_polling_stations="$(jq -r .expected.polling_stations .ddd-minsait-contract.json)"
              expected_candidate_votes="$(jq -r .expected.candidate_votes .ddd-minsait-contract.json)"
              source_sha256="$(jq -r .source_sha256 .ddd-minsait-contract.json)"
              source_url="$(jq -r .source_url .ddd-minsait-contract.json)"
              publisher="$(jq -r .publisher .ddd-minsait-contract.json)"
              source_status="$(jq -r .source_status .ddd-minsait-contract.json)"
              definitive_publisher="$(jq -r .reconciliation.definitive.publisher .ddd-minsait-contract.json)"
              definitive_url="$(jq -r .reconciliation.definitive.url .ddd-minsait-contract.json)"
              definitive_candidate_votes="$(jq -r .reconciliation.definitive.candidate_votes .ddd-minsait-contract.json)"
              expected_delta="$(jq -r .reconciliation.delta_definitive_minus_provisional .ddd-minsait-contract.json)"
              eligible_args=()
              if [[ "$(jq -r '.production_eligible|tostring' .ddd-minsait-contract.json)" == true ]]; then
                eligible_args=(--production-eligible)
              fi
              # T-332: el ensayo se etiqueta como tal en el paquete y nunca es elegible.
              if [[ "$(jq -r '.rehearsal|tostring' .ddd-minsait-contract.json)" == true ]]; then
                eligible_args=(--source-class rehearsal --adapter-label minsait_provisional/ensayo/1.0)
              fi
              python herramientas/adaptador_minsait_csv.py \
                --source minsait-provisional.csv \
                --out .ddd-electoral-package \
                --territory-id "$TERRITORY_ID" \
                --election-id "$ELECTION_ID" \
                --election-date "$ELECTION_DATE" \
                --edition "$EDITION" \
                --expected-sha256 "$source_sha256" \
                --expected-ccaa "$expected_ccaa" \
                --expected-provinces "$expected_provinces" \
                --expected-sections "$expected_sections" \
                --expected-polling-stations "$expected_polling_stations" \
                --expected-candidate-votes "$expected_candidate_votes" \
                --source-url "$source_url" \
                --publisher "$publisher" \
                --source-status "$source_status" \
                --definitive-reference-publisher "$definitive_publisher" \
                --definitive-reference-url "$definitive_url" \
                --definitive-candidate-votes "$definitive_candidate_votes" \
                --expected-delta-definitive-minus-provisional "$expected_delta" \
                "${eligible_args[@]}" \
                "${equivalence_args[@]}"
            fi
          else
            args=(--territory-id "$TERRITORY_ID" --edition "$EDITION" --package-out .ddd-electoral-package --root-dir .)
            [[ -n "$PARAMS" ]] && args+=(--params "$PARAMS"); [[ -n "$DECLARATION" ]] && args+=(--declaration "$DECLARATION")
            [[ -f .ddd-electoral-previous/manifest.json ]] && args+=(--previous-package .ddd-electoral-previous --previous-run-id "${{ steps.previous.outputs.run_id }}" --previous-artifact-name "${{ steps.previous.outputs.artifact_name }}")
            set +e
            python -m herramientas.preparar_fuente_electoral "${args[@]}"
            prepare_rc=$?
            set -e
            if [[ "$prepare_rc" != 0 && "$prepare_rc" != 2 ]]; then
              exit "$prepare_rc"
            fi
            if [[ "$prepare_rc" == 2 ]]; then
              test -s .ddd-electoral-package/manifest.json
              [[ "$(jq -r '.decision // empty' .ddd-electoral-package/manifest.json)" == "BLOCK" ]] || {
                echo "::error::El preparador devolvió bloqueo sin manifiesto BLOCK durable"
                exit 48
              }
            fi
          fi
      - id: validate
        name: Validar paquete consumible antes de promoción
        run: |
          set -euo pipefail
          manifest=.ddd-electoral-package/manifest.json
          test -s "$manifest"
          decision="$(jq -r '.decision // empty' "$manifest")"
          if [[ "$decision" == "REUSE" || "$decision" == "ACQUIRE" ]]; then
            [[ -n "$PARAMS" ]] || {
              echo "::error::Paquete electoral consumible sin contrato territorial para validación"
              exit 56
            }
            mkdir -p .ddd-electoral-package/evidence
            validation=.ddd-electoral-package/evidence/validacion_preparacion.json
            python herramientas/validar_paquete_electoral.py \
              --package .ddd-electoral-package \
              --params "$PARAMS" \
              --territory-id "$TERRITORY_ID" \
              --edition "$EDITION" \
              --root-dir . \
              --output "$validation"
            validation_decision="$(jq -r '.decision // empty' "$validation")"
            if [[ "$validation_decision" != "READY_PACKAGE" ]]; then
              if [[ "${{ inputs.allow_source_gap_success }}" == "true" ]]; then
                echo "::notice::Paquete electoral no supera READY_PACKAGE; el caller ha autorizado degradación territorial."
              else
                echo "::error::Paquete electoral no supera READY_PACKAGE"
                exit 56
              fi
            fi
          else
            echo "Paquete electoral no consumible ($decision): se conserva para evidencia y bloqueo durable."
          fi
      - id: policy
        name: Leer política de promoción del paquete
        run: |
          set -euo pipefail
          echo "source_status=$(jq -r '.source_status // "UNKNOWN"' .ddd-electoral-package/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "production_eligible=$(jq -r '(.production_eligible // true)|tostring' .ddd-electoral-package/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Validar identidad vigente del paquete
        run: |
          set -euo pipefail
          test -s .ddd-electoral-package/manifest.json
          manifest=.ddd-electoral-package/manifest.json
          decision="$(jq -r '.decision // empty' "$manifest")"
          [[ "$decision" == "REUSE" || "$decision" == "ACQUIRE" || "$decision" == "BLOCK" ]] || {
            echo "::error::Decisión electoral no reconocida: $decision"
            exit 46
          }
          package_election_id="$(jq -r '.election_id // empty' "$manifest")"
          package_election_date="$(jq -r '.election_date // empty' "$manifest")"
          [[ "$(jq -r '.territory_id // empty' "$manifest")" == "$TERRITORY_ID" ]] || { echo "::error::Paquete electoral de otro territorio"; exit 46; }
          [[ "$(jq -r '.edition // empty' "$manifest")" == "$EDITION" ]] || { echo "::error::Paquete electoral de otra edición"; exit 46; }
          if [[ "$decision" == "REUSE" || "$decision" == "ACQUIRE" ]]; then
            [[ "$package_election_id" == "$ELECTION_ID" ]] || { echo "::error::Paquete electoral de otra elección"; exit 46; }
            [[ "$package_election_date" == "$ELECTION_DATE" ]] || { echo "::error::Paquete electoral con fecha de elección obsoleta"; exit 46; }
          else
            # Un BLOCK por ausencia de fuente puede no materializar identidad electoral.
            # Si la aporta, no se tolera que contradiga el registro vigente.
            [[ -z "$package_election_id" || "$package_election_id" == "$ELECTION_ID" ]] || { echo "::error::Bloqueo electoral con identidad contradictoria"; exit 46; }
            [[ -z "$package_election_date" || "$package_election_date" == "$ELECTION_DATE" ]] || { echo "::error::Bloqueo electoral con fecha contradictoria"; exit 46; }
          fi
          # T-349: el resumen dice si PREPARÓ o REUTILIZÓ y con qué id; reutilizar uno no canónico falla.
          if [[ -n "${{ steps.previous.outputs.run_id }}" ]]; then
            [[ "$(jq -r '.territory_id // empty' "$manifest")" == "$TERRITORY_ID" ]] || { echo "::error::Reutilización de un paquete electoral con id no canónico (T-349)."; exit 46; }
            echo "### Paquete electoral: REUTILIZÓ (territory_id=$TERRITORY_ID, run ${{ steps.previous.outputs.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Paquete electoral: PREPARÓ (territory_id=$TERRITORY_ID)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: meta
        run: echo "artifact_name=ddd-electoral-package-${{ needs.p12_resolver.outputs.territory_id }}-${{ needs.p12_resolver.outputs.edition }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'ddd-electoral-package-${{ needs.p12_resolver.outputs.territory_id }}-${{ needs.p12_resolver.outputs.edition }}-${{ github.run_id }}', path: .ddd-electoral-package, include-hidden-files: true, if-no-files-found: error, retention-days: 30}
      - id: outcome
        name: Aplicar decisión electoral
        shell: bash
        run: |
          set -euo pipefail
          test -f .ddd-electoral-package/manifest.json
          manifest=.ddd-electoral-package/manifest.json
          decision="$(jq -r '.decision // empty' "$manifest")"
          validation_decision=""
          validation=.ddd-electoral-package/evidence/validacion_preparacion.json
          [[ -f "$validation" ]] && validation_decision="$(jq -r '.decision // empty' "$validation")"
          production_eligible="${{ steps.policy.outputs.production_eligible }}"
          source_status="${{ steps.policy.outputs.source_status }}"
          ready=false
          if [[ "$decision" == "REUSE" || "$decision" == "ACQUIRE" ]]; then
            if [[ "$validation_decision" == "READY_PACKAGE" ]]; then
              [[ "$production_eligible" == "true" ]] && ready=true
            fi
          fi
          if [[ "$ready" == "true" ]]; then
            {
              echo "electoral_outcome=READY"
              echo "electoral_skip_reason="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # T-332: un ENSAYO correcto (paquete válido, PROVISIONAL, no elegible por diseño) termina en verde y NO es READY:
          # no registra ni promociona. Cualquier otro motivo de bloqueo sigue siendo fallo.
          if [[ "$ENSAYO" == "true" && "$decision" =~ ^(REUSE|ACQUIRE)$ && "$validation_decision" == "READY_PACKAGE" \
                && "$production_eligible" != "true" && "$source_status" == "PROVISIONAL" ]] \
             && jq -e '.selected_source.source_class == "rehearsal"' "$manifest" >/dev/null; then
            {
              echo "electoral_outcome=ENSAYO_OK"
              echo "electoral_skip_reason="
            } >> "$GITHUB_OUTPUT"
            echo "::notice::ENSAYO correcto, no elegible para producción: no se registra ni se promociona."
            exit 0
          fi

          if [[ "${{ inputs.allow_source_gap_success }}" != "true" ]]; then
            echo "::error::Preparación electoral BLOQUEADA"
            exit 42
          fi

          reason="$(jq -r '.reason // .block_reason // empty' "$manifest")"
          if [[ "$production_eligible" != "true" ]]; then
            reason="${reason:+$reason; }fuente electoral no elegible para producción (source_status=$source_status)"
          fi
          if [[ -z "$reason" && -f "$validation" ]]; then
            reason="$(jq -r '.reason // ((.reasons // []) | join("; ")) // empty' "$validation")"
          fi
          [[ -n "$reason" ]] || reason="fuente electoral no apta por contrato"
          {
            echo "electoral_outcome=SKIPPED_ELECTORAL_SOURCE_INVALID"
            echo "electoral_skip_reason<<DDD_EOF"
            echo "$reason"
            echo "DDD_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::La fuente electoral queda en SKIP contractual; no se oculta ningún fallo técnico."

  p12_registrar:
    name: Registrar resultados electorales preparados
    needs: [p12_resolver, p12_electorales]
    if: ${{ (needs.p12_electorales.result == 'success' && needs.p12_electorales.outputs.electoral_outcome == 'READY' && needs.p12_resolver.outputs.persist_state == 'true' && needs.p12_electorales.outputs.production_eligible == 'true') && !inputs.campana }}
    environment: registro
    runs-on: ubuntu-24.04
    concurrency:
      group: ddd-catalog-promotion
      cancel-in-progress: false
      queue: max
    env: {TERRITORY_ID: '${{ needs.p12_resolver.outputs.territory_id }}', EDITION: '${{ needs.p12_resolver.outputs.edition }}', DECLARATION: '${{ needs.p12_resolver.outputs.electoral_declaration }}', ELECTION_ID: '${{ needs.p12_resolver.outputs.election_id }}', ADAPTER: '${{ needs.p12_electorales.outputs.adapter }}', ARTIFACT_DIGEST: '${{ needs.p12_electorales.outputs.artifact_digest }}', TARGET_BRANCH: '${{ github.ref_name }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.ref_name }}'}
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "::error::Sin la app de registro (DDD_REGISTRO_APP_*): GITHUB_TOKEN es de solo lectura (T-379 2b, D-163)."; exit 1; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Registrar preparación electoral
        run: |
          set -euo pipefail
          artifact_name="ddd-electoral-package-$TERRITORY_ID-$EDITION-$GITHUB_RUN_ID"; test -n "$ARTIFACT_DIGEST" || exit 47
          args=(--kind electoral_source --territory-id "$TERRITORY_ID" --edition "$EDITION" --run-id "$GITHUB_RUN_ID" --artifact-name "$artifact_name" --artifact-sha256 "$ARTIFACT_DIGEST" --election-id "$ELECTION_ID" --source-commit "$GITHUB_SHA")
          [[ "$ADAPTER" == "generic" && -n "$DECLARATION" ]] && args+=(--declaration "$DECLARATION")
          args+=(--persist --target-branch "$TARGET_BRANCH" --max-attempts 4)
          python herramientas/promover_catalogo_operacional.py "${args[@]}" > .ddd-electoral-promotion.json
          python herramientas/catalogo_preparacion.py --root-dir . validate
          promotion_sha="$(jq -r '.promotion_sha // empty' .ddd-electoral-promotion.json)"
          [[ "$promotion_sha" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$promotion_sha" ]] || {
            echo "::error::La preparación electoral no quedó en un commit durable verificable."
            exit 49
          }
          durable="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind electoral --territory "$TERRITORY_ID" --edition "$EDITION")"
          [[ "$(jq -r .run_id <<<"$durable")" == "$GITHUB_RUN_ID" && "$(jq -r .artifact_name <<<"$durable")" == "$artifact_name" && "$(jq -r .artifact_sha256 <<<"$durable")" == "${ARTIFACT_DIGEST#sha256:}" ]] || exit 50

  p12_resultado:
    name: Verificar resultado durable de preparación
    needs: [p12_resolver, p12_electorales, p12_registrar]
    if: ${{ always() && needs.p12_resolver.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.source_ref || github.sha }}'}
      - name: Exigir registro cuando la persistencia es obligatoria
        env:
          PREPARATION_RESULT: ${{ needs.p12_electorales.result }}
          REGISTRATION_RESULT: ${{ needs.p12_registrar.result }}
          PERSIST_STATE: ${{ needs.p12_resolver.outputs.persist_state }}
          ELECTORAL_OUTCOME: ${{ needs.p12_electorales.outputs.electoral_outcome }}
          ALLOW_SOURCE_GAP_SUCCESS: ${{ inputs.allow_source_gap_success }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ALLOW_SOURCE_GAP_SUCCESS" == "true" && "$ELECTORAL_OUTCOME" == "SKIPPED_ELECTORAL_SOURCE_INVALID" ]]; then
            echo "Fuente electoral no apta: terminal válido sin promoción ni registro."
            exit 0
          fi
          python herramientas/evaluar_persistencia_preparacion.py terminal             --preparation-result "$PREPARATION_RESULT"             --registration-result "$REGISTRATION_RESULT"             --persist-state "$PERSIST_STATE"

  p13_espejo:
    name: Espejo de fuente oficial en R2
    needs: entrada
    # Solo desde main: un disparo desde otra rama ejecutaría su propio script con R2 de escritura (revisor #986).
    if: ${{ inputs.tipo == 'Espejo de fuente oficial' && github.ref == 'refs/heads/main' && !inputs.campana }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Bajar y medir (sin secretos)
        env:
          TERRITORIO: ${{ inputs.territorio }}
        shell: bash
        run: |
          set -euo pipefail
          salida="$RUNNER_TEMP/espejo"
          python herramientas/espejo_fuente_oficial.py espejar --territorio "$TERRITORIO" --salida "$salida"
          for f in "$salida"/volcado/*.csv; do
            [[ -f "$f" ]] || continue
            echo "::group::ESPEJO_VOLCADO $(basename "$f")"; cat "$f"; echo "::endgroup::"
          done
      - name: Subir a R2 sin sobrescribir
        env:
          TERRITORIO: ${{ inputs.territorio }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          salida="$RUNNER_TEMP/espejo"
          python herramientas/espejo_fuente_oficial.py subir --territorio "$TERRITORIO" --salida "$salida"
          jq -r '.piezas[] | "| \(.clave) | \(.sha256) | \(.bytes) | \(.r2) |"' "$salida/subida.json" \
            | { echo "### Espejo $TERRITORIO"; echo "| clave | sha256 | bytes | R2 |"; echo "|---|---|---|---|"; cat; } >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar el espejo
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: espejo-fuente-${{ inputs.territorio }}-${{ github.run_id }}
          path: ${{ runner.temp }}/espejo
          if-no-files-found: ignore
          retention-days: 30
