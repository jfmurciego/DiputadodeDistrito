# PROYECTO: Diputado de Distrito
# VERSIÓN: 2.7.1
# NOMBRE DE VERSIÓN: Publicación segura del README de ejecución
# FECHA: 2026-09-11
# ESTADO: candidato
# QUÉ HACE: mantiene la publicación completa y auditable de M01-M08 y corrige la generación del README de resultados para que el shell no interprete texto Markdown como sustitución de comandos.
# CAMBIOS VS 2.7.0: elimina los backticks alrededor de PRODUCTOS.json dentro del heredoc no protegido usado para generar resultados/ejecuciones/<RUN_ID>/README.md. No cambia módulos, parámetros, entradas, outputs ni criterios territoriales.
# MOTIVO: Run #7 mostró "PRODUCTOS.json: command not found" porque el shell interpretó los backticks del Markdown durante la expansión del heredoc. La corrección debe ser operativa y separada de cualquier cambio algorítmico en M05.
# ANTERIOR: legacy/workflows/procedimiento-ddd_v2.7.0.yml
name: Procedimiento DDD — Aragón
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Modo de ejecución
        type: choice
        required: true
        default: iterativo
        options: [iterativo, completo]
permissions: {contents: read}
jobs:
  preparar-territorio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ddd-preparacion-aragon-2025
      cancel-in-progress: false
    outputs:
      clave: ${{ steps.prep-key.outputs.key }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Preparar cálculo de identidad territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Calcular clave de preparación M01-M03
        id: prep-key
        shell: bash
        run: |
          set -euo pipefail
          key="$(python herramientas/calcular_clave_preparacion.py --params configuracion/aragon_2025.yaml)"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]] || { echo "Clave de preparación inválida: '$key'" >&2; exit 21; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restaurar preparación territorial
        id: cache-base
        uses: actions/cache@v6
        with:
          path: .cache/ddd/preparacion
          key: ddd-aragon-preparacion-${{ steps.prep-key.outputs.key }}
      - name: Reconstruir fuentes canónicas desde partes
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          test -s inputs/seccionado_2025.zip
          test -s inputs/65034.csv.zip
          grep -E 'seccionado_2025.zip|65034.csv.zip' inputs/MANIFEST.sha256 | sha256sum -c -
      - name: Construir entorno para preparación
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        run: docker build --pull -t ddd-prep:${{ github.sha }} .
      - name: Construir M01-M03
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/ddd/preparacion/aragon_2025
          mkdir -p .cache/ddd/preparacion
          docker run --rm --entrypoint bash -e DDD_PARAMS="configuracion/aragon_2025.yaml" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/.cache/ddd:/app/.cache/ddd" ddd-prep:${GITHUB_SHA} -lc 'python modulos/01_preparar_base_territorial.py --params "$DDD_PARAMS" && python modulos/02_construir_adyacencias.py --params "$DDD_PARAMS" && python modulos/03_construir_grafo.py --params "$DDD_PARAMS"'
      - name: Comprobar preparación disponible
        run: |
          test -f .cache/ddd/preparacion/aragon_2025/aragon_2025_m01_secciones_poblacion.geojson.zip
          test -f .cache/ddd/preparacion/aragon_2025/aragon_2025_m02_adyacencias.jsonl
          test -f .cache/ddd/preparacion/aragon_2025/aragon_2025_m03_grafo.json

  ejecutar-distritacion:
    needs: preparar-territorio
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DDD_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Restaurar preparación M01-M03
        uses: actions/cache/restore@v6
        with:
          path: .cache/ddd/preparacion
          key: ddd-aragon-preparacion-${{ needs.preparar-territorio.outputs.clave }}
          fail-on-cache-miss: true
      - name: Verificar entrada electoral
        shell: bash
        run: |
          set -euo pipefail
          test -f inputs/rtve_aragon_2026_secciones.json
          grep 'rtve_aragon_2026_secciones.json' inputs/MANIFEST.sha256 | sha256sum -c -
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd:${{ github.sha }} .
      - name: Ejecutar M04-M08 y puerta de calidad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "ejecuciones/$DDD_RUN_ID" .cache/ddd/preparacion
          docker run --rm -e GITHUB_SHA="$GITHUB_SHA" -e GITHUB_RUN_ID="$GITHUB_RUN_ID" -e DDD_RUN_ID="$DDD_RUN_ID" -e DDD_MODO="iterativo" -e DDD_PARAMS="configuracion/aragon_2025.yaml" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/ejecuciones:/app/ejecuciones" -v "$PWD/.cache/ddd:/app/.cache/ddd" ddd:${GITHUB_SHA}
      - name: Materializar outputs auditables M01-M08
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "ejecuciones/$DDD_RUN_ID/aragon_2025_m08_distritos_resultados.geojson.zip" || exit 0
          docker run --rm --entrypoint python -e DDD_RUN_ID="$DDD_RUN_ID" -v "$PWD/ejecuciones:/app/ejecuciones" -v "$PWD/.cache/ddd:/app/.cache/ddd:ro" ddd:${GITHUB_SHA} herramientas/generar_outputs_auditables.py --params configuracion/aragon_2025.yaml --run-id "$DDD_RUN_ID"
      - name: Artefacto M01 — secciones censales
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M01-secciones
          path: |
            .cache/ddd/preparacion/aragon_2025/aragon_2025_m01_secciones_poblacion.geojson.zip
            .cache/ddd/preparacion/aragon_2025/aragon_2025_m01_informe.json
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M01/**
          retention-days: 90
      - name: Artefacto M02 — adyacencias
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M02-adyacencias
          path: |
            .cache/ddd/preparacion/aragon_2025/aragon_2025_m02_adyacencias.jsonl
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M02/**
          retention-days: 90
      - name: Artefacto M03 — grafo territorial
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M03-grafo
          path: |
            .cache/ddd/preparacion/aragon_2025/aragon_2025_m03_grafo.json
            .cache/ddd/preparacion/aragon_2025/aragon_2025_m03_informe.json
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M03/**
          retention-days: 90
      - name: Artefacto M04 — solución inicial
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M04-semillas
          path: |
            ejecuciones/${{ env.DDD_RUN_ID }}/aragon_2025_m04_*
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M04/**
            ejecuciones/${{ env.DDD_RUN_ID }}/logs/modulo_04.log
          retention-days: 90
      - name: Artefacto M05 — optimización
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M05-optimizacion
          path: |
            ejecuciones/${{ env.DDD_RUN_ID }}/aragon_2025_m05_*
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M05/**
            ejecuciones/${{ env.DDD_RUN_ID }}/logs/modulo_05.log
          retention-days: 90
      - name: Artefacto M06 — distritos consolidados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M06-distritos
          path: |
            ejecuciones/${{ env.DDD_RUN_ID }}/aragon_2025_m06_*
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M06/**
            ejecuciones/${{ env.DDD_RUN_ID }}/logs/modulo_06.log
          retention-days: 90
      - name: Artefacto M07 — resultados electorales
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M07-electoral
          path: |
            ejecuciones/${{ env.DDD_RUN_ID }}/aragon_2025_m07_*
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M07/**
            ejecuciones/${{ env.DDD_RUN_ID }}/logs/modulo_07.log
          retention-days: 90
      - name: Artefacto M08 — producto final
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DDD_RUN_ID }}-M08-final
          path: |
            ejecuciones/${{ env.DDD_RUN_ID }}/aragon_2025_m08_*
            ejecuciones/${{ env.DDD_RUN_ID }}/auditoria/M08/**
            ejecuciones/${{ env.DDD_RUN_ID }}/VALIDACION.json
            ejecuciones/${{ env.DDD_RUN_ID }}/MANIFIESTO_EJECUCION.json
            ejecuciones/${{ env.DDD_RUN_ID }}/logs/modulo_08.log
          retention-days: 90
      - name: Publicar outputs navegables completos en GitHub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src="ejecuciones/$DDD_RUN_ID"
          test -d "$src/auditoria" || exit 0
          dst="resultados/ejecuciones/$DDD_RUN_ID"
          mkdir -p "$dst"
          cp -R "$src/auditoria/"* "$dst/"
          cp "$src/VALIDACION.json" "$dst/" 2>/dev/null || true
          cp "$src/MANIFIESTO_EJECUCION.json" "$dst/" 2>/dev/null || true
          for n in 04 05 06 07 08; do cp "$src/logs/modulo_${n}.log" "$dst/M${n}/" 2>/dev/null || true; done
          cat > "$dst/README.md" <<EOF
          # Ejecución $DDD_RUN_ID — outputs auditables

          Cada carpeta M01-M08 contiene el estado materializado del módulo, no solo un informe. Las tablas completas y JSON/JSONL se conservan aquí en Git. Las geometrías GeoJSON ZIP, por su tamaño, se conservan en los artefactos M01-M08 de esta misma ejecución de GitHub Actions y quedan identificadas por ruta, tamaño y SHA-256 en cada PRODUCTOS.json.

          GitHub run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit ejecutado: ${GITHUB_SHA}
          Preparación M01-M03: clave ${{ needs.preparar-territorio.outputs.clave }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git diff --cached --quiet && exit 0
          git commit -m "results: publish complete $DDD_RUN_ID outputs"
          for intento in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((intento*2)); done
          exit 41
