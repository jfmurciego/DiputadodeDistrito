# PROYECTO: Diputado de Distrito
# FICHERO: p70-archivo.yml
# VERSIÓN: 1.1.2
# CAMBIOS 1.1.2: T-420b: P74 Listar llama a `listar_r2.py --duplicados --json` (solo lectura, T-420/#926), imprime el resumen en el log y en el resumen del job y sube el JSON como artefacto `p74-duplicados-<run>`. El resto, idéntico.
# CAMBIOS 1.1.1: T-418 (D-178): P75 imprime en el log y en el resumen `INFORME_CLAVE=` e `INFORME_SHA256=` (y el sha256 y la clave de cada ZIP): es lo que se fija en
#   configuracion/doble_vuelta_publicada.json para publicar la doble vuelta en P40. El resto, idéntico.
# NOMBRE DE VERSIÓN: P70 Archivo
# FECHA: 2026-11-16
# ESTADO: candidato
# QUÉ HACE: único punto de entrada del archivo en R2 (D-131, D-132). Botón: acción = P71 archivar todo lo vivo | P71 archivar el paquete
#   de fuentes de un territorio | P72 recuperar producto electoral | P72 recuperar composición M06 | P73 podar | P74 listar;
#   `simular` (solo P73, por defecto marcado), `territorios` (código) y `eleccion` (AAAA-MM) solo para recuperar, para el paquete de fuentes y para P75 (vacío = todos los `nac` y 2023-07).
#   Run, artefacto, sha, commit, edición y fecha se resuelven en el código (herramientas/p70_resolver.py), no en el botón.
#   Cron diario 05:17 = P71 todo lo vivo. `workflow_call` conserva las entradas técnicas de la 00 (job `recuperar_electoral`, P72 producto).
#   Concurrencia: P71 (los dos), y P73 comparten el grupo `archivar-artefactos-r2` (un solo escritor en R2); P72 conserva sus grupos por
#   territorio y de composición. Borrado real (P73 sin simular) solo con el entorno `produccion`; el sha aprobado de la lista vive en
#   docs/ESTUDIOS/T145_PODA_R2/SHA256_APROBADO.txt: el workflow lo lee de main y `p70_resolver.py sha-poda` exige sha == sha256(ola1_borrar.csv);
#   un test fija el literal. Sin revisor en `produccion` (D-127) ni sha tecleado, `simular` desmarcado borra sin paso humano: la barrera real es
#   la frase de campaña del propietario en el chat del Operador (D-52).
# CAMBIOS: 1.1.0 (T-418, D-178/D-179): acción nueva «P75 Doble vuelta desde R2» (solo lectura sobre git; escribe objetos nuevos en R2): por territorio (vacío = los `nac`)
#   baja `ddd-minimo-<run>-M08`, comprueba su sha256, calcula dv_base, dv_A y dv_B con `doble_vuelta.py --alias` y sube `ddd-doble-vuelta-<run>.zip` e `INFORME.json` a R2
#   (herramientas/p75_doble_vuelta_r2.py). Reutiliza `territorios` y `eleccion`; mismo grupo de concurrencia que P71/P73 (un solo escritor en R2). Lo demás, igual.
# CAMBIOS: 1.0.0 (T-368): fichero nuevo; sustituye a podar-r2.yml 1.0.1, recuperar-producto-electoral-durable.yml 1.0.5 y
#   mantenimiento-programado.yml 1.1.0 (copias en legacy/workflows/podar-r2_v1.0.1, recuperar-producto-electoral-durable_v1.0.5 y mantenimiento-programado_v1.1.0, _20261116). P71 sin «caduca antes»; P71 suma `archivar_p10` (de
#   bateria-motor.yml, que lo conserva hasta T-369); P74 listar es nuevo.
# MOTIVO: D-129 a D-132: un workflow por familia, sin parámetros técnicos visibles.
# ANTERIOR: legacy/workflows/p70-archivo_v1.1.1_20261119.yml
# ANTERIOR (1.1.0): legacy/workflows/p70-archivo_v1.1.0_20261119.yml
# ANTERIOR (1.0.0): legacy/workflows/p70-archivo_v1.0.0_20261119.yml
# ANTERIOR (1.0.0): legacy/workflows/mantenimiento-programado_v1.1.0_20261116.yml
name: P70 Archivo
run-name: "P70 Archivo · ${{ inputs.accion || 'P71 archivo diario' }}"

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
      data_edition: {required: true, type: string}
      source_run_id: {required: true, type: string}
      artifact_name: {required: true, type: string}
      artifact_sha256: {required: true, type: string}
      source_commit: {required: true, type: string}
      expected_context_fingerprint: {required: false, type: string, default: ''}
      confirm_recovery: {required: false, type: boolean, default: true}
    outputs:
      source_run_id:
        value: ${{ jobs.acreditar_registro.outputs.source_run_id }}
      artifact_name:
        value: ${{ jobs.acreditar_registro.outputs.artifact_name }}
      artifact_digest:
        value: ${{ jobs.acreditar_registro.outputs.artifact_digest }}
      source_commit:
        value: ${{ jobs.acreditar_registro.outputs.source_commit }}
      registration_status:
        value: ${{ jobs.acreditar_registro.outputs.registration_status }}
      receipt_accredited:
        value: ${{ jobs.acreditar_registro.outputs.receipt_accredited }}
      catalog_accredited:
        value: ${{ jobs.acreditar_registro.outputs.catalog_accredited }}
      main_head:
        value: ${{ jobs.acreditar_registro.outputs.main_head }}
  workflow_dispatch:
    inputs:
      accion:
        description: 'Acción'
        required: true
        type: choice
        options:
          - 'P71 Archivar todo lo vivo'
          - 'P71 Archivar paquete de fuentes de un territorio'
          - 'P72 Recuperar producto electoral'
          - 'P72 Recuperar composición M06'
          - 'P73 Podar'
          - 'P74 Listar'
          - 'P75 Doble vuelta desde R2'
      simular:
        description: 'Solo «P73 Podar»: marcado = simulación (no borra); desmarcado = borra de verdad (irreversible, entorno produccion)'
        required: false
        type: boolean
        default: true
      territorios:
        description: 'Territorio (código, p. ej. aut01 o nac42): paquete de fuentes y producto electoral; composición M06: códigos separados por comas o vacío = todos; P75: códigos nac separados por comas o vacío = todos los nac'
        required: false
        type: string
        default: ''
      eleccion:
        description: 'Elección (AAAA-MM, p. ej. 2023-07): producto electoral, composición M06 y P75 (vacío = 2023-07)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  # ---- P71 archivar
  archivar_r2:
    if: ${{ github.event.schedule == '17 5 * * *' || inputs.accion == 'P71 Archivar todo lo vivo' }}
    concurrency:
      group: archivar-artefactos-r2
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    name: Archivar y registrar manifiesto
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Validar configuración de R2
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            [[ -n "${!name:-}" ]] || { echo "::error::${name} está vacío."; exit 1; }
          done
      - name: Archivar artefactos
        shell: bash
        run: |
          set -euo pipefail
          python3 herramientas/archivar_artefactos_r2.py | tee archivo.log
      - name: Registrar manifiesto en main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- orchestracion/archivo_r2.json && [[ -z "$(git ls-files -o --exclude-standard orchestracion/archivo_r2.json)" ]]; then
            echo "Manifiesto sin cambios."; exit 0
          fi
          git config user.name "ddd-registro"
          git config user.email "ddd-registro@users.noreply.github.com"
          git add orchestracion/archivo_r2.json
          git commit -m "chore(archivo): manifiesto R2 de artefactos archivados"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((i*3))
          done
          echo "::error::No se pudo registrar el manifiesto en main."; exit 1


  archivar_p10:
    if: ${{ inputs.accion == 'P71 Archivar paquete de fuentes de un territorio' }}
    concurrency:
      group: archivar-artefactos-r2
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    name: Archivar paquete P10 de un territorio en R2 (ARC-E)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORIOS: ${{ inputs.territorios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - name: Paquete P10 de la fuente y archivado por package_sha256
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -eo pipefail
          RUN_P10="$(python herramientas/p70_resolver.py paquete-p10 "$TERRITORIOS")"
          echo "Paquete P10 vigente de $TERRITORIOS en el catálogo: run $RUN_P10"
          rm -rf "$RUNNER_TEMP/paquete"; mkdir -p "$RUNNER_TEMP/paquete"
          gh run download "$RUN_P10" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/paquete" --pattern 'ddd-source-package-*'
          carpeta="$(find "$RUNNER_TEMP/paquete" -type f -name manifest.json -printf '%h\n' | sort | sed -n 1p)"
          [[ -n "$carpeta" ]] || { echo "::error::El run $RUN_P10 no tiene un artefacto ddd-source-package-* con manifest.json (¿caducó a los 30 días?)"; exit 1; }
          python herramientas/bateria_motor.py archivar-p10 "$TERRITORIOS" --paquete "$carpeta" --run "$RUN_P10" --out bateria
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p70-paquete-p10-${{ github.run_id }}
          path: bateria/ARCHIVO_PAQUETES_P10.json
          retention-days: 30

  # ---- P72 recuperar
  resolver_producto:
    if: ${{ inputs.accion == 'P72 Recuperar producto electoral' }}
    name: Resolver el producto electoral huérfano de un territorio
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      recover: ${{ steps.detect.outputs.recover }}
      territory_id: ${{ steps.ctx.outputs.territory_id }}
      data_edition: ${{ steps.ctx.outputs.edition }}
      source_run_id: ${{ steps.detect.outputs.source_run_id }}
      artifact_name: ${{ steps.detect.outputs.artifact_name }}
      artifact_sha256: ${{ steps.detect.outputs.artifact_digest }}
      source_commit: ${{ steps.detect.outputs.source_commit }}
      expected_context_fingerprint: ${{ steps.detect.outputs.context_fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: ctx
        name: Territorio y edición desde el catálogo y el registro electoral
        shell: bash
        env:
          TERRITORIOS: ${{ inputs.territorios }}
          ELECCION: ${{ inputs.eleccion }}
        run: |
          set -euo pipefail
          edicion="$(python herramientas/p70_resolver.py edicion "$TERRITORIOS" "$ELECCION")"
          { echo "territory_id=$TERRITORIOS"; echo "edition=$edicion"; } >> "$GITHUB_OUTPUT"
      - id: detect
        name: Resolver y acreditar candidato huérfano
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ steps.ctx.outputs.territory_id }}
          EDITION: ${{ steps.ctx.outputs.edition }}
        run: |
          set -uo pipefail
          mkdir -p .ddd-orphan-recovery/evidence/audit .ddd-orphan-recovery/evidence/report
          scan=.ddd-orphan-recovery/scan.json
          candidate=.ddd-orphan-recovery/candidate.json
          python -m herramientas.detectar_producto_electoral_huerfano scan \
            --root-dir . --territory-id "$TERRITORY_ID" --edition "$EDITION" --output "$scan"
          scan_rc=$?
          status="$(jq -r '.status // "BLOCKED"' "$scan")"
          reason="$(jq -r '.reason // empty' "$scan")"
          if [[ "$scan_rc" -ne 0 ]]; then
            {
              echo "recover=false"
              echo "status=$status"
              echo "reason=$reason"
            } >> "$GITHUB_OUTPUT"
            exit "$scan_rc"
          fi
          if [[ "$status" == NONE ]]; then
            {
              echo "recover=false"
              echo "status=NONE"
              echo "reason=$reason"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r row; do
            run_id="$(jq -r '.run_id' <<<"$row")"
            evidence=".ddd-orphan-recovery/evidence/$run_id"
            audit="ddd-audit-electoral-$run_id"
            report="ddd-electoral-application-report-$run_id"
            mkdir -p "$evidence/audit" "$evidence/report"

            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$evidence/run.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              | jq '{total_count:(.[0].total_count // 0),artifacts:[.[].artifacts[]]}' \
              > "$evidence/artifacts.initial.json"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$audit" --dir "$evidence/audit" || true
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$report" --dir "$evidence/report" || true
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              | jq '{total_count:(.[0].total_count // 0),artifacts:[.[].artifacts[]]}' \
              > "$evidence/artifacts.confirm.json"
          done < <(jq -c '.candidates[]' "$scan")

          python -m herramientas.detectar_producto_electoral_huerfano resolve \
            --root-dir . --territory-id "$TERRITORY_ID" --edition "$EDITION" \
            --scan-json "$scan" --evidence-root .ddd-orphan-recovery/evidence \
            --output "$candidate"
          validate_rc=$?
          status="$(jq -r '.status // "BLOCKED"' "$candidate")"
          reason="$(jq -r '.reason // empty' "$candidate")"
          if [[ "$validate_rc" -ne 0 ]]; then
            {
              echo "recover=false"
              echo "status=$status"
              echo "reason=$reason"
            } >> "$GITHUB_OUTPUT"
            exit "$validate_rc"
          fi
          if [[ "$status" == NO_RECOVERY ]]; then
            {
              echo "recover=false"
              echo "status=NO_RECOVERY"
              echo "reason=$reason"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" != VALID ]]; then
            {
              echo "recover=false"
              echo "status=$status"
              echo "reason=$reason"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Estado inesperado del detector M08: $status"
            exit 46
          fi

          context_fingerprint="$(
            TERRITORY_ID="$TERRITORY_ID" EDITION="$EDITION" python - <<'PY'
          import os
          from pathlib import Path
          from herramientas.persistir_producto_electoral_operacional import recovery_context_fingerprint
          print(recovery_context_fingerprint(
              root_dir=Path("."),
              territory_id=os.environ["TERRITORY_ID"],
              edition=os.environ["EDITION"],
          ))
          PY
          )"
          {
            echo "recover=true"
            echo "status=VALID"
            echo "reason="
            echo "source_run_id=$(jq -r .source_run_id "$candidate")"
            echo "artifact_name=$(jq -r .artifact_name "$candidate")"
            echo "artifact_digest=$(jq -r .artifact_sha256 "$candidate")"
            echo "source_commit=$(jq -r .source_commit "$candidate")"
            echo "audit_artifact_name=$(jq -r .audit_artifact_name "$candidate")"
            echo "report_artifact_name=$(jq -r .report_artifact_name "$candidate")"
            echo "context_fingerprint=$context_fingerprint"
            echo "origin_manifest=$(jq -r .origin_manifest "$candidate")"
          } >> "$GITHUB_OUTPUT"
      - name: Resultado
        if: ${{ always() }}
        shell: bash
        env:
          RECOVER: ${{ steps.detect.outputs.recover }}
          ESTADO: ${{ steps.detect.outputs.status }}
          MOTIVO: ${{ steps.detect.outputs.reason }}
        run: |
          [[ "$RECOVER" == true ]] && echo "Producto recuperable encontrado: se acredita y registra." || echo "Nada que recuperar ($ESTADO ${MOTIVO:-})."
          exit 0

  acreditar:
    name: Acreditar M08 durable y producto previo
    needs: resolver_producto
    if: ${{ !cancelled() && (inputs.confirm_recovery || needs.resolver_producto.outputs.recover == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      previous_fingerprint: ${{ steps.identity.outputs.previous_fingerprint }}
      context_fingerprint: ${{ steps.identity.outputs.context_fingerprint }}
      operational_head: ${{ steps.identity.outputs.operational_head }}
    steps:
      - name: Obtener main operativo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: identity
        name: Verificar run, SHA, artefactos y reporte de incorporación
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ (inputs.territory_id || needs.resolver_producto.outputs.territory_id) }}
          EDITION: ${{ (inputs.data_edition || needs.resolver_producto.outputs.data_edition) }}
          SOURCE_RUN_ID: ${{ (inputs.source_run_id || needs.resolver_producto.outputs.source_run_id) }}
          ARTIFACT_NAME: ${{ (inputs.artifact_name || needs.resolver_producto.outputs.artifact_name) }}
          EXPECTED_DIGEST: ${{ (inputs.artifact_sha256 || needs.resolver_producto.outputs.artifact_sha256) }}
          SOURCE_COMMIT: ${{ (inputs.source_commit || needs.resolver_producto.outputs.source_commit) }}
          EXPECTED_CONTEXT: ${{ (inputs.expected_context_fingerprint || needs.resolver_producto.outputs.expected_context_fingerprint) || '' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id inválido"; exit 41; }
          source_commit="$(tr '[:upper:]' '[:lower:]' <<<"$SOURCE_COMMIT")"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_commit inválido"; exit 41; }
          expected="$(tr '[:upper:]' '[:lower:]' <<<"${EXPECTED_DIGEST#sha256:}")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::artifact_sha256 inválido"; exit 41; }
          canonical="ddd-state-$SOURCE_RUN_ID-M08"
          [[ "$ARTIFACT_NAME" == "$canonical" ]] || {
            echo "::error::Nombre M08 no canónico: $ARTIFACT_NAME (esperado $canonical)"
            exit 41
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          [[ "$(jq -r '.head_sha // empty' <<<"$run_json")" == "$source_commit" ]] || {
            echo "::error::El SHA del run no coincide con source_commit"
            exit 42
          }
          [[ "$(jq -r '.status // empty' <<<"$run_json")" == completed ]] || {
            echo "::error::El run fuente todavía no está completado"
            exit 42
          }

          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          m08_count="$(jq --arg n "$ARTIFACT_NAME" '[.artifacts[] | select(.name==$n and (.expired|not))] | length' <<<"$metadata")"
          [[ "$m08_count" == 1 ]] || {
            echo "::error::El M08 debe existir exactamente una vez y no estar expirado: $ARTIFACT_NAME ($m08_count)"
            exit 43
          }
          actual="$(jq -r --arg n "$ARTIFACT_NAME" '.artifacts[] | select(.name==$n and (.expired|not)) | .digest // empty' <<<"$metadata" | sed 's/^sha256://' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Digest M08 distinto: esperado=$expected actual=$actual"
            exit 43
          }

          audit_name="ddd-audit-electoral-$SOURCE_RUN_ID"
          audit_count="$(jq --arg n "$audit_name" '[.artifacts[] | select(.name==$n and (.expired|not))] | length' <<<"$metadata")"
          [[ "$audit_count" == 1 ]] || {
            echo "::error::La auditoría electoral debe existir exactamente una vez y no estar expirada: $audit_name ($audit_count)"
            exit 44
          }

          report_name="ddd-electoral-application-report-$SOURCE_RUN_ID"
          report_count="$(jq --arg n "$report_name" '[.artifacts[] | select(.name==$n and (.expired|not))] | length' <<<"$metadata")"
          [[ "$report_count" == 1 ]] || {
            echo "::error::El reporte de incorporación debe existir exactamente una vez y no estar expirado: $report_name ($report_count)"
            exit 45
          }

          rm -rf .ddd-recovery-report
          mkdir -p .ddd-recovery-report
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$report_name" --dir .ddd-recovery-report
          report="$(find .ddd-recovery-report -path '*/report.json' -type f -print -quit)"
          [[ -n "$report" ]] || { echo "::error::Falta report.json de incorporación"; exit 45; }
          [[ "$(jq -r '.status // empty' "$report")" == SUCCESS ]] || {
            echo "::error::El reporte de incorporación no declara SUCCESS"
            exit 45
          }
          [[ "$(jq -r '.territory_id // empty' "$report")" == "$TERRITORY_ID" ]] || {
            echo "::error::El reporte de incorporación pertenece a otro territorio"
            exit 45
          }
          [[ "$(jq -r '.workflow_run_id // empty | tostring' "$report")" == "$SOURCE_RUN_ID" ]] || {
            echo "::error::El reporte de incorporación pertenece a otro run"
            exit 45
          }
          validation="$(find .ddd-recovery-report -name validacion_paquete_electoral.json -type f -print -quit)"
          [[ -n "$validation" ]] || { echo "::error::Falta validación electoral del run"; exit 45; }
          [[ "$(jq -r '.decision // empty' "$validation")" == READY_PACKAGE ]] || {
            echo "::error::La validación electoral del run no es READY_PACKAGE"
            exit 45
          }
          [[ "$(jq -r '.territory_id // empty' "$validation")" == "$TERRITORY_ID" ]] || {
            echo "::error::La validación electoral pertenece a otro territorio"
            exit 45
          }
          [[ "$(jq -r '.edition // empty | tostring' "$validation")" == "$EDITION" ]] || {
            echo "::error::La validación electoral pertenece a otra edición"
            exit 45
          }

          rm -rf .ddd-recovery-audit
          mkdir -p .ddd-recovery-audit
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$audit_name" --dir .ddd-recovery-audit
          audit_status="$(find .ddd-recovery-audit -name production_status.json -type f -print -quit)"
          [[ -n "$audit_status" ]] || { echo "::error::Falta production_status.json de la auditoría electoral"; exit 45; }

          TERRITORY_ID="$TERRITORY_ID" EDITION="$EDITION" SOURCE_RUN_ID="$SOURCE_RUN_ID" \
          REPORT="$report" VALIDATION="$validation" AUDIT_STATUS="$audit_status" python - <<'PY'
          import json,os
          from pathlib import Path
          import yaml
          territory=os.environ["TERRITORY_ID"]; edition=os.environ["EDITION"]; run_id=int(os.environ["SOURCE_RUN_ID"])
          root=Path(".")
          def load_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))
          territorial=load_json(root/f"territorios/{territory}/evidencia/catalogo/territorial_product_{edition}.json")
          from herramientas.detectar_producto_electoral_huerfano import _receipt
          electoral_source=_receipt(root,territory,edition,"electoral_source")
          report=load_json(os.environ["REPORT"])
          validation=load_json(os.environ["VALIDATION"])
          audit=load_json(os.environ["AUDIT_STATUS"])
          registry=yaml.safe_load((root/"configuracion/registro_electoral.yaml").read_text(encoding="utf-8")) or {}
          election=((registry.get("territories") or {}).get(territory) or {}).get("election_id")
          checks={
              "audit territory": audit.get("territory_id")==territory,
              "audit run": audit.get("workflow_run_id")==run_id,
              "audit territorial source": audit.get("source_territorial_run_id")==territorial.get("run_id"),
              "audit electoral": audit.get("electoral_application") is True,
              "report territorial source": report.get("territorial_source_run_id")==territorial.get("run_id"),
              "report electoral source": report.get("electoral_package_run_id")==electoral_source.get("run_id"),
              "registry election": bool(election),
              "source election": electoral_source.get("election_id")==election,
              "candidate election": validation.get("election_id")==election,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit("RECOVERY_IDENTITY_CONTRADICTORY: "+", ".join(failed))
          PY

          readarray -t fingerprints < <(
            TERRITORY_ID="$TERRITORY_ID" EDITION="$EDITION" python - <<'PY'
          import os
          from pathlib import Path
          from herramientas.persistir_producto_electoral_operacional import (
              current_electoral_product_fingerprint,
              recovery_context_fingerprint,
          )
          root=Path(".")
          territory=os.environ["TERRITORY_ID"]
          edition=os.environ["EDITION"]
          print(current_electoral_product_fingerprint(
              root_dir=root, territory_id=territory, edition=edition,
          ))
          print(recovery_context_fingerprint(
              root_dir=root, territory_id=territory, edition=edition,
          ))
          PY
          )
          previous_fingerprint="${fingerprints[0]}"
          context_fingerprint="${fingerprints[1]}"
          if [[ -n "$EXPECTED_CONTEXT" && "$context_fingerprint" != "$EXPECTED_CONTEXT" ]]; then
            echo "::error::ELECTORAL_RECOVERY_CONTEXT_CHANGE: el contexto durable cambió antes de registrar."
            exit 47
          fi
          echo "previous_fingerprint=$previous_fingerprint" >> "$GITHUB_OUTPUT"
          echo "context_fingerprint=$context_fingerprint" >> "$GITHUB_OUTPUT"
          echo "operational_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validar_m08:
    name: Validar semántica del M08 y auditoría electoral
    needs: [resolver_producto, acreditar]
    if: ${{ !cancelled() && needs.acreditar.result == 'success' }}
    uses: ./.github/workflows/_reutilizable-puerta-validacion.yml
    with:
      phase: electoral_product
      territory_id: ${{ (inputs.territory_id || needs.resolver_producto.outputs.territory_id) }}
      data_edition: ${{ (inputs.data_edition || needs.resolver_producto.outputs.data_edition) }}
      run_id: ${{ (inputs.source_run_id || needs.resolver_producto.outputs.source_run_id) }}
      artifact_name: ${{ (inputs.artifact_name || needs.resolver_producto.outputs.artifact_name) }}
      expected_digest: ${{ (inputs.artifact_sha256 || needs.resolver_producto.outputs.artifact_sha256) }}
      source_ref: ${{ (inputs.source_commit || needs.resolver_producto.outputs.source_commit) }}
      audit_artifact_name: ${{ format('ddd-audit-electoral-{0}', (inputs.source_run_id || needs.resolver_producto.outputs.source_run_id)) }}

  registrar:
    name: Registrar producto electoral durable
    needs: [resolver_producto, acreditar, validar_m08]
    if: ${{ !cancelled() && needs.acreditar.result == 'success' && needs.validar_m08.result == 'success' && needs.validar_m08.outputs.decision == 'VALIDADO' }}
    runs-on: ubuntu-24.04
    outputs:
      registration_status: ${{ steps.persist.outputs.registration_status }}
      written_head: ${{ steps.persist.outputs.written_head }}
    concurrency:
      group: ddd-electoral-product-recovery-${{ (inputs.territory_id || needs.resolver_producto.outputs.territory_id) }}-${{ (inputs.data_edition || needs.resolver_producto.outputs.data_edition) }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    steps:
      - name: Obtener main operativo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: persist
        name: Registrar con CAS territorial
        shell: bash
        env:
          TERRITORY_ID: ${{ (inputs.territory_id || needs.resolver_producto.outputs.territory_id) }}
          EDITION: ${{ (inputs.data_edition || needs.resolver_producto.outputs.data_edition) }}
          SOURCE_RUN_ID: ${{ (inputs.source_run_id || needs.resolver_producto.outputs.source_run_id) }}
          ARTIFACT_NAME: ${{ (inputs.artifact_name || needs.resolver_producto.outputs.artifact_name) }}
          ARTIFACT_SHA256: ${{ (inputs.artifact_sha256 || needs.resolver_producto.outputs.artifact_sha256) }}
          SOURCE_COMMIT: ${{ (inputs.source_commit || needs.resolver_producto.outputs.source_commit) }}
          EXPECTED_PREVIOUS: ${{ needs.acreditar.outputs.previous_fingerprint }}
          EXPECTED_CONTEXT: ${{ needs.acreditar.outputs.context_fingerprint }}
        run: |
          set -euo pipefail
          rm -rf .ddd-electoral-recovery
          mkdir -p .ddd-electoral-recovery
          python -m herramientas.persistir_producto_electoral_operacional \
            --root-dir . \
            --territory-id "$TERRITORY_ID" \
            --edition "$EDITION" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-sha256 "$ARTIFACT_SHA256" \
            --source-commit "$SOURCE_COMMIT" \
            --target-branch main \
            --expected-previous-fingerprint "$EXPECTED_PREVIOUS" \
            --expected-context-fingerprint "$EXPECTED_CONTEXT" \
            --result-json .ddd-electoral-recovery/result.json
          cat .ddd-electoral-recovery/result.json
          echo "registration_status=$(jq -r .status .ddd-electoral-recovery/result.json)" >> "$GITHUB_OUTPUT"
          echo "written_head=$(jq -r .head_sha .ddd-electoral-recovery/result.json)" >> "$GITHUB_OUTPUT"

  acreditar_registro:
    name: Acreditar catálogo y receipt recuperados
    needs: [resolver_producto, validar_m08, registrar]
    if: ${{ !cancelled() && needs.validar_m08.result == 'success' && needs.registrar.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      source_run_id: ${{ steps.verify.outputs.source_run_id }}
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
      artifact_digest: ${{ steps.verify.outputs.artifact_digest }}
      source_commit: ${{ steps.verify.outputs.source_commit }}
      registration_status: ${{ steps.verify.outputs.registration_status }}
      receipt_accredited: ${{ steps.verify.outputs.receipt_accredited }}
      catalog_accredited: ${{ steps.verify.outputs.catalog_accredited }}
      main_head: ${{ steps.verify.outputs.main_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: verify
        shell: bash
        env:
          TERRITORY_ID: ${{ (inputs.territory_id || needs.resolver_producto.outputs.territory_id) }}
          EDITION: ${{ (inputs.data_edition || needs.resolver_producto.outputs.data_edition) }}
          SOURCE_RUN_ID: ${{ (inputs.source_run_id || needs.resolver_producto.outputs.source_run_id) }}
          ARTIFACT_NAME: ${{ (inputs.artifact_name || needs.resolver_producto.outputs.artifact_name) }}
          ARTIFACT_SHA256: ${{ (inputs.artifact_sha256 || needs.resolver_producto.outputs.artifact_sha256) }}
          SOURCE_COMMIT: ${{ (inputs.source_commit || needs.resolver_producto.outputs.source_commit) }}
          REGISTRATION_STATUS: ${{ needs.registrar.outputs.registration_status }}
        run: |
          set -euo pipefail
          result="$(
            TERRITORY_ID="$TERRITORY_ID" EDITION="$EDITION" SOURCE_RUN_ID="$SOURCE_RUN_ID" \
            ARTIFACT_NAME="$ARTIFACT_NAME" ARTIFACT_SHA256="$ARTIFACT_SHA256" SOURCE_COMMIT="$SOURCE_COMMIT" \
            python - <<'PY'
          import json,os
          from pathlib import Path
          from herramientas.persistir_producto_electoral_operacional import electoral_product_registration_accreditation
          result=electoral_product_registration_accreditation(
              root_dir=Path("."),
              territory_id=os.environ["TERRITORY_ID"],
              edition=os.environ["EDITION"],
              run_id=int(os.environ["SOURCE_RUN_ID"]),
              artifact_name=os.environ["ARTIFACT_NAME"],
              artifact_sha256=os.environ["ARTIFACT_SHA256"],
              source_commit=os.environ["SOURCE_COMMIT"],
          )
          print(json.dumps(result,separators=(",",":")))
          PY
          )"
          receipt="$(jq -r '.receipt_accredited' <<<"$result")"
          catalog="$(jq -r '.catalog_accredited' <<<"$result")"
          [[ "$receipt" == true && "$catalog" == true ]] || {
            echo "::error::RECOVERY_REGISTRATION_NOT_ACCREDITED: catálogo/receipt no acreditan el M08 recuperado."
            exit 48
          }
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_digest=${ARTIFACT_SHA256#sha256:}"
            echo "source_commit=$SOURCE_COMMIT"
            echo "registration_status=$REGISTRATION_STATUS"
            echo "receipt_accredited=$receipt"
            echo "catalog_accredited=$catalog"
            echo "main_head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  extraer_m06:
    if: ${{ inputs.accion == 'P72 Recuperar composición M06' }}
    concurrency:
      group: ddd-extraer-composicion-m06
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORIOS: ${{ inputs.territorios }}
      ELECCION_MES: ${{ inputs.eleccion || '2023-07' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Fecha de la elección
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          fecha="$(python herramientas/p70_resolver.py fecha-eleccion "$ELECCION_MES")"
          echo "ELECCION=$fecha" >> "$GITHUB_ENV"
      - name: Extraer y registrar
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          sel="${TERRITORIOS:-todos}"
          # Runs candidatos: primero los publicados, después todo estado M06 vivo (checkpoints reutilizados).
          python - "$sel" > candidatos.txt <<'PY'
          import json, sys
          sel = sys.argv[1].strip()
          reg = json.load(open("orchestracion/publicaciones_visor.json"))["products"]
          vig = {}
          for p in reg:
              if p["kind"] == "canonical_m06" and str(p.get("election_date") or "2023-07-23") == "2023-07-23" and (sel in ("", "todos") or p["territory_id"] in sel.split(",")):
                  t = p["territory_id"]
                  if t not in vig or int(p["run_id"]) > int(vig[t]["run_id"]):
                      vig[t] = p
          for t, p in sorted(vig.items()):
              print(p["run_id"], t)
          PY
          cut -d' ' -f1 candidatos.txt > runs.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[]|select(.expired==false)|select(.name|test("^ddd-state-[0-9]+-M06$"))|.workflow_run.id' >> runs.txt || true
          awk '!visto[$0]++' runs.txt > runs_unicos.txt
          mkdir -p trabajo; salida=""
          for run in $(cat runs_unicos.txt); do
            rm -rf "trabajo/$run"; mkdir -p "trabajo/$run"
            if ! gh run download "$run" -n "ddd-state-$run-M06" -D "trabajo/$run" 2>/dev/null; then
              clave="$(awk -v r="$run" '$1==r{print $2; exit}' candidatos.txt)"
              if [[ -n "$clave" && -n "${AWS_ACCESS_KEY_ID:-}" && -n "${R2_BUCKET:-}" && -n "${R2_ACCOUNT_ID:-}" ]]; then
                aws s3 cp --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                  "s3://${R2_BUCKET}/${clave}/${run}/ddd-state-${run}-M06.zip" "trabajo/$run/" >/dev/null 2>&1 || true
              fi
            fi
            salida="$(python herramientas/composicion_m06.py --origen "trabajo/$run" --territorios "$sel")"
            echo "run $run → $salida"
            rm -rf "trabajo/$run"
            if [[ "$salida" == *"no recuperados: -"* ]]; then break; fi
          done
          if [[ "$salida" != *"no recuperados: -"* ]]; then echo "::warning::${salida}"; fi
          git add -A datos/composicion
          if ! git diff --cached --quiet; then
            git commit -m "datos: composición sección→distrito del M06 publicado"
            for intento in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              echo "::warning::push rechazado (intento $intento)"
              git pull --rebase origin main
              [[ "$intento" -lt 3 ]] || exit 1
            done
          fi
          [[ "$ELECCION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::eleccion no es AAAA-MM-DD: $ELECCION"; exit 1; }
          python herramientas/resultados_ligeros.py --eleccion "$ELECCION"
          python herramientas/resultados_partidos.py --fecha "$ELECCION"
          git add -A datos/resultados
          if ! git diff --cached --quiet; then
            git commit -m "datos: votos por partido y distrito"
            for intento in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              echo "::warning::push rechazado (intento $intento)"
              git pull --rebase origin main
            done
            exit 1
          fi

  # ---- P73 podar
  podar:
    if: ${{ inputs.accion == 'P73 Podar' }}
    concurrency:
      group: archivar-artefactos-r2
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    name: Verificar y podar
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ !inputs.simular && 'produccion' || '' }}  # borrado irreversible: la puerta humana se exige siempre, también a bots
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      EJECUTAR: ${{ !inputs.simular }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Validar configuración de R2
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            [[ -n "${!name:-}" ]] || { echo "::error::${name} está vacío."; exit 1; }
          done
      - name: Verificar y podar
        shell: bash
        run: |
          set -euo pipefail
          SHA_LISTA="$(python3 herramientas/p70_resolver.py sha-poda)"
          informe="docs/ESTUDIOS/T145_PODA_R2/informes/podado_$(date -u +%Y%m%dT%H%M%SZ).json"
          args=(--sha256-lista "$SHA_LISTA" --informe "$informe")
          [[ "$EJECUTAR" != "true" ]] || args+=(--ejecutar)
          echo "INFORME=$informe" >> "$GITHUB_ENV"
          set +e
          python3 herramientas/podar_r2.py "${args[@]}" | tee poda.log
          rc=${PIPESTATUS[0]}
          set -e
          [[ ! -f "$informe" ]] || { echo '```json'; cat "$informe"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Conservar informe y manifiesto como artefacto
        if: ${{ always() && !inputs.simular }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poda-r2-informe-${{ github.run_id }}
          path: |
            docs/ESTUDIOS/T145_PODA_R2/informes/
            orchestracion/archivo_r2.json
          if-no-files-found: warn
          retention-days: 90
      - name: Registrar informe y manifiesto en main
        if: ${{ always() && !inputs.simular }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "${INFORME:-}" ]] || { echo "Sin informe que registrar."; exit 0; }
          git config user.name "ddd-registro"
          git config user.email "ddd-registro@users.noreply.github.com"
          git add "$INFORME" orchestracion/archivo_r2.json
          git commit -m "chore(archivo): poda de R2 con lista aprobada (T-145)"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((i*3))
          done
          echo "::error::PODA_SIN_REGISTRAR: los borrados YA están hechos en R2 pero main conserva las claves. Reaplica el informe y archivo_r2.json del artefacto poda-r2-informe-$GITHUB_RUN_ID."; exit 1

  # ---- P74 listar
  listar:
    if: ${{ inputs.accion == 'P74 Listar' }}
    name: Tamaño de R2 por carpeta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Listar (solo lectura)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p salida_p74
          python3 herramientas/listar_r2.py --duplicados --json salida_p74/duplicados_r2.json
      - name: Conservar el JSON de duplicados
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p74-duplicados-${{ github.run_id }}
          path: salida_p74/duplicados_r2.json
          if-no-files-found: warn
          retention-days: 30

  # ---- P75 doble vuelta desde R2 (T-418)
  doble_vuelta_r2:
    if: ${{ inputs.accion == 'P75 Doble vuelta desde R2' }}
    name: Doble vuelta desde R2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: archivar-artefactos-r2
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calcular la doble vuelta de cada territorio desde R2
        shell: bash
        env:
          TERRITORIOS: ${{ inputs.territorios }}
          ELECCION: ${{ inputs.eleccion }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p salida_p75
          rc=0
          python3 herramientas/p75_doble_vuelta_r2.py --territorios "$TERRITORIOS" --eleccion "$ELECCION" --salida salida_p75 || rc=$?
          if [[ -s salida_p75/INFORME.json ]]; then
            python3 - salida_p75/INFORME.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib,json,sys
          r=json.load(open(sys.argv[1]))
          print(f"### P75 · doble vuelta desde R2 · {r['eleccion']} · {r['ok']}/{r['total']} OK\n")
          print(f"`INFORME_CLAVE=doble_vuelta/{r['eleccion']}/{r['run_p75']}/INFORME.json`  \n`INFORME_SHA256={hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()}`\n")
          print("| Territorio | Run | Estado | CSV M07 | Sin casar % | Sin bloque % |\n|---|---|---|---|---:|---:|")
          for f in r["territorios"]:
              print(f"| {f['territorio']} | {f['run']} | {f['estado']} | {f['trae_m07']} | {f['sin_casar_pct']} | {f['sin_bloque_pct']} |")
          PY
          fi
          exit "$rc"
      - name: Conservar el informe
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p75-informe-${{ github.run_id }}
          path: salida_p75/INFORME.json
          if-no-files-found: ignore
          retention-days: 14
