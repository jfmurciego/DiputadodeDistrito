# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.2.0
# NOMBRE: Notificación de finalización de lote DDD
# ESTADO: activo
# QUÉ HACE: publica en issue #5 el cierre de cada lote registrado y menciona a @jfmurciego.
# CAMBIO: incorpora el lote autónomo F1 de auditoría y GeoJSON.
# ANTERIOR: legacy/workflows/notificar-finalizacion-orquestacion_v1.0.0.yml
name: Notificar finalización de lote DDD
on:
  workflow_run:
    workflows: ["Pruebas DDD — R015", "Regresión M06 — Aragón", "Regresión M06 — Castilla y León", "Lote autónomo F1 — auditoría y GeoJSON", "Auditoría integral F1 — 40 controles"]
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  avisar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const body = "✅ @jfmurciego: lote terminado.\n\n- Workflow: **" + run.name + "**\n- Resultado: **" + (run.conclusion || "unknown").toUpperCase() + "**\n- Run: " + run.html_url + "\n- Reenganche: docs/SALIDAS_CHATGPT/PUNTO_REENGANCHE.md";
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 5, body});
