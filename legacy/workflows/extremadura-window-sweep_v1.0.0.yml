# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE: EXT-09 — Barrido fino de ventana M04 c017–c024
# FECHA: 2026-09-11
# ESTADO: diagnóstico; no modifica motores.
# QUÉ HACE: barre chunk_ratio 0.17–0.24. Para cada valor construye macro-unidades internas, ejecuta M04 y,
# solo si M04 llega a hard=0, ejecuta M05 v7.5.2 con swap-polish. Publica métricas comparables.
# MOTIVO: c015 falla, c020 pasa y c025 vuelve a fallar. EXT-07/08 demostraron que ampliar la combinatoria
# local de M05 no resuelve los dos outliers residuales de c020. Debe localizarse la mejor discretización M04
# dentro de la ventana de factibilidad antes de añadir operadores más complejos.
# ANTERIOR: ninguno — workflow nuevo.
name: EXT-09 — Ventana M04 017-024

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extremadura-window-sweep.yml'
      - 'herramientas/construir_unidades_internas_m04.py'
      - 'ddd_core/m04_seed_engine_v745.py'
      - 'ddd_core/m05_swap_polish.py'
      - 'modulos/05_optimizar_distritos.py'

permissions: {contents: read}

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: c017, ratio: '0.17'}
          - {label: c018, ratio: '0.18'}
          - {label: c019, ratio: '0.19'}
          - {label: c020, ratio: '0.20'}
          - {label: c021, ratio: '0.21'}
          - {label: c022, ratio: '0.22'}
          - {label: c023, ratio: '0.23'}
          - {label: c024, ratio: '0.24'}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
      BASE: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
      LABEL: ${{ matrix.label }}
      RATIO: ${{ matrix.ratio }}
      CFG: territorios/extremadura/config/.generated_ext09_${{ matrix.label }}.yaml
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}

      - name: Fuentes y entorno
        run: |
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-ext09:${GITHUB_SHA} .

      - name: M01-M03
        run: |
          set -euo pipefail
          mkdir -p "$BASE/ext09/$LABEL"
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext09:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'

      - name: Construir macro-unidades
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext09:${GITHUB_SHA} herramientas/construir_unidades_internas_m04.py \
            --geojson "$BASE/extremadura_2025_m01_secciones_poblacion.geojson.zip" \
            --graph "$BASE/extremadura_2025_m03_grafo.json" \
            --out-geojson "$BASE/ext09/$LABEL/m04_input.geojson" \
            --out-report "$BASE/ext09/$LABEL/units_report.json" \
            --k 65 --id-field CUSEC_KEY --municipality-field CUMUN --population-field POP_2025 \
            --partition-unit-field M04_PARTITION_UNIT --atomicity-ratio 1.10 --chunk-ratio "$RATIO"
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd

      - name: Generar configuración
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext09:${GITHUB_SHA} -c '
          import copy,pathlib,yaml,os
          root=pathlib.Path("/app");label=os.environ["LABEL"];cfg=yaml.safe_load((root/"territorios/extremadura/config/extremadura_2025.yaml").read_text());c=copy.deepcopy(cfg)
          base=f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/ext09/{label}"
          c["modulos"]["modulo_04_generar_semillas"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":base+"/m04_input.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_PARTITION_UNIT","municipality_name_field":"NMUN","k_districts":65,"municipality_atomicity_limit_ratio":1.10,"seed":12345,"out_geojson":base+"/m04.geojson.zip","out_report":base+"/m04_report.json"}
          c["modulos"]["modulo_05_optimizar_distritos"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":base+"/m04.geojson.zip","id_field":"CUSEC_KEY","pop_field":"POP_{year}","district_field":"district_id","province_field":"CPRO","municipality_field":"CUMUN","greedy_moves_limit":1000,"anneal_iters":30000,"swap_polish_max":200,"seed":12345,"out_geojson":base+"/m05.geojson.zip","out_report":base+"/m05_report.json"}
          c["validation"].update({"expected_districts":65,"population_floor_ratio":.85,"population_cap_ratio":1.50,"target_tolerance_ratio":.10,"province_districts":{"06":41,"10":24}})
          (root/os.environ["CFG"]).write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True))'

      - name: M04
        id: m04
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext09:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params "$CFG"
          python herramientas/reparar_propiedad_geojson_zip.py --zip "$BASE/ext09/$LABEL/m04.geojson.zip" --property ddd_unit_id --province-field CPRO --unit-field M04_PARTITION_UNIT --suffix P

      - name: Registrar fallo M04
        if: steps.m04.outcome != 'success'
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['BASE'])/'ext09'/os.environ['LABEL']/'summary.json'
          p.write_text(json.dumps({'label':os.environ['LABEL'],'ratio':float(os.environ['RATIO']),'m04':'FAILED'},indent=2))
          PY

      - name: M05 + resumen
        if: steps.m04.outcome == 'success'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext09:${GITHUB_SHA} modulos/05_optimizar_distritos.py --params "$CFG"
          docker run --rm -e LABEL="$LABEL" -e RATIO="$RATIO" -v "$PWD:/app" --entrypoint python ddd-ext09:${GITHUB_SHA} -c '
          import io,json,os,pathlib,zipfile,geopandas as gpd
          b=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/ext09")/os.environ["LABEL"]
          with zipfile.ZipFile(b/"m05.geojson.zip") as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          target=g.POP_2025.sum()/65;p=g.groupby("district_id").POP_2025.sum();spl=g.groupby("CUMUN").district_id.nunique();rep=json.loads((b/"m05_report.json").read_text());o={"label":os.environ["LABEL"],"ratio":float(os.environ["RATIO"]),"m04":"PASS","districts":int(g.district_id.nunique()),"outside_10":int(((p-target).abs()>target*.10).sum()),"max_abs_deviation":float(((p-target).abs()/target).max()),"sq_error":float((((p-target)/target)**2).sum()),"min_pop":int(p.min()),"max_pop":int(p.max()),"split_municipalities":{str(k):int(v) for k,v in spl[spl>1].items()},"accepted_swaps":int((rep.get("swap_polish") or {}).get("accepted_swaps",0))};(b/"summary.json").write_text(json.dumps(o,ensure_ascii=False,indent=2));print(json.dumps(o,ensure_ascii=False))'

      - name: Publicar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT09-${{ matrix.label }}-${{ github.run_id }}
          path: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/ext09/${{ matrix.label }}/
