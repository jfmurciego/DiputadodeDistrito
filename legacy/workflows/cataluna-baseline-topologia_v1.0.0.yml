# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE: CAT-01 — baseline y topología Cataluña
# FECHA: 2026-09-12
# ESTADO: primera ejecución territorial.
# QUÉ HACE: ejecuta M01-M03 para Cataluña con fuentes nacionales 2025 y publica sus informes.
# MOTIVO: medir cardinalidad, población y conectividad antes de fijar excepciones o abrir M04.
# ANTERIOR: ninguno — workflow nuevo.
name: CAT-01 — Cataluña baseline topología

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cataluna-baseline-topologia.yml'
      - 'territorios/cataluna/**'

permissions: {contents: read}

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: territorios/cataluna/config/cataluna_2025.yaml
      BASE: territorios/cataluna/.cache/ddd/preparacion/cataluna_2025
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-cat01:${GITHUB_SHA} .
      - name: M01-M03
        run: |
          set -euo pipefail
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/cataluna:/app/territorios/cataluna" --entrypoint bash ddd-cat01:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'
      - name: Resumen CAT-01
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" territorios/cataluna/.cache/ddd || true
          python - <<'PY'
          import json, pathlib
          b=pathlib.Path('territorios/cataluna/.cache/ddd/preparacion/cataluna_2025')
          out={}
          for key,name in [('m01','cataluna_2025_m01_informe.json'),('m03','cataluna_2025_m03_informe.json')]:
              p=b/name
              if p.exists(): out[key]=json.loads(p.read_text())
          (b/'cat01_summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Publicar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cataluna-CAT01-${{ github.run_id }}
          path: territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/
