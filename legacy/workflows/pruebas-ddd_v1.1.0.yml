# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.1.0
# NOMBRE DE VERSIÓN: Puerta CI F1.5 con smoke M01-M06
# FECHA: 2026-09-12
# ESTADO: vigente
# QUÉ HACE: ejecuta la suite automática de regresión, determinismo y gobernanza en el mismo contenedor reproducible del procedimiento.
# CAMBIOS: la suite discover incorpora una ejecución sintética real de M01-M06.
# MOTIVO: detectar roturas de integración común sin lanzar primero una regresión territorial pesada.
# ANTERIOR: legacy/workflows/pruebas-ddd_v1.0.0.yml
name: Pruebas DDD — R015
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Auditar cabeceras y legacy en checkout
        run: python -m unittest tests.test_r015_invariantes.GovernanceHeaders -v
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-tests:${GITHUB_SHA} .
      - name: Verificar evidencia publicada y determinismo sintético
        run: docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python ddd-tests:${GITHUB_SHA} -m unittest discover -s tests -p 'test_*.py' -v
