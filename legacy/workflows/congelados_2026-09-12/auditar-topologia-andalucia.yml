# PROYECTO: Diputado de Distrito
# CLASE: congelado
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Auditoría topológica M02-M03 — Andalucía
# FECHA: 2026-09-11
# ESTADO: AND-02
# QUÉ HACE: ejecuta M01-M03 sin pasarelas territoriales y conserva el diagnóstico incluso cuando M03 detecta componentes administrativas desconectadas.
# CAMBIOS: reutiliza `auditar_geometria_componentes.py` sobre el mayor territorio poblacional abierto hasta ahora.
# MOTIVO: identificar micro-solapes, exclaves y discontinuidades reales antes de declarar excepciones o abrir M04.
# ANTERIOR: ninguno — workflow nuevo.
name: Auditoría M02-M03 — Andalucía

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria-topologica:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: territorios/andalucia/config/andalucia_2025.yaml
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}

      - name: Reconstruir fuentes nacionales
        shell: bash
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          test -s inputs/seccionado_2025.zip
          test -s inputs/65034.csv.zip

      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-and-topology:${GITHUB_SHA} .

      - name: Ejecutar M01-M03 diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p territorios/andalucia/.cache/ddd/preparacion/andalucia_2025
          docker run --rm \
            -e PARAMS="$PARAMS" \
            -v "$PWD/inputs:/app/inputs:ro" \
            -v "$PWD/territorios/andalucia:/app/territorios/andalucia" \
            --entrypoint bash ddd-and-topology:${GITHUB_SHA} -lc '
              set -euo pipefail
              python modulos/01_preparar_base_territorial.py --params "$PARAMS"
              python modulos/02_construir_adyacencias.py --params "$PARAMS"
              set +e
              python modulos/03_construir_grafo.py --params "$PARAMS"
              rc=$?
              set -e
              echo "$rc" > /app/territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_exit_code.txt
              python herramientas/auditar_geometria_componentes.py \
                --geojson /app/territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m01_secciones_poblacion.geojson.zip \
                --graph /app/territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_grafo.json \
                --out /app/territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_relaciones_geometricas.json \
                --nearest 8
            '

      - name: Resumir AND-02
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/territorios/andalucia:/app/territorios/andalucia" \
            --entrypoint python ddd-and-topology:${GITHUB_SHA} -c '
          import json,pathlib
          base=pathlib.Path("/app/territorios/andalucia/.cache/ddd/preparacion/andalucia_2025")
          rep=json.loads((base/"andalucia_2025_m03_informe.json").read_text())
          rel=json.loads((base/"andalucia_2025_m03_relaciones_geometricas.json").read_text())
          rc=int((base/"andalucia_2025_m03_exit_code.txt").read_text())
          summary={
            "m03_exit_code":rc,"nodes":rep.get("nodes"),"edges":rep.get("edges"),"isolated":rep.get("isolated"),
            "province_disconnected":rep.get("province_component_audit",{}).get("disconnected"),
            "municipality_disconnected":rep.get("municipality_component_audit",{}).get("disconnected"),
            "province_components":len(rel.get("province_disconnected_components",[])),
            "municipality_components":len(rel.get("municipality_disconnected_components",[])),
          }
          print("AND-02 SUMMARY "+json.dumps(summary,ensure_ascii=False))
          for x in rel.get("province_disconnected_components",[]): print("AND-02 PROVINCE_COMPONENT "+json.dumps(x,ensure_ascii=False))
          for x in rel.get("municipality_disconnected_components",[]): print("AND-02 MUNICIPALITY_COMPONENT "+json.dumps(x,ensure_ascii=False))
          (base/"andalucia_2025_and02_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          '

      - name: Publicar diagnóstico AND-02
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: andalucia-AND02-${{ github.run_id }}
          path: |
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m01_informe.json
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m02_adyacencias.jsonl
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_grafo.json
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_informe.json
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_exit_code.txt
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_relaciones_geometricas.json
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_and02_summary.json
