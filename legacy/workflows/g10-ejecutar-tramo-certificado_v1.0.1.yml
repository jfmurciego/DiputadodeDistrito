# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.1
# NOMBRE: Ejecutar tramo certificado G10
# QUÉ HACE: verifica checkpoints y ejecuta tramo solo bajo orden explícita.
# CAMBIO: sintaxis YAML compatible con Actions.
# ANTERIOR: legacy/workflows/g10-ejecutar-tramo-certificado_v1.0.0.yml
name: G10 Ejecutar tramo certificado

on:
  workflow_dispatch:
    inputs:
      territory:
        description: Territorio certificado
        required: true
        default: aragon
        type: string
      from_stage:
        description: Primera etapa semántica
        required: true
        default: DISTRICT_BALANCING
        type: string
      to_stage:
        description: Última etapa semántica
        required: true
        default: TERRITORIAL_CERTIFICATION
        type: string
      mode:
        description: verify_only o execute
        required: true
        default: verify_only
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: g10-tramo-${{ inputs.territory }}
  cancel-in-progress: false

jobs:
  tramo:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - id: setup
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.territory }}" in
            aragon) params=territorios/aragon/config/aragon_2025.yaml ;;
            castilla_y_leon) params=territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml ;;
            *) echo "Territorio no autorizado"; exit 20 ;;
          esac
          run_id="g10-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          run_name="$(python -c "import yaml;print((yaml.safe_load(open('$params')) or {}).get('meta',{}).get('run_name'))")"
          echo "params=$params" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "cache_dir=.cache/ddd/preparacion/$run_name" >> "$GITHUB_OUTPUT"
          echo "run_dir=ejecuciones/$run_id" >> "$GITHUB_OUTPUT"
      - id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/g10_materializar_checkpoints.py --index orchestracion/checkpoints_fase1.json --territory "${{ inputs.territory }}" --from-stage "${{ inputs.from_stage }}" --cache-dir "${{ steps.setup.outputs.cache_dir }}" --run-dir "${{ steps.setup.outputs.run_dir }}" --report "${{ steps.setup.outputs.run_dir }}/MATERIALIZACION_G10.json"
          manifest="$(jq -r '.job.checkpoints[0].products_manifest' "${{ steps.setup.outputs.run_dir }}/MATERIALIZACION_G10.json")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      - name: Construir contenedor
        if: ${{ inputs.mode == 'execute' }}
        run: docker build --pull -t ddd-g10:${{ github.sha }} .
      - name: Ejecutar tramo autorizado
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app -e DDD_PARAMS="${{ steps.setup.outputs.params }}" -e DDD_RUN_ID="${{ steps.setup.outputs.run_id }}" -e DDD_FROM_STAGE="${{ inputs.from_stage }}" -e DDD_TO_STAGE="${{ inputs.to_stage }}" -e DDD_CHECKPOINT_MANIFEST="${{ steps.materialize.outputs.manifest }}" -e DDD_CHECKPOINT_CACHE_DIR="${{ steps.setup.outputs.cache_dir }}" --entrypoint /app/procedimiento.sh ddd-g10:${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g10-tramo-${{ inputs.territory }}-${{ github.run_id }}
          path: ${{ steps.setup.outputs.run_dir }}/
          if-no-files-found: warn
  notificar:
    if: always()
    needs: tramo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = "G10 tramo terminado: ${{ inputs.territory }} | ${{ inputs.from_stage }} -> ${{ inputs.to_stage }} | modo ${{ inputs.mode }} | resultado ${{ needs.tramo.result }} | " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body});
