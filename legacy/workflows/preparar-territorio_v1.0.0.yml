# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Preparación territorial M01 parametrizable
# FECHA: 2026-09-11
# ESTADO: candidato CYL-01
# QUÉ HACE: reconstruye fuentes nacionales, ejecuta M01 para un YAML territorial y valida su universo base.
# CAMBIOS: primera puerta multi-territorio independiente del workflow Aragón M01-M08.
# MOTIVO: aceptar Castilla y León M01 de forma reproducible sin duplicar motor ni fuentes.
# ORIGEN: CYL-01 / R018
name: Preparación DDD — territorio
on:
  workflow_dispatch:
    inputs:
      params:
        description: Ruta al YAML territorial
        required: true
        default: territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparar-territorio.yml'
      - 'territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml'
      - 'territorios/castilla_y_leon/docs/CYL_01_INVENTARIO_FUENTES.md'
permissions:
  contents: read
jobs:
  m01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PARAMS: ${{ inputs.params || 'territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml' }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Reconstruir y verificar fuentes nacionales
        shell: bash
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          test -s inputs/seccionado_2025.zip
          test -s inputs/65034.csv.zip
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-preparacion:${GITHUB_SHA} .
      - name: Ejecutar M01
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p territorios/castilla_y_leon/.cache/ddd/preparacion
          docker run --rm \
            -v "$PWD/inputs:/app/inputs:ro" \
            -v "$PWD/territorios/castilla_y_leon:/app/territorios/castilla_y_leon" \
            --entrypoint python \
            ddd-preparacion:${GITHUB_SHA} \
            modulos/01_preparar_base_territorial.py --params "$PARAMS"
      - name: Validar M01 Castilla y León
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/territorios/castilla_y_leon:/app/territorios/castilla_y_leon:ro" \
            --entrypoint python \
            ddd-preparacion:${GITHUB_SHA} -c '
          import json, zipfile, tempfile, pathlib, geopandas as gpd
          base=pathlib.Path("/app/territorios/castilla_y_leon/.cache/ddd/preparacion/castilla_y_leon_2025")
          report=json.loads((base/"castilla_y_leon_2025_m01_informe.json").read_text())
          assert report["rows_out"] == 3506, report
          assert report["missing_population_rows"] == 0, report
          zpath=base/"castilla_y_leon_2025_m01_secciones_poblacion.geojson.zip"
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile(zpath) as z: z.extractall(td)
              geo=next(pathlib.Path(td).glob("*.geojson"))
              g=gpd.read_file(geo)
          assert len(g)==3506
          assert g["CUSEC_KEY"].notna().all()
          assert g["CUSEC_KEY"].is_unique
          assert set(g["CPRO"].astype(str).str.zfill(2)) == {"05","09","24","34","37","40","42","47","49"}
          assert int(g["POP_2025"].sum()) == 2401221
          print("CYL M01 PASS: 3506 secciones; población=2401221; missing=0; provincias=9")
          '
      - name: Publicar producto M01
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: castilla-y-leon-M01-${{ github.run_id }}
          path: |
            territorios/castilla_y_leon/.cache/ddd/preparacion/castilla_y_leon_2025/castilla_y_leon_2025_m01_informe.json
            territorios/castilla_y_leon/.cache/ddd/preparacion/castilla_y_leon_2025/castilla_y_leon_2025_m01_secciones_poblacion.geojson.zip
