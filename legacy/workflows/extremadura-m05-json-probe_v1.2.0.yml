# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.2.0
# NOMBRE: EXT-03 — Prueba M04→M05 + diagnóstico de bloqueos y swaps 1×1
# FECHA: 2026-09-11
# ESTADO: diagnóstico.
# QUÉ HACE: reproduce tight granular, ejecuta M05 robusto, explica los outliers restantes y busca swaps 1×1 válidos que permitan escapar del mínimo local sin modificar aún el optimizador.
# CAMBIOS: añade `auditar_swaps_m05.py`, publica su JSON y escucha cambios de la herramienta; preserva v1.1.0 en legacy.
# MOTIVO: Run 34628521996 confirmó que los distritos 32 (+36,79 %) y 59 (+12,22 %) no tienen ningún movimiento unitario válido que mejore el objetivo; el siguiente operador mínimo que debe probarse es un intercambio 1×1.
# ANTERIOR: legacy/workflows/extremadura-m05-json-probe_v1.1.0.yml
name: EXT-03 — M05 granular JSON

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extremadura-m05-json-probe.yml'
      - 'herramientas/reparar_propiedad_geojson_zip.py'
      - 'herramientas/auditar_bloqueos_m05.py'
      - 'herramientas/auditar_swaps_m05.py'
      - 'modulos/05_optimizar_distritos.py'

permissions: {contents: read}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: {PARAMS: territorios/extremadura/config/extremadura_2025.yaml}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-ext-json:${GITHUB_SHA} .
      - name: M01-M03
        run: |
          set -euo pipefail
          mkdir -p territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext-json:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'
      - name: Generar configuración tight granular
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-json:${GITHUB_SHA} -c '
          import copy,io,json,pathlib,zipfile,yaml
          import geopandas as gpd
          root=pathlib.Path("/app");base=root/"territorios/extremadura/.cache/ddd/preparacion/extremadura_2025";cfg=yaml.safe_load((root/"territorios/extremadura/config/extremadura_2025.yaml").read_text())
          with zipfile.ZipFile(base/"extremadura_2025_m01_secciones_poblacion.geojson.zip") as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          g["CUMUN"]=g.CUMUN.astype(str);g["CUSEC_KEY"]=g.CUSEC_KEY.astype(str);target=int(g.POP_2025.sum())/65;atomic=1.10;limit=target*atomic;mp=g.groupby("CUMUN").POP_2025.sum();oversized=set(mp[mp>limit].index.astype(str));g["M04_MUN"]=g.CUMUN;mask=g.CUMUN.isin(oversized);g.loc[mask,"M04_MUN"]=g.loc[mask,"CUMUN"]+"#"+g.loc[mask,"CUSEC_KEY"]
          g.to_file(base/"extremadura_2025_m04_input_tight.geojson",driver="GeoJSON")
          c=copy.deepcopy(cfg);c["modulos"]["modulo_04_generar_semillas"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_input_tight.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_MUN","municipality_name_field":"NMUN","k_districts":65,"municipality_atomicity_limit_ratio":atomic,"seed":12345,"out_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_probe.geojson.zip","out_report":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_probe_informe.json"};c["modulos"]["modulo_05_optimizar_distritos"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_probe.geojson.zip","id_field":"CUSEC_KEY","pop_field":"POP_{year}","district_field":"district_id","province_field":"CPRO","municipality_field":"CUMUN","greedy_moves_limit":1000,"anneal_iters":30000,"seed":12345,"out_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m05_probe.geojson.zip","out_report":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m05_probe_informe.json"};c["validation"].update({"expected_districts":65,"population_floor_ratio":.85,"population_cap_ratio":1.50,"target_tolerance_ratio":.10,"province_districts":{"06":41,"10":24}});(root/"territorios/extremadura/config/.generated_ext03_json.yaml").write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True));probe=root/"territorios/extremadura/.cache/ddd/probes";probe.mkdir(parents=True,exist_ok=True);(probe/"ext03_json_manifest.json").write_text(json.dumps({"oversized":sorted(oversized),"target":target,"atomic_limit":limit},indent=2))'
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd
      - name: M04 + reparación JSON
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-json:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params territorios/extremadura/config/.generated_ext03_json.yaml
          python herramientas/reparar_propiedad_geojson_zip.py --zip territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m04_probe.geojson.zip --property ddd_unit_id --province-field CPRO --unit-field M04_MUN --suffix G
      - name: M05
        run: docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-json:${GITHUB_SHA} modulos/05_optimizar_distritos.py --params territorios/extremadura/config/.generated_ext03_json.yaml
      - name: Auditar resultado, bloqueos y swaps 1x1
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-json:${GITHUB_SHA} -c '
          import io,json,pathlib,zipfile
          import geopandas as gpd
          base=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025");probe=pathlib.Path("/app/territorios/extremadura/.cache/ddd/probes")
          with zipfile.ZipFile(base/"extremadura_2025_m05_probe.geojson.zip") as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          target=g.POP_2025.sum()/65;pops=g.groupby("district_id").POP_2025.sum();splits=g.groupby("CUMUN").district_id.nunique();rep=json.loads((base/"extremadura_2025_m05_probe_informe.json").read_text());out={"districts":int(g.district_id.nunique()),"outside_10":int(((pops-target).abs()>target*.10).sum()),"max_abs_deviation":float(((pops-target).abs()/target).max()),"min_pop":int(pops.min()),"max_pop":int(pops.max()),"split_municipalities":{str(k):int(v) for k,v in splits[splits>1].items()},"m05_report":rep};(probe/"ext03_json_results.json").write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False));assert out["districts"]==65'
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-json:${GITHUB_SHA} herramientas/auditar_bloqueos_m05.py --params territorios/extremadura/config/.generated_ext03_json.yaml --geojson territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m05_probe.geojson.zip --out territorios/extremadura/.cache/ddd/probes/ext03_m05_blockages.json
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-json:${GITHUB_SHA} herramientas/auditar_swaps_m05.py --params territorios/extremadura/config/.generated_ext03_json.yaml --geojson territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m05_probe.geojson.zip --out territorios/extremadura/.cache/ddd/probes/ext03_m05_swaps.json --top 100
      - name: Publicar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT03-JSON-${{ github.run_id }}
          path: |
            territorios/extremadura/.cache/ddd/probes/ext03_json_manifest.json
            territorios/extremadura/.cache/ddd/probes/ext03_json_results.json
            territorios/extremadura/.cache/ddd/probes/ext03_m05_blockages.json
            territorios/extremadura/.cache/ddd/probes/ext03_m05_swaps.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m04_probe_informe.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m05_probe_informe.json
