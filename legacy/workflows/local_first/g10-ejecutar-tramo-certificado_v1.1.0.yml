# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.1.0
# NOMBRE: Ejecutar tramo certificado G10 por contrato
# QUÉ HACE: resuelve el territorio desde un contrato admitido, verifica checkpoints y ejecuta tramo sólo bajo orden explícita.
# CAMBIO: elimina la selección Aragón/Castilla y León codificada; el YAML suministra identidad, caché y rutas.
# ANTERIOR: legacy/workflows/g10-ejecutar-tramo-certificado_v1.0.2.yml
name: G10 Ejecutar tramo certificado

on:
  workflow_dispatch:
    inputs:
      params:
        description: YAML territorial admitido dentro del repositorio
        required: true
        default: territorios/aragon/config/aragon_2025.yaml
        type: string
      from_stage:
        description: Primera etapa semántica
        required: true
        default: DISTRICT_BALANCING
        type: string
      to_stage:
        description: Última etapa semántica
        required: true
        default: TERRITORIAL_CERTIFICATION
        type: string
      mode:
        description: verify_only o execute
        required: true
        default: verify_only
        type: string

permissions:
  contents: read

concurrency:
  group: g10-tramo-${{ inputs.params }}
  cancel-in-progress: false

jobs:
  tramo:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - id: setup
        shell: bash
        run: |
          set -euo pipefail
          params="${{ inputs.params }}"
          python herramientas/resolver_ejecucion_territorial.py --params "$params" --output decision.json
          case "${{ inputs.mode }}" in
            verify_only|execute) ;;
            *) echo "Modo no autorizado"; exit 21 ;;
          esac
          run_id="g10-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          territory="$(jq -r '.territory_id' decision.json)"
          cache_dir="$(jq -r '.cache_dir' decision.json)"
          echo "params=$(jq -r '.params' decision.json)" >> "$GITHUB_OUTPUT"
          echo "territory=$territory" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
          echo "run_dir=ejecuciones/$run_id" >> "$GITHUB_OUTPUT"
      - id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/g10_materializar_checkpoints.py --index orchestracion/checkpoints_fase1.json --territory "${{ steps.setup.outputs.territory }}" --from-stage "${{ inputs.from_stage }}" --cache-dir "${{ steps.setup.outputs.cache_dir }}" --run-dir "${{ steps.setup.outputs.run_dir }}" --report "${{ steps.setup.outputs.run_dir }}/MATERIALIZACION_G10.json"
          manifest="$(jq -r '.job.checkpoints[0].products_manifest' "${{ steps.setup.outputs.run_dir }}/MATERIALIZACION_G10.json")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      - name: Construir contenedor
        if: ${{ inputs.mode == 'execute' }}
        run: docker build --pull -t ddd-g10:${{ github.sha }} .
      - name: Ejecutar tramo autorizado
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app -e DDD_PARAMS="${{ steps.setup.outputs.params }}" -e DDD_RUN_ID="${{ steps.setup.outputs.run_id }}" -e DDD_FROM_STAGE="${{ inputs.from_stage }}" -e DDD_TO_STAGE="${{ inputs.to_stage }}" -e DDD_CHECKPOINT_MANIFEST="${{ steps.materialize.outputs.manifest }}" -e DDD_CHECKPOINT_CACHE_DIR="${{ steps.setup.outputs.cache_dir }}" --entrypoint /app/procedimiento.sh ddd-g10:${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g10-tramo-${{ steps.setup.outputs.territory }}-${{ github.run_id }}
          path: ${{ steps.setup.outputs.run_dir }}/
          if-no-files-found: warn
