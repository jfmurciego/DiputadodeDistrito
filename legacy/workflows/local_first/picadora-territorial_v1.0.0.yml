# PROYECTO: Diputado de Distrito
# CLASE: interfaz operativa principal
# VERSIÓN: 1.0.0
# NOMBRE: Picadora territorial manual
# FECHA: 2026-09-14
# ESTADO: vigente — R038/R040
# QUÉ HACE: ofrece un único botón para admitir, preparar, diagnosticar o producir un territorio del catálogo.
# CAMBIOS: primera versión.
# MOTIVO: permitir al propietario operar DDD desde GitHub Actions sin abrir un agente ni elegir workflows internos.
# ANTERIOR: ninguno — interfaz nueva.
name: Picadora territorial DDD

on:
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio del catálogo nacional
        required: true
        default: la_rioja
        type: choice
        options:
          - andalucia
          - aragon
          - principado_de_asturias
          - illes_balears
          - canarias
          - cantabria
          - castilla_la_mancha
          - castilla_y_leon
          - cataluna
          - comunidad_valenciana
          - extremadura
          - galicia
          - madrid
          - region_de_murcia
          - comunidad_foral_de_navarra
          - pais_vasco
          - la_rioja
          - ceuta
          - melilla
      operation:
        description: Operación de la fábrica
        required: true
        default: admit_only
        type: choice
        options:
          - admit_only
          - bootstrap_m01_m03
          - diagnose_topology
          - promote_m01_m03
          - produce_m01_m06
      execution_authorization:
        description: Para producir, escribir EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION
        required: false
        type: string

permissions:
  contents: read

jobs:
  admit:
    if: ${{ inputs.operation == 'admit_only' }}
    uses: ./.github/workflows/producir-territorio-por-contrato.yml
    with:
      params: territorios/${{ inputs.territory_id }}/config/${{ inputs.territory_id }}_2025.yaml
      mode: admit_only
      from_stage: TERRITORY_PREPARATION
      to_stage: TERRITORIAL_CERTIFICATION

  bootstrap:
    if: ${{ inputs.operation == 'bootstrap_m01_m03' }}
    uses: ./.github/workflows/_reutilizable-bootstrap-territorio.yml
    with:
      territory_id: ${{ inputs.territory_id }}

  diagnose:
    if: ${{ inputs.operation == 'diagnose_topology' }}
    uses: ./.github/workflows/_reutilizable-auditoria-topologica.yml
    with:
      territory_id: ${{ inputs.territory_id }}

  promote:
    if: ${{ inputs.operation == 'promote_m01_m03' }}
    uses: ./.github/workflows/_reutilizable-promocion-m01-m03.yml
    with:
      territory_id: ${{ inputs.territory_id }}

  produce:
    if: ${{ inputs.operation == 'produce_m01_m06' }}
    uses: ./.github/workflows/producir-territorio-por-contrato.yml
    with:
      params: territorios/${{ inputs.territory_id }}/config/${{ inputs.territory_id }}_2025.yaml
      mode: execute
      from_stage: TERRITORY_PREPARATION
      to_stage: TERRITORIAL_CERTIFICATION
      execution_authorization: ${{ inputs.execution_authorization }}
