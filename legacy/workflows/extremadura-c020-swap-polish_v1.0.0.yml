# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE: EXT-06 — Validación c020 + M05 swap-polish
# FECHA: 2026-09-11
# ESTADO: validación experimental.
# QUÉ HACE: reproduce exactamente el candidato c020 de EXT-05 y activa únicamente `swap_polish_max: 200`
# en M05 v7.5.0. Mide la mejora atribuible a la fase C determinista.
# MOTIVO: EXT-05 Run 34641298906 encontró 8 swaps 1×1 válidos que mejoran la función objetivo. Debe
# demostrarse si aplicarlos iterativamente cierra los cuatro outliers sin alterar restricciones duras.
# ANTERIOR: ninguno — workflow nuevo.
name: EXT-06 — C020 swap-polish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extremadura-c020-swap-polish.yml'
      - 'ddd_core/m05_swap_polish.py'
      - 'modulos/05_optimizar_distritos.py'
      - 'herramientas/construir_unidades_internas_m04.py'

permissions: {contents: read}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
      BASE: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
      CFG: territorios/extremadura/config/.generated_ext06_c020.yaml
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}

      - name: Fuentes y entorno
        run: |
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-ext06:${GITHUB_SHA} .

      - name: M01-M03
        run: |
          set -euo pipefail
          mkdir -p "$BASE"
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext06:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'

      - name: Construir unidades internas c020
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext06:${GITHUB_SHA} herramientas/construir_unidades_internas_m04.py \
            --geojson "$BASE/extremadura_2025_m01_secciones_poblacion.geojson.zip" \
            --graph "$BASE/extremadura_2025_m03_grafo.json" \
            --out-geojson "$BASE/extremadura_2025_ext06_c020_m04_input.geojson" \
            --out-report "$BASE/extremadura_2025_ext06_c020_units_report.json" \
            --k 65 --id-field CUSEC_KEY --municipality-field CUMUN --population-field POP_2025 \
            --partition-unit-field M04_PARTITION_UNIT --atomicity-ratio 1.10 --chunk-ratio 0.20
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd

      - name: Generar configuración con swap-polish
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext06:${GITHUB_SHA} -c '
          import copy,pathlib,yaml
          root=pathlib.Path("/app");cfg=yaml.safe_load((root/"territorios/extremadura/config/extremadura_2025.yaml").read_text());c=copy.deepcopy(cfg)
          c["modulos"]["modulo_04_generar_semillas"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_ext06_c020_m04_input.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_PARTITION_UNIT","municipality_name_field":"NMUN","k_districts":65,"municipality_atomicity_limit_ratio":1.10,"seed":12345,"out_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_ext06_c020_m04.geojson.zip","out_report":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_ext06_c020_m04_report.json"}
          c["modulos"]["modulo_05_optimizar_distritos"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_ext06_c020_m04.geojson.zip","id_field":"CUSEC_KEY","pop_field":"POP_{year}","district_field":"district_id","province_field":"CPRO","municipality_field":"CUMUN","greedy_moves_limit":1000,"anneal_iters":30000,"swap_polish_max":200,"seed":12345,"out_geojson":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_ext06_c020_m05.geojson.zip","out_report":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_ext06_c020_m05_report.json"}
          c["validation"].update({"expected_districts":65,"population_floor_ratio":.85,"population_cap_ratio":1.50,"target_tolerance_ratio":.10,"province_districts":{"06":41,"10":24}})
          (root/"territorios/extremadura/config/.generated_ext06_c020.yaml").write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True))'

      - name: M04→M05 v7.5.0
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext06:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params "$CFG"
          python herramientas/reparar_propiedad_geojson_zip.py --zip "$BASE/extremadura_2025_ext06_c020_m04.geojson.zip" --property ddd_unit_id --province-field CPRO --unit-field M04_PARTITION_UNIT --suffix P
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext06:${GITHUB_SHA} modulos/05_optimizar_distritos.py --params "$CFG"

      - name: Validar y resumir
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext06:${GITHUB_SHA} -c '
          import io,json,pathlib,zipfile,geopandas as gpd
          b=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025")
          with zipfile.ZipFile(b/"extremadura_2025_ext06_c020_m05.geojson.zip") as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          target=g.POP_2025.sum()/65;p=g.groupby("district_id").POP_2025.sum();spl=g.groupby("CUMUN").district_id.nunique();rep=json.loads((b/"extremadura_2025_ext06_c020_m05_report.json").read_text());o={"districts":int(g.district_id.nunique()),"outside_10":int(((p-target).abs()>target*.10).sum()),"max_abs_deviation":float(((p-target).abs()/target).max()),"min_pop":int(p.min()),"max_pop":int(p.max()),"split_municipalities":{str(k):int(v) for k,v in spl[spl>1].items()},"swap_polish":rep.get("swap_polish")};(b/"extremadura_2025_ext06_summary.json").write_text(json.dumps(o,ensure_ascii=False,indent=2));print(json.dumps(o,ensure_ascii=False));assert o["districts"]==65'

      - name: Publicar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT06-c020-${{ github.run_id }}
          path: |
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_ext06_c020_units_report.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_ext06_c020_m04_report.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_ext06_c020_m05_report.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_ext06_summary.json
