# =============================================================================
# VERSIÓN: 2.1.0
# CLASE: activo
# PROPÓSITO: construir y publicar el sitio público (mapa + datos) en GitHub Pages
#            para todos los territorios con geometría en sitio/geometria/.
# NOTA: la geometría de sitio/geometria/ es material de PUBLICACIÓN, no evidencia
#       de ejecución. Ver sitio/geometria/README.md.
# =============================================================================
name: Publicar sitio (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitio/**'
      - '.github/workflows/publicar-sitio.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm install -g mapshaper@0.6.109
          pip install pandas

      - name: Construir geometría
        run: |
          set -euo pipefail
          mkdir -p site/datos work
          IDS=""
          for ZIP in sitio/geometria/*_distritos.geojson.zip; do
            T=$(basename "$ZIP" _distritos.geojson.zip)
            echo "::group::$T"
            rm -rf work && mkdir -p work
            unzip -oq "$ZIP" -d work
            mapshaper work/*.geojson \
              -proj wgs84 \
              -simplify 8% keep-shapes method=visvalingam \
              -o format=topojson precision=0.00001 "site/datos/${T}_distritos.topojson"
            IDS="$IDS $T"
            echo "::endgroup::"
          done
          echo "$IDS" > /tmp/ids.txt

      - name: Construir datos de distrito (secciones y municipios)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pandas as pd, glob, json, os
          ids = open("/tmp/ids.txt").read().split()
          for t in ids:
              f = sorted(glob.glob(
                  f"territorios/{t}/resultados/ejecuciones/*/M06/composicion_distritos.csv"))[-1]
              c = pd.read_csv(f, dtype=str)
              # el nombre de la columna de población difiere entre territorios
              pc = [x for x in c.columns if x.startswith("POP_") or x == "section_pop"][0]
              c[pc] = pd.to_numeric(c[pc], errors="coerce").fillna(0)
              partidos = c.groupby("CUMUN").district_id.nunique()
              out = {}
              for did, g in c.groupby("district_id"):
                  mun = (g.groupby(["CUMUN", "NMUN"])
                           .agg(pop=(pc, "sum"), sec=("CUSEC_KEY", "size"))
                           .reset_index().sort_values("pop", ascending=False))
                  out[str(did)] = {
                      "pop": int(g[pc].sum()),
                      "secciones": int(len(g)),
                      "municipios": int(len(mun)),
                      "provincia": str(g["NPRO"].iloc[0]) if "NPRO" in g else "",
                      "lista": [{"n": r.NMUN, "p": int(r.pop), "s": int(r.sec),
                                 "parcial": bool(partidos[r.CUMUN] > 1)}
                                for r in mun.itertuples()],
                  }
              json.dump(out, open(f"site/datos/{t}_distritos.json", "w"), ensure_ascii=False)
              print(f"{t}: {len(out)} distritos, {os.path.getsize(f'site/datos/{t}_distritos.json')//1024} KB")
          json.dump([{"id": i} for i in ids], open("site/datos/territorios.json", "w"))
          PY

      - name: Copiar datos auxiliares
        run: |
          set -euo pipefail
          for T in $(cat /tmp/ids.txt); do
            CAT=$(ls -1 territorios/$T/resultados/ejecuciones/*/M06/catalogo_distritos.csv | tail -1)
            cp "$CAT" "site/datos/${T}_catalogo.csv"
            VAL=$(ls -1 territorios/$T/resultados/ejecuciones/*/VALIDACION.json | tail -1)
            cp "$VAL" "site/datos/${T}_validacion.json"
          done
          cp resultados/fase1/ESTADO_FACTUAL.json site/datos/estado_factual.json || true
          ls -lh site/datos/

      - name: Generar índice
        run: |
          set -euo pipefail
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Diputado de Distrito</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
          <style>
            html,body{margin:0;height:100%;font:15px/1.5 system-ui,-apple-system,sans-serif;color:#1a1a1a}
            #mapa{position:absolute;inset:0}
            #panel{position:absolute;top:14px;left:14px;z-index:1;background:#fff;
                   border-radius:10px;box-shadow:0 2px 14px #00000026;width:300px;
                   max-height:calc(100% - 44px);display:flex;flex-direction:column}
            .cab{padding:14px 16px 10px;border-bottom:1px solid #eee}
            .cuerpo{padding:12px 16px;overflow:auto}
            h1{font-size:14px;margin:0 0 10px;letter-spacing:.03em;text-transform:uppercase;color:#555}
            select{width:100%;padding:7px;font:inherit;border:1px solid #ccc;border-radius:6px}
            .did{font-size:19px;font-weight:600;margin-bottom:2px}
            .prov{color:#888;font-size:12px;margin-bottom:10px}
            .cifras{display:flex;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
            .cifra b{display:block;font-size:17px;font-weight:600}
            .cifra span{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em}
            .tit{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
            ul{list-style:none;margin:0;padding:0;font-size:13px}
            li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #fafafa}
            li i{font-style:normal;color:#b8860b;font-size:11px}
            li em{font-style:normal;color:#999;font-variant-numeric:tabular-nums;white-space:nowrap}
            .vacio{color:#999;font-size:13px}
            .nota{padding:10px 16px;border-top:1px solid #eee;color:#999;font-size:10.5px;line-height:1.4}
          </style>
          <div id="mapa"></div>
          <div id="panel">
            <div class="cab">
              <h1>Diputado de Distrito</h1>
              <select id="sel"></select>
            </div>
            <div class="cuerpo" id="info">
              <p class="vacio">Selecciona un distrito en el mapa.</p>
            </div>
            <div class="nota">
              Geometria derivada del seccionado censal 2025 (INE). Propuesta metodologica
              del proyecto; no reproduce ninguna norma vigente.
            </div>
          </div>
          <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
          <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
          <script>
          var NOMBRES = {aragon:'Aragon', castilla_y_leon:'Castilla y Leon', extremadura:'Extremadura'};
          var PALETA = ['#4e79a7','#f28e2b','#59a14f','#e15759','#b07aa1',
                        '#76b7b2','#edc948','#ff9da7','#9c755f','#86bcb6'];
          var datos = {}, sel;

          var mapa = new maplibregl.Map({
            container:'mapa',
            style:'https://demotiles.maplibre.org/style.json',
            center:[-4.5,40.8], zoom:5.6
          });

          var fmt = function(n){ return n.toLocaleString('es-ES'); };

          function cargar(t){
            return Promise.all([
              fetch('datos/'+t+'_distritos.topojson').then(function(r){return r.json();}),
              fetch('datos/'+t+'_distritos.json').then(function(r){return r.json();})
            ]).then(function(res){
              var topo = res[0]; datos = res[1];
              var capa = Object.keys(topo.objects)[0];
              var geo  = topojson.feature(topo, topo.objects[capa]);
              geo.features.forEach(function(f){
                f.properties._c = PALETA[parseInt(f.properties.district_id,10) % PALETA.length];
              });

              if (mapa.getLayer('relleno')) {
                mapa.removeLayer('relleno'); mapa.removeLayer('borde'); mapa.removeLayer('sel');
              }
              if (mapa.getSource('d')) mapa.removeSource('d');

              mapa.addSource('d', {type:'geojson', data:geo});
              mapa.addLayer({id:'relleno', type:'fill', source:'d',
                paint:{'fill-color':['get','_c'],'fill-opacity':0.62}});
              mapa.addLayer({id:'borde', type:'line', source:'d',
                paint:{'line-color':'#ffffff','line-width':0.8}});
              mapa.addLayer({id:'sel', type:'line', source:'d',
                paint:{'line-color':'#111','line-width':2.4},
                filter:['==','district_id','']});

              var x0=180,y0=90,x1=-180,y1=-90;
              var rec = function(c){
                if (typeof c[0]==='number'){
                  x0=Math.min(x0,c[0]); x1=Math.max(x1,c[0]);
                  y0=Math.min(y0,c[1]); y1=Math.max(y1,c[1]);
                } else c.forEach(rec);
              };
              geo.features.forEach(function(f){ rec(f.geometry.coordinates); });
              mapa.fitBounds([[x0,y0],[x1,y1]],
                {padding:{top:40,bottom:40,left:340,right:40}, duration:0});

              document.getElementById('info').innerHTML =
                '<p class="vacio">Selecciona un distrito en el mapa.</p>';
            });
          }

          function pintar(id){
            var d = datos[String(id)];
            if (!d) return;
            mapa.setFilter('sel', ['==', ['to-string',['get','district_id']], String(id)]);
            var items = d.lista.map(function(m){
              return '<li><span>'+m.n+(m.parcial?' <i>parcial</i>':'')+
                     '</span><em>'+fmt(m.p)+'</em></li>';
            }).join('');
            document.getElementById('info').innerHTML =
              '<div class="did">Distrito '+id+'</div>'+
              (d.provincia ? '<div class="prov">'+d.provincia+'</div>' : '')+
              '<div class="cifras">'+
                '<div class="cifra"><b>'+fmt(d.pop)+'</b><span>habitantes</span></div>'+
                '<div class="cifra"><b>'+d.secciones+'</b><span>secciones</span></div>'+
                '<div class="cifra"><b>'+d.municipios+'</b><span>municipios</span></div>'+
              '</div>'+
              '<div class="tit">Municipios</div><ul>'+items+'</ul>';
            document.querySelector('.cuerpo').scrollTop = 0;
          }

          fetch('datos/territorios.json').then(function(r){return r.json();}).then(function(lista){
            sel = document.getElementById('sel');
            sel.innerHTML = lista.map(function(t){
              return '<option value="'+t.id+'">'+(NOMBRES[t.id]||t.id)+'</option>';
            }).join('');
            sel.onchange = function(){ cargar(sel.value); };
            mapa.on('load', function(){
              cargar(sel.value);
              mapa.on('click','relleno', function(e){ pintar(e.features[0].properties.district_id); });
              mapa.on('mouseenter','relleno', function(){ mapa.getCanvas().style.cursor='pointer'; });
              mapa.on('mouseleave','relleno', function(){ mapa.getCanvas().style.cursor=''; });
            });
          });
          </script>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
