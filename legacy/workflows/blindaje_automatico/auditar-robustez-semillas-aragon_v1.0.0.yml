# PROYECTO: Diputado de Distrito
# CLASE: auditoría manual/reproducible
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: C-01 — 50 semillas M05 sobre baseline certificado
# FECHA: 2026-09-13
# ESTADO: candidato C-01
# QUÉ HACE: reutiliza M03/M04 del run certificado 34599224954 y ejecuta solo
# M05 para 50-200 semillas; publica evidencia compacta de población y forma.
# REGLAS: no ejecuta M01-M04/M06-M08 y no consume datos electorales.
# ANTERIOR: ninguno — workflow nuevo.
name: C-01 — Robustez frente a semilla Aragón

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Número de semillas (50-200)
        required: true
        default: '50'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditar-robustez-semillas-aragon.yml'

permissions:
  contents: read
  actions: read

jobs:
  c01:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SAMPLES: ${{ inputs.samples || '50' }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}

      - name: Recuperar M03 certificado
        uses: actions/download-artifact@v6
        with:
          name: gh-34599224954-1-M03-grafo
          path: baseline/m03
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jfmurciego/DiputadodeDistrito
          run-id: '34599224954'

      - name: Recuperar M04 certificado
        uses: actions/download-artifact@v6
        with:
          name: gh-34599224954-1-M04-semillas
          path: baseline/m04
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jfmurciego/DiputadodeDistrito
          run-id: '34599224954'

      - name: Verificar baseline inmutable
        shell: bash
        run: |
          set -euo pipefail
          graph="$(find baseline/m03 -type f -name 'aragon_2025_m03_grafo.json' -print -quit)"
          initial="$(find baseline/m04 -type f -name 'aragon_2025_m04_semillas.geojson.zip' -print -quit)"
          test -n "$graph" && test -n "$initial"
          echo "9cd82e3d4cc0a813b37f84f5340e5126d12f8bd8f915cd440e862f6eb6e9476a  $graph" | sha256sum -c -
          echo "0d3b4ffbdeb970467dd4247084572afc6607e3d384599fdd6f9853f121fa2e26  $initial" | sha256sum -c -

      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-c01:${GITHUB_SHA} .

      - name: Ejecutar solo M05 con múltiples semillas
        shell: bash
        run: |
          set -euo pipefail
          graph="$(find baseline/m03 -type f -name 'aragon_2025_m03_grafo.json' -print -quit)"
          initial="$(find baseline/m04 -type f -name 'aragon_2025_m04_semillas.geojson.zip' -print -quit)"
          mkdir -p evidencia-c01
          docker run --rm \
            -v "$PWD/baseline:/baseline:ro" \
            -v "$PWD/evidencia-c01:/evidencia" \
            --entrypoint python ddd-c01:${GITHUB_SHA} \
            herramientas/auditar_robustez_semillas.py \
            --params territorios/aragon/config/aragon_2025.yaml \
            --graph "/${graph}" \
            --initial "/${initial}" \
            --output-dir /evidencia \
            --samples "$SAMPLES" \
            --canonical-seed 12345

      - name: Publicar evidencia C-01
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencia-C01-semillas-aragon-${{ github.run_id }}
          path: evidencia-c01/*
          if-no-files-found: error
          retention-days: 90
