# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE: Exportar Aragón para Flourish
# ESTADO: lanzamiento único solicitado
# QUÉ HACE: reproyecta el GeoJSON final existente de EPSG:25830 a WGS84; no ejecuta el motor.
name: Exportar Aragón final para Flourish

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exportar-aragon-flourish.yml'

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Reproyectar a WGS84
        run: |
          docker build --pull -t ddd-flourish:$GITHUB_SHA .
          docker run --rm -i -v "$PWD:/work" -w /work --entrypoint python ddd-flourish:$GITHUB_SHA - <<'PY'
          import json
          from pathlib import Path
          from pyproj import Transformer
          source=Path("resultados/finales/aragon/distritos.geojson")
          target=Path("resultados/finales/aragon/distritos_flourish.geojson")
          data=json.loads(source.read_text(encoding="utf-8"))
          transform=Transformer.from_crs("EPSG:25830","EPSG:4326",always_xy=True).transform
          def coords(v):
              if isinstance(v[0],(int,float)):
                  x,y=transform(v[0],v[1]); return [x,y]
              return [coords(x) for x in v]
          for feature in data["features"]:
              feature["geometry"]["coordinates"]=coords(feature["geometry"]["coordinates"])
          data.pop("crs",None)
          data["name"]="aragon_distritos_flourish_wgs84"
          target.write_text(json.dumps(data,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          PY
          python3 - <<'PY'
          import json
          p="resultados/finales/aragon/distritos_flourish.geojson"
          d=json.load(open(p,encoding="utf-8"))
          assert d["type"]=="FeatureCollection" and len(d["features"])==67
          x,y=d["features"][0]["geometry"]["coordinates"][0][0][0]
          assert -10 < x < 10 and 35 < y < 50
          PY
      - name: Persistir exportación
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resultados/finales/aragon/distritos_flourish.geojson
          git diff --cached --quiet || git commit -m "data: exportar Aragón WGS84 para Flourish"
          git push
