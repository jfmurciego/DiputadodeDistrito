# PROYECTO: Diputado de Distrito
# VERSIÓN: 2.3.0
# NOMBRE DE VERSIÓN: Preparación territorial independiente de la distritación
# FECHA: 2026-09-11
# ESTADO: candidato
# QUÉ HACE: separa la preparación M01-M03, que debe poder cachearse con éxito, de la ejecución M04-M08 y su validación.
# POR QUÉ CAMBIA: un FAIL esperado en M05 no debe impedir conservar una preparación territorial válida ni forzar nuevas descargas LFS.
# ANTERIOR: legacy/workflows/procedimiento-ddd_v2.2.0.yml
name: Procedimiento DDD — Aragón
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Modo de ejecución
        type: choice
        required: true
        default: iterativo
        options: [iterativo, completo]
permissions: {contents: read}
jobs:
  preparar-territorio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      clave: ${{ steps.prep-key.outputs.key }}
    steps:
      - name: Obtener código sin descargar LFS pesado
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Preparar cálculo de identidad territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Calcular clave de preparación M01-M03
        id: prep-key
        shell: bash
        run: echo "key=$(python herramientas/calcular_clave_preparacion.py --params configuracion/aragon_2025.yaml)" >> "$GITHUB_OUTPUT"
      - name: Restaurar preparación territorial
        id: cache-base
        uses: actions/cache@v4
        with:
          path: .cache/ddd/preparacion
          key: ddd-aragon-preparacion-${{ steps.prep-key.outputs.key }}
      - name: Materializar fuentes nacionales solo si hay que preparar
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="inputs/seccionado_2025.zip,inputs/65034.csv.zip" --exclude=""
          grep -E 'seccionado_2025.zip|65034.csv.zip' inputs/MANIFEST.sha256 | sha256sum -c -
      - name: Construir entorno para preparación
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        run: docker build --pull -t ddd-prep:${{ github.sha }} .
      - name: Construir M01-M03
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/ddd/preparacion/aragon_2025
          mkdir -p .cache/ddd/preparacion
          docker run --rm --entrypoint bash \
            -e DDD_PARAMS="configuracion/aragon_2025.yaml" \
            -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/.cache/ddd:/app/.cache/ddd" \
            ddd-prep:${GITHUB_SHA} -lc 'python modulos/01_preparar_base_territorial.py --params "$DDD_PARAMS" && python modulos/02_construir_adyacencias.py --params "$DDD_PARAMS" && python modulos/03_construir_grafo.py --params "$DDD_PARAMS"'
      - name: Comprobar preparación disponible
        run: test -f .cache/ddd/preparacion/aragon_2025/aragon_2025_m03_grafo.json

  ejecutar-distritacion:
    needs: preparar-territorio
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DDD_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obtener código sin descargar LFS pesado
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Restaurar preparación M01-M03
        uses: actions/cache/restore@v4
        with:
          path: .cache/ddd/preparacion
          key: ddd-aragon-preparacion-${{ needs.preparar-territorio.outputs.clave }}
          fail-on-cache-miss: true
      - name: Verificar entrada electoral
        shell: bash
        run: |
          set -euo pipefail
          test -f inputs/rtve_aragon_2026_secciones.json || { echo 'Falta inputs/rtve_aragon_2026_secciones.json'; exit 20; }
          grep 'rtve_aragon_2026_secciones.json' inputs/MANIFEST.sha256 | sha256sum -c -
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd:${{ github.sha }} .
      - name: Ejecutar M04-M08 y puerta de calidad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "ejecuciones/$DDD_RUN_ID" .cache/ddd/preparacion
          docker run --rm \
            -e GITHUB_SHA="$GITHUB_SHA" -e GITHUB_RUN_ID="$GITHUB_RUN_ID" -e DDD_RUN_ID="$DDD_RUN_ID" \
            -e DDD_MODO="iterativo" -e DDD_PARAMS="configuracion/aragon_2025.yaml" \
            -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/ejecuciones:/app/ejecuciones" -v "$PWD/.cache/ddd:/app/.cache/ddd" \
            ddd:${GITHUB_SHA}
      - name: Guardar ejecución y trazabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddd-aragon-${{ env.DDD_RUN_ID }}-${{ github.sha }}
          path: ejecuciones/${{ env.DDD_RUN_ID }}/**
          if-no-files-found: warn
          retention-days: 90
