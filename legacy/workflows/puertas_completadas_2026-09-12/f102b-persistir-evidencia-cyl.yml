# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: F1.2b — Evidencia durable Castilla y León
# FECHA: 2026-09-12
# ESTADO: puerta de auditoría
# QUÉ HACE: descarga el artefacto de una regresión M01-M06 SUCCESS, recompone invariantes sin ejecutar el motor y persiste evidencia ligera con hashes.
# CAMBIOS: primera versión.
# MOTIVO: cerrar la deuda de evidencia durable de F1.2 antes de consolidar el contrato común.
# ANTERIOR: ninguno — workflow nuevo.
name: F1.2b — Persistir evidencia Castilla y León

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run SUCCESS de Regresión M06 — Castilla y León
        required: true
        default: '34701897922'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/f102b-persistir-evidencia-cyl.yml'

permissions:
  actions: read
  contents: write

jobs:
  persistir:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN: ${{ inputs.source_run || '34701897922' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - name: Descargar artefacto canónico
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .conclusion)" = success
          ARTIFACT="castilla-y-leon-regresion-M06-${SOURCE_RUN}"
          mkdir -p .tmp/cyl
          gh run download "${SOURCE_RUN}" -n "${ARTIFACT}" -D .tmp/cyl
      - name: Recomputar invariantes y materializar
        shell: bash
        run: |
          set -euo pipefail
          OUT="territorios/castilla_y_leon/resultados/ejecuciones/gh-${SOURCE_RUN}-1"
          mkdir -p "${OUT}/M03" "${OUT}/M05" "${OUT}/M06"
          GRAPH=$(find .tmp/cyl -type f -name '*_m03_grafo.json' -print -quit)
          M05=$(find .tmp/cyl -type f -name '*_m05_informe.json' -print -quit)
          SUMMARY=$(find .tmp/cyl -type f -name '*_m06_resumen_distritos.csv' -print -quit)
          CATALOG=$(find .tmp/cyl -type f -name '*_m06_catalogo_distritos.csv' -print -quit)
          COMP=$(find .tmp/cyl -type f -name '*_m06_composicion_distritos.csv' -print -quit)
          test -n "${GRAPH}" && test -n "${M05}" && test -n "${SUMMARY}" && test -n "${CATALOG}" && test -n "${COMP}"
          cp "${GRAPH}" "${OUT}/M03/grafo.json"
          cp "${M05}" "${OUT}/M05/informe.json"
          cp "${SUMMARY}" "${OUT}/M06/resumen_distritos.csv"
          cp "${CATALOG}" "${OUT}/M06/catalogo_distritos.csv"
          cp "${COMP}" "${OUT}/M06/composicion_distritos.csv"
          export OUT
          python - <<'PY'
          import csv, hashlib, json, os
          from collections import defaultdict, deque
          from pathlib import Path
          out=Path(os.environ["OUT"])
          def rows(p):
              with p.open(encoding="utf-8-sig",newline="") as f:return list(csv.DictReader(f))
          summary=rows(out/"M06/resumen_distritos.csv")
          catalog=rows(out/"M06/catalogo_distritos.csv")
          comp=rows(out/"M06/composicion_distritos.csv")
          graph=json.loads((out/"M03/grafo.json").read_text())
          def val(row,*names):
              for n in names:
                  if n in row and row[n]!="": return row[n]
              raise AssertionError(names)
          district=lambda r:str(val(r,"district_id"))
          section=lambda r:str(val(r,"CUSEC_KEY","section_id")).zfill(10)
          population=lambda r:int(round(float(val(r,"section_pop","POP_2025","population"))))
          assert len(summary)==len(catalog)==82
          assert len(comp)==3506
          assert sum(int(round(float(val(r,"district_pop","population")))) for r in summary)==2401221
          assert sum(population(r) for r in comp)==2401221
          assert all(str(val(r,"within_hard_bounds","within_hard_limits")).lower() in ("true","1") for r in summary)
          assert all(str(val(r,"within_target_tolerance")).lower() in ("true","1") for r in summary)
          maxdev=max(abs(float(val(r,"relative_deviation"))) for r in summary)
          assert maxdev <= 0.119836116709 + 1e-9
          by_d=defaultdict(set); provinces=defaultdict(set)
          for r in comp:
              d=district(r);by_d[d].add(section(r));provinces[d].add(str(val(r,"CPRO")).zfill(2))
          assert len(by_d)==82 and all(len(v)==1 for v in provinces.values())
          quotas=defaultdict(int)
          for ps in provinces.values():quotas[next(iter(ps))]+=1
          expected={"05":6,"09":12,"24":15,"34":6,"37":11,"40":5,"42":3,"47":18,"49":6}
          assert dict(sorted(quotas.items()))==expected
          adj=defaultdict(set)
          for n in graph["nodes"]:adj[str(n["id"]).zfill(10)]
          for e in graph["edges"]:
              u,v=str(e["u"]).zfill(10),str(e["v"]).zfill(10);adj[u].add(v);adj[v].add(u)
          for d,nodes in by_d.items():
              seen={next(iter(nodes))};q=deque(seen)
              while q:
                  u=q.popleft()
                  for v in adj[u]:
                      if v in nodes and v not in seen:seen.add(v);q.append(v)
              assert seen==nodes,(d,len(seen),len(nodes))
          validation={"status":"PASS","source_run":int(os.environ["SOURCE_RUN"]),"sections":3506,"population":2401221,"districts":82,"province_districts":expected,"contiguous_districts":82,"within_hard_bounds":82,"within_target_tolerance":82,"max_relative_deviation":maxdev,"ratchet":0.119836116709,"recomputation":"independent_from_published_graph_and_composition"}
          (out/"VALIDACION.json").write_text(json.dumps(validation,ensure_ascii=False,indent=2)+"\n")
          products=[]
          for p in sorted(out.rglob("*")):
              if p.is_file() and p.name not in {"MANIFIESTO_EJECUCION.json","README.md"}:
                  products.append({"path":str(p.relative_to(out)),"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={"territory_id":"castilla_y_leon","run_id":f"gh-{os.environ['SOURCE_RUN']}-1","source_workflow_run":int(os.environ["SOURCE_RUN"]),"source_commit":"1563f209dbf302dfbbbf23d6cd43796f6ee6e3e9","artifact_id":10300835012,"artifact_digest":"sha256:d1e26827ffe240c382f81d4539b63c240ed7162bcdf33cd0c784d7267d2b7edc","reconstructed_after_run":True,"products":products}
          (out/"MANIFIESTO_EJECUCION.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          (out/"README.md").write_text("# Castilla y León — evidencia canónica M01–M06\n\nEvidencia ligera materializada desde la regresión GitHub Actions "+os.environ["SOURCE_RUN"]+". Las geometrías pesadas permanecen en el artefacto original; el manifiesto conserva su identidad y digest. VALIDACION.json recompone población, cuotas y contigüidad sin reejecutar el motor.\n")
          PY
      - name: Persistir evidencia
        shell: bash
        run: |
          set -euo pipefail
          OUT="territorios/castilla_y_leon/resultados/ejecuciones/gh-${SOURCE_RUN}-1"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${OUT}"
          git diff --cached --quiet && exit 0
          git commit -m "F1.2b: persistir evidencia canónica Castilla y León"
          git push
