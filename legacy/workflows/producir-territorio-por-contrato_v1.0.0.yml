# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE: Línea territorial única por contrato
# FECHA: 2026-09-13
# ESTADO: vigente — R035.2
# QUÉ HACE: admite, verifica o ejecuta M01–M06 para cualquier contrato DDD sin seleccionar territorios en código.
# MOTIVO: convertir la incorporación futura en contrato + fuentes + autorización, no en un workflow artesanal.
# ANTERIOR: ninguno — workflow nuevo.
name: Producción territorial por contrato

on:
  workflow_dispatch:
    inputs:
      params:
        description: YAML territorial versionado dentro del repositorio
        required: true
        default: territorios/aragon/config/aragon_2025.yaml
        type: string
      mode:
        description: admit_only, verify_only o execute
        required: true
        default: admit_only
        type: choice
        options: [admit_only, verify_only, execute]
      from_stage:
        description: Primera fase semántica
        required: true
        default: TERRITORY_PREPARATION
        type: string
      to_stage:
        description: Última fase semántica
        required: true
        default: TERRITORIAL_CERTIFICATION
        type: string
      execution_authorization:
        description: "Obligatorio sólo para execute: EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ddd-production-${{ inputs.params }}
  cancel-in-progress: false

jobs:
  contract_to_line:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PARAMS: ${{ inputs.params }}
      MODE: ${{ inputs.mode }}
      AUTHORIZATION: ${{ inputs.execution_authorization }}
      FROM_STAGE: ${{ inputs.from_stage }}
      TO_STAGE: ${{ inputs.to_stage }}
    steps:
      - uses: actions/checkout@v6
      - name: Admitir contrato antes de cualquier cálculo
        run: python herramientas/resolver_ejecucion_territorial.py --params "$PARAMS" --output decision.json
      - name: Prohibir cálculo sin autorización explícita
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION" || {
            echo "execute requiere autorización explícita; no se inicia M01–M06." >&2
            exit 21
          }
      - name: Verificar que el modo no calcula
        if: ${{ inputs.mode != 'execute' }}
        run: |
          set -euo pipefail
          test "$MODE" = "admit_only" || test "$MODE" = "verify_only"
          echo "Modo $MODE: contrato resuelto; ningún módulo territorial ejecutado."
      - name: Reconstruir fuentes sólo para ejecución autorizada
        if: ${{ inputs.mode == 'execute' }}
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          test -s inputs/seccionado_2025.zip
          test -s inputs/65034.csv.zip
      - name: Ejecutar tramo común autorizado
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="production-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull -t ddd-production:${GITHUB_SHA} .
          docker run --rm -v "$PWD:/app" -w /app \
            -e DDD_PARAMS="$PARAMS" \
            -e DDD_RUN_ID="$run_id" \
            -e DDD_FROM_STAGE="$FROM_STAGE" \
            -e DDD_TO_STAGE="$TO_STAGE" \
            --entrypoint /app/procedimiento.sh ddd-production:${GITHUB_SHA}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ddd-contract-decision-${{ github.run_id }}
          path: decision.json
