# PROYECTO: Diputado de Distrito
# VERSIÓN: 2.6.0
# NOMBRE DE VERSIÓN: Resultados visibles por módulo
# FECHA: 2026-09-11
# ESTADO: candidato
# QUÉ HACE: mantiene preparación territorial serializada y ejecución iterativa, y publica en el repositorio un índice ligero navegable de outputs por módulo para cada ejecución.
# CAMBIOS VS 2.5.2: añade publicación de informes/CSV/logs ligeros en `resultados/ejecuciones/{run_id}/M01..M08`, manifiesto, validación y enlace al artefacto pesado; mantiene GeoJSON pesados fuera del historial Git.
# MOTIVO: dar visibilidad directa al usuario sin inflar el repositorio ~20 MB por ejecución.
# ANTERIOR: legacy/workflows/procedimiento-ddd_v2.5.2.yml
name: Procedimiento DDD — Aragón
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Modo de ejecución
        type: choice
        required: true
        default: iterativo
        options: [iterativo, completo]
permissions: {contents: read}
jobs:
  preparar-territorio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ddd-preparacion-aragon-2025
      cancel-in-progress: false
    outputs:
      clave: ${{ steps.prep-key.outputs.key }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Preparar cálculo de identidad territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Calcular clave de preparación M01-M03
        id: prep-key
        shell: bash
        run: |
          set -euo pipefail
          key="$(python herramientas/calcular_clave_preparacion.py --params configuracion/aragon_2025.yaml)"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]] || { echo "Clave de preparación inválida: '$key'" >&2; exit 21; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restaurar preparación territorial
        id: cache-base
        uses: actions/cache@v6
        with:
          path: .cache/ddd/preparacion
          key: ddd-aragon-preparacion-${{ steps.prep-key.outputs.key }}
      - name: Reconstruir fuentes canónicas desde partes
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f inputs/partes/reconstruir_fuentes.sh || { echo 'Falta inputs/partes/reconstruir_fuentes.sh'; exit 30; }
          bash inputs/partes/reconstruir_fuentes.sh
          test -s inputs/seccionado_2025.zip
          test -s inputs/65034.csv.zip
          grep -E 'seccionado_2025.zip|65034.csv.zip' inputs/MANIFEST.sha256 | sha256sum -c -
      - name: Construir entorno para preparación
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        run: docker build --pull -t ddd-prep:${{ github.sha }} .
      - name: Construir M01-M03
        if: ${{ inputs.modo == 'completo' || steps.cache-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/ddd/preparacion/aragon_2025
          mkdir -p .cache/ddd/preparacion
          docker run --rm --entrypoint bash \
            -e DDD_PARAMS="configuracion/aragon_2025.yaml" \
            -v "$PWD/inputs:/app/inputs:ro" \
            -v "$PWD/.cache/ddd:/app/.cache/ddd" \
            ddd-prep:${GITHUB_SHA} -lc 'python modulos/01_preparar_base_territorial.py --params "$DDD_PARAMS" && python modulos/02_construir_adyacencias.py --params "$DDD_PARAMS" && python modulos/03_construir_grafo.py --params "$DDD_PARAMS"'
      - name: Comprobar preparación disponible
        run: test -f .cache/ddd/preparacion/aragon_2025/aragon_2025_m03_grafo.json

  ejecutar-distritacion:
    needs: preparar-territorio
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DDD_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Restaurar preparación M01-M03
        uses: actions/cache/restore@v6
        with:
          path: .cache/ddd/preparacion
          key: ddd-aragon-preparacion-${{ needs.preparar-territorio.outputs.clave }}
          fail-on-cache-miss: true
      - name: Verificar entrada electoral
        shell: bash
        run: |
          set -euo pipefail
          test -f inputs/rtve_aragon_2026_secciones.json || { echo 'Falta inputs/rtve_aragon_2026_secciones.json'; exit 20; }
          grep 'rtve_aragon_2026_secciones.json' inputs/MANIFEST.sha256 | sha256sum -c -
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd:${{ github.sha }} .
      - name: Ejecutar M04-M08 y puerta de calidad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "ejecuciones/$DDD_RUN_ID" .cache/ddd/preparacion
          docker run --rm \
            -e GITHUB_SHA="$GITHUB_SHA" -e GITHUB_RUN_ID="$GITHUB_RUN_ID" -e DDD_RUN_ID="$DDD_RUN_ID" \
            -e DDD_MODO="iterativo" -e DDD_PARAMS="configuracion/aragon_2025.yaml" \
            -v "$PWD/inputs:/app/inputs:ro" \
            -v "$PWD/ejecuciones:/app/ejecuciones" \
            -v "$PWD/.cache/ddd:/app/.cache/ddd" \
            ddd:${GITHUB_SHA}
      - name: Guardar ejecución y trazabilidad
        id: artefacto
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-aragon-${{ env.DDD_RUN_ID }}-${{ github.sha }}
          path: ejecuciones/${{ env.DDD_RUN_ID }}/**
          if-no-files-found: warn
          retention-days: 90
      - name: Publicar outputs ligeros por módulo en GitHub
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artefacto.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artefacto.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          src="ejecuciones/$DDD_RUN_ID"
          dst="resultados/ejecuciones/$DDD_RUN_ID"
          mkdir -p "$dst"/{M01,M02,M03,M04,M05,M06,M07,M08}

          cp .cache/ddd/preparacion/aragon_2025/aragon_2025_m01_informe.json "$dst/M01/" 2>/dev/null || true
          if [[ -f .cache/ddd/preparacion/aragon_2025/aragon_2025_m02_adyacencias.jsonl ]]; then
            printf 'edges=%s\n' "$(wc -l < .cache/ddd/preparacion/aragon_2025/aragon_2025_m02_adyacencias.jsonl | tr -d ' ')" > "$dst/M02/resumen.txt"
          fi
          cp .cache/ddd/preparacion/aragon_2025/aragon_2025_m03_informe.json "$dst/M03/" 2>/dev/null || true

          cp "$src/aragon_2025_m04_informe.json" "$dst/M04/" 2>/dev/null || true
          cp "$src/logs/modulo_04.log" "$dst/M04/" 2>/dev/null || true
          cp "$src/aragon_2025_m05_informe.json" "$dst/M05/" 2>/dev/null || true
          cp "$src/logs/modulo_05.log" "$dst/M05/" 2>/dev/null || true
          cp "$src/aragon_2025_m06_resumen_distritos.csv" "$dst/M06/" 2>/dev/null || true
          cp "$src/logs/modulo_06.log" "$dst/M06/" 2>/dev/null || true
          cp "$src/aragon_2025_m07_resultados_partido.csv" "$dst/M07/" 2>/dev/null || true
          cp "$src/aragon_2025_m07_resumen_electoral.csv" "$dst/M07/" 2>/dev/null || true
          cp "$src/logs/modulo_07.log" "$dst/M07/" 2>/dev/null || true
          cp "$src/logs/modulo_08.log" "$dst/M08/" 2>/dev/null || true
          cp "$src/VALIDACION.json" "$dst/" 2>/dev/null || true
          cp "$src/MANIFIESTO_EJECUCION.json" "$dst/" 2>/dev/null || true

          cat > "$dst/README.md" <<EOF
          # Ejecución $DDD_RUN_ID

          - GitHub run: $GITHUB_RUN_ID
          - Commit ejecutado: $GITHUB_SHA
          - Artefacto pesado: $ARTIFACT_URL
          - SHA-256 artefacto: $ARTIFACT_DIGEST

          Los directorios M01-M08 contienen únicamente outputs ligeros navegables. Los GeoJSON ZIP completos permanecen en el artefacto de GitHub Actions para evitar inflar el historial Git.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git diff --cached --quiet && exit 0
          git commit -m "results: publish $DDD_RUN_ID module outputs"
          for intento in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 2))
          done
          echo "No se pudo publicar el índice ligero tras 3 intentos" >&2
          exit 41
