# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Auditoría topológica M02-M03 — Extremadura
# FECHA: 2026-09-11
# ESTADO: diagnóstico EXT-02
# QUÉ HACE: ejecuta M01-M03 sin pasarelas topológicas y conserva el informe aunque M03 detecte componentes administrativos desconectados.
# CAMBIOS: workflow diagnóstico nuevo; no corrige ni oculta singularidades.
# MOTIVO: descubrir primero exclaves, huecos cartográficos o municipios multipartes antes de declarar excepciones y antes de abrir M04.
# ANTERIOR: ninguno — workflow nuevo.
name: Auditoría M02-M03 — Extremadura

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditar-topologia-extremadura.yml'
      - 'territorios/extremadura/config/extremadura_2025.yaml'
      - 'modulos/02_construir_adyacencias.py'
      - 'modulos/03_construir_grafo.py'

permissions:
  contents: read

jobs:
  auditoria-topologica:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}

      - name: Reconstruir fuentes nacionales
        shell: bash
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          test -s inputs/seccionado_2025.zip
          test -s inputs/65034.csv.zip

      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-ext-topology:${GITHUB_SHA} .

      - name: Ejecutar M01-M03 diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p territorios/extremadura/.cache/ddd/preparacion
          docker run --rm \
            -e PARAMS="$PARAMS" \
            -v "$PWD/inputs:/app/inputs:ro" \
            -v "$PWD/territorios/extremadura:/app/territorios/extremadura" \
            --entrypoint bash ddd-ext-topology:${GITHUB_SHA} -lc '
              set -euo pipefail
              python modulos/01_preparar_base_territorial.py --params "$PARAMS"
              python modulos/02_construir_adyacencias.py --params "$PARAMS"
              set +e
              python modulos/03_construir_grafo.py --params "$PARAMS"
              rc=$?
              set -e
              echo "$rc" > /app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m03_exit_code.txt
              exit 0
            '

      - name: Resumir diagnóstico EXT-02
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/territorios/extremadura:/app/territorios/extremadura" \
            --entrypoint python ddd-ext-topology:${GITHUB_SHA} -c '
          import json,pathlib
          base=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025")
          rep=json.loads((base/"extremadura_2025_m03_informe.json").read_text())
          rc=int((base/"extremadura_2025_m03_exit_code.txt").read_text().strip())
          pa=rep["province_component_audit"]
          ma=rep["municipality_component_audit"]
          print(f"EXT-02 DIAGNOSTIC nodes={rep['nodes']} edges={rep['edges']} isolated={rep['isolated']} province_bad={pa['disconnected']} municipality_bad={ma['disconnected']} m03_rc={rc}")
          if pa["disconnected"]:
              print("PROVINCE_VIOLATIONS="+json.dumps([v for v in pa.get("details",{}).items() if v[1].get("components",1)>1],ensure_ascii=False))
          if ma["disconnected"]:
              print("MUNICIPALITY_VIOLATIONS="+json.dumps(ma.get("violations",[]),ensure_ascii=False))
          '

      - name: Publicar diagnóstico EXT-02
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT02-${{ github.run_id }}
          path: |
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m01_informe.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m02_adyacencias.jsonl
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m03_grafo.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m03_informe.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m03_exit_code.txt
