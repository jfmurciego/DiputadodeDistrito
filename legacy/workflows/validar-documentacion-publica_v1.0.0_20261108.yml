# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# FECHA: 2026-11-03
# ESTADO: validación documental sin despliegue
# ANTERIOR: archivo nuevo
name: Validar documentación pública
on:
  pull_request:
    paths:
      - 'documentacion_publica/**'
      - '.github/workflows/validar-documentacion-publica.yml'
  push:
    branches: [main]
    paths:
      - 'documentacion_publica/**'
      - '.github/workflows/validar-documentacion-publica.yml'
permissions:
  contents: read
concurrency:
  group: docs-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement documentacion_publica/requirements.lock
      - run: python -m unittest discover -s documentacion_publica/auditoria -p 'test_*.py' -v
      - run: zensical build --strict --clean -f documentacion_publica/zensical.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-documentacion-${{ github.sha }}
          path: documentacion_publica/site
          if-no-files-found: error
          retention-days: 14
