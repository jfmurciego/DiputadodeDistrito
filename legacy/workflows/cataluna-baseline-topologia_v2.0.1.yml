# PROYECTO: Diputado de Distrito
# VERSIÓN: 2.0.1
# NOMBRE DE VERSIÓN: CAT-02 — entorno de diagnóstico corregido
# FECHA: 2026-09-12
# ESTADO: diagnóstico; no añade pasarelas.
# QUÉ HACE: reproduce M01-M03, captura el fallo estricto y certifica geométricamente el componente aislado antes de CAT-03.
# CAMBIOS: pasa BASE explícitamente al contenedor; conserva sin cambios el contrato diagnóstico y los artefactos separados.
# MOTIVO: el primer run CAT-02 34688010519 no encontró los ficheros porque BASE no estaba exportada dentro del contenedor.
# ANTERIOR: legacy/workflows/cataluna-baseline-topologia_v2.0.0.yml
name: CAT-02 — Cataluña auditoría topológica
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cataluna-baseline-topologia.yml'
      - 'territorios/cataluna/config/cataluna_2025.yaml'
      - 'modulos/03_construir_grafo.py'
      - 'herramientas/auditar_geometria_componentes.py'
permissions: {contents: read}
jobs:
  cat02:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PARAMS: territorios/cataluna/config/cataluna_2025.yaml
      BASE: territorios/cataluna/.cache/ddd/preparacion/cataluna_2025
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-cat02:${GITHUB_SHA} .
      - name: M01-M03 y diagnóstico geométrico
        run: |
          set -euo pipefail
          docker run --rm -e PARAMS="$PARAMS" -e BASE="$BASE" -v "$PWD:/app" --entrypoint bash ddd-cat02:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            set +e
            python modulos/03_construir_grafo.py --params "$PARAMS"
            rc=$?
            set -e
            echo "$rc" > "$BASE/cataluna_2025_m03_exit_code.txt"
            python herramientas/auditar_geometria_componentes.py --geojson "$BASE/cataluna_2025_m01_secciones_poblacion.geojson.zip" --graph "$BASE/cataluna_2025_m03_grafo.json" --out "$BASE/cataluna_2025_m03_relaciones_geometricas.json" --nearest 8'
          sudo chown -R "$(id -u):$(id -g)" "$BASE"
      - name: Certificar CAT-02
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,os
          b=pathlib.Path(os.environ["BASE"]);m1=json.loads((b/"cataluna_2025_m01_informe.json").read_text());m3=json.loads((b/"cataluna_2025_m03_informe.json").read_text());geo=json.loads((b/"cataluna_2025_m03_relaciones_geometricas.json").read_text());rc=int((b/"cataluna_2025_m03_exit_code.txt").read_text())
          pa=m3["province_component_audit"];ma=m3["municipality_component_audit"];find=geo["province_disconnected_components"]
          assert rc!=0 and m1["rows_out"]==5143 and m1["missing_population_rows"]==0
          assert m3["nodes"]==5143 and m3["edges"]==14375 and m3["isolated"]==1 and m3["total_pop"]==8124126
          assert pa["groups"]==4 and pa["disconnected"]==1 and pa["details"]["17"]["component_sizes"]==[535,1]
          assert ma["groups"]==947 and ma["disconnected"]==0
          assert len(find)==1 and find[0]["component_sections"]==["1709401001"]
          near=find[0]["nearest_relations"][0]
          assert near["to_section"]=="1714101003"
          out={"status":"CAT02_CERTIFIED","run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"sections":5143,"population":8124126,"edges":14375,"isolated_section":"1709401001","isolated_municipality":"Llívia","nearest_section":"1714101003","nearest_municipality":"Puigcerdà","distance_m_epsg3035":near["distance_m"],"next":"CAT-03: declarar pasarela administrativa explícita y exigir M03 conexo"}
          (b/"cataluna_2025_cat02_summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("# CAT-02\n\n```json\n"+json.dumps(out,ensure_ascii=False,indent=2)+"\n```\n")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Publicar resumen ligero
        uses: actions/upload-artifact@v6
        with:
          name: cataluna-CAT02-summary-${{ github.run_id }}
          path: |
            territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/*_informe.json
            territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/*_exit_code.txt
            territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/*_summary.json
      - name: Publicar diagnóstico pesado
        uses: actions/upload-artifact@v6
        with:
          name: cataluna-CAT02-heavy-${{ github.run_id }}
          path: |
            territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/*.geojson.zip
            territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/*_adyacencias.jsonl
            territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/*_grafo.json
            territorios/cataluna/.cache/ddd/preparacion/cataluna_2025/*_relaciones_geometricas.json
