  may_execute_territory: false
  rationale: 'Fuentes, M01-M03, topología y preprocesado común previo a M04 están preparados por configuración. El paquete no ejecuta Extremadura; la certificación M04-M06 queda pendiente y M07 permanece bloqueado por ausencia de un fichero oficial público suficientemente desagregado.'
