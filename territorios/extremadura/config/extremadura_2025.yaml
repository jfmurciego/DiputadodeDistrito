meta:
  procedure_name: Diputado de Distrito
  territory_id: extremadura
  territory: Extremadura
  run_name: extremadura_2025
  year: 2025
  scope: provincial
  schema_version: 0.9.0
  schema_family: ddd-territory
  contract_level: production_m01_m06
  contract_schema_version: 1.0.0
  production_authorization: AUTHORIZED
  status: source_prepared_pending_pre_m04
  full_process_readiness: territorios/extremadura/config/preparacion_proceso_completo.yaml
  electoral_sources_declaration: territorios/extremadura/config/elecciones/fuentes_oficiales_2025.yaml
  source_population_year: 2025
  source_section_year: 2025
io:
  project_root:
    path: ../../..
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
      container: zip
      materialized_format: shapefile
      archive_member: ''
    population_cip:
      paths:
      - inputs/65034.csv.zip
      sep: ;
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values:
        - Total
        edad_total_values:
        - Todas las edades
        year_value: 2025
      container: zip
      materialized_format: csv
      archive_member: 65034.csv
      encoding: utf-8-sig
  cache:
    dir: territorios/extremadura/.cache/ddd/preparacion/{run_name}
  runs:
    dir: territorios/extremadura/resultados/ejecuciones/{run_id}
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes:
  - '06'
  - '10'
  topology_mode: land
  k_districts: 65
  k_source: norma
  k_rationale: K=65 conserva el número legal de diputados de la Asamblea de Extremadura
    establecido por el artículo 18 de la Ley 2 de 1987; el procedimiento DDD usa ese
    tamaño institucional y redistribuye los distritos entre provincias mediante Hamilton.
  district_apportionment: hamilton
  population_floor_ratio: 0.8
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  limits_profile: standard-1.0.0
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: connected_internal_units
  municipality_atomicity_limit_ratio: 1.1
  internal_partition_chunk_ratio: 0.2
  require_auditable_district_catalogue: true
  promotion_status: generation_ready
  notes:
  - K=65 procede de la Ley 2/1987, artículo 18; no del experimento histórico previo.
  - El reparto DDD entre provincias permanece declarado como Hamilton 41/24, separado
    del reparto electoral autonómico vigente.
  - El perfil poblacional activo es el común standard-1.0.0: suelo 0.80, techo 1.75
      y tolerancia objetivo ±0.12.
  - La atomicidad 1.10 y chunk 0.20 son parámetros declarativos del preprocesador
    común connected_internal_units.
  - La producción sigue bloqueada: este paquete prepara configuración y capacidades
      sin ejecutar ni certificar una solución territorial.
  status: source_prepared_pending_pre_m04
partitioning:
  enabled: true
  strategy: connected_internal_units
  input_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
  graph: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
  output_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_unidades_internas.geojson
  output_report: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_unidades_internas_informe.json
  id_field: CUSEC_KEY
  municipality_field: CUMUN
  population_field: POP_2025
  partition_unit_field: M04_PARTITION_UNIT
  atomicity_ratio: 1.1
  chunk_ratio: 0.2
  source: common_preprocessor_v1
modulos:
  modulo_01_preparar_base_territorial:
    province_codes:
    - '06'
    - '10'
    drop_missing_population: false
    out_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    out_report: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
    - u: '0604405005'
      v: '0604405003'
      admin_scope: municipality:06044
      edge_type: same_municipality_exclave
      reason: Componente censal físicamente separada de Don Benito; enlace al nodo
        del mismo municipio más próximo auditado (~2074 m).
      source: EXT-02 auditoría geométrica reproducible
    - u: '0604405006'
      v: '0604405004'
      admin_scope: municipality:06044
      edge_type: same_municipality_exclave
      reason: Componente censal físicamente separada de Don Benito; enlace al nodo
        del mismo municipio más próximo auditado (~869 m).
      source: EXT-02 auditoría geométrica reproducible
  modulo_03_construir_grafo:
    in_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_2025
    out_graph_json: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    out_report: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_unidades_internas.geojson
    id_field: CUSEC_KEY
    pop_field: POP_2025
    province_field: CPRO
    municipality_field: M04_PARTITION_UNIT
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 65
    municipality_atomicity_limit_ratio: 1.1
    seed: 12345
    out_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_semillas.geojson.zip
    out_report: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_informe.json
  modulo_05_optimizar_distritos:
    in_graph_json: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2025
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 30000
    swap_polish_max: 200
    seed: 12345
    out_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m05_distritos_optimizados.geojson.zip
    out_report: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2025
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 65
    strict_expected_k: true
    out_summary_csv: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m06_resumen_distritos.csv
    out_catalog_csv: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m06_catalogo_distritos.csv
    out_composition_csv: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m06_composicion_distritos.csv
    out_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m06_secciones.geojson.zip
    out_district_geojson: territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m06_distritos.geojson.zip
