territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - '22'
  k_districts: 2
  k_source: formula
  k_rationale: 'Piloto Congreso: K=2 es la cuota de Huesca (CPRO 22) en N06-OWNER-20261012-K,
    con K_i igual al mayor entre 1 y la parte entera de (P_i + 60.000) entre 120.000,
    y K2025 = 407.'
  k_reference_scope: institutional_or_contractual_reference
  k_reference_source: null
  apportionment_source: ddd_design_policy
  legal_apportionment_reused: false
  legal_apportionment_context: null
  district_apportionment: hamilton
  population_floor_ratio: 0.85
  population_cap_ratio: 1.15
  target_tolerance_ratio: 0.15
  limits_profile: exception
  limits_exception_rationale: 'Reglas del Congreso aprobadas por el propietario: suelo
    85 %, techo 115 %, y un municipio que cabe bajo el techo no se divide. Piloto
    autorizado el 30-10-2026.'
  limits_exception_evidence: 'territorios/congreso/contrato_congreso_2026.json (K=407,
    decisión N08-OWNER-20261013-7RULES: límites ±15 % e indivisibilidad municipal
    bajo el techo); docs/ESTUDIOS/N08_CIERRE_NACIONAL_20261013/MATRIZ_FACTIBILIDAD_52.csv
    (Huesca: 1 componente, 0 solapes); referencia temporal 2023 contemporánea de la
    elección general de 2023'
  limits_exception_decided_at: '2026-10-30'
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.15
  require_auditable_district_catalogue: true
  status: generation_ready
