    path: ../../..
  input:
    seccionado:
      path: inputs/seccionado_2023.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths:
      - inputs/65034.csv.zip
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values:
        - Total
        edad_total_values:
        - Todas las edades
        year_value: 2023
