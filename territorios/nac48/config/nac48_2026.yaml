    id_field: CUSEC_KEY
    pop_field: POP_2025
    out_graph_json: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m03_grafo.json
    out_report: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m03_grafo.json
    in_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2025
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 10
    municipality_atomicity_limit_ratio: 1.15
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m04_semillas.geojson.zip
    out_report: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m04_informe.json
  modulo_05_optimizar_distritos:
    in_graph_json: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m03_grafo.json
    in_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2025
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m05_distritos_optimizados.geojson.zip
    out_report: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2025
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 10
    strict_expected_k: true
    out_summary_csv: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m06_resumen_distritos.csv
    out_catalog_csv: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m06_catalogo_distritos.csv
    out_composition_csv: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m06_composicion_distritos.csv
    out_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m06_secciones.geojson.zip
    out_district_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m06_distritos.geojson.zip
