# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.1 · FECHA: 2026-11-12 · ESTADO: candidato (sin generación)
# QUÉ ES: contrato M01-M06 de la edición 2026 (legislatura de la elección general del 29-11-2026) con la pareja
#   INE 2025/2025 (configuracion/decisiones/congreso_referencia_territorial_2025_2026.json; D-65, D-80).
#   Materializado en local por la ruta de producción (adquisición OGC Secciones_2025 + 65034 de inputs/partes y
#   herramientas/materializar_contrato_generacion.py); package_sha256 es el del paquete local: lo sustituye la 01.
# CAMBIOS 1.0.1 (T-220): carpeta y fichero renombrados al id nuevo de la tabla maestra (territorios/nac48/, meta.territory_id); semilla y contenido sin cambios.
# ANTERIOR: legacy/territorios/nac48/congreso_vizcaya_2026_v1.0.0.yaml
meta:
  procedure_name: Diputado de Distrito
  territory_id: nac48
  territory: Congreso Vizcaya
  run_name: nac48_2026
  year: 2026
  scope: provincial
  schema_version: 1.0.0
  status: source_prepared_pending_pre_m04
  source_population_year: 2025
  source_section_year: 2025
  schema_family: ddd-territory
  contract_level: production_m01_m06
  contract_schema_version: 1.0.0
  production_authorization: AUTHORIZED
io:
  project_root:
    path: ../../..
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
      container: zip
      materialized_format: shapefile
      archive_member: ''
    population_cip:
      paths:
      - inputs/65034.csv.zip
      sep: ;
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values:
        - Total
        edad_total_values:
        - Todas las edades
        year_value: 2025
      container: zip
      materialized_format: csv
      archive_member: 65034.csv
      encoding: utf-8-sig
  cache:
    dir: territorios/nac48/.cache/ddd/preparacion/{run_name}
  runs:
    dir: territorios/nac48/resultados/ejecuciones/{run_id}
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - '48'
  k_districts: 10
  k_source: formula
  k_rationale: 'Congreso: K=10 es la cuota de Vizcaya (CPRO 48) en N06-OWNER-20261012-K, con
    K_i igual al mayor entre 1 y la parte entera de (P_i + 60.000) entre 120.000, y K2025
    = 407.'
  k_reference_scope: institutional_or_contractual_reference
  k_reference_source: null
  apportionment_source: ddd_design_policy
  legal_apportionment_reused: false
  legal_apportionment_context: null
  district_apportionment: hamilton
  population_floor_ratio: 0.85
  population_cap_ratio: 1.15
  target_tolerance_ratio: 0.15
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.15
  require_auditable_district_catalogue: true
  status: source_prepared_pending_pre_m04
  limits_profile: exception
  limits_exception_rationale: 'Reglas del Congreso del propietario, iguales que el piloto
    Huesca: suelo 85 %, techo 115 % y un municipio que cabe bajo el techo no se divide.'
  limits_exception_evidence: configuracion/politica_generacion_territorial_2025.yaml#territories.nac22.population_limits
  limits_exception_decided_at: '2026-10-31'
modulos:
  modulo_01_preparar_base_territorial:
    province_codes: *id001
    drop_missing_population: false
    out_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m01_secciones_poblacion.geojson.zip
    out_report: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
    - u: '4807401002'
      v: '4807501001'
      admin_scope: province:48
      edge_type: administrative_exclave
      reason: 'Orduña: exclave vizcaíno; enlace mínimo auditado a Orozko (~6918 m).'
      source: R023 run 34688393979; heredado de territorios/aut16/config/aut16_2025.yaml
  modulo_03_construir_grafo:
    in_geojson: territorios/nac48/.cache/ddd/preparacion/{run_name}/nac48_2026_m01_secciones_poblacion.geojson.zip
