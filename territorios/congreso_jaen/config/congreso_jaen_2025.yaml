    id_field: CUSEC_KEY
    pop_field: POP_2023
    out_graph_json: territorios/congreso_jaen/.cache/ddd/preparacion/{run_name}/congreso_jaen_2025_m03_grafo.json
    out_report: territorios/congreso_jaen/.cache/ddd/preparacion/{run_name}/congreso_jaen_2025_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/congreso_jaen/.cache/ddd/preparacion/{run_name}/congreso_jaen_2025_m03_grafo.json
