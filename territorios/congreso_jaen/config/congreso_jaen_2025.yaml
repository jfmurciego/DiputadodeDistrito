  modulo_02_construir_adyacencias:
    in_geojson: territorios/congreso_jaen/.cache/ddd/preparacion/{run_name}/congreso_jaen_2025_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/congreso_jaen/.cache/ddd/preparacion/{run_name}/congreso_jaen_2025_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges: []
  modulo_03_construir_grafo:
    in_geojson: territorios/congreso_jaen/.cache/ddd/preparacion/{run_name}/congreso_jaen_2025_m01_secciones_poblacion.geojson.zip
