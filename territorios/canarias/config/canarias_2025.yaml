territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - '35'
  - '38'
  k_districts: 70
  k_source: norma
  k_rationale: K=70 toma de la norma únicamente el tamaño institucional del Parlamento
    de Canarias; DDD redistribuye sus distritos uninominales entre componentes físicos
    por su propia política Hamilton y no reproduce el reparto electoral legal.
  k_reference_scope: institutional_chamber_size_only
  k_reference_source: https://www.boe.es/buscar/act.php?id=BOE-A-2022-10043
  apportionment_source: ddd_design_policy
  legal_apportionment_reused: false
  legal_apportionment_context:
    note: Contexto solamente; no es el reparto producido por DDD.
    autonomous_constituency: 9
    island_constituencies:
      El_Hierro: 3
      Fuerteventura: 8
      Gran_Canaria: 15
      La_Gomera: 4
      Lanzarote: 8
      La_Palma: 8
      Tenerife: 15
  district_apportionment: hamilton_components
  population_floor_ratio: 0.8
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  limits_profile: standard-1.0.0
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.75
  require_auditable_district_catalogue: true
  population_floor_exempt_partitions:
  - 35-C02
  - 35-C04
  - 38-C01
  - 38-C02
  - 38-C04
  small_component_exception_policy: one_contiguous_district_floor_exception
  status: generation_ready
modulos:
  modulo_01_preparar_base_territorial:
    province_codes: *id001
    drop_missing_population: false
    out_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m01_secciones_poblacion.geojson.zip
    out_report: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
