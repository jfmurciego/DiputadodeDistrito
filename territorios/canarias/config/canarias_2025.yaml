    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges: []
    bridge_admin_level_1_field: CPRO
    bridge_admin_level_2_field: CUMUN
  modulo_03_construir_grafo:
    in_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m02_adyacencias.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_2023
    out_graph_json: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m03_grafo.json
    out_report: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m03_grafo.json
    in_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m03_particiones.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    province_field: DDD_PARTITION
    municipality_field: DDD_MUNICIPALITY_PARTITION
    municipality_name_field: NMUN
    district_apportionment: hamilton_components
    k_districts: 70
    municipality_atomicity_limit_ratio: 1.75
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m04_semillas.geojson.zip
    out_report: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m04_informe.json
    source_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m01_secciones_poblacion.geojson.zip
    hard_partition_lookup: configuracion/particiones_insulares_2025.json
    hard_partition_territory_id: canarias
  modulo_05_optimizar_distritos:
    population_repair:
      enabled: true
      strategy: private_annealing
      seed: 0
      max_candidates: 5000000
      max_seconds: 120.0
    in_graph_json: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m03_grafo.json
    in_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    district_field: district_id
    province_field: DDD_PARTITION
    municipality_field: DDD_MUNICIPALITY_PARTITION
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2023
    province_field: DDD_PARTITION
    province_name_field: NPRO
    municipality_field: DDD_MUNICIPALITY_PARTITION
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 70
    strict_expected_k: true
    out_summary_csv: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m06_resumen_distritos.csv
    out_catalog_csv: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m06_catalogo_distritos.csv
    out_composition_csv: territorios/canarias/.cache/ddd/preparacion/{run_name}/canarias_2025_m06_composicion_distritos.csv
