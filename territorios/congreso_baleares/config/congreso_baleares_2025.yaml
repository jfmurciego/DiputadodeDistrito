    pop_field: POP_2023
    out_graph_json: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m03_grafo.json
    out_report: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m03_grafo.json
