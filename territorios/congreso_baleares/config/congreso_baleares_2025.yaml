    hard_partition_lookup: configuracion/particiones_insulares_2025.json
    hard_partition_territory_id: congreso_baleares
  modulo_05_optimizar_distritos:
    population_repair:
      enabled: true
      max_depth: 6
      max_transfer_set: 3
      max_candidates: 500000
      max_seconds: 300
      seed: 0
    in_graph_json: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m03_grafo.json
    in_geojson: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    district_field: district_id
    province_field: DDD_PARTITION
    municipality_field: DDD_MUNICIPALITY_PARTITION
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2023
    province_field: DDD_PARTITION
    province_name_field: NPRO
    municipality_field: DDD_MUNICIPALITY_PARTITION
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 10
    strict_expected_k: true
    out_summary_csv: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m06_resumen_distritos.csv
    out_catalog_csv: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m06_catalogo_distritos.csv
