  modulo_02_construir_adyacencias:
    in_geojson: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m02_adyacencias.jsonl
