    id_field: CUSEC_KEY
    pop_field: POP_2023
    province_field: DDD_PARTITION
    municipality_field: DDD_MUNICIPALITY_PARTITION
    municipality_name_field: NMUN
    district_apportionment: hamilton_components
    k_districts: 10
    municipality_atomicity_limit_ratio: 1.15
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m04_semillas.geojson.zip
    out_report: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m04_informe.json
