      v: '0702602001'
      admin_scope: province:07
      edge_type: maritime_group
      reason: Formentera e Ibiza en un mismo distrito del Congreso; decisión del propietario
        31-10-2026
      source: configuracion/particiones_insulares_2025.json#congreso_baleares
    bridge_admin_level_1_field: CPRO
    bridge_admin_level_2_field: CUMUN
  modulo_03_construir_grafo:
    in_geojson: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/congreso_baleares/.cache/ddd/preparacion/{run_name}/congreso_baleares_2025_m02_adyacencias.jsonl
