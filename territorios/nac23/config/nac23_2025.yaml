    out_report: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m03_grafo.json
