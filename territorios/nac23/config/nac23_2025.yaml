    id_field: CUSEC_KEY
    pop_field: POP_2023
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 5
    municipality_atomicity_limit_ratio: 1.15
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m04_semillas.geojson.zip
    out_report: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m04_informe.json
  modulo_05_optimizar_distritos:
    in_graph_json: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m03_grafo.json
    in_geojson: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
