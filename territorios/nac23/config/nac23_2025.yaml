    out_report: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2023
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 5
    strict_expected_k: true
    out_summary_csv: territorios/nac23/.cache/ddd/preparacion/{run_name}/nac23_2025_m06_resumen_distritos.csv
