    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 25
    strict_expected_k: true
    out_summary_csv: territorios/ceuta/.cache/ddd/preparacion/{run_name}/ceuta_2025_m06_resumen_distritos.csv
