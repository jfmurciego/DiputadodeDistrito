  k_source: formula
  k_rationale: 'Congreso: K=10 es la cuota de Baleares (CPRO 07) en N06-OWNER-20261012-K,
    con K_i igual al mayor entre 1 y la parte entera de (P_i + 60.000) entre 120.000, y K2025
    = 407.'
