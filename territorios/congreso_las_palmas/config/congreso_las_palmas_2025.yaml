territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - '35'
  k_districts: 10
  k_source: formula
  k_rationale: 'Congreso: K=10 es la cuota de Las Palmas (CPRO 35) en N06-OWNER-20261012-K,
    con K_i igual al mayor entre 1 y la parte entera de (P_i + 60.000) entre 120.000,
    y K2025 = 407.'
  k_reference_scope: institutional_or_contractual_reference
  k_reference_source: null
  apportionment_source: ddd_design_policy
  legal_apportionment_reused: false
  legal_apportionment_context: null
  district_apportionment: hamilton_components
  population_floor_ratio: 0.85
  population_cap_ratio: 1.4
  target_tolerance_ratio: 0.4
  limits_profile: exception
  limits_exception_rationale: 'Decisión del propietario 31-10-2026: Lanzarote y La
    Graciosa forman un solo distrito (1,38 de la media), así que el techo provincial
    sube a 1,40; suelo 85 % y municipios indivisibles bajo el techo como en el resto.'
  limits_exception_evidence: configuracion/politica_generacion_territorial_2025.yaml#territories.congreso_huesca.population_limits
  limits_exception_decided_at: '2026-10-31'
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.15
  require_auditable_district_catalogue: true
  population_floor_exempt_partitions:
  - 35-C02
  small_component_exception_policy: one_contiguous_district_floor_exception
  status: generation_ready
modulos:
