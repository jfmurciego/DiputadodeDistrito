    id_field: CUSEC_KEY
    pop_field: POP_2023
    district_field: district_id
    province_field: DDD_PARTITION
    municipality_field: DDD_MUNICIPALITY_PARTITION
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/congreso_las_palmas/.cache/ddd/preparacion/{run_name}/congreso_las_palmas_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/congreso_las_palmas/.cache/ddd/preparacion/{run_name}/congreso_las_palmas_2025_m05_informe.json
  modulo_06_consolidar_distritos:
