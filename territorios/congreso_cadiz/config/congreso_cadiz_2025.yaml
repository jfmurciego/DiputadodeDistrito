  run_name: congreso_cadiz_2025
  year: 2025
  scope: provincial
  schema_version: 1.0.0
  status: source_prepared_pending_pre_m04
  source_population_year: 2025
  source_section_year: 2025
  schema_family: ddd-territory
  contract_level: production_m01_m06
  contract_schema_version: 1.0.0
  production_authorization: AUTHORIZED
io:
  project_root:
    path: ../../..
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
      container: zip
      materialized_format: shapefile
      archive_member: ''
    population_cip:
      paths:
      - inputs/65034.csv.zip
      sep: ;
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values:
        - Total
        edad_total_values:
        - Todas las edades
        year_value: 2025
      container: zip
      materialized_format: csv
      archive_member: 65034.csv
      encoding: utf-8-sig
  cache:
    dir: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}
  runs:
    dir: territorios/congreso_cadiz/resultados/ejecuciones/{run_id}
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - '11'
  k_districts: 11
  k_source: formula
  k_rationale: 'Congreso: K=11 es la cuota de Cádiz (CPRO 11) en N06-OWNER-20261012-K,
    con K_i igual al mayor entre 1 y la parte entera de (P_i + 60.000) entre 120.000,
    y K2025 = 407.'
  k_reference_scope: institutional_or_contractual_reference
  k_reference_source: null
  apportionment_source: ddd_design_policy
  legal_apportionment_reused: false
  legal_apportionment_context: null
  district_apportionment: hamilton
  population_floor_ratio: 0.85
  population_cap_ratio: 1.16
  target_tolerance_ratio: 0.16
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.15
  require_auditable_district_catalogue: true
  status: source_prepared_pending_pre_m04
  limits_profile: exception
  limits_exception_rationale: 'Decisión del propietario (01-11-2026): techo 116 %
    solo en Cádiz, porque dos municipios enteros dan un distrito 1,159 veces la media;
    suelo 85 % y municipios indivisibles bajo el techo como en el resto.'
  limits_exception_evidence: 'run 00 41327505480: M05 distrito 8 = 132.239 hab. (El
    Puerto de Santa María 11027 y Puerto Real 11028 enteros) frente a un techo de
    131.190; la reparación profunda no lo mejoró'
  limits_exception_decided_at: '2026-11-01'
modulos:
  modulo_01_preparar_base_territorial:
    province_codes: *id001
    drop_missing_population: false
    out_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m01_secciones_poblacion.geojson.zip
    out_report: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges: []
  modulo_03_construir_grafo:
    in_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m02_adyacencias.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_2025
    out_graph_json: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m03_grafo.json
    out_report: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m03_grafo.json
    in_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2025
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 11
    municipality_atomicity_limit_ratio: 1.15
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m04_semillas.geojson.zip
    out_report: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m04_informe.json
  modulo_05_optimizar_distritos:
    population_repair:
      enabled: true
      max_depth: 6
      max_transfer_set: 3
      max_candidates: 500000
      max_seconds: 300
      seed: 0
    in_graph_json: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m03_grafo.json
    in_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2025
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2025
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 11
    strict_expected_k: true
    out_summary_csv: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m06_resumen_distritos.csv
    out_catalog_csv: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m06_catalogo_distritos.csv
    out_composition_csv: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m06_composicion_distritos.csv
    out_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m06_secciones.geojson.zip
    out_district_geojson: territorios/congreso_cadiz/.cache/ddd/preparacion/{run_name}/congreso_cadiz_2025_m06_distritos.geojson.zip
