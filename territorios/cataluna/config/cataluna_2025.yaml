# PROYECTO: Diputado de Distrito
# TERRITORIO: Cataluña
# VERSIÓN: 0.1.0
# NOMBRE DE VERSIÓN: Baseline territorial CAT-01
# FECHA: 2026-09-12
# ESTADO: baseline inicial; pendiente de congelar cardinalidades y topología tras primera ejecución.
# QUÉ HACE: define Cataluña sobre las fuentes nacionales 2025 y ejecuta M01-M03 para Barcelona, Girona, Lleida y Tarragona.
# CAMBIOS: territorio nuevo; no deriva tolerancias, puentes ni reglas M04 de otras comunidades.
# MOTIVO: iniciar Cataluña con el mismo contrato reproducible usado en Aragón, Extremadura y Andalucía.
# ANTERIOR: ninguno — territorio nuevo.

meta:
  procedure_name: Diputado de Distrito
  territory_id: cataluna
  territory: Cataluña
  run_name: cataluna_2025
  year: 2025
  scope: provincial
  schema_version: 0.1.0
  status: baseline_m01_m03

io:
  project_root: {path: ../../..}
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
  cache: {dir: "territorios/cataluna/.cache/ddd/preparacion/{run_name}"}

territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['08','17','25','43']
  status: baseline_candidate
  notes:
    - CAT-01 debe medir, no presuponer, secciones, población y conectividad.
    - No se fijan aún K, Hamilton, puentes administrativos ni política M04.
    - Cualquier discontinuidad topológica se auditará antes de introducir puentes.

modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['08','17','25','43']
    drop_missing_population: false
    out_geojson: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"
  modulo_02_construir_adyacencias:
    in_geojson: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    out_edges_jsonl: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges: []
  modulo_03_construir_grafo:
    in_geojson: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    in_edges_jsonl: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    out_graph_json: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    out_report: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json"

validation:
  expected_province_codes: ['08','17','25','43']
  require_unique_section_id: true
  require_non_null_population: true
  province_field: CPRO
  municipality_field: CUMUN
  municipality_name_field: NMUN
  require_one_graph_component_per_province: false
  require_connected_municipalities: false
