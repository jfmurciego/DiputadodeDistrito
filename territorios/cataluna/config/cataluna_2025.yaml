territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - 08
  - '17'
  - '25'
  - '43'
  status: source_prepared_pending_pre_m04
  notes:
  - CAT-02 run 34688104014 certificó 1709401001, Llívia, como único aislado.
  - La sección española más próxima es 1714101003, Puigcerdà, a 1.636,011 m en EPSG:3035.
  - La pasarela es administrativa, explícita y auditable; no representa contacto geométrico.
  - Todavía no se fija K ni se abre M04.
  k_districts: 135
  k_source: norma
  k_rationale: K=135 conserva el tamaño vigente del Parlament de Catalunya como regla
    institucional ex ante.
  district_apportionment: hamilton
  population_floor_ratio: 0.8
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  limits_profile: standard-1.0.0
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.75
  require_auditable_district_catalogue: true
modulos:
  modulo_01_preparar_base_territorial:
    province_codes:
    - 08
    - '17'
    - '25'
    - '43'
    drop_missing_population: false
    out_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    out_report: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
    - u: '1709401001'
      v: '1714101003'
      admin_scope: province:17
      edge_type: administrative_enclave
      reason: Llívia es un enclave español separado del cuerpo principal de Girona;
        enlace a la sección española más próxima en Puigcerdà (~1636 m).
      source: CAT-02 run 34688104014; revalidado geométricamente contra ddd-source-package-cataluna-2025-37215025861
  modulo_03_construir_grafo:
    in_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_2024
    out_graph_json: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    out_report: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2024
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 135
    municipality_atomicity_limit_ratio: 1.75
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m04_semillas.geojson.zip
    out_report: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m04_informe.json
  modulo_05_optimizar_distritos:
    in_graph_json: territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2024
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2024
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 135
    strict_expected_k: true
    out_summary_csv: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m06_resumen_distritos.csv
    out_catalog_csv: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m06_catalogo_distritos.csv
    out_composition_csv: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m06_composicion_distritos.csv
    out_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m06_secciones.geojson.zip
    out_district_geojson: territorios/cataluna/.cache/ddd/preparacion/{run_name}/cataluna_2025_m06_distritos.geojson.zip
