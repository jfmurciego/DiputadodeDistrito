# PROYECTO: Diputado de Distrito
# TERRITORIO: Cataluña
# VERSIÓN: 0.3.0
# NOMBRE DE VERSIÓN: Contrato topológico Llívia CAT-03
# FECHA: 2026-09-12
# ESTADO: CAT-03 candidato; conectividad M03 estricta.
# QUÉ HACE: declara una única pasarela administrativa explícita para Llívia y exige conectividad provincial y municipal completa.
# CAMBIOS: añade 1709401001↔1714101003, certificada por CAT-02 a 1.636,011 m en EPSG:3035; expected_topology_bridges pasa a 1.
# MOTIVO: CAT-02 run 34688104014 certificó Llívia como único componente aislado y Puigcerdà como sección española más próxima.
# ANTERIOR: legacy/configuracion/cataluna_2025_v0.2.0.yaml
meta:
  procedure_name: Diputado de Distrito
  territory_id: cataluna
  territory: Cataluña
  run_name: cataluna_2025
  year: 2025
  scope: provincial
  schema_version: 0.3.0
  status: topology_contract_cat03
io:
  project_root: {path: ../../..}
  input:
    seccionado: {path: inputs/seccionado_2025.zip, layer: '', section_key_col: CUSEC}
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters: {year_col: Periodo, sexo_col: Sexo, edad_col: Edad, sexo_total_values: [Total], edad_total_values: [Todas las edades]}
  cache: {dir: "territorios/cataluna/.cache/ddd/preparacion/{run_name}"}
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['08','17','25','43']
  status: topology_audit_cat02
  notes:
    - CAT-02 run 34688104014 certificó 1709401001, Llívia, como único aislado.
    - La sección española más próxima es 1714101003, Puigcerdà, a 1.636,011 m en EPSG:3035.
    - La pasarela es administrativa, explícita y auditable; no representa contacto geométrico.
    - Todavía no se fija K ni se abre M04.
modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['08','17','25','43']
    drop_missing_population: false
    out_geojson: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"
  modulo_02_construir_adyacencias:
    in_geojson: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    out_edges_jsonl: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
      - {u: '1709401001', v: '1714101003', edge_type: administrative_enclave, reason: 'Llívia es un enclave español separado del cuerpo principal de Girona; enlace a la sección española más próxima en Puigcerdà (~1636 m).', source: 'CAT-02 run 34688104014'}
  modulo_03_construir_grafo:
    in_geojson: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    in_edges_jsonl: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    out_graph_json: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    out_report: "territorios/cataluna/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json"
validation:
  expected_province_codes: ['08','17','25','43']
  expected_sections_geometry: 5143
  expected_population_total_2025: 8124126
  expected_topology_bridges: 1
  require_unique_section_id: true
  require_non_null_population: true
  province_field: CPRO
  municipality_field: CUMUN
  municipality_name_field: NMUN
  audit_graph_components: true
  audit_admin_level_1_components: true
  audit_admin_level_2_components: true
  require_one_graph_component_per_province: true
  require_connected_municipalities: true
