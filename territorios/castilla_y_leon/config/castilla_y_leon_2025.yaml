# PROYECTO: Diputado de Distrito
# TERRITORIO: Castilla y León
# VERSIÓN: 0.8.0
# NOMBRE DE VERSIÓN: Contrato CYL-04 — optimización M05
# FECHA: 2026-09-11
# ESTADO: candidato CYL-04
# QUÉ HACE: conserva la preparación territorial validada M01-M04 y conecta M05 para eliminar los cuatro distritos aún fuera de ±12% sin relajar provincia, contigüidad, atomicidad municipal ni suelo/techo.
# CAMBIOS: añade modulo_05_optimizar_distritos con el baseline de búsqueda reproducible usado en Aragón; declara como criterio de aceptación CYL-04 cero distritos fuera de tolerancia tras M05.
# MOTIVO: M04 v7.4.5 ya produce una solución territorialmente válida con hard=0 y solo cuatro outliers; la siguiente responsabilidad debe quedar aislada en M05 como optimización post-factibilidad.
# ANTERIOR: legacy/configuracion/castilla_y_leon_2025_v0.7.1.yaml

meta:
  procedure_name: Diputado de Distrito
  territory_id: castilla_y_leon
  territory: Castilla y León
  run_name: castilla_y_leon_2025
  year: 2025
  scope: provincial
  schema_version: 0.8.0
  status: candidate_m05

io:
  project_root: {path: ../../..}
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
    comarcas:
      enabled: false
      path: territorios/castilla_y_leon/inputs/COMARCAS_OPCIONAL.csv
      join: {comarcas_key_col: MUN_KEY}
  cache: {dir: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}"}
  runs: {dir: "territorios/castilla_y_leon/resultados/ejecuciones/{run_id}"}

territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['05','09','24','34','37','40','42','47','49']
  k_districts: 82
  district_apportionment: hamilton
  population_floor_ratio: 0.80
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: closed_target_cores_plus_open_residual
  municipality_atomicity_limit_ratio: 1.12
  notes:
    - K=82 conserva el tamaño de la XII Legislatura de las Cortes de Castilla y León, no su reparto provincial vigente.
    - Hamilton aplica igualdad poblacional sobre las nueve provincias: Ávila 6, Burgos 12, León 15, Palencia 6, Salamanca 11, Segovia 5, Soria 3, Valladolid 18, Zamora 6.
    - 0.80/1.75/0.12 se prueban como contrato candidato por continuidad metodológica; no se consideran generalizados hasta superar CYL-04.
    - Un municipio completo deja de ser atómico cuando supera 1.12× target porque, si permaneciera indivisible, haría imposible alcanzar la tolerancia objetivo.
    - Los municipios sobredimensionados producen núcleos urbanos cerrados dentro de target±12% y, como máximo, un residuo municipal abierto que puede combinarse con unidades vecinas.
    - Las siete pasarelas topológicas son excepciones explícitas de conectividad; seis resuelven enclaves/huecos provinciales y una resuelve el exclave intramunicipal de Herrera de Duero dentro de Tudela de Duero.
    - M03 debe certificar cero provincias y cero municipios desconectados antes de que M04 pueda ejecutarse.
    - Los parámetros de M05 se importan inicialmente como baseline de portabilidad desde Aragón; CYL-04 decidirá si son suficientes, sin convertirlos todavía en constantes universales del método.

modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['05','09','24','34','37','40','42','47','49']
    drop_missing_population: false
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"
  modulo_02_construir_adyacencias:
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    out_edges_jsonl: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    predicate: touches
    min_shared_border_m: 0.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
      - {u: '0910901001', v: '0921904001', edge_type: administrative_enclave, reason: 'Enclave de Treviño enlazado al cuerpo principal de Burgos por la sección burgalesa más próxima (Miranda de Ebro).', source: 'CYL-02 audit'}
      - {u: '0922301001', v: '0941401001', edge_type: cartographic_gap, reason: 'Monasterio de la Sierra: hueco de 758 m en el seccionado hasta Valle de Valdelaguna.', source: 'CYL-02 geometry audit'}
      - {u: '0915401001', v: '0933001001', edge_type: cartographic_gap, reason: 'Hacinas: hueco de 622 m en el seccionado hasta Salas de los Infantes.', source: 'CYL-02 audit'}
      - {u: '3403201001', v: '3413501001', edge_type: administrative_exclave, reason: 'Berzosilla: exclave palentino; enlace mínimo al cuerpo principal de Palencia (Pomar de Valdivia).', source: 'CYL-02 audit'}
      - {u: '3424201001', v: '3412101001', edge_type: administrative_exclave, reason: 'Villodrigo: exclave palentino dentro de Burgos; enlace mínimo a Palenzuela.', source: 'CYL-02 audit'}
      - {u: '4713401001', v: '4718301001', edge_type: administrative_exclave, reason: 'Roales de Campos + Quintanilla del Molar: exclave vallisoletano; enlace mínimo a Valdunquillo.', source: 'CYL-02 audit'}
      - {u: '4717501004', v: '4717501003', edge_type: municipal_exclave, reason: 'Herrera de Duero es un exclave del municipio de Tudela de Duero; se enlaza la sección del exclave con la sección del cuerpo principal del mismo municipio más próxima (~1,92 km).', source: 'CYL-03 municipal connectivity audit'}
  modulo_03_construir_grafo:
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    in_edges_jsonl: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    out_graph_json: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json"
  modulo_04_generar_semillas:
    in_graph_json: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 82
    municipality_atomicity_limit_ratio: 1.12
    seed: 12345
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m04_semillas.geojson.zip"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m04_informe.json"
  modulo_05_optimizar_distritos:
    in_graph_json: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m04_semillas.geojson.zip"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m05_distritos_optimizados.geojson.zip"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m05_informe.json"

validation:
  expected_province_codes: ['05','09','24','34','37','40','42','47','49']
  expected_sections_geometry: 3506
  expected_population_total_2025: 2401221
  expected_topology_bridges: 7
  expected_districts: 82
  population_floor_ratio: 0.80
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  province_apportionment: hamilton
  province_districts: {'05': 6, '09': 12, '24': 15, '34': 6, '37': 11, '40': 5, '42': 3, '47': 18, '49': 6}
  require_unique_section_id: true
  require_non_null_population: true
  require_graph_contiguity: true
  require_one_graph_component_per_province: true
  require_connected_municipalities: true
  province_field: CPRO
  require_single_province_per_district: true
  require_municipality_discipline: true
  municipality_field: CUMUN
  municipality_name_field: NMUN
  municipality_atomicity_limit_ratio: 1.12
  max_mixed_districts_per_split_municipality: 1
  require_zero_outside_tolerance_after_m05: true
