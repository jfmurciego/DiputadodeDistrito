# PROYECTO: Diputado de Distrito
# TERRITORIO: Castilla y León
# VERSIÓN: 0.12.0
# NOMBRE DE VERSIÓN: Política topológica declarativa
# FECHA: 2026-09-16
# ESTADO: candidato CYL preindustrialización topológica
# QUÉ HACE: conserva el contrato territorial M01-M06 y formaliza el umbral físico y las siete pasarelas mediante la política topológica común.
# CAMBIOS: min_shared_border_m=1.0; topology_mode=land; cada pasarela declara ámbito administrativo, tipo, justificación y evidencia.
# MOTIVO: impedir contactos puntuales como adyacencias físicas y hacer auditables las excepciones de conectividad sin lógica territorial.
# ANTERIOR: versión 0.11.1 en historial Git.

meta:
  procedure_name: Diputado de Distrito
  territory_id: castilla_y_leon
  territory: Castilla y León
  run_name: castilla_y_leon_2025
  year: 2025
  scope: provincial
  schema_version: 0.12.0
  schema_family: ddd-territory
  contract_level: production_m01_m06
  contract_schema_version: 1.0.0
  production_authorization: AUTHORIZED
  status: candidate_m06

io:
  project_root: {path: ../../..}
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/65034.csv.zip]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
    comarcas:
      enabled: false
      path: territorios/castilla_y_leon/inputs/COMARCAS_OPCIONAL.csv
      sep: auto
      require_full_coverage: true
      join: {comarcas_key_col: "Municipio código", comarca_code_col: "Comarca código", comarca_name_col: "Comarca nombre"}
  cache: {dir: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}"}
  runs: {dir: "territorios/castilla_y_leon/resultados/ejecuciones/{run_id}"}

territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: ['05','09','24','34','37','40','42','47','49']
  topology_mode: land
  k_districts: 82
  k_source: norma
  k_rationale: "K=82 conserva el tamaño de la XII Legislatura de las Cortes de Castilla y León; Hamilton sustituye el reparto provincial vigente."
  district_apportionment: hamilton
  population_floor_ratio: 0.80
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  limits_profile: standard-1.0.0
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: closed_target_cores_plus_open_residual
  municipality_atomicity_limit_ratio: 1.12
  require_closed_core_province_residual_feasibility: true
  require_auditable_district_catalogue: true
  notes:
    - K=82 conserva el tamaño de la XII Legislatura de las Cortes de Castilla y León, no su reparto provincial vigente.
    - Hamilton aplica igualdad poblacional sobre las nueve provincias: Ávila 6, Burgos 12, León 15, Palencia 6, Salamanca 11, Segovia 5, Soria 3, Valladolid 18, Zamora 6.
    - 0.80/1.75/0.12 se prueban como contrato candidato por continuidad metodológica y ya han superado CYL-04 en Castilla y León.
    - Un municipio completo deja de ser atómico cuando supera 1.12× target porque, si permaneciera indivisible, haría imposible alcanzar la tolerancia objetivo.
    - Los municipios sobredimensionados producen núcleos urbanos cerrados y residuos abiertos; M04 puede exponer micro-unidades residuales fronterizas cuando la atomicidad residual bloquearía la factibilidad provincial.
    - Un núcleo urbano cerrado no se valida solo por su propia población: después de cerrarlo, la población restante de la provincia debe caber en N_abiertos × [target−12%, target+12%].
    - Las siete pasarelas topológicas son excepciones explícitas de conectividad; seis resuelven enclaves/huecos provinciales y una resuelve el exclave intramunicipal de Herrera de Duero dentro de Tudela de Duero.
    - M03 certifica cero provincias y cero municipios desconectados antes de M04.
    - CYL-04 certificó M05 con fuera_12=0, hard=0, K=82 y contigüidad 82/82.
    - M06 no puede cambiar district_id; solo materializa, mide, describe y audita la solución de M05.

modulos:
  modulo_01_preparar_base_territorial:
    province_codes: ['05','09','24','34','37','40','42','47','49']
    drop_missing_population: false
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json"
  modulo_02_construir_adyacencias:
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    out_edges_jsonl: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    predicate: touches
    min_shared_border_m: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
      - {u: '0910901001', v: '0921904001', admin_scope: 'province:09', edge_type: administrative_enclave, reason: 'Enclave de Treviño enlazado al cuerpo principal de Burgos por la sección burgalesa más próxima (Miranda de Ebro).', source: 'CYL-02 audit'}
      - {u: '0922301001', v: '0941401001', admin_scope: 'province:09', edge_type: cartographic_gap, reason: 'Monasterio de la Sierra: hueco de 758 m en el seccionado hasta Valle de Valdelaguna.', source: 'CYL-02 geometry audit'}
      - {u: '0915401001', v: '0933001001', admin_scope: 'province:09', edge_type: cartographic_gap, reason: 'Hacinas: hueco de 622 m en el seccionado hasta Salas de los Infantes.', source: 'CYL-02 audit'}
      - {u: '3403201001', v: '3413501001', admin_scope: 'province:34', edge_type: administrative_exclave, reason: 'Berzosilla: exclave palentino; enlace mínimo al cuerpo principal de Palencia (Pomar de Valdivia).', source: 'CYL-02 audit'}
      - {u: '3424201001', v: '3412101001', admin_scope: 'province:34', edge_type: administrative_exclave, reason: 'Villodrigo: exclave palentino dentro de Burgos; enlace mínimo a Palenzuela.', source: 'CYL-02 audit'}
      - {u: '4713401001', v: '4718301001', admin_scope: 'province:47', edge_type: administrative_exclave, reason: 'Roales de Campos + Quintanilla del Molar: exclave vallisoletano; enlace mínimo a Valdunquillo.', source: 'CYL-02 audit'}
      - {u: '4717501004', v: '4717501003', admin_scope: 'municipality:47175', edge_type: municipal_exclave, reason: 'Herrera de Duero es un exclave del municipio de Tudela de Duero; se enlaza la sección del exclave con la sección del cuerpo principal del mismo municipio más próxima (~1,92 km).', source: 'CYL-03 municipal connectivity audit'}
  modulo_03_construir_grafo:
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    in_edges_jsonl: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    out_graph_json: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json"
  modulo_04_generar_semillas:
    in_graph_json: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 82
    municipality_atomicity_limit_ratio: 1.12
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m04_semillas.geojson.zip"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m04_informe.json"
  modulo_05_optimizar_distritos:
    in_graph_json: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json"
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m04_semillas.geojson.zip"
    id_field: CUSEC_KEY
    pop_field: "POP_{year}"
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m05_distritos_optimizados.geojson.zip"
    out_report: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m05_informe.json"
  modulo_06_consolidar_distritos:
    in_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m05_distritos_optimizados.geojson.zip"
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: "POP_{year}"
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 82
    strict_expected_k: true
    out_summary_csv: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m06_resumen_distritos.csv"
    out_catalog_csv: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m06_catalogo_distritos.csv"
    out_composition_csv: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m06_composicion_distritos.csv"
    out_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m06_secciones.geojson.zip"
    out_district_geojson: "territorios/castilla_y_leon/.cache/ddd/preparacion/{run_name}/{run_name}_m06_distritos.geojson.zip"

