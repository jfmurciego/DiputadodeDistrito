# PROYECTO: Diputado de Distrito
# TERRITORIO: Castilla y León
# VERSIÓN: 0.1.0
# NOMBRE DE VERSIÓN: Plantilla de contrato territorial
# FECHA: 2026-09-11
# ESTADO: preparación — NO EJECUTAR como baseline
# QUÉ HACE: define la estructura mínima de configuración para iniciar la segunda implantación DDD.
# CAMBIOS: primera plantilla multi-territorio.
# MOTIVO: separar parámetros territoriales del motor común y evitar copiar Aragón.
# ORIGEN: R018

meta:
  procedure_name: Diputado de Distrito
  territory_id: castilla_y_leon
  territory: Castilla y León
  run_name: castilla_y_leon_2025
  year: 2025
  scope: provincial
  schema_version: 0.1.0
  status: preparation

io:
  project_root: {path: ..}
  input:
    seccionado:
      path: inputs/SECCIONADO_PENDIENTE
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths: [inputs/POBLACION_PENDIENTE]
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values: [Total]
        edad_total_values: [Todas las edades]
    comarcas:
      enabled: false
      path: inputs/COMARCAS_OPCIONAL.csv
      join: {comarcas_key_col: MUN_KEY}
  cache: {dir: ".cache/ddd/preparacion/{run_name}"}
  runs: {dir: "resultados/ejecuciones/{run_id}"}

# IMPORTANTE: los valores siguientes son marcadores y deben decidirse con evidencia.
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: []          # TODO: nueve provincias
  k_districts: null           # TODO
  district_apportionment: hamilton  # TODO confirmar
  population_floor_ratio: null      # TODO
  population_cap_ratio: null        # TODO
  target_tolerance_ratio: null      # TODO
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: TODO
  notes:
    - No copiar 0.80/1.75/0.12 de Aragón sin decisión explícita.
    - Auditar enclaves, continuidad provincial y ciudades sobredimensionadas antes de M04.

modulos: {}
validation: {}
