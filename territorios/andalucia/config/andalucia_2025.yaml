meta:
  procedure_name: Diputado de Distrito
  territory_id: andalucia
  territory: Andalucía
  run_name: andalucia_2025
  year: 2025
  scope: provincial
  schema_version: 0.3.0
  status: production_ready_auto_materialized
  schema_family: ddd-territory
  contract_level: production_m01_m06
  contract_schema_version: 1.0.0
  production_authorization: AUTHORIZED
io:
  project_root:
    path: ../../..
  input:
    seccionado:
      path: inputs/seccionado_2025.zip
      layer: ''
      section_key_col: CUSEC
    population_cip:
      paths:
      - inputs/65034.csv.zip
      sep: auto
      section_key_col: Secciones
      pop_col: Total
      filters:
        year_col: Periodo
        sexo_col: Sexo
        edad_col: Edad
        sexo_total_values:
        - Total
        edad_total_values:
        - Todas las edades
  cache:
    dir: territorios/andalucia/.cache/ddd/preparacion/{run_name}
  runs:
    dir: territorios/andalucia/resultados/ejecuciones/{run_id}
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - '04'
  - '11'
  - '14'
  - '18'
  - '21'
  - '23'
  - '29'
  - '41'
  k_institutional_reference: 109
  population_hamilton_reference:
    '04': 9
    '11': 16
    '14': 10
    '18': 12
    '21': 7
    '23': 8
    '29': 22
    '41': 25
  status: topology_contract_candidate
  notes:
  - AND-01 certificó 6.029 secciones y 8.676.713 habitantes sin faltantes de población.
  - Población observada: Almería 770.554; Cádiz 1.261.420; Córdoba 773.163; Granada
      945.797; Huelva 538.789; Jaén 618.143; Málaga 1.791.183; Sevilla 1.977.664.
  - AND-02 sin pasarelas dejó las ocho provincias conectadas y únicamente dos discontinuidades
    municipales reales.
  - Cortegana: 2102502002 (558 hab.) queda a ~3.064 m de 2102502001, el nodo del mismo
      municipio más próximo auditado.
  - Vélez-Málaga: 2909401015 (886 hab.) queda a ~1.658 m de 2909403005, el nodo del
      mismo municipio más próximo auditado.
  - K=109 y Hamilton 9/16/10/12/7/8/22/25 siguen siendo referencia estructural; esta
    versión todavía no abre M04.
  - No se heredan tolerancias, suelo, techo ni atomicidad de otros territorios.
  k_districts: 109
  k_source: norma
  k_rationale: K=109 conserva el tamaño vigente del Parlamento de Andalucía como regla
    institucional ex ante.
  district_apportionment: hamilton
  population_floor_ratio: 0.8
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  limits_profile: standard-1.0.0
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.75
  require_auditable_district_catalogue: true
modulos:
  modulo_01_preparar_base_territorial:
    province_codes:
    - '04'
    - '11'
    - '14'
    - '18'
    - '21'
    - '23'
    - '29'
    - '41'
    drop_missing_population: false
    out_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    out_report: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
    - u: '2102502002'
      v: '2102502001'
      edge_type: administrative_bridge
      reason: Componente censal físicamente separada de Cortegana; enlace al nodo
        del mismo municipio más próximo auditado (~3064 m).
      source: AND-02 auditoría geométrica reproducible
    - u: '2909401015'
      v: '2909403005'
      edge_type: administrative_bridge
      reason: Componente censal físicamente separada de Vélez-Málaga; enlace al nodo
        del mismo municipio más próximo auditado (~1658 m).
      source: AND-02 auditoría geométrica reproducible
  modulo_03_construir_grafo:
    in_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m02_adyacencias.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_{year}
    out_graph_json: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    out_report: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_{year}
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 109
    municipality_atomicity_limit_ratio: 1.75
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m04_semillas.geojson.zip
    out_report: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m04_informe.json
  modulo_05_optimizar_distritos:
    in_graph_json: territorios/andalucia/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json
    in_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_{year}
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_{year}
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 109
    strict_expected_k: true
    out_summary_csv: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m06_resumen_distritos.csv
    out_catalog_csv: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m06_catalogo_distritos.csv
    out_composition_csv: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m06_composicion_distritos.csv
    out_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m06_secciones.geojson.zip
    out_district_geojson: territorios/andalucia/.cache/ddd/preparacion/{run_name}/andalucia_2025_m06_distritos.geojson.zip
validation:
  expected_province_codes: *id001
  expected_sections_geometry: 6029
  expected_population_total_2025: 8676713
  require_unique_section_id: true
  require_non_null_population: true
  province_field: CPRO
  municipality_field: CUMUN
  municipality_name_field: NMUN
  require_one_graph_component_per_province: true
  require_connected_municipalities: true
  expected_districts: 109
  population_floor_ratio: 0.8
  population_cap_ratio: 1.75
  target_tolerance_ratio: 0.12
  province_apportionment: hamilton
  province_districts:
    '04': 9
    '11': 16
    '14': 10
    '18': 12
    '21': 7
    '23': 8
    '29': 22
    '41': 25
  require_graph_contiguity: true
  require_single_province_per_district: true
  require_municipality_discipline: true
  municipality_atomicity_limit_ratio: 1.75
  max_mixed_districts_per_split_municipality: 1
  require_m06_population_conservation: true
  require_m06_assignment_identity_with_m05: true
  population_floor_exempt_partitions: []
