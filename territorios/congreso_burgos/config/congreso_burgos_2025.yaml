  cache:
    dir: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}
  runs:
    dir: territorios/congreso_burgos/resultados/ejecuciones/{run_id}
territory_contract:
  unit_id_role: census_section
  admin_level_1_role: province
  admin_level_2_role: municipality
  province_codes: &id001
  - 09
  k_districts: 3
  k_source: formula
  k_rationale: 'Congreso: K=3 es la cuota de Burgos (CPRO 09) en N06-OWNER-20261012-K,
    con K_i igual al mayor entre 1 y la parte entera de (P_i + 60.000) entre 120.000,
    y K2025 = 407.'
  k_reference_scope: institutional_or_contractual_reference
  k_reference_source: null
  apportionment_source: ddd_design_policy
  legal_apportionment_reused: false
  legal_apportionment_context: null
  district_apportionment: hamilton
  population_floor_ratio: 0.85
  population_cap_ratio: 1.15
  target_tolerance_ratio: 0.15
  limits_profile: exception
  limits_exception_rationale: 'Reglas del Congreso del propietario, iguales que el
    piloto Huesca: suelo 85 %, techo 115 % y un municipio que cabe bajo el techo no
    se divide.'
  limits_exception_evidence: configuracion/politica_generacion_territorial_2025.yaml#territories.congreso_huesca.population_limits
  limits_exception_decided_at: '2026-10-31'
  require_graph_contiguity: true
  require_single_admin_level_1_per_district: true
  require_municipality_discipline: true
  oversized_municipality_rule: split_only_above_hard_cap
  municipality_atomicity_limit_ratio: 1.15
  require_auditable_district_catalogue: true
  status: generation_ready
modulos:
  modulo_01_preparar_base_territorial:
    province_codes: *id001
    drop_missing_population: false
    out_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m01_secciones_poblacion.geojson.zip
    out_report: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m01_informe.json
  modulo_02_construir_adyacencias:
    in_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    out_edges_jsonl: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m02_adyacencias.jsonl
    predicate: contact
    working_crs: EPSG:3035
    min_shared_border_m: 1.0
    max_precision_overlap_area_m2: 1.0
    buffer_m: 0.0
    simplify_m: 0.0
    max_candidates: 0
    log_every: 10000
    topology_bridges:
    - u: 0910901001
      v: 0921904001
      admin_scope: province:09
      edge_type: administrative_enclave
      reason: Enclave de Treviño enlazado al cuerpo principal de Burgos por la sección
        burgalesa más próxima (Miranda de Ebro).
      source: CYL-02 audit; heredado de territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml
    - u: 0922301001
      v: 0941401001
      admin_scope: province:09
      edge_type: cartographic_gap
      reason: 'Monasterio de la Sierra: hueco de 758 m en el seccionado hasta Valle
        de Valdelaguna.'
      source: CYL-02 geometry audit; heredado de territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml
    - u: 0915401001
      v: 0933001001
      admin_scope: province:09
      edge_type: cartographic_gap
      reason: 'Hacinas: hueco de 622 m en el seccionado hasta Salas de los Infantes.'
      source: CYL-02 audit; heredado de territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml
  modulo_03_construir_grafo:
    in_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m01_secciones_poblacion.geojson.zip
    in_edges_jsonl: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m02_adyacencias.jsonl
    id_field: CUSEC_KEY
    pop_field: POP_2023
    out_graph_json: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m03_grafo.json
    out_report: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m03_informe.json
  modulo_04_generar_semillas:
    in_graph_json: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m03_grafo.json
    in_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m01_secciones_poblacion.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    province_field: CPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    district_apportionment: hamilton
    k_districts: 3
    municipality_atomicity_limit_ratio: 1.15
    preserve_province_residual_feasibility: true
    seed: 12345
    out_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m04_semillas.geojson.zip
    out_report: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m04_informe.json
  modulo_05_optimizar_distritos:
    in_graph_json: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m03_grafo.json
    in_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m04_semillas.geojson.zip
    id_field: CUSEC_KEY
    pop_field: POP_2023
    district_field: district_id
    province_field: CPRO
    municipality_field: CUMUN
    greedy_moves_limit: 1000
    anneal_iters: 20000
    seed: 12345
    anneal_seed_offset: 0
    anneal_outside_penalty: 0.01
    anneal_maxdev_weight: 0.05
    anneal_churn_weight: 0.0016
    anneal_temp_start: 0.02
    anneal_temp_end: 0.0005
    swap_polish_max: 0
    out_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m05_distritos_optimizados.geojson.zip
    out_report: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m05_informe.json
  modulo_06_consolidar_distritos:
    in_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m05_distritos_optimizados.geojson.zip
    id_field: CUSEC_KEY
    district_field: district_id
    pop_field: POP_2023
    province_field: CPRO
    province_name_field: NPRO
    municipality_field: CUMUN
    municipality_name_field: NMUN
    cudis_field: CUDIS
    metric_crs: EPSG:3035
    expected_districts: 3
    strict_expected_k: true
    out_summary_csv: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m06_resumen_distritos.csv
    out_catalog_csv: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m06_catalogo_distritos.csv
    out_composition_csv: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m06_composicion_distritos.csv
    out_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m06_secciones.geojson.zip
    out_district_geojson: territorios/congreso_burgos/.cache/ddd/preparacion/{run_name}/congreso_burgos_2025_m06_distritos.geojson.zip
