# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Expansión España tras Madrid
# FECHA: 2026-09-12
# ESTADO: vigente — R022
# QUÉ HACE: ejecuta primero Madrid y, tras su éxito, paraleliza el bootstrap observable M01-M03 del resto de territorios pendientes.
# CAMBIOS: primera versión.
# MOTIVO: respetar el orden Cataluña → Madrid → resto de España, usando un único workflow reutilizable.
# ANTERIOR: ninguno — workflow nuevo.
name: R022 — Bootstrap España M01-M03
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-espana.yml'
      - '.github/workflows/_reutilizable-bootstrap-territorio.yml'
      - 'configuracion/catalogo_territorios_espana_2025.yaml'
      - 'herramientas/generar_config_bootstrap.py'
      - 'modulos/03_construir_grafo.py'
jobs:
  madrid:
    uses: ./.github/workflows/_reutilizable-bootstrap-territorio.yml
    with: {territory_id: madrid}
  resto:
    needs: madrid
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        territory:
          - comunidad_valenciana
          - galicia
          - castilla_la_mancha
          - pais_vasco
          - region_de_murcia
          - principado_de_asturias
          - comunidad_foral_de_navarra
          - cantabria
          - la_rioja
          - illes_balears
          - canarias
          - ceuta
          - melilla
    uses: ./.github/workflows/_reutilizable-bootstrap-territorio.yml
    with:
      territory_id: ${{ matrix.territory }}
