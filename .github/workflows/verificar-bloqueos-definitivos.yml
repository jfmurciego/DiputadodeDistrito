name: Verificar bloqueos definitivos Andalucía y Extremadura

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Descargar una vez los provisionales granulares y probar el bloqueo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 1 --connect-timeout 10 --max-time 90             -o andalucia.csv https://pub-36ce9aa148a348ae8d9b6686b7edf0c4.r2.dev/eleccionesdb-etl/data-raw/hechos/minsait/01-andalucia.csv
          curl --fail --location --retry 1 --connect-timeout 10 --max-time 60             -o extremadura.csv https://pub-36ce9aa148a348ae8d9b6686b7edf0c4.r2.dev/eleccionesdb-etl/data-raw/hechos/minsait/11-extremadura.csv
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path

          specs=[
            ('andalucia','andalucia.csv',6044,4128575,4157539,'BOJA 115/2026','https://www.juntadeandalucia.es/boja/2026/115/1','PENDING_SIEL_SNAPSHOT'),
            ('extremadura','extremadura.csv',966,522418,524837,'DOE 8/2026','https://doe.juntaex.es/otrosFormatos/html.php?anio=2026&doe=80o&xml=2026AC0001','BLOCKED_FINAL_GRANULAR_SOURCE'),
          ]
          out=[]
          for territory,file,expected_sections,expected_provisional,definitive,reference,url,state in specs:
              p=Path(file); raw=p.read_bytes()
              text=raw.decode('utf-8-sig','replace')
              rows=list(csv.DictReader(text.splitlines()))
              required={'codigo_provincia','codigo_municipio','codigo_distrito','codigo_seccion','partido','votos'}
              if not rows or not required.issubset(rows[0]):
                  raise SystemExit(f'{territory}: estructura Minsait no reconocible')
              sections=set(); votes=0
              for r in rows:
                  if not str(r.get('partido') or '').strip(): continue
                  key=tuple(str(r.get(k) or '').strip() for k in ('codigo_provincia','codigo_municipio','codigo_distrito','codigo_seccion'))
                  if not all(key): raise SystemExit(f'{territory}: sección no identificable')
                  sections.add(key)
                  votes+=int(float(str(r.get('votos') or 0).replace(',','.')))
              if len(sections)!=expected_sections:
                  raise SystemExit(f'{territory}: secciones={len(sections)} != {expected_sections}')
              if votes!=expected_provisional:
                  raise SystemExit(f'{territory}: provisional={votes} != {expected_provisional}')
              delta=definitive-votes
              if delta==0:
                  raise SystemExit(f'{territory}: el supuesto bloqueo ha desaparecido; revisar fuente antes de continuar')
              out.append({
                'territorio':territory,'secciones_provisional':len(sections),
                'votos_candidaturas_provisional':votes,'votos_candidaturas_definitivo':definitive,
                'delta_definitivo_menos_provisional':delta,'provisional_sha256':hashlib.sha256(raw).hexdigest(),
                'referencia_definitiva':reference,'url_referencia':url,
                'estado':state
              })
          Path('bloqueos-definitivos.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          with Path('bloqueos-definitivos.md').open('w',encoding='utf-8') as f:
              f.write('# Bloqueos definitivos reproducidos\n\n|Territorio|Secciones provisional|Votos provisional|Votos definitivo|Delta|Estado|\n|---|---:|---:|---:|---:|---|\n')
              for r in out:
                  f.write(f"|{r['territorio']}|{r['secciones_provisional']}|{r['votos_candidaturas_provisional']}|{r['votos_candidaturas_definitivo']}|{r['delta_definitivo_menos_provisional']}|{r['estado']}|\n")
          PY
          rm -f andalucia.csv extremadura.csv
          cat bloqueos-definitivos.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar evidencia pequeña
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bloqueos-definitivos
          path: |
            bloqueos-definitivos.json
            bloqueos-definitivos.md
          if-no-files-found: error
          retention-days: 7
