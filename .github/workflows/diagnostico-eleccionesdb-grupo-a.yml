name: Diagnóstico EleccionesDB · grupo A

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-eleccionesdb-grupo-a.yml'
      - 'configuracion/registro_electoral.yaml'
      - 'herramientas/adaptador_eleccionesdb.py'
      - 'herramientas/construir_snapshot_eleccionesdb.py'
      - 'herramientas/promover_catalogo_operacional.py'
      - 'herramientas/preflight_preparacion_fuente.py'
      - 'tests/test_adaptador_eleccionesdb.py'
      - 'tests/test_registro_electoral_comun.py'
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Descargar export upstream una sola vez
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/hmeleiro/eleccionesdb-etl/actions/artifacts?name=eleccionesdb-descargas&per_page=20',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r:data=json.load(r)
          arts=[a for a in data.get('artifacts',[]) if not a.get('expired')]
          if not arts:raise SystemExit('No hay artefacto eleccionesdb-descargas vigente')
          art=max(arts,key=lambda a:a['created_at']); print(f"artifact_id={art['id']} created_at={art['created_at']} size={art['size_in_bytes']}"); open('artifact_id.txt','w').write(str(art['id']))
          PY
          aid="$(cat artifact_id.txt)"; curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" --output eleccionesdb-descargas.zip "https://api.github.com/repos/hmeleiro/eleccionesdb-etl/actions/artifacts/${aid}/zip"
          unzip -q eleccionesdb-descargas.zip; sqlite_zip="$(find . -type f -name 'eleccionesdb_sqlite.zip' -print -quit)"; test -n "$sqlite_zip"; unzip -q "$sqlite_zip" -d sqlite-extract; db="$(find sqlite-extract -type f -name 'eleccionesdb.sqlite' -print -quit)"; test -n "$db"; mv "$db" eleccionesdb.sqlite
      - name: Medir cobertura de elecciones pendientes dentro del export completo
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, sqlite3
          from datetime import datetime, timezone, timedelta

          TARGET_DATES={'2023-05-28','2024-05-12','2025-12-21','2026-02-08','2026-03-15','2026-05-17'}
          TARGET_CCAA={'01':'andalucia','02':'aragon','07':'castilla_y_leon','09':'cataluna','11':'extremadura','18':'ceuta','19':'melilla'}

          def norm(v):
              if v is None or v=='': return ''
              try:
                  n=float(v)
              except (TypeError,ValueError):
                  return str(v)[:10]
              return (datetime(1970,1,1,tzinfo=timezone.utc)+timedelta(days=n)).date().isoformat()

          con=sqlite3.connect('eleccionesdb.sqlite'); con.row_factory=sqlite3.Row
          election_cols=[r[1] for r in con.execute('PRAGMA table_info(elecciones)')]
          rows=[]
          for e in con.execute('SELECT * FROM elecciones ORDER BY id'):
              d=dict(e); date=norm(d.get('fecha'))
              if date not in TARGET_DATES: continue
              eid=d.get('id')
              for ccaa,territory in TARGET_CCAA.items():
                  sec=con.execute("""SELECT COUNT(DISTINCT t.id)
                    FROM resumen_territorial r JOIN territorios t ON t.id=r.territorio_id
                    WHERE r.eleccion_id=? AND t.tipo='seccion' AND printf('%02d',CAST(t.codigo_ccaa AS INTEGER))=?""",(eid,ccaa)).fetchone()[0]
                  votes=con.execute("""SELECT COUNT(*),COALESCE(SUM(v.votos),0)
                    FROM votos_territoriales v JOIN territorios t ON t.id=v.territorio_id
                    WHERE v.eleccion_id=? AND t.tipo='seccion' AND printf('%02d',CAST(t.codigo_ccaa AS INTEGER))=?""",(eid,ccaa)).fetchone()
                  if not sec and not votes[0]: continue
                  srcs=[]
                  try:
                      srcs=[dict(x) for x in con.execute('SELECT * FROM elecciones_fuentes WHERE eleccion_id=?',(eid,))]
                  except sqlite3.OperationalError:
                      pass
                  label=' + '.join(str(x.get('fuente') or x.get('url_fuente') or '') for x in srcs if x.get('fuente') or x.get('url_fuente'))
                  rows.append({'territorio':territory,'ccaa':ccaa,'eleccionesdb_id':eid,'fecha':date,'secciones':sec,'filas_votos':votes[0],'votos':votes[1],'procedencia':label,'election_row':json.dumps({k:d.get(k) for k in election_cols},ensure_ascii=False,default=str)})
          con.close()
          rows.sort(key=lambda r:(r['territorio'],r['fecha'],int(r['eleccionesdb_id'])))
          fields=['territorio','ccaa','eleccionesdb_id','fecha','secciones','filas_votos','votos','procedencia','election_row']
          with open('cobertura-pendientes-eleccionesdb.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          with open('cobertura-pendientes-eleccionesdb.md','w',encoding='utf-8') as f:
              f.write('# Cobertura de pendientes encontrada en EleccionesDB completo\n\n')
              f.write('|Territorio|EDB|Fecha|Secciones|Filas votos|Votos|Procedencia|\n|---|---:|---|---:|---:|---:|---|\n')
              for r in rows:
                  f.write(f"|{r['territorio']}|{r['eleccionesdb_id']}|{r['fecha']}|{r['secciones']}|{r['filas_votos']}|{r['votos']}|{r['procedencia'].replace('|','/')}|\n")
          print(open('cobertura-pendientes-eleccionesdb.md',encoding='utf-8').read())
          PY
          cat cobertura-pendientes-eleccionesdb.md >> "$GITHUB_STEP_SUMMARY"

      - name: Construir snapshot compacto verificado de las doce elecciones
        run: |
          python herramientas/construir_snapshot_eleccionesdb.py --source eleccionesdb.sqlite --out ddd-eleccionesdb-snapshot.sqlite --meta ddd-eleccionesdb-snapshot.json
          test -s ddd-eleccionesdb-snapshot.sqlite; test "$(jq '.election_ids|length' ddd-eleccionesdb-snapshot.json)" = 11; test "$(jq '.logical_election_count' ddd-eleccionesdb-snapshot.json)" = 12
      - name: Probar el mismo adaptador sobre las doce elecciones
        run: |
          mkdir -p .ddd-eleccionesdb-packages
          python - <<'PY'
          import csv
          from pathlib import Path
          from herramientas.adaptador_eleccionesdb import ELECTIONS,build,sha256
          db=Path('ddd-eleccionesdb-snapshot.sqlite'); digest=sha256(db); rows=[]
          for election_id,(edb,ccaa,territory,date) in ELECTIONS.items():
              m=build(db,election_id,Path('.ddd-eleccionesdb-packages')/territory,digest)
              rows.append({'territorio':territory,'election_id':election_id,'eleccionesdb_id':edb,'fecha':date,'secciones':m['sections'],'filas_votos':m['records'],'partidos':m['parties'],'votos_candidaturas':m['candidate_votes'],'procedencia':' + '.join(x['fuente'] for x in m['provenance'] if x['fuente']),'snapshot_sha256':m['snapshot_sha256'],'package_source_sha256':m['source_sha256']})
          with open('cobertura-adaptador-eleccionesdb.csv','w',newline='',encoding='utf-8') as f:w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          with open('cobertura-adaptador-eleccionesdb.md','w',encoding='utf-8') as f:
              f.write('# Cobertura real adaptador EleccionesDB\n\n|Territorio|Elección|EDB|Secciones|Filas votos|Partidos|Procedencia|\n|---|---|---:|---:|---:|---:|---|\n')
              for r in rows:f.write(f"|{r['territorio']}|{r['election_id']}|{r['eleccionesdb_id']}|{r['secciones']}|{r['filas_votos']}|{r['partidos']}|{r['procedencia'].replace('|','/')}|\n")
          PY
          cat cobertura-adaptador-eleccionesdb.md >> "$GITHUB_STEP_SUMMARY"
      - name: Registrar en copia las doce elecciones con el mismo snapshot
        run: |
          set -euo pipefail
          rm -rf .ddd-registry-copy
          mkdir .ddd-registry-copy
          cp -a configuracion territorios herramientas .ddd-registry-copy/
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from herramientas.adaptador_eleccionesdb import ELECTIONS

          rows=[]
          for election_id,(edb,ccaa,territory,date) in ELECTIONS.items():
              pkg=Path('.ddd-eleccionesdb-packages')/territory
              manifest=json.loads((pkg/'manifest.json').read_text(encoding='utf-8'))
              digest=hashlib.sha256((pkg/'manifest.json').read_bytes()).hexdigest()
              artifact=f'ddd-electoral-package-{territory}-2025-147000'
              subprocess.run([
                  'python','herramientas/promover_catalogo_operacional.py',
                  '--kind','electoral_source',
                  '--territory-id',territory,
                  '--edition','2025',
                  '--run-id','147000',
                  '--artifact-name',artifact,
                  '--artifact-sha256',digest,
                  '--election-id',election_id,
                  '--source-commit',os.environ['GITHUB_SHA'],
              ],cwd='.ddd-registry-copy',check=True,capture_output=True,text=True)
              check=subprocess.run([
                  'python','herramientas/preflight_preparacion_fuente.py',
                  '--root-dir','.',
                  '--kind','electoral',
                  '--territory',territory,
                  '--edition','2025',
              ],cwd='.ddd-registry-copy',check=True,capture_output=True,text=True)
              durable=json.loads(check.stdout)
              expected={
                  'registered':True,
                  'run_id':147000,
                  'artifact_name':artifact,
                  'artifact_sha256':digest,
                  'election_id':election_id,
              }
              for key,value in expected.items():
                  if durable.get(key)!=value:
                      raise SystemExit(f'{territory}: registro en copia inválido {key}={durable.get(key)!r} != {value!r}')
              rows.append({
                  'territorio':territory,
                  'election_id':election_id,
                  'fecha':date,
                  'secciones':manifest['sections'],
                  'votos':manifest['candidate_votes'],
                  'filas_votos':manifest['records'],
                  'snapshot_sha256':manifest['snapshot_sha256'],
                  'package_sha256':digest,
                  'registro_copia':'PASS',
              })
          with open('registro-copia-eleccionesdb.csv','w',newline='',encoding='utf-8') as fh:
              writer=csv.DictWriter(fh,fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          with open('registro-copia-eleccionesdb.md','w',encoding='utf-8') as fh:
              fh.write('# Paquete + registro en copia — doce elecciones EleccionesDB\n\n')
              fh.write('|Territorio|Elección|Fecha|Secciones|Votos|Hash paquete|Registro copia|\n')
              fh.write('|---|---|---|---:|---:|---|---|\n')
              for row in rows:
                  fh.write(f"|{row['territorio']}|{row['election_id']}|{row['fecha']}|{row['secciones']}|{row['votos']}|{row['package_sha256']}|{row['registro_copia']}|\n")
          PY
          cat registro-copia-eleccionesdb.md >> "$GITHUB_STEP_SUMMARY"
      - name: Eliminar export upstream completo antes de publicar
        if: always()
        run: rm -rf eleccionesdb-descargas.zip artifact_id.txt eleccionesdb.sqlite sqlite-extract eleccionesdb_sqlite.zip eleccionesdb_parquet.zip eleccionesdb_csv.zip .ddd-eleccionesdb-packages .ddd-registry-copy
      - name: Publicar informe pequeño
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: diagnostico-eleccionesdb-grupo-a, path: "cobertura-adaptador-eleccionesdb.csv\ncobertura-adaptador-eleccionesdb.md\ncobertura-pendientes-eleccionesdb.csv\ncobertura-pendientes-eleccionesdb.md\nregistro-copia-eleccionesdb.csv\nregistro-copia-eleccionesdb.md\nddd-eleccionesdb-snapshot.json", if-no-files-found: error, retention-days: 7}
      - name: Publicar snapshot común para reutilización por 03
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: ddd-eleccionesdb-snapshot, path: "ddd-eleccionesdb-snapshot.sqlite\nddd-eleccionesdb-snapshot.json", if-no-files-found: error, retention-days: 90}
