# PROYECTO: Diputado de Distrito
# CLASE: interfaz de negocio — preparación electoral
# VERSIÓN: 1.1.0
# NOMBRE DE VERSIÓN: Preparación durable de resultados electorales
# FECHA: 2026-09-19
# ESTADO: candidato
# QUÉ HACE: resuelve automáticamente la convocatoria vigente para el territorio y prepara su paquete electoral; no ejecuta M01-M08.
# MOTIVO: el usuario elige territorio; la plataforma determina la convocatoria vigente y su edición territorial asociada.
name: Preparación de Resultados Electorales

on:
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        type: choice
        options:
          - Andalucía
          - Aragón
          - Principado de Asturias
          - Islas Baleares
          - Canarias
          - Cantabria
          - Castilla-La Mancha
          - Castilla y León
          - Cataluña
          - Comunidad Valenciana
          - Extremadura
          - Galicia
          - Comunidad de Madrid
          - Región de Murcia
          - Comunidad Foral de Navarra
          - País Vasco
          - La Rioja
          - Ceuta
          - Melilla
      reutilizar_si_ya_preparada:
        description: Reutilizar resultados electorales ya preparados
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  resolver:
    name: Resolver preparación electoral
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      edition: ${{ steps.resolve.outputs.edition }}
      election_id: ${{ steps.resolve.outputs.election_id }}
      election_date: ${{ steps.resolve.outputs.election_date }}
      contract_path: ${{ steps.resolve.outputs.contract_path }}
      electoral_declaration: ${{ steps.resolve.outputs.electoral_declaration }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env:
          TERRITORY: ${{ inputs.territory_id }}
        run: |
          set -euo pipefail
          python herramientas/catalogo_preparacion.py --root-dir . validate
          current="$(python herramientas/resolver_eleccion_vigente.py --root-dir . --territory "$TERRITORY")"
          edition="$(jq -r .territorial_edition <<<"$current")"
          row="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY" --edition "$edition")"
          echo "territory_id=$(jq -r .territory_id <<<"$current")" >> "$GITHUB_OUTPUT"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "election_id=$(jq -r .election_id <<<"$current")" >> "$GITHUB_OUTPUT"
          echo "election_date=$(jq -r .election_date <<<"$current")" >> "$GITHUB_OUTPUT"
          echo "contract_path=$(jq -r '.contract_path // empty' <<<"$row")" >> "$GITHUB_OUTPUT"
          echo "electoral_declaration=$(jq -r .declaration <<<"$current")" >> "$GITHUB_OUTPUT"

  electorales:
    name: Preparar resultados electorales
    needs: resolver
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ needs.resolver.outputs.edition }}
      PARAMS: ${{ needs.resolver.outputs.contract_path }}
      DECLARATION: ${{ needs.resolver.outputs.electoral_declaration }}
      ELECTION_ID: ${{ needs.resolver.outputs.election_id }}
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: previous
        name: Recuperar último paquete electoral congelado
        if: ${{ inputs.reutilizar_si_ya_preparada }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ddd-electoral-previous
          prefix="ddd-electoral-package-$TERRITORY_ID-$EDITION-"
          mapfile -t runs < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100" --jq '.workflow_runs|sort_by(.created_at)|reverse|.[].id')
          for rid in "${runs[@]}"; do
            arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts?per_page=100")"
            name="$(jq -r --arg p "$prefix" '.artifacts[]|select((.name|startswith($p)) and (.expired|not))|.name' <<<"$arts" | head -1)"
            [[ -n "$name" ]] || continue
            rm -rf .ddd-electoral-previous
            mkdir -p .ddd-electoral-previous
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "$name" --dir .ddd-electoral-previous >/dev/null 2>&1; then
              echo "run_id=$rid" >> "$GITHUB_OUTPUT"
              echo "artifact_name=$name" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - id: prepare
        name: Resolver REUSE / ACQUIRE / BLOCK
        continue-on-error: true
        shell: bash
        env:
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
          PREVIOUS_ARTIFACT_NAME: ${{ steps.previous.outputs.artifact_name }}
        run: |
          set -euo pipefail
          args=(--territory-id "$TERRITORY_ID" --edition "$EDITION" --package-out .ddd-electoral-package --root-dir .)
          [[ -n "$PARAMS" ]] && args+=(--params "$PARAMS")
          [[ -n "$DECLARATION" ]] && args+=(--declaration "$DECLARATION")
          if [[ -f .ddd-electoral-previous/manifest.json ]]; then
            args+=(--previous-package .ddd-electoral-previous)
            [[ -n "$PREVIOUS_RUN_ID" ]] && args+=(--previous-run-id "$PREVIOUS_RUN_ID")
            [[ -n "$PREVIOUS_ARTIFACT_NAME" ]] && args+=(--previous-artifact-name "$PREVIOUS_ARTIFACT_NAME")
          fi
          python -m herramientas.preparar_fuente_electoral "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ddd-electoral-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
          path: .ddd-electoral-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Aplicar decisión electoral
        if: always()
        run: |
          test -f .ddd-electoral-package/manifest.json
          decision="$(jq -r .decision .ddd-electoral-package/manifest.json)"
          case "$decision" in REUSE|ACQUIRE) ;; *) echo "::error::Preparación electoral BLOQUEADA"; exit 42;; esac
      - name: Registrar fuente electoral preparada
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="ddd-electoral-package-$TERRITORY_ID-$EDITION-$GITHUB_RUN_ID"
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name==\"$artifact_name\")")"
          test -n "$artifact" || { echo "::error::No existe el paquete electoral del run actual."; exit 47; }
          digest="$(jq -r '.digest // empty' <<<"$artifact")"
          test -n "$digest" || { echo "::error::Paquete electoral sin digest."; exit 47; }
          python herramientas/promover_catalogo_operacional.py \
            --kind electoral_source \
            --territory-id "$TERRITORY_ID" --edition "$EDITION" \
            --run-id "$GITHUB_RUN_ID" --artifact-name "$artifact_name" --artifact-sha256 "$digest" \
            --declaration "$DECLARATION" --election-id "$ELECTION_ID" --source-commit "$GITHUB_SHA"
          python herramientas/catalogo_preparacion.py --root-dir . validate
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add configuracion/catalogo_preparacion.yaml .github/workflows/incorporacion-resultados-electorales.yml \
            "territorios/$TERRITORY_ID/evidencia/catalogo/electoral_source_$EDITION.json"
          git diff --cached --quiet && exit 0
          git commit -m "chore: registrar fuente electoral preparada de $TERRITORY_ID"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "::error::No se pudo promover el catálogo electoral tras tres intentos."; exit 47

