# PROYECTO: Diputado de Distrito
# CLASE: workflow reutilizable de producción modular
# VERSIÓN: 2.7.0
# NOMBRE DE VERSIÓN: Fuentes durables REUSE/ACQUIRE/BLOCK
# FECHA: 2026-09-17
# ESTADO: candidato
name: Producción territorial modular M01–M08

on:
  workflow_call:
    inputs:
      params: {required: true, type: string}
      mode: {required: true, type: string}
      from_stage: {required: true, type: string}
      to_stage: {required: true, type: string}
      checkpoint_run_id: {required: false, type: string, default: ''}
      execution_authorization: {required: false, type: string, default: ''}

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  resolve:
    name: Resolver contrato y tramo
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.range.outputs.mode }}
      params: ${{ steps.resolve.outputs.params }}
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      cache_dir: ${{ steps.resolve.outputs.cache_dir }}
      runs_dir: ${{ steps.resolve.outputs.runs_dir }}
      from_num: ${{ steps.range.outputs.from_num }}
      to_num: ${{ steps.range.outputs.to_num }}
    env:
      PARAMS: ${{ inputs.params }}
      MODE: ${{ inputs.mode }}
      AUTHORIZATION: ${{ inputs.execution_authorization }}
      CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
      DDD_RUN_ID: production-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/resolver_ejecucion_territorial.py --params "$PARAMS" --run-id "$DDD_RUN_ID" --output decision.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          d=json.load(open('decision.json',encoding='utf-8'))
          for k in ('params','territory_id','cache_dir','runs_dir'): print(f'{k}={d[k]}')
          print(f"run_id=production-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          PY
      - id: range
        shell: bash
        env: {FROM_STAGE: "${{ inputs.from_stage }}", TO_STAGE: "${{ inputs.to_stage }}"}
        run: |
          set -euo pipefail
          stage_num(){ case "$1" in TERRITORY_PREPARATION|M01) echo 1;; TERRITORY_ADJACENCY|M02) echo 2;; TERRITORY_GRAPH|M03) echo 3;; DISTRICT_FORMATION|M04) echo 4;; DISTRICT_BALANCING|M05) echo 5;; TERRITORIAL_CERTIFICATION|M06) echo 6;; ELECTORAL_ENRICHMENT|M07) echo 7;; PUBLIC_PRODUCT_PUBLICATION|M08) echo 8;; *) return 1;; esac; }
          f=$(stage_num "$FROM_STAGE"); t=$(stage_num "$TO_STAGE"); (( f <= t ))
          [[ "$MODE" != execute || "$AUTHORIZATION" == EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION ]] || exit 21
          [[ $f -le 1 || "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]] || exit 22
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "from_num=$f" >> "$GITHUB_OUTPUT"; echo "to_num=$t" >> "$GITHUB_OUTPUT"

  official_sources:
    name: Fuentes oficiales · política durable
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' }}
    runs-on: ubuntu-24.04
    env:
      SOURCE_DECLARATION: territorios/${{ needs.resolve.outputs.territory_id }}/config/fuentes_oficiales.yaml
      CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
      FROM_NUM: ${{ needs.resolve.outputs.from_num }}
    steps:
      - uses: actions/checkout@v6
      - name: Recuperar checkpoint de fuentes al reanudar
        if: ${{ fromJSON(needs.resolve.outputs.from_num) > 1 }}
        uses: actions/download-artifact@v6
        with:
          name: ddd-state-${{ inputs.checkpoint_run_id }}-M06
          path: .ddd-source-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.checkpoint_run_id }}
      - name: Resolver REUSE o ACQUIRE antes del descargador
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ddd-source-package .ddd-source-next .ddd-sources
          checkpoint_args=()
          if [[ -d .ddd-source-checkpoint/sources ]]; then checkpoint_args=(--checkpoint-in .ddd-source-checkpoint); fi
          mode=$(python - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          d=yaml.safe_load(open(sys.argv[1],encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or 'verified_snapshot')
          PY
          )
          python herramientas/ejecutar_fuentes_workflow.py \
            --declaration "$SOURCE_DECLARATION" --working .ddd-source-package \
            "${checkpoint_args[@]}" --checkpoint-out .ddd-source-next \
            --acquisition-evidence .ddd-sources --environment production \
            --acquisition-mode "$mode" --root-dir .
          test -f .ddd-source-next/source_execution.json
      - name: Publicar evidencia REUSE/ACQUIRE
        uses: actions/upload-artifact@v6
        with:
          name: ddd-fuentes-${{ github.run_id }}
          path: .ddd-source-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Aplicar puerta de fuentes
        run: python -c "import json; d=json.load(open('.ddd-source-next/source_execution.json')); assert d['decision'] in ('REUSE','ACQUIRE')"

  m01:
    name: M01 · Base territorial y población
    needs: [resolve, official_sources]
    if: ${{ needs.resolve.result == 'success' && needs.official_sources.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 1 && fromJSON(needs.resolve.outputs.to_num) >= 1 }}
    runs-on: ubuntu-24.04
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M01, PREVIOUS_STAGE: '', PREVIOUS_RESULT: '', CHECKPOINT_RUN_ID: "${{ inputs.checkpoint_run_id }}"}
    steps: &module_steps
      - uses: actions/checkout@v6
      - id: state
        if: ${{ env.PREVIOUS_STAGE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREVIOUS_RESULT" == success ]]; then s="$GITHUB_RUN_ID"; else s="$CHECKPOINT_RUN_ID"; fi
          echo "run_id=$s" >> "$GITHUB_OUTPUT"
      - name: Recuperar estado acumulado anterior
        if: ${{ env.PREVIOUS_STAGE != '' }}
        uses: actions/download-artifact@v6
        with:
          name: ddd-state-${{ steps.state.outputs.run_id }}-${{ env.PREVIOUS_STAGE }}
          path: .ddd-state/in
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state.outputs.run_id }}
      - name: Restaurar estado contractual y fuentes congeladas
        if: ${{ env.PREVIOUS_STAGE != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR" "$RUNS_DIR" .ddd-source-package
          cp -a .ddd-state/in/cache/. "$CACHE_DIR/"
          cp -a .ddd-state/in/run/. "$RUNS_DIR/"
          if [[ -d .ddd-state/in/sources ]]; then cp -a .ddd-state/in/sources/. .ddd-source-package/; fi
      - name: Recuperar evidencia de fuentes de esta ejecución
        uses: actions/download-artifact@v6
        with:
          name: ddd-fuentes-${{ github.run_id }}
          path: .ddd-source-current
      - name: Incorporar paquete congelado validado
        run: |
          set -euo pipefail
          rm -rf .ddd-source-package
          mkdir -p .ddd-source-package
          cp -a .ddd-source-current/sources/. .ddd-source-package/
      - name: Ejecutar módulo
        run: >-
          docker run --rm -v "$PWD:/app" -w /app
          -e DDD_PARAMS="$PARAMS" -e DDD_RUN_ID="$RUN_ID"
          -e DDD_FROM_STAGE="$STAGE" -e DDD_TO_STAGE="$STAGE"
          -e DDD_CHAIN_STATE="$RUNS_DIR/CHAIN_STATE.json"
          --entrypoint /bin/bash ddd-production:${GITHUB_SHA} /app/procedimiento.sh
      - name: Empaquetar checkpoint acumulado del módulo
        run: |
          set -euo pipefail
          test -f "$RUNS_DIR/CHAIN_STATE.json"
          rm -rf .ddd-state/out
          mkdir -p .ddd-state/out/cache .ddd-state/out/run .ddd-state/out/sources
          cp -a "$CACHE_DIR/." .ddd-state/out/cache/
          cp -a "$RUNS_DIR/." .ddd-state/out/run/
          cp -a .ddd-source-package/. .ddd-state/out/sources/
      - uses: actions/upload-artifact@v6
        with:
          name: ddd-state-${{ github.run_id }}-${{ env.STAGE }}
          path: .ddd-state/out
          if-no-files-found: error
          retention-days: 14

  m02:
    needs: [resolve,m01]
    if: ${{ always() && needs.resolve.result == 'success' && fromJSON(needs.resolve.outputs.from_num) <= 2 && fromJSON(needs.resolve.outputs.to_num) >= 2 && needs.m01.result != 'failure' }}
    uses: ./.github/workflows/modulo-territorial-generico.yml
    with: {params: "${{ needs.resolve.outputs.params }}", stage: M02, previous_stage: M01, checkpoint_run_id: "${{ inputs.checkpoint_run_id }}"}
  m03:
    needs: [resolve,m02]
    if: ${{ always() && fromJSON(needs.resolve.outputs.from_num) <= 3 && fromJSON(needs.resolve.outputs.to_num) >= 3 && needs.m02.result != 'failure' }}
    uses: ./.github/workflows/modulo-territorial-generico.yml
    with: {params: "${{ needs.resolve.outputs.params }}", stage: M03, previous_stage: M02, checkpoint_run_id: "${{ inputs.checkpoint_run_id }}"}
  m04:
    needs: [resolve,m03]
    if: ${{ always() && fromJSON(needs.resolve.outputs.from_num) <= 4 && fromJSON(needs.resolve.outputs.to_num) >= 4 && needs.m03.result != 'failure' }}
    uses: ./.github/workflows/modulo-territorial-generico.yml
    with: {params: "${{ needs.resolve.outputs.params }}", stage: M04, previous_stage: M03, checkpoint_run_id: "${{ inputs.checkpoint_run_id }}"}
  m05:
    needs: [resolve,m04]
    if: ${{ always() && fromJSON(needs.resolve.outputs.from_num) <= 5 && fromJSON(needs.resolve.outputs.to_num) >= 5 && needs.m04.result != 'failure' }}
    uses: ./.github/workflows/modulo-territorial-generico.yml
    with: {params: "${{ needs.resolve.outputs.params }}", stage: M05, previous_stage: M04, checkpoint_run_id: "${{ inputs.checkpoint_run_id }}"}
  m06:
    needs: [resolve,m05]
    if: ${{ always() && fromJSON(needs.resolve.outputs.from_num) <= 6 && fromJSON(needs.resolve.outputs.to_num) >= 6 && needs.m05.result != 'failure' }}
    uses: ./.github/workflows/modulo-territorial-generico.yml
    with: {params: "${{ needs.resolve.outputs.params }}", stage: M06, previous_stage: M05, checkpoint_run_id: "${{ inputs.checkpoint_run_id }}"}
  m07:
    needs: [resolve,m06,official_sources]
    if: ${{ always() && fromJSON(needs.resolve.outputs.from_num) <= 7 && fromJSON(needs.resolve.outputs.to_num) >= 7 && needs.m06.result != 'failure' && needs.official_sources.result == 'success' }}
    uses: ./.github/workflows/modulo-territorial-generico.yml
    with: {params: "${{ needs.resolve.outputs.params }}", stage: M07, previous_stage: M06, checkpoint_run_id: "${{ inputs.checkpoint_run_id }}"}
  m08:
    needs: [resolve,m07]
    if: ${{ always() && fromJSON(needs.resolve.outputs.from_num) <= 8 && fromJSON(needs.resolve.outputs.to_num) >= 8 && needs.m07.result != 'failure' }}
    uses: ./.github/workflows/modulo-territorial-generico.yml
    with: {params: "${{ needs.resolve.outputs.params }}", stage: M08, previous_stage: M07, checkpoint_run_id: "${{ inputs.checkpoint_run_id }}"}
