# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.4.0
# NOMBRE DE VERSIÓN: Diseño A — puerta sintética única de la plataforma
# FECHA: 2026-09-20
# ESTADO: vigente
# QUÉ HACE: ejecuta la suite automática de regresión, determinismo y gobernanza en el mismo contenedor reproducible del procedimiento.
# CAMBIOS: conserva la suite canónica y añade smoke real de GerryChain 1.0 en su venv aislado.
# MOTIVO: mantener la puerta como CI automática y reservar la interfaz humana al workflow único.
# ANTERIOR: versión 1.3.0 en historial Git.
name: Pruebas de la Plataforma
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Auditar cabeceras y legacy en checkout
        run: python -m unittest tests.test_r015_invariantes.GovernanceHeaders -v
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-tests:${GITHUB_SHA} .
      - name: Verificar descubrimiento completo de tests unittest
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/verificar_descubrimiento_tests.py \
            2>&1 | tee ci-test-discovery.log
      - name: Verificar evidencia publicada y determinismo sintético
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee ci-unittest.log
      - name: Probar runtime GerryChain aislado
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e PYTHONHASHSEED=0 -e DDD_SKIP_LEGACY_CHECK=1 \
            --entrypoint /opt/ddd-gerrychain/bin/python ddd-tests:${GITHUB_SHA} \
            -m unittest tests.test_m05_gerrychain_strategy.ContractTests \
              tests.test_m05_gerrychain_strategy.GerryChainRuntimeTests -v \
            2>&1 | tee ci-gerrychain.log
      - name: Conservar diagnóstico de la suite
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-unittest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-test-discovery.log
            ci-unittest.log
            ci-gerrychain.log
          if-no-files-found: warn

  prueba_electoral_real_pr:
    name: Probar adquisición electoral real y registro durable en PR
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Obtener HEAD de la PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Instalar lector electoral
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 openpyxl==3.1.5
      - name: Adquirir y normalizar Principado de Asturias sin recuperar paquete previo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ddd-electoral-integration
          python -m herramientas.preparar_fuente_electoral \
            --territory-id principado_de_asturias \
            --edition 2025 \
            --package-out .ddd-electoral-integration \
            --root-dir . \
            --declaration territorios/principado_de_asturias/config/elecciones/asturias_jgpa_2023_vigente.yaml
          test -s .ddd-electoral-integration/manifest.json
          test "$(jq -r .decision .ddd-electoral-integration/manifest.json)" = "ACQUIRE"
          test "$(jq -r .election_id .ddd-electoral-integration/manifest.json)" = "asturias_jgpa_2023"
          test -s .ddd-electoral-integration/resultados_normalizados.csv
          test "$(($(wc -l < .ddd-electoral-integration/resultados_normalizados.csv) - 1))" -eq 23385
          test "$(jq -r '.selected_source.transform.sections' .ddd-electoral-integration/manifest.json)" -eq 824
          test "$(jq -r '.selected_source.transform.parties' .ddd-electoral-integration/manifest.json)" -eq 15
          test "$(jq -r '.selected_source.transform.source_verification_status' .ddd-electoral-integration/manifest.json)" = "VERIFIED_EXACT"
          digest="$(jq -r '.selected_source.sha256 // empty' .ddd-electoral-integration/manifest.json)"
          test -n "$digest"
          test "$digest" != "null"
          test "${#digest}" -eq 64
          printf '%s\n' "$digest" > .ddd-electoral-integration/selected_source.sha256
      - name: Verificar registro durable en copia de trabajo
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat .ddd-electoral-integration/selected_source.sha256)"
          run_id="$GITHUB_RUN_ID"
          artifact_name="ddd-electoral-package-principado_de_asturias-2025-$run_id"
          python herramientas/promover_catalogo_operacional.py \
            --kind electoral_source \
            --territory-id principado_de_asturias \
            --edition 2025 \
            --run-id "$run_id" \
            --artifact-name "$artifact_name" \
            --artifact-sha256 "$digest" \
            --declaration territorios/principado_de_asturias/config/elecciones/asturias_jgpa_2023_vigente.yaml \
            --election-id asturias_jgpa_2023 \
            --source-commit "$GITHUB_SHA"
          python herramientas/catalogo_preparacion.py --root-dir . validate
          durable="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind electoral --territory principado_de_asturias --edition 2025)"
          test "$(jq -r .registered <<<"$durable")" = "true"
          test "$(jq -r .run_id <<<"$durable")" = "$run_id"
          test "$(jq -r .artifact_name <<<"$durable")" = "$artifact_name"
          test "$(jq -r .artifact_sha256 <<<"$durable")" = "$digest"
          test "$(jq -r .election_id <<<"$durable")" = "asturias_jgpa_2023"
          evidence="$(jq -r .evidence_path <<<"$durable")"
          test -s "$evidence"
          test "$(jq -r .territory_id "$evidence")" = "principado_de_asturias"
          test "$(jq -r .edition "$evidence")" = "2025"
          test "$(jq -r .election_id "$evidence")" = "asturias_jgpa_2023"
          test "$(jq -r .artifact_sha256 "$evidence")" = "$digest"
          cp "$evidence" .ddd-electoral-integration/registro_durable.json
      - name: Conservar paquete y registro de prueba para revisión
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-electoral-asturias-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ddd-electoral-integration
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
