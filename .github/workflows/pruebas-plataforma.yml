# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.4.0
# NOMBRE DE VERSIÓN: Diseño A — puerta sintética única de la plataforma
# FECHA: 2026-09-20
# ESTADO: vigente
# QUÉ HACE: ejecuta la suite automática de regresión, determinismo y gobernanza en el mismo contenedor reproducible del procedimiento.
# CAMBIOS: conserva la suite canónica y añade smoke real de GerryChain 1.0 en su venv aislado.
# MOTIVO: mantener la puerta como CI automática y reservar la interfaz humana al workflow único.
# ANTERIOR: versión 1.3.0 en historial Git.
name: Pruebas de la Plataforma
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Auditar cabeceras y legacy en checkout
        run: python -m unittest tests.test_r015_invariantes.GovernanceHeaders -v
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-tests:${GITHUB_SHA} .
      - name: Verificar descubrimiento completo de tests unittest
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/verificar_descubrimiento_tests.py \
            2>&1 | tee ci-test-discovery.log
      - name: Verificar evidencia publicada y determinismo sintético
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee ci-unittest.log
      - name: Probar runtime GerryChain aislado
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e PYTHONHASHSEED=0 -e DDD_SKIP_LEGACY_CHECK=1 \
            --entrypoint /opt/ddd-gerrychain/bin/python ddd-tests:${GITHUB_SHA} \
            -m unittest tests.test_m05_gerrychain_strategy.ContractTests \
              tests.test_m05_gerrychain_strategy.GerryChainRuntimeTests -v \
            2>&1 | tee ci-gerrychain.log
      - name: Conservar diagnóstico de la suite
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-unittest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-test-discovery.log
            ci-unittest.log
            ci-gerrychain.log
          if-no-files-found: warn
