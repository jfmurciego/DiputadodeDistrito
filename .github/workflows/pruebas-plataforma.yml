# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.6.0
# NOMBRE DE VERSIÓN: Diseño A — suite en paralelo con check agregado `pruebas`
# FECHA: 2026-11-07
# ESTADO: vigente
# QUÉ HACE: ejecuta la suite automática de regresión, determinismo y gobernanza en el mismo contenedor reproducible del procedimiento.
# CAMBIOS: 1.6.0 (T-50): el guardián y las pruebas ligeras van en un job rápido (`guardian`); la suite unittest se
#   reparte en 5 grupos paralelos equilibrados por tiempo (`herramientas/repartir_tests.py`, tiempos en
#   `tests/tiempos_ci.json`), cada uno en su contenedor; el grupo 1 hace además el descubrimiento, GerryChain y los
#   pasos N08 condicionales. El check obligatorio sigue llamándose `pruebas`: job final que depende de todos y falla
#   si alguno no termina en success. No se quita ningún test.
# MOTIVO: `pruebas` tardaba ~13-15 min (2.168 tests, ~660 s en un solo proceso).
# ANTERIOR: legacy/workflows/pruebas-plataforma_v1.5.0.yml
name: Pruebas de la Plataforma
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ddd-pruebas-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  guardian:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guardián de main — sin marcas de conflicto en ficheros versionados
        run: python herramientas/comprobar_guardian_main.py marcas
      - name: Guardián de main — numeración consecutiva del registro de cambios
        run: python herramientas/comprobar_guardian_main.py registro
      - name: Auditar cabeceras y legacy en checkout
        run: python -m unittest tests.test_r015_invariantes.GovernanceHeaders -v
      - name: Probar SHA inmutable frente a avance de main
        run: bash tests/test_source_sha_pinning_git.sh
      - name: Probar registros electorales concurrentes sobre Git real
        run: python -m unittest tests.test_registro_producto_electoral_concurrencia -v
      - name: Probar persistencia pre-M04 concurrente sobre Git real
        run: python -m unittest tests.test_pre_m04_persistencia_concurrente -v
      - name: Probar recuperación durable de producto electoral
        run: python -m unittest tests.test_recuperacion_producto_electoral -v
      - name: Probar reanudación automática de M08 huérfano
        run: python -m unittest tests.test_reanudacion_m08_huerfano -v
      - name: Verificar geometría original INE 2025 en checkout
        run: python -m unittest tests.test_national_ine_original_parts -v

  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2, 3, 4, 5]
    env:
      GRUPOS: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-tests:${GITHUB_SHA} .
      - name: Diagnóstico original N08 de nueve provincias (solo PR 268)
        if: ${{ matrix.grupo == 1 && github.event_name == 'pull_request' && github.event.pull_request.number == 268 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 \
            -v "${GITHUB_WORKSPACE}/inputs/partes:/app/inputs/partes:ro" \
            --entrypoint python ddd-tests:${GITHUB_SHA} \
            -m herramientas.diagnosticar_desconexiones_congreso_n08 \
            2>&1 | tee ci-n08-nine-cases.log
      - name: Exportar expedientes nominales N08 originales (rama de expedientes)
        if: ${{ matrix.grupo == 1 && github.event_name == 'pull_request' && github.head_ref == 'work/n08-nominal-exceptions-20261019' }}
        shell: bash
        run: |
          mkdir -p n08-casos-certificados
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 \
            -v "${GITHUB_WORKSPACE}/n08-casos-certificados:/app/n08-casos-certificados" \
            --entrypoint python ddd-tests:${GITHUB_SHA} \
            -m herramientas.expedientes_excepciones_congreso_n08 \
            --output /app/n08-casos-certificados/expedientes-n08-cinco-provincias.json
      - name: Conservar expedientes nominales N08 y sus CUSEC
        if: ${{ always() && matrix.grupo == 1 && github.event_name == 'pull_request' && github.head_ref == 'work/n08-nominal-exceptions-20261019' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: n08-cinco-provincias-cusec-original
          path: n08-casos-certificados/expedientes-n08-cinco-provincias.json
          retention-days: 90
          if-no-files-found: warn
      - name: Verificar descubrimiento completo de tests unittest
        if: ${{ matrix.grupo == 1 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/verificar_descubrimiento_tests.py \
            2>&1 | tee ci-test-discovery.log
      - name: Verificar evidencia publicada y determinismo sintético (grupo ${{ matrix.grupo }} de 5)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/repartir_tests.py --grupos "$GRUPOS" --grupo ${{ matrix.grupo }} \
            2>&1 | tee ci-unittest.log
      - name: Probar runtime GerryChain aislado
        if: ${{ matrix.grupo == 1 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e PYTHONHASHSEED=0 -e DDD_SKIP_LEGACY_CHECK=1 \
            --entrypoint /opt/ddd-gerrychain/bin/python ddd-tests:${GITHUB_SHA} \
            -m unittest tests.test_m05_gerrychain_strategy.ContractTests \
              tests.test_m05_gerrychain_strategy.GerryChainRuntimeTests -v \
            2>&1 | tee ci-gerrychain.log
      - name: Conservar diagnóstico de la suite
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-unittest-${{ github.run_id }}-${{ github.run_attempt }}-grupo-${{ matrix.grupo }}
          path: |
            ci-test-discovery.log
            ci-unittest.log
            ci-gerrychain.log
            ci-n08-nine-cases.log
          if-no-files-found: warn

  pruebas:
    needs: [guardian, suite]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Agregar resultado (check obligatorio del ruleset)
        shell: bash
        env:
          GUARDIAN: ${{ needs.guardian.result }}
          SUITE: ${{ needs.suite.result }}
        run: |
          echo "guardian=$GUARDIAN suite=$SUITE"
          if [[ "$GUARDIAN" != "success" || "$SUITE" != "success" ]]; then
            echo "::error::pruebas en rojo: guardian=$GUARDIAN, suite=$SUITE."; exit 1
          fi
          echo "pruebas en verde."
