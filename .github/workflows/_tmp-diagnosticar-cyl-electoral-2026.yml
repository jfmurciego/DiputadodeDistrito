name: Diagnóstico temporal electoral CyL 2026
on:
  push:
    branches: [prep/cyl-electoral-2026]
permissions:
  actions: read
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Recuperar fuente preparada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp-diag
          gh run download 35325518294 --repo "$GITHUB_REPOSITORY" --name cyl-electoral-2026-preparado --dir .tmp-diag
      - name: Inspeccionar claves territoriales 2026
        shell: bash
        run: |
          python - <<'PY'
          import csv,re,unicodedata,json
          from collections import Counter
          from pathlib import Path
          p=Path('.tmp-diag/original.csv')
          text=p.read_text(encoding='utf-8-sig')
          d=csv.Sniffer().sniff(text[:65536],delimiters=';,\t,')
          rows=list(csv.DictReader(text.splitlines(),dialect=d))
          rows=[r for r in rows if re.sub(r'\D','',str(r.get('Año','')))=='2026']
          print('rows',len(rows))
          print('sample',json.dumps(rows[:5],ensure_ascii=False,indent=2))
          for k in ['Código de mesa','Código municipio','Distrito','Sección','Mesa','Provincia']:
              vals=[str(r.get(k,'')) for r in rows]
              print(k,'lengths',Counter(map(len,vals)).most_common(20),'sample_unique',list(dict.fromkeys(vals))[:20])
          PY
