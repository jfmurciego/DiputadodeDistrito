# PROYECTO: Diputado de Distrito
# CLASE: congelado
# VERSIÓN: 1.0.1
# NOMBRE DE VERSIÓN: R027 cuotas Hamilton explícitas
# FECHA: 2026-09-12
# ESTADO: experimento; no promueve contrato.
# QUÉ HACE: prepara Cataluña y Madrid una vez y barre 12 candidatos M04 con K institucional de referencia 135.
# CAMBIOS: calcula población provincial desde M01 y materializa province_districts por Hamilton antes de M04.
# MOTIVO: el primer run 34689188752 llegó a M04 pero abortó porque el motor exige cuotas provinciales explícitas; no fue inviabilidad territorial.
# ANTERIOR: legacy/workflows/r027-m04-cataluna-madrid_v1.0.0.yml
name: R027 — M04 Cataluña y Madrid
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  preparar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {territory: cataluna, config: territorios/cataluna/config/cataluna_2025.yaml}
          - {territory: madrid, config: territorios/madrid/config/madrid_2025.yaml}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TID: ${{ matrix.territory }}
      CFG: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-r027:${GITHUB_SHA} .
      - name: M01-M03
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint bash ddd-r027:${GITHUB_SHA} -lc "
            python modulos/01_preparar_base_territorial.py --params '$CFG'
            python modulos/02_construir_adyacencias.py --params '$CFG'
            python modulos/03_construir_grafo.py --params '$CFG'"
          sudo chown -R "$(id -u):$(id -g)" "territorios/$TID/.cache/ddd"
      - uses: actions/upload-artifact@v6
        with:
          name: r027-baseline-${{ matrix.territory }}
          path: |
            territorios/${{ matrix.territory }}/.cache/ddd/preparacion/${{ matrix.territory }}_2025/*_m01_secciones_poblacion.geojson.zip
            territorios/${{ matrix.territory }}/.cache/ddd/preparacion/${{ matrix.territory }}_2025/*_m03_grafo.json
  barrido:
    needs: preparar
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        territory: [cataluna, madrid]
        atomicity: ['1.05','1.10']
        chunk: ['0.16','0.20','0.24']
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TID: ${{ matrix.territory }}
      ATOMICITY: ${{ matrix.atomicity }}
      CHUNK: ${{ matrix.chunk }}
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - uses: actions/download-artifact@v6
        with:
          name: r027-baseline-${{ matrix.territory }}
          path: territorios/${{ matrix.territory }}/.cache/ddd/preparacion/${{ matrix.territory }}_2025
      - name: Entorno
        run: docker build --pull -t ddd-r027:${GITHUB_SHA} .
      - name: Preparar y ejecutar M04
        run: |
          set -euo pipefail
          LABEL="a${ATOMICITY/./}_c${CHUNK/./}"; BASE="territorios/$TID/.cache/ddd/preparacion/${TID}_2025/r027/$LABEL"; mkdir -p "$BASE"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-r027:${GITHUB_SHA} herramientas/construir_unidades_internas_m04.py             --geojson "territorios/$TID/.cache/ddd/preparacion/${TID}_2025/${TID}_2025_m01_secciones_poblacion.geojson.zip"             --graph "territorios/$TID/.cache/ddd/preparacion/${TID}_2025/${TID}_2025_m03_grafo.json"             --out-geojson "$BASE/m04_input.geojson" --out-report "$BASE/units_report.json"             --k 135 --id-field CUSEC_KEY --municipality-field CUMUN --population-field POP_2025             --partition-unit-field M04_PARTITION_UNIT --atomicity-ratio "$ATOMICITY" --chunk-ratio "$CHUNK"
          python - <<'PY'
          import copy,os,pathlib,yaml,zipfile,json,collections,math
          tid=os.environ["TID"];a=os.environ["ATOMICITY"];ch=os.environ["CHUNK"];label=f"a{a.replace('.','')}_c{ch.replace('.','')}";root=pathlib.Path(".");src=root/"territorios"/tid/"config"/f"{tid}_2025.yaml";c=copy.deepcopy(yaml.safe_load(src.read_text()));base=f"territorios/{tid}/.cache/ddd/preparacion/{{run_name}}/r027/{label}"
          c["modulos"]["modulo_04_generar_semillas"]={"in_graph_json":f"territorios/{tid}/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_m03_grafo.json","in_geojson":base+"/m04_input.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_PARTITION_UNIT","municipality_name_field":"NMUN","district_apportionment":"hamilton","k_districts":135,"municipality_atomicity_limit_ratio":float(a),"seed":12345,"out_geojson":base+"/m04.geojson.zip","out_report":base+"/m04_report.json"}
          geo=root/"territorios"/tid/".cache/ddd/preparacion"/f"{tid}_2025"/f"{tid}_2025_m01_secciones_poblacion.geojson.zip"
          with zipfile.ZipFile(geo) as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));features=json.loads(z.read(n))["features"]
          pops=collections.defaultdict(int)
          for f in features:p=f["properties"];pops[str(p["CPRO"]).zfill(2)]+=int(p["POP_2025"])
          total=sum(pops.values());raw={p:135*v/total for p,v in pops.items()};quotas={p:math.floor(v) for p,v in raw.items()}
          for p in sorted(pops,key=lambda p:(-(raw[p]-quotas[p]),p))[:135-sum(quotas.values())]:quotas[p]+=1
          c["validation"].update({"expected_districts":135,"population_floor_ratio":.80,"population_cap_ratio":1.75,"target_tolerance_ratio":.12,"province_districts":quotas})
          p=root/"territorios"/tid/"config"/f".generated_r027_{label}.yaml";p.write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True));print(p)
          PY
          CFG="territorios/$TID/config/.generated_r027_$LABEL.yaml"
          set +e
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-r027:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params "$CFG" 2>&1 | tee "$BASE/m04.log"
          rc=${PIPESTATUS[0]};set -e;echo "$rc" > "$BASE/m04_exit.txt"
          python - <<'PY'
          import json,os,pathlib,re
          tid=os.environ["TID"];a=os.environ["ATOMICITY"];ch=os.environ["CHUNK"];label=f"a{a.replace('.','')}_c{ch.replace('.','')}";b=pathlib.Path("territorios")/tid/".cache/ddd/preparacion"/f"{tid}_2025"/"r027"/label;u=json.loads((b/"units_report.json").read_text());rc=int((b/"m04_exit.txt").read_text());r=json.loads((b/"m04_report.json").read_text()) if (b/"m04_report.json").exists() else {};m=re.search(r"mantiene (\d+) distritos fuera",(b/"m04.log").read_text())
          out={"territory_id":tid,"label":label,"k_reference":135,"atomicity":float(a),"chunk":float(ch),"partition_units":u.get("partition_units"),"m04_exit":rc,"hard_outliers_from_log":int(m.group(1)) if m else None,"m04_report":r,"status":"M04_FEASIBLE" if rc==0 else "M04_INFEASIBLE","promotion":False};(b/"summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps({k:v for k,v in out.items() if k!="m04_report"},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: r027-${{ matrix.territory }}-${{ matrix.atomicity }}-${{ matrix.chunk }}-${{ github.run_id }}
          path: territorios/${{ matrix.territory }}/.cache/ddd/preparacion/${{ matrix.territory }}_2025/r027/
