name: Preparación temporal electoral CyL 2026
on:
  push:
    branches: [prep/cyl-electoral-2026]
permissions:
  contents: write
  actions: read
jobs:
  preparar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Descargar y normalizar fuente oficial JCyL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-cyl-electoral
          url='https://analisis.datosabiertos.jcyl.es/api/explore/v2.1/catalog/datasets/resultados-electorales-1983-actualidad/exports/csv?lang=es&timezone=Europe%2FMadrid&use_labels=true&delimiter=%3B'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 "$url" -o .tmp-cyl-electoral/original.csv
          python - <<'PY'
          import csv,hashlib,json,re,unicodedata
          from collections import defaultdict
          from pathlib import Path
          p=Path('.tmp-cyl-electoral/original.csv'); raw=p.read_bytes()
          if raw.lstrip().lower().startswith((b'<!doctype html',b'<html')): raise SystemExit('HTML recibido')
          text=raw.decode('utf-8-sig')
          try: d=csv.Sniffer().sniff(text[:65536],delimiters=';,\t,')
          except Exception:
              class D(csv.excel): delimiter=';'
              d=D()
          rows=list(csv.DictReader(text.splitlines(),dialect=d))
          if not rows: raise SystemExit('CSV oficial vacío')
          headers=list(rows[0])
          def n(s):
              s=unicodedata.normalize('NFKD',str(s or '')); s=''.join(c for c in s if not unicodedata.combining(c))
              return re.sub(r'[^a-z0-9]+',' ',s.casefold()).strip()
          idx={n(h):h for h in headers}
          def c(*xs):
              for x in xs:
                  if n(x) in idx:return idx[n(x)]
              raise SystemExit(f'Falta columna {xs}; cabeceras={headers}')
          cy=c('Año','Ano'); cmesa=c('Código de mesa','Codigo de mesa'); cp=c('Partido'); cv=c('Nº Votos','N Votos','Numero votos')
          agg=defaultdict(int); inrows=0
          for r in rows:
              if re.sub(r'\D','',str(r.get(cy,'')))!='2026': continue
              inrows+=1
              parts=str(r.get(cmesa,'')).strip().split('-')
              if len(parts) < 5: raise SystemExit(f'Código de mesa inválido: {r.get(cmesa)!r}')
              prov=re.sub(r'\D','',parts[0]).zfill(2)
              mun=re.sub(r'\D','',parts[1]).zfill(3)
              dis=re.sub(r'\D','',parts[2]).zfill(2)
              sec=re.sub(r'\D','',parts[3]).zfill(3)
              party=' '.join(str(r.get(cp,'')).split())
              votes=int(re.sub(r'[^0-9-]','',str(r.get(cv,''))) or '0')
              if party: agg[(prov+mun+dis+sec,party)]+=votes
          if not agg: raise SystemExit('No hay resultados 2026 en la descarga')
          out=Path('.tmp-cyl-electoral/cyl_2026_secciones_partidos.csv')
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['section_id','party','votes'])
              for (sid,party),votes in sorted(agg.items()): w.writerow([sid,party,votes])
          parties=sorted({party for _,party in agg}); sections=sorted({sid for sid,_ in agg})
          def slug(s):
              t=unicodedata.normalize('NFKD',s); t=''.join(c for c in t if not unicodedata.combining(c))
              return re.sub(r'[^A-Za-z0-9]+','_',t).strip('_').upper() or 'PARTY'
          used={}; plist=[]
          for party in parties:
              base=slug(party); cid=base; i=2
              while cid in used and used[cid]!=party: cid=f'{base}_{i}'; i+=1
              used[cid]=party; plist.append({'canonical_id':cid,'display_name':party,'aliases':[party]})
          dp=Path('.tmp-cyl-electoral/diccionario_partidos_cyl_2026.json')
          dp.write_text(json.dumps({'schema_family':'ddd-party-dictionary','schema_version':'1.0.0','unknown_party_policy':'reject','parties':plist},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sha=lambda x: hashlib.sha256(Path(x).read_bytes()).hexdigest()
          meta={'source_bytes':len(raw),'source_sha256':hashlib.sha256(raw).hexdigest(),'rows_2026_input':inrows,'normalized_rows':len(agg),'sections':len(sections),'parties':len(parties),'normalized_sha256':sha(out),'dictionary_sha256':sha(dp),'headers':headers,'party_labels':parties}
          Path('.tmp-cyl-electoral/metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - name: Comparar universo 2026 con checkpoint M06
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-m06
          gh run download 35319351944 --repo "$GITHUB_REPOSITORY" --name ddd-state-35319351944-M06 --dir .tmp-m06
          python - <<'PY'
          import csv,json,zipfile
          from pathlib import Path
          electoral=set(); section_votes={}
          with Path('.tmp-cyl-electoral/cyl_2026_secciones_partidos.csv').open(encoding='utf-8') as f:
              for r in csv.DictReader(f):
                  sid=str(r['section_id']); electoral.add(sid)
                  section_votes[sid]=section_votes.get(sid,0)+int(r['votes'])
          candidates=list(Path('.tmp-m06').rglob('*m06_secciones*.geojson.zip'))
          if not candidates: raise SystemExit('No se encontró M06 secciones en checkpoint')
          z=candidates[0]
          with zipfile.ZipFile(z) as zz:
              names=[n for n in zz.namelist() if n.lower().endswith(('.geojson','.json'))]
              if not names: raise SystemExit(f'ZIP sin geojson: {z}')
              data=json.loads(zz.read(names[0]).decode('utf-8'))
          m06={str(ft.get('properties',{}).get('CUSEC_KEY') or ft.get('properties',{}).get('CUSEC') or '') for ft in data.get('features',[])}
          m06.discard('')
          only_e=sorted(electoral-m06); only_m=sorted(m06-electoral)
          district_by_section={}
          for ft in data.get('features',[]):
              pr=ft.get('properties',{})
              sid=str(pr.get('CUSEC_KEY') or pr.get('CUSEC') or '')
              if sid: district_by_section[sid]=pr.get('district_id')
          candidates={}; candidate_districts={}
          for sid in only_e:
              prefix=sid[:7]
              same=sorted(x for x in m06 if x[:7]==prefix)
              candidates[sid]=same
              candidate_districts[sid]=sorted({str(district_by_section.get(x)) for x in same if district_by_section.get(x) is not None})
          out={'electoral_sections':len(electoral),'m06_sections':len(m06),'intersection':len(electoral&m06),'electoral_only':only_e,'m06_only':only_m,'electoral_only_votes':{sid:section_votes.get(sid,0) for sid in only_e},'electoral_only_total_votes':sum(section_votes.get(sid,0) for sid in only_e),'same_district_m06_candidates':candidates,'candidate_ddd_districts':candidate_districts}
          Path('.tmp-cyl-electoral/reconciliation_sections.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Congelar copia normalizada verificable en la rama de preparación
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs territorios/castilla_y_leon/config/elecciones territorios/castilla_y_leon/evidencia
          cp .tmp-cyl-electoral/cyl_2026_secciones_partidos.csv inputs/cyl_2026_secciones_partidos.csv
          cp .tmp-cyl-electoral/diccionario_partidos_cyl_2026.json territorios/castilla_y_leon/config/elecciones/diccionario_partidos_cyl_2026.json
          cp .tmp-cyl-electoral/reconciliation_sections.json territorios/castilla_y_leon/evidencia/reconciliacion_secciones_2025_2026.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inputs/cyl_2026_secciones_partidos.csv territorios/castilla_y_leon/config/elecciones/diccionario_partidos_cyl_2026.json territorios/castilla_y_leon/evidencia/reconciliacion_secciones_2025_2026.json
          git diff --cached --quiet && exit 0
          git commit -m "data: congelar fuente electoral oficial CyL 2026"
          git push origin HEAD:prep/cyl-electoral-2026
      - uses: actions/upload-artifact@v6
        with:
          name: cyl-electoral-2026-preparado
          path: .tmp-cyl-electoral
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
