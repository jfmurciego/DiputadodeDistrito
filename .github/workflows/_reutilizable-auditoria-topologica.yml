# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Diagnóstico topológico territorial reutilizable
# FECHA: 2026-09-12
# ESTADO: vigente — R023
# QUÉ HACE: reproduce M01-M03 observable y explica geométricamente todas las componentes provinciales o municipales separadas.
# CAMBIOS: primera versión.
# MOTIVO: convertir los hallazgos del bootstrap nacional en diagnósticos auditables sin añadir pasarelas automáticas.
# ANTERIOR: ninguno — workflow nuevo.
name: Reutilizable — Diagnóstico Topológico Territorial
on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
permissions: {contents: read}
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TID: ${{ inputs.territory_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-r023:${GITHUB_SHA} .
      - name: Ejecutar M01-M03 observable
        run: |
          set -euo pipefail
          mkdir -p "territorios/$TID/config"
          CFG="territorios/$TID/config/.generated_bootstrap_2025.yaml"
          python herramientas/generar_config_bootstrap.py --territory "$TID" --out "$CFG"
          docker run --rm -v "$PWD:/app" --entrypoint bash ddd-r023:${GITHUB_SHA} -lc "
            python modulos/01_preparar_base_territorial.py --params '$CFG'
            python modulos/02_construir_adyacencias.py --params '$CFG'
            python modulos/03_construir_grafo.py --params '$CFG'"
          sudo chown -R "$(id -u):$(id -g)" "territorios/$TID/.cache/ddd"
      - name: Explicar componentes
        run: |
          set -euo pipefail
          RUN="${TID}_2025"; BASE="territorios/$TID/.cache/ddd/preparacion/$RUN"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-r023:${GITHUB_SHA} herramientas/auditar_geometria_componentes.py             --geojson "$BASE/${RUN}_m01_secciones_poblacion.geojson.zip"             --graph "$BASE/${RUN}_m03_grafo.json"             --out "$BASE/RELACIONES_GEOMETRICAS.json" --nearest 8
          sudo chown -R "$(id -u):$(id -g)" "$BASE"
      - name: Resumen ligero
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          tid=os.environ["TID"];run=f"{tid}_2025";b=pathlib.Path("territorios")/tid/".cache/ddd/preparacion"/run
          m1=json.loads((b/f"{run}_m01_informe.json").read_text());m3=json.loads((b/f"{run}_m03_informe.json").read_text());g=json.loads((b/"RELACIONES_GEOMETRICAS.json").read_text())
          out={"status":"DIAGNOSED","territory_id":tid,"run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"sections":m1["rows_out"],"population":m3["total_pop"],"edges":m3["edges"],"isolated":m3["isolated"],"province_disconnected":m3["province_component_audit"]["disconnected"],"municipality_disconnected":m3["municipality_component_audit"]["disconnected"],"province_components":g["province_disconnected_components"],"municipality_components":g["municipality_disconnected_components"],"decision":"AUDIT_BEFORE_BRIDGE"}
          (b/"RESUMEN_DIAGNOSTICO.json").write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps({k:v for k,v in out.items() if k not in ("province_components","municipality_components")},ensure_ascii=False))
          PY
      - name: Publicar resumen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r023-${{ inputs.territory_id }}-summary-${{ github.run_id }}
          path: |
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/RESUMEN_DIAGNOSTICO.json
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_m01_informe.json
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_m03_informe.json
      - name: Publicar geometría
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r023-${{ inputs.territory_id }}-geometry-${{ github.run_id }}
          path: |
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/RELACIONES_GEOMETRICAS.json
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*.geojson.zip
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_m03_grafo.json
