name: Diagnóstico fuentes electorales pendientes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: SIEL Andalucía 2026 — prueba acotada, sin reintentos largos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,io,json,urllib.parse,urllib.request
          from pathlib import Path

          def fetch(url,timeout=8,headers=None):
              h={'User-Agent':'DDD-electoral-source-diagnostic/3.0'}
              h.update(headers or {})
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.headers.get('Content-Type',''),r.read(1024*1024)

          result={'territorio':'andalucia','election_id':'andalucia_parlamento_2026','resultado':'BLOCK','motivo':'sin probar','detalle':{}}
          base='https://ws040.juntadeandalucia.es/siel-api/v1'
          try:
              u=base+'/opciones/fconvocatoria?'+urllib.parse.urlencode({'tconvocatoria':5})
              st,ct,data=fetch(u)
              convocatorias=json.loads(data.decode('utf-8'))
              match=[x for x in convocatorias if '2026' in str(x.get('valor','')) or '17/05/2026' in str(x.get('valor',''))]
              result['detalle']['convocatorias_http']=st
              result['detalle']['convocatoria_2026']=match[-1] if match else None
              if match:
                  # Sólo una muestra del mirror provisional para obtener una identidad territorial real.
                  mirror='https://pub-36ce9aa148a348ae8d9b6686b7edf0c4.r2.dev/eleccionesdb-etl/data-raw/hechos/minsait/01-andalucia.csv'
                  _,_,sample=fetch(mirror,timeout=8,headers={'Range':'bytes=0-131071'})
                  text=sample.decode('utf-8-sig','ignore')
                  reader=csv.DictReader(io.StringIO(text))
                  row=next(reader)
                  p=row.get('codigo_provincia'); m=row.get('codigo_municipio'); d=row.get('codigo_distrito'); s=row.get('codigo_seccion')
                  fconv=match[-1].get('clave')
                  params={'cautonoma':1,'tconvocatoria':5,'provincia':p,'municipio':m,'distrito':d,'seccion':s,'fconvocatoria':fconv}
                  endpoint=base+'/escrutinio/ambito/seccion?'+urllib.parse.urlencode(params)
                  try:
                      eh,ec,edata=fetch(endpoint,timeout=8)
                      payload=json.loads(edata.decode('utf-8'))
                      votos=payload.get('votos') or []
                      result['detalle']['muestra_endpoint']=endpoint
                      result['detalle']['muestra_http']=eh
                      result['detalle']['muestra_registros_votos']=len(votos)
                      if votos:
                          result['resultado']='FOUND_SAMPLE'
                          result['motivo']='SIEL expone la convocatoria 2026 y devuelve una muestra granular; falta adquisición completa definitiva y reconciliación'
                      else:
                          result['motivo']='SIEL expone 2026 pero la muestra no devuelve votos'
                  except Exception as e:
                      result['motivo']=f'SIEL expone 2026 pero la muestra granular falla: {type(e).__name__}: {e}'
              else:
                  result['motivo']='SIEL respondió pero no se identificó la convocatoria 2026'
          except Exception as e:
              result['motivo']=f'Prueba SIEL acotada no adquirible desde runner: {type(e).__name__}: {e}'

          ext={
            'territorio':'extremadura','election_id':'extremadura_asamblea_2025-12-21',
            'resultado':'BLOCKED_FINAL_GRANULAR_SOURCE',
            'motivo':'el granular público conocido es provisional (522418 votos) y no reconcilia con DOE definitivo (524837); el repositorio granular de prensa exige credenciales',
            'detalle':{'delta':2419,'doe':'https://doe.juntaex.es/otrosFormatos/html.php?anio=2026&doe=80o&xml=2026AC0001'}
          }
          payload=[result,ext]
          Path('diagnostico-fuentes-pendientes.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          md=['# Diagnóstico acotado de fuentes pendientes','']
          for x in payload:
              md.append(f"- **{x['territorio']}** — {x['resultado']} — {x['motivo']}")
          Path('diagnostico-fuentes-pendientes.md').write_text('\n'.join(md)+'\n')
          print('\n'.join(md))
          PY
          cat diagnostico-fuentes-pendientes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar sólo informe pequeño
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-fuentes-electorales-pendientes
          path: |
            diagnostico-fuentes-pendientes.json
            diagnostico-fuentes-pendientes.md
          if-no-files-found: error
          retention-days: 7
