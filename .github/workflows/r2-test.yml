name: Verify Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}

    steps:
      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=R2 configuration missing::${name} is empty. Set R2_ACCOUNT_ID in Settings > Secrets and variables > Actions > Variables (or Secrets), R2_BUCKET in Variables, and both R2 access keys in Secrets."
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1

          if [[ ! "$R2_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error title=Invalid R2 Account ID::R2_ACCOUNT_ID must be the 32-character Cloudflare Account ID, not a bucket name or access key."
            exit 1
          fi
          if [[ ! "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error title=Invalid bucket name::R2_BUCKET is not a valid bucket name."
            exit 1
          fi

      - name: Upload and verify R2 round-trip
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="connection-tests/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"

          printf 'DDD R2 connectivity test\n' > original.txt

          aws s3 cp original.txt \
            "s3://${R2_BUCKET}/${KEY}" \
            --endpoint-url "$ENDPOINT" \
            --only-show-errors

          aws s3 cp \
            "s3://${R2_BUCKET}/${KEY}" \
            downloaded.txt \
            --endpoint-url "$ENDPOINT" \
            --only-show-errors

          cmp original.txt downloaded.txt
          echo "SUCCESS: R2 upload, download and byte-for-byte verification completed"
          echo "Object key: ${KEY}"
