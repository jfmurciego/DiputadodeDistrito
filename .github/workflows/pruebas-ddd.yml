# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Puerta CI R015
# FECHA: 2026-09-11
# ESTADO: vigente
# QUÉ HACE: ejecuta la suite automática de regresión, determinismo y gobernanza en el mismo contenedor reproducible del procedimiento.
# CAMBIOS: primera versión.
# MOTIVO: convertir las invariantes R012/R014 y la política legacy en controles automáticos independientes del workflow territorial.
# ORIGEN: R015
name: Pruebas DDD — R015
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Auditar cabeceras y legacy en checkout
        run: python -m unittest tests.test_r015_invariantes.GovernanceHeaders -v
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-tests:${GITHUB_SHA} .
      - name: Ejecutar regresión territorial y determinismo
        run: docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python ddd-tests:${GITHUB_SHA} -m unittest discover -s tests -p 'test_*.py' -v
