# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: R026 inventario archipelágico
# FECHA: 2026-09-12
# ESTADO: diagnóstico.
# QUÉ HACE: ejecuta Baleares y Canarias en paralelo y publica inventario físico por componente/isla sin crear pasarelas.
# CAMBIOS: primera versión.
# MOTIVO: separar la topología insular de las desconexiones continentales antes de K/M04.
# ANTERIOR: ninguno — workflow nuevo.
name: R026 — Inventario archipelágico
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r026-inventario-archipielagos.yml'
      - 'herramientas/auditar_componentes_archipielago.py'
jobs:
  islas:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {territory: illes_balears, expected_components: 4, expected_sections: 674, expected_population: 1249844}
          - {territory: canarias, expected_components: 8, expected_sections: 1407, expected_population: 2258866}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TID: ${{ matrix.territory }}
      EXPECTED_COMPONENTS: ${{ matrix.expected_components }}
      EXPECTED_SECTIONS: ${{ matrix.expected_sections }}
      EXPECTED_POPULATION: ${{ matrix.expected_population }}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-r026:${GITHUB_SHA} .
      - name: Ejecutar M01-M03 observable
        run: |
          set -euo pipefail
          mkdir -p "territorios/$TID/config"
          CFG="territorios/$TID/config/.generated_bootstrap_2025.yaml"
          python herramientas/generar_config_bootstrap.py --territory "$TID" --out "$CFG"
          docker run --rm -v "$PWD:/app" --entrypoint bash ddd-r026:${GITHUB_SHA} -lc "
            python modulos/01_preparar_base_territorial.py --params '$CFG'
            python modulos/02_construir_adyacencias.py --params '$CFG'
            python modulos/03_construir_grafo.py --params '$CFG'"
          sudo chown -R "$(id -u):$(id -g)" "territorios/$TID/.cache/ddd"
      - name: Inventariar componentes
        run: |
          set -euo pipefail
          RUN="${TID}_2025";BASE="territorios/$TID/.cache/ddd/preparacion/$RUN"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-r026:${GITHUB_SHA} herramientas/auditar_componentes_archipielago.py --geojson "$BASE/${RUN}_m01_secciones_poblacion.geojson.zip" --graph "$BASE/${RUN}_m03_grafo.json" --out "$BASE/INVENTARIO_ARCHIPIELAGO.json"
          sudo chown -R "$(id -u):$(id -g)" "$BASE"
          jq -e --argjson c "$EXPECTED_COMPONENTS" --argjson s "$EXPECTED_SECTIONS" --argjson p "$EXPECTED_POPULATION" '.components==$c and .sections==$s and .population==$p' "$BASE/INVENTARIO_ARCHIPIELAGO.json"
      - name: Publicar
        uses: actions/upload-artifact@v6
        with:
          name: r026-${{ matrix.territory }}-${{ github.run_id }}
          path: |
            territorios/${{ matrix.territory }}/.cache/ddd/preparacion/${{ matrix.territory }}_2025/INVENTARIO_ARCHIPIELAGO.json
            territorios/${{ matrix.territory }}/.cache/ddd/preparacion/${{ matrix.territory }}_2025/*_informe.json
