# PROYECTO: Diputado de Distrito
# CLASE: interfaz humana de campaña
# VERSIÓN: 1.3.0 · FECHA: 2026-11-07 · ESTADO: candidato
# CAMBIOS 1.3.0: T-86, legislatura vigente por ámbito (configuracion/legislatura_vigente.yaml). Modo «plan» (en seco:
#   territorios, clave, estado y acción) y «lanzar» (un clic de produccion por campaña; territorio de prueba si el lote
#   es > 1; 00 → cadena electoral → 05 por territorio, D-3; salta los publicados salvo forzar; concurrencia limitada;
#   relevo «continuar» como bot al acercarse al límite del job). El modo «matriz» conserva la campaña anterior.
# CAMBIOS 1.2.0: campaña «Nacional 2023» con las 52 provincias (INE, matrícula o nombre); T-06.
# CAMBIOS 1.1.0: actions: write (el 00 llamado tiene un job con actions: write; con read, GitHub no arranca:
#   startup_failure); selección por «todos», números o nombres en lugar de CODAUTO con ceros.
# ANTERIOR: legacy/workflows/gestor-campanas_v1.2.0_20261107.yml
# QUÉ HACE: selecciona 1–19 territorios por CODAUTO, fija un manifiesto inmutable y orquesta desde el mismo commit.
# NO HACE: reintentos, dispatch indirecto ni deploy-pages directo; la publicación pasa por el publicador común.
name: 0 Gestor de Campañas

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'plan (en seco, sin efectos), lanzar (legislatura vigente) o matriz (campaña anterior). continuar es interno'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - lanzar
          - matriz
          - continuar
      ambito:
        description: Ámbito de la legislatura vigente (plan y lanzar)
        required: true
        type: choice
        default: legislatura completa
        options:
          - legislatura completa
          - nacional
          - autonómicas
          - comunidad
          - provincias
      forzar:
        description: Rehacer desde el principio también los ya publicados
        required: true
        type: boolean
        default: false
      max_paralelo:
        description: Territorios a la vez tras el de prueba
        required: true
        type: string
        default: '3'
      campana:
        description: Campaña
        required: true
        type: choice
        default: Autonómica 2025
        options:
          - Autonómica 2025
          - Nacional 2023
      estrategia:
        description: Estrategia territorial
        required: true
        type: choice
        default: Canónico
        options:
          - Canónico
          - GerryChain
          - GerryChain 25
          - GerryChain 50
      publication_mode:
        description: Alcance
        required: true
        type: choice
        default: electoral
        options:
          - electoral
          - territorial_only
      territorios:
        description: 'Separados por coma. comunidad: CODAUTO o nombre; provincias: INE, matrícula o nombre; matriz: todos, números o nombres'
        required: false
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gestor-campanas.yml'
      - 'configuracion/legislatura_vigente.yaml'
      - 'configuracion/registro_electoral.yaml'
      - 'configuracion/preparacion_legislatura_vigente.yaml'
      - 'herramientas/legislatura_vigente.py'
      - 'tests/test_legislatura_vigente.py'
      - 'configuracion/catalogo_territorios_espana_2025.yaml'
      - 'configuracion/catalogo_preparacion.yaml'
      - 'herramientas/gestor_campana_nacional.py'
      - 'tests/test_gestor_campana_nacional.py'
      - 'herramientas/gestor_campana.py'
      - 'tests/test_gestor_campana.py'
      - '.github/workflows/ejecucion-completa-proyecto.yml'
      - '.github/workflows/produccion-distritos.yml'
      - '.github/workflows/incorporacion-resultados-electorales.yml'
      - '.github/workflows/_reutilizable-generacion-territorial.yml'
      - '.github/workflows/_reutilizable-incorporacion-electoral.yml'
      - '.github/workflows/_reutilizable-puerta-validacion.yml'

permissions:
  contents: write
  actions: write
  issues: write
  pages: write
  id-token: write

jobs:
  legislatura:
    name: 0 Gestor de Campañas Legislatura vigente
    if: ${{ github.event_name == 'pull_request' || inputs.modo != 'matriz' }}
    # Un solo clic del propietario por campaña; el relevo «continuar» y los 00/05 que lanza van como bot.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.modo == 'lanzar') && 'produccion' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    concurrency:
      group: ${{ (github.event_name == 'workflow_dispatch' && inputs.modo != 'plan') && 'ddd-gestor-legislatura' || format('ddd-gestor-plan-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MODO: ${{ inputs.modo || 'plan' }}
      AMBITO: ${{ inputs.ambito || 'legislatura completa' }}
      TERRITORIOS: ${{ inputs.territorios }}
      FORZAR: ${{ inputs.forzar && 'true' || 'false' }}
      MAX_PARALELO: ${{ inputs.max_paralelo || '3' }}
      ESTRATEGIA: ${{ inputs.estrategia || 'Canónico' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Comprobar la legislatura vigente contra sus fuentes
        run: python herramientas/legislatura_vigente.py generar --comprobar
      - name: Plan (en seco)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODO" == continuar && "$GITHUB_ACTOR" != 'github-actions[bot]' ]]; then
            echo "::error::«continuar» es el relevo interno del Gestor; use «lanzar»."; exit 22
          fi
          if [[ "$MODO" != plan && "$GITHUB_REF_NAME" != main ]]; then
            echo "::error::Las campañas sólo se lanzan desde main."; exit 21
          fi
          python herramientas/legislatura_vigente.py plan --ambito "$AMBITO" --territorios "$TERRITORIOS" \
            --forzar "$FORZAR" --salida plan.json --resumen plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lanzar la campaña
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.modo == 'lanzar' || inputs.modo == 'continuar') }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          [[ "$MODO" == continuar ]] && extra=(--sin-prueba)
          python herramientas/legislatura_vigente.py lanzar --plan plan.json --estrategia "$ESTRATEGIA" --forzar "$FORZAR" \
            --max-paralelo "$MAX_PARALELO" --minutos 320 "${extra[@]}" | tee resultado.json
          { echo "### Resultado"; echo '```json'; cat resultado.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  preparar:
    name: 0 Gestor de Campañas Preparar
    if: ${{ github.event_name == 'pull_request' || inputs.modo == 'matriz' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      campaign_instance: ${{ steps.plan.outputs.campaign_instance }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      manifest_sha256: ${{ steps.plan.outputs.manifest_sha256 }}
      manifest_path: ${{ steps.plan.outputs.manifest_path }}
      strategy: ${{ steps.plan.outputs.strategy }}
      ready_count: ${{ steps.plan.outputs.ready_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - id: plan
        name: Construir selección nacional y manifiesto inmutable
        shell: bash
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF_NAME" = main || { echo "::error::Las campañas sólo se lanzan desde main."; exit 21; }
            selected_json="$(python - <<'PY'
          import json,os
          from herramientas.gestor_campana_nacional import parse_selection
          inputs=json.loads(os.environ["INPUTS_JSON"])
          try:
              print(json.dumps(parse_selection(str(inputs.get("territorios") or ""),campaign=str(inputs.get("campana") or "Autonómica 2025"))))
          except ValueError as exc:
              raise SystemExit(f"::error::{exc}")
          PY
          )"
            publication_mode="${{ inputs.publication_mode }}"
            strategy="${{ inputs.estrategia }}"
            confirmation=EXECUTE_CAMPAIGN_CONFIRMED
          else
            selected_json='["galicia"]'
            publication_mode=electoral
            strategy='GerryChain 50'
            confirmation=EXECUTE_CAMPAIGN_CONFIRMED
          fi
          source_sha="$GITHUB_SHA"
          campaign_instance="campaign-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p .ddd-campaign
          matrix="$(python -m herramientas.gestor_campana_nacional plan \
            --selected-json "$selected_json" --publication-mode "$publication_mode" \
            --source-sha "$source_sha" --strategy "$strategy" \
            --campaign-instance "$campaign_instance" --confirmation "$confirmation" \
            --output-manifest .ddd-campaign/campaign-manifest.json)"
          manifest_sha256="$(jq -r .manifest_sha256 .ddd-campaign/campaign-manifest.json)"
          {
            echo "matrix=$matrix"
            echo "ready_count=$(jq '.include|length' <<<"$matrix")"
            echo "campaign_instance=$campaign_instance"
            echo "source_sha=$source_sha"
            echo "manifest_sha256=$manifest_sha256"
            echo "manifest_path=.ddd-campaign/campaign-manifest.json"
            echo "strategy=$strategy"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.plan.outcome == 'success' }}
        with:
          name: ddd-campaign-manifest-${{ steps.plan.outputs.campaign_instance }}
          path: .ddd-campaign/campaign-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: E2E sintético del Gestor nacional
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -m unittest tests.test_gestor_campana_nacional

  territorios:
    name: ${{ matrix.slot }} ${{ matrix.territory_name }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'matriz' && needs.preparar.outputs.ready_count != '0' }}
    needs: preparar
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.preparar.outputs.matrix) }}
    uses: ./.github/workflows/ejecucion-completa-proyecto.yml
    secrets: inherit
    with:
      territory_id: ${{ matrix.territory_name }}
      data_edition: ${{ matrix.data_edition }}
      execution_mode: ${{ matrix.execution_mode }}
      optimization_algorithm: ${{ matrix.optimization_algorithm }}
      publish_result: false
      source_ref: ${{ matrix.source_sha }}
      persist_state: ${{ matrix.persist_state }}
      publication_mode: ${{ matrix.publication_mode }}
      artifact_namespace: ${{ matrix.artifact_namespace }}
      campaign_instance: ${{ matrix.campaign_instance }}
      campaign_slot: ${{ matrix.slot }}
      campaign_namespace: ${{ matrix.namespace }}
      campaign_manifest_sha256: ${{ matrix.manifest_sha256 }}
      campaign_contract_path: ${{ matrix.contract_path }}
      campaign_contract_sha256: ${{ matrix.generation_contract.contract_sha256 }}
      campaign_generation_evidence_path: ${{ matrix.generation_contract.generation_evidence_path }}
      campaign_generation_evidence_sha256: ${{ matrix.generation_contract.generation_evidence_sha256 }}
      campaign_source_run_id: ${{ matrix.generation_contract.source.run_id }}
      campaign_source_artifact_name: ${{ matrix.generation_contract.source.artifact_name }}
      campaign_source_artifact_sha256: ${{ matrix.generation_contract.source.artifact_sha256 }}
      campaign_source_package_sha256: ${{ matrix.generation_contract.source.package_sha256 }}
      campaign_evidence_receipt_path: ${{ matrix.evidence.receipt_path }}
      campaign_evidence_receipt_sha256: ${{ matrix.evidence.receipt_sha256 }}
      campaign_territorial_identity_sha256: ${{ matrix.evidence.territorial_identity_sha256 }}
      campaign_electoral_identity_sha256: ${{ matrix.evidence.electoral_identity_sha256 || '' }}
      campaign_pair_sha256: ${{ matrix.evidence.pair_sha256 || '' }}
      candidate_count: ${{ matrix.candidate_count }}
      gerrychain_entrypoint: ${{ matrix.entrypoint }}
      require_unique_hashes: ${{ matrix.require_unique_hashes }}
      expected_district_count: ${{ matrix.expected_district_count }}

  resumen:
    name: Resumen agregado de campaña
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.modo == 'matriz' && needs.preparar.result == 'success' }}
    needs: [preparar, territorios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preparar.outputs.source_sha }}
      - name: Recuperar todos los resultados territoriales
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ddd-campaign-territory-*
          path: .ddd-campaign/reports
          merge-multiple: false
      - name: Recuperar manifiesto inmutable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ddd-campaign-manifest-${{ needs.preparar.outputs.campaign_instance }}
          path: .ddd-campaign
      - id: aggregate
        name: Conservar todos los fallos individuales
        shell: bash
        run: |
          set +e
          mkdir -p .ddd-campaign/summary
          python -m herramientas.gestor_campana_nacional aggregate             --manifest "${{ needs.preparar.outputs.manifest_path }}"             --reports-root .ddd-campaign/reports             --output-json .ddd-campaign/summary/campaign-summary.json             --output-md .ddd-campaign/summary/campaign-summary.md
          rc=$?
          echo "aggregate_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-campaign-summary-${{ needs.preparar.outputs.campaign_instance }}
          path: .ddd-campaign/summary
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Verificar integridad del resumen agregado
        shell: bash
        run: |
          test "${{ steps.aggregate.outputs.aggregate_rc }}" = 0 || {
            echo "::error::Integridad del resumen inválida; consulte el artefacto agregado."
            exit 2
          }
          test -f .ddd-campaign/summary/campaign-summary.json || {
            echo "::error::No existe resumen JSON pese a ejecución de agregación."
            exit 3
          }
          jq -e --argjson expected "$(jq '.territories | length' .ddd-campaign/campaign-manifest.json)" '.territory_count_expected == $expected' .ddd-campaign/summary/campaign-summary.json >/dev/null || {
            echo "::error::El agregado no contiene la cardinalidad esperada de la campaña."
            exit 4
          }
          test "${{ needs.preparar.outputs.ready_count }}" != 0 || {
            echo "::error::CAMPAIGN_ZERO_EXECUTABLE: ningún territorio tiene GENERATION_READY; informe generado y preservado, campaña NO ejecutada."
            exit 5
          }
          jq -e '.completion_status == "COMPLETE" and .status == "PASS"' .ddd-campaign/summary/campaign-summary.json >/dev/null || {
            echo "::error::CAMPAIGN_INCOMPLETE: resumen preservado, pero existen territorios bloqueados, ausentes o fallidos."
            exit 6
          }

