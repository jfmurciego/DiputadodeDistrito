# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.1
# NOMBRE DE VERSIÓN: Migración única de gobernanza R015 — preservación literal de legacy
# FECHA: 2026-09-11
# ESTADO: temporal de un solo uso
# QUÉ HACE: ejecuta la migración R015 que archiva versiones activas, normaliza cabeceras y actualiza la trazabilidad; después se auto-retira.
# CAMBIOS VS 1.0.0: `git diff --check` audita únicamente ficheros activos y excluye `legacy/**`, porque los antecedentes deben conservarse byte a byte aunque contengan whitespace histórico.
# MOTIVO: el primer intento normalizó correctamente 17 componentes pero el commit fue bloqueado por un espacio final preexistente en la copia exacta de `generar_outputs_auditables.py`.
# ANTERIOR: legacy/workflows/r015-migracion_v1.0.0.yml
name: R015 — Migración de gobernanza
on:
  push:
    branches: [main]
    paths:
      - herramientas/r015_patch_components.py
      - .github/workflows/r015-migracion.yml
permissions:
  contents: write
jobs:
  migrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ejecutar migración R015
        run: python herramientas/r015_patch_components.py
      - name: Comprobar y publicar migración
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':(exclude)legacy/**'
          git diff --cached --quiet && { echo "R015 no produjo cambios"; exit 1; }
          git commit -m "R015: normalize headers and preserve active predecessors"
          git pull --rebase origin main
          git push origin HEAD:main
