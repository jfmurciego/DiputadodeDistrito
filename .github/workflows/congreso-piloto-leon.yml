# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.3.0 — Trazabilidad de ejecución en vistas y auditorías N08
# NOMBRE: Congreso — Preflight de candidatos León y Cáceres
# FECHA: 2026-10-27
# ESTADO: candidato; no productivo
# ALCANCE: pruebas, reproducción acotada y auditoría física; artefactos aislados
# CAMBIOS: el GeoJSON registra run ID y SHA del candidato; sin Pages ni M04–M06
# MOTIVO: auditar el candidato existente y reproducir el testigo de Cáceres bajo CI
# ANTERIOR: legacy/n08_pilot_pages_gate_20261027/current/.github/workflows/congreso-piloto-leon.yml (versión 1.2.0)
name: 06 Congreso — Preflight analítico León y Cáceres

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/congreso-piloto-leon.yml'
      - 'requirements-congreso-piloto.lock'
      - 'ddd_core/congreso_pilot_adapter.py'
      - 'ddd_core/congreso_bounded_tree_search.py'
      - 'ddd_core/congreso_constructive_witness.py'
      - 'ddd_core/congreso_preflight_adapter.py'
      - 'ddd_core/congreso_contract.py'
      - 'ddd_core/m05_population_repair.py'
      - 'herramientas/generar_piloto_congreso_leon.py'
      - 'herramientas/diagnosticar_alternativas_piloto_caceres.py'
      - 'herramientas/auditar_contiguedad_piloto_congreso.py'
      - 'herramientas/preparar_visor_congreso_leon.py'
      - 'herramientas/materializar_fuentes_nacionales_ine.py'
      - 'docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/**'
      - 'inputs/partes/**'
      - 'territorios/congreso/contrato_congreso_2026.json'
      - 'visor/congreso/**'
      - 'tests/test_congreso_pilot_adapter.py'
      - 'tests/test_congreso_bounded_tree_search.py'
      - 'tests/test_congreso_piloto_leon.py'
      - 'tests/test_congreso_physical_audit.py'
      - 'tests/test_congreso_visor.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddd-congreso-piloto-analitico
  cancel-in-progress: false
  queue: max

jobs:
  reproducir-y-auditar:
    name: Reproducción analítica y conectividad física (sin producción)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar CPython exacto
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements-congreso-piloto.lock

      - name: Instalar entorno cartográfico fijado
        run: python -m pip install --disable-pip-version-check -r requirements-congreso-piloto.lock

      - name: Pruebas de contrato y regresión analítica
        run: >-
          python -m unittest
          tests.test_congreso_pilot_adapter
          tests.test_congreso_physical_audit
          tests.test_congreso_contract
          tests.test_congreso_candidate_certifier
          tests.test_congreso_bounded_tree_search
          tests.test_congreso_piloto_leon
          tests.test_congreso_visor
          tests.test_codauto_preparation_contract
          tests.test_design_a_matriz_sintetica -v

      - name: Registrar entorno geométrico efectivo
        run: |
          python - <<'PY' > "$RUNNER_TEMP/geometry-runtime.json"
          import geopandas, json, numpy, pandas, pyogrio, pyproj, shapely, sys
          print(json.dumps({
              "python": sys.version,
              "geopandas": geopandas.__version__, "numpy": numpy.__version__,
              "pandas": pandas.__version__, "pyogrio": pyogrio.__version__,
              "gdal": pyogrio.__gdal_version__, "pyproj": pyproj.__version__,
              "proj": pyproj.proj_version_str, "shapely": shapely.__version__,
              "geos": shapely.geos_version_string,
          }, sort_keys=True, indent=2))
          PY

      - name: Reproducir reparación de León desde el candidato histórico
        run: |
          mkdir -p "$RUNNER_TEMP/nac-pilots/LEON"
          python -m herramientas.generar_piloto_congreso_leon \
            --cpro 24 \
            --input-candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/LEON/leon-original.json \
            --output "$RUNNER_TEMP/nac-pilots/LEON/leon-corrected.json" --repair
          cmp "$RUNNER_TEMP/nac-pilots/LEON/leon-corrected.json" \
            docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/LEON/leon-corrected.json

      - name: Reproducir testigo histórico de Cáceres (CPRO 10, K del contrato)
        run: |
          mkdir -p "$RUNNER_TEMP/nac-pilots/CACERES"
          python -m herramientas.generar_piloto_congreso_leon \
            --cpro 10 \
            --output "$RUNNER_TEMP/nac-pilots/CACERES/caceres-3-analitico.json" --repair
          cmp "$RUNNER_TEMP/nac-pilots/CACERES/caceres-3-analitico.json" \
            docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-analitico.json

      - name: Reproducir alternativa acotada de Cáceres (orden degree_asc)
        run: |
          python -m herramientas.diagnosticar_alternativas_piloto_caceres \
            --candidate-output "$RUNNER_TEMP/nac-pilots/CACERES/caceres-3-alternativa-degree-asc.json" \
            --report-output "$RUNNER_TEMP/nac-pilots/CACERES/search-alternatives.json"
          cmp "$RUNNER_TEMP/nac-pilots/CACERES/caceres-3-alternativa-degree-asc.json" \
            docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-alternativa-degree-asc.json
          cmp "$RUNNER_TEMP/nac-pilots/CACERES/search-alternatives.json" \
            docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/SEARCH_ALTERNATIVES_20261026.json

      - name: Auditar partes geométricas originales de León y Cáceres
        run: |
          python -m herramientas.auditar_contiguedad_piloto_congreso \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/LEON/leon-corrected.json \
            --output "$RUNNER_TEMP/nac-pilots/LEON/physical-audit.json"
          python -m herramientas.auditar_contiguedad_piloto_congreso \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-analitico.json \
            --output "$RUNNER_TEMP/nac-pilots/CACERES/physical-audit.json"
          python -m herramientas.auditar_contiguedad_piloto_congreso \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-alternativa-degree-asc.json \
            --output "$RUNNER_TEMP/nac-pilots/CACERES/physical-audit-degree-asc.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nac-pilots"
          for cpro, folder in (("24","LEON"),("10","CACERES")):
              report=json.loads((root/folder/"physical-audit.json").read_text())
              if (report.get("cpro") != cpro
                      or report.get("generation_authorized") is not False
                      or report.get("product_certification") != "NOT_PERFORMED"):
                  raise SystemExit(f"{folder}: identidad o puerta de producto inválida")
              connected=report.get("within_district_part_graph_connected") is True
              if cpro == "24":
                  if not connected or any(row.get("connected") is not True
                                          for row in report.get("districts",{}).values()):
                      raise SystemExit("LEON: no hay conectividad física positiva demostrada")
                  print(f"LEON: physical connectivity PASS; point contacts={len(report['point_only_contacts'])}; overlaps={len(report['positive_area_overlap_pairs'])}")
              else:
                  # Cáceres es un contraste diagnóstico; su candidato vigente
                  # incluye una parte física desconectada. No se declara producto
                  # válido ni se bloquea la prueba geométrica focal de León.
                  print(f"CACERES: diagnostic only, physically_connected={connected}; product certification NOT_PERFORMED")
          alternative=json.loads((root/"CACERES/physical-audit-degree-asc.json").read_text())
          candidate=json.loads(Path("docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-alternativa-degree-asc.json").read_text())
          if (alternative.get("cpro") != "10"
                  or alternative.get("generation_authorized") is not False
                  or alternative.get("product_certification") != "NOT_PERFORMED"
                  or alternative.get("within_district_part_graph_connected") is not True
                  or any(row.get("connected") is not True
                         for row in alternative.get("districts",{}).values())
                  or candidate.get("municipal_policy_certified") is not False
                  or candidate.get("municipalities_split") != ["10037"]):
              raise SystemExit("CACERES degree_asc: candidate is not physically connected or gates changed")
          print("CACERES degree_asc: physical connectivity PASS; municipal split remains conditional; product certification NOT_PERFORMED")
          PY

      - name: Crear GeoJSON exclusivamente como artefacto analítico aislado
        run: |
          python -m herramientas.preparar_visor_congreso_leon \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/LEON/leon-corrected.json \
            --execution-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nac-pilots/LEON/analytical-preview.geojson"
          python -m herramientas.preparar_visor_congreso_leon \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-analitico.json \
            --execution-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nac-pilots/CACERES/analytical-preview.geojson"
          python -m herramientas.preparar_visor_congreso_leon \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-alternativa-degree-asc.json \
            --execution-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nac-pilots/CACERES/analytical-preview-degree-asc.geojson" \
            --split-output "$RUNNER_TEMP/nac-pilots/CACERES/municipios-divididos.geojson"

      - name: Construir visor autónomo con ambos pilotos y controles de identidad
        shell: bash
        run: |
          node --check visor/congreso/congreso.js
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nac-pilots"
          geo={}
          for key,relative in [
              ("24","LEON/analytical-preview.geojson"),
              ("10","CACERES/analytical-preview-degree-asc.geojson"),
              ("10-split","CACERES/municipios-divididos.geojson"),
          ]:
              geo[key]=json.loads((root/relative).read_text(encoding="utf-8"))
          assert len(geo["24"]["features"]) == 4
          assert len(geo["10"]["features"]) == 3
          assert geo["10-split"]["features"]
          html=Path("visor/congreso/index.html").read_text(encoding="utf-8")
          css=Path("visor/congreso/styles.css").read_text(encoding="utf-8")
          js=Path("visor/congreso/congreso.js").read_text(encoding="utf-8")
          payload=json.dumps(geo,ensure_ascii=False,separators=(",",":")).replace("<","\\u003c")
          html=html.replace('<link href="styles.css" rel="stylesheet">',"<style>"+css+"</style>")
          html=html.replace('<script src="congreso.js"></script>',
              "<script>window.DDD_CONGRESO_GEOJSON="+payload+";</script><script>"+js+"</script>")
          if "window.DDD_CONGRESO_GEOJSON=" not in html: raise SystemExit("EMBEDDED_VIEWER_MISSING")
          (root/"piloto-autonomo.html").write_text(html,encoding="utf-8")
          print("N08_STANDALONE_VIEWER_READY: Leon=4 Caceres=3")
          PY

      - name: Conservar resultado analítico de CI
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: congreso-pilotos-analiticos-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/geometry-runtime.json
            ${{ runner.temp }}/nac-pilots/
          if-no-files-found: warn
          retention-days: 30
