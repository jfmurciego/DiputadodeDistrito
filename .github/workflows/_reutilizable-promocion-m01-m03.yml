# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Promoción topológica M01-M03 reutilizable
# FECHA: 2026-09-12
# ESTADO: vigente — R025
# QUÉ HACE: ejecuta un contrato territorial persistente y exige cardinalidad, población y conectividad completas.
# CAMBIOS: primera versión.
# MOTIVO: promover en paralelo territorios observados/auditados sin duplicar lógica.
# ANTERIOR: ninguno — workflow nuevo.
name: Reutilizable — promoción M01-M03
on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
permissions: {contents: read}
jobs:
  promover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TID: ${{ inputs.territory_id }}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-r025:${GITHUB_SHA} .
      - name: Ejecutar contrato estricto
        run: |
          set -euo pipefail
          CFG="territorios/$TID/config/${TID}_2025.yaml"
          docker run --rm -v "$PWD:/app" --entrypoint bash ddd-r025:${GITHUB_SHA} -lc "
            python modulos/01_preparar_base_territorial.py --params '$CFG'
            python modulos/02_construir_adyacencias.py --params '$CFG'
            python modulos/03_construir_grafo.py --params '$CFG'"
          sudo chown -R "$(id -u):$(id -g)" "territorios/$TID/.cache/ddd"
      - name: Certificar
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,yaml
          tid=os.environ["TID"];run=f"{tid}_2025";b=pathlib.Path("territorios")/tid/".cache/ddd/preparacion"/run
          cfg=yaml.safe_load((pathlib.Path("territorios")/tid/"config"/f"{tid}_2025.yaml").read_text());m1=json.loads((b/f"{run}_m01_informe.json").read_text());m3=json.loads((b/f"{run}_m03_informe.json").read_text());v=cfg["validation"]
          assert m1["rows_out"]==v["expected_sections_geometry"] and m1["missing_population_rows"]==0
          assert m3["total_pop"]==v["expected_population_total_2025"] and m3["isolated"]==0
          assert m3["global_component_audit"]["components"]==1
          assert m3["province_component_audit"]["disconnected"]==0 and m3["municipality_component_audit"]["disconnected"]==0
          out={"status":"M03_PROMOTABLE","territory_id":tid,"run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"sections":m1["rows_out"],"population":m3["total_pop"],"edges":m3["edges"],"isolated":0,"topology_bridges":v["expected_topology_bridges"],"province_disconnected":0,"municipality_disconnected":0}
          (b/"RESUMEN_PROMOCION.json").write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Publicar resumen
        uses: actions/upload-artifact@v6
        with:
          name: r025-${{ inputs.territory_id }}-summary-${{ github.run_id }}
          path: |
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/RESUMEN_PROMOCION.json
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_informe.json
      - name: Publicar pesado
        uses: actions/upload-artifact@v6
        with:
          name: r025-${{ inputs.territory_id }}-heavy-${{ github.run_id }}
          path: |
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*.geojson.zip
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_adyacencias.jsonl
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_grafo.json
