name: F10 — conciliar originales INE OCE y SIEL de Cortegana
on:
  push:
    branches:
      - chatgpt/fuentes-wfs-20261017
    paths:
      - .github/workflows/f10-conciliar-bop-siel-andalucia-2026.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fuente SIEL oficial ya preservada
        uses: actions/download-artifact@v4
        with:
          run-id: 37150399030
          name: ddd-electoral-official-snapshot-andalucia-37150399030
          github-token: ${{ github.token }}
          repository: jfmurciego/DiputadodeDistrito
          path: ${{ runner.temp }}/siel
      - name: Descargar PDF INE oficial preservado sin nueva descarga externa
        uses: actions/download-artifact@v4
        with:
          run-id: 39240781750
          name: f10-ine-oce-huelva-cortegana-bop61-2026
          github-token: ${{ github.token }}
          repository: jfmurciego/DiputadodeDistrito
          path: ${{ runner.temp }}/oce
      - name: Instalar lector PDF y verificar scripts
        run: |
          python -m pip install --quiet PyMuPDF==1.26.7
          python -m py_compile herramientas/verificar_bop_huelva_cortegana_2026.py herramientas/consolidar_f10_andalucia_bop_siel_2026.py
      - name: Conciliacion exacta SIEL 6044 / OCE Cortegana
        run: |
          python herramientas/consolidar_f10_andalucia_bop_siel_2026.py \
            --siel "${{ runner.temp }}/siel" \
            --bop "${{ runner.temp }}/oce/INE_OCE_HUELVA_BOP_61_2026.pdf" \
            --output "${{ runner.temp }}/ANDALUCIA_CORTEGANA_OCE_SIEL_PRUEBA.json"
      - name: Archivar comprobacion conjunta sin promocion F10
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10-andalucia-cortegana-oce-siel-2026
          path: ${{ runner.temp }}/ANDALUCIA_CORTEGANA_OCE_SIEL_PRUEBA.json
          if-no-files-found: warn
          retention-days: 90
