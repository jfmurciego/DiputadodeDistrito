# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.3.1
# NOMBRE: Notificación de finalización de lote DDD
# ESTADO: activo
# QUÉ HACE: avisa una sola vez cuando termina la interfaz operativa única y enlaza el reenganche.
# CAMBIO: sustituye los nombres archivados por el nombre vigente del workflow principal.
# ANTERIOR: legacy/workflows/notificar-finalizacion-orquestacion_v1.2.0.yml
name: Notificar Finalización de Lote DDD
on:
  workflow_run:
    workflows: ["Ejecucion de Generacion de Distritos"]
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  avisar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const body = "✅ @jfmurciego: lote terminado.\n\n- Workflow: **" + run.name + "**\n- Resultado: **" + (run.conclusion || "unknown").toUpperCase() + "**\n- Run: " + run.html_url + "\n- Reenganche: docs/SALIDAS_CHATGPT/PUNTO_REENGANCHE.md";
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 5, body});
