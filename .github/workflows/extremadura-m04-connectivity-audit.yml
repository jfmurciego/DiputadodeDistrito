# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Auditoría de conectividad pre-M04 — Extremadura
# FECHA: 2026-09-11
# ESTADO: EXT-03 diagnóstico causal
# QUÉ HACE: reconstruye M01-M03 estable y audita las conexiones externas reales de los municipios implicados en los fallos del barrido M04.
# MOTIVO: demostrar si 06005 y 10018 son realmente islas territoriales o si M04 las aísla al cerrar unidades vecinas; inspecciona también Don Benito para separar el efecto de sus pasarelas internas.
name: EXT-03 — Auditoría conectividad M04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extremadura-m04-connectivity-audit.yml'
      - 'herramientas/auditar_conectividad_m04.py'
      - 'territorios/extremadura/config/extremadura_2025.yaml'

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Reconstruir fuentes
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
      - name: Construir entorno
        run: docker build --pull -t ddd-ext-m04-audit:${GITHUB_SHA} .
      - name: Ejecutar M01-M03
        run: |
          set -euo pipefail
          mkdir -p territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext-m04-audit:${GITHUB_SHA} -lc '
            set -euo pipefail
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"
          '
      - name: Auditar municipios EXT-03
        run: |
          set -euo pipefail
          mkdir -p territorios/extremadura/.cache/ddd/probes
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-m04-audit:${GITHUB_SHA} \
            herramientas/auditar_conectividad_m04.py \
            --geojson territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m01_secciones_poblacion.geojson.zip \
            --graph territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m03_grafo.json \
            --municipality 06005 --municipality 06044 --municipality 10018 \
            --out territorios/extremadura/.cache/ddd/probes/ext03_m04_connectivity_audit.json
      - name: Publicar auditoría
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT03-connectivity-${{ github.run_id }}
          path: territorios/extremadura/.cache/ddd/probes/ext03_m04_connectivity_audit.json
