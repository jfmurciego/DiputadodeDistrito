# PROYECTO: Diputado de Distrito
# CLASE: orquestador principal
# VERSIÓN: 1.3.0
# NOMBRE DE VERSIÓN: Oleada B completa con puertas y estrategia 02.5
# ESTADO: candidato — smoke pre-merge obligatorio
# QUÉ HACE: encadena los cinco procesos de negocio 01→05, reutiliza fases válidas,
# conserva un manifiesto único y permite publicar el producto territorial certificado aunque no exista producto electoral.
# NO HACE: expone módulos internos, checkpoints ni nombres técnicos al usuario.
name: 00 · Ejecución Completa del Proyecto

on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
      data_edition: {required: true, type: string}
      execution_mode: {required: false, type: string, default: Reutilizar progreso existente}
      optimization_algorithm: {required: false, type: string, default: Canónico}
      publish_result: {required: false, type: boolean, default: false}
      source_ref: {required: false, type: string, default: ''}
      persist_state: {required: false, type: boolean, default: true}
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ejecucion-completa-proyecto.yml'
      - '.github/workflows/preparacion-fuentes.yml'
      - '.github/workflows/produccion-distritos.yml'
      - '.github/workflows/preparacion-resultados-electorales.yml'
      - '.github/workflows/incorporacion-resultados-electorales.yml'
      - '.github/workflows/desplegar-visor-publico.yml'
      - '.github/workflows/_reutilizable-generacion-territorial.yml'
      - '.github/workflows/_reutilizable-incorporacion-electoral.yml'
      - 'herramientas/resolver_ejecucion_completa.py'
      - 'herramientas/escribir_manifest_ejecucion_completa.py'
      - 'herramientas/validar_puerta_ejecucion.py'
      - 'herramientas/generar_estado_operativo.py'
      - '.github/workflows/_reutilizable-puerta-validacion.yml'
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        default: Galicia
        type: choice
        options:
          - Andalucía
          - Aragón
          - Principado de Asturias
          - Islas Baleares
          - Canarias
          - Cantabria
          - Castilla-La Mancha
          - Castilla y León
          - Cataluña
          - Comunidad Valenciana
          - Extremadura
          - Galicia
          - Comunidad de Madrid
          - Región de Murcia
          - Comunidad Foral de Navarra
          - País Vasco
          - La Rioja
          - Ceuta
          - Melilla
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options: ['2025']
      execution_mode:
        description: Modo de ejecución
        required: true
        default: Reutilizar progreso existente
        type: choice
        options:
          - Reutilizar progreso existente
          - Ejecutar desde el principio
      optimization_algorithm:
        description: Estrategia de optimización para 02
        required: true
        default: Canónico
        type: choice
        options:
          - Canónico
          - GerryChain
          - GerryChain 25
          - GerryChain 50
      publish_result:
        description: Publicar el visor al terminar
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ddd-full-prod-${{ inputs.territory_id }}-${{ inputs.data_edition }}
  cancel-in-progress: false

jobs:
  planificar:
    name: Planificar ejecución completa
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.plan.outputs.territory_id }}
      territory_name: ${{ steps.plan.outputs.territory_name }}
      contract_path: ${{ steps.plan.outputs.contract_path }}
      execution_mode_internal: ${{ steps.plan.outputs.execution_mode_internal }}
      optimization_algorithm: ${{ steps.plan.outputs.optimization_algorithm }}
      edition: ${{ steps.plan.outputs.edition }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
      persist_state: ${{ steps.plan.outputs.persist_state }}
      publish_result: ${{ steps.plan.outputs.publish_result }}
      run_prepare_territorial: ${{ steps.plan.outputs.run_prepare_territorial }}
      run_generate: ${{ steps.plan.outputs.run_generate }}
      run_prepare_electoral: ${{ steps.plan.outputs.run_prepare_electoral }}
      run_incorporate: ${{ steps.plan.outputs.run_incorporate }}
      existing_territorial_source_run_id: ${{ steps.plan.outputs.existing_territorial_source_run_id }}
      existing_territorial_source_artifact: ${{ steps.plan.outputs.existing_territorial_source_artifact }}
      existing_territorial_source_digest: ${{ steps.plan.outputs.existing_territorial_source_digest }}
      existing_territorial_product_run_id: ${{ steps.plan.outputs.existing_territorial_product_run_id }}
      existing_territorial_product_artifact: ${{ steps.plan.outputs.existing_territorial_product_artifact }}
      existing_territorial_product_digest: ${{ steps.plan.outputs.existing_territorial_product_digest }}
      existing_electoral_source_run_id: ${{ steps.plan.outputs.existing_electoral_source_run_id }}
      existing_electoral_source_artifact: ${{ steps.plan.outputs.existing_electoral_source_artifact }}
      existing_electoral_source_digest: ${{ steps.plan.outputs.existing_electoral_source_digest }}
      existing_electoral_product_run_id: ${{ steps.plan.outputs.existing_electoral_product_run_id }}
      existing_electoral_product_artifact: ${{ steps.plan.outputs.existing_electoral_product_artifact }}
      existing_electoral_product_digest: ${{ steps.plan.outputs.existing_electoral_product_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: plan
        name: Resolver fases necesarias
        shell: bash
        env:
          TERRITORY: ${{ github.event_name == 'pull_request' && 'Galicia' || inputs.territory_id }}
          EDITION: ${{ github.event_name == 'pull_request' && '2025' || inputs.data_edition }}
          UI_MODE: ${{ github.event_name == 'pull_request' && 'Reutilizar progreso existente' || inputs.execution_mode }}
          UI_ALGORITHM: ${{ github.event_name == 'pull_request' && 'Canónico' || inputs.optimization_algorithm }}
          SOURCE_REF: ${{ github.event_name == 'pull_request' && github.head_ref || inputs.source_ref || github.ref_name }}
          PERSIST_INPUT: ${{ inputs.persist_state }}
          PUBLISH_INPUT: ${{ inputs.publish_result }}
        run: |
          set -euo pipefail
          case "$UI_MODE" in
            "Reutilizar progreso existente") mode=reuse ;;
            "Ejecutar desde el principio") mode=from_start ;;
            *) echo "::error::Modo de ejecución no reconocido: $UI_MODE"; exit 2 ;;
          esac
          mkdir -p .ddd-full-run
          python herramientas/catalogo_preparacion.py --root-dir . validate
          extra_plan_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            extra_plan_args+=(--reuse-existing-optimization)
          fi
          python -m herramientas.resolver_ejecucion_completa             --territory "$TERRITORY" --edition "$EDITION" --execution-mode "$mode"             --optimization-algorithm "$UI_ALGORITHM" "${extra_plan_args[@]}"             --root-dir . --output .ddd-full-run/plan.json >/tmp/ddd-plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open(".ddd-full-run/plan.json",encoding="utf-8"))
          def out(k,v):
              if isinstance(v,bool):
                  v=str(v).lower()
              elif v is None:
                  v=""
              print(f"{k}={v}")
          out("territory_id",p["territory_id"])
          out("territory_name",p["territory_name"])
          out("contract_path",p.get("contract_path"))
          out("execution_mode_internal",p["execution_mode"])
          out("optimization_algorithm",p["optimization_algorithm"])
          out("edition",p["edition"])
          for key in ("run_prepare_territorial","run_generate","run_prepare_electoral","run_incorporate"):
              out(key,p[key])
          existing=p["existing"]
          out("existing_territorial_source_run_id",existing["territorial_source"].get("run_id"))
          out("existing_territorial_source_artifact",existing["territorial_source"].get("artifact_name"))
          out("existing_territorial_source_digest",existing["territorial_source"].get("artifact_sha256"))
          out("existing_territorial_product_run_id",existing["territorial_product"].get("run_id"))
          out("existing_territorial_product_artifact",existing["territorial_product"].get("artifact_name"))
          out("existing_territorial_product_digest",existing["territorial_product"].get("artifact_sha256"))
          out("existing_electoral_source_run_id",existing["electoral_source"].get("run_id"))
          out("existing_electoral_source_artifact",existing["electoral_source"].get("artifact_name"))
          out("existing_electoral_source_digest",existing["electoral_source"].get("artifact_sha256"))
          out("existing_electoral_product_run_id",existing["electoral_product"].get("run_id"))
          out("existing_electoral_product_artifact",existing["electoral_product"].get("artifact_name"))
          out("existing_electoral_product_digest",existing["electoral_product"].get("artifact_sha256"))
          PY
          persist="$PERSIST_INPUT"
          publish="$PUBLISH_INPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            persist=false
            publish=false
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            persist=true
          fi
          if [[ "$persist" == "true" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::La persistencia durable sólo está permitida desde main; ref actual: $GITHUB_REF_NAME"
            exit 52
          fi
          {
            echo "source_ref=$SOURCE_REF"
            echo "persist_state=$persist"
            echo "publish_result=$publish"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-full-run-plan-${{ github.run_id }}
          path: .ddd-full-run/plan.json
          if-no-files-found: error
          retention-days: 30

  preparar_territorial:
    name: 01 · Preparar datos territoriales
    needs: planificar
    if: ${{ needs.planificar.outputs.run_prepare_territorial == 'true' }}
    uses: ./.github/workflows/preparacion-fuentes.yml
    secrets: inherit
    with:
      territory_id: ${{ needs.planificar.outputs.territory_name }}
      data_edition: ${{ needs.planificar.outputs.edition }}
      reutilizar_si_ya_preparada: ${{ needs.planificar.outputs.execution_mode_internal != 'from_start' }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}
      persist_state: ${{ needs.planificar.outputs.persist_state == 'true' }}

  puerta_01:
    name: Puerta de validación · 01 → 02
    needs: [planificar, preparar_territorial]
    if: ${{ always() && needs.planificar.result == 'success' && (needs.preparar_territorial.result == 'success' || needs.planificar.outputs.run_prepare_territorial == 'false') }}
    uses: ./.github/workflows/_reutilizable-puerta-validacion.yml
    secrets: inherit
    with:
      phase: territorial_source
      territory_id: ${{ needs.planificar.outputs.territory_id }}
      data_edition: ${{ needs.planificar.outputs.edition }}
      run_id: ${{ needs.preparar_territorial.result == 'success' && github.run_id || needs.planificar.outputs.existing_territorial_source_run_id }}
      artifact_name: ${{ needs.preparar_territorial.result == 'success' && needs.preparar_territorial.outputs.artifact_name || needs.planificar.outputs.existing_territorial_source_artifact }}
      expected_digest: ${{ needs.preparar_territorial.result != 'success' && needs.planificar.outputs.existing_territorial_source_digest || '' }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}

  generar:
    name: 02 · Generar distritos autonómicos
    needs: [planificar, puerta_01]
    if: ${{ always() && needs.planificar.result == 'success' && needs.puerta_01.result == 'success' && needs.planificar.outputs.run_generate == 'true' }}
    uses: ./.github/workflows/produccion-distritos.yml
    secrets: inherit
    with:
      territory_id: ${{ needs.planificar.outputs.territory_name }}
      data_edition: ${{ needs.planificar.outputs.edition }}
      execution_mode: ${{ needs.planificar.outputs.execution_mode_internal }}
      optimization_algorithm: ${{ needs.planificar.outputs.optimization_algorithm }}
      source_package_run_id: ${{ needs.puerta_01.outputs.run_id }}
      source_package_artifact_name: ${{ needs.puerta_01.outputs.artifact_name }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}
      persist_state: ${{ needs.planificar.outputs.persist_state == 'true' }}

  puerta_02:
    name: Puerta de validación · 02 → 03
    needs: [planificar, puerta_01, generar]
    if: ${{ always() && needs.planificar.result == 'success' && needs.puerta_01.result == 'success' && (needs.generar.result == 'success' || needs.planificar.outputs.run_generate == 'false') }}
    uses: ./.github/workflows/_reutilizable-puerta-validacion.yml
    secrets: inherit
    with:
      phase: territorial_product
      territory_id: ${{ needs.planificar.outputs.territory_id }}
      data_edition: ${{ needs.planificar.outputs.edition }}
      run_id: ${{ needs.generar.result == 'success' && github.run_id || needs.planificar.outputs.existing_territorial_product_run_id }}
      artifact_name: ${{ needs.generar.result == 'success' && format('ddd-state-{0}-M06', github.run_id) || needs.planificar.outputs.existing_territorial_product_artifact }}
      expected_digest: ${{ needs.generar.result != 'success' && needs.planificar.outputs.existing_territorial_product_digest || '' }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}

  preparar_electoral:
    name: 03 · Preparar resultados electorales
    needs: [planificar, puerta_02]
    if: ${{ always() && needs.planificar.result == 'success' && needs.puerta_02.result == 'success' && needs.planificar.outputs.run_prepare_electoral == 'true' }}
    uses: ./.github/workflows/preparacion-resultados-electorales.yml
    secrets: inherit
    with:
      territory_id: ${{ needs.planificar.outputs.territory_name }}
      reutilizar_si_ya_preparada: ${{ needs.planificar.outputs.execution_mode_internal != 'from_start' }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}
      persist_state: ${{ needs.planificar.outputs.persist_state == 'true' }}

  puerta_03:
    name: Puerta de validación · 03 → 04
    needs: [planificar, puerta_02, preparar_electoral]
    if: ${{ always() && needs.planificar.result == 'success' && needs.puerta_02.result == 'success' && (needs.preparar_electoral.result == 'success' || needs.planificar.outputs.run_prepare_electoral == 'false') }}
    uses: ./.github/workflows/_reutilizable-puerta-validacion.yml
    secrets: inherit
    with:
      phase: electoral_source
      territory_id: ${{ needs.planificar.outputs.territory_id }}
      data_edition: ${{ needs.planificar.outputs.edition }}
      run_id: ${{ needs.preparar_electoral.result == 'success' && github.run_id || needs.planificar.outputs.existing_electoral_source_run_id }}
      artifact_name: ${{ needs.preparar_electoral.result == 'success' && needs.preparar_electoral.outputs.artifact_name || needs.planificar.outputs.existing_electoral_source_artifact }}
      expected_digest: ${{ needs.preparar_electoral.result != 'success' && needs.planificar.outputs.existing_electoral_source_digest || '' }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}

  incorporar:
    name: 04 · Incorporar resultados electorales
    needs: [planificar, puerta_02, puerta_03]
    if: ${{ always() && needs.planificar.result == 'success' && needs.puerta_02.result == 'success' && needs.puerta_03.result == 'success' && needs.planificar.outputs.run_incorporate == 'true' }}
    uses: ./.github/workflows/incorporacion-resultados-electorales.yml
    secrets: inherit
    with:
      territory_id: ${{ needs.planificar.outputs.territory_name }}
      data_edition: ${{ needs.planificar.outputs.edition }}
      territorial_run_id: ${{ needs.puerta_02.outputs.run_id }}
      electoral_package_run_id: ${{ needs.puerta_03.outputs.run_id }}
      electoral_package_artifact_name: ${{ needs.puerta_03.outputs.artifact_name }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}
      persist_state: ${{ needs.planificar.outputs.persist_state == 'true' }}

  puerta_04:
    name: Puerta de validación · 04 → estado operativo
    needs: [planificar, puerta_02, puerta_03, incorporar]
    if: ${{ always() && needs.planificar.result == 'success' && needs.puerta_02.result == 'success' && needs.puerta_03.result == 'success' && (needs.incorporar.result == 'success' || needs.planificar.outputs.run_incorporate == 'false') }}
    uses: ./.github/workflows/_reutilizable-puerta-validacion.yml
    secrets: inherit
    with:
      phase: electoral_product
      territory_id: ${{ needs.planificar.outputs.territory_id }}
      data_edition: ${{ needs.planificar.outputs.edition }}
      run_id: ${{ needs.incorporar.result == 'success' && github.run_id || needs.planificar.outputs.existing_electoral_product_run_id }}
      artifact_name: ${{ needs.incorporar.result == 'success' && format('ddd-state-{0}-M08', github.run_id) || needs.planificar.outputs.existing_electoral_product_artifact }}
      expected_digest: ${{ needs.incorporar.result != 'success' && needs.planificar.outputs.existing_electoral_product_digest || '' }}
      source_ref: ${{ needs.planificar.outputs.source_ref }}

  actualizar_estado:
    name: Actualizar estado operativo único
    needs: [planificar, puerta_01, puerta_02, puerta_03, puerta_04]
    if: ${{ always() && needs.planificar.result == 'success' && needs.puerta_01.result == 'success' && needs.puerta_02.result == 'success' && needs.puerta_03.result == 'success' && needs.puerta_04.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.state.outputs.source_ref }}
    concurrency:
      group: ddd-catalog-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.planificar.outputs.persist_state == 'true' && 'main' || needs.planificar.outputs.source_ref }}
          token: ${{ github.token }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: state
        name: Regenerar README y dashboard desde la misma fuente
        shell: bash
        env:
          PERSIST: ${{ needs.planificar.outputs.persist_state }}
          EDITION: ${{ needs.planificar.outputs.edition }}
        run: |
          set -euo pipefail
          if [[ "$PERSIST" == "true" ]]; then
            git fetch origin main
            git reset --hard origin/main
          fi
          python -m herramientas.generar_estado_operativo --root-dir . --edition "$EDITION"
          if [[ "$PERSIST" == "true" ]]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add README.md orchestracion/estado_operativo.json publicado/dashboard/status.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: actualizar estado operativo"
              for attempt in 1 2 3; do
                git pull --rebase origin main && git push origin HEAD:main && break
                git rebase --abort >/dev/null 2>&1 || true
                [[ "$attempt" == 3 ]] && { echo "::error::No se pudo persistir el estado operativo."; exit 48; }
                sleep $((attempt * 2))
              done
            fi
          fi
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-estado-operativo-${{ github.run_id }}
          path: |
            orchestracion/estado_operativo.json
            publicado/dashboard/status.json
            README.md
          if-no-files-found: error
          retention-days: 90

  publicar:
    name: 05 · Publicar visor
    needs: [planificar, puerta_02, puerta_04]
    if: ${{ always() && needs.planificar.result == 'success' && needs.planificar.outputs.publish_result == 'true' && needs.puerta_02.result == 'success' }}
    uses: ./.github/workflows/desplegar-visor-publico.yml
    secrets: inherit
    with:
      pagina_publicar: Sitio completo
      production_run_id: ${{ needs.puerta_04.result == 'success' && needs.puerta_04.outputs.run_id || needs.puerta_02.outputs.run_id }}

  manifestar:
    name: Registrar manifiesto de ejecución completa
    needs: [planificar, preparar_territorial, puerta_01, generar, puerta_02, preparar_electoral, puerta_03, incorporar, puerta_04, actualizar_estado, publicar]
    if: ${{ always() && needs.planificar.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ddd-catalog-promotion
      cancel-in-progress: false
    env:
      TERRITORY_ID: ${{ needs.planificar.outputs.territory_id }}
      TERRITORY_NAME: ${{ needs.planificar.outputs.territory_name }}
      MODE: ${{ needs.planificar.outputs.execution_mode_internal }}
      OPTIMIZATION_ALGORITHM: ${{ needs.planificar.outputs.optimization_algorithm }}
      PREP_T_RESULT: ${{ needs.preparar_territorial.result }}
      GEN_RESULT: ${{ needs.generar.result }}
      PREP_E_RESULT: ${{ needs.preparar_electoral.result }}
      INC_RESULT: ${{ needs.incorporar.result }}
      PUB_RESULT: ${{ needs.publicar.result }}
      RUN_PREP_T: ${{ needs.planificar.outputs.run_prepare_territorial }}
      RUN_GEN: ${{ needs.planificar.outputs.run_generate }}
      RUN_PREP_E: ${{ needs.planificar.outputs.run_prepare_electoral }}
      RUN_INC: ${{ needs.planificar.outputs.run_incorporate }}
      PUBLISH_REQUESTED: ${{ needs.planificar.outputs.publish_result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.planificar.outputs.source_ref }}
      - name: Recuperar evidencia de optimización efectiva
        if: ${{ needs.planificar.outputs.run_generate == 'true' && needs.generar.result == 'success' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ddd-state-${{ github.run_id }}-M06
          path: .ddd-optimization-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Construir manifiesto único
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ddd-full-run
          terr_source_run="${{ needs.puerta_01.outputs.run_id }}"
          terr_source_artifact="${{ needs.puerta_01.outputs.artifact_name }}"
          terr_product_run="${{ needs.puerta_02.outputs.run_id }}"
          terr_product_artifact="${{ needs.puerta_02.outputs.artifact_name }}"
          elec_source_run="${{ needs.puerta_03.outputs.run_id }}"
          elec_source_artifact="${{ needs.puerta_03.outputs.artifact_name }}"
          elec_product_run="${{ needs.puerta_04.outputs.run_id }}"
          elec_product_artifact="${{ needs.puerta_04.outputs.artifact_name }}"
          optimization_evidence_args=()
          if [[ "$RUN_GEN" == "true" && "$GEN_RESULT" == "success" ]]; then
            optimization_evidence="$(find .ddd-optimization-state -name OPTIMIZATION_EXECUTION.json -type f -print -quit 2>/dev/null || true)"
            test -n "$optimization_evidence" || { echo "::error::La generación completó correctamente pero no dejó evidencia de estrategia efectiva."; exit 51; }
            optimization_evidence_args=(--optimization-evidence "$optimization_evidence")
          fi
          python herramientas/escribir_manifest_ejecucion_completa.py             --territory-id "$TERRITORY_ID" --territory-name "$TERRITORY_NAME"             --edition "${{ needs.planificar.outputs.edition }}" --execution-mode "$MODE"             --optimization-algorithm "$OPTIMIZATION_ALGORITHM" "${optimization_evidence_args[@]}" --workflow-run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA"             --publish-requested "$PUBLISH_REQUESTED"             --prepare-territorial-result "$PREP_T_RESULT" --generate-result "$GEN_RESULT"             --prepare-electoral-result "$PREP_E_RESULT" --incorporate-result "$INC_RESULT"             --publish-result "$PUB_RESULT"             --prepare-territorial-executed "$RUN_PREP_T" --generate-executed "$RUN_GEN"             --prepare-electoral-executed "$RUN_PREP_E" --incorporate-executed "$RUN_INC"             --territorial-source-run-id "$terr_source_run" --territorial-source-artifact "$terr_source_artifact"             --territorial-product-run-id "$terr_product_run" --territorial-product-artifact "$terr_product_artifact"             --electoral-source-run-id "$elec_source_run" --electoral-source-artifact "$elec_source_artifact"             --electoral-product-run-id "$elec_product_run" --electoral-product-artifact "$elec_product_artifact"             --territorial-source-digest "${{ needs.puerta_01.outputs.artifact_digest }}"             --territorial-product-digest "${{ needs.puerta_02.outputs.artifact_digest }}"             --electoral-source-digest "${{ needs.puerta_03.outputs.artifact_digest }}"             --electoral-product-digest "${{ needs.puerta_04.outputs.artifact_digest }}"             --territorial-source-validation "${{ needs.puerta_01.result == 'success' && 'VALIDADO' || 'BLOQUEADO' }}"             --territorial-product-validation "${{ needs.puerta_02.result == 'success' && 'VALIDADO' || 'BLOQUEADO' }}"             --electoral-source-validation "${{ needs.puerta_03.result == 'success' && 'VALIDADO' || 'BLOQUEADO' }}"             --electoral-product-validation "${{ needs.puerta_04.result == 'success' && 'VALIDADO' || 'BLOQUEADO' }}"             --territorial-source-phase-decision "${{ needs.puerta_01.outputs.phase_decision }}"             --territorial-product-phase-decision "${{ needs.puerta_02.outputs.phase_decision }}"             --electoral-source-phase-decision "${{ needs.puerta_03.outputs.phase_decision }}"             --electoral-product-phase-decision "${{ needs.puerta_04.outputs.phase_decision }}"             --output .ddd-full-run/manifest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-full-run-manifest-${{ github.run_id }}
          path: .ddd-full-run/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Conservar manifiesto durable en producción
        if: ${{ github.ref_name == 'main' && needs.planificar.outputs.persist_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          target="territorios/$TERRITORY_ID/evidencia/ejecuciones_completas/$GITHUB_RUN_ID.json"
          mkdir -p "$(dirname "$target")"
          cp .ddd-full-run/manifest.json "$target"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$target"
          git diff --cached --quiet && exit 0
          git commit -m "chore: registrar ejecución completa de $TERRITORY_ID"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "::error::No se pudo conservar el manifiesto durable tras tres intentos."; exit 50
