# Publica un mapa como versión inmutable: manifiesto SHA-256, atestación SLSA
# firmada con Sigstore y GitHub Release. La integración Zenodo–GitHub archiva
# automáticamente cada Release publicada y le asigna DOI.
#
# Requisitos previos (una vez):
#   1. zenodo.org → iniciar sesión con GitHub → Account → GitHub → activar el repo.
#   2. Settings → Environments → crear "publicacion" con revisor obligatorio.
name: Publicar versión de mapa

on:
  workflow_dispatch:
    inputs:
      territory_id: {description: "Territorio (p. ej. aragon)", required: true, type: string}
      source_run_id: {description: "Run de Actions que produjo el M06", required: true, type: string}
      artifact_name: {description: "Nombre del artefacto M06", required: true, type: string}
      version: {description: "Versión semántica del mapa (p. ej. 1.0.0)", required: true, type: string}

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: publicacion          # revisor humano obligatorio antes de firmar
    permissions:
      contents: write                 # crear la Release
      actions: read                   # descargar artefacto de otro run
      id-token: write                 # OIDC para Sigstore
      attestations: write             # registrar la atestación
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Descargar productos del run fuente
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: paquete/productos

      - name: Añadir contexto de linaje
        env:
          T: ${{ inputs.territory_id }}
          RUN: ${{ inputs.source_run_id }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -d "territorios/$T" || { echo "::error::Territorio desconocido: $T"; exit 1; }
          mkdir -p paquete/contexto
          cp -r "territorios/$T/config" paquete/contexto/config
          cp configuracion/controles_obligatorios.yaml paquete/contexto/
          cp CITATION.cff paquete/
          python3 - <<PY
          import json, os, datetime
          json.dump({
            "schema": "ddd.version-mapa/1.0",
            "territory_id": os.environ["T"],
            "version": os.environ["V"],
            "source_run_id": os.environ["RUN"],
            "source_commit": os.environ["GITHUB_SHA"],
            "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "oficial": False,
          }, open("paquete/LINAJE.json", "w"), ensure_ascii=False, indent=2)
          PY

      - name: Manifiesto SHA-256
        run: |
          set -euo pipefail
          cd paquete
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Empaquetar de forma determinista
        id: zip
        env: {T: "${{ inputs.territory_id }}", V: "${{ inputs.version }}"}
        run: |
          set -euo pipefail
          out="ddd-${T}-v${V}.tar.gz"
          tar --sort=name --mtime='1980-01-01 00:00Z' --owner=0 --group=0 --numeric-owner \
              -czf "$out" -C paquete .
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Atestación de procedencia (SLSA, Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.file }}

      - name: Crear Release (Zenodo la archiva y asigna DOI)
        env:
          GH_TOKEN: ${{ github.token }}
          T: ${{ inputs.territory_id }}
          V: ${{ inputs.version }}
          F: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail
          tag="mapa-${T}-v${V}"
          gh release create "$tag" "$F" paquete/SHA256SUMS \
            --title "Mapa ${T} v${V}" \
            --notes "Producto del run ${{ inputs.source_run_id }} sobre el commit ${GITHUB_SHA}. Verificar con: gh attestation verify ${F} --repo ${GITHUB_REPOSITORY}. Mapa de investigación sin valor oficial."
