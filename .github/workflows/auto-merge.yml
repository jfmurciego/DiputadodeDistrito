# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.3.4
# ANTERIOR: legacy/workflows/auto-merge_v1.3.3_20261126.yml
# CAMBIOS 1.3.4: T-505 (D-211): la fusión pasa de `gh pr merge --squash` a REST (`PUT pulls/<n>/merge`, merge_method=squash, sha=HEAD
#   evaluado) con commit_title «<título de la PR> (#n)» y commit_message vacío. Con `gh pr merge` sin cuerpo GitHub añadía «Co-authored-by:
#   … <noreply@anthropic.com>» por cada autor de commit distinto del que fusiona (#1018, #1019, #1026, #1028). Misma garantía de HEAD
#   (sha); decisión, disparador, permisos y concurrencia intactos. Lo vigila `comprobar_guardian_main.py coautores` (guardián de la PR).
# CAMBIOS 1.3.3: T-379 PR 2a (D-147, opción a; D-162, opción A), puesta al día sobre main el 23-11: todo job que usa la app de registro (DDD_REGISTRO_APP_*) declara un entorno limitado a main (`registro`, sin revisores; P40 `publicar` sigue en `github-pages` y P70 `podar` en `produccion`): desde una rama o una PR esos jobs no reciben los secretos. Resto idéntico.
# ANTERIOR (1.3.2): legacy/workflows/auto-merge_v1.3.2_20261123.yml
# ANTERIOR: legacy/workflows/auto-merge_v1.3.1_20261117.yml
# CAMBIOS 1.3.2: T-397c (D-159), solo el nombre visible: «_P90 Automático — Fusión automática» (sin botón: el «_» lo marca). Nadie lo referencia por
#   nombre; disparador, jobs, permisos y concurrencia intactos.
# CAMBIOS 1.3.1: T-397 (D-155), solo el nombre visible: «P90 Automático — Fusión automática» (antes «_Interno — Fusión automática»). Nadie lo
#   referencia por nombre (es un disparador, no un objetivo de `workflow_run`); disparador, jobs y permisos intactos.
# CAMBIOS 1.3.0: T-366 (D-129/D-130), solo el disparador: workflow_run de «P90 Automático» (antes «Pruebas de la Plataforma») y `path` de
#   p90-automatico.yml. Sigue siendo un workflow aparte a propósito: GitHub rechaza un `workflow_run` que se nombra a sí mismo, y un job
#   dentro del run de la PR ejecutaría el código de la PR con la app de registro. Contexto de confianza, jobs y permisos intactos.
#   Concurrencia: sin cancelar (cola `queue: max`): otro run del mismo SHA no puede cancelar la fusión buena; decidir_auto_merge.py
#   comprueba de nuevo `pruebas` de la suite disparadora, así que un segundo intento solo puede decidir NO/ESPERAR.
# CAMBIOS 1.2.1: T-106, solo el nombre visible (prefijo «_Interno — ») para ordenar la lista de Actions.
# NOMBRE DE VERSIÓN: Fusión automática solo con `pruebas` en success sobre el HEAD exacto
# FECHA: 2026-11-26
# ESTADO: candidato
# QUÉ HACE: cuando «P90 Automático» termina en una PR, consulta explícitamente el check-run `pruebas` del SHA
#   exacto y fusiona (squash, ligado a ese SHA) solo si está en success y la PR es del propio repositorio, va a main, no
#   es borrador y no lleva `no-automerge` (herramientas/decidir_auto_merge.py). Pendiente o en failure: no hace nada.
#   No activa el auto-merge nativo ni mira mergeable_state. Fusiona con la app de registro para que el push a main
#   dispare sus workflows. Sin botón manual.
# CAMBIOS 1.1.0: T-54b. La 1.0.0 fusionó #453 y #454 sin `pruebas`: con el token de la app (actor exento del ruleset
#   proteger-main) la PR salía «clean» al instante y la rama «si ya está clean, fusiona» se saltaba el check. Ahora se
#   dispara con workflow_run al terminar la CI y decide por el check-run `pruebas` del SHA, nunca por el estado de la PR.
# MOTIVO: el propietario autorizó la fusión automática con `pruebas` en verde (07-11), no sin él.
# CAMBIOS 1.2.0: T-54c. El check-run `pruebas` debe pertenecer a la check suite del run de CI que dispara la fusión
#   (workflow_run.check_suite_id) y ese run debe ser de p90-automatico.yml (antes pruebas-plataforma.yml). #458 no lo fusionó esta versión sino la
#   1.0.0, ejecutada por un `pull_request` cuya referencia de merge aún no incluía #457: por eso aquí no hay disparador
#   `pull_request` ni auto-merge nativo (un auto-merge nativo activado con la app exenta fusiona sin `pruebas`).
# ANTERIOR: legacy/workflows/auto-merge_v1.1.0_20261107.yml
name: _P90 Automático — Fusión automática
on:
  workflow_run:
    workflows: ["P90 Automático"]
    types: [completed]
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: ddd-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
  queue: max
jobs:
  fusionar:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.path == '.github/workflows/p90-automatico.yml' }}
    environment: registro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Fusionar si `pruebas` está en success sobre el HEAD exacto
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SUITE: ${{ github.event.workflow_run.check_suite_id }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-am
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" > .ddd-am/prs.json
          mapfile -t prs < <(jq -r --arg sha "$SHA" '.[] | select(.state=="open" and .head.sha==$sha) | .number' .ddd-am/prs.json)
          [[ ${#prs[@]} -gt 0 ]] || { echo "Sin PR abierta con HEAD ${SHA:0:10}."; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=pruebas&per_page=100" > .ddd-am/checks.json
          fusionar=()
          for pr in "${prs[@]}"; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > ".ddd-am/pr-$pr.json"
            res="$(python herramientas/decidir_auto_merge.py --pr ".ddd-am/pr-$pr.json" --checks .ddd-am/checks.json --sha "$SHA" --repo "$GITHUB_REPOSITORY" --suite "$SUITE")"
            echo "#$pr: $res"
            [[ "$(jq -r .decision <<<"$res")" == FUSIONAR ]] && fusionar+=("$pr")
          done
          [[ ${#fusionar[@]} -gt 0 ]] || exit 0
          # Token de la app de registro (solo para fusionar, ya comprobado `pruebas`): el push a main dispara sus workflows.
          if [[ -n "${APP_ID:-}" && -n "${APP_KEY:-}" ]]; then
            b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
            unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
            jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
            auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
            inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
            token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
            if [[ -n "$token" && "$token" != null ]]; then echo "::add-mask::$token"; export GH_TOKEN="$token"
            else echo "::warning::La app de registro no devolvió token; sin permiso de escritura no se fusiona."; exit 0; fi
          else
            echo "::warning::Sin app de registro: no se fusiona (github.token es de solo lectura aquí)."; exit 0
          fi
          for pr in "${fusionar[@]}"; do
            titulo="$(jq -r .title ".ddd-am/pr-$pr.json")"
            # Título y cuerpo explícitos: con commit_message vacío GitHub no añade coautores al squash (T-505).
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=squash -f sha="$SHA" \
              -f commit_title="$titulo (#$pr)" -f commit_message=""
            echo "::notice::#$pr fusionada (squash) con \`pruebas\` en success sobre ${SHA:0:10}."
          done
