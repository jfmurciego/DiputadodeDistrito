# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Prueba causal M04 — municipios sobredimensionados granulares y abiertos
# FECHA: 2026-09-11
# ESTADO: EXT-03 diagnóstico arquitectónico; no promovible.
# QUÉ HACE: ejecuta M01-M03 estable y, para cada escenario, añade un campo de trabajo M04_MUN donde solo los municipios que superan el umbral de atomicidad se descomponen en secciones abiertas. El municipio original CUMUN permanece intacto.
# MOTIVO: aislar si los fallos EXT-03 nacen de la prepartición en núcleos urbanos cerrados. No modifica el motor ni el contrato territorial estable.
name: EXT-03 — Prueba granular-open M04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extremadura-m04-granular-probe.yml'
      - 'territorios/extremadura/config/extremadura_2025.yaml'
      - 'modulos/04_generar_semillas.py'

permissions:
  contents: read

jobs:
  granular-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Reconstruir fuentes
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
      - name: Construir entorno
        run: docker build --pull -t ddd-ext-granular:${GITHUB_SHA} .
      - name: Ejecutar M01-M03
        run: |
          set -euo pipefail
          mkdir -p territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext-granular:${GITHUB_SHA} -lc '
            set -euo pipefail
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"
          '
      - name: Preparar tres entradas granulares sin alterar CUMUN
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-granular:${GITHUB_SHA} -c '
          import copy,io,json,pathlib,zipfile,yaml
          import geopandas as gpd
          cfg=yaml.safe_load(pathlib.Path("/app/territorios/extremadura/config/extremadura_2025.yaml").read_text())
          base=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025")
          with zipfile.ZipFile(base/"extremadura_2025_m01_secciones_poblacion.geojson.zip") as z:
              n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          g["CUMUN"]=g["CUMUN"].astype(str);g["CUSEC_KEY"]=g["CUSEC_KEY"].astype(str)
          target=int(g.POP_2025.sum())/65
          scenarios={"tight":(0.85,1.50,0.10,1.10),"reference":(0.80,1.75,0.12,1.12),"wide":(0.75,2.00,0.15,1.15)}
          manifest={}
          for name,(floor,cap,tol,atomic) in scenarios.items():
              x=g.copy();limit=target*atomic;mp=x.groupby("CUMUN").POP_2025.sum();oversized=set(mp[mp>limit].index.astype(str))
              x["M04_MUN"]=x["CUMUN"]
              mask=x["CUMUN"].isin(oversized);x.loc[mask,"M04_MUN"]=x.loc[mask,"CUMUN"]+"#"+x.loc[mask,"CUSEC_KEY"]
              geo=base/f"extremadura_2025_m04_input_{name}.geojson";x.to_file(geo,driver="GeoJSON")
              c=copy.deepcopy(cfg);c["meta"]["schema_version"]="0.4.0-granular-probe-"+name;c["meta"]["status"]="m04_granular_probe"
              c["modulos"]["modulo_04_generar_semillas"]={
                "in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json",
                "in_geojson":str(geo).replace("/app/",""),"id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO",
                "municipality_field":"M04_MUN","municipality_name_field":"NMUN","district_apportionment":"hamilton","k_districts":65,
                "municipality_atomicity_limit_ratio":atomic,"gateway_policy":"legacy","preserve_province_residual_feasibility":True,"seed":12345,
                "out_geojson":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_m04_granular_{name}.geojson.zip",
                "out_report":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_m04_granular_{name}_informe.json"}
              c["validation"].update({"expected_districts":65,"population_floor_ratio":floor,"population_cap_ratio":cap,"target_tolerance_ratio":tol,"province_districts":{"06":41,"10":24},"municipality_atomicity_limit_ratio":atomic})
              p=pathlib.Path(f"/app/territorios/extremadura/config/.generated_granular_{name}.yaml");p.write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True))
              manifest[name]={"atomic_limit":limit,"oversized_original_municipalities":sorted(oversized),"oversized_count":len(oversized)}
          pathlib.Path("/app/territorios/extremadura/.cache/ddd/probes/ext03_granular_manifest.json").parent.mkdir(parents=True,exist_ok=True)
          pathlib.Path("/app/territorios/extremadura/.cache/ddd/probes/ext03_granular_manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest,ensure_ascii=False))
          '
      - name: Ejecutar M04 granular-open
        run: |
          set -euo pipefail
          : > territorios/extremadura/.cache/ddd/probes/ext03_granular_exit.tsv
          for s in tight reference wide; do
            set +e
            docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-granular:${GITHUB_SHA} modulos/04_generar_semillas.py --params "territorios/extremadura/config/.generated_granular_${s}.yaml"
            rc=$?
            set -e
            printf '%s\t%s\n' "$s" "$rc" | tee -a territorios/extremadura/.cache/ddd/probes/ext03_granular_exit.tsv
          done
      - name: Auditar resultados contra municipios originales
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext-granular:${GITHUB_SHA} -c '
          import io,json,pathlib,zipfile
          import geopandas as gpd
          base=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025");probe=pathlib.Path("/app/territorios/extremadura/.cache/ddd/probes")
          codes={x.split("\t")[0]:int(x.split("\t")[1]) for x in (probe/"ext03_granular_exit.tsv").read_text().splitlines()}
          out={}
          for s in ("tight","reference","wide"):
              rec={"exit_code":codes[s]};zp=base/f"extremadura_2025_m04_granular_{s}.geojson.zip"
              if zp.exists():
                  with zipfile.ZipFile(zp) as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
                  pops=g.groupby("district_id").POP_2025.sum();target=g.POP_2025.sum()/65
                  original_splits=g.groupby("CUMUN").district_id.nunique().sort_values(ascending=False)
                  rec.update({"districts":int(g.district_id.nunique()),"min_pop":int(pops.min()),"max_pop":int(pops.max()),"max_abs_deviation":float(((pops-target).abs()/target).max()),"original_municipalities_split":{str(k):int(v) for k,v in original_splits[original_splits>1].items()}})
              out[s]=rec
          (probe/"ext03_granular_results.json").write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False))
          '
      - name: Publicar prueba granular
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT03-granular-${{ github.run_id }}
          path: |
            territorios/extremadura/.cache/ddd/probes/ext03_granular_manifest.json
            territorios/extremadura/.cache/ddd/probes/ext03_granular_exit.tsv
            territorios/extremadura/.cache/ddd/probes/ext03_granular_results.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m04_granular_*_informe.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_m04_granular_*.geojson.zip
