# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.2.0
# NOMBRE: O02 resolución de reutilización y estado durable con nomenclatura funcional
# FECHA: 2026-09-16
# ESTADO: vigente — consolidación de interfaz
# QUÉ HACE: admite por huella, verifica evidencia existente, agrega y conserva estado durable.
# CAMBIO: adopta herramientas, artefactos y estado canónico con nomenclatura de orquestación; mantiene alias persistidos G10 durante la transición.
# ANTERIOR: O02 v1.1.0 en historial Git.
# MOTIVO: retirar nomenclatura histórica de la capa activa sin romper consumidores de estado durable existentes.
name: O02 · Resolver reutilización y estado durable
on:
  workflow_call:
    inputs:
      plan_path:
        description: Plan de orquestación versionado
        required: true
        default: orchestracion/plan_lote_g10_fase1_cierre.json
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: orquestacion-durable
  cancel-in-progress: false
env:
  PLAN_PATH: ${{ inputs.plan_path }}
  STATE_PATH: orchestracion/estado_tareas.json
jobs:
  admitir:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/orquestar_ejecucion.py validate-plan --plan "$PLAN_PATH"
          python herramientas/orquestar_ejecucion.py admit --plan "$PLAN_PATH" --state "$STATE_PATH" --root . > admission.json
          echo "matrix=$(jq -c '{include:.include}' admission.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: orquestacion-admision-${{ github.run_id }}
          path: admission.json
  ejecutar:
    needs: admitir
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.admitir.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Ejecutar o reutilizar tarea
        shell: bash
        env:
          TASK_ID: ${{ matrix.task_id }}
          ACTION: ${{ matrix.action }}
          ADMISSION: ${{ matrix.admission }}
          FINGERPRINT: ${{ matrix.fingerprint }}
          TERRITORY: ${{ matrix.territory }}
          STAGE_ID: ${{ matrix.stage_id }}
          STAGE_NAME: ${{ matrix.stage_name }}
          LEGACY_MODULE: ${{ matrix.legacy_module }}
          ARTIFACT_PATHS: ${{ join(matrix.artifact_paths, ' ') }}
          out: orquestacion-out/${{ matrix.task_id }}
        run: |
          set +e
          out="orquestacion-out/$TASK_ID"; mkdir -p "$out"
          if [ "$ADMISSION" = "REUSED" ]; then
            echo "REUSED: no se ejecuta cálculo." > "$out/task.log"; code=0
          elif [ "$ADMISSION" = "ADMITTED" ] && [ "$ACTION" = "g10_selftest" ]; then
            python -m unittest tests.test_g10_orquestacion -v > "$out/task.log" 2>&1; code=$?
          elif [ "$ADMISSION" = "ADMITTED" ] && [ "$ACTION" = "verify_existing_evidence" ]; then
            printf '%s\n' "$ARTIFACT_PATHS" | sed '/^$/d' > "$out/artifacts.list"
            python herramientas/orquestar_ejecucion.py verify-evidence $(cat "$out/artifacts.list") > "$out/evidence.json" 2> "$out/task.log"; code=$?
          else
            echo "$ADMISSION / $ACTION no ejecutable." > "$out/task.log"; code=20
          fi
          echo "$code" > "$out/exit_code"
          python -c 'import json,os; o=os.environ["out"]; c=int(open(o+"/exit_code").read()); a=os.environ["ADMISSION"]; json.dump({"schema_version":"1.1","task_id":os.environ["TASK_ID"],"territory":os.environ["TERRITORY"],"stage_id":os.environ["STAGE_ID"],"stage_name":os.environ["STAGE_NAME"],"legacy_module":os.environ["LEGACY_MODULE"] or None,"fingerprint":os.environ["FINGERPRINT"],"attempt":1,"status":"REUSED" if a=="REUSED" else ("SUCCESS" if c==0 else "REQUIRES_AGENT"),"artifacts":["task.log","evidence.json"]},open(o+"/resumen.json","w"),ensure_ascii=False)'
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orquestacion-tarea-${{ matrix.task_id }}
          path: orquestacion-out/${{ matrix.task_id }}/
  cerrar:
    if: always()
    needs: [admitir, ejecutar]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: orquestacion-tarea-*
          path: orquestacion-results
      - name: Agregar y preparar estado
        shell: bash
        run: |
          set -euo pipefail
          find orquestacion-results -name resumen.json -type f | sort > summaries.list
          test -s summaries.list
          python herramientas/orquestar_ejecucion.py aggregate --output RESUMEN_LOTE_ORQUESTACION.json $(cat summaries.list)
          python herramientas/orquestar_ejecucion.py merge-state --state "$STATE_PATH" --output ESTADO_TAREAS_ACTUALIZADO.json --run-id "$GITHUB_RUN_ID" $(cat summaries.list)
          python herramientas/informe_orquestacion.py --state ESTADO_TAREAS_ACTUALIZADO.json --factual resultados/fase1/ESTADO_FACTUAL.json --output-json ESTADO_OPERATIVO_ORQUESTACION.json --output-md ESTADO_OPERATIVO_ORQUESTACION.md
          cp ESTADO_OPERATIVO_ORQUESTACION.json ESTADO_OPERATIVO_G10.json
          cp ESTADO_OPERATIVO_ORQUESTACION.md ESTADO_OPERATIVO_G10.md
      - name: Persistir estado durable
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for item in \
            "$STATE_PATH:ESTADO_TAREAS_ACTUALIZADO.json" \
            "orchestracion/estado_operativo_orquestacion.json:ESTADO_OPERATIVO_ORQUESTACION.json" \
            "docs/SALIDAS_CHATGPT/ESTADO_OPERATIVO_ORQUESTACION.md:ESTADO_OPERATIVO_ORQUESTACION.md" \
            "orchestracion/estado_operativo_g10.json:ESTADO_OPERATIVO_G10.json" \
            "docs/SALIDAS_CHATGPT/ESTADO_OPERATIVO_G10.md:ESTADO_OPERATIVO_G10.md"; do
            target="${item%%:*}"; source="${item#*:}"
            if ! cmp -s "$target" "$source"; then mkdir -p "$(dirname "$target")"; cp "$source" "$target"; changed=1; fi
          done
          if [ "$changed" -eq 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_PATH" \
            orchestracion/estado_operativo_orquestacion.json \
            docs/SALIDAS_CHATGPT/ESTADO_OPERATIVO_ORQUESTACION.md \
            orchestracion/estado_operativo_g10.json \
            docs/SALIDAS_CHATGPT/ESTADO_OPERATIVO_G10.md
          git commit -m "orquestacion: registrar estado e informe $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v6
        with:
          name: orquestacion-lote-${{ github.run_id }}
          path: |
            RESUMEN_LOTE_ORQUESTACION.json
            ESTADO_TAREAS_ACTUALIZADO.json
            ESTADO_OPERATIVO_ORQUESTACION.json
            ESTADO_OPERATIVO_ORQUESTACION.md
      - uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(require("fs").readFileSync("ESTADO_OPERATIVO_ORQUESTACION.json","utf8"));
            const body = "✅ @jfmurciego: orquestación durable terminada | " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId + "\\nReenganche: **" + report.next_reengagement.kind + "** — " + report.next_reengagement.message;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body});
