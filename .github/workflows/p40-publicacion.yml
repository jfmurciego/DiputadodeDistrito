# PROYECTO: Diputado de Distrito
# CLASE: interfaz humana de publicación
# VERSIÓN: 1.7.0
# CAMBIOS 1.7.0: T-454: paso «Esperar a que el artefacto github-pages sea visible (T-454)» entre `upload-pages-artifact` y `deploy-pages`. `deploy-pages` fallaba en 1 s con
#   «No artifacts named "github-pages" were found» (runs 45362250945 y 45382628274): carrera con la visibilidad del artefacto recién subido. El paso consulta
#   `actions/runs/<run>/artifacts` con espera creciente y tope (~90 s), solo cuenta el artefacto creado en este intento (`run_started_at` del intento), margen de 10 s tras verlo y, si no aparece, solo avisa (::warning::) y deja que `deploy-pages` decida; no cambia ningún
#   otro paso, orden ni condición (registro, R2 y promover, idénticos). Sin entradas ni secretos nuevos.
# ANTERIOR (1.6.0): legacy/workflows/p40-publicacion_v1.6.0_20261124.yml
# CAMBIOS 1.6.0: T-443 (D-198: `mapas/` solo lo escribe la publicación): paso «Promover la doble vuelta a mapas/ (T-443)» al final, DESPUÉS del
#   despliegue en success (lo de `mapas/` es lo publicado): `herramientas/publicar_doble_vuelta.py promover` copia tal cual (mismo sha256, comprobado
#   en R2 tras subir) los ZIP y el informe del P75 fijado a `mapas/` y rehace sus `manifiesto.json`; no reescribe el fijado. Solo desde `main` y sin
#   simulación; secretos R2 solo en el env del paso; un fallo da ::error y el job en rojo (la web ya está desplegada y lee la clave fijada). El resto, idéntico.
# ANTERIOR (1.5.1): legacy/workflows/p40-publicacion_v1.5.1_20261123.yml
# CAMBIOS 1.5.1: T-379 PR 2a (D-147, opción a; D-162, opción A), puesta al día sobre main el 23-11: todo job que usa la app de registro (DDD_REGISTRO_APP_*) declara un entorno limitado a main (`registro`, sin revisores; P40 `publicar` sigue en `github-pages` y P70 `podar` en `produccion`): desde una rama o una PR esos jobs no reciben los secretos. Resto idéntico.
# ANTERIOR (1.5.0): legacy/workflows/p40-publicacion_v1.5.0_20261123.yml
# CAMBIOS 1.5.0: T-430 paso 2 (D-193/D-194, REDISENO_R2 §9): paso «Web en R2 (T-430)» tras el de los datos: `herramientas/publicar_sitio_r2.py` sube el
#   sitio candidato SIN los árboles de datos al bucket del sitio (raíz, ruta de hoy), páginas HTML al final, sha256 comprobado, índice `_sitio/actual.json`
#   al final y borrado de lo que sale con la misma guarda que los datos. Solo desde `main`; sin la variable `R2_SITIO_BUCKET` no hace nada; secretos
#   propios del bucket del sitio; solo si el paso de los datos terminó bien (id `datos_web`): nunca una web nueva sobre datos que no se
#   subieron; `continue-on-error` mientras dure el ensayo en paralelo a Pages. Pages, registro y el resto, idénticos.
# ANTERIOR: legacy/workflows/p40-publicacion_v1.4.0_20261122.yml
# CAMBIOS 1.4.0: T-430 fase 1 (D-186): paso «Datos de la web en R2 (T-430)» tras persistir el registro: `herramientas/publicar_datos_web.py` sube los datos del
#   sitio candidato (datos/, mapa/datos/, v2/datos/, data/) al bucket público de la web en `web/actual/` (solo la vigente, D-188: sube lo que cambió, verifica su sha256,
#   reescribe `web/actual/actual.json` y borra lo que salió del índice, con tope: un candidato truncado o sin territorios aborta sin borrar). Solo desde `main` (otra rama no toca el índice de producción). Sin la variable `R2_WEB_BUCKET` no hace nada; `continue-on-error` mientras dure el ensayo en paralelo a Pages. El resto, idéntico.
# ANTERIOR (1.4.0): legacy/workflows/p40-publicacion_v1.3.0_20261120.yml
# CAMBIOS 1.3.0: T-428 (D-184): la V4 es la versión OFICIAL. Paso nuevo «Promocionar la V4 como portada oficial» tras el de la V3
#   (`herramientas/preparar_portada_v4.py`): la V4 pasa de /v4/ a la raíz del sitio, /v4/ queda con redirecciones a la raíz y los
#   recursos de la V1 se mueven a /v1/; la doble vuelta se escribe en `mapa/datos/` de la raíz; la validación comprueba la portada V4
#   (antes `url=v3/`), Explorar, la V1 y las redirecciones. /v2/, /v3/, /docs/, /datos/ y /data/ no cambian. El resto, idéntico.
# ANTERIOR (1.3.0): legacy/workflows/p40-publicacion_v1.2.0_20261120.yml
# CAMBIOS 1.2.0: T-409 (D-172): paso «Doble vuelta de los territorios del Congreso para la V4»: `herramientas/publicar_doble_vuelta.py` baja de R2 el resultado de P75 FIJADO en
#   configuracion/doble_vuelta_publicada.json (sin ese fichero no hace nada), verifica sha256 y escribe `v4/mapa/datos/` en el sitio candidato (datos de la doble vuelta y la geometría de los distritos, que sale del GeoJSON que este mismo P40 materializa en `datos/`, simplificada con tolerancia fija); mismas credenciales R2 que el resto, `contents: read`,
#   sin datos en git, sin entradas nuevas. Además P40 copia `visor/v4/` completo al sitio candidato (dos líneas, junto al `cp` de V3: copia y borrado de lo listado en visor/v4/NO_PUBLICAR.txt; V2 y V3 no cambian) para que el visor V4 y su
#   `v4/mapa/datos/` lleguen juntos; la copia no publica nada por sí sola. El resto, idéntico.
# FECHA: 2026-11-16
# ESTADO: candidato
# CAMBIOS 1.1.0: T-377 (D-138, P28 Alternativas retirada sin sustituto): se quitan las entradas `workflow_call` `ensemble_release_tag`, `ensemble_sha256`,
#   `scenario_id` y `scenario_strategy`, la ruta del ensemble (`resolver` ya no se salta; `publicar` corre si `preparar` terminó bien) y el paso
#   «Resolver ensemble persistente solicitado»; los pasos `parse-run-ids` y `describe-production` ya no pasan escenario. El resto, idéntico.
# ANTERIOR (1.2.0): legacy/workflows/p40-publicacion_v1.1.0_20261119.yml
# ANTERIOR (1.0.0): legacy/workflows/p40-publicacion_v1.0.0_20261116.yml
# CAMBIOS: T-372 (D-134, migración paso 5): fichero nuevo; sustituye a desplegar-visor-publico.yml 3.6.0 («P50 Publicación»), cadena-publicacion.yml 1.1.0 y
#   _reutilizable-publicar-sitio.yml 3.17.0 (el publicador va dentro como el job `publicar`; mismos pasos, mismo entorno `github-pages`, mismos permisos y concurrencias).
# MOTIVO: un solo botón sin parámetros técnicos: «qué publicar» (solo el sitio | territorios), `territorios` (códigos) y `simular` (marcado por defecto).
#   Sin run id: el código toma del registro durable la última 00 completa con la puerta 04 en verde de cada territorio (herramientas/p40_resolver.py). Siempre «Sitio completo».
#   P40 NO exige un artefacto M06 vivo (el M06 sale del blob del registro, D-133): se quitan la comprobación de M06 vivo de la cadena y los outputs del M06 que nadie consumía.
#   `simular` llega VACÍO por workflow_call (la 00): vacío = no simulado (solo el valor `true` simula).
#   El M08 caducado en Actions solo avisa (el publicador lo recupera de R2, 3.16.0 del publicador).
# ANTERIOR: ninguna (fichero nuevo); sustituye a legacy/workflows/desplegar-visor-publico_v3.6.0_20261116.yml, legacy/workflows/cadena-publicacion_v1.1.0_20261116.yml
#   y legacy/workflows/_reutilizable-publicar-sitio_v3.17.0_20261116.yml
# workflow_call (entradas técnicas ocultas): la 00 (`publicar`); el Gestor la lanza por dispatch.
# P43 (histórico por fecha) queda fuera: tarea aparte.
name: P40 Publicación

on:
  workflow_call:
    inputs:
      pagina_publicar: {required: false, type: string, default: Sitio completo}
      production_run_id: {required: false, type: string, default: ''}
      target_page: {required: false, type: string, default: ''}
      include_congreso_analytical_preview: {required: false, type: boolean, default: false}
  workflow_dispatch:
    inputs:
      que_publicar:
        description: Qué publicar
        required: true
        default: Solo el sitio
        type: choice
        options:
          - Solo el sitio
          - Territorios
      territorios:
        description: Códigos separados por comas (p. ej. aut01,nac42); solo con «Territorios»
        required: false
        default: ''
        type: string
      simular:
        description: Simular resuelve y comprueba sin publicar nada
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  resolver:
    name: Resolver qué se publica
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      production_run_id: ${{ steps.r.outputs.production_run_id }}
      publicar: ${{ steps.r.outputs.publicar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: r
        name: Resolver y comprobar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUE: ${{ inputs.que_publicar }}
          TERRITORIOS: ${{ inputs.territorios }}
          SIMULAR: ${{ inputs.simular }}
          RUN_IDS: ${{ inputs.production_run_id }}
        run: |
          set -euo pipefail
          ids="$RUN_IDS"
          if [[ "$QUE" == "Territorios" ]]; then
            [[ -z "$RUN_IDS" ]] || { echo "::error::P40_RUN_ID_CON_TERRITORIOS: usa uno u otro"; exit 1; }
            out="$(python3 herramientas/p40_resolver.py territorios --territorios "$TERRITORIOS")"
            echo "$out" | jq .
            ids="$(jq -r .production_run_ids <<<"$out")"
            # Las 00 más recientes que la elegida y descartadas (fallidas o sin la 04 en verde) NO se saltan en silencio.
            jq -r '.territorios[] | . as $t | $t.descartadas[] | "::warning::P40_00_DESCARTADA \($t.territory_id): 00 \(.run) (\(.motivo)); se publica la 00 \($t.run_00)"' <<<"$out"
            {
              echo "### P40: 00 elegida por territorio"
              echo "| Territorio | 00 elegida | Run publicado | 00 más recientes descartadas |"
              echo "|---|---|---|---|"
              jq -r '.territorios[] | "| \(.territory_id) | \(.run_00) | \(.publish_run_id) | \([.descartadas[] | "\(.run): \(.motivo)"] | if length == 0 then "—" else join("; ") end) |"' <<<"$out"
            } >> "$GITHUB_STEP_SUMMARY"
            vivo() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired == false and .name == \"$2\")] | length" 2>/dev/null || echo 0; }
            while IFS=$'\t' read -r pub m08; do
              [[ "$(vivo "$pub" "$m08")" != 0 ]] || echo "::warning::M08_ARTEFACTO_CADUCADO=$m08 (run $pub): el publicador lo recupera de R2 o falla cerrado"
            done < <(jq -r '.territorios[] | [.publish_run_id, .m08_artifact] | @tsv' <<<"$out")
          elif [[ "$QUE" == "Solo el sitio" ]]; then
            [[ -z "$TERRITORIOS" ]] || { echo "::error::P40_TERRITORIOS_CON_SOLO_SITIO: «Solo el sitio» no admite territorios"; exit 1; }
            [[ -z "$RUN_IDS" ]] || { echo "::error::P40_RUN_ID_CON_SOLO_SITIO"; exit 1; }
          fi
          publicar=true; [[ "$SIMULAR" != true ]] || publicar=false
          {
            echo "production_run_id=$ids"
            echo "publicar=$publicar"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### P40 Publicación (${QUE:-llamada})"
            echo "- Runs a publicar: ${ids:-ninguno (solo el sitio)}"
            [[ "$publicar" == true ]] || echo "- Simulación: no se publica nada."
          } >> "$GITHUB_STEP_SUMMARY"

  preparar:
    name: Preparar promoción web
    needs: resolver
    if: ${{ needs.resolver.outputs.publicar == 'true' }}
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]' && github.actor != 'ddd-registro[bot]' && github.workflow == 'P40 Publicación') && 'produccion' || 'registro' }}  # T-379 PR 2a (D-162): robots con `registro`; T-41: clic del propietario solo en disparo manual humano
    runs-on: ubuntu-24.04
    concurrency:
      group: ddd-shared-operational-state
      cancel-in-progress: false
      queue: max
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      production_run_id: ${{ steps.resolve.outputs.production_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ github.token }}
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        name: Regenerar promoción compartida desde el HEAD vigente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PAGE: ${{ inputs.pagina_publicar || 'Sitio completo' }}
          PRODUCTION_RUN_ID_OVERRIDE: ${{ needs.resolver.outputs.production_run_id }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-publication
          source_ref="$(python -m herramientas.persistir_estado_operativo_compartido \
            --root-dir . --edition 2025 --target-branch main --sync-dashboard-assets)"
          cp orchestracion/estado_operativo.json .ddd-publication/status.json
          production_run_id="$PRODUCTION_RUN_ID_OVERRIDE"
          if [[ -z "$production_run_id" ]]; then
            echo "Sin production_run_id: modo solo sitio (se despliega con el registro durable actual; no se añaden entradas)."
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "production_run_id=$production_run_id" >> "$GITHUB_OUTPUT"

  publicar:
    name: Desplegar página seleccionada
    needs: [resolver, preparar]
    if: ${{ needs.preparar.result == 'success' }}
    concurrency:
      group: ddd-pages-prod
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RUN_ID: ${{ needs.preparar.outputs.production_run_id || '' }}
      TARGET_PAGE: ${{ inputs.target_page || inputs.pagina_publicar || 'Sitio completo' }}
      PYTHONPATH: ${{ github.workspace }}
      PUBLICATION_REGISTRY: orchestracion/publicaciones_visor.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preparar.outputs.source_ref || github.sha }}
          token: ${{ github.token }}

      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Sincronizar registro durable actual
        if: ${{ github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Preparar dependencias y materializador verificable
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyproj PyYAML==6.0.2
          node --check visor/app.js
          node --check visor/escenarios.js
          node --check visor/nacional/nacional.js
          node --check visor/v2/v2.js
          test -f publicado/dashboard/index.html
          test -f publicado/dashboard/app.js
          test -f publicado/dashboard/styles.css
          test -f publicado/dashboard/status.json
          test -f dashboard/hemiciclo.html
          test -f datos_abiertos/INDEX.json
          python -c "import json,sys; json.load(open('dashboard/hemiciclo.json',encoding='utf-8'))"
          test -f "$PUBLICATION_REGISTRY"
          python -m py_compile herramientas/preparar_visor_ejecucion.py herramientas/evaluar_publicacion_visor.py herramientas/registro_publicaciones_visor.py
          mkdir -p .ddd-publication
          cat > .ddd-publication/materializar_registro.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          registry="$1"
          target="$2"
          # --- reintentos (T-124) ---
          gh_retry() {
            local out="$1" n=1 err; shift
            while true; do
              err="$(mktemp)"
              if "$@" > "$out" 2> "$err"; then cat "$err" >&2; rm -f "$err"; return 0; fi
              if (( n >= 3 )) || ! grep -Eqi 'HTTP 5[0-9]{2}|connection reset|unexpected EOF|i/o timeout|timed out|temporarily unavailable' "$err"; then
                cat "$err" >&2; rm -f "$err"; return 1
              fi
              echo "::warning::gh api falló con un error transitorio (intento $n/3); reintento en $(( n * ${DDD_REINTENTO_BASE:-2} )) s"
              rm -f "$err"; sleep $(( n * ${DDD_REINTENTO_BASE:-2} )); n=$(( n + 1 ))
            done
          }
          # --- fin reintentos ---
          rm -rf "$target"
          mkdir -p "$target"
          python herramientas/registro_publicaciones_visor.py validate --registry "$registry"
          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            id="$(jq -r '.id' <<<"$row")"
            source_type="$(jq -r '.source_type' <<<"$row")"
            mkdir -p "$target/$id"
            case "$source_type" in
              release_asset)
                asset_id="$(jq -r '.asset_id' <<<"$row")"
                [[ "$asset_id" =~ ^[0-9]+$ ]] || { echo "::error::$id: asset_id inválido"; exit 51; }
                gh_retry "$target/$id/asset" gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                ;;
              repository_blob)
                blob_sha="$(jq -r '.blob_sha' <<<"$row")"
                gh_retry "$target/$id/blob.json" gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha"
                [[ "$(jq -r '.encoding' "$target/$id/blob.json")" == "base64" ]] || {
                  echo "::error::$id: blob sin codificación base64"; exit 52;
                }
                jq -r '.content' "$target/$id/blob.json" | tr -d '\n' | base64 --decode > "$target/$id/asset"
                rm "$target/$id/blob.json"
                ;;
              *)
                echo "::error::$id: fuente definitiva no permitida: $source_type"
                exit 53
                ;;
            esac
          done < <(jq -c '.products[]?, .ensembles[]?' "$registry")
          python herramientas/registro_publicaciones_visor.py verify             --registry "$registry" --materialized-root "$target"
          SH
          chmod +x .ddd-publication/materializar_registro.sh

      - name: Preflight completo del registro vigente
        shell: bash
        run: |
          set -euo pipefail
          .ddd-publication/materializar_registro.sh "$PUBLICATION_REGISTRY" /tmp/publications-current

      - name: Normalizar lote de ejecuciones solicitadas
        if: ${{ needs.preparar.outputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(python herramientas/registro_publicaciones_visor.py parse-run-ids --value "$PRODUCTION_RUN_ID")"
          read -r -a lote <<<"$ids"
          (( ${#lote[@]} > 0 )) || { echo "::error::LOTE_VACIO: production_run_id sin ningún id"; exit 42; }
          printf '%s\n' "${lote[@]}" > .ddd-publication/run-ids.txt
          # Un id: rutas de siempre. Varios: una raíz y una evidencia por run.
          cat > .ddd-publication/lote.sh <<'SH'
          mapfile -t LOTE < .ddd-publication/run-ids.txt
          raiz_run() { if (( ${#LOTE[@]} == 1 )); then echo /tmp/production; else echo "/tmp/production/$1"; fi; }
          evidencia_run() { if (( ${#LOTE[@]} == 1 )); then echo .ddd-publication/publicacion_visor.json; else echo ".ddd-publication/publicacion_visor_$1.json"; fi; }
          SH
          echo "Lote de ${#lote[@]} run(s): ${lote[*]}"

      - name: Recuperar ejecución solicitada como fuente transitoria
        if: ${{ needs.preparar.outputs.production_run_id != '' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          source .ddd-publication/lote.sh
          rm -rf /tmp/production .ddd-publication/descargas && mkdir -p /tmp/production .ddd-publication/descargas
          # T-239: solo los artefactos que leen la acreditación y describe-production; hasta 6 runs a la vez.
          cat > .ddd-publication/descargar_run.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          source .ddd-publication/lote.sh
          run="$1"; root="$(raiz_run "$run")"; inicio="$(date +%s)"; modo=selectiva
          mkdir -p "$root"
          completa() { [[ -n "$(find "$root" -name "$1" -print -quit)" ]]; }
          lista_completa() {
            completa production_status.json && completa decision.json && completa manifest.json && completa '*_contiguedad_geometrica.json' \
              && [[ -n "$(find "$root" \( -name '*_m06_distritos.geojson.zip' -o -name '*_m08_distritos_resultados.geojson.zip' \) -print -quit)" ]]
          }
          # T-301: los runs publicados solo conservan ddd-state-<run>-M07 (acumulado, con el M06 y su composición): sin producto en la
          # selección M06 se baja el run completo (ddd-* pesa lo mismo que ese M07, ~100 MB). Lotes de ≤12 runs por disco.
          estado_usado=M06
          pats=()
          for p in "ddd-audit-$run*" "ddd-audit-electoral-$run*" "ddd-decision-$run*" "ddd-full-run-manifest-$run*" "ddd-state-$run-M06*" "ddd-state-$run-M08*"; do
            pats+=(--pattern "$p")
          done
          # T-305: orden Actions (selectiva → completa, como siempre) → R2 solo si ninguna da producto → error claro.
          if ! gh run download "$run" "${pats[@]}" --dir "$root" || ! lista_completa; then
            echo "::warning::$run: la descarga selectiva falló o no trae estado, decisión, manifiesto, auditoría y producto; descarga completa ddd-*"
            modo=completa; estado_usado=completo
            rm -rf "$root"; mkdir -p "$root"
            gh run download "$run" --pattern 'ddd-*' --dir "$root" || { echo "el run $run no se pudo descargar" > ".ddd-publication/descargas/$run.fallo"; exit 1; }
            if ! lista_completa; then
              # La poda T-278 pudo borrar el ddd-state M08/M06 de Actions: se restaura de R2 (sha256 verificado).
              r2_rc=0
              python herramientas/restaurar_estado_r2.py "$run" "$root" || r2_rc=$?
              # Sin producto en ninguno: el ::error de restaurar_estado_r2 ya nombra run, estado y claves; el lote lo rechaza
              # «Validar descriptores» (comportamiento de siempre ante un run sin producto).
              if (( r2_rc != 0 )) || ! lista_completa; then
                echo "::warning::$run: sin estado M06/M08 publicable en Actions ni en R2 (rc=$r2_rc)"
              else
                modo=completa+r2; estado_usado=R2
              fi
            fi
          fi
          if [[ -z "$(find "$root" -type f -print -quit)" ]]; then
            echo "la ejecución $run no contiene artefactos DDD" > ".ddd-publication/descargas/$run.fallo"; exit 1
          fi
          echo "DESCARGA run=$run modo=$modo estado=$estado_usado segundos=$(( $(date +%s) - inicio )) mb=$(du -sm "$root" | cut -f1)"
          touch ".ddd-publication/descargas/$run.ok"
          SH
          chmod +x .ddd-publication/descargar_run.sh
          printf '%s\n' "${LOTE[@]}" | xargs -P "${DDD_DESCARGAS_PARALELAS:-6}" -n 1 .ddd-publication/descargar_run.sh || true
          fallos=()
          for run in "${LOTE[@]}"; do
            if [[ ! -f ".ddd-publication/descargas/$run.ok" ]]; then
              if [[ -f ".ddd-publication/descargas/$run.fallo" ]]; then fallos+=("$(cat ".ddd-publication/descargas/$run.fallo")"); else fallos+=("el run $run no terminó la descarga"); fi
            fi
          done
          if (( ${#fallos[@]} > 0 )); then
            printf '::error::LOTE_RECHAZADO: %s; no se registra ninguno.\n' "${fallos[@]}"; exit 43
          fi

      - name: Acreditar identidad de la ejecución descargada
        if: ${{ needs.preparar.outputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source .ddd-publication/lote.sh
          fallos=()
          for run in "${LOTE[@]}"; do
            python herramientas/evaluar_publicacion_visor.py --requested-run-id "$run" --production-root "$(raiz_run "$run")" \
              --phase source --output "$(evidencia_run "$run")" --strict-request || fallos+=("$run")
          done
          (( ${#fallos[@]} == 0 )) || {
            echo "::error::LOTE_RECHAZADO: no acreditan ${fallos[*]} (motivo en las líneas anteriores); no se registra ninguno."; exit 1;
          }

      - name: Validar descriptores de todo el lote antes de escribir
        if: ${{ needs.preparar.outputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source .ddd-publication/lote.sh
          fallos=(); salidas=()
          for run in "${LOTE[@]}"; do
            out="/tmp/product-descriptors-$run.json"
            python herramientas/registro_publicaciones_visor.py describe-production             --production-root "$(raiz_run "$run")"             --run-id "$run"             --output "$out" || fallos+=("$run")
            salidas+=("$out")
            # T-301: la composición del M06 que se publica queda versionada (vigente del visor); sin ella, el lote se rechaza.
            if [[ -s "$out" ]] && ! python herramientas/composicion_m06.py --descriptores "$out" --origen "$(raiz_run "$run")"; then fallos+=("$run"); fi
          done
          (( ${#fallos[@]} == 0 )) || {
            echo "::error::LOTE_RECHAZADO: sin producto publicable en ${fallos[*]} (motivo en las líneas anteriores); no se registra ninguno."; exit 1;
          }
          python herramientas/registro_publicaciones_visor.py merge-descriptors --inputs "${salidas[@]}" --output /tmp/product-descriptors.json

      - name: Promover productos a blob persistente verificable
        if: ${{ needs.preparar.outputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/product-descriptors.json
          printf '[]\n' > /tmp/new-entries.json
          mkdir -p /tmp/promotion-verify
          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            id="$(jq -r '.id' <<<"$row")"
            source="$(jq -r '.local_source' <<<"$row")"
            sha="$(sha256sum "$source" | awk '{print $1}')"

            # El registro ya admite repository_blob como fuente durable. Usarlo evita
            # depender de api.uploads.github.com y mantiene el activo inmutable por SHA.
            blob_request="/tmp/$id-blob-request.json"
            python -c 'import base64,json,sys; from pathlib import Path; source=Path(sys.argv[1]); target=Path(sys.argv[2]); target.write_text(json.dumps({"content":base64.b64encode(source.read_bytes()).decode("ascii"),"encoding":"base64"}), encoding="utf-8")' "$source" "$blob_request"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$blob_request" > "/tmp/$id-blob.json"
            blob_sha="$(jq -r '.sha' "/tmp/$id-blob.json")"
            [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::$id: blob_sha persistente inválido"; exit 54;
            }

            persisted="/tmp/promotion-verify/$id"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" > "/tmp/$id-blob-verify.json"
            [[ "$(jq -r '.encoding' "/tmp/$id-blob-verify.json")" == "base64" ]] || {
              echo "::error::$id: blob persistente sin codificación base64"; exit 55;
            }
            jq -r '.content' "/tmp/$id-blob-verify.json" | tr -d '\n' | base64 --decode > "$persisted"
            persisted_sha="$(sha256sum "$persisted" | awk '{print $1}')"
            [[ "$persisted_sha" == "$sha" ]] || {
              echo "::error::$id: SHA-256 del blob persistente no coincide"; exit 55;
            }

            entry="$(jq               --arg repository "$GITHUB_REPOSITORY"               --arg blob_sha "$blob_sha"               --arg sha256 "$sha"               '. | del(.local_source,.stage) + {
                source_type:"repository_blob",
                repository:$repository,
                blob_sha:$blob_sha,
                sha256:$sha256,
                immutable_location:("github-git-blob://" + $repository + "/" + $blob_sha)
              }' <<<"$row")"
            tmp="$(mktemp)"
            jq --argjson entry "$entry" '. + [$entry]' /tmp/new-entries.json > "$tmp"
            mv "$tmp" /tmp/new-entries.json
          done < <(jq -c '.[]' /tmp/product-descriptors.json)

      - name: Construir candidato sin tocar el registro durable
        shell: bash
        run: |
          set -euo pipefail
          [[ -f /tmp/new-entries.json ]] || printf '[]\n' > /tmp/new-entries.json
          python herramientas/registro_publicaciones_visor.py candidate             --registry "$PUBLICATION_REGISTRY"             --entries /tmp/new-entries.json             --output /tmp/publicaciones_visor.candidate.json

      - name: Preflight completo del registro candidato
        shell: bash
        run: |
          set -euo pipefail
          .ddd-publication/materializar_registro.sh             /tmp/publicaciones_visor.candidate.json             /tmp/publications-candidate

      - name: Construir sitio candidato completo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site-candidate && mkdir -p /tmp/site-candidate/dashboard /tmp/site-candidate/nacional /tmp/site-candidate/docs /tmp/site-candidate/v2 /tmp/site-candidate/v3
          cp visor/index.html visor/app.js visor/escenarios.js visor/styles.css /tmp/site-candidate/
          cp -R publicado/dashboard/. /tmp/site-candidate/dashboard/
          cp dashboard/hemiciclo.html dashboard/hemiciclo.json /tmp/site-candidate/dashboard/
          cp dashboard/metricas.html dashboard/metricas_proceso.json /tmp/site-candidate/dashboard/
          grep -q 'href="hemiciclo.html"' /tmp/site-candidate/dashboard/index.html || { echo "::error::El dashboard no enlaza el hemiciclo."; exit 1; }
          python herramientas/resultados_ligeros.py --registro /tmp/publicaciones_visor.candidate.json
          python herramientas/generar_datos_abiertos.py --registro /tmp/publicaciones_visor.candidate.json
          python herramientas/generar_datos_abiertos.py --registro /tmp/publicaciones_visor.candidate.json --comprobar
          python herramientas/generar_datos_abiertos.py --registro /tmp/publicaciones_visor.candidate.json --materializar /tmp/site-candidate/datos
          python herramientas/catalogo_procedencia_publico.py --salida /tmp/site-candidate/datos/catalogo_procedencia.json
          cp visor/nacional/index.html visor/nacional/nacional.js visor/nacional/styles.css /tmp/site-candidate/nacional/
          cp -R visor/v2/. /tmp/site-candidate/v2/
          cp visor/v3/index.html visor/v3/v3.css visor/v3/v3.js visor/v3/calendario.json /tmp/site-candidate/v3/
          mkdir -p /tmp/site-candidate/v4 && cp -R visor/v4/. /tmp/site-candidate/v4/  # T-409: el visor V4 completo (el paso de la doble vuelta añade v4/mapa/datos/ después)
          while IFS= read -r f; do [[ -z "$f" || "$f" == \#* || "$f" == /* || "$f" == *..* ]] || rm -rf "/tmp/site-candidate/v4/$f"; done < visor/v4/NO_PUBLICAR.txt  # lo ficticio o interno no se publica
          rm -f /tmp/site-candidate/v2/README.md /tmp/site-candidate/v2/construir_vista_previa.py
          cp web/textos.md /tmp/site-candidate/v2/textos.md
          sed -i 's#data-textos="../../web/textos.md"#data-textos="textos.md"#' /tmp/site-candidate/v2/index.html
          python herramientas/generar_territorial_visor.py --datos /tmp/site-candidate/datos --salida /tmp/site-candidate/v2/datos/territorial.json || echo "::warning::Sin vista territorial en el v2."
          python herramientas/generar_rotacion_visor.py --salida /tmp/site-candidate/v2/datos/rotacion.json || echo "::warning::Sin capa de rotación en el v2."
          rm -rf /tmp/site-candidate/v2/datos/secciones
          if (cd inputs/partes && sha256sum -c --ignore-missing MANIFEST_PARTES.sha256 >/dev/null 2>&1) && cat inputs/partes/seccionado_2025.zip.part00 inputs/partes/seccionado_2025.zip.part01 inputs/partes/seccionado_2025.zip.part02 > /tmp/seccionado_2025.zip && echo "55c9da7e34d3bb3cb725400c35b58e72f4db2ea8321ef91237a89e708d2dbcc4  /tmp/seccionado_2025.zip" | sha256sum -c - >/dev/null && python -m pip install --disable-pip-version-check -q geopandas pyogrio && python herramientas/generar_secciones_visor.py --seccionado /tmp/seccionado_2025.zip --salida /tmp/site-candidate/v2/datos/secciones; then echo "Capa de secciones del v2 generada."; else rm -rf /tmp/site-candidate/v2/datos/secciones; echo "::warning::Sin capa de secciones en el v2 (seccionado no disponible o generación fallida)."; fi
          python -m pip install --disable-pip-version-check -r documentacion_publica/requirements.lock
          zensical build --strict --clean -f documentacion_publica/zensical.toml
          cp -R documentacion_publica/site/. /tmp/site-candidate/docs/
          python herramientas/preparar_visor_ejecucion.py             --site /tmp/site-candidate             --publication-registry /tmp/publicaciones_visor.candidate.json             --materialized-root /tmp/publications-candidate             --repository-root .

      - name: Preparar visor analítico Congreso opt-in
        if: ${{ inputs.include_congreso_analytical_preview }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/site-candidate/congreso/data
          cp visor/congreso/index.html visor/congreso/congreso.js visor/congreso/styles.css /tmp/site-candidate/congreso/
          python -m pip install --disable-pip-version-check -r requirements-congreso-piloto.lock
          python -m herramientas.preparar_visor_congreso_leon \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/LEON/leon-corrected.json \
            --execution-id "$GITHUB_RUN_ID" \
            --output /tmp/site-candidate/congreso/data/24.geojson
          python -m herramientas.preparar_visor_congreso_leon \
            --candidate docs/ESTUDIOS/N08_PILOTO_PROVINCIAL_20261026/CACERES/caceres-3-alternativa-degree-asc.json \
            --execution-id "$GITHUB_RUN_ID" \
            --output /tmp/site-candidate/congreso/data/10.geojson \
            --split-output /tmp/site-candidate/congreso/data/10-municipios-divididos.geojson
          python - <<'PY'
          from pathlib import Path
          path = Path("/tmp/site-candidate/index.html")
          page = path.read_text(encoding="utf-8")
          marker = '<a class="dashboard-link" href="dashboard/">Dashboard operativo</a>'
          link = '<a class="dashboard-link" href="congreso/">Congreso — pilotos analíticos no certificados</a>'
          if marker not in page or 'href="congreso/"' in page:
              raise SystemExit("CONGRESS_NAV_INJECTION_PRECONDITION_FAILED")
          path.write_text(page.replace(marker, marker + " " + link, 1), encoding="utf-8")
          PY

      - name: Portada pública V2 y conservación V1
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/preparar_portada_v2.py --site=/tmp/site-candidate

      - name: Promocionar portada pública V3
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/preparar_portada_v3.py --site=/tmp/site-candidate
          node --check /tmp/site-candidate/v3/v3.js
          python -m unittest discover -s tests -p test_preparar_portada_v3.py

      - name: Promocionar la V4 como portada oficial (T-428)
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/preparar_portada_v4.py --site=/tmp/site-candidate

      - name: Doble vuelta de los territorios del Congreso para la V4 (D-172)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          # El resultado de P75 se baja de R2 y se verifica contra el run y el sha256 fijados en el repo; sin fijado no hace nada; con fijado, un fallo detiene la publicación.
          python3 herramientas/publicar_doble_vuelta.py --sitio /tmp/site-candidate --destino /tmp/site-candidate/mapa/datos

      - name: Validar sitio candidato completo
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/site-candidate/data/viewer-results.json
          test -s /tmp/site-candidate/docs/index.html
          test -s /tmp/site-candidate/docs/citar.html
          test ! -e /tmp/site-candidate/docs/plan.html
          test -s /tmp/site-candidate/nacional/index.html
          node --check /tmp/site-candidate/nacional/nacional.js
          test -s /tmp/site-candidate/index.html
          grep -q '<title>Diputado de Distrito | Portada</title>' /tmp/site-candidate/index.html
          test -s /tmp/site-candidate/comprender.html
          test -s /tmp/site-candidate/mapa/index.html
          test -s /tmp/site-candidate/mapa/explorar.js
          grep -q 'url=../"' /tmp/site-candidate/v4/index.html
          grep -q 'url=../../mapa/"' /tmp/site-candidate/v4/mapa/index.html
          test -s /tmp/site-candidate/v1/app.js
          grep -q 'src="v1/app.js"' /tmp/site-candidate/v1/index.html
          test -s /tmp/site-candidate/v3/index.html
          test -s /tmp/site-candidate/v3/v3.css
          test -s /tmp/site-candidate/v3/v3.js
          test -s /tmp/site-candidate/v3/calendario.json
          node --check /tmp/site-candidate/v3/v3.js
          test -s /tmp/site-candidate/v1/index.html
          grep -q '<base href="../">' /tmp/site-candidate/v1/index.html
          test -s /tmp/site-candidate/v2/index.html
          test -s /tmp/site-candidate/v2/datos/provincias.json
          grep -q 'data-textos="textos.md"' /tmp/site-candidate/v2/index.html
          node --check /tmp/site-candidate/v2/v2.js
          if [[ "${{ inputs.include_congreso_analytical_preview }}" == "true" ]]; then
            test -s /tmp/site-candidate/congreso/data/24.geojson
            test -s /tmp/site-candidate/congreso/data/10.geojson
            test -s /tmp/site-candidate/congreso/data/10-municipios-divididos.geojson
            grep -q 'href="congreso/"' /tmp/site-candidate/v1/index.html
            node --check /tmp/site-candidate/congreso/congreso.js
          else
            test ! -e /tmp/site-candidate/congreso
            if grep -q 'href="congreso/"' /tmp/site-candidate/v1/index.html; then echo "::error::Enlace Congreso presente sin opt-in"; exit 1; fi
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("/tmp/publicaciones_visor.candidate.json").read_text(encoding="utf-8"))
          viewer = json.loads(Path("/tmp/site-candidate/data/viewer-results.json").read_text(encoding="utf-8"))
          if viewer.get("schema") != "ddd.viewer-results/1.1":
              raise SystemExit("viewer-results.json: schema inesperado")
          expected_products = {row["id"] for row in registry.get("products", [])}
          observed_products = {
              row["id"] for row in viewer.get("results", [])
              if row.get("kind") in {"static", "canonical_m06", "canonical_m08"}
          }
          if observed_products != expected_products:
              raise SystemExit(
                  f"viewer/registro inconsistentes: products expected={sorted(expected_products)} observed={sorted(observed_products)}"
              )
          for row in viewer.get("results", []):
              path = row.get("viewer_path")
              if not path:
                  raise SystemExit(f"{row.get('id')}: viewer_path ausente")
              payload_path = Path("/tmp/site-candidate") / path
              payload = json.loads(payload_path.read_text(encoding="utf-8"))
              if payload.get("type") != "FeatureCollection":
                  raise SystemExit(f"{row.get('id')}: GeoJSON no es FeatureCollection")
              expected = int(row.get("expected_districts") or 0)
              observed = len(payload.get("features", []))
              if expected and observed != expected:
                  raise SystemExit(f"{row.get('id')}: distritos observados {observed} != {expected}")
          PY
          if [[ -z "$PRODUCTION_RUN_ID" ]]; then
            python herramientas/evaluar_publicacion_visor.py --requested-run-id "" --registry /tmp/site-candidate/data/viewer-results.json --phase prepared --output .ddd-publication/publicacion_visor.json
          else
            source .ddd-publication/lote.sh
            for run in "${LOTE[@]}"; do
              python herramientas/evaluar_publicacion_visor.py --requested-run-id "$run" --registry /tmp/site-candidate/data/viewer-results.json \
                --phase prepared --output "$(evidencia_run "$run")" --production-root "$(raiz_run "$run")" --strict-request
            done
          fi

      - name: Verificar Pages habilitado para GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/pages-site.json; then
            echo "::error::GitHub Pages no está habilitado para este repositorio. Debe habilitarse una sola vez en Settings > Pages con Source = GitHub Actions; el GITHUB_TOKEN no puede crear el sitio."
            exit 58
          fi
          build_type="$(jq -r '.build_type // empty' /tmp/pages-site.json)"
          [[ "$build_type" == "workflow" ]] || {
            echo "::error::GitHub Pages está configurado con build_type=$build_type; se requiere Source = GitHub Actions."
            exit 58
          }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: {path: /tmp/site-candidate}
      - name: Esperar a que el artefacto github-pages sea visible (T-454)
        shell: bash
        run: |
          set -euo pipefail
          # Carrera conocida: `deploy-pages` arranca en el mismo segundo en que `upload-pages-artifact` termina y a veces aún no ve el artefacto.
          # Espera creciente con tope (~90 s); solo cuenta el artefacto creado en ESTE intento (al repetir el job existe el del anterior); tras verlo en la
          # lista, un margen corto porque la búsqueda interna de `deploy-pages` puede ir por detrás. Si no aparece solo avisa y `deploy-pages` decide.
          inicio=""
          inicio="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/${GITHUB_RUN_ATTEMPT:-1}" --jq .run_started_at 2>/dev/null)" || inicio=""
          visible=false
          for espera in 0 3 6 12 24 45; do
            sleep $(( espera * ${DDD_REINTENTO_BASE:-1} ))
            n=0
            n="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" 2>/dev/null \
              | jq --arg ini "$inicio" '[.artifacts[] | select(.name == "github-pages" and .expired == false and .created_at >= $ini)] | length' 2>/dev/null)" || n=0
            if [[ "$n" =~ ^[0-9]+$ ]] && (( n > 0 )); then visible=true; break; fi
            echo "El artefacto github-pages de este intento aún no es visible (espera $espera s)."
          done
          if [[ "$visible" == true ]]; then
            echo "Artefacto github-pages visible; margen de 10 s para la búsqueda de deploy-pages."
            sleep $(( 10 * ${DDD_REINTENTO_BASE:-1} ))
          else
            echo "::warning::T-454: el artefacto github-pages de este intento no apareció en la lista del run; sigue deploy-pages."
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Persistir registro sólo después del despliegue
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.deployment.outcome }}" == "success" ]] || {
            echo "::error::No se persiste el registro porque Pages no se desplegó correctamente."; exit 49;
          }
          cp /tmp/publicaciones_visor.candidate.json "$PUBLICATION_REGISTRY"
          # Registro, resultados ligeros y datos abiertos van juntos: INDEX.json nunca queda desfasado del registro.
          [[ -z "$(git status --porcelain -- "$PUBLICATION_REGISTRY" datos/resultados datos_abiertos datos/composicion)" ]] && exit 0
          [[ "$GITHUB_REF_NAME" == "main" ]] || {
            echo "::error::Las promociones publicables sólo pueden persistirse desde main."; exit 45;
          }
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A -- "$PUBLICATION_REGISTRY" datos/resultados datos_abiertos datos/composicion
          git commit -m "chore: registrar activos persistentes del visor"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            [[ "$attempt" == 3 ]] && {
              echo "::error::No se pudo persistir el registro de publicaciones."; exit 48;
            }
            sleep $((attempt * 2))
          done

      - name: Datos de la web en R2 (T-430)
        id: datos_web
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_WEB_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_WEB_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_WEB_BUCKET: ${{ vars.R2_WEB_BUCKET }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}  # solo para rechazar que el bucket web sea el de trabajo
        run: |
          set -euo pipefail
          # Fase 1 (D-186): en paralelo a Pages, después de desplegarla. Sin la variable R2_WEB_BUCKET no hace nada; un fallo avisa y no para P40.
          python3 herramientas/publicar_datos_web.py --sitio /tmp/site-candidate

      - name: Web en R2 (T-430)
        if: ${{ github.ref == 'refs/heads/main' && steps.datos_web.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_SITIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SITIO_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_SITIO_BUCKET: ${{ vars.R2_SITIO_BUCKET }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}  # para rechazar que el bucket del sitio sea el de trabajo
          R2_WEB_BUCKET: ${{ vars.R2_WEB_BUCKET }}  # o el de datos
        run: |
          set -euo pipefail
          # Paso 2 (D-193/D-194): la web, sin los datos, al bucket del sitio, en paralelo a Pages. Sin la variable R2_SITIO_BUCKET no hace nada.
          python3 herramientas/publicar_sitio_r2.py --sitio /tmp/site-candidate

      - name: Promover la doble vuelta a mapas/ (T-443)
        if: ${{ github.ref == 'refs/heads/main' && steps.deployment.outcome == 'success' && inputs.simular != true }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          # D-198: mapas/ = lo publicado. Copia tal cual lo fijado (mismo sha256, comprobado tras subir); sin fijado no hace nada; un fallo pone el job en rojo.
          python3 herramientas/publicar_doble_vuelta.py promover

      - name: Registrar evidencia
        if: always()
        shell: bash
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-publication
          if [[ -n "$PRODUCTION_RUN_ID" && -f .ddd-publication/lote.sh ]]; then
            source .ddd-publication/lote.sh
            fallos=()
            for run in "${LOTE[@]}"; do
              args=(--requested-run-id "$run" --registry /tmp/site-candidate/data/viewer-results.json --viewer-url "$PAGE_URL" --deployment-outcome "$DEPLOYMENT_OUTCOME" --phase final --output "$(evidencia_run "$run")")
              [[ -d "$(raiz_run "$run")" ]] && args+=(--production-root "$(raiz_run "$run")")
              python herramientas/evaluar_publicacion_visor.py "${args[@]}" || fallos+=("$run")
            done
            (( ${#fallos[@]} == 0 )) || { echo "::error::Evidencia final fallida para ${fallos[*]}"; exit 1; }
          else
            args=(--requested-run-id "$PRODUCTION_RUN_ID" --registry /tmp/site-candidate/data/viewer-results.json --viewer-url "$PAGE_URL" --deployment-outcome "$DEPLOYMENT_OUTCOME" --phase final --output .ddd-publication/publicacion_visor.json)
            python herramientas/evaluar_publicacion_visor.py "${args[@]}"
          fi
          case "$TARGET_PAGE" in "Dashboard operativo") rel="dashboard/";; *) rel="";; esac
          jq -n --arg pagina "$TARGET_PAGE" --arg url "$PAGE_URL$rel" --arg pages_root "$PAGE_URL" --arg run_id "$GITHUB_RUN_ID"             '{pagina_solicitada:$pagina,url_objetivo:$url,pages_root:$pages_root,workflow_run_id:$run_id}'             > .ddd-publication/pagina_publicada.json

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-publication-${{ github.run_id }}
          path: .ddd-publication
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
