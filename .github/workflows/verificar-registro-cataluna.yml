name: Verificar Cataluña 2024 · paquete y registro en copia

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Adquirir, reconciliar y empaquetar Cataluña 2024
        run: |
          set -euo pipefail
          rm -rf .ddd-cataluna-package .ddd-registry-copy
          python -m herramientas.preparar_fuente_electoral             --territory-id cataluna             --edition 2025             --package-out .ddd-cataluna-package             --root-dir .             --declaration territorios/cataluna/config/elecciones/cataluna_parlament_2024_vigente.yaml
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('.ddd-cataluna-package')
          m=json.loads((p/'manifest.json').read_text(encoding='utf-8'))
          if m.get('decision')!='ACQUIRE': raise SystemExit(f"decisión inesperada: {m.get('decision')}")
          if m.get('election_id')!='cataluna_parlament_2024' or m.get('election_date')!='2024-05-12':
              raise SystemExit('identidad electoral incorrecta')
          t=((m.get('selected_source') or {}).get('transform') or {})
          expected={'sections':5121,'official_candidate_votes':3120503,'source_verification_status':'VERIFIED_EXACT'}
          for k,v in expected.items():
              if t.get(k)!=v: raise SystemExit(f'{k}: {t.get(k)} != {v}')
          c=json.loads((p/'contract/election_contract.json').read_text(encoding='utf-8'))
          sv=c.get('source_verification') or {}
          checks={
            'sections':sv.get('sections')==5121,
            'polling_stations':sv.get('polling_stations')==8944,
            'observed_voters':sv.get('observed_voters')==3183137,
            'observed_candidate_votes':sv.get('observed_candidate_votes')==3120503,
            'party_totals_match':sv.get('party_totals_match') is True,
          }
          if not all(checks.values()): raise SystemExit(f'controles Generalitat: {checks}')
          source=p/(m['selected_source']['path'])
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          if actual!=m['selected_source']['sha256']: raise SystemExit('hash fuente normalizada no coincide')
          out={
            'territorio':'cataluna','election_id':m['election_id'],'fecha':m['election_date'],
            'secciones':sv['sections'],'mesas':sv['polling_stations'],'votantes':sv['observed_voters'],
            'votos_candidaturas':sv['observed_candidate_votes'],
            'package_manifest_sha256':hashlib.sha256((p/'manifest.json').read_bytes()).hexdigest(),
            'normalized_sha256':actual,
            'origen':m['selected_source'].get('origin_url'),
            'verificacion':sv.get('status'),
          }
          Path('cataluna-evidencia.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Registrar exclusivamente en copia de trabajo
        run: |
          set -euo pipefail
          mkdir .ddd-registry-copy
          cp -a configuracion territorios herramientas .ddd-registry-copy/
          manifest_sha="$(sha256sum .ddd-cataluna-package/manifest.json | awk '{print $1}')"
          python herramientas/promover_catalogo_operacional.py             --kind electoral_source             --territory-id cataluna             --edition 2025             --run-id 147024             --artifact-name ddd-electoral-package-cataluna-2025-147024             --artifact-sha256 "$manifest_sha"             --election-id cataluna_parlament_2024             --declaration territorios/cataluna/config/elecciones/cataluna_parlament_2024_vigente.yaml             --source-commit "$GITHUB_SHA"             --root-dir .ddd-registry-copy
          python herramientas/preflight_preparacion_fuente.py             --root-dir .ddd-registry-copy             --kind electoral             --territory cataluna             --edition 2025 > cataluna-registro-copia.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cataluna-registro-copia.json').read_text())
          if r.get('registered') is not True or r.get('election_id')!='cataluna_parlament_2024':
              raise SystemExit(f'registro en copia inválido: {r}')
          e=json.loads(Path('cataluna-evidencia.json').read_text())
          e['registro_copia']='PASS'
          Path('cataluna-evidencia.json').write_text(json.dumps(e,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(e,ensure_ascii=False,indent=2))
          PY
          cat cataluna-evidencia.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar sólo evidencia pequeña
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-cataluna-2024
          path: |
            cataluna-evidencia.json
            cataluna-registro-copia.json
          if-no-files-found: error
          retention-days: 7
