# PROYECTO: Diputado de Distrito
# CLASE: smoke operativo no productivo
# VERSIÓN: 1.0.1
# FECHA: 2026-10-25
# ESTADO: candidato
# QUÉ HACE: permite observar una ejecución activa y varias pendientes en el mismo grupo de concurrencia.
# CAMBIOS: valida el ticket y lo pasa por variable de entorno para impedir interpolación de datos manuales en Bash.
# MOTIVO: evitar ejecución de shell arbitraria desde el input de workflow_dispatch.
# ANTERIOR: legacy/workflows/p0_operational_repair_20261025/smoke-concurrencia-cola_v1.0.0.pre-fix.yml
# NO HACE: checkout, escritura de catálogo, generación territorial, publicación ni llamadas externas.
name: Smoke no productivo — cola de concurrencia

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Identificador de esta invocación (1 a 5)
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  esperar-en-cola:
    name: Espera inocua ${{ inputs.ticket }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: ddd-p0-concurrency-smoke
      cancel-in-progress: false
      queue: max
    steps:
      - name: Registrar entrada y mantener el grupo ocupado
        shell: bash
        env:
          SMOKE_TICKET: ${{ inputs.ticket }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_TICKET" =~ ^[1-5]$ ]] || { echo 'Invalid smoke ticket' >&2; exit 2; }
          printf 'SMOKE_START ticket=%s run_id=%s\n' "$SMOKE_TICKET" "$GITHUB_RUN_ID"
          sleep 45
          printf 'SMOKE_END ticket=%s run_id=%s\n' "$SMOKE_TICKET" "$GITHUB_RUN_ID"
