# Prueba aislada de 5 jobs en cola, sin escrituras productivas.
name: P0 Smoke Cola GitHub Actions
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'procedimiento.sh'
      - 'herramientas/validar_portfolio_gerrychain50.py'
      - 'tests/test_operational_concurrency_gerrychain50.py'
permissions:
  contents: read
jobs:
  validar_estatico:
    name: Regression P0 y actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Probar cola y portfolio sintético
        run: python3 -m unittest tests.test_operational_concurrency_gerrychain50 -v
      - name: Instalar actionlint v1.7.12
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Actionlint diferencial (solo se excluye queue max del parser antiguo)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path(".github/workflows")
          temp = Path("/tmp/ddd-p0-actionlint")
          (temp / "head").mkdir(parents=True, exist_ok=True)
          (temp / "base").mkdir(parents=True, exist_ok=True)
          base = subprocess.check_output(["git", "rev-parse", "HEAD^1"], text=True).strip()
          selected = 0
          for path in root.glob("*.yml"):
              head = path.read_text(encoding="utf-8")
              if "queue: max" not in head:
                  continue
              def sanitize(body):
                  body = "\n".join(line for line in body.splitlines() if line.strip() != "queue: max") + "\n"
                  return body.replace(", queue: max", "")
              (temp / "head" / path.name).write_text(sanitize(head), encoding="utf-8")
              baseline = subprocess.run(["git", "show", f"{base}:.github/workflows/{path.name}"], capture_output=True, text=True)
              if baseline.returncode == 0:
                  (temp / "base" / path.name).write_text(sanitize(baseline.stdout), encoding="utf-8")
              selected += 1
          if selected < 17:
              raise SystemExit(f"Faltan workflows de la reparación: {selected} < 17")
          print(f"Validación diferencial de {selected} workflows; fuentes originales intactas")
          PY
          BIN="$(go env GOPATH)/bin/actionlint"
          "$BIN" -no-color -oneline /tmp/ddd-p0-actionlint/base/*.yml > /tmp/ddd-p0-actionlint/base.log 2>&1 || true
          "$BIN" -no-color -oneline /tmp/ddd-p0-actionlint/head/*.yml > /tmp/ddd-p0-actionlint/head.log 2>&1 || true
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          root = Path("/tmp/ddd-p0-actionlint")
          def read(name):
              out = Counter()
              for line in (root / name).read_text(encoding="utf-8").splitlines():
                  match = re.search(r"/([^/]+[.]yml):[0-9]+:[0-9]+: (.+)$", line)
                  if not match:
                      if line.strip():
                          raise SystemExit(f"Salida actionlint no reconocida: {line}")
                      continue
                  detail = re.sub(r"(SC[0-9]+:[a-z]+):[0-9]+:[0-9]+:", lambda m: m.group(1) + ":", match.group(2))
                  out[(match.group(1), detail)] += 1
              return out
          old = read("base.log")
          new = read("head.log")
          regressions = new - old
          print(f"actionlint: baseline={sum(old.values())}, PR={sum(new.values())}, nuevas={sum(regressions.values())}")
          for (path, problem), count in sorted(regressions.items()):
              print(f"NEW {path}: {problem} (x{count})")
          if regressions:
              raise SystemExit("actionlint diferencial: nuevas infracciones detectadas")
          PY
  validar_gerrychain_runtime:
    name: Runtime GerryChain real (sin producción)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir runtime reproducible
        run: docker build --pull -t ddd-p0-gerry:ci .
      - name: Ejecutar regresiones ReCom no omitidas
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PYTHONHASHSEED=0 -e DDD_SKIP_LEGACY_CHECK=1 \
            --entrypoint /opt/ddd-gerrychain/bin/python ddd-p0-gerry:ci \
            -m unittest tests.test_m05_gerrychain_strategy.ContractTests \
              tests.test_m05_gerrychain_strategy.GerryChainRuntimeTests \
              tests.test_m05_gerrychain_engine.AdapterAndMetricsTests.test_real_gerrychain_recom_smoke -v \
            2>&1 | tee p0-gerrychain-runtime.log
      - name: Conservar log del runtime
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-gerrychain-runtime
          path: p0-gerrychain-runtime.log
          if-no-files-found: warn
          retention-days: 30
  smoke_cola:
    name: Comprobar cola ticket ${{ matrix.ticket }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ticket: [1, 2, 3, 4, 5]
    concurrency:
      group: ddd-p0-smoke-${{ github.run_id }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validar ticket fijo y esperar
        shell: bash
        env:
          TICKET: ${{ matrix.ticket }}
        run: |
          set -euo pipefail
          case "$TICKET" in 1|2|3|4|5) ;; *) exit 42 ;; esac
          echo "P0 cola: ticket=$TICKET"
          sleep 20
          echo "P0 cola: ticket=$TICKET completado"
