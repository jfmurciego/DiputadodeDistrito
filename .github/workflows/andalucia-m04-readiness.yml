# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE: AND-03 — Inventario de preparación M04
# FECHA: 2026-09-11
# ESTADO: diagnóstico; no ejecuta M04.
# QUÉ HACE: ejecuta M01-M03 ya validados y mide municipios por población relativa al target K=109, sin heredar todavía coeficientes de Extremadura.
# MOTIVO: cuantificar escala y riesgo municipal antes de aplicar la nueva política M04 a 6.029 secciones.
name: AND-03 — Preparación M04 Andalucía

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/andalucia-m04-readiness.yml'
      - 'territorios/andalucia/config/andalucia_2025.yaml'

permissions: {contents: read}

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env: {PARAMS: territorios/andalucia/config/andalucia_2025.yaml}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Reconstruir fuentes
        run: bash inputs/partes/reconstruir_fuentes.sh
      - name: Construir entorno
        run: docker build --pull -t ddd-and-ready:${GITHUB_SHA} .
      - name: Ejecutar M01-M03
        run: |
          set -euo pipefail
          mkdir -p territorios/andalucia/.cache/ddd/preparacion/andalucia_2025
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/andalucia:/app/territorios/andalucia" --entrypoint bash ddd-and-ready:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'
      - name: Inventariar municipios y escenarios
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/territorios/andalucia:/app/territorios/andalucia" --entrypoint python ddd-and-ready:${GITHUB_SHA} -c '
          import io,json,pathlib,zipfile
          import geopandas as gpd
          base=pathlib.Path("/app/territorios/andalucia/.cache/ddd/preparacion/andalucia_2025")
          with zipfile.ZipFile(base/"andalucia_2025_m01_secciones_poblacion.geojson.zip") as z:
              n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          g["CPRO"]=g["CPRO"].astype(str).str.zfill(2);g["CUMUN"]=g["CUMUN"].astype(str);target=float(g.POP_2025.sum())/109
          grp=g.groupby(["CPRO","CUMUN","NMUN"],dropna=False).agg(population=("POP_2025","sum"),sections=("CUSEC_KEY","count")).reset_index();grp["ratio_target"]=grp.population/target
          thresholds=[1.05,1.10,1.12,1.20,1.50,1.75]
          summary={str(t):int((grp.ratio_target>t).sum()) for t in thresholds}
          top=grp.sort_values(["ratio_target","population"],ascending=False).head(40).to_dict("records")
          out={"K":109,"population":int(g.POP_2025.sum()),"target":target,"threshold_counts":summary,"top_municipalities":top}
          p=pathlib.Path("/app/territorios/andalucia/.cache/ddd/and03_readiness.json");p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(out,ensure_ascii=False,indent=2,default=str));print(json.dumps({"target":target,"threshold_counts":summary,"top10":[(x["NMUN"],int(x["population"]),round(float(x["ratio_target"]),3)) for x in top[:10]]},ensure_ascii=False))'
      - name: Publicar AND-03 readiness
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: andalucia-AND03-readiness-${{ github.run_id }}
          path: |
            territorios/andalucia/.cache/ddd/and03_readiness.json
            territorios/andalucia/.cache/ddd/preparacion/andalucia_2025/andalucia_2025_m03_informe.json
