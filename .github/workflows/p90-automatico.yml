# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.5.4
# NOMBRE DE VERSIÓN: P90 Automático — CI, IA de cierre de campaña, métricas y medición de la web en un solo workflow
# FECHA: 2026-11-26
# ESTADO: candidato
# ANTERIOR: legacy/workflows/p90-automatico_v1.5.3_20261126.yml
# CAMBIOS 1.5.4: T-505 (D-211): el job `guardian` de las PR añade el paso «sin Co-authored-by ni Claude-Session» (`comprobar_guardian_main.py coautores`, base..head). El resto, idéntico.
# ANTERIOR (1.5.3): legacy/workflows/p90-automatico_v1.5.2_20261124.yml
# CAMBIOS 1.5.3: T-457 (orden del propietario, 24-11): el pie del comentario del forense deja de nombrar el modelo: «_Forense automático (solo lectura; …)» (antes «(Sonnet, solo lectura; …)»). El resto, idéntico.
# ANTERIOR (1.5.2): legacy/workflows/p90-automatico_v1.5.1_20261123.yml
# CAMBIOS 1.5.2: T-450 §4 / D-199: el paso de `medir_web` recibe el secreto del repositorio `MEDICION_CDN` (lo crea el propietario; el
#   mismo valor que la regla del CDN) y `herramientas/medir_web.py` 1.2.0 lo envía como cabecera `X-DDD-Medicion` solo a
#   diputadodedistrito.es, desde un fichero temporal (nunca en la línea de órdenes ni en la tabla). Sin el secreto, mide como hasta ahora. El resto, idéntico.
# ANTERIOR (1.5.1): legacy/workflows/p90-automatico_v1.5.0_20261123.yml
# CAMBIOS 1.5.1: T-430 3c, menores del revisor de #989: (a) la comprobación de orden de `publicar_web` no depende de la lista de `compare`
#   (máx. 300 ficheros): con `ahead_by` 0 publica; con 300 o más ficheros no publica (fallo cerrado); (b) aviso visible (`::warning::`)
#   cuando la web en R2 se queda atrás hasta la siguiente P40: un push a main que toca `visor/v4/` con otros ficheros (`cambios`) y una
#   publicación omitida por una V4 posterior. El resto, idéntico.
# ANTERIOR (1.5.0): legacy/workflows/p90-automatico_v1.4.1_20261123.yml
# CAMBIOS 1.5.0: T-430 paso 3c (D-194, pregunta 7 de REDISENO_R2: publicar la web sola al fusionar, aprobada expresamente por el propietario):
#   en un push a `main` cuyos ficheros son SOLO de la web (la misma lista `RUTAS_WEB` y el mismo fallo cerrado que el atajo de las PR) y
#   tocan `visor/v4/`, `cambios` marca `publicar_web=true` (`web` sigue siendo solo de PR: en `main` corre la batería completa) y el job
#   `publicar_web` monta el sitio de R2 vigente con la V4 de `main` (`herramientas/web_fusion_r2.py`: sha256 de cada fichero contra el
#   índice del sitio, sin datos) y lo publica con `herramientas/publicar_sitio_r2.py` (mismo tope de borrado), sin P40 completa. Solo
#   `main`, `contents: read`, secretos `R2_SITIO_*` en el paso, mismo grupo de concurrencia que P40 `publicar` (`ddd-pages-prod`); sin la
#   variable `R2_SITIO_BUCKET` o sin índice previo del sitio no hace nada. No entra en `pruebas`. GitHub Pages no cambia (lo sigue publicando P40).
#   Solo con `guardian` y `suite` de ese push en verde, la V4 con `node --check`, un único commit sobre el anterior (si no, no publica) y
#   sin una V4 posterior ya en `main` (orden); el montaje aborta si un nombre nuevo de la V4 pisaría el sitio o hay enlaces simbólicos.
#   Arregla además el `rc` del bloque de 3b, que bajo `bash -e` abortaba `cambios` en una PR solo de la web.
# ANTERIOR (1.4.1): legacy/workflows/p90-automatico_v1.4.0_20261123.yml
# CAMBIOS 1.4.1: T-379 PR 2a (D-147, opción a; D-162, opción A), puesta al día sobre main el 23-11: todo job que usa la app de registro (DDD_REGISTRO_APP_*) declara un entorno limitado a main (`registro`, sin revisores; P40 `publicar` sigue en `github-pages` y P70 `podar` en `produccion`): desde una rama o una PR esos jobs no reciben los secretos. Resto idéntico.
# ANTERIOR (1.4.0): legacy/workflows/p90-automatico_v1.3.0_20261123.yml
# CAMBIOS 1.4.0: T-430 paso 3b (D-194, pregunta 6 de REDISENO_R2: atajo de CI aprobado expresamente por el propietario): en una PR cuyos ficheros
#   son SOLO de la web (`visor/v4/…`, sus tests `tests/test_visor_v4*` y la entrada de `docs/registro/`), `cambios` marca `web=true`: la
#   batería completa (`suite`) no corre y en su lugar corre el job `web` (las pruebas de la V4, T-428, sin terceros, T-220 y vista de
#   pruebas, ~1 min); `pruebas` exige `web` en verde. Cualquier otro fichero, o un push a `main`, o la nocturna: batería completa como hoy.
# ANTERIOR (1.3.0): legacy/workflows/p90-automatico_v1.2.0_20261123.yml
# CAMBIOS 1.3.0: T-430 paso 3a (D-193/D-194, REDISENO_R2 §2): jobs `pruebas_web` (en cada PR de una rama de este repositorio que toque
#   `visor/v4/`, monta la V4 con `herramientas/pruebas_web_r2.py` y la sincroniza en `s3://<R2_PRUEBAS_BUCKET>/<rama>/` =
#   https://pruebas.diputadodedistrito.es/<rama>/, sin buscadores) y `limpiar_pruebas` (en cada push a `main`, borra las carpetas de ramas
#   sin PR abierta, con tope). Solo lectura del repositorio (`contents`/`pull-requests: read`), llave propia del bucket de pruebas en el
#   paso (token de R2 de escritura SOLO en el bucket de pruebas: el job corre en PR con el workflow de la rama); el script que sube es
#   el de `main` (segundo checkout en `_main/`); sin la variable `R2_PRUEBAS_BUCKET` no hacen nada. No entran en `pruebas` ni cambian los eventos. El resto, idéntico.
# ANTERIOR (1.2.0): legacy/workflows/p90-automatico_v1.1.0_20261122.yml
# CAMBIOS 1.2.0: T-440 (propietario, 22-11): job `medir_web`, A PETICIÓN y sin calendario ni botón: disparo `repository_dispatch` de tipo
#   `medir-web` (el Operador lo lanza por REST con la frase del propietario). `herramientas/medir_web.py` pide la portada, una página de
#   territorio, el mapa y sus datos principales de https://diputadodedistrito.es, 3 veces con y sin compresión, e imprime la tabla en el log
#   y en el resumen del job. Solo lectura (`contents: read`), sin secretos. Los demás jobs no corren con ese evento (su `if` los ata al suyo). El resto, idéntico.
# QUÉ HACE: reúne los workflows automáticos (sin botón manual) que sustituye: «Pruebas de la Plataforma» (push a main, pull_request
#   opened/synchronize/reopened como hoy, nocturna 02:23 UTC), «Forense de la 00» (workflow_run de «P00 Campaña») y el job `metricas` de
#   «Mantenimiento» (lunes 05:17 UTC). Cada job conserva su condición, permisos y concurrencia; el `if` de cada grupo lo ata a su evento.
# CAMBIOS: 1.1.0 (T-379 PR 4, D-143/D-145/D-147; diseño P00 §7): el forense por cada 00 (forense_comprobar, diagnosticar, forense_issue) se
#   sustituye por la IA de cierre por campaña: se abre solo si falla el job `resultado` de «P00 Campaña» (no en la prueba de humo de PR);
#   `cierre_ia` solo lee (contents/actions/checks/issues: read; logs = entrada no confiable) y `cierre_comentario`, el único con
#   `issues: write`, comenta en el issue de la campaña (título «P00 Campaña…», una vez por run, abierto, no PR y citando el run). SIN job `resultado` en la 00 (PR 3 de T-379) esto NO dispara: la PR 3 no debe
#   fusionarse sin un job llamado exactamente `resultado`. Sin cambio en los demás jobs.
#   1.0.0 (T-366, D-129/D-130): fichero nuevo. Sustituye a pruebas-plataforma 1.10.4, forense-00 1.0.2 y el job `metricas` de
#   mantenimiento-programado 1.0.3 (copias en legacy/workflows/). NO absorbe, a propósito y a la espera del propietario:
#   - revisor-pr.yml: el check `veredicto` necesita `labeled`/`ready_for_review`; en el workflow que define `pruebas` crearían un check-run
#     `pruebas` skipped (otra suite) sobre el HEAD que el ruleset cuenta como cumplido.
#   - auto-merge.yml (1.3.0, solo disparador: workflow_run de «P90 Automático»): GitHub rechaza un `workflow_run` que se nombra a sí
#     mismo y un job en el run de la PR ejecutaría el código de la PR con la app de registro.
#   - archivar_r2/extraer_m06: siguen en mantenimiento-programado.yml 1.1.0 hasta P70 (paso 2).
#   Check-runs intactos: `pruebas`, `guardian`, `suite (n)`. Ids renombrados por colisión: comprobar→`forense_comprobar`, issue→`forense_issue`.
# MOTIVO: reducir la lista de Actions a un único automático (D-129/D-130) sin perder los checks exigidos por el ruleset.
name: P90 Automático
run-name: >-
  ${{ github.event_name == 'schedule' && (github.event.schedule == '23 2 * * *' && 'P90 · nocturna de pruebas' || 'P90 · métricas del proceso')
  || github.event_name == 'workflow_run' && format('P90 · {0} · run {1}', github.event.workflow_run.name, github.event.workflow_run.id)
  || github.event_name == 'repository_dispatch' && 'P90 · medir la web'
  || github.event.pull_request.title || github.event.head_commit.message }}
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
    - cron: '17 5 * * 1'
  workflow_run:
    workflows: ["P00 Campaña"]
    types: [completed]
  repository_dispatch:
    types: [medir-web]
permissions:
  contents: read

jobs:
  cambios:
    if: ${{ (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'))) }}
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ddd-pr-{0}-cambios', github.event.pull_request.number) || format('ddd-run-{0}-cambios', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      contratos: ${{ steps.f.outputs.contratos }}
      docs: ${{ steps.f.outputs.docs }}
      productos: ${{ steps.f.outputs.productos }}
      catalogo: ${{ steps.f.outputs.catalogo }}
      resultados: ${{ steps.f.outputs.resultados }}
      numeracion: ${{ steps.f.outputs.numeracion }}
      robot: ${{ steps.f.outputs.robot }}
      web: ${{ steps.f.outputs.web }}
      publicar_web: ${{ steps.f.outputs.publicar_web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        name: Decidir qué puertas por rutas corresponden
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENTO: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUTAS_WEB: '^(visor/v4/.+|tests/test_visor_v4[^/]*\.(py|js)|docs/registro/[^/]+\.md)$'
          RUTAS_ROBOT: '^(orchestracion/[^/]+\.json|datos/.+\.(json|csv|md)|publicado/.+\.json|datos_abiertos/INDEX\.json|docs/registro/[^/]+\.md|docs/REGISTRO_DE_CAMBIOS\.md|legacy/docs/.+\.md|README\.md|dashboard/metricas_proceso\.json|territorios/[^/]+/evidencia/.+\.json)$'
        run: |
          set -uo pipefail
          propio='^\.github/workflows/p90-automatico\.yml$'
          contratos='^(ddd_core/config\.py|ddd_core/territory_contract\.py|herramientas/validar_contrato_territorial\.py|schemas/territory-production-contract\.schema\.json|configuracion/catalogo_territorios_espana_2025\.yaml|inputs/MANIFEST\.sha256|tests/test_territory_contract_admission\.py)$|^territorios/[^/]+/config/[^/]*\.yaml$'
          docs='^documentacion_publica/'
          productos='^(visor/|resultados/finales/|orchestracion/productos_publicos\.json$|herramientas/g10_public_product_manifest\.py$)'
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! files="$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA" 2>/dev/null)"; then
            echo "::notice::Sin base comparable: se ejecutan todas las puertas."
            files="todo"
          fi
          marca() { # nombre regex
            if [[ "$files" == "todo" ]] || grep -qE "$propio" <<<"$files" || grep -qE "$2" <<<"$files"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }
          marca contratos "$contratos"; marca docs "$docs"; marca productos "$productos"
          # Escritores de main: solo en push, sin el disparo por el propio fichero; sin base comparable corren todos (son idempotentes).
          escribe() { # nombre regex
            if [[ "$EVENTO" == "push" ]] && { [[ "$files" == "todo" ]] || grep -qE "$2" <<<"$files"; }; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }
          escribe catalogo '^(orchestracion/(publicaciones_visor|archivo_r2|productos_publicos)\.json|datos_abiertos/INDEX\.json|fuentes/catalogo_oficial\.yaml|configuracion/(catalogo_preparacion|publicaciones)\.yaml|datos/(composicion|resultados)/MANIFEST\.json)$'
          escribe resultados '^(orchestracion/publicaciones_visor\.json|datos/composicion/MANIFEST\.json)$'
          escribe numeracion '^docs/registro/'
          # Push de un robot que solo registra datos o numera el registro: basta la comprobación de integridad (guardian).
          # Cualquier ruta fuera de la lista (código, tests, workflows, configuración) o un actor que no sea [bot]: suite completa.
          robot=false
          if [[ "$EVENTO" == "push" && "$files" != "todo" && "$ACTOR" == *"[bot]" && -n "$files" ]]; then
            ajeno="$(grep -vE "$RUTAS_ROBOT" <<<"$files" || true)"
            if [[ -z "$ajeno" ]]; then robot=true; else echo "::notice::Push de robot con rutas fuera de la lista: suite completa. Ajenas: $ajeno"; fi
          fi
          echo "robot=$robot" >> "$GITHUB_OUTPUT"
          echo "robot=$robot (evento=$EVENTO, actor=$ACTOR)"
          # T-430 3b (D-194, P6): PR que solo toca la web (y toca visor/v4/): pruebas de la web en vez de la batería completa.
          web=false
          if [[ "$EVENTO" == "pull_request" && "$files" != "todo" && -n "$files" ]]; then
            rc=0; ajeno="$(grep -vE "$RUTAS_WEB" <<<"$files")" || rc=$?  # 0: hay ajenos; 1: ninguno; >1: error de grep -> batería completa
            if (( rc > 1 )); then echo "::notice::No se pudo clasificar la PR como solo web (grep rc=$rc): batería completa."
            elif [[ -z "$ajeno" ]] && grep -qE '^visor/v4/' <<<"$files"; then web=true; fi
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "web=$web"
          # T-430 3c (D-194, P7): push a main solo de la web (misma lista y mismo fallo cerrado): publicar la web sola (job `publicar_web`).
          publicar_web=false
          if [[ "$EVENTO" == "push" && "$files" != "todo" && -n "$files" ]]; then
            rc=0; ajeno="$(grep -vE "$RUTAS_WEB" <<<"$files")" || rc=$?  # 0: hay ajenos; 1: ninguno; >1: error de grep -> no se publica
            if (( rc > 1 )); then echo "::notice::No se pudo clasificar el push como solo web (grep rc=$rc): no se publica la web."
            elif [[ -z "$ajeno" ]] && grep -qE '^visor/v4/' <<<"$files"; then publicar_web=true
            elif grep -qE '^visor/v4/' <<<"$files"; then echo "::warning::El push toca visor/v4/ junto con otros ficheros: la web en R2 no se publica sola; queda atrás hasta la siguiente P40."; fi
          fi
          echo "publicar_web=$publicar_web" >> "$GITHUB_OUTPUT"
          echo "publicar_web=$publicar_web"

  guardian:
    needs: cambios
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'))) }}
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && 'ddd-main-guardian' || github.event_name == 'pull_request' && format('ddd-pr-{0}-guardian', github.event.pull_request.number) || format('ddd-run-{0}-guardian', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar V3 con Node en runner host
        if: ${{ hashFiles('visor/v3/v3.js') != '' }}
        run: |
          node --check visor/v3/v3.js
          node tests/test_visor_v3_ui.js
      - name: Probar el Worker del contador (T-294)
        run: node --test herramientas/contador_worker/prueba.mjs
      - name: Guardián de main — sin marcas de conflicto en ficheros versionados
        run: python herramientas/comprobar_guardian_main.py marcas
      - name: Guardián de main — numeración consecutiva del registro de cambios
        run: python herramientas/comprobar_guardian_main.py registro
      - name: Guardián de la PR — commits sin Co-authored-by ni Claude-Session (T-505)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Profundidad 1000: una rama con más commits propios daría un falso positivo (falla en seguro, no deja pasar nada).
          git fetch --no-tags --depth=1000 origin "$BASE_SHA" "$HEAD_SHA"
          python herramientas/comprobar_guardian_main.py coautores --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Auditar cabeceras y legacy en checkout
        run: python -m unittest tests.test_r015_invariantes.GovernanceHeaders -v
      - name: Probar SHA inmutable frente a avance de main
        run: bash tests/test_source_sha_pinning_git.sh
      - name: Probar registros electorales concurrentes sobre Git real
        run: python -m unittest tests.test_registro_producto_electoral_concurrencia -v
      - name: Probar persistencia pre-M04 concurrente sobre Git real
        run: python -m unittest tests.test_pre_m04_persistencia_concurrente -v
      - name: Probar recuperación durable de producto electoral
        run: python -m unittest tests.test_recuperacion_producto_electoral -v
      - name: Probar reanudación automática de M08 huérfano
        run: python -m unittest tests.test_reanudacion_m08_huerfano -v
      - name: Verificar geometría original INE 2025 en checkout
        run: python -m unittest tests.test_national_ine_original_parts -v

  suite:
    needs: cambios
    if: ${{ needs.cambios.outputs.robot != 'true' && needs.cambios.outputs.web != 'true' }}
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && format('ddd-main-suite-{0}', matrix.grupo) || github.event_name == 'pull_request' && format('ddd-pr-{0}-suite-{1}', github.event.pull_request.number, matrix.grupo) || format('ddd-run-{0}-suite-{1}', github.run_id, matrix.grupo) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2, 3, 4, 5]
    env:
      GRUPOS: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-tests:${GITHUB_SHA} .
      - name: Diagnóstico original N08 de nueve provincias (solo PR 268)
        if: ${{ matrix.grupo == 1 && github.event_name == 'pull_request' && github.event.pull_request.number == 268 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 \
            -v "${GITHUB_WORKSPACE}/inputs/partes:/app/inputs/partes:ro" \
            --entrypoint python ddd-tests:${GITHUB_SHA} \
            -m herramientas.diagnosticar_desconexiones_congreso_n08 \
            2>&1 | tee ci-n08-nine-cases.log
      - name: Exportar expedientes nominales N08 originales (rama de expedientes)
        if: ${{ matrix.grupo == 1 && github.event_name == 'pull_request' && github.head_ref == 'work/n08-nominal-exceptions-20261019' }}
        shell: bash
        run: |
          mkdir -p n08-casos-certificados
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 \
            -v "${GITHUB_WORKSPACE}/n08-casos-certificados:/app/n08-casos-certificados" \
            --entrypoint python ddd-tests:${GITHUB_SHA} \
            -m herramientas.expedientes_excepciones_congreso_n08 \
            --output /app/n08-casos-certificados/expedientes-n08-cinco-provincias.json
      - name: Conservar expedientes nominales N08 y sus CUSEC
        if: ${{ failure() && matrix.grupo == 1 && github.event_name == 'pull_request' && github.head_ref == 'work/n08-nominal-exceptions-20261019' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: n08-cinco-provincias-cusec-original
          path: n08-casos-certificados/expedientes-n08-cinco-provincias.json
          retention-days: 1
          if-no-files-found: warn
      - name: Verificar descubrimiento completo de tests unittest
        if: ${{ matrix.grupo == 1 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/verificar_descubrimiento_tests.py \
            2>&1 | tee ci-test-discovery.log
      - name: Verificar evidencia publicada y determinismo sintético (grupo ${{ matrix.grupo }} de 5)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 -e DDD_EN_PR=${{ github.event_name == 'pull_request' && '1' || '' }} --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/repartir_tests.py --grupos "$GRUPOS" --grupo ${{ matrix.grupo }} \
            2>&1 | tee ci-unittest.log
      - name: Probar runtime GerryChain aislado
        if: ${{ matrix.grupo == 1 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e PYTHONHASHSEED=0 -e DDD_SKIP_LEGACY_CHECK=1 \
            --entrypoint /opt/ddd-gerrychain/bin/python ddd-tests:${GITHUB_SHA} \
            -m unittest tests.test_m05_gerrychain_strategy.ContractTests \
              tests.test_m05_gerrychain_strategy.GerryChainRuntimeTests -v \
