# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: P90 Automático — CI, revisor, fusión, forense y métricas en un solo workflow
# FECHA: 2026-11-16
# ESTADO: candidato
# ANTERIOR: legacy/workflows/pruebas-plataforma_v1.10.4_20261116.yml
# QUÉ HACE: reúne los workflows automáticos (sin botón manual) que sustituye: «Pruebas de la Plataforma» (push a main, pull_request
#   opened/synchronize/reopened como hoy, nocturna 02:23 UTC), «Forense de la 00» (workflow_run de «P00 Campaña») y el job `metricas` de
#   «Mantenimiento» (lunes 05:17 UTC). Cada job conserva su condición, permisos y concurrencia; el `if` de cada grupo lo ata a su evento.
# CAMBIOS: 1.0.0 (T-366, D-129/D-130): fichero nuevo. Sustituye a pruebas-plataforma 1.10.4, forense-00 1.0.2 y el job `metricas` de
#   mantenimiento-programado 1.0.3 (copias en legacy/workflows/). NO absorbe, a propósito y a la espera del propietario:
#   - revisor-pr.yml: el check `veredicto` necesita `labeled`/`ready_for_review`; en el workflow que define `pruebas` crearían un check-run
#     `pruebas` skipped (otra suite) sobre el HEAD que el ruleset cuenta como cumplido.
#   - auto-merge.yml (1.3.0, solo disparador: workflow_run de «P90 Automático»): GitHub rechaza un `workflow_run` que se nombra a sí
#     mismo y un job en el run de la PR ejecutaría el código de la PR con la app de registro.
#   - archivar_r2/extraer_m06: siguen en mantenimiento-programado.yml 1.1.0 hasta P70 (paso 2).
#   Check-runs intactos: `pruebas`, `guardian`, `suite (n)`. Ids renombrados por colisión: comprobar→`forense_comprobar`, issue→`forense_issue`.
# MOTIVO: reducir la lista de Actions a un único automático (D-129/D-130) sin perder los checks exigidos por el ruleset.
name: P90 Automático
run-name: >-
  ${{ github.event_name == 'schedule' && (github.event.schedule == '23 2 * * *' && 'P90 · nocturna de pruebas' || 'P90 · métricas del proceso')
  || github.event_name == 'workflow_run' && format('P90 · {0} · run {1}', github.event.workflow_run.name, github.event.workflow_run.id)
  || github.event.pull_request.title || github.event.head_commit.message }}
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
    - cron: '17 5 * * 1'
  workflow_run:
    workflows: ["P00 Campaña"]
    types: [completed]
permissions:
  contents: read

jobs:
  cambios:
    if: ${{ (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'))) }}
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ddd-pr-{0}-cambios', github.event.pull_request.number) || format('ddd-run-{0}-cambios', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      contratos: ${{ steps.f.outputs.contratos }}
      docs: ${{ steps.f.outputs.docs }}
      productos: ${{ steps.f.outputs.productos }}
      catalogo: ${{ steps.f.outputs.catalogo }}
      resultados: ${{ steps.f.outputs.resultados }}
      numeracion: ${{ steps.f.outputs.numeracion }}
      robot: ${{ steps.f.outputs.robot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        name: Decidir qué puertas por rutas corresponden
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENTO: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUTAS_ROBOT: '^(orchestracion/[^/]+\.json|datos/.+\.(json|csv|md)|publicado/.+\.json|datos_abiertos/INDEX\.json|docs/registro/[^/]+\.md|docs/REGISTRO_DE_CAMBIOS\.md|legacy/docs/.+\.md|README\.md|dashboard/metricas_proceso\.json|territorios/[^/]+/evidencia/.+\.json)$'
        run: |
          set -uo pipefail
          propio='^\.github/workflows/p90-automatico\.yml$'
          contratos='^(ddd_core/config\.py|ddd_core/territory_contract\.py|herramientas/validar_contrato_territorial\.py|schemas/territory-production-contract\.schema\.json|configuracion/catalogo_territorios_espana_2025\.yaml|inputs/MANIFEST\.sha256|tests/test_territory_contract_admission\.py)$|^territorios/[^/]+/config/[^/]*\.yaml$'
          docs='^documentacion_publica/'
          productos='^(visor/|resultados/finales/|orchestracion/productos_publicos\.json$|herramientas/g10_public_product_manifest\.py$)'
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! files="$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA" 2>/dev/null)"; then
            echo "::notice::Sin base comparable: se ejecutan todas las puertas."
            files="todo"
          fi
          marca() { # nombre regex
            if [[ "$files" == "todo" ]] || grep -qE "$propio" <<<"$files" || grep -qE "$2" <<<"$files"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }
          marca contratos "$contratos"; marca docs "$docs"; marca productos "$productos"
          # Escritores de main: solo en push, sin el disparo por el propio fichero; sin base comparable corren todos (son idempotentes).
          escribe() { # nombre regex
            if [[ "$EVENTO" == "push" ]] && { [[ "$files" == "todo" ]] || grep -qE "$2" <<<"$files"; }; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }
          escribe catalogo '^(orchestracion/(publicaciones_visor|archivo_r2|productos_publicos)\.json|datos_abiertos/INDEX\.json|fuentes/catalogo_oficial\.yaml|configuracion/(catalogo_preparacion|publicaciones)\.yaml|datos/(composicion|resultados)/MANIFEST\.json)$'
          escribe resultados '^(orchestracion/publicaciones_visor\.json|datos/composicion/MANIFEST\.json)$'
          escribe numeracion '^docs/registro/'
          # Push de un robot que solo registra datos o numera el registro: basta la comprobación de integridad (guardian).
          # Cualquier ruta fuera de la lista (código, tests, workflows, configuración) o un actor que no sea [bot]: suite completa.
          robot=false
          if [[ "$EVENTO" == "push" && "$files" != "todo" && "$ACTOR" == *"[bot]" && -n "$files" ]]; then
            ajeno="$(grep -vE "$RUTAS_ROBOT" <<<"$files" || true)"
            if [[ -z "$ajeno" ]]; then robot=true; else echo "::notice::Push de robot con rutas fuera de la lista: suite completa. Ajenas: $ajeno"; fi
          fi
          echo "robot=$robot" >> "$GITHUB_OUTPUT"
          echo "robot=$robot (evento=$EVENTO, actor=$ACTOR)"

  guardian:
    needs: cambios
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'))) }}
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && 'ddd-main-guardian' || github.event_name == 'pull_request' && format('ddd-pr-{0}-guardian', github.event.pull_request.number) || format('ddd-run-{0}-guardian', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar V3 con Node en runner host
        if: ${{ hashFiles('visor/v3/v3.js') != '' }}
        run: |
          node --check visor/v3/v3.js
          node tests/test_visor_v3_ui.js
      - name: Probar el Worker del contador (T-294)
        run: node --test herramientas/contador_worker/prueba.mjs
      - name: Guardián de main — sin marcas de conflicto en ficheros versionados
        run: python herramientas/comprobar_guardian_main.py marcas
      - name: Guardián de main — numeración consecutiva del registro de cambios
        run: python herramientas/comprobar_guardian_main.py registro
      - name: Auditar cabeceras y legacy en checkout
        run: python -m unittest tests.test_r015_invariantes.GovernanceHeaders -v
      - name: Probar SHA inmutable frente a avance de main
        run: bash tests/test_source_sha_pinning_git.sh
      - name: Probar registros electorales concurrentes sobre Git real
        run: python -m unittest tests.test_registro_producto_electoral_concurrencia -v
      - name: Probar persistencia pre-M04 concurrente sobre Git real
        run: python -m unittest tests.test_pre_m04_persistencia_concurrente -v
      - name: Probar recuperación durable de producto electoral
        run: python -m unittest tests.test_recuperacion_producto_electoral -v
      - name: Probar reanudación automática de M08 huérfano
        run: python -m unittest tests.test_reanudacion_m08_huerfano -v
      - name: Verificar geometría original INE 2025 en checkout
        run: python -m unittest tests.test_national_ine_original_parts -v

  suite:
    needs: cambios
    if: ${{ needs.cambios.outputs.robot != 'true' }}
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && format('ddd-main-suite-{0}', matrix.grupo) || github.event_name == 'pull_request' && format('ddd-pr-{0}-suite-{1}', github.event.pull_request.number, matrix.grupo) || format('ddd-run-{0}-suite-{1}', github.run_id, matrix.grupo) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2, 3, 4, 5]
    env:
      GRUPOS: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir entorno reproducible
        run: docker build --pull -t ddd-tests:${GITHUB_SHA} .
      - name: Diagnóstico original N08 de nueve provincias (solo PR 268)
        if: ${{ matrix.grupo == 1 && github.event_name == 'pull_request' && github.event.pull_request.number == 268 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 \
            -v "${GITHUB_WORKSPACE}/inputs/partes:/app/inputs/partes:ro" \
            --entrypoint python ddd-tests:${GITHUB_SHA} \
            -m herramientas.diagnosticar_desconexiones_congreso_n08 \
            2>&1 | tee ci-n08-nine-cases.log
      - name: Exportar expedientes nominales N08 originales (rama de expedientes)
        if: ${{ matrix.grupo == 1 && github.event_name == 'pull_request' && github.head_ref == 'work/n08-nominal-exceptions-20261019' }}
        shell: bash
        run: |
          mkdir -p n08-casos-certificados
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 \
            -v "${GITHUB_WORKSPACE}/n08-casos-certificados:/app/n08-casos-certificados" \
            --entrypoint python ddd-tests:${GITHUB_SHA} \
            -m herramientas.expedientes_excepciones_congreso_n08 \
            --output /app/n08-casos-certificados/expedientes-n08-cinco-provincias.json
      - name: Conservar expedientes nominales N08 y sus CUSEC
        if: ${{ failure() && matrix.grupo == 1 && github.event_name == 'pull_request' && github.head_ref == 'work/n08-nominal-exceptions-20261019' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: n08-cinco-provincias-cusec-original
          path: n08-casos-certificados/expedientes-n08-cinco-provincias.json
          retention-days: 1
          if-no-files-found: warn
      - name: Verificar descubrimiento completo de tests unittest
        if: ${{ matrix.grupo == 1 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/verificar_descubrimiento_tests.py \
            2>&1 | tee ci-test-discovery.log
      - name: Verificar evidencia publicada y determinismo sintético (grupo ${{ matrix.grupo }} de 5)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e DDD_SKIP_LEGACY_CHECK=1 -e DDD_EN_PR=${{ github.event_name == 'pull_request' && '1' || '' }} --entrypoint python \
            ddd-tests:${GITHUB_SHA} herramientas/repartir_tests.py --grupos "$GRUPOS" --grupo ${{ matrix.grupo }} \
            2>&1 | tee ci-unittest.log
      - name: Probar runtime GerryChain aislado
        if: ${{ matrix.grupo == 1 }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e PYTHONHASHSEED=0 -e DDD_SKIP_LEGACY_CHECK=1 \
            --entrypoint /opt/ddd-gerrychain/bin/python ddd-tests:${GITHUB_SHA} \
            -m unittest tests.test_m05_gerrychain_strategy.ContractTests \
              tests.test_m05_gerrychain_strategy.GerryChainRuntimeTests -v \
            2>&1 | tee ci-gerrychain.log
      - name: Conservar diagnóstico de la suite
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-unittest-${{ github.run_id }}-${{ github.run_attempt }}-grupo-${{ matrix.grupo }}
          path: |
            ci-test-discovery.log
            ci-unittest.log
            ci-gerrychain.log
            ci-n08-nine-cases.log
          if-no-files-found: warn
          retention-days: 1

  contratos:
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && 'ddd-main-contratos' || github.event_name == 'pull_request' && format('ddd-pr-{0}-contratos', github.event.pull_request.number) || format('ddd-run-{0}-contratos', github.run_id) }}
      cancel-in-progress: true
    needs: cambios
    if: ${{ needs.cambios.outputs.contratos == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar parser YAML
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Probar admisión y rechazos
        run: python -m unittest tests.test_territory_contract_admission -v
      - name: Emitir validaciones contractuales sin cálculo territorial
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          root = Path('.')
          configs = []
          for path in sorted((root / 'territorios').glob('*/config/*_2025.yaml')):
              data = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              meta = data.get('meta') or {}
              if meta.get('contract_level') != 'production_m01_m06':
                  continue
              territory_id = meta.get('territory_id')
              if not territory_id:
                  raise SystemExit(f'Contrato sin territory_id: {path}')
              configs.append((territory_id, path))

          if not configs:
              raise SystemExit('No se encontró ningún contrato production_m01_m06')

          out = root / 'validaciones-contratos'
          out.mkdir(parents=True, exist_ok=True)
          for territory_id, path in configs:
              print(f'Validando contrato: {territory_id} -> {path}')
              subprocess.run([
                  sys.executable,
                  'herramientas/validar_contrato_territorial.py',
                  '--territory', territory_id,
                  '--params', str(path),
                  '--output', str(out / f'validacion-{territory_id}.json'),
              ], check=True)
          PY
      - name: Conservar diagnóstico de contratos
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validaciones-contratos-${{ github.run_id }}
          path: validaciones-contratos
          retention-days: 1

  docs:
    needs: cambios
    if: ${{ needs.cambios.outputs.docs == 'true' }}
    concurrency:
      group: docs-preview-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement documentacion_publica/requirements.lock
      - run: python -m unittest discover -s documentacion_publica/auditoria -p 'test_*.py' -v
      - run: zensical build --strict --clean -f documentacion_publica/zensical.toml
      - name: Conservar diagnóstico de la documentación
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-documentacion-${{ github.sha }}
          path: documentacion_publica/site
          if-no-files-found: warn
          retention-days: 1

  productos:
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && 'ddd-main-productos' || github.event_name == 'pull_request' && format('ddd-pr-{0}-productos', github.event.pull_request.number) || format('ddd-run-{0}-productos', github.run_id) }}
      cancel-in-progress: true
    needs: cambios
    if: ${{ github.event_name == 'push' && needs.cambios.outputs.productos == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar contrato de publicación
        run: |
          set -euo pipefail
          node --check visor/app.js
          node --check visor/v2/v2.js
          python herramientas/g10_public_product_manifest.py --registry orchestracion/productos_publicos.json --output public-products.json
      - name: Empaquetar producto estático verificable
        run: |
          set -euo pipefail
          mkdir -p site/data/aragon site/data/castilla_y_leon
          cp visor/index.html visor/app.js visor/styles.css site/
          mkdir -p site/v2 && cp -R visor/v2/. site/v2/ && cp web/textos.md site/v2/textos.md
          sed -i 's#data-textos="../../web/textos.md"#data-textos="textos.md"#' site/v2/index.html
          cp resultados/finales/aragon/distritos.geojson site/data/aragon/
          cp resultados/finales/castilla_y_leon/distritos.geojson site/data/castilla_y_leon/
          mv public-products.json site/data/
      - name: Conservar diagnóstico del producto
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visor-publico-verificado-${{ github.run_id }}
          path: site
          retention-days: 1

  pruebas:
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && 'ddd-main-pruebas' || github.event_name == 'pull_request' && format('ddd-pr-{0}-pruebas', github.event.pull_request.number) || format('ddd-run-{0}-pruebas', github.run_id) }}
      cancel-in-progress: true
    needs: [guardian, suite, cambios, contratos, docs, productos]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Agregar resultado (check obligatorio del ruleset)
        shell: bash
        env:
          GUARDIAN: ${{ needs.guardian.result }}
          SUITE: ${{ needs.suite.result }}
          CAMBIOS: ${{ needs.cambios.result }}
          ROBOT: ${{ needs.cambios.outputs.robot }}
          CONTRATOS: ${{ needs.contratos.result }}
          DOCS: ${{ needs.docs.result }}
          PRODUCTOS: ${{ needs.productos.result }}
        run: |
          echo "guardian=$GUARDIAN suite=$SUITE contratos=$CONTRATOS docs=$DOCS productos=$PRODUCTOS"
          if [[ "$GUARDIAN" != "success" || "$CAMBIOS" != "success" ]]; then
            echo "::error::pruebas en rojo: guardian=$GUARDIAN, cambios=$CAMBIOS."; exit 1
          fi
          # La suite es obligatoria salvo en un push de robot que solo toca datos/registro (lo cubre la batería nocturna).
          if [[ "$SUITE" != "success" && ! ( "$SUITE" == "skipped" && "$ROBOT" == "true" ) ]]; then
            echo "::error::pruebas en rojo: suite=$SUITE (robot=$ROBOT)."; exit 1
          fi
          for puerta in "contratos=$CONTRATOS" "docs=$DOCS" "productos=$PRODUCTOS"; do
            if [[ "${puerta#*=}" != "success" && "${puerta#*=}" != "skipped" ]]; then
              echo "::error::pruebas en rojo: puerta ${puerta}."; exit 1
            fi
          done
          echo "pruebas en verde."

  catalogo:
    name: Regenerar catálogo de procedencia
    needs: cambios
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.cambios.result != 'success' || needs.cambios.outputs.catalogo == 'true') }}
    continue-on-error: true
    concurrency:
      group: ddd-catalogo-procedencia
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Regenerar y empujar
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          for intento in 1 2 3; do
            python herramientas/catalogo_procedencia.py --informe
            git add orchestracion/catalogo_procedencia.json
            if git diff --cached --quiet; then echo "Catálogo al día."; exit 0; fi
            git commit -m "chore(procedencia): catálogo de procedencia regenerado"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rechazado (intento $intento)"
            git reset --hard -q origin/main
            git pull -q origin main
          done
          exit 1

      - name: Señal visible si el escritor falla (no pone main en rojo)
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=Escritor de main fallido::Catálogo de procedencia falló en este push; el run sigue en verde por continue-on-error. Revisa el log del job."
          { echo "### ❌ Catálogo de procedencia falló"; echo; echo "Push \`$GITHUB_SHA\` · el job tiene continue-on-error para no teñir de rojo la batería; el fallo es real."; } >> "$GITHUB_STEP_SUMMARY"

  resultados:
    name: Regenerar resultados ligeros
    needs: cambios
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.cambios.result != 'success' || needs.cambios.outputs.resultados == 'true') }}
    continue-on-error: true
    concurrency:
      group: ddd-resultados-ligeros
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Regenerar y empujar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          python herramientas/resultados_ligeros.py
          python herramientas/resultados_partidos.py
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          git add -A datos/resultados
          if git diff --cached --quiet; then echo "Sin cambios en resultados."; exit 0; fi
          git commit -m "datos: resultados ligeros desde canonical_m08"
          for intento in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rechazado (intento $intento)"
            git pull --rebase origin main
          done
          exit 1

      - name: Señal visible si el escritor falla (no pone main en rojo)
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=Escritor de main fallido::Resultados ligeros falló en este push; el run sigue en verde por continue-on-error. Revisa el log del job."
          { echo "### ❌ Resultados ligeros falló"; echo; echo "Push \`$GITHUB_SHA\` · el job tiene continue-on-error para no teñir de rojo la batería; el fallo es real."; } >> "$GITHUB_STEP_SUMMARY"

  numeracion:
    name: Numerar el registro de cambios
    needs: cambios
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.cambios.result != 'success' || needs.cambios.outputs.numeracion == 'true') }}
    continue-on-error: true
    concurrency:
      group: ddd-registro-numeracion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Numerar entradas pendientes y empujar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python herramientas/numerar_registro.py | tee .ddd-numeracion.txt
            if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard legacy/docs)" ]]; then
              echo "Sin entradas pendientes."; exit 0
            fi
            python herramientas/comprobar_guardian_main.py registro
            git add docs/REGISTRO_DE_CAMBIOS.md legacy/docs
            git commit -q -m "registro: numerar $(grep -c '^[0-9]' .ddd-numeracion.txt) entrada(s) de docs/registro"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rechazado (intento $intento); main avanzó, se renumera."
            sleep $((intento * 5))
          done
          echo "::error::No se pudo empujar la numeración tras 5 intentos."; exit 1

      - name: Señal visible si el escritor falla (no pone main en rojo)
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=Escritor de main fallido::Numeración del registro falló en este push; el run sigue en verde por continue-on-error. Revisa el log del job."
          { echo "### ❌ Numeración del registro falló"; echo; echo "Push \`$GITHUB_SHA\` · el job tiene continue-on-error para no teñir de rojo la batería; el fallo es real."; } >> "$GITHUB_STEP_SUMMARY"

  estado_vivo:
    name: Estado vivo
    needs: cambios
    if: ${{ !cancelled() && github.event_name == 'push' && needs.cambios.outputs.robot == 'true' }}
    continue-on-error: true
    concurrency:
      group: ddd-estado-vivo
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      # Módulos que leen el estado vivo que escriben los robots (catálogo, INDEX, orchestracion/, evidencias, composición, status).
      MODULOS: >-
        tests.test_dashboard_pages tests.test_t113_gestor_historico tests.test_ejecucion_completa
        tests.test_continuar_ultimo_resultado_valido tests.test_estado_operativo_unico tests.test_legislatura_vigente
        tests.test_gestor_campana_nacional tests.test_datos_abiertos tests.test_catalogo_procedencia tests.test_t249_par_linaje
        tests.test_00_manifest_scope tests.test_00_reuse_real_regressions tests.test_acreditacion_historica_territorial
        tests.test_m06_durable_manifest tests.test_metricas_proceso tests.test_resolver_cadena_publicacion
        tests.test_publicacion_multiterritorio tests.test_t201_vigente_por_eleccion tests.test_t199_eleccion_registro_fecha
        tests.test_t126_registro_sin_mapa_350 tests.test_registro_escenarios tests.test_design_a_catalogo
        tests.test_promocion_automatica_catalogo
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Instalar dependencias (requirements.lock, sin GerryChain ni Docker)
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Probar el estado vivo tras el commit del robot
        shell: bash
        env:
          DDD_SKIP_LEGACY_CHECK: '1'
        run: |
          set -o pipefail
          inicio=$(date +%s)
          # shellcheck disable=SC2086
          timeout 540 python -m unittest $MODULOS 2>&1 | tee ci-estado-vivo.log
          rc=${PIPESTATUS[0]}
          echo "Duración de la batería de estado vivo: $(( $(date +%s) - inicio )) s (rc=$rc)."
          exit "$rc"
      - name: Señal visible si el estado vivo falla (no bloquea main)
        if: ${{ failure() }}
        shell: bash
        run: |
          sospechoso="$(git log -1 --format='%h · %an · %s' "$GITHUB_SHA")"
          echo "::error title=Estado vivo en rojo::El commit de robot ${sospechoso} deja el estado vivo incoherente con los tests. No bloquea main (continue-on-error); la siguiente PR heredará el rojo."
          {
            echo "### ❌ Estado vivo en rojo"
            echo
            echo "Commit sospechoso: \`${sospechoso}\` (actor \`$GITHUB_ACTOR\`)."
            echo
            echo "Tests fallidos:"
            echo
            echo '```'
            fallidos="$(grep -sE '^(FAIL|ERROR): ' ci-estado-vivo.log | sort -u | head -50)"
            echo "${fallidos:-(sin líneas FAIL/ERROR: timeout o fallo de instalación; revisa el log)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  aviso_nocturna:
    needs: pruebas
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '23 2 * * *' && needs.pruebas.result != 'success' }}
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Abrir aviso si la batería nocturna de main falla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          titulo="Batería nocturna de main en rojo"
          abierto="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number // empty')"
          cuerpo="La batería completa nocturna sobre main (${GITHUB_SHA}) no terminó en verde: ${RUN_URL}. «main en verde» no se cumple hasta que una batería completa sobre main termine en success."
          if [[ -n "$abierto" ]]; then gh issue comment "$abierto" --repo "$GITHUB_REPOSITORY" --body "$cuerpo"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo"; fi

  forense_comprobar:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'P00 Campaña' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      listo: ${{ steps.c.outputs.listo }}
    steps:
      - id: c
        shell: bash
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TOKEN:-}" ]]; then echo "::notice::Sin CLAUDE_CODE_OAUTH_TOKEN: forense omitido."; echo "listo=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "listo=true" >> "$GITHUB_OUTPUT"

  diagnosticar:
    needs: forense_comprobar
    if: needs.forense_comprobar.outputs.listo == 'true'
    concurrency:
      group: ddd-forense-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      diagnostico: ${{ steps.forense.outputs.structured_output }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - id: forense
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Actúa como el subagente definido en .claude/agents/forense.md (léelo primero, con su memoria
            .claude/agent-memory/forense/MEMORY.md) y diagnostica el run ${{ github.event.workflow_run.id }}
            de ${{ github.repository }} («00 Ejecución Completa del Proyecto», conclusión failure).
            Fuentes: `gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs`,
            `gh api repos/${{ github.repository }}/check-runs/<job_id>/annotations` y, si existe, la rama
            diagnostico/auto/ (`git fetch origin 'refs/heads/diagnostico/auto/*:refs/remotes/origin/diagnostico/auto/*'`).
            Solo lectura: no lances, relances, publiques ni descargues artefactos. Devuelve el JSON de la definición
            con "caso" = "${{ github.event.workflow_run.id }}" y como mucho cinco líneas.
          claude_args: |
            --model sonnet
            --max-turns 25
            --allowedTools Read,Grep,Glob,Bash(gh api:*),Bash(gh run view:*),Bash(git fetch:*),Bash(git show:*),Bash(git log:*)
            --json-schema '{"type":"object","properties":{"caso":{"type":"string"},"causa_id":{"type":"string"},"lineas":{"type":"array","items":{"type":"string"},"maxItems":5},"veredicto":{"type":"string"},"acciones":{"type":"array","items":{"type":"string"}},"confianza":{"type":"string"}},"required":["caso","causa_id","lineas"]}'

  forense_issue:
    needs: diagnosticar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir issue con la causa
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTICO: ${{ needs.diagnosticar.outputs.diagnostico }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DIAGNOSTICO" | jq -e . > diagnostico.json || { echo "::error::El forense no devolvió JSON."; exit 1; }
          causa="$(jq -r .causa_id diagnostico.json)"
          titulo="Forense 00 · run $RUN_ID · $causa"
          ya="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" -q ".[] | select(.title | startswith(\"Forense 00 · run $RUN_ID \")) | .number" | head -1)"
          if [[ -n "$ya" ]]; then echo "Ya existe el issue #$ya para el run $RUN_ID."; exit 0; fi
          {
            echo "Run [$RUN_ID]($RUN_URL) · SHA \`${RUN_SHA:0:10}\` · causa \`$causa\` · confianza $(jq -r '.confianza // "—"' diagnostico.json)"
            echo
            jq -r '.lineas[:5][] | "1. \(.)"' diagnostico.json
            echo
            echo "Forense automático (Sonnet, solo lectura; \`.claude/agents/forense.md\`). No relanza nada: la siguiente"
            echo "acción la decide el planificador y la ejecuta el operador con permiso del propietario."
          } > cuerpo.md
          cat cuerpo.md >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$titulo" -F body=@cuerpo.md -q .html_url

  metricas:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1' }}
    concurrency:
      group: ddd-metricas-proceso
      cancel-in-progress: false
      queue: max
