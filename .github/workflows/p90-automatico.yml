          retention-days: 1

  pruebas:
    concurrency:
      group: ${{ github.event_name == 'push' && needs.cambios.outputs.robot != 'true' && 'ddd-main-pruebas' || github.event_name == 'pull_request' && format('ddd-pr-{0}-pruebas', github.event.pull_request.number) || format('ddd-run-{0}-pruebas', github.run_id) }}
      cancel-in-progress: true
    needs: [guardian, suite, cambios, contratos, docs, productos, web]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Agregar resultado (check obligatorio del ruleset)
        shell: bash
        env:
          GUARDIAN: ${{ needs.guardian.result }}
          SUITE: ${{ needs.suite.result }}
          CAMBIOS: ${{ needs.cambios.result }}
          ROBOT: ${{ needs.cambios.outputs.robot }}
          ES_WEB: ${{ needs.cambios.outputs.web }}
          WEB: ${{ needs.web.result }}
          CONTRATOS: ${{ needs.contratos.result }}
          DOCS: ${{ needs.docs.result }}
          PRODUCTOS: ${{ needs.productos.result }}
        run: |
          echo "guardian=$GUARDIAN suite=$SUITE contratos=$CONTRATOS docs=$DOCS productos=$PRODUCTOS"
          if [[ "$GUARDIAN" != "success" || "$CAMBIOS" != "success" ]]; then
            echo "::error::pruebas en rojo: guardian=$GUARDIAN, cambios=$CAMBIOS."; exit 1
          fi
          # La suite es obligatoria salvo en un push de robot que solo toca datos/registro (lo cubre la batería nocturna).
          # ...o en una PR que solo toca la web (T-430 3b): entonces el job `web` tiene que estar en verde.
          if [[ "$ES_WEB" == "true" && "$WEB" != "success" ]]; then
            echo "::error::pruebas en rojo: PR solo de la web y web=$WEB."; exit 1
          fi
          if [[ "$SUITE" != "success" && ! ( "$SUITE" == "skipped" && "$ROBOT" == "true" ) && ! ( "$SUITE" == "skipped" && "$ES_WEB" == "true" && "$WEB" == "success" ) ]]; then
            echo "::error::pruebas en rojo: suite=$SUITE (robot=$ROBOT, web=$ES_WEB/$WEB)."; exit 1
          fi
          for puerta in "contratos=$CONTRATOS" "docs=$DOCS" "productos=$PRODUCTOS"; do
            if [[ "${puerta#*=}" != "success" && "${puerta#*=}" != "skipped" ]]; then
              echo "::error::pruebas en rojo: puerta ${puerta}."; exit 1
            fi
          done
          echo "pruebas en verde."

  web:
    # T-430 3b (D-194, P6): pruebas de la web para una PR que solo toca la web; la batería completa no corre (ver `cambios`).
    needs: cambios
    if: ${{ needs.cambios.outputs.web == 'true' }}
    concurrency:
      group: ${{ format('ddd-pr-{0}-web', github.event.pull_request.number) }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.13'
      - name: Pruebas de la web
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "$(grep -E '^PyYAML==' requirements.lock)"
          # Todos los test_visor_v4* (un test nuevo de la web entra solo) y los demás tests de la batería que leen visor/v4/ o recorren visor/
          # (grep de «visor/v4» y «visor/» en tests/, 23-11; lista en el registro). Más tests que lean la web: añadirlos aquí.
          python -m unittest discover -s tests -t . -p 'test_visor_v4*.py'
          python -m unittest tests.test_t428_v4_raiz tests.test_t429_textos_v4 tests.test_t419_publicar_doble_vuelta tests.test_visor_analitica \
            tests.test_visor_sin_terceros tests.test_t220_renombrado tests.test_t430_pruebas_web tests.test_t430_web_fusion

  catalogo:
    name: Regenerar catálogo de procedencia
    needs: cambios
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.cambios.result != 'success' || needs.cambios.outputs.catalogo == 'true') }}
    continue-on-error: true
    concurrency:
      group: ddd-catalogo-procedencia
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    environment: registro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Regenerar y empujar
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          for intento in 1 2 3; do
            python herramientas/catalogo_procedencia.py --informe
            git add orchestracion/catalogo_procedencia.json
            if git diff --cached --quiet; then echo "Catálogo al día."; exit 0; fi
            git commit -m "chore(procedencia): catálogo de procedencia regenerado"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rechazado (intento $intento)"
            git reset --hard -q origin/main
            git pull -q origin main
          done
          exit 1

      - name: Señal visible si el escritor falla (no pone main en rojo)
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=Escritor de main fallido::Catálogo de procedencia falló en este push; el run sigue en verde por continue-on-error. Revisa el log del job."
          { echo "### ❌ Catálogo de procedencia falló"; echo; echo "Push \`$GITHUB_SHA\` · el job tiene continue-on-error para no teñir de rojo la batería; el fallo es real."; } >> "$GITHUB_STEP_SUMMARY"

  resultados:
    name: Regenerar resultados ligeros
    needs: cambios
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.cambios.result != 'success' || needs.cambios.outputs.resultados == 'true') }}
    continue-on-error: true
    concurrency:
      group: ddd-resultados-ligeros
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    environment: registro
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Regenerar y empujar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          python herramientas/resultados_ligeros.py
          python herramientas/resultados_partidos.py
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          git add -A datos/resultados
          if git diff --cached --quiet; then echo "Sin cambios en resultados."; exit 0; fi
          git commit -m "datos: resultados ligeros desde canonical_m08"
          for intento in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rechazado (intento $intento)"
            git pull --rebase origin main
          done
          exit 1

      - name: Señal visible si el escritor falla (no pone main en rojo)
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=Escritor de main fallido::Resultados ligeros falló en este push; el run sigue en verde por continue-on-error. Revisa el log del job."
          { echo "### ❌ Resultados ligeros falló"; echo; echo "Push \`$GITHUB_SHA\` · el job tiene continue-on-error para no teñir de rojo la batería; el fallo es real."; } >> "$GITHUB_STEP_SUMMARY"

  numeracion:
    name: Numerar el registro de cambios
    needs: cambios
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.cambios.result != 'success' || needs.cambios.outputs.numeracion == 'true') }}
    continue-on-error: true
    concurrency:
      group: ddd-registro-numeracion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    environment: registro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Numerar entradas pendientes y empujar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python herramientas/numerar_registro.py | tee .ddd-numeracion.txt
            if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard legacy/docs)" ]]; then
              echo "Sin entradas pendientes."; exit 0
            fi
            python herramientas/comprobar_guardian_main.py registro
            git add docs/REGISTRO_DE_CAMBIOS.md legacy/docs
            git commit -q -m "registro: numerar $(grep -c '^[0-9]' .ddd-numeracion.txt) entrada(s) de docs/registro"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rechazado (intento $intento); main avanzó, se renumera."
            sleep $((intento * 5))
          done
          echo "::error::No se pudo empujar la numeración tras 5 intentos."; exit 1

      - name: Señal visible si el escritor falla (no pone main en rojo)
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=Escritor de main fallido::Numeración del registro falló en este push; el run sigue en verde por continue-on-error. Revisa el log del job."
