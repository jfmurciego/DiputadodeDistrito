# PROYECTO: Diputado de Distrito
# CLASE: interfaz humana de publicación
# VERSIÓN: 3.0.0
# NOMBRE: Publicación manual desacoplada del cálculo territorial
# ESTADO: activo
# QUÉ HACE: promueve explícitamente páginas web y después despliega Pages. Nunca calcula distritos.
name: 05 · Publicación del Visor

on:
  workflow_call:
    inputs:
      pagina_publicar: {required: false, type: string, default: Sitio completo}
      production_run_id: {required: false, type: string, default: ''}
      estado_sincronizado: {required: false, type: boolean, default: false}
  workflow_dispatch:
    inputs:
      pagina_publicar:
        description: Página a publicar
        required: true
        default: Dashboard operativo
        type: choice
        options:
          - Dashboard operativo
          - Visor territorial
          - Sitio completo

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  preparar_publicacion:
    name: Preparar promoción web
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      production_run_id: ${{ steps.resolve.outputs.production_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ github.token }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        name: Generar estado y promover sólo si se solicita
        shell: bash
        env:
          TARGET_PAGE: ${{ inputs.pagina_publicar }}
          PRODUCTION_RUN_ID_OVERRIDE: ${{ inputs.production_run_id }}
          ESTADO_SINCRONIZADO: ${{ inputs.estado_sincronizado || false }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-publication publicado/dashboard
          if [[ "$ESTADO_SINCRONIZADO" != "true" ]]; then
            cp dashboard/index.html dashboard/app.js dashboard/styles.css publicado/dashboard/
            python -m herramientas.actualizar_estado_operativo \
              --root-dir . \
              --canonical publicado/estado_operativo.json \
              --dashboard publicado/dashboard/status.json \
              --readme README.md
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add README.md publicado/estado_operativo.json publicado/dashboard
            if ! git diff --cached --quiet; then
              git commit -m "chore: sincronizar estado operativo para publicación"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          test -s publicado/estado_operativo.json
          test -s publicado/dashboard/status.json
          cp publicado/dashboard/status.json .ddd-publication/status.json
          production_run_id="$PRODUCTION_RUN_ID_OVERRIDE"
          if [[ -z "$production_run_id" ]]; then
            production_run_id="$(jq -r '.latest_validated.run_id // empty' .ddd-publication/status.json)"
          fi
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "production_run_id=$production_run_id" >> "$GITHUB_OUTPUT"

  publicar:
    name: Desplegar página seleccionada
    needs: preparar_publicacion
    uses: ./.github/workflows/_reutilizable-publicar-sitio.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.preparar_publicacion.outputs.source_ref }}
      production_run_id: ${{ needs.preparar_publicacion.outputs.production_run_id }}
      ensemble_release_tag: ''
      target_page: ${{ inputs.pagina_publicar }}
