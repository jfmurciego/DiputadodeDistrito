# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 2.1.0
# NOMBRE: Desplegar visor técnico con evidencia de publicación
# ESTADO: activo
# QUÉ HACE: publica el visor con productos históricos y, opcionalmente, un run M06/M08 y un ensemble completo; deja evidencia estructurada de la publicación.
# CAMBIOS: publica ddd-publication con estado, URL y mapas/resultados generados para el informe de ejecución.
# ANTERIOR: versión 2.0.0 en historial Git.
name: Desplegar visor técnico

on:
  workflow_call:
    inputs:
      production_run_id:
        required: false
        type: string
      ensemble_release_tag:
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
      ENSEMBLE_RELEASE_TAG: ${{ inputs.ensemble_release_tag }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - name: Preparar dependencia de reproyección
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyproj
      - name: Validar visor y preparador
        shell: bash
        run: |
          set -euo pipefail
          node --check visor/app.js
          python -m py_compile herramientas/preparar_visor_ejecucion.py
          python herramientas/preparar_visor_ejecucion.py --help >/dev/null
      - name: Recuperar run territorial solicitado
        if: ${{ inputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production
          if ! gh run download "$PRODUCTION_RUN_ID" --pattern 'ddd-*' --dir /tmp/production; then
            echo "::warning::El run todavía no ofrece artefactos DDD descargables; se publicará el registro estático."
          fi
      - name: Recuperar ensemble solicitado
        if: ${{ inputs.ensemble_release_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ensemble/download /tmp/ensemble/unpacked
          gh release download "$ENSEMBLE_RELEASE_TAG" --pattern "$ENSEMBLE_RELEASE_TAG.zip" --dir /tmp/ensemble/download
          archive="$(find /tmp/ensemble/download -name '*.zip' -print -quit)"
          test -n "$archive"
          unzip -q "$archive" -d /tmp/ensemble/unpacked
      - name: Empaquetar visor de ejecución
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp visor/index.html visor/app.js visor/styles.css site/
          args=(--site site --static-registry orchestracion/productos_publicos.json)
          if [[ -n "$PRODUCTION_RUN_ID" ]] && find /tmp/production -type f -print -quit 2>/dev/null | grep -q .; then
            args+=(--production-root /tmp/production --production-run-id "$PRODUCTION_RUN_ID")
            audit="docs/SALIDAS_CHATGPT/EVIDENCIAS/aragon_m06_contiguedad_geometrica_run_${PRODUCTION_RUN_ID}.json"
            [[ -f "$audit" ]] && args+=(--production-audit "$audit")
          fi
          [[ -n "$ENSEMBLE_RELEASE_TAG" ]] && args+=(--ensemble-root /tmp/ensemble/unpacked)
          python herramientas/preparar_visor_ejecucion.py "${args[@]}"
          python - <<'PY'
          import json
          p=json.load(open('site/data/viewer-results.json',encoding='utf-8'))
          print('[VISOR] opciones:', len(p['results']))
          for item in p['results']:
              print(' -', item['label'], '|', item.get('geometric_status'))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Registrar evidencia de publicación
        if: always()
        shell: bash
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-publication
          python - <<'PY'
          import json, os
          from pathlib import Path
          site = Path("site")
          registry = site / "data/viewer-results.json"
          results = []
          if registry.is_file():
              try:
                  data = json.loads(registry.read_text(encoding="utf-8"))
                  results = data.get("results") or []
              except Exception:
                  results = []
          maps = sorted(
              p.relative_to(site).as_posix()
              for p in site.rglob("*")
              if p.is_file() and p.suffix.lower() in {".json", ".geojson", ".zip"}
          ) if site.is_dir() else []
          outcome = os.environ.get("DEPLOYMENT_OUTCOME") or "unknown"
          payload = {
              "schema": "ddd-publication-evidence/1.0",
              "status": "SUCCESS" if outcome == "success" else "BLOCK",
              "deployment_outcome": outcome,
              "viewer_url": os.environ.get("PAGE_URL") or None,
              "result_count": len(results),
              "maps_generated": maps,
              "source": "workflow_evidence",
          }
          Path(".ddd-publication/publicacion_visor.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Publicar evidencia del visor
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-publication-${{ github.run_id }}
          path: .ddd-publication/publicacion_visor.json
          if-no-files-found: error
          retention-days: 30
