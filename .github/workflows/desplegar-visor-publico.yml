# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.4.1
# NOMBRE: Desplegar visor técnico de ejecuciones y alternativas
# ESTADO: activo
# QUÉ HACE: publica el visor con productos históricos y, opcionalmente, un run M06/M08 y un ensemble completo.
# CAMBIOS: limita la descarga de runs territoriales a artefactos ddd-* para excluir registros .dockerbuild ajenos al producto.
# ANTERIOR: legacy/workflows/desplegar-visor-publico_v1.2.0.yml
name: Desplegar visor técnico

on:
  workflow_call:
    inputs:
      production_run_id:
        required: false
        type: string
      ensemble_release_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Run de producción M06/M08 que se quiere ver (opcional)
        required: false
        type: string
      ensemble_release_tag:
        description: Tag del ensemble que se quiere añadir al combo (opcional)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
      ENSEMBLE_RELEASE_TAG: ${{ inputs.ensemble_release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Validar visor y preparador
        shell: bash
        run: |
          set -euo pipefail
          node --check visor/app.js
          python -m py_compile herramientas/preparar_visor_ejecucion.py
      - name: Recuperar run territorial solicitado
        if: ${{ inputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production
          if ! gh run download "$PRODUCTION_RUN_ID" --pattern 'ddd-*' --dir /tmp/production; then
            echo "::warning::El run todavía no ofrece artefactos DDD descargables; se publicará el registro estático."
          fi
      - name: Recuperar ensemble solicitado
        if: ${{ inputs.ensemble_release_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ensemble/download /tmp/ensemble/unpacked
          gh release download "$ENSEMBLE_RELEASE_TAG" --pattern "$ENSEMBLE_RELEASE_TAG.zip" --dir /tmp/ensemble/download
          archive="$(find /tmp/ensemble/download -name '*.zip' -print -quit)"
          test -n "$archive"
          unzip -q "$archive" -d /tmp/ensemble/unpacked
      - name: Empaquetar visor de ejecución
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp visor/index.html visor/app.js visor/styles.css site/
          args=(--site site --static-registry orchestracion/productos_publicos.json)
          if [[ -n "$PRODUCTION_RUN_ID" ]] && find /tmp/production -type f -print -quit 2>/dev/null | grep -q .; then
            args+=(--production-root /tmp/production --production-run-id "$PRODUCTION_RUN_ID")
            audit="docs/SALIDAS_CHATGPT/EVIDENCIAS/aragon_m06_contiguedad_geometrica_run_${PRODUCTION_RUN_ID}.json"
            [[ -f "$audit" ]] && args+=(--production-audit "$audit")
          fi
          [[ -n "$ENSEMBLE_RELEASE_TAG" ]] && args+=(--ensemble-root /tmp/ensemble/unpacked)
          python herramientas/preparar_visor_ejecucion.py "${args[@]}"
          python - <<'PY'
          import json
          p=json.load(open('site/data/viewer-results.json',encoding='utf-8'))
          print('[VISOR] opciones:', len(p['results']))
          for item in p['results']:
              print(' -', item['label'], '|', item.get('geometric_status'))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
