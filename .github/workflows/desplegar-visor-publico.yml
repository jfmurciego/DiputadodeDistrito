# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.3.0
# NOMBRE: Desplegar visor técnico unificado MapLibre
# ESTADO: activo
# QUÉ HACE: publica los productos declarativos vigentes y sus metadatos desde GeoJSON canónicos.
# CAMBIOS: empaquetado guiado por registro; soporta metadatos de ejecución y deja el visor listo para catálogo de ensembles.
# ANTERIOR: legacy/workflows/desplegar-visor-publico_v1.2.0.yml
name: Desplegar visor público

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validar visor y contrato de publicación
        shell: bash
        run: |
          set -euo pipefail
          node --check visor/app.js
          python herramientas/g10_public_product_manifest.py --registry orchestracion/productos_publicos.json --output /tmp/public-products.json
      - name: Empaquetar lectura pública
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/data
          cp visor/index.html visor/app.js visor/styles.css site/
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          site=Path('site')
          registry=json.load(open('orchestracion/productos_publicos.json',encoding='utf-8'))
          for product in registry['products']:
              src=Path(product['source_path'])
              if not src.is_file():
                  raise SystemExit(f'Falta producto declarado: {src}')
              dst=site/product['viewer_path']
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              for extra in ('metadata.json','contiguedad_geometrica.json'):
                  candidate=src.parent/extra
                  if candidate.is_file():
                      shutil.copy2(candidate,dst.parent/extra)
          PY
          python herramientas/g10_public_product_manifest.py --registry orchestracion/productos_publicos.json --output site/data/public-products.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
