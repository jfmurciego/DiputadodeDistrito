# PROYECTO: Diputado de Distrito
# CLASE: interfaz de negocio — Diseño A
# VERSIÓN: 1.3.0
# NOMBRE DE VERSIÓN: Preparación durable de datos territoriales
# FECHA: 2026-09-19
# ESTADO: candidato
# CAMBIOS: separa la preparación territorial de la preparación electoral; este workflow sólo prepara secciones y población.
# MOTIVO: impedir que la ausencia de resultados electorales bloquee la preparación de datos territoriales.
name: Preparación de Datos Territoriales

on:
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        type: choice
        options:
          - Andalucía
          - Aragón
          - Principado de Asturias
          - Islas Baleares
          - Canarias
          - Cantabria
          - Castilla-La Mancha
          - Castilla y León
          - Cataluña
          - Comunidad Valenciana
          - Extremadura
          - Galicia
          - Comunidad de Madrid
          - Región de Murcia
          - Comunidad Foral de Navarra
          - País Vasco
          - La Rioja
          - Ceuta
          - Melilla
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options: ['2025']
      reutilizar_si_ya_preparada:
        description: Reutilizar fuente oficial ya preparada
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  resolver:
    name: Resolver preparación desde catálogo
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env:
          TERRITORY: ${{ inputs.territory_id }}
          EDITION: ${{ inputs.data_edition }}
        run: |
          set -euo pipefail
          python herramientas/catalogo_preparacion.py --root-dir . validate
          python herramientas/resolver_fuentes_territorio.py declaration --territory "$TERRITORY" --edition "$EDITION" >/dev/null
          row="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY" --edition "$EDITION")"
          echo "territory_id=$(jq -r .territory_id <<<"$row")" >> "$GITHUB_OUTPUT"

  territoriales:
    name: Preparar fuentes territoriales
    needs: resolver
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ inputs.territory_id }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ inputs.data_edition }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
      EVIDENCE_DIR: .ddd-sources
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Instalar dependencias de resolución territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Generar declaración territorial desde fuentes oficiales
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration \
            --territory "$TERRITORY" \
            --edition "$EDITION" \
            --output "$SOURCE_DECLARATION"
          test -s "$SOURCE_DECLARATION"
      - id: previous
        name: Recuperar fuente territorial ya preparada
        if: ${{ inputs.reutilizar_si_ya_preparada }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="ddd-source-package-$TERRITORY_ID-$EDITION-"
          mapfile -t runs < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100" --jq '.workflow_runs|sort_by(.created_at)|reverse|.[].id')
          for rid in "${runs[@]}"; do
            arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts?per_page=100")"
            mapfile -t names < <(jq -r --arg p "$prefix" '.artifacts[]|select((.name|startswith($p)) and (.expired|not))|.name' <<<"$arts")
            for name in "${names[@]}"; do
              rm -rf .ddd-source-candidate
              if ! gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "$name" --dir .ddd-source-candidate >/dev/null 2>&1; then
                continue
              fi
              if python -m herramientas.seleccionar_paquete_fuentes \
                --package .ddd-source-candidate \
                --territory-id "$TERRITORY_ID" \
                --edition "$EDITION"; then
                rm -rf .ddd-source-package
                mv .ddd-source-candidate .ddd-source-package
                echo "run_id=$rid" >> "$GITHUB_OUTPUT"
                echo "artifact_name=$name" >> "$GITHUB_OUTPUT"
                echo "reused_candidate=true" >> "$GITHUB_OUTPUT"
                break 2
              fi
              echo "::warning::Paquete territorial inválido: $name (run $rid); se busca uno anterior."
              rm -rf .ddd-source-candidate
            done
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ddd-source-preparation:${{ github.sha }}
          cache-from: type=gha,scope=ddd-source-preparation-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-source-preparation-${{ github.sha }}
      - id: mode
        run: |
          mode="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA} - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          from pathlib import Path
          d=yaml.safe_load((Path('/app')/sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or '')
          PY
          )"
          case "$mode" in official_live|verified_snapshot) ;; *) echo "::error::Modo productivo inválido: $mode"; exit 40;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.mode.outputs.mode == 'verified_snapshot' }}
        run: bash inputs/partes/reconstruir_fuentes.sh
      - name: Adquirir y congelar fuentes
        run: |
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA}             -m herramientas.ejecutar_fuentes_workflow             --declaration "/app/$SOURCE_DECLARATION" --working /app/.ddd-source-package             --checkpoint-out /app/.ddd-source-checkpoint --acquisition-evidence "/app/$EVIDENCE_DIR"             --environment production --acquisition-mode '${{ steps.mode.outputs.mode }}' --root-dir /app
      - id: upload
        uses: actions/upload-artifact@v6
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}
          path: .ddd-source-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Promover catálogo territorial
        shell: bash
        env:
          ARTIFACT_NAME: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Trabaja siempre sobre la punta actual de la misma rama para no publicar
          # un catálogo calculado sobre un commit obsoleto.
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

          python -m pip install --disable-pip-version-check PyYAML==6.0.2 >/dev/null
          python herramientas/promover_catalogo_tras_preparacion.py             --root-dir .             --territory-id "$TERRITORY_ID"             --edition "$EDITION"             --package .ddd-source-package             --source-declaration "$SOURCE_DECLARATION"             --run-id "$GITHUB_RUN_ID"             --artifact-name "$ARTIFACT_NAME"             --artifact-sha256 "$ARTIFACT_SHA256"             > .ddd-catalog-promotion.json

          python herramientas/catalogo_preparacion.py --root-dir . validate

          if git diff --quiet; then
            echo "El catálogo ya reflejaba este estado; no hay commit que publicar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             configuracion/catalogo_preparacion.yaml             configuracion/catalogo_territorios_espana_2025.yaml             "territorios/$TERRITORY_ID/config"             herramientas/promover_catalogo_tras_preparacion.py
          git commit -m "chore: promover $TERRITORY_ID tras preparación territorial"
          git push origin "HEAD:$TARGET_BRANCH"

