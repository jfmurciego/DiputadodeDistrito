# PROYECTO: Diputado de Distrito
# CLASE: interfaz de negocio — Diseño A
# VERSIÓN: 1.1.0
# NOMBRE DE VERSIÓN: Preparación durable territorial y electoral
# FECHA: 2026-09-18
# ESTADO: candidato
# CAMBIOS: separa preparación de producción y añade REUSE/ACQUIRE/BLOCK electoral con paquete congelado.
# MOTIVO: preparar fuentes una vez y reutilizarlas con procedencia y checksum verificables.
name: Preparación de fuentes oficiales

on:
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        type: choice
        options:
          - Aragón
          - Castilla y León
          - Extremadura
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options: ['2025']
      source_scope:
        description: Fuentes a preparar
        required: true
        default: Ambas
        type: choice
        options: [Territoriales, Electorales, Ambas]
      confirmar_preparacion:
        description: Confirmar preparación
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  resolver:
    name: Resolver preparación desde catálogo
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      contract_path: ${{ steps.resolve.outputs.contract_path }}
      source_declaration: ${{ steps.resolve.outputs.source_declaration }}
      electoral_declaration: ${{ steps.resolve.outputs.electoral_declaration }}
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env:
          TERRITORY: ${{ inputs.territory_id }}
          EDITION: ${{ inputs.data_edition }}
          CONFIRM: ${{ inputs.confirmar_preparacion }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == true ]] || { echo "::error::La preparación requiere confirmación explícita."; exit 20; }
          python herramientas/catalogo_preparacion.py validate --root-dir .
          row="$(python herramientas/catalogo_preparacion.py resolve --mode preparation --territory "$TERRITORY" --edition "$EDITION")"
          echo "territory_id=$(jq -r .territory_id <<<"$row")" >> "$GITHUB_OUTPUT"
          echo "contract_path=$(jq -r '.contract_path // empty' <<<"$row")" >> "$GITHUB_OUTPUT"
          echo "source_declaration=$(jq -r '.territorial_source_declaration // empty' <<<"$row")" >> "$GITHUB_OUTPUT"
          echo "electoral_declaration=$(jq -r '.electoral_source_declaration // empty' <<<"$row")" >> "$GITHUB_OUTPUT"

  territoriales:
    name: Preparar fuentes territoriales
    needs: resolver
    if: ${{ inputs.source_scope != 'Electorales' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_DECLARATION: ${{ needs.resolver.outputs.source_declaration }}
      EVIDENCE_DIR: .ddd-sources
    steps:
      - uses: actions/checkout@v6
      - name: Validar preparación inicial independiente del contrato final
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_DECLARATION" && -f "$SOURCE_DECLARATION" ]] || { echo "::error::Territorio pendiente de incorporación: falta declaración de fuentes territoriales."; exit 40; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ddd-source-preparation:${{ github.sha }}
          cache-from: type=gha,scope=ddd-source-preparation-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-source-preparation-${{ github.sha }}
      - id: mode
        run: |
          mode="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA} - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          from pathlib import Path
          d=yaml.safe_load((Path('/app')/sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or '')
          PY
          )"
          case "$mode" in official_live|verified_snapshot) ;; *) echo "::error::Modo productivo inválido: $mode"; exit 40;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.mode.outputs.mode == 'verified_snapshot' }}
        run: bash inputs/partes/reconstruir_fuentes.sh
      - name: Adquirir y congelar fuentes
        run: |
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA}             /app/herramientas/ejecutar_fuentes_workflow.py             --declaration "/app/$SOURCE_DECLARATION" --working /app/.ddd-source-package             --checkpoint-out /app/.ddd-source-checkpoint --acquisition-evidence "/app/$EVIDENCE_DIR"             --environment production --acquisition-mode '${{ steps.mode.outputs.mode }}' --root-dir /app
      - uses: actions/upload-artifact@v6
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}
          path: .ddd-source-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  electorales:
    name: Preparar fuente electoral durable
    needs: resolver
    if: ${{ inputs.source_scope != 'Territoriales' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ inputs.data_edition }}
      PARAMS: ${{ needs.resolver.outputs.contract_path }}
      DECLARATION: ${{ needs.resolver.outputs.electoral_declaration }}
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Recuperar último paquete electoral congelado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ddd-electoral-previous
          prefix="ddd-electoral-package-$TERRITORY_ID-$EDITION-"
          mapfile -t runs < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100" --jq '.workflow_runs|sort_by(.created_at)|reverse|.[].id')
          for rid in "${runs[@]}"; do
            arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts?per_page=100")"
            name="$(jq -r --arg p "$prefix" '.artifacts[]|select((.name|startswith($p)) and (.expired|not))|.name' <<<"$arts" | head -1)"
            [[ -n "$name" ]] || continue
            gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "$name" --dir .ddd-electoral-previous >/dev/null 2>&1 && break
          done
      - id: prepare
        name: Resolver REUSE / ACQUIRE / BLOCK
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(--territory-id "$TERRITORY_ID" --edition "$EDITION" --package-out .ddd-electoral-package --root-dir .)
          [[ -n "$PARAMS" ]] && args+=(--params "$PARAMS")
          [[ -n "$DECLARATION" ]] && args+=(--declaration "$DECLARATION")
          [[ -f .ddd-electoral-previous/manifest.json ]] && args+=(--previous-package .ddd-electoral-previous)
          python herramientas/preparar_fuente_electoral.py "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ddd-electoral-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}
          path: .ddd-electoral-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Aplicar decisión electoral
        if: always()
        run: |
          test -f .ddd-electoral-package/manifest.json
          decision="$(jq -r .decision .ddd-electoral-package/manifest.json)"
          case "$decision" in REUSE|ACQUIRE) ;; *) echo "::error::Preparación electoral BLOQUEADA"; exit 42;; esac
