# PROYECTO: Diputado de Distrito
# CLASE: interfaz de negocio — Diseño A
# VERSIÓN: 1.3.0
# NOMBRE DE VERSIÓN: Preparación durable de datos territoriales
# FECHA: 2026-09-19
# ESTADO: candidato
# CAMBIOS: separa la preparación territorial de la preparación electoral; este workflow sólo prepara secciones y población.
# MOTIVO: impedir que la ausencia de resultados electorales bloquee la preparación de datos territoriales.
name: 01 · Preparación de Datos Territoriales

on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
      data_edition: {required: true, type: string}
      source_year: {required: false, type: string, default: ''}
      population_year: {required: false, type: string, default: ''}
      section_year: {required: false, type: string, default: ''}
      reutilizar_si_ya_preparada: {required: false, type: boolean, default: true}
      source_ref: {required: false, type: string, default: ''}
      persist_state: {required: false, type: boolean, default: true}
      recover_run_id: {required: false, type: string, default: ''}
      recover_artifact_sha256: {required: false, type: string, default: ''}
    outputs:
      territory_id:
        value: ${{ jobs.resolver.outputs.territory_id }}
      edition:
        value: ${{ jobs.resolver.outputs.edition }}
      artifact_name:
        value: ${{ jobs.territoriales.outputs.artifact_name }}
      artifact_digest:
        value: ${{ jobs.territoriales.outputs.artifact_digest }}
      enabled_source_ref:
        value: ${{ jobs.pre_m04.outputs.enabled_source_ref }}
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        type: choice
        options:
          - 01 · Andalucía
          - 02 · Aragón
          - 03 · Principado de Asturias
          - 04 · Islas Baleares
          - 05 · Canarias
          - 06 · Cantabria
          - 07 · Castilla y León
          - 08 · Castilla-La Mancha
          - 09 · Cataluña
          - 10 · Comunidad Valenciana
          - 11 · Extremadura
          - 12 · Galicia
          - 13 · Comunidad de Madrid
          - 14 · Región de Murcia
          - 15 · Comunidad Foral de Navarra
          - 16 · País Vasco
          - 17 · La Rioja
          - 18 · Ceuta
          - 19 · Melilla
concurrency:
  group: ddd-territorial-prod-${{ inputs.territory_id }}-${{ inputs.data_edition || 'vigente' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  resolver:
    name: Resolver preparación desde catálogo
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      edition: ${{ steps.resolve.outputs.edition }}
      reuse_enabled: ${{ steps.resolve.outputs.reuse_enabled }}
      registered_run_id: ${{ steps.resolve.outputs.registered_run_id }}
      registered_artifact_name: ${{ steps.resolve.outputs.registered_artifact_name }}
      registered_artifact_sha256: ${{ steps.resolve.outputs.registered_artifact_sha256 }}
      source_year: ${{ steps.resolve.outputs.source_year }}
      population_year: ${{ steps.resolve.outputs.population_year }}
      section_year: ${{ steps.resolve.outputs.section_year }}
      persist_state: ${{ steps.resolve.outputs.persist_state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TERRITORY: ${{ inputs.territory_id }}
          EDITION_INPUT: ${{ inputs.data_edition || '' }}
          SOURCE_YEAR_INPUT: ${{ inputs.source_year || '' }}
          POPULATION_YEAR_INPUT: ${{ inputs.population_year || '' }}
          SECTION_YEAR_INPUT: ${{ inputs.section_year || '' }}
          REUSE_INPUT: ${{ toJSON(inputs.reutilizar_si_ya_preparada) }}
          PERSIST_INPUT: ${{ toJSON(inputs.persist_state) }}
          RECOVERY_RUN_ID: ${{ inputs.recover_run_id || '' }}
          RECOVERY_SHA256: ${{ inputs.recover_artifact_sha256 || '' }}
        run: |
          set -euo pipefail
          python herramientas/catalogo_preparacion.py --root-dir . validate

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            current="$(python - "$TERRITORY" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("configuracion/preparacion_legislatura_vigente.yaml").read_text(encoding="utf-8")) or {}
          wanted = re.sub(r"^\\s*\\d+\\s*·\\s*", "", sys.argv[1]).strip()
          row = next(
              (
                  item for item in (cfg.get("territories") or [])
                  if str(item.get("name") or "").strip() == wanted
                  or str(item.get("territory_id") or "").strip() == wanted
              ),
              None,
          )
          if not row:
              raise SystemExit(f"Territorio sin contrato vigente: {wanted}")
          territorial = row.get("territorial") or {}
          result = {
              "edition": str(cfg.get("project_edition") or ""),
              "population_year": str(territorial.get("population_current_year") or ""),
              "section_year": str(territorial.get("section_current_year") or ""),
          }
          if not all(result.values()):
              raise SystemExit(f"Contrato vigente incompleto para {wanted}: {result}")
          print(json.dumps(result, ensure_ascii=False))
          PY
          )"
            EDITION="$(jq -r .edition <<<"$current")"
            population_year="$(jq -r .population_year <<<"$current")"
            section_year="$(jq -r .section_year <<<"$current")"
            reuse_enabled=true
            persist_requested=true
            RECOVERY_RUN_ID=""
            RECOVERY_SHA256=""
          else
            EDITION="$EDITION_INPUT"
            legacy_year="$SOURCE_YEAR_INPUT"
            population_year="$POPULATION_YEAR_INPUT"
            section_year="$SECTION_YEAR_INPUT"
            [[ -n "$population_year" ]] || population_year="$legacy_year"
            [[ -n "$section_year" ]] || section_year="$legacy_year"
            reuse_enabled="$REUSE_INPUT"
            persist_requested="$PERSIST_INPUT"
          fi

          [[ -n "$EDITION" ]] || { echo "::error::Edición interna no resuelta."; exit 40; }
          [[ -n "$population_year" && -n "$section_year" ]] || {
            echo "::error::Contrato temporal incompleto: faltan años de población o seccionado."
            exit 40
          }
          persist_json="$(python herramientas/evaluar_persistencia_preparacion.py resolve --requested "$persist_requested")"
          echo "persist_state=$(jq -r '.persist_state|tostring' <<<"$persist_json")" >> "$GITHUB_OUTPUT"
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "reuse_enabled=$reuse_enabled" >> "$GITHUB_OUTPUT"
          [[ "$population_year" =~ ^20[0-9]{2}$ ]] || { echo "::error::Año de población inválido: $population_year"; exit 40; }
          [[ "$section_year" =~ ^20[0-9]{2}$ ]] || { echo "::error::Año de seccionado inválido: $section_year"; exit 40; }
          echo "population_year=$population_year" >> "$GITHUB_OUTPUT"
          echo "section_year=$section_year" >> "$GITHUB_OUTPUT"
          if [[ "$population_year" == "$section_year" ]]; then echo "source_year=$population_year" >> "$GITHUB_OUTPUT"; else echo "source_year=" >> "$GITHUB_OUTPUT"; fi
          python herramientas/resolver_fuentes_territorio.py declaration --territory "$TERRITORY" --edition "$EDITION" --population-year "$population_year" --section-year "$section_year" >/dev/null
          row="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY" --edition "$EDITION")"
          preflight="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY" --edition "$EDITION")"
          echo "territory_id=$(jq -r .territory_id <<<"$row")" >> "$GITHUB_OUTPUT"
          if [[ -n "$RECOVERY_RUN_ID" || -n "$RECOVERY_SHA256" ]]; then
            [[ "$(jq -r '.persist_state|tostring' <<<"$persist_json")" == true ]] || { echo "::error::La recuperación durable exige persist_state=true."; exit 41; }
            [[ "$GITHUB_REF_NAME" == main ]] || { echo "::error::La recuperación durable solo se permite en main."; exit 41; }
            [[ "$reuse_enabled" == true ]] || { echo "::error::La recuperación exige reutilización habilitada."; exit 41; }
            [[ -n "$RECOVERY_RUN_ID" && -n "$RECOVERY_SHA256" ]] || { echo "::error::Recuperación requiere run y SHA-256 juntos."; exit 41; }
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Run de recuperación inválido."; exit 41; }
            RECOVERY_SHA256="${RECOVERY_SHA256#sha256:}"
            [[ "$RECOVERY_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::SHA-256 de recuperación inválido."; exit 41; }
            [[ "$(jq -r '.registered' <<<"$preflight")" == false ]] || { echo "::error::La fuente ya tiene registro durable; se rechaza la recuperación explícita."; exit 41; }
            echo "registered_run_id=$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_name=ddd-source-package-$(jq -r .territory_id <<<"$row")-$EDITION-$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_sha256=${RECOVERY_SHA256,,}" >> "$GITHUB_OUTPUT"
          else
            registered_population_year="$(jq -r '.population_year // .source_year // empty' <<<"$preflight")"
            registered_section_year="$(jq -r '.section_year // .source_year // empty' <<<"$preflight")"
            if [[ "$(jq -r '.registered|tostring' <<<"$preflight")" == true && "$registered_population_year" == "$population_year" && "$registered_section_year" == "$section_year" ]]; then
              echo "registered_run_id=$(jq -r '.run_id // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_name=$(jq -r '.artifact_name // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_sha256=$(jq -r '.artifact_sha256 // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
            else
              echo "registered_run_id=" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_name=" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_sha256=" >> "$GITHUB_OUTPUT"
            fi
          fi

  territoriales:
    name: Preparar fuentes territoriales
    needs: resolver
    runs-on: ubuntu-24.04
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ inputs.territory_id }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ needs.resolver.outputs.edition }}
      POPULATION_YEAR: ${{ needs.resolver.outputs.population_year }}
      SECTION_YEAR: ${{ needs.resolver.outputs.section_year }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
      EVIDENCE_DIR: .ddd-sources
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          token: ${{ github.token }}
      - name: Instalar dependencias de resolución territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Generar declaración territorial desde fuentes oficiales
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration \
            --territory "$TERRITORY" \
            --edition "$EDITION" \
            --population-year "$POPULATION_YEAR" \
            --section-year "$SECTION_YEAR" \
            --output "$SOURCE_DECLARATION"
          test -s "$SOURCE_DECLARATION"
      - id: previous
        name: Recuperar fuente territorial registrada
        if: ${{ needs.resolver.outputs.reuse_enabled == 'true' && needs.resolver.outputs.registered_run_id != '' }}
        shell: bash
        env:
          REGISTERED_RUN_ID: ${{ needs.resolver.outputs.registered_run_id }}
          REGISTERED_ARTIFACT_NAME: ${{ needs.resolver.outputs.registered_artifact_name }}
          REGISTERED_ARTIFACT_SHA256: ${{ needs.resolver.outputs.registered_artifact_sha256 }}
        run: |
          set -euo pipefail
          arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REGISTERED_RUN_ID/artifacts?per_page=100")"
          match="$(jq -c --arg n "$REGISTERED_ARTIFACT_NAME" '[.artifacts[]|select(.name==$n and (.expired|not))] | if length==1 then .[0] else empty end' <<<"$arts")"
          [[ -n "$match" ]] || { echo "::error::Artefacto territorial registrado no disponible: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"; exit 44; }
          actual_digest="$(jq -r '.digest // empty' <<<"$match" | sed 's/^sha256://')"
          [[ "$actual_digest" == "$REGISTERED_ARTIFACT_SHA256" ]] || { echo "::error::Digest de artefacto territorial no coincide con el registro."; exit 45; }
          rm -rf .ddd-source-package
          gh run download "$REGISTERED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$REGISTERED_ARTIFACT_NAME" --dir .ddd-source-package
          python -m herramientas.seleccionar_paquete_fuentes             --package .ddd-source-package             --territory-id "$TERRITORY_ID"             --edition "$EDITION" --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR"
          echo "run_id=$REGISTERED_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$REGISTERED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "reused_candidate=true" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        with:
          context: .
          pull: true
          load: true
          tags: ddd-source-preparation:${{ github.sha }}
          cache-from: type=gha,scope=ddd-source-preparation-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-source-preparation-${{ github.sha }}
      - id: mode
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        run: |
          mode="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA} - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          from pathlib import Path
          d=yaml.safe_load((Path('/app')/sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or '')
          PY
          )"
          case "$mode" in official_live|verified_snapshot) ;; *) echo "::error::Modo productivo inválido: $mode"; exit 40;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.mode.outputs.mode == 'verified_snapshot' }}
        run: bash inputs/partes/reconstruir_fuentes.sh
      - id: acquire
        name: Adquirir y congelar fuentes
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        run: |
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA}             -m herramientas.ejecutar_fuentes_workflow             --declaration "/app/$SOURCE_DECLARATION" --working /app/.ddd-source-package             --checkpoint-out /app/.ddd-source-checkpoint --acquisition-evidence "/app/$EVIDENCE_DIR"             --environment production --acquisition-mode '${{ steps.mode.outputs.mode }}' --root-dir /app
      - name: Publicar diagnóstico de adquisición fallida
        if: ${{ failure() && steps.acquire.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-source-diagnostics-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - id: meta
        name: Identificar paquete territorial
        run: echo "artifact_name=ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
          path: .ddd-source-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  registrar:
    name: Registrar fuentes territoriales preparadas
    needs: [resolver, territoriales]
    outputs:
      artifact_sha256: ${{ steps.register.outputs.artifact_sha256 }}
      package_sha256: ${{ steps.register.outputs.package_sha256 }}
      promotion_sha: ${{ steps.register.outputs.promotion_sha }}
    if: ${{ needs.territoriales.result == 'success' && needs.resolver.outputs.persist_state == 'true' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ddd-catalog-promotion
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ inputs.territory_id }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ needs.resolver.outputs.edition }}
      POPULATION_YEAR: ${{ needs.resolver.outputs.population_year }}
      SECTION_YEAR: ${{ needs.resolver.outputs.section_year }}
      ARTIFACT_NAME: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
      ARTIFACT_SHA256: ${{ needs.territoriales.outputs.artifact_digest }}
      TARGET_BRANCH: ${{ github.ref_name }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
          path: .ddd-source-package
      - id: register
        name: Registrar preparación territorial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration             --territory "$TERRITORY" --edition "$EDITION" --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR" --output "$SOURCE_DECLARATION"
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          python -m herramientas.promover_catalogo_tras_preparacion             --root-dir . --territory-id "$TERRITORY_ID" --edition "$EDITION"             --package .ddd-source-package --source-declaration "$SOURCE_DECLARATION"             --run-id "$GITHUB_RUN_ID" --artifact-name "$ARTIFACT_NAME"             --artifact-sha256 "$ARTIFACT_SHA256" --source-commit "$GITHUB_SHA" > .ddd-catalog-promotion.json
          echo "artifact_sha256=$(jq -r .artifact_sha256 .ddd-catalog-promotion.json)" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$(jq -r .package_sha256 .ddd-catalog-promotion.json)" >> "$GITHUB_OUTPUT"
          python herramientas/catalogo_preparacion.py --root-dir . validate
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add configuracion/catalogo_preparacion.yaml configuracion/catalogo_territorios_espana_2025.yaml             "territorios/$TERRITORY_ID/config" "territorios/$TERRITORY_ID/evidencia/fuentes_territoriales"
          if ! git diff --cached --quiet; then
            git commit -m "chore: registrar preparación territorial de $TERRITORY_ID"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH"; then pushed=true; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            [[ "$pushed" == true ]] || { echo "::error::No se pudo registrar la preparación territorial tras tres intentos."; exit 47; }
          fi
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          durable="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY_ID" --edition "$EDITION")"
          [[ "$(jq -r .run_id <<<"$durable")" == "$GITHUB_RUN_ID" ]] || { echo "::error::El registro territorial durable no apunta al run actual."; exit 48; }
          [[ "$(jq -r .artifact_name <<<"$durable")" == "$ARTIFACT_NAME" ]] || { echo "::error::El registro territorial durable no conserva el artefacto esperado."; exit 49; }
          [[ "$(jq -r .artifact_sha256 <<<"$durable")" == "${ARTIFACT_SHA256#sha256:}" ]] || { echo "::error::El registro territorial durable no conserva el SHA-256 esperado."; exit 50; }
          promotion_sha="$(git rev-parse HEAD)"
          [[ "$promotion_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit de promoción inválido."; exit 51; }
          echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"
  pre_m04:
    name: Acreditar contrato efectivo hasta la puerta de Formación inicial
    needs: [resolver, territoriales, registrar]
    if: ${{ needs.territoriales.result == 'success' && needs.registrar.result == 'success' && needs.resolver.outputs.persist_state == 'true' }}
    uses: ./.github/workflows/_reutilizable-generacion-territorial.yml
    with:
      params: ${{ format('territorios/{0}/config/{0}_{1}.yaml', needs.resolver.outputs.territory_id, needs.resolver.outputs.edition) }}
      mode: execute
      from_stage: M01
      to_stage: M04
      source_package_run_id: ${{ github.run_id }}
      source_package_artifact_name: ${{ format('ddd-source-package-{0}-{1}-{2}', needs.resolver.outputs.territory_id, needs.resolver.outputs.edition, github.run_id) }}
      execution_authorization: EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION
      source_ref: ${{ needs.registrar.outputs.promotion_sha }}
      persist_state: true
      preflight_only: true
      source_evidence_run_id: ${{ github.run_id }}
      source_evidence_artifact_name: ${{ format('ddd-source-package-{0}-{1}-{2}', needs.resolver.outputs.territory_id, needs.resolver.outputs.edition, github.run_id) }}
      source_evidence_artifact_sha256: ${{ needs.registrar.outputs.artifact_sha256 }}
      source_evidence_package_sha256: ${{ needs.registrar.outputs.package_sha256 }}
    secrets: inherit

  resultado:
    name: Verificar resultado durable de preparación
    needs: [resolver, territoriales, registrar, pre_m04]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Exigir registro cuando la persistencia es obligatoria
        env:
          PREPARATION_RESULT: ${{ needs.territoriales.result }}
          REGISTRATION_RESULT: ${{ needs.registrar.result }}
          PERSIST_STATE: ${{ needs.resolver.outputs.persist_state }}
          PRE_M04_RESULT: ${{ needs.pre_m04.result }}
        run: |
          if [[ "$PERSIST_STATE" == true && "$PRE_M04_RESULT" != success ]]; then
            echo "::error::La preparación durable no acreditó la puerta pre-M04: $PRE_M04_RESULT"
            exit 55
          fi
          python herramientas/evaluar_persistencia_preparacion.py terminal \
            --preparation-result "$PREPARATION_RESULT" \
            --registration-result "$REGISTRATION_RESULT" \
            --persist-state "$PERSIST_STATE"

