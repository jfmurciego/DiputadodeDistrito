# PROYECTO: Diputado de Distrito
# CLASE: interfaz de negocio — Diseño A
# VERSIÓN: 1.3.0
# NOMBRE DE VERSIÓN: Preparación durable de datos territoriales
# FECHA: 2026-09-19
# ESTADO: candidato
# CAMBIOS: separa la preparación territorial de la preparación electoral; este workflow sólo prepara secciones y población.
# MOTIVO: impedir que la ausencia de resultados electorales bloquee la preparación de datos territoriales.
name: 01 · Preparación de Datos Territoriales

on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
      data_edition: {required: true, type: string}
      reutilizar_si_ya_preparada: {required: false, type: boolean, default: true}
      source_ref: {required: false, type: string, default: ''}
      persist_state: {required: false, type: boolean, default: true}
      recover_run_id: {required: false, type: string, default: ''}
      recover_artifact_sha256: {required: false, type: string, default: ''}
    outputs:
      territory_id:
        value: ${{ jobs.resolver.outputs.territory_id }}
      edition:
        value: ${{ inputs.data_edition }}
      artifact_name:
        value: ${{ jobs.territoriales.outputs.artifact_name }}
      artifact_digest:
        value: ${{ jobs.territoriales.outputs.artifact_digest }}
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        type: choice
        options:
          - Andalucía
          - Aragón
          - Principado de Asturias
          - Islas Baleares
          - Canarias
          - Cantabria
          - Castilla-La Mancha
          - Castilla y León
          - Cataluña
          - Comunidad Valenciana
          - Extremadura
          - Galicia
          - Comunidad de Madrid
          - Región de Murcia
          - Comunidad Foral de Navarra
          - País Vasco
          - La Rioja
          - Ceuta
          - Melilla
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options: ['2025']
      reutilizar_si_ya_preparada:
        description: Reutilizar fuente oficial ya preparada
        required: true
        default: true
        type: boolean
      recover_run_id:
        description: Run de preparación existente sin registrar (opcional)
        required: false
        type: string
      recover_artifact_sha256:
        description: SHA-256 del artefacto de ese run (obligatorio con run)
        required: false
        type: string

concurrency:
  group: ddd-territorial-prod-${{ inputs.territory_id }}-${{ inputs.data_edition }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  resolver:
    name: Resolver preparación desde catálogo
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      registered_run_id: ${{ steps.resolve.outputs.registered_run_id }}
      registered_artifact_name: ${{ steps.resolve.outputs.registered_artifact_name }}
      registered_artifact_sha256: ${{ steps.resolve.outputs.registered_artifact_sha256 }}
      persist_state: ${{ steps.resolve.outputs.persist_state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env:
          TERRITORY: ${{ inputs.territory_id }}
          EDITION: ${{ inputs.data_edition }}
          PERSIST_INPUT: ${{ toJSON(inputs.persist_state) }}
          RECOVERY_RUN_ID: ${{ inputs.recover_run_id || '' }}
          RECOVERY_SHA256: ${{ inputs.recover_artifact_sha256 || '' }}
        run: |
          set -euo pipefail
          persist_json="$(python herramientas/evaluar_persistencia_preparacion.py resolve --requested "$PERSIST_INPUT")"
          echo "persist_state=$(jq -r '.persist_state|tostring' <<<"$persist_json")" >> "$GITHUB_OUTPUT"
          python herramientas/catalogo_preparacion.py --root-dir . validate
          python herramientas/resolver_fuentes_territorio.py declaration --territory "$TERRITORY" --edition "$EDITION" >/dev/null
          row="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY" --edition "$EDITION")"
          preflight="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY" --edition "$EDITION")"
          echo "territory_id=$(jq -r .territory_id <<<"$row")" >> "$GITHUB_OUTPUT"
          if [[ -n "$RECOVERY_RUN_ID" || -n "$RECOVERY_SHA256" ]]; then
            [[ "$(jq -r '.persist_state|tostring' <<<"$persist_json")" == true ]] || { echo "::error::La recuperación durable exige persist_state=true."; exit 41; }
            [[ "$GITHUB_REF_NAME" == main ]] || { echo "::error::La recuperación durable solo se permite en main."; exit 41; }
            [[ "${{ inputs.reutilizar_si_ya_preparada }}" == true ]] || { echo "::error::La recuperación exige reutilización habilitada."; exit 41; }
            [[ -n "$RECOVERY_RUN_ID" && -n "$RECOVERY_SHA256" ]] || { echo "::error::Recuperación requiere run y SHA-256 juntos."; exit 41; }
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Run de recuperación inválido."; exit 41; }
            RECOVERY_SHA256="${RECOVERY_SHA256#sha256:}"
            [[ "$RECOVERY_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::SHA-256 de recuperación inválido."; exit 41; }
            [[ "$(jq -r '.registered' <<<"$preflight")" == false ]] || { echo "::error::La fuente ya tiene registro durable; se rechaza la recuperación explícita."; exit 41; }
            echo "registered_run_id=$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_name=ddd-source-package-$(jq -r .territory_id <<<"$row")-$EDITION-$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_sha256=${RECOVERY_SHA256,,}" >> "$GITHUB_OUTPUT"
          else
            echo "registered_run_id=$(jq -r '.run_id // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_name=$(jq -r '.artifact_name // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_sha256=$(jq -r '.artifact_sha256 // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
          fi

  territoriales:
    name: Preparar fuentes territoriales
    needs: resolver
    runs-on: ubuntu-24.04
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ inputs.territory_id }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ inputs.data_edition }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
      EVIDENCE_DIR: .ddd-sources
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          token: ${{ github.token }}
      - name: Instalar dependencias de resolución territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Generar declaración territorial desde fuentes oficiales
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration \
            --territory "$TERRITORY" \
            --edition "$EDITION" \
            --output "$SOURCE_DECLARATION"
          test -s "$SOURCE_DECLARATION"
      - id: previous
        name: Recuperar fuente territorial registrada
        if: ${{ inputs.reutilizar_si_ya_preparada && needs.resolver.outputs.registered_run_id != '' }}
        shell: bash
        env:
          REGISTERED_RUN_ID: ${{ needs.resolver.outputs.registered_run_id }}
          REGISTERED_ARTIFACT_NAME: ${{ needs.resolver.outputs.registered_artifact_name }}
          REGISTERED_ARTIFACT_SHA256: ${{ needs.resolver.outputs.registered_artifact_sha256 }}
        run: |
          set -euo pipefail
          arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REGISTERED_RUN_ID/artifacts?per_page=100")"
          match="$(jq -c --arg n "$REGISTERED_ARTIFACT_NAME" '[.artifacts[]|select(.name==$n and (.expired|not))] | if length==1 then .[0] else empty end' <<<"$arts")"
          [[ -n "$match" ]] || { echo "::error::Artefacto territorial registrado no disponible: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"; exit 44; }
          actual_digest="$(jq -r '.digest // empty' <<<"$match" | sed 's/^sha256://')"
          [[ "$actual_digest" == "$REGISTERED_ARTIFACT_SHA256" ]] || { echo "::error::Digest de artefacto territorial no coincide con el registro."; exit 45; }
          rm -rf .ddd-source-package
          gh run download "$REGISTERED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$REGISTERED_ARTIFACT_NAME" --dir .ddd-source-package
          python -m herramientas.seleccionar_paquete_fuentes             --package .ddd-source-package             --territory-id "$TERRITORY_ID"             --edition "$EDITION"
          echo "run_id=$REGISTERED_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$REGISTERED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "reused_candidate=true" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        with:
          context: .
          pull: true
          load: true
          tags: ddd-source-preparation:${{ github.sha }}
          cache-from: type=gha,scope=ddd-source-preparation-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-source-preparation-${{ github.sha }}
      - id: mode
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        run: |
          mode="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA} - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          from pathlib import Path
          d=yaml.safe_load((Path('/app')/sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or '')
          PY
          )"
          case "$mode" in official_live|verified_snapshot) ;; *) echo "::error::Modo productivo inválido: $mode"; exit 40;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.mode.outputs.mode == 'verified_snapshot' }}
        run: bash inputs/partes/reconstruir_fuentes.sh
      - name: Adquirir y congelar fuentes
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        run: |
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA}             -m herramientas.ejecutar_fuentes_workflow             --declaration "/app/$SOURCE_DECLARATION" --working /app/.ddd-source-package             --checkpoint-out /app/.ddd-source-checkpoint --acquisition-evidence "/app/$EVIDENCE_DIR"             --environment production --acquisition-mode '${{ steps.mode.outputs.mode }}' --root-dir /app
      - id: meta
        name: Identificar paquete territorial
        run: echo "artifact_name=ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}
          path: .ddd-source-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  registrar:
    name: Registrar fuentes territoriales preparadas
    needs: [resolver, territoriales]
    if: ${{ needs.territoriales.result == 'success' && needs.resolver.outputs.persist_state == 'true' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ddd-catalog-promotion
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ inputs.territory_id }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ inputs.data_edition }}
      ARTIFACT_NAME: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}
      ARTIFACT_SHA256: ${{ needs.territoriales.outputs.artifact_digest }}
      TARGET_BRANCH: ${{ github.ref_name }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ inputs.data_edition }}-${{ github.run_id }}
          path: .ddd-source-package
      - name: Registrar preparación territorial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration             --territory "$TERRITORY" --edition "$EDITION" --output "$SOURCE_DECLARATION"
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          python -m herramientas.promover_catalogo_tras_preparacion             --root-dir . --territory-id "$TERRITORY_ID" --edition "$EDITION"             --package .ddd-source-package --source-declaration "$SOURCE_DECLARATION"             --run-id "$GITHUB_RUN_ID" --artifact-name "$ARTIFACT_NAME"             --artifact-sha256 "$ARTIFACT_SHA256" > .ddd-catalog-promotion.json
          python herramientas/catalogo_preparacion.py --root-dir . validate
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add configuracion/catalogo_preparacion.yaml configuracion/catalogo_territorios_espana_2025.yaml             "territorios/$TERRITORY_ID/config"
          if ! git diff --cached --quiet; then
            git commit -m "chore: registrar preparación territorial de $TERRITORY_ID"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH"; then pushed=true; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            [[ "$pushed" == true ]] || { echo "::error::No se pudo registrar la preparación territorial tras tres intentos."; exit 47; }
          fi
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          durable="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY_ID" --edition "$EDITION")"
          [[ "$(jq -r .run_id <<<"$durable")" == "$GITHUB_RUN_ID" ]] || { echo "::error::El registro territorial durable no apunta al run actual."; exit 48; }
          [[ "$(jq -r .artifact_name <<<"$durable")" == "$ARTIFACT_NAME" ]] || { echo "::error::El registro territorial durable no conserva el artefacto esperado."; exit 49; }
          [[ "$(jq -r .artifact_sha256 <<<"$durable")" == "${ARTIFACT_SHA256#sha256:}" ]] || { echo "::error::El registro territorial durable no conserva el SHA-256 esperado."; exit 50; }
  pre_m04:
    name: Acreditar contrato efectivo hasta la puerta de Formación inicial
    needs: [resolver, territoriales, registrar, pre_m04]
    if: ${{ needs.territoriales.result == 'success' && needs.registrar.result == 'success' && needs.resolver.outputs.persist_state == 'true' }}
    uses: ./.github/workflows/_reutilizable-generacion-territorial.yml
    with:
      params: ${{ format('territorios/{0}/config/{0}_{1}.yaml', needs.resolver.outputs.territory_id, inputs.data_edition) }}
      mode: execute
      from_stage: M01
      to_stage: M04
      source_package_run_id: ${{ github.run_id }}
      source_package_artifact_name: ${{ format('ddd-source-package-{0}-{1}-{2}', needs.resolver.outputs.territory_id, inputs.data_edition, github.run_id) }}
      execution_authorization: EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION
      source_ref: ${{ github.ref_name }}
      persist_state: true
      preflight_only: true
    secrets: inherit

  resultado:
    name: Verificar resultado durable de preparación
    needs: [resolver, territoriales, registrar]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Exigir registro cuando la persistencia es obligatoria
        env:
          PREPARATION_RESULT: ${{ needs.territoriales.result }}
          REGISTRATION_RESULT: ${{ needs.registrar.result }}
          PERSIST_STATE: ${{ needs.resolver.outputs.persist_state }}
          PRE_M04_RESULT: ${{ needs.pre_m04.result }}
        run: |
          if [[ "$PERSIST_STATE" == true && "$PRE_M04_RESULT" != success ]]; then
            echo "::error::La preparación durable no acreditó la puerta pre-M04: $PRE_M04_RESULT"
            exit 55
          fi
          python herramientas/evaluar_persistencia_preparacion.py terminal \
            --preparation-result "$PREPARATION_RESULT" \
            --registration-result "$REGISTRATION_RESULT" \
            --persist-state "$PERSIST_STATE"

