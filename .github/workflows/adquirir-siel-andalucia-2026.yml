name: Adquirir SIEL Andalucía 2026 · snapshot

on:
  workflow_call:

permissions:
  contents: read

jobs:
  adquirir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preparar índice provisional sólo de coordenadas
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 1 --connect-timeout 10 --max-time 90 \
            -o andalucia-section-locator.csv \
            https://pub-36ce9aa148a348ae8d9b6686b7edf0c4.r2.dev/eleccionesdb-etl/data-raw/hechos/minsait/01-andalucia.csv
          echo "13ffb00bbba4403b9e8d072e766e3979c29ac63cfb5cdcdb7b5e91348484ac21  andalucia-section-locator.csv" | sha256sum -c -
      - name: Construir snapshot final SIEL 2026
        run: |
          set -euo pipefail
          rm -rf .ddd-siel-andalucia-2026
          python herramientas/adquirir_siel_andalucia_2026.py \
            --out .ddd-siel-andalucia-2026 \
            --workers 32 \
            --section-index andalucia-section-locator.csv \
            --section-index-sha256 13ffb00bbba4403b9e8d072e766e3979c29ac63cfb5cdcdb7b5e91348484ac21 \
            | tee siel-andalucia-2026-report.json
          jq '{election_id,election_date,sections,vote_rows,candidate_votes_sections,candidate_votes_cera,candidate_votes_official,sections_sha256,cera_sha256,section_locator}' .ddd-siel-andalucia-2026/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar checkpoint para reanudación controlada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddd-siel-andalucia-2026-checkpoint
          path: |
            .ddd-siel-andalucia-2026/.checkpoint-sections
            .ddd-siel-andalucia-2026/.checkpoint-meta.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar snapshot durable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddd-siel-andalucia-2026-snapshot
          path: .ddd-siel-andalucia-2026
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publicar sólo informe pequeño
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidencia-siel-andalucia-2026
          path: siel-andalucia-2026-report.json
          if-no-files-found: error
          retention-days: 7
