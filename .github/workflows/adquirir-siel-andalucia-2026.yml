name: Adquirir SIEL Andalucía 2026 · snapshot

on:
  workflow_call:

permissions:
  contents: read

jobs:
  adquirir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Ejecutar proveedor oficial mediante estrategia común
        run: |
          set -euo pipefail
          python herramientas/preparar_snapshot_electoral_oficial.py \
            --root-dir . \
            --election-id andalucia_parlamento_2026 \
            --territory-id andalucia \
            --election-date 2026-05-17 \
            --edition 2025 \
            --snapshot-out .ddd-siel-andalucia-2026 \
            --package-out .ddd-electoral-package \
            --workers 32 \
            | tee siel-andalucia-2026-report.json
          jq '{election_id,election_date,sections,vote_rows,candidate_votes_sections,candidate_votes_cera,candidate_votes_official,sections_sha256,cera_sha256,section_locator}' \
            .ddd-siel-andalucia-2026/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar checkpoint para reanudación controlada
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ddd-siel-andalucia-2026-checkpoint
          path: |
            .ddd-siel-andalucia-2026/.checkpoint-sections
            .ddd-siel-andalucia-2026/.checkpoint-meta.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar snapshot durable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ddd-siel-andalucia-2026-snapshot
          path: .ddd-siel-andalucia-2026
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publicar paquete normalizado sólo para diagnóstico
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ddd-siel-andalucia-2026-package
          path: .ddd-electoral-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publicar sólo informe pequeño
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: evidencia-siel-andalucia-2026
          path: siel-andalucia-2026-report.json
          if-no-files-found: error
          retention-days: 7
