name: F10 - variaciones oficiales INE 2025 y 2026
on:
  push:
    branches:
      - chatgpt/fuentes-wfs-20261017
    paths:
      - herramientas/inspeccionar_variaciones_callejero_f10.py
      - .github/workflows/f10-investigar-variaciones-callejero-ine.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validar script
        run: python -m py_compile herramientas/inspeccionar_variaciones_callejero_f10.py
      - name: Adquirir y contrastar variaciones INE julio 2025 a enero 2026
        run: |
          python herramientas/inspeccionar_variaciones_callejero_f10.py \
            --source-url "https://ine.es/prodyser/callejero/Var_Callejero_0725_0126.zip" \
            --output "$RUNNER_TEMP/variaciones_ine_0725_0126.json"
      - name: Adquirir y contrastar variaciones INE enero a julio 2026
        run: |
          python herramientas/inspeccionar_variaciones_callejero_f10.py \
            --source-url "https://ine.es/prodyser/callejero/Var_Callejero_0126_0726.zip" \
            --output "$RUNNER_TEMP/variaciones_ine_0126_0726.json"
      - name: Conservar evidencias no productivas
        uses: actions/upload-artifact@v4
        with:
          name: f10-ine-variaciones-2025-2026-43-cusec
          path: |
            ${{ runner.temp }}/variaciones_ine_0725_0126.json
            ${{ runner.temp }}/variaciones_ine_0126_0726.json
          if-no-files-found: error
          retention-days: 30
