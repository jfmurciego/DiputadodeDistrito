# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE: EXT-11 — Auditoría de fragilidad topológica c020
# FECHA: 2026-09-11
# ESTADO: diagnóstico; no modifica motores.
# QUÉ HACE: reproduce c020 con M04 v7.4.5 seed 12345, mide la firma de articulaciones en M04, ejecuta
# M05 v7.5.2 + swap-polish y vuelve a medir la firma topológica en el resultado final.
# MOTIVO: EXT-10 confirma que `seed` de M04 v7.4.5 no se consume. Antes de crear variantes de construcción
# se necesita un baseline explícito de fragilidad que permita seleccionar mejoras topológicas reproducibles.
# ANTERIOR: ninguno — workflow nuevo.
name: EXT-11 — C020 fragility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extremadura-c020-fragility.yml'
      - 'herramientas/auditar_fragilidad_topologica.py'

permissions: {contents: read}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
      BASE: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/ext11
      ROOTBASE: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
      CFG: territorios/extremadura/config/.generated_ext11_c020.yaml
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-ext11:${GITHUB_SHA} .
      - name: M01-M03
        run: |
          set -euo pipefail
          mkdir -p "$BASE"
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext11:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'
      - name: Construir c020
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext11:${GITHUB_SHA} herramientas/construir_unidades_internas_m04.py \
            --geojson "$ROOTBASE/extremadura_2025_m01_secciones_poblacion.geojson.zip" \
            --graph "$ROOTBASE/extremadura_2025_m03_grafo.json" \
            --out-geojson "$BASE/m04_input.geojson" --out-report "$BASE/units_report.json" \
            --k 65 --id-field CUSEC_KEY --municipality-field CUMUN --population-field POP_2025 \
            --partition-unit-field M04_PARTITION_UNIT --atomicity-ratio 1.10 --chunk-ratio 0.20
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd
      - name: Generar configuración
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext11:${GITHUB_SHA} -c '
          import copy,pathlib,yaml
          root=pathlib.Path("/app"); cfg=yaml.safe_load((root/"territorios/extremadura/config/extremadura_2025.yaml").read_text()); c=copy.deepcopy(cfg)
          base="territorios/extremadura/.cache/ddd/preparacion/{run_name}/ext11"
          c["modulos"]["modulo_04_generar_semillas"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":base+"/m04_input.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_PARTITION_UNIT","municipality_name_field":"NMUN","k_districts":65,"municipality_atomicity_limit_ratio":1.10,"seed":12345,"out_geojson":base+"/m04.geojson.zip","out_report":base+"/m04_report.json"}
          c["modulos"]["modulo_05_optimizar_distritos"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":base+"/m04.geojson.zip","id_field":"CUSEC_KEY","pop_field":"POP_{year}","district_field":"district_id","province_field":"CPRO","municipality_field":"CUMUN","greedy_moves_limit":1000,"anneal_iters":30000,"swap_polish_max":200,"seed":12345,"out_geojson":base+"/m05.geojson.zip","out_report":base+"/m05_report.json"}
          c["validation"].update({"expected_districts":65,"population_floor_ratio":.85,"population_cap_ratio":1.50,"target_tolerance_ratio":.10,"province_districts":{"06":41,"10":24}})
          (root/"territorios/extremadura/config/.generated_ext11_c020.yaml").write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True))'
      - name: M04 + fragilidad inicial
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext11:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params "$CFG"
          python herramientas/reparar_propiedad_geojson_zip.py --zip "$BASE/m04.geojson.zip" --property ddd_unit_id --province-field CPRO --unit-field M04_PARTITION_UNIT --suffix P
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext11:${GITHUB_SHA} herramientas/auditar_fragilidad_topologica.py --params "$CFG" --geojson "$BASE/m04.geojson.zip" --out "$BASE/fragility_m04.json"
      - name: M05 + fragilidad final
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext11:${GITHUB_SHA} modulos/05_optimizar_distritos.py --params "$CFG"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext11:${GITHUB_SHA} herramientas/auditar_fragilidad_topologica.py --params "$CFG" --geojson "$BASE/m05.geojson.zip" --out "$BASE/fragility_m05.json"
      - name: Publicar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT11-fragility-${{ github.run_id }}
          path: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/ext11/
