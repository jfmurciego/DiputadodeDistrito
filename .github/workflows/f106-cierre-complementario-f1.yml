# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE: Cierre complementario F1
# ESTADO: lanzamiento único solicitado; después, manual
# QUÉ HACE: ejecuta en paralelo las tareas F1 restantes sin recalcular los GeoJSON recién generados.
# REGLA: ninguna rama bloquea a las demás; el cierre siempre persiste todos los estados.
name: Cierre complementario F1 — auditoría, salud y visualización

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/f106-cierre-complementario-f1.yml'

permissions:
  contents: write

jobs:
  auditoria_ampliada:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Controles de contratos, evidencia y resultados
        shell: bash
        run: |
          set +e
          mkdir -p salida/auditoria
          python3 - <<'PY'
          import csv, hashlib, json, pathlib, statistics
          r=pathlib.Path("."); checks=[]
          def ck(i,label,fn):
            try: checks.append({"id":i,"label":label,"status":"PASS" if fn() else "FAIL"})
            except Exception as e: checks.append({"id":i,"label":label,"status":"FAIL","detail":str(e)})
          cfgs=[r/"territorios/aragon/config/aragon_2025.yaml",r/"territorios/castilla_y_leon/config/castilla_y_leon_2025.yaml",r/"territorios/extremadura/config/extremadura_2025.yaml"]
          for n,p in enumerate(cfgs,1):
            text=p.read_text(); ck(f"C{n:02d}","contrato explícito "+p.parent.parent.name,lambda text=text:all(x in text for x in ["population_floor_ratio:","population_cap_ratio:","target_tolerance_ratio:"]))
          geo=[
            r/"resultados/lotes_autonomos/gh-34713827926-1/lote-recibido/lote-aragon/aragon_distritos.geojson",
            r/"resultados/lotes_autonomos/gh-34713827926-1/lote-recibido/lote-cyl/castilla_y_leon_distritos.geojson"]
          for n,p in enumerate(geo,10):
            ck(f"C{n:02d}","GeoJSON "+p.stem,lambda p=p:json.loads(p.read_text())["type"]=="FeatureCollection")
          cats=[r/"territorios/aragon/resultados/ejecuciones/gh-34599224954-1/M06/catalogo_distritos.csv",r/"territorios/castilla_y_leon/resultados/ejecuciones/gh-34701897922-1/M06/catalogo_distritos.csv",r/"territorios/extremadura/resultados/ejecuciones/gh-34703213474-1/M06/catalogo_distritos.csv"]
          compactness={}
          for p in cats:
            rows=list(csv.DictReader(p.open())); vals=[float(x.get("polsby_popper",x.get("compactness_polsby_popper"))) for x in rows]
            compactness[p.parts[1]]={"n":len(vals),"median":statistics.median(vals),"minimum":min(vals),"below_0_15":sum(x<.15 for x in vals)}
          root=r/"resultados/ejecuciones"; ar=r/"territorios/aragon/resultados/ejecuciones"
          common=[p.relative_to(root) for p in root.rglob("*") if p.is_file() and (ar/p.relative_to(root)).is_file()]
          exact=sum((root/p).read_bytes()==(ar/p).read_bytes() for p in common)
          ck("C20","duplicación Aragón cuantificada",lambda:len(common)>=0)
          pathlib.Path("salida/auditoria/RESULTADO.json").write_text(json.dumps({"checks":checks,"compactness":compactness,"aragon_duplicate_files":len(common),"aragon_byte_equal":exact},ensure_ascii=False,indent=2))
          PY
          rc=$?
          printf '{"component":"auditoria_ampliada","exit_code":%s}
' "$rc" > salida/auditoria/estado.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: f106-auditoria, path: salida/auditoria}

  salud_tecnica:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Construir entorno y smoke sintético M01-M06
        shell: bash
        run: |
          set +e
          mkdir -p salida/salud
          docker build --pull -t ddd-f106:$GITHUB_SHA .
          docker run --rm ddd-f106:$GITHUB_SHA python -m unittest tests.test_pipeline_sintetico_m01_m06 > salida/salud/smoke.log 2>&1
          rc=$?
          printf '{"component":"salud_tecnica","exit_code":%s}
' "$rc" > salida/salud/estado.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: f106-salud, path: salida/salud}

  extremadura_diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Diagnosticar el bloqueo sin promoción
        shell: bash
        run: |
          set +e
          mkdir -p salida/extremadura
          python3 - <<'PY'
          import csv,json,pathlib
          r=pathlib.Path("."); p=r/"territorios/extremadura/resultados/ejecuciones/gh-34703213474-1/M06/catalogo_distritos.csv"
          rows=list(csv.DictReader(p.open())); out=[]
          for x in rows:
            dev=float(x.get("relative_deviation",x.get("deviation_ratio",0)))
            if abs(dev)>0.10: out.append({"district_id":x.get("district_id"),"relative_deviation":dev,"population":x.get("district_pop",x.get("population"))})
          val=json.loads((r/"territorios/extremadura/resultados/ejecuciones/gh-34703213474-1/VALIDACION.json").read_text())
          pathlib.Path("salida/extremadura/DIAGNOSTICO.json").write_text(json.dumps({"status":"EXPERIMENTAL_BLOCKED","outside_target_tolerance":out,"validation":val},ensure_ascii=False,indent=2))
          PY
          rc=$?
          printf '{"component":"extremadura_diagnostico","exit_code":%s}
' "$rc" > salida/extremadura/estado.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: f106-extremadura, path: salida/extremadura}

  visualizacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Preparar paquete de visualización de los GeoJSON finales
        shell: bash
        run: |
          set +e
          mkdir -p salida/visualizacion
          cp resultados/lotes_autonomos/gh-34713827926-1/lote-recibido/lote-aragon/aragon_distritos.geojson salida/visualizacion/
          cp resultados/lotes_autonomos/gh-34713827926-1/lote-recibido/lote-cyl/castilla_y_leon_distritos.geojson salida/visualizacion/
          python3 - <<'PY'
          import json,pathlib
          o={}
          for p in pathlib.Path("salida/visualizacion").glob("*.geojson"):
            d=json.loads(p.read_text());o[p.name]={"features":len(d["features"]),"type":d["type"]}
          pathlib.Path("salida/visualizacion/MANIFIESTO.json").write_text(json.dumps(o,ensure_ascii=False,indent=2))
          PY
          rc=$?
          printf '{"component":"visualizacion","exit_code":%s}
' "$rc" > salida/visualizacion/estado.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: f106-visualizacion, path: salida/visualizacion}

  cierre:
    if: always()
    needs: [auditoria_ampliada, salud_tecnica, extremadura_diagnostico, visualizacion]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with: {pattern: f106-*, path: recibido}
      - name: Consolidar resultados parciales
        shell: bash
        run: |
          mkdir -p cierre
          find recibido -name estado.json -exec cat {} ; | tee cierre/ESTADOS.txt
          python3 - <<'PY'
          import json,os,pathlib
          s=[json.loads(p.read_text()) for p in pathlib.Path("recibido").rglob("estado.json")]
          pathlib.Path("cierre/RUN_SUMMARY.json").write_text(json.dumps({"run_id":os.environ["GITHUB_RUN_ID"],"statuses":s},ensure_ascii=False,indent=2))
          PY
          dest=resultados/cierres_f1/gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          mkdir -p "$dest"; cp -R recibido cierre "$dest/"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"; git diff --cached --quiet || git commit -m "data: cierre complementario F1 $GITHUB_RUN_ID"; git push
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: f106-completo, path: cierre}
