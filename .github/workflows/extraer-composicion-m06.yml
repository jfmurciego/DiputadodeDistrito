# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Extraer composición M06
# FECHA: 2026-11-07
# ESTADO: candidato
# QUÉ HACE: por cada territorio con canonical_m06 en orchestracion/publicaciones_visor.json extrae la composición
#   sección→distrito del estado M06 de su run (artefacto vivo de Actions o, si caducó, copia en R2), la valida contra el
#   M06 publicado (secciones y población por distrito) y la registra en main como datos/composicion/<territorio>.csv
#   con MANIFEST.json. Después genera los votos por partido (herramientas/resultados_partidos.py). Lo que no se encuentra
#   queda como aviso («no recuperados»); no es una 00 ni publica nada.
# CAMBIOS: versión inicial (T-67).
# MOTIVO: el M06 publicado solo trae polígonos; sin la composición no se pueden agregar votos por partido; los artefactos caducan a los 14 días.
# ANTERIOR: ninguna (fichero nuevo)
name: 'Auxiliar — Extraer composición M06'
run-name: "Extraer composición M06 · ${{ inputs.territorios || 'todos' }}"
on:
  workflow_dispatch:
    inputs:
      territorios:
        description: 'Territorios separados por comas, o «todos»'
        required: false
        type: string
        default: 'todos'
permissions:
  contents: write
  actions: read
concurrency:
  group: ddd-extraer-composicion-m06
  cancel-in-progress: false
  queue: max
jobs:
  extraer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORIOS: ${{ inputs.territorios }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "Registro con github.token (sin app propia)."; exit 0; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Extraer y registrar
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || pip install --break-system-packages pyyaml
          git config user.name "ddd-registro[bot]"
          git config user.email "ddd-registro[bot]@users.noreply.github.com"
          sel="${TERRITORIOS:-todos}"
          # Runs candidatos: primero los publicados, después todo estado M06 vivo (checkpoints reutilizados).
          python - "$sel" > candidatos.txt <<'PY'
          import json, sys
          sel = sys.argv[1].strip()
          reg = json.load(open("orchestracion/publicaciones_visor.json"))["products"]
          vig = {}
          for p in reg:
              if p["kind"] == "canonical_m06" and (sel in ("", "todos") or p["territory_id"] in sel.split(",")):
                  t = p["territory_id"]
                  if t not in vig or int(p["run_id"]) > int(vig[t]["run_id"]):
                      vig[t] = p
          for t, p in sorted(vig.items()):
              print(p["run_id"], t)
          PY
          cut -d' ' -f1 candidatos.txt > runs.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[]|select(.expired==false)|select(.name|test("^ddd-state-[0-9]+-M06$"))|.workflow_run.id' >> runs.txt || true
          awk '!visto[$0]++' runs.txt > runs_unicos.txt
          mkdir -p trabajo; salida=""
          for run in $(cat runs_unicos.txt); do
            rm -rf "trabajo/$run"; mkdir -p "trabajo/$run"
            if ! gh run download "$run" -n "ddd-state-$run-M06" -D "trabajo/$run" 2>/dev/null; then
              clave="$(awk -v r="$run" '$1==r{print $2; exit}' candidatos.txt)"
              if [[ -n "$clave" && -n "${AWS_ACCESS_KEY_ID:-}" && -n "${R2_BUCKET:-}" && -n "${R2_ACCOUNT_ID:-}" ]]; then
                aws s3 cp --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                  "s3://${R2_BUCKET}/${clave}/${run}/ddd-state-${run}-M06.zip" "trabajo/$run/" >/dev/null 2>&1 || true
              fi
            fi
            salida="$(python herramientas/composicion_m06.py --origen "trabajo/$run" --territorios "$sel")"
            echo "run $run → $salida"
            rm -rf "trabajo/$run"
            if [[ "$salida" == *"no recuperados: -"* ]]; then break; fi
          done
          if [[ "$salida" != *"no recuperados: -"* ]]; then echo "::warning::${salida}"; fi
          git add -A datos/composicion
          if ! git diff --cached --quiet; then
            git commit -m "datos: composición sección→distrito del M06 publicado"
            for intento in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              echo "::warning::push rechazado (intento $intento)"
              git pull --rebase origin main
              [[ "$intento" -lt 3 ]] || exit 1
            done
          fi
          python herramientas/resultados_ligeros.py
          python herramientas/resultados_partidos.py
          git add -A datos/resultados
          if ! git diff --cached --quiet; then
            git commit -m "datos: votos por partido y distrito"
            for intento in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              echo "::warning::push rechazado (intento $intento)"
              git pull --rebase origin main
            done
            exit 1
          fi
