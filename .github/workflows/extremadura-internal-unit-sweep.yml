# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.1.0
# NOMBRE: EXT-04 — Barrido fino de macro-unidades internas M04
# FECHA: 2026-09-11
# ESTADO: diagnóstico arquitectónico.
# QUÉ HACE: compara tres granularidades conectas más finas para municipios sobredimensionados (0,10 / 0,15 / 0,20 del target),
# manteniendo CUMUN real, y ejecuta el mismo pipeline M04→M05 para medir población, splits y articulaciones.
# CAMBIOS: sustituye el barrido 0,25/0,40/0,60 por 0,10/0,15/0,20 tras demostrar v1.0.0 que M04 deja respectivamente 1/4/5 distritos fuera de suelo/techo; cuanto más fina la unidad, mejor la factibilidad inicial.
# MOTIVO: encontrar el punto más grueso que ya produzca hard=0 sin volver a la granularidad indiscriminada por sección y sin relajar la puerta dura de M04.
# ANTERIOR: legacy/workflows/extremadura-internal-unit-sweep_v1.0.0.yml
name: EXT-04 — Sweep unidades internas M04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extremadura-internal-unit-sweep.yml'
      - 'herramientas/construir_unidades_internas_m04.py'

permissions: {contents: read}

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: c010
            ratio: '0.10'
          - label: c015
            ratio: '0.15'
          - label: c020
            ratio: '0.20'
    env:
      PARAMS: territorios/extremadura/config/extremadura_2025.yaml
      BASE: territorios/extremadura/.cache/ddd/preparacion/extremadura_2025
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}

      - name: Fuentes y entorno
        run: |
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-ext04:${GITHUB_SHA} .

      - name: M01-M03 baseline EXT
        run: |
          set -euo pipefail
          mkdir -p "$BASE"
          docker run --rm -e PARAMS="$PARAMS" -v "$PWD/inputs:/app/inputs:ro" -v "$PWD/territorios/extremadura:/app/territorios/extremadura" --entrypoint bash ddd-ext04:${GITHUB_SHA} -lc '
            python modulos/01_preparar_base_territorial.py --params "$PARAMS"
            python modulos/02_construir_adyacencias.py --params "$PARAMS"
            python modulos/03_construir_grafo.py --params "$PARAMS"'

      - name: Construir macro-unidades internas ${{ matrix.label }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext04:${GITHUB_SHA} herramientas/construir_unidades_internas_m04.py \
            --geojson "$BASE/extremadura_2025_m01_secciones_poblacion.geojson.zip" \
            --graph "$BASE/extremadura_2025_m03_grafo.json" \
            --out-geojson "$BASE/extremadura_2025_${{ matrix.label }}_m04_input.geojson" \
            --out-report "$BASE/extremadura_2025_${{ matrix.label }}_units_report.json" \
            --k 65 --id-field CUSEC_KEY --municipality-field CUMUN --population-field POP_2025 \
            --partition-unit-field M04_PARTITION_UNIT --atomicity-ratio 1.10 --chunk-ratio '${{ matrix.ratio }}'
          sudo chown -R "$(id -u):$(id -g)" territorios/extremadura/.cache/ddd

      - name: Generar configuración ${{ matrix.label }}
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext04:${GITHUB_SHA} -c '
          import copy,pathlib,yaml
          root=pathlib.Path("/app");cfg=yaml.safe_load((root/"territorios/extremadura/config/extremadura_2025.yaml").read_text());lab="${{ matrix.label }}"
          c=copy.deepcopy(cfg)
          c["modulos"]["modulo_04_generar_semillas"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_{lab}_m04_input.geojson","id_field":"CUSEC_KEY","pop_field":"POP_{year}","province_field":"CPRO","municipality_field":"M04_PARTITION_UNIT","municipality_name_field":"NMUN","k_districts":65,"municipality_atomicity_limit_ratio":1.10,"seed":12345,"out_geojson":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_{lab}_m04.geojson.zip","out_report":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_{lab}_m04_report.json"}
          c["modulos"]["modulo_05_optimizar_distritos"]={"in_graph_json":"territorios/extremadura/.cache/ddd/preparacion/{run_name}/{run_name}_m03_grafo.json","in_geojson":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_{lab}_m04.geojson.zip","id_field":"CUSEC_KEY","pop_field":"POP_{year}","district_field":"district_id","province_field":"CPRO","municipality_field":"CUMUN","greedy_moves_limit":1000,"anneal_iters":30000,"seed":12345,"out_geojson":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_{lab}_m05.geojson.zip","out_report":f"territorios/extremadura/.cache/ddd/preparacion/{{run_name}}/{{run_name}}_{lab}_m05_report.json"}
          c["validation"].update({"expected_districts":65,"population_floor_ratio":.85,"population_cap_ratio":1.50,"target_tolerance_ratio":.10,"province_districts":{"06":41,"10":24}})
          (root/f"territorios/extremadura/config/.generated_ext04_{lab}.yaml").write_text(yaml.safe_dump(c,sort_keys=False,allow_unicode=True))'

      - name: Ejecutar M04→M05 ${{ matrix.label }}
        run: |
          set -euo pipefail
          CFG="territorios/extremadura/config/.generated_ext04_${{ matrix.label }}.yaml"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext04:${GITHUB_SHA} ddd_core/m04_seed_engine_v745.py --params "$CFG"
          python herramientas/reparar_propiedad_geojson_zip.py \
            --zip "$BASE/extremadura_2025_${{ matrix.label }}_m04.geojson.zip" \
            --property ddd_unit_id --province-field CPRO --unit-field M04_PARTITION_UNIT --suffix P
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext04:${GITHUB_SHA} modulos/05_optimizar_distritos.py --params "$CFG"

      - name: Auditar resultado ${{ matrix.label }}
        run: |
          set -euo pipefail
          CFG="territorios/extremadura/config/.generated_ext04_${{ matrix.label }}.yaml"
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext04:${GITHUB_SHA} -c '
          import io,json,pathlib,zipfile
          import geopandas as gpd
          base=pathlib.Path("/app/territorios/extremadura/.cache/ddd/preparacion/extremadura_2025");lab="${{ matrix.label }}"
          with zipfile.ZipFile(base/f"extremadura_2025_{lab}_m05.geojson.zip") as z:n=next(n for n in z.namelist() if n.endswith(".geojson"));g=gpd.read_file(io.BytesIO(z.read(n)))
          target=g.POP_2025.sum()/65;pops=g.groupby("district_id").POP_2025.sum();splits=g.groupby("CUMUN").district_id.nunique();m04=json.loads((base/f"extremadura_2025_{lab}_m04_report.json").read_text());m05=json.loads((base/f"extremadura_2025_{lab}_m05_report.json").read_text());units=json.loads((base/f"extremadura_2025_{lab}_units_report.json").read_text())
          out={"label":lab,"chunk_ratio":units["chunk_ratio"],"partition_unit_count":units["partition_unit_count"],"districts":int(g.district_id.nunique()),"outside_10":int(((pops-target).abs()>target*.10).sum()),"max_abs_deviation":float(((pops-target).abs()/target).max()),"min_pop":int(pops.min()),"max_pop":int(pops.max()),"split_municipality_count":int((splits>1).sum()),"split_municipalities":{str(k):int(v) for k,v in splits[splits>1].items()},"m04_outside":m04.get("outside_target_tolerance"),"m05_changed_units":m05.get("final_changed_units")};(base/f"extremadura_2025_{lab}_summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False))'
          docker run --rm -v "$PWD:/app" --entrypoint python ddd-ext04:${GITHUB_SHA} herramientas/auditar_articulaciones_m05.py \
            --params "$CFG" --geojson "$BASE/extremadura_2025_${{ matrix.label }}_m05.geojson.zip" \
            --out "$BASE/extremadura_2025_${{ matrix.label }}_articulations.json"

      - name: Publicar ${{ matrix.label }}
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extremadura-EXT04-${{ matrix.label }}-${{ github.run_id }}
          path: |
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_${{ matrix.label }}_units_report.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_${{ matrix.label }}_m04_report.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_${{ matrix.label }}_m05_report.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_${{ matrix.label }}_summary.json
            territorios/extremadura/.cache/ddd/preparacion/extremadura_2025/extremadura_2025_${{ matrix.label }}_articulations.json
