name: F10 Andalucia source geometries 2025 2026
on:
  push:
    branches:
      - chatgpt/fuentes-wfs-20261017
    paths:
      - .github/workflows/f10-andalucia-crossyear-20261018.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preservar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno de geometria
        run: |
          python -m pip install --quiet shapely==2.1.2 pyproj==3.7.2
          python -m py_compile herramientas/auditar_ine_andalucia_secciones_2025_2026.py
      - name: Conservar WFS originales y calcular matriz espacial
        run: |
          mkdir -p "$RUNNER_TEMP/ine-andalucia"
          python herramientas/auditar_ine_andalucia_secciones_2025_2026.py \
            --out "$RUNNER_TEMP/ine-andalucia" --workers 3
      - name: Conservar resultado incluso si algun municipio bloquea
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f10-andalucia-2025-2026-geometrias-raw
          path: ${{ runner.temp }}/ine-andalucia/
          if-no-files-found: warn
          retention-days: 90
