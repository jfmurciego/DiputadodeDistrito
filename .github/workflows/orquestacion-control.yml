# PROYECTO: Diputado de Distrito
# CLASE: activo
# VERSIÓN: 1.3.0
# NOMBRE DE VERSIÓN: O01 control de ejecución con nomenclatura funcional
# FECHA: 2026-09-16
# ESTADO: vigente — consolidación de interfaz
# QUÉ HACE: valida planes y obliga a que validate_config atraviese la puerta completa de producción M01-M06 sin ejecutar cálculo territorial.
# CAMBIOS: adopta herramientas y artefactos con nomenclatura de orquestación; conserva contratos G10 internos sólo por compatibilidad de esquema/planes.
# MOTIVO: expresar la función real de la capa activa sin romper planes versionados existentes.
# ANTERIOR: O01 v1.2.0 en historial Git.
name: O01 · Controlar ejecución

on:
  pull_request:
    paths:
      - '.github/workflows/orquestacion-control.yml'
      - 'g10/**'
      - 'herramientas/orquestar_ejecucion.py'
      - 'herramientas/g10_orquestar.py'
      - 'herramientas/validar_contrato_territorial.py'
      - 'ddd_core/territory_contract.py'
      - '.dockerignore'
      - 'orchestracion/**'
      - 'schemas/g10-*.schema.json'
      - 'tests/test_g10_orquestacion.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/orquestacion-control.yml'
      - 'g10/**'
      - 'herramientas/orquestar_ejecucion.py'
      - 'herramientas/g10_orquestar.py'
      - 'herramientas/validar_contrato_territorial.py'
      - 'ddd_core/territory_contract.py'
      - '.dockerignore'
      - 'orchestracion/**'
      - 'schemas/g10-*.schema.json'
      - 'tests/test_g10_orquestacion.py'
  workflow_call:
    inputs:
      plan_path:
        description: Plan de orquestación versionado en el repositorio
        required: true
        default: orchestracion/plan_lote_g10_smoke.json
        type: string

permissions:
  contents: read

env:
  PLAN_PATH: ${{ inputs.plan_path || 'orchestracion/plan_lote_g10_smoke.json' }}

jobs:
  planificar:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Validar plan
        run: python herramientas/orquestar_ejecucion.py validate-plan --plan "$PLAN_PATH"
      - name: Construir matriz
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python herramientas/orquestar_ejecucion.py matrix --plan "$PLAN_PATH")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  ejecutar:
    needs: planificar
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.planificar.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Ejecutar acción permitida
        id: task
        shell: bash
        env:
          ACTION: ${{ matrix.action }}
          CONFIG: ${{ matrix.config }}
          TASK_ID: ${{ matrix.task_id }}
        run: |
          set +e
          mkdir -p "orquestacion-out/$TASK_ID"
          case "$ACTION" in
            g10_selftest)
              python -m unittest tests.test_g10_orquestacion -v >"orquestacion-out/$TASK_ID/task.log" 2>&1 ;;
            validate_config)
              docker build -t ddd-orquestacion:${GITHUB_SHA} . >"orquestacion-out/$TASK_ID/build.log" 2>&1 &&
              docker run --rm --entrypoint python ddd-orquestacion:${GITHUB_SHA} \
                herramientas/validar_contrato_territorial.py --params "$CONFIG" \
                >"orquestacion-out/$TASK_ID/task.log" 2>&1 ;;
            territory_m01_m06)
              echo "territory_m01_m06 requiere un plan de producción territorial aprobado" >"orquestacion-out/$TASK_ID/task.log"; false ;;
            *)
              echo "Acción no permitida: $ACTION" >"orquestacion-out/$TASK_ID/task.log"; false ;;
          esac
          code=$?
          echo "$code" >"orquestacion-out/$TASK_ID/exit_code"
          exit "$code"
      - name: Generar resumen aunque falle
        if: always()
        shell: bash
        env:
          TASK_ID: ${{ matrix.task_id }}
          TERRITORY: ${{ matrix.territory }}
          STAGE: CONTROL
        run: |
          set -euo pipefail
          out="orquestacion-out/$TASK_ID"; code="$(cat "$out/exit_code" 2>/dev/null || echo 99)"
          failure="$(python herramientas/orquestar_ejecucion.py classify --exit-code "$code" --log "$out/task.log" --stage "$STAGE")"
          python - "$out/resumen.json" "$TASK_ID" "$TERRITORY" "$code" "$failure" <<'PY'
          import json,sys
          path,task,territory,code,failure=sys.argv[1:]
          ok=int(code)==0
          json.dump({"schema_version":"1.0","task_id":task,"territory":territory,
            "fingerprint":"sha256:"+"0"*64,"attempt":1,"status":"SUCCESS" if ok else "REQUIRES_AGENT",
            "failure_class":None if ok else failure,"failed_stage":None if ok else "CONTROL",
            "last_valid_checkpoint":None,"metrics":{},"artifacts":["task.log"],
            "recommended_action":"CLOSE" if ok else "REVIEW","agent_required":not ok},open(path,"w"),indent=2)
          PY
      - name: Publicar resumen individual
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orquestacion-${{ matrix.task_id }}
          path: orquestacion-out/${{ matrix.task_id }}/

  resumir:
    if: always()
    needs: [planificar, ejecutar]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: orquestacion-*
          path: orquestacion-results
      - name: Agregar lote
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find orquestacion-results -name resumen.json -type f | sort)
          test "${#files[@]}" -gt 0
          python herramientas/orquestar_ejecucion.py aggregate --output RESUMEN_LOTE_ORQUESTACION.json "${files[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: orquestacion-resumen-lote-${{ github.run_id }}
          path: RESUMEN_LOTE_ORQUESTACION.json
