# PROYECTO: Diputado de Distrito
# CLASE: reutilizable interno
# VERSIÓN: 1.0.0
# NOMBRE: Publicador interno de GitHub Pages
# ESTADO: activo
# QUÉ HACE: despliega el sitio completo preservando el snapshot publicado del dashboard.
name: _Publicador Interno del Sitio

on:
  workflow_call:
    inputs:
      production_run_id:
        required: false
        type: string
      ensemble_release_tag:
        required: false
        type: string
      source_ref:
        required: false
        type: string
      target_page:
        required: false
        type: string
        default: Visor territorial

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RUN_ID: ${{ inputs.production_run_id || '' }}
      ENSEMBLE_RELEASE_TAG: ${{ inputs.ensemble_release_tag || '' }}
      TARGET_PAGE: ${{ inputs.target_page || 'Visor territorial' }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Preparar dependencias y validar activos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyproj
          node --check visor/app.js
          test -f publicado/dashboard/index.html
          test -f publicado/dashboard/app.js
          test -f publicado/dashboard/styles.css
          test -f publicado/dashboard/status.json
          python -m py_compile herramientas/preparar_visor_ejecucion.py herramientas/evaluar_publicacion_visor.py
      - name: Recuperar ejecución territorial solicitada
        if: ${{ inputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/production && mkdir -p /tmp/production
          gh run download "$PRODUCTION_RUN_ID" --pattern 'ddd-*' --dir /tmp/production
          test -n "$(find /tmp/production -type f -print -quit)" || { echo '::error::La ejecución solicitada no contiene artefactos DDD.'; exit 43; }
      - name: Acreditar identidad de la ejecución
        if: ${{ inputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/evaluar_publicacion_visor.py --requested-run-id "$PRODUCTION_RUN_ID" --production-root /tmp/production --phase source --output .ddd-publication/publicacion_visor.json --strict-request
      - name: Recuperar ensemble solicitado
        if: ${{ inputs.ensemble_release_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ensemble/download /tmp/ensemble/unpacked
          gh release download "$ENSEMBLE_RELEASE_TAG" --pattern "$ENSEMBLE_RELEASE_TAG.zip" --dir /tmp/ensemble/download
          archive="$(find /tmp/ensemble/download -name '*.zip' -print -quit)"; test -n "$archive"
          unzip -q "$archive" -d /tmp/ensemble/unpacked
      - name: Empaquetar sitio
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site/dashboard
          cp visor/index.html visor/app.js visor/styles.css site/
          cp -R publicado/dashboard/. site/dashboard/
          args=(--site site --static-registry orchestracion/productos_publicos.json)
          if [[ -n "$PRODUCTION_RUN_ID" ]]; then
            args+=(--production-root /tmp/production --production-run-id "$PRODUCTION_RUN_ID")
          fi
          [[ -n "$ENSEMBLE_RELEASE_TAG" ]] && args+=(--ensemble-root /tmp/ensemble/unpacked)
          python herramientas/preparar_visor_ejecucion.py "${args[@]}"
      - name: Acreditar resultado cargado
        shell: bash
        run: |
          set -euo pipefail
          args=(--requested-run-id "$PRODUCTION_RUN_ID" --registry site/data/viewer-results.json --phase prepared --output .ddd-publication/publicacion_visor.json)
          [[ -n "$PRODUCTION_RUN_ID" ]] && args+=(--production-root /tmp/production --strict-request)
          python herramientas/evaluar_publicacion_visor.py "${args[@]}"
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v4
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Registrar evidencia
        if: always()
        shell: bash
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-publication
          args=(--requested-run-id "$PRODUCTION_RUN_ID" --registry site/data/viewer-results.json --viewer-url "$PAGE_URL" --deployment-outcome "$DEPLOYMENT_OUTCOME" --phase final --output .ddd-publication/publicacion_visor.json)
          [[ -n "$PRODUCTION_RUN_ID" && -d /tmp/production ]] && args+=(--production-root /tmp/production)
          python herramientas/evaluar_publicacion_visor.py "${args[@]}"
          case "$TARGET_PAGE" in "Dashboard operativo") rel="dashboard/";; *) rel="";; esac
          jq -n --arg pagina "$TARGET_PAGE" --arg url "$PAGE_URL$rel" --arg pages_root "$PAGE_URL" --arg run_id "$GITHUB_RUN_ID" '{pagina_solicitada:$pagina,url_objetivo:$url,pages_root:$pages_root,workflow_run_id:$run_id}' > .ddd-publication/pagina_publicada.json
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-publication-${{ github.run_id }}
          path: .ddd-publication
          if-no-files-found: error
          retention-days: 30
