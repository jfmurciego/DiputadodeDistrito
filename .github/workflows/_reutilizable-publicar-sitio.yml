# PROYECTO: Diputado de Distrito
# CLASE: reutilizable interno
# VERSIÓN: 2.0.0
# NOMBRE: Publicador interno multiterritorio de GitHub Pages
# ESTADO: candidato
# QUÉ HACE: registra promociones durables y reconstruye el sitio completo desde todas ellas.
name: _Publicador Interno del Sitio

on:
  workflow_call:
    inputs:
      production_run_id:
        required: false
        type: string
      ensemble_release_tag:
        required: false
        type: string
      source_ref:
        required: false
        type: string
      target_page:
        required: false
        type: string
        default: Visor territorial

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ddd-pages-prod
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RUN_ID: ${{ inputs.production_run_id || '' }}
      ENSEMBLE_RELEASE_TAG: ${{ inputs.ensemble_release_tag || '' }}
      TARGET_PAGE: ${{ inputs.target_page || 'Visor territorial' }}
      PYTHONPATH: ${{ github.workspace }}
      PUBLICATION_REGISTRY: orchestracion/publicaciones_visor.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          token: ${{ github.token }}
      - name: Preparar dependencias y validar activos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyproj PyYAML==6.0.2
          node --check visor/app.js
          test -f publicado/dashboard/index.html
          test -f publicado/dashboard/app.js
          test -f publicado/dashboard/styles.css
          test -f publicado/dashboard/status.json
          test -f "$PUBLICATION_REGISTRY"
          python -m py_compile herramientas/preparar_visor_ejecucion.py herramientas/evaluar_publicacion_visor.py herramientas/registro_publicaciones_visor.py

      - name: Recuperar ejecución territorial solicitada
        if: ${{ inputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/production && mkdir -p /tmp/production
          gh run download "$PRODUCTION_RUN_ID" --pattern 'ddd-*' --dir /tmp/production
          test -n "$(find /tmp/production -type f -print -quit)" || { echo '::error::La ejecución solicitada no contiene artefactos DDD.'; exit 43; }

      - name: Acreditar identidad de la ejecución descargada
        if: ${{ inputs.production_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/evaluar_publicacion_visor.py --requested-run-id "$PRODUCTION_RUN_ID" --production-root /tmp/production --phase source --output .ddd-publication/publicacion_visor.json --strict-request

      - name: Recuperar ensemble solicitado
        if: ${{ inputs.ensemble_release_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ensemble && mkdir -p /tmp/ensemble/download /tmp/ensemble/unpacked
          gh release download "$ENSEMBLE_RELEASE_TAG" --pattern "$ENSEMBLE_RELEASE_TAG.zip" --dir /tmp/ensemble/download
          archive="$(find /tmp/ensemble/download -name '*.zip' -print -quit)"; test -n "$archive"
          unzip -q "$archive" -d /tmp/ensemble/unpacked

      - name: Promover solicitud al registro durable
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PRODUCTION_RUN_ID" ]]; then
            python herramientas/registro_publicaciones_visor.py --registry "$PUBLICATION_REGISTRY" promote-production               --production-root /tmp/production --run-id "$PRODUCTION_RUN_ID"
          fi
          if [[ -n "$ENSEMBLE_RELEASE_TAG" ]]; then
            python herramientas/registro_publicaciones_visor.py --registry "$PUBLICATION_REGISTRY" promote-ensemble               --ensemble-root /tmp/ensemble/unpacked --release-tag "$ENSEMBLE_RELEASE_TAG"
          fi

      - name: Persistir registro durable antes del despliegue
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$PUBLICATION_REGISTRY"; then
            exit 0
          fi
          [[ "$GITHUB_REF_NAME" == "main" ]] || { echo "::error::Las promociones publicables sólo pueden persistirse desde main."; exit 45; }
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$PUBLICATION_REGISTRY"
          git commit -m "chore: registrar publicación del visor"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            [[ "$attempt" == 3 ]] && { echo "::error::No se pudo persistir el registro de publicaciones."; exit 48; }
            sleep $((attempt * 2))
          done

      - name: Recuperar todos los productos promovidos
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/publications && mkdir -p /tmp/publications
          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            id="$(jq -r .id <<<"$row")"
            run_id="$(jq -r .run_id <<<"$row")"
            artifact="$(jq -r .artifact_name <<<"$row")"
            mkdir -p "/tmp/publications/$id"
            gh run download "$run_id" --name "$artifact" --dir "/tmp/publications/$id"
          done < <(jq -c '.products[]? | select(.source_type=="workflow_artifact")' "$PUBLICATION_REGISTRY")
          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            id="$(jq -r .id <<<"$row")"
            tag="$(jq -r .release_tag <<<"$row")"
            mkdir -p "/tmp/publications/$id/download" "/tmp/publications/$id/unpacked"
            gh release download "$tag" --pattern "$tag.zip" --dir "/tmp/publications/$id/download"
            archive="$(find "/tmp/publications/$id/download" -name '*.zip' -print -quit)"; test -n "$archive"
            unzip -q "$archive" -d "/tmp/publications/$id/unpacked"
            shopt -s dotglob nullglob
            mv "/tmp/publications/$id/unpacked"/* "/tmp/publications/$id/" || true
            rmdir "/tmp/publications/$id/unpacked" 2>/dev/null || true
          done < <(jq -c '.ensembles[]? | select(.source_type=="release")' "$PUBLICATION_REGISTRY")

      - name: Empaquetar sitio completo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site/dashboard
          cp visor/index.html visor/app.js visor/styles.css site/
          cp -R publicado/dashboard/. site/dashboard/
          python herramientas/preparar_visor_ejecucion.py             --site site             --publication-registry "$PUBLICATION_REGISTRY"             --materialized-root /tmp/publications             --repository-root .

      - name: Acreditar resultado realmente cargado
        shell: bash
        run: |
          set -euo pipefail
          args=(--requested-run-id "$PRODUCTION_RUN_ID" --registry site/data/viewer-results.json --phase prepared --output .ddd-publication/publicacion_visor.json)
          [[ -n "$PRODUCTION_RUN_ID" ]] && args+=(--production-root /tmp/production --strict-request)
          python herramientas/evaluar_publicacion_visor.py "${args[@]}"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Registrar evidencia
        if: always()
        shell: bash
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-publication
          args=(--requested-run-id "$PRODUCTION_RUN_ID" --registry site/data/viewer-results.json --viewer-url "$PAGE_URL" --deployment-outcome "$DEPLOYMENT_OUTCOME" --phase final --output .ddd-publication/publicacion_visor.json)
          [[ -n "$PRODUCTION_RUN_ID" && -d /tmp/production ]] && args+=(--production-root /tmp/production)
          python herramientas/evaluar_publicacion_visor.py "${args[@]}"
          case "$TARGET_PAGE" in "Dashboard operativo") rel="dashboard/";; *) rel="";; esac
          jq -n --arg pagina "$TARGET_PAGE" --arg url "$PAGE_URL$rel" --arg pages_root "$PAGE_URL" --arg run_id "$GITHUB_RUN_ID" '{pagina_solicitada:$pagina,url_objetivo:$url,pages_root:$pages_root,workflow_run_id:$run_id}' > .ddd-publication/pagina_publicada.json

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-publication-${{ github.run_id }}
          path: .ddd-publication
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
