# PROYECTO: Diputado de Distrito
# CLASE: interfaz operativa principal
# VERSIÓN: 6.0.0
# NOMBRE DE VERSIÓN: Producción empresarial con cuatro controles
# FECHA: 2026-09-17
# ESTADO: candidato
# QUÉ HACE: expone únicamente territorio, edición, publicación y confirmación; resuelve automáticamente contrato, fuentes, reutilización, checkpoint y recorrido.
# CAMBIOS: elimina controles técnicos del formulario y convierte la operación productiva en una secuencia empresarial automática.
# COMPATIBILIDAD: mantiene la cadena M01–M08 y sus contratos internos sin alterar algoritmos ni parámetros territoriales.
# ANTERIOR: versión 5.0.0 en historial Git.
name: Producción de distritos

on:
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        default: La Rioja
        type: choice
        options:
          - Andalucía
          - Aragón
          - Principado de Asturias
          - Islas Baleares
          - Canarias
          - Cantabria
          - Castilla-La Mancha
          - Castilla y León
          - Cataluña
          - Comunidad Valenciana
          - Extremadura
          - Galicia
          - Comunidad de Madrid
          - Región de Murcia
          - Comunidad Foral de Navarra
          - País Vasco
          - La Rioja
          - Ceuta
          - Melilla
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options:
          - '2025'
      publish_result:
        description: Publicar resultado
        required: true
        default: true
        type: boolean
      confirmar_ejecucion:
        description: Confirmar ejecución
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  preparar:
    name: Preparar contrato y reanudación
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      params: ${{ steps.resolve.outputs.params }}
      from_stage: ${{ steps.checkpoint.outputs.from_stage }}
      to_stage: ${{ steps.resolve.outputs.to_stage }}
      checkpoint_run_id: ${{ steps.checkpoint.outputs.checkpoint_run_id }}
    steps:
      - uses: actions/checkout@v6
      - id: resolve
        name: Resolver territorio, edición y recorrido necesario
        shell: bash
        env:
          UI_TERRITORY: ${{ inputs.territory_id }}
          UI_EDITION: ${{ inputs.data_edition }}
          UI_PUBLISH: ${{ inputs.publish_result }}
        run: |
          set -euo pipefail
          case "$UI_TERRITORY" in
            "Andalucía"|andalucia) territory_id=andalucia ;;
            "Aragón"|aragon) territory_id=aragon ;;
            "Principado de Asturias"|principado_de_asturias) territory_id=principado_de_asturias ;;
            "Islas Baleares"|illes_balears) territory_id=illes_balears ;;
            "Canarias"|canarias) territory_id=canarias ;;
            "Cantabria"|cantabria) territory_id=cantabria ;;
            "Castilla-La Mancha"|castilla_la_mancha) territory_id=castilla_la_mancha ;;
            "Castilla y León"|castilla_y_leon) territory_id=castilla_y_leon ;;
            "Cataluña"|cataluna) territory_id=cataluna ;;
            "Comunidad Valenciana"|comunidad_valenciana) territory_id=comunidad_valenciana ;;
            "Extremadura"|extremadura) territory_id=extremadura ;;
            "Galicia"|galicia) territory_id=galicia ;;
            "Comunidad de Madrid"|madrid) territory_id=madrid ;;
            "Región de Murcia"|region_de_murcia) territory_id=region_de_murcia ;;
            "Comunidad Foral de Navarra"|comunidad_foral_de_navarra) territory_id=comunidad_foral_de_navarra ;;
            "País Vasco"|pais_vasco) territory_id=pais_vasco ;;
            "La Rioja"|la_rioja) territory_id=la_rioja ;;
            "Ceuta"|ceuta) territory_id=ceuta ;;
            "Melilla"|melilla) territory_id=melilla ;;
            *) echo "::error::Territorio no reconocido: $UI_TERRITORY"; exit 1 ;;
          esac
          [[ "$UI_EDITION" =~ ^[0-9]{4}$ ]] || { echo "::error::Edición no válida: $UI_EDITION"; exit 2; }
          params="territorios/$territory_id/config/${territory_id}_${UI_EDITION}.yaml"
          test -f "$params" || { echo "::error::No existe contrato para $UI_TERRITORY, edición $UI_EDITION: $params"; exit 3; }
          if [[ "$UI_PUBLISH" == true ]]; then to_stage=M08; else to_stage=M07; fi
          {
            echo "territory_id=$territory_id"
            echo "params=$params"
            echo "to_stage=$to_stage"
          } >> "$GITHUB_OUTPUT"

      - id: checkpoint
        name: Resolver automáticamente fuentes reutilizables y último checkpoint compatible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ steps.resolve.outputs.territory_id }}
          PARAMS: ${{ steps.resolve.outputs.params }}
          TO_STAGE: ${{ steps.resolve.outputs.to_stage }}
        run: |
          set -euo pipefail
          checkpoint_run_id=''
          from_stage=M01
          target_num="${TO_STAGE#M}"
          api="repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&status=completed&per_page=100"
          mapfile -t run_ids < <(gh api "$api" --jq '.workflow_runs[].id')

          for run_id in "${run_ids[@]}"; do
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            jq -e --arg n "ddd-decision-$run_id" '.artifacts[] | select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
            tmp_decision="$(mktemp -d)"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "ddd-decision-$run_id" --dir "$tmp_decision" >/dev/null 2>&1; then
              rm -rf "$tmp_decision"; continue
            fi
            decision="$(find "$tmp_decision" -name decision.json -type f -print -quit)"
            if [[ -z "$decision" ]] || [[ "$(jq -r '.territory_id // empty' "$decision")" != "$TERRITORY_ID" ]] || [[ "$(jq -r '.params // empty' "$decision")" != "$PARAMS" ]]; then
              rm -rf "$tmp_decision"; continue
            fi
            rm -rf "$tmp_decision"

            for ((stage_num=target_num-1; stage_num>=1; stage_num--)); do
              stage="M$(printf '%02d' "$stage_num")"
              artifact_name="ddd-state-$run_id-$stage"
              jq -e --arg n "$artifact_name" '.artifacts[] | select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
              tmp_state="$(mktemp -d)"
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$tmp_state" >/dev/null 2>&1 \
                 && find "$tmp_state" -type f -path '*/sources/manifest.json' -print -quit | grep -q .; then
                checkpoint_run_id="$run_id"
                from_stage="M$(printf '%02d' "$((stage_num+1))")"
                rm -rf "$tmp_state"
                break 2
              fi
              rm -rf "$tmp_state"
            done
          done

          {
            echo "checkpoint_run_id=$checkpoint_run_id"
            echo "from_stage=$from_stage"
          } >> "$GITHUB_OUTPUT"

  producir:
    name: Procesar territorio
    needs: preparar
    uses: ./.github/workflows/_reutilizable-operacion-territorial.yml
    with:
      params: ${{ needs.preparar.outputs.params }}
      territory_id: ${{ needs.preparar.outputs.territory_id }}
      operation: producir_resultado_m01_m08
      from_stage: ${{ needs.preparar.outputs.from_stage }}
      to_stage: ${{ needs.preparar.outputs.to_stage }}
      checkpoint_run_id: ${{ needs.preparar.outputs.checkpoint_run_id }}
      execution_confirmed: ${{ inputs.confirmar_ejecucion }}
