# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Bootstrap territorial reutilizable M01-M03
# FECHA: 2026-09-12
# ESTADO: vigente — R022
# QUÉ HACE: ejecuta observación M01-M03 para un territorio del catálogo, publica resumen ligero y separa artefactos pesados.
# CAMBIOS: primera versión.
# MOTIVO: concentrar el cálculo en GitHub Actions sin clonar workflows por comunidad autónoma.
# ANTERIOR: ninguno — workflow nuevo.
name: Reutilizable — bootstrap territorial M01-M03
on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
permissions: {contents: read}
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TID: ${{ inputs.territory_id }}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: false, fetch-depth: 1}
      - name: Fuentes y entorno
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
          docker build --pull -t ddd-bootstrap:${GITHUB_SHA} .
      - name: Generar contrato observable
        run: |
          set -euo pipefail
          mkdir -p "territorios/$TID/config"
          python herramientas/generar_config_bootstrap.py --territory "$TID" --out "territorios/$TID/config/.generated_bootstrap_2025.yaml"
      - name: Ejecutar M01-M03
        run: |
          set -euo pipefail
          CFG="territorios/$TID/config/.generated_bootstrap_2025.yaml"
          docker run --rm -v "$PWD:/app" --entrypoint bash ddd-bootstrap:${GITHUB_SHA} -lc "
            python modulos/01_preparar_base_territorial.py --params '$CFG'
            python modulos/02_construir_adyacencias.py --params '$CFG'
            python modulos/03_construir_grafo.py --params '$CFG'"
          sudo chown -R "$(id -u):$(id -g)" "territorios/$TID/.cache/ddd"
      - name: Resumen ligero
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          tid=os.environ["TID"];run=f"{tid}_2025";b=pathlib.Path("territorios")/tid/".cache/ddd/preparacion"/run
          m1=json.loads((b/f"{run}_m01_informe.json").read_text())
          m3=json.loads((b/f"{run}_m03_informe.json").read_text())
          out={"territory_id":tid,"run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"m01":{"sections":m1.get("rows_out"),"missing_population":m1.get("missing_population_rows"),"provinces":m1.get("province_codes")},"m03":{"nodes":m3.get("nodes"),"edges":m3.get("edges"),"isolated":m3.get("isolated"),"total_population":m3.get("total_pop"),"global_components":m3.get("global_component_audit",{}).get("components"),"province_disconnected":m3.get("province_component_audit",{}).get("disconnected"),"municipality_disconnected":m3.get("municipality_component_audit",{}).get("disconnected")},"status":"OBSERVATION"}
          (b/"RESUMEN_BOOTSTRAP.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Publicar resumen
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ inputs.territory_id }}-summary-${{ github.run_id }}
          path: |
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/RESUMEN_BOOTSTRAP.json
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_m01_informe.json
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_m03_informe.json
      - name: Publicar artefactos pesados
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ inputs.territory_id }}-heavy-${{ github.run_id }}
          path: |
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*.geojson.zip
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_m02_adyacencias.jsonl
            territorios/${{ inputs.territory_id }}/.cache/ddd/preparacion/${{ inputs.territory_id }}_2025/*_m03_grafo.json
