# PROYECTO: Diputado de Distrito
# CLASE: interfaz operativa principal — Diseño A
# VERSIÓN: 8.1.0
# NOMBRE DE VERSIÓN: Generación de distritos autonómicos
# FECHA: 2026-09-20
# ESTADO: candidato
# QUÉ HACE: genera y certifica distritos autonómicos para un territorio y una edición; no incorpora resultados electorales ni publica el visor.
# CAMBIOS: incorpora selección funcional de estrategia 02.5: Canónico, GerryChain, GerryChain 25 o GerryChain 50; la elección viaja hasta M05 y obliga a ejecutar M05 para alternativas GerryChain.
# COMPATIBILIDAD: mantiene la cadena M01–M08 y sus contratos internos sin alterar algoritmos ni parámetros territoriales.
# ANTERIOR: versión 6.1.0 en historial Git.
name: 02 · Generación de Distritos Autonómicos

on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
      data_edition: {required: true, type: string}
      execution_mode: {required: false, type: string, default: reuse}
      optimization_algorithm: {required: false, type: string, default: Canónico}
      source_package_run_id: {required: false, type: string, default: ''}
      source_package_artifact_name: {required: false, type: string, default: ''}
      source_ref: {required: false, type: string, default: ''}
      persist_state: {required: false, type: boolean, default: true}
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        default: Castilla y León
        type: choice
        options:
          - Andalucía
          - Aragón
          - Principado de Asturias
          - Islas Baleares
          - Canarias
          - Cantabria
          - Castilla-La Mancha
          - Castilla y León
          - Cataluña
          - Comunidad Valenciana
          - Extremadura
          - Galicia
          - Comunidad de Madrid
          - Región de Murcia
          - Comunidad Foral de Navarra
          - País Vasco
          - La Rioja
          - Ceuta
          - Melilla
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options:
          - '2025'
      execution_mode:
        description: Modo de ejecución
        required: true
        default: Reutilizar progreso existente
        type: choice
        options:
          - Reutilizar progreso existente
          - Ejecutar desde el principio
      optimization_algorithm:
        description: Estrategia de optimización 02.5
        required: true
        default: Canónico
        type: choice
        options:
          - Canónico
          - GerryChain
          - GerryChain 25
          - GerryChain 50

concurrency:
  group: ddd-territorial-prod-${{ inputs.territory_id }}-${{ inputs.data_edition }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  resolver_interfaz:
    name: Preparar contrato y reanudación
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      params: ${{ steps.resolve.outputs.params }}
      from_stage: ${{ steps.checkpoint.outputs.from_stage }}
      to_stage: ${{ steps.resolve.outputs.to_stage }}
      product: ${{ steps.resolve.outputs.product }}
      checkpoint_policy: ${{ steps.resolve.outputs.checkpoint_policy }}
      prepared_source_run_id: ${{ steps.resolve.outputs.prepared_source_run_id }}
      prepared_source_artifact_name: ${{ steps.resolve.outputs.prepared_source_artifact_name }}
      checkpoint_run_id: ${{ steps.checkpoint.outputs.checkpoint_run_id }}
      source_package_run_id: ${{ steps.source_package.outputs.run_id }}
      source_package_artifact_name: ${{ steps.source_package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: resolve
        name: Resolver territorio, edición y recorrido necesario
        shell: bash
        env:
          UI_TERRITORY: ${{ inputs.territory_id }}
          UI_EDITION: ${{ inputs.data_edition }}
          UI_PRODUCT: Distritos
        run: |
          set -euo pipefail
          mkdir -p .ddd-checkpoint-selection
          printf '{"status":"INITIALIZED","run_id":"%s"}\n' "$GITHUB_RUN_ID" > .ddd-checkpoint-selection/resolucion_inicial.json
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 >/dev/null
          python herramientas/catalogo_preparacion.py --root-dir . validate
          row="$(python herramientas/catalogo_preparacion.py resolve --mode generation --territory "$UI_TERRITORY" --edition "$UI_EDITION")"
          territory_id="$(jq -r '.territory_id' <<<"$row")"
          params="$(jq -r '.contract_path // empty' <<<"$row")"
          [[ -n "$params" && -f "$params" ]] || { echo "::error::Contrato productivo no materializado: $params"; exit 3; }
          route="$(python herramientas/resolver_producto_produccion.py --product "$UI_PRODUCT")"
          {
            echo "territory_id=$territory_id"
            echo "params=$params"
            echo "product=$UI_PRODUCT"
            echo "to_stage=$(jq -r .to_stage <<<"$route")"
            echo "checkpoint_policy=$(jq -r .checkpoint_policy <<<"$route")"
            echo "prepared_source_run_id=$(jq -r '.preparation_evidence.run_id // empty' <<<"$row")"
            echo "prepared_source_artifact_name=$(jq -r '.preparation_evidence.artifact_name // empty' <<<"$row")"
          } >> "$GITHUB_OUTPUT"

      - id: checkpoint
        name: Validar y resolver último checkpoint reutilizable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ steps.resolve.outputs.territory_id }}
          PARAMS: ${{ steps.resolve.outputs.params }}
          TO_STAGE: ${{ steps.resolve.outputs.to_stage }}
          PRODUCT: ${{ steps.resolve.outputs.product }}
          CHECKPOINT_POLICY: ${{ steps.resolve.outputs.checkpoint_policy }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          OPTIMIZATION_ALGORITHM: ${{ inputs.optimization_algorithm }}
        run: |
          set -euo pipefail
          checkpoint_run_id=''
          from_stage=M01
          mode="$EXECUTION_MODE"
          [[ "$mode" == "Ejecutar desde el principio" ]] && mode=from_start
          [[ "$mode" == "Reutilizar progreso existente" ]] && mode=reuse
          if [[ "$mode" == from_start ]]; then
            mkdir -p .ddd-checkpoint-selection
            printf '[]\n' > .ddd-checkpoint-selection/checkpoints_descartados.json
            jq -cn --arg territory_id "$TERRITORY_ID" --arg params "$PARAMS"               '{territory_id:$territory_id,params:$params,checkpoint_run_id:"",from_stage:"M01",execution_mode:"from_start"}'               > .ddd-checkpoint-selection/seleccion_checkpoint.json
            {
              echo "checkpoint_run_id="
              echo "from_stage=M01"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target_num="$((10#${TO_STAGE#M}))"
          if [[ "$CHECKPOINT_POLICY" == require_m06 ]]; then
            search_from=6
            search_to=6
          elif [[ "$CHECKPOINT_POLICY" == latest_through_m06 ]]; then
            search_from=6
            search_to=1
          elif [[ "$CHECKPOINT_POLICY" == latest_before_target ]]; then
            # El usuario ha elegido explícitamente cómo ejecutar 02.5. Esa elección
            # debe ejecutarse siempre: reutilizamos como máximo M04 y recalculamos
            # optimización + consolidación, tanto para Canónico como para GerryChain.
            search_from=4
            search_to=1
          else
            search_from=$target_num
            search_to=1
          fi
          mkdir -p .ddd-checkpoint-selection
          : > .ddd-checkpoint-selection/checkpoints_descartados.jsonl
          api="repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&status=completed&per_page=100"
          mapfile -t run_ids < <(gh api "$api" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')

          record_discard() {
            local run_id="$1" stage="$2" reason="$3"
            jq -cn --arg run_id "$run_id" --arg stage "$stage" --arg reason "$reason" \
              '{run_id:$run_id,stage:$stage,reason:$reason}' >> .ddd-checkpoint-selection/checkpoints_descartados.jsonl
          }

          for run_id in "${run_ids[@]}"; do
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            jq -e --arg n "ddd-decision-$run_id" '.artifacts[] | select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
            tmp_decision="$(mktemp -d)"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "ddd-decision-$run_id" --dir "$tmp_decision" >/dev/null 2>&1; then
              rm -rf "$tmp_decision"; continue
            fi
            decision="$(find "$tmp_decision" -name decision.json -type f -print -quit)"
            if [[ -z "$decision" ]]; then
              record_discard "$run_id" decision "decision.json ausente"
              rm -rf "$tmp_decision"; continue
            fi
            if [[ "$(jq -r '.territory_id // empty' "$decision")" != "$TERRITORY_ID" ]]; then
              rm -rf "$tmp_decision"; continue
            fi
            if [[ "$(jq -r '.params // empty' "$decision")" != "$PARAMS" ]]; then
              record_discard "$run_id" decision "contrato o edición distintos"
              rm -rf "$tmp_decision"; continue
            fi
            rm -rf "$tmp_decision"

            for ((stage_num=search_from; stage_num>=search_to; stage_num--)); do
              stage="M$(printf '%02d' "$stage_num")"
              artifact_name="ddd-state-$run_id-$stage"
              jq -e --arg n "$artifact_name" '.artifacts[] | select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
              tmp_state="$(mktemp -d)"
              if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$tmp_state" >/dev/null 2>&1; then
                record_discard "$run_id" "$stage" "no se pudo recuperar el checkpoint"
                rm -rf "$tmp_state"; continue
              fi
              source_dir="$(find "$tmp_state" -type f -path '*/sources/manifest.json' -printf '%h\n' | sort | head -1)"
              if [[ -z "$source_dir" ]]; then
                record_discard "$run_id" "$stage" "sources/manifest.json ausente"
                rm -rf "$tmp_state"; continue
              fi

              candidate_json="$tmp_state/validacion_checkpoint.json"
              set +e
              python -m herramientas.seleccionar_checkpoint_productivo \
                --params "$PARAMS" --package "$source_dir" --state-root "$tmp_state" \
                --run-id "$run_id" --stage "$stage" --root-dir . > "$candidate_json"
              validation_rc=$?
              set -e
              if (( validation_rc == 0 )); then
                requires_derivation="$(jq -r '.requires_derivation // false' "$candidate_json")"
                if [[ "$CHECKPOINT_POLICY" == latest_before_target && "$stage_num" -ge "$target_num" && "$requires_derivation" != true ]]; then
                  record_discard "$run_id" "$stage" "checkpoint no anterior al objetivo y sin derivación requerida"
                  rm -rf "$tmp_state"
                  continue
                fi
                cp "$candidate_json" .ddd-checkpoint-selection/checkpoint_seleccionado.json
                if [[ "$requires_derivation" == true ]]; then
                  rm -rf .ddd-derived-checkpoint
                  python herramientas/derivar_checkpoint_acumulado.py \
                    --params "$PARAMS" --state-root "$tmp_state" \
                    --target-stage M04 --output .ddd-derived-checkpoint \
                    > .ddd-checkpoint-selection/derivacion_checkpoint.json
                  checkpoint_run_id="$GITHUB_RUN_ID"
                  from_stage="$(jq -r '.from_stage' "$candidate_json")"
                  echo "derived_checkpoint=true" >> "$GITHUB_OUTPUT"
                  echo "derived_from_run_id=$run_id" >> "$GITHUB_OUTPUT"
                else
                  checkpoint_run_id="$run_id"
                  from_stage="$(jq -r '.from_stage // empty' "$candidate_json")"
                  [[ -n "$from_stage" ]] || from_stage="M$(printf '%02d' "$((stage_num+1))")"
                  echo "derived_checkpoint=false" >> "$GITHUB_OUTPUT"
                fi
                rm -rf "$tmp_state"
                break 2
              elif (( validation_rc == 2 )); then
                reason="$(jq -r '.reason // "validación de fuentes rechazada"' "$candidate_json" 2>/dev/null || echo 'validación de fuentes rechazada')"
                record_discard "$run_id" "$stage" "$reason"
                rm -rf "$tmp_state"
                continue
              else
                echo "::error::Falló el validador de checkpoint para run $run_id, $stage (rc=$validation_rc)."
                cat "$candidate_json" || true
                rm -rf "$tmp_state"
                exit "$validation_rc"
              fi
            done
          done

          if [[ "$CHECKPOINT_POLICY" == require_m06 && -z "$checkpoint_run_id" ]]; then
            echo "::error::Resultados electorales requiere un checkpoint M06 válido; no se recalculará M01–M06."
            exit 44
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.ddd-checkpoint-selection/checkpoints_descartados.jsonl')
          rows=[json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip()]
          Path('.ddd-checkpoint-selection/checkpoints_descartados.json').write_text(
              json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          jq -cn --arg checkpoint_run_id "$checkpoint_run_id" --arg from_stage "$from_stage" \
            --arg territory_id "$TERRITORY_ID" --arg params "$PARAMS" \
            '{territory_id:$territory_id,params:$params,checkpoint_run_id:$checkpoint_run_id,from_stage:$from_stage}' \
            > .ddd-checkpoint-selection/seleccion_checkpoint.json
          {
            echo "checkpoint_run_id=$checkpoint_run_id"
            echo "from_stage=$from_stage"
          } >> "$GITHUB_OUTPUT"

      - name: Publicar checkpoint M04 derivado
        if: ${{ steps.checkpoint.outputs.derived_checkpoint == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-state-${{ github.run_id }}-M04
          path: .ddd-derived-checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - id: source_package
        name: Resolver paquete territorial preparado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ steps.resolve.outputs.territory_id }}
          EDITION: ${{ inputs.data_edition }}
          CHECKPOINT_RUN_ID: ${{ steps.checkpoint.outputs.checkpoint_run_id }}
          PREPARED_SOURCE_RUN_ID: ${{ steps.resolve.outputs.prepared_source_run_id }}
          PREPARED_SOURCE_ARTIFACT_NAME: ${{ steps.resolve.outputs.prepared_source_artifact_name }}
          OVERRIDE_SOURCE_RUN_ID: ${{ inputs.source_package_run_id }}
          OVERRIDE_SOURCE_ARTIFACT_NAME: ${{ inputs.source_package_artifact_name }}
        run: |
          set -euo pipefail
          if [[ -n "$CHECKPOINT_RUN_ID" ]]; then
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "artifact_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          validate_candidate() {
            local run_id="$1" artifact_name="$2" tmp
            [[ -n "$run_id" && -n "$artifact_name" ]] || return 1
            tmp="$(mktemp -d)"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$tmp" >/dev/null 2>&1; then
              rm -rf "$tmp"
              return 1
            fi
            if python -m herramientas.seleccionar_paquete_fuentes \
              --package "$tmp" --territory-id "$TERRITORY_ID" --edition "$EDITION" >/dev/null; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
              rm -rf "$tmp"
              return 0
            fi
            rm -rf "$tmp"
            return 1
          }

          if validate_candidate "$OVERRIDE_SOURCE_RUN_ID" "$OVERRIDE_SOURCE_ARTIFACT_NAME"; then
            exit 0
          fi
          if validate_candidate "$PREPARED_SOURCE_RUN_ID" "$PREPARED_SOURCE_ARTIFACT_NAME"; then
            exit 0
          fi

          prefix="ddd-source-package-$TERRITORY_ID-$EDITION-"
          mapfile -t candidates < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" |
              jq -r --arg p "$prefix" '.artifacts[]? | select((.name|startswith($p)) and (.expired|not)) | "\(.workflow_run.id)|\(.name)"'
          )
          for candidate in "${candidates[@]}"; do
            run_id="${candidate%%|*}"
            artifact_name="${candidate#*|}"
            [[ "$run_id" == "$PREPARED_SOURCE_RUN_ID" && "$artifact_name" == "$PREPARED_SOURCE_ARTIFACT_NAME" ]] && continue
            if validate_candidate "$run_id" "$artifact_name"; then
              exit 0
            fi
          done

          echo "::error::La generación requiere datos territoriales preparados, íntegros y de la misma edición."
          exit 46

      - name: Publicar decisión de reanudación
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ddd-checkpoint-selection-${{ github.run_id }}
          path: .ddd-checkpoint-selection
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  ruta:
    name: Generar y certificar distritos
    needs: resolver_interfaz
    uses: ./.github/workflows/_reutilizable-generacion-territorial.yml
    secrets: inherit
    with:
      params: ${{ needs.resolver_interfaz.outputs.params }}
      mode: execute
      from_stage: ${{ needs.resolver_interfaz.outputs.from_stage }}
      to_stage: ${{ needs.resolver_interfaz.outputs.to_stage }}
      checkpoint_run_id: ${{ needs.resolver_interfaz.outputs.checkpoint_run_id }}
      source_package_run_id: ${{ needs.resolver_interfaz.outputs.source_package_run_id }}
      source_package_artifact_name: ${{ needs.resolver_interfaz.outputs.source_package_artifact_name }}
      execution_authorization: EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION
      source_ref: ${{ inputs.source_ref }}
      persist_state: ${{ github.event_name == 'workflow_dispatch' || inputs.persist_state }}
      optimization_algorithm: ${{ inputs.optimization_algorithm }}

