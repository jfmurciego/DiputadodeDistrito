# PROYECTO: Diputado de Distrito
# VERSIÓN: 1.0.0
# NOMBRE DE VERSIÓN: Diseño A — producción única con catálogo de preparación
# FECHA: 2026-09-18
# ESTADO: candidato
# CAMBIOS: consolida interfaz, cadena M01-M08 y publicación en un único workflow visible.
# MOTIVO: separar preparación, producción y pruebas sin alterar la lógica territorial.
# ANTERIOR: legacy/workflows/producir-territorio-por-contrato_v2.3.0.yml
# OPCIONES: generadas/verificadas contra configuracion/catalogo_preparacion.yaml
name: Producción de distritos

on:
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        type: choice
        options:
          - Aragón
          - Castilla y León
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options:
          - '2025'
      publish_result:
        description: Publicar resultado
        required: true
        default: true
        type: boolean
      confirmar_ejecucion:
        description: Confirmar ejecución
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ddd-production-${{ inputs.territory_id }}-${{ inputs.data_edition }}
  cancel-in-progress: false

jobs:
  resolver_interfaz:
    name: Preparar contrato y reanudación
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      params: ${{ steps.resolve.outputs.params }}
      from_stage: ${{ steps.checkpoint.outputs.from_stage }}
      to_stage: ${{ steps.resolve.outputs.to_stage }}
      checkpoint_run_id: ${{ steps.checkpoint.outputs.checkpoint_run_id }}
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        name: Resolver opción productiva desde catálogo
        env:
          TERRITORY: ${{ inputs.territory_id }}
          EDITION: ${{ inputs.data_edition }}
          PUBLISH: ${{ inputs.publish_result }}
          CONFIRM: ${{ inputs.confirmar_ejecucion }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == true ]] || { echo "::error::La producción requiere confirmación explícita."; exit 20; }
          python herramientas/catalogo_preparacion.py validate
          row="$(python herramientas/catalogo_preparacion.py resolve --mode production --territory "$TERRITORY" --edition "$EDITION")"
          territory_id="$(jq -r .territory_id <<<"$row")"; params="$(jq -r .params <<<"$row")"
          test -f "$params" || { echo "::error::Contrato no encontrado: $params"; exit 21; }
          [[ "$PUBLISH" == true ]] && to_stage=M08 || to_stage=M07
          echo "territory_id=$territory_id" >> "$GITHUB_OUTPUT"; echo "params=$params" >> "$GITHUB_OUTPUT"; echo "to_stage=$to_stage" >> "$GITHUB_OUTPUT"
      - id: checkpoint
        name: Validar y resolver último checkpoint reutilizable
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ steps.resolve.outputs.territory_id }}
          PARAMS: ${{ steps.resolve.outputs.params }}
          TO_STAGE: ${{ steps.resolve.outputs.to_stage }}
        run: |
          set -euo pipefail
          checkpoint_run_id=''; from_stage=M01; target_num="$((10#${TO_STAGE#M}))"
          mkdir -p .ddd-checkpoint-selection; : > .ddd-checkpoint-selection/checkpoints_descartados.jsonl
          api="repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&status=completed&per_page=100"
          mapfile -t run_ids < <(gh api "$api" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')
          record_discard(){ jq -cn --arg run_id "$1" --arg stage "$2" --arg reason "$3" '{run_id:$run_id,stage:$stage,reason:$reason}' >> .ddd-checkpoint-selection/checkpoints_descartados.jsonl; }
          for run_id in "${run_ids[@]}"; do
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            jq -e --arg n "ddd-decision-$run_id" '.artifacts[] | select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
            tmp_decision="$(mktemp -d)"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "ddd-decision-$run_id" --dir "$tmp_decision" >/dev/null 2>&1 || { rm -rf "$tmp_decision"; continue; }
            decision="$(find "$tmp_decision" -name decision.json -type f -print -quit)"
            [[ -n "$decision" ]] || { record_discard "$run_id" decision "decision.json ausente"; rm -rf "$tmp_decision"; continue; }
            [[ "$(jq -r '.territory_id // empty' "$decision")" == "$TERRITORY_ID" ]] || { rm -rf "$tmp_decision"; continue; }
            [[ "$(jq -r '.params // empty' "$decision")" == "$PARAMS" ]] || { record_discard "$run_id" decision "contrato o edición distintos"; rm -rf "$tmp_decision"; continue; }
            rm -rf "$tmp_decision"
            for ((stage_num=target_num-1; stage_num>=1; stage_num--)); do
              stage="M$(printf '%02d' "$stage_num")"; artifact_name="ddd-state-$run_id-$stage"
              jq -e --arg n "$artifact_name" '.artifacts[] | select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
              tmp_state="$(mktemp -d)"
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$tmp_state" >/dev/null 2>&1 || { record_discard "$run_id" "$stage" "no se pudo recuperar el checkpoint"; rm -rf "$tmp_state"; continue; }
              source_dir="$(find "$tmp_state" -type f -path '*/sources/manifest.json' -printf '%h\n' | sort | head -1)"
              [[ -n "$source_dir" ]] || { record_discard "$run_id" "$stage" "sources/manifest.json ausente"; rm -rf "$tmp_state"; continue; }
              candidate_json="$tmp_state/validacion_checkpoint.json"
              set +e; python -m herramientas.seleccionar_checkpoint_productivo --params "$PARAMS" --package "$source_dir" --run-id "$run_id" --stage "$stage" --root-dir . > "$candidate_json"; rc=$?; set -e
              if (( rc == 0 )); then
                checkpoint_run_id="$run_id"; from_stage="M$(printf '%02d' "$((stage_num+1))")"; cp "$candidate_json" .ddd-checkpoint-selection/checkpoint_seleccionado.json; rm -rf "$tmp_state"; break 2
              elif (( rc == 2 )); then
                reason="$(jq -r '.reason // "validación de fuentes rechazada"' "$candidate_json" 2>/dev/null || true)"; record_discard "$run_id" "$stage" "$reason"; rm -rf "$tmp_state"; continue
              else
                echo "::error::Falló el validador de checkpoint para run $run_id, $stage (rc=$rc)."; cat "$candidate_json" || true; rm -rf "$tmp_state"; exit "$rc"
              fi
            done
          done
          jq -cn --arg checkpoint_run_id "$checkpoint_run_id" --arg from_stage "$from_stage" --arg territory_id "$TERRITORY_ID" --arg params "$PARAMS" '{territory_id:$territory_id,params:$params,checkpoint_run_id:$checkpoint_run_id,from_stage:$from_stage}' > .ddd-checkpoint-selection/seleccion_checkpoint.json
          echo "checkpoint_run_id=$checkpoint_run_id" >> "$GITHUB_OUTPUT"; echo "from_stage=$from_stage" >> "$GITHUB_OUTPUT"
      - name: Publicar decisión de reanudación
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-checkpoint-selection-${{ github.run_id }}
          path: .ddd-checkpoint-selection
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  resolve:
    name: Resolver contrato y tramo
    needs: [resolver_interfaz]
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.range.outputs.mode }}
      params: ${{ steps.resolve.outputs.params }}
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      cache_dir: ${{ steps.resolve.outputs.cache_dir }}
      runs_dir: ${{ steps.resolve.outputs.runs_dir }}
      production_authorization: ${{ steps.resolve.outputs.production_authorization }}
      from_stage: ${{ steps.range.outputs.from_stage }}
      to_stage: ${{ steps.range.outputs.to_stage }}
      from_num: ${{ steps.range.outputs.from_num }}
      to_num: ${{ steps.range.outputs.to_num }}
      checkpoint_run_id: ${{ steps.range.outputs.checkpoint_run_id }}
    env:
      PARAMS: ${{ needs.resolver_interfaz.outputs.params }}
      MODE: execute
      AUTHORIZATION: EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION
      CHECKPOINT_RUN_ID: ${{ needs.resolver_interfaz.outputs.checkpoint_run_id }}
      DDD_RUN_ID: production-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - name: Validar lanzador común
        run: bash -n procedimiento.sh
      - id: resolve
        name: Admitir contrato antes de cualquier cálculo
        shell: bash
        run: |
          set -euo pipefail
          python herramientas/resolver_ejecucion_territorial.py \
            --params "$PARAMS" --run-id "$DDD_RUN_ID" --output decision.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d=json.load(open('decision.json',encoding='utf-8'))
          for key in ('params','territory_id','cache_dir','runs_dir','production_authorization'):
              print(f"{key}={d[key]}")
          print(f"run_id=production-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          PY
      - id: range
        name: Resolver FROM_STAGE / TO_STAGE
        shell: bash
        env:
          FROM_STAGE: ${{ needs.resolver_interfaz.outputs.from_stage }}
          TO_STAGE: ${{ needs.resolver_interfaz.outputs.to_stage }}
          PRODUCTION_AUTHORIZATION: ${{ steps.resolve.outputs.production_authorization }}
        run: |
          set -euo pipefail
          stage_num(){
            case "$1" in
              TERRITORY_PREPARATION|M01) echo 1;; TERRITORY_ADJACENCY|M02) echo 2;;
              TERRITORY_GRAPH|M03) echo 3;; DISTRICT_FORMATION|M04) echo 4;;
              DISTRICT_BALANCING|M05) echo 5;; TERRITORIAL_CERTIFICATION|M06) echo 6;;
              ELECTORAL_ENRICHMENT|M07) echo 7;; PUBLIC_PRODUCT_PUBLICATION|M08) echo 8;;
              *) return 1;;
            esac
          }
          from_num="$(stage_num "$FROM_STAGE")" || { echo "::error::FROM_STAGE desconocido: $FROM_STAGE"; exit 20; }
          to_num="$(stage_num "$TO_STAGE")" || { echo "::error::TO_STAGE desconocido: $TO_STAGE"; exit 20; }
          (( from_num <= to_num )) || { echo '::error::FROM_STAGE no puede ser posterior a TO_STAGE'; exit 20; }
          case "$MODE" in admit_only|verify_only|execute) ;; *) echo "::error::Modo no admitido: $MODE"; exit 20;; esac
          if [[ "$MODE" == execute ]]; then
            test "$AUTHORIZATION" = EXECUTE_WITH_EXPLICIT_USER_AUTHORIZATION || { echo '::error::execute exige autorización explícita.'; exit 21; }
            test "$PRODUCTION_AUTHORIZATION" = AUTHORIZED || { echo "::error::Contrato válido pero no autorizado para producción: $PRODUCTION_AUTHORIZATION"; exit 21; }
            if (( from_num > 1 )); then
              [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::FROM_STAGE > M01 exige checkpoint_run_id numérico de una ejecución modular previa.'; exit 22; }
            fi
          fi
          {
            echo "mode=$MODE"
            echo "from_stage=M$(printf '%02d' "$from_num")"
            echo "to_stage=M$(printf '%02d' "$to_num")"
            echo "from_num=$from_num"
            echo "to_num=$to_num"
            echo "checkpoint_run_id=$CHECKPOINT_RUN_ID"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ddd-decision-${{ github.run_id }}
          path: decision.json
          if-no-files-found: error
          retention-days: 14

  official_sources:
    name: Fuentes oficiales
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY_ID: ${{ needs.resolve.outputs.territory_id }}
      SOURCE_DECLARATION: territorios/${{ needs.resolve.outputs.territory_id }}/config/fuentes_oficiales.yaml
      EVIDENCE_DIR: .ddd-sources
      CHECKPOINT_RUN_ID: ${{ needs.resolve.outputs.checkpoint_run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Comprobar declaración de fuentes
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_DECLARATION" || { echo "::error::No existe declaración de fuentes: $SOURCE_DECLARATION"; exit 40; }
      - uses: docker/setup-buildx-action@v3
      - name: Preparar entorno reproducible de fuentes
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ddd-production:${{ github.sha }}
          cache-from: type=gha,scope=ddd-production-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-production-${{ github.sha }}
      - id: source_mode
        name: Resolver modo declarado de producción
        shell: bash
        run: |
          set -euo pipefail
          mode="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          from pathlib import Path
          d=yaml.safe_load((Path('/app') / sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or '')
          PY
          )"
          case "$mode" in official_live|verified_snapshot) ;; *) echo "::error::Modo productivo de fuentes inválido: $mode"; exit 40;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Reconstruir copia oficial declarada
        if: ${{ steps.source_mode.outputs.mode == 'verified_snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          bash inputs/partes/reconstruir_fuentes.sh
      - name: Recuperar paquete de fuentes de checkpoint solicitado
        if: ${{ needs.resolve.outputs.checkpoint_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ddd-source-resume .ddd-state/in
          mkdir -p .ddd-source-resume .ddd-state/in/sources
          gh run download "$CHECKPOINT_RUN_ID" --pattern 'ddd-state-*' --dir .ddd-source-resume
          source_dir="$(find .ddd-source-resume -type f -path '*/sources/manifest.json' -printf '%h\n' | sort | head -1)"
          if [[ -n "$source_dir" ]]; then
            cp -a "$source_dir/." .ddd-state/in/sources/
          fi
      - id: acquire
        name: Resolver y materializar fuentes declaradas
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          checkpoint_args=()
          if [[ -f .ddd-state/in/sources/manifest.json ]]; then
            checkpoint_args=(--checkpoint-in /app/.ddd-state/in)
          fi
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} \
            /app/herramientas/ejecutar_fuentes_workflow.py \
            --declaration "/app/$SOURCE_DECLARATION" \
            --working /app/.ddd-source-package \
            "${checkpoint_args[@]}" \
            --checkpoint-out /app/.ddd-source-checkpoint \
            --acquisition-evidence "/app/$EVIDENCE_DIR" \
            --environment production \
            --acquisition-mode '${{ steps.source_mode.outputs.mode }}' \
            --root-dir /app
          cp .ddd-source-checkpoint/source_execution.json "$EVIDENCE_DIR/source_execution.json"
      - id: evaluate
        name: Evaluar preparación de fuentes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} \
            /app/herramientas/evaluar_preparacion_territorial.py \
            --territory "/app/$SOURCE_DECLARATION" \
            --evidence-dir "/app/$EVIDENCE_DIR" \
            --environment production \
            --root-dir /app
      - name: Publicar evidencia de preparación
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-fuentes-${{ github.run_id }}
          path: |
            .ddd-sources/inventario_fuentes.json
            .ddd-sources/manifiesto_procedencia.json
            .ddd-sources/decision_preparacion.json
            .ddd-sources/informe_preparacion.md
            .ddd-sources/declaracion_materializacion.json
            .ddd-sources/decision_adquisicion.json
            .ddd-sources/source_execution.json
          if-no-files-found: error
          retention-days: 14
      - name: Publicar entradas consumibles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-official-inputs-${{ github.run_id }}
          path: .ddd-sources/materialized
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar paquete durable de fuentes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-source-package-${{ github.run_id }}
          path: .ddd-source-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Aplicar puerta de preparación
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .ddd-sources/decision_preparacion.json || { echo '::error::No existe decisión de preparación.'; exit 41; }
          python - <<'PY'
          import json
          d=json.load(open('.ddd-sources/decision_preparacion.json',encoding='utf-8'))
          if d.get('decision') != 'READY':
              raise SystemExit('Preparación de fuentes BLOQUEADA: ' + '; '.join(d.get('reasons') or []))
          PY

  m01:
    name: M01 · Base territorial y población
    needs: [resolve, official_sources]
    if: ${{ needs.resolve.result == 'success' && needs.official_sources.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 1 && fromJSON(needs.resolve.outputs.to_num) >= 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PARAMS: ${{ needs.resolve.outputs.params }}
      RUN_ID: ${{ needs.resolve.outputs.run_id }}
      CACHE_DIR: ${{ needs.resolve.outputs.cache_dir }}
      RUNS_DIR: ${{ needs.resolve.outputs.runs_dir }}
      STAGE: M01
      PREVIOUS_STAGE: ''
      PREVIOUS_RESULT: ''
      CHECKPOINT_RUN_ID: ${{ needs.resolve.outputs.checkpoint_run_id }}
    steps: &module_steps
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Preparar entorno reproducible con caché compartida
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ddd-production:${{ github.sha }}
          cache-from: type=gha,scope=ddd-production-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-production-${{ github.sha }}
      - id: state
        if: ${{ env.PREVIOUS_STAGE != '' }}
        name: Resolver estado anterior
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREVIOUS_RESULT" == success ]]; then state_run_id="$GITHUB_RUN_ID"; else state_run_id="$CHECKPOINT_RUN_ID"; fi
          [[ "$state_run_id" =~ ^[0-9]+$ ]] || { echo '::error::No hay run anterior utilizable.'; exit 22; }
          echo "run_id=$state_run_id" >> "$GITHUB_OUTPUT"
      - name: Recuperar estado acumulado anterior
        if: ${{ env.PREVIOUS_STAGE != '' }}
        uses: actions/download-artifact@v6
        with:
          name: ddd-state-${{ steps.state.outputs.run_id }}-${{ env.PREVIOUS_STAGE }}
          path: .ddd-state/in
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state.outputs.run_id }}
      - name: Restaurar estado contractual
        if: ${{ env.PREVIOUS_STAGE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d .ddd-state/in/cache && test -d .ddd-state/in/run
          mkdir -p "$CACHE_DIR" "$RUNS_DIR"
          cp -a .ddd-state/in/cache/. "$CACHE_DIR/"
          cp -a .ddd-state/in/run/. "$RUNS_DIR/"
          if [[ -d .ddd-state/in/sources ]]; then
            rm -rf .ddd-source-package
            mkdir -p .ddd-source-package
            cp -a .ddd-state/in/sources/. .ddd-source-package/
          fi
          test -f "$RUNS_DIR/CHAIN_STATE.json"
      - name: Recuperar fuentes aprobadas para M01
        if: ${{ env.STAGE == 'M01' }}
        uses: actions/download-artifact@v6
        with:
          name: ddd-official-inputs-${{ github.run_id }}
          path: .ddd-sources/materialized
      - name: Recuperar paquete durable para M01
        if: ${{ env.STAGE == 'M01' }}
        uses: actions/download-artifact@v6
        with:
          name: ddd-source-package-${{ github.run_id }}
          path: .ddd-source-package
      - name: Instalar fuentes en sus rutas contractuales
        if: ${{ env.STAGE == 'M01' }}
        shell: bash
        run: |
          set -euo pipefail
          cp -a .ddd-sources/materialized/. .
          python - "$PARAMS" <<'PY'
          import sys,yaml
          from pathlib import Path
          cfg=yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8')) or {}
          io_in=((cfg.get('io') or {}).get('input') or {})
          paths=[(io_in.get('seccionado') or {}).get('path')]
          paths.extend((io_in.get('population_cip') or {}).get('paths') or [])
          missing=[p for p in paths if p and not Path(p).is_file()]
          if missing: raise SystemExit('Fuentes aprobadas no llegaron a rutas M01: '+', '.join(missing))
          PY
      - name: Recuperar fuente electoral oficial aprobada
        if: ${{ env.STAGE == 'M07' }}
        uses: actions/download-artifact@v6
        with:
          name: ddd-electoral-source-${{ github.run_id }}
          path: .ddd-electoral-source
      - name: Instalar y verificar fuente electoral en ruta contractual
        if: ${{ env.STAGE == 'M07' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} \
            /app/herramientas/instalar_fuente_electoral_oficial.py \
            --params "/app/$PARAMS" \
            --artifact-dir /app/.ddd-electoral-source \
            --root-dir /app \
            --report /app/.ddd-electoral-source/instalacion_m07.json
      - name: Ejecutar módulo
        shell: bash
        run: >-
          docker run --rm -v "$PWD:/app" -w /app
          -e DDD_PARAMS="$PARAMS" -e DDD_RUN_ID="$RUN_ID"
          -e DDD_FROM_STAGE="$STAGE" -e DDD_TO_STAGE="$STAGE"
          -e DDD_CHAIN_STATE="$RUNS_DIR/CHAIN_STATE.json"
          --entrypoint /bin/bash ddd-production:${GITHUB_SHA} /app/procedimiento.sh
      - name: Empaquetar checkpoint acumulado del módulo
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNS_DIR/CHAIN_STATE.json"
          rm -rf .ddd-state/out
          mkdir -p .ddd-state/out/cache .ddd-state/out/run .ddd-state/out/sources
          cp -a "$CACHE_DIR/." .ddd-state/out/cache/
          cp -a "$RUNS_DIR/." .ddd-state/out/run/
          test -f .ddd-source-package/manifest.json || { echo '::error::El checkpoint perdería el paquete durable de fuentes.'; exit 24; }
          cp -a .ddd-source-package/. .ddd-state/out/sources/
      - uses: actions/upload-artifact@v6
        with:
          name: ddd-state-${{ github.run_id }}-${{ env.STAGE }}
          path: .ddd-state/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  m02:
    name: M02 · Adyacencias territoriales
    needs: [resolve, m01]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 2 && fromJSON(needs.resolve.outputs.to_num) >= 2 && (needs.m01.result == 'success' || (needs.m01.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '' && fromJSON(needs.resolve.outputs.from_num) == 2)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M02, PREVIOUS_STAGE: M01, PREVIOUS_RESULT: "${{ needs.m01.result }}", CHECKPOINT_RUN_ID: "${{ needs.resolve.outputs.checkpoint_run_id }}"}
    steps: *module_steps

  m03:
    name: M03 · Grafo territorial
    needs: [resolve, m02]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 3 && fromJSON(needs.resolve.outputs.to_num) >= 3 && (needs.m02.result == 'success' || (needs.m02.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '' && fromJSON(needs.resolve.outputs.from_num) == 3)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M03, PREVIOUS_STAGE: M02, PREVIOUS_RESULT: "${{ needs.m02.result }}", CHECKPOINT_RUN_ID: "${{ needs.resolve.outputs.checkpoint_run_id }}"}
    steps: *module_steps

  internal_units:
    name: Preparar unidades internas
    needs: [resolve, m03]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 4 && fromJSON(needs.resolve.outputs.to_num) >= 4 && (needs.m03.result == 'success' || (needs.m03.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '' && fromJSON(needs.resolve.outputs.from_num) == 4)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PARAMS: ${{ needs.resolve.outputs.params }}
      RUN_ID: ${{ needs.resolve.outputs.run_id }}
      CACHE_DIR: ${{ needs.resolve.outputs.cache_dir }}
      RUNS_DIR: ${{ needs.resolve.outputs.runs_dir }}
      CHECKPOINT_RUN_ID: ${{ needs.resolve.outputs.checkpoint_run_id }}
      M03_RESULT: ${{ needs.m03.result }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Preparar entorno reproducible
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ddd-production:${{ github.sha }}
          cache-from: type=gha,scope=ddd-production-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-production-${{ github.sha }}
      - id: state
        name: Resolver entrada M03
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$M03_RESULT" == success ]]; then state_run_id="$GITHUB_RUN_ID"; else state_run_id="$CHECKPOINT_RUN_ID"; fi
          [[ "$state_run_id" =~ ^[0-9]+$ ]] || { echo '::error::Preparar unidades internas requiere M03 actual o checkpoint previo.'; exit 22; }
          echo "run_id=$state_run_id" >> "$GITHUB_OUTPUT"
      - name: Recuperar entrada M03
        uses: actions/download-artifact@v6
        with:
          name: ddd-state-${{ steps.state.outputs.run_id }}-M03
          path: .ddd-state/in
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state.outputs.run_id }}
      - name: Restaurar entrada contractual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR" "$RUNS_DIR" .ddd-internal-units .ddd-source-package
          cp -a .ddd-state/in/cache/. "$CACHE_DIR/"
          cp -a .ddd-state/in/run/. "$RUNS_DIR/"
          test -d .ddd-state/in/sources || { echo '::error::M03 no transportó fuentes durables.'; exit 24; }
          cp -a .ddd-state/in/sources/. .ddd-source-package/
          test -f "$RUNS_DIR/CHAIN_STATE.json"
      - name: Materializar unidades internas
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} \
            /app/herramientas/preparar_unidades_internas.py \
            --params "/app/$PARAMS" --run-id "$RUN_ID" \
            --job-report /app/.ddd-internal-units/job.json
          python - "$PARAMS" "$RUN_ID" <<'PY'
          import sys,yaml,shutil
          from pathlib import Path
          cfg=yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8')) or {}
          vals={'run_name':(cfg.get('meta') or {}).get('run_name',''),'run_id':sys.argv[2],'year':(cfg.get('meta') or {}).get('year','')}
          p=cfg.get('partitioning') or {}
          out=Path('.ddd-internal-units/output'); out.mkdir(parents=True,exist_ok=True)
          for key in ('output_geojson','output_report'):
              raw=p.get(key)
              if raw:
                  src=Path(str(raw).format(**vals))
                  if src.is_file(): shutil.copy2(src,out/src.name)
          PY
      - name: Empaquetar salida M03U
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ddd-state/out
          mkdir -p .ddd-state/out/cache .ddd-state/out/run .ddd-state/out/sources
          cp -a "$CACHE_DIR/." .ddd-state/out/cache/
          cp -a "$RUNS_DIR/." .ddd-state/out/run/
          cp -a .ddd-source-package/. .ddd-state/out/sources/
      - uses: actions/upload-artifact@v6
        with:
          name: ddd-state-${{ github.run_id }}-M03U
          path: .ddd-state/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publicar preparación de unidades internas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-internal-units-${{ github.run_id }}
          path: .ddd-internal-units
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  m04:
    name: M04 · Solución inicial
    needs: [resolve, internal_units]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 4 && fromJSON(needs.resolve.outputs.to_num) >= 4 && needs.internal_units.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M04, PREVIOUS_STAGE: M03U, PREVIOUS_RESULT: "${{ needs.internal_units.result }}", CHECKPOINT_RUN_ID: "${{ needs.resolve.outputs.checkpoint_run_id }}"}
    steps: *module_steps

  m05:
    name: M05 · Optimización de distritos
    needs: [resolve, m04]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 5 && fromJSON(needs.resolve.outputs.to_num) >= 5 && (needs.m04.result == 'success' || (needs.m04.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '' && fromJSON(needs.resolve.outputs.from_num) == 5)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M05, PREVIOUS_STAGE: M04, PREVIOUS_RESULT: "${{ needs.m04.result }}", CHECKPOINT_RUN_ID: "${{ needs.resolve.outputs.checkpoint_run_id }}"}
    steps: *module_steps

  m06:
    name: M06 · Consolidación territorial
    needs: [resolve, m05]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 6 && fromJSON(needs.resolve.outputs.to_num) >= 6 && (needs.m05.result == 'success' || (needs.m05.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '' && fromJSON(needs.resolve.outputs.from_num) == 6)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M06, PREVIOUS_STAGE: M05, PREVIOUS_RESULT: "${{ needs.m05.result }}", CHECKPOINT_RUN_ID: "${{ needs.resolve.outputs.checkpoint_run_id }}"}
    steps: *module_steps

  auditoria:
    name: Auditoría geométrica M06
    needs: [resolve, m06]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.to_num) >= 6 && (needs.m06.result == 'success' || (needs.m06.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '' && fromJSON(needs.resolve.outputs.from_num) >= 7)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      decision: ${{ steps.geometric.outputs.decision }}
    env:
      PARAMS: ${{ needs.resolve.outputs.params }}
      RUN_ID: ${{ needs.resolve.outputs.run_id }}
      RUNS_DIR: ${{ needs.resolve.outputs.runs_dir }}
      CACHE_DIR: ${{ needs.resolve.outputs.cache_dir }}
      CHECKPOINT_RUN_ID: ${{ needs.resolve.outputs.checkpoint_run_id }}
      M06_RESULT: ${{ needs.m06.result }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Preparar entorno reproducible con caché compartida
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ddd-production:${{ github.sha }}
          cache-from: type=gha,scope=ddd-production-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-production-${{ github.sha }}
      - id: state
        name: Resolver checkpoint M06
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$M06_RESULT" == success ]]; then state_run_id="$GITHUB_RUN_ID"; else state_run_id="$CHECKPOINT_RUN_ID"; fi
          [[ "$state_run_id" =~ ^[0-9]+$ ]] || { echo '::error::Auditoría M06 requiere estado M06 actual o checkpoint previo.'; exit 22; }
          echo "run_id=$state_run_id" >> "$GITHUB_OUTPUT"
      - name: Recuperar estado M06
        uses: actions/download-artifact@v6
        with:
          name: ddd-state-${{ steps.state.outputs.run_id }}-M06
          path: .ddd-state/in
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state.outputs.run_id }}
      - name: Restaurar estado M06
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR" "$RUNS_DIR"
          cp -a .ddd-state/in/cache/. "$CACHE_DIR/"
          cp -a .ddd-state/in/run/. "$RUNS_DIR/"
      - id: geometric
        name: Auditar componentes geométricos de M06
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sections="$(python - "$PARAMS" <<'PY'
          import sys, yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8')) or {}
          m06 = (cfg.get('modulos') or {}).get('modulo_06_consolidar_distritos') or {}
          path = m06.get('out_geojson') or ''
          year = (cfg.get('meta') or {}).get('year')
          run_name = (cfg.get('meta') or {}).get('run_name')
          run_id = __import__('os').environ.get('RUN_ID', '')
          print(str(path).format(year=year, run_name=run_name, run_id=run_id))
          PY
          )"
          test -n "$sections" || { echo '::error::M06 no declara out_geojson en el contrato territorial.'; exit 23; }
          test -f "$sections" || { echo "::error::No existe M06 materializado en la ruta contractual: $sections"; exit 23; }
          expected="$(python - "$PARAMS" <<'PY'
          import sys,yaml
          from pathlib import Path
          cfg=yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8')) or {}
          m06=(cfg.get('modulos') or {}).get('modulo_06_consolidar_distritos') or {}
          print(m06.get('expected_districts') or (cfg.get('validation') or {}).get('expected_districts') or 0)
          PY
          )"
          policy="$(python - "$PARAMS" <<'PY'
          import sys,yaml
          from pathlib import Path
          params=Path(sys.argv[1]); cfg=yaml.safe_load(params.read_text(encoding='utf-8')) or {}
          year=(cfg.get('meta') or {}).get('year'); candidate=params.parent / f"continuidad_geometrica_{year}.json"
          print(candidate.as_posix() if year and candidate.is_file() else '')
          PY
          )"
          policy_args=()
          if [[ -n "$policy" ]]; then
            policy_args=(--policy "/app/$policy")
            echo "Aplicando política geométrica territorial: $policy"
          fi
          output="${sections%_secciones.geojson.zip}_contiguedad_geometrica.json"
          set +e
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} \
            /app/herramientas/auditar_componentes_geometricos.py --sections "/app/$sections" \
            --section-field CUSEC_KEY --district-field district_id --working-crs EPSG:3035 \
            --expected-districts "$expected" "${policy_args[@]}" --output "/app/$output"
          audit_rc=$?
          set -e
          decision=UNKNOWN
          if [[ -f "$output" ]]; then
            decision="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["decision"])' "$output")"
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "audit_path=$output" >> "$GITHUB_OUTPUT"
          exit "$audit_rc"
      - name: Registrar estado verificable de producción
        if: always()
        shell: bash
        env:
          TERRITORY_ID: ${{ needs.resolve.outputs.territory_id }}
          FROM_STAGE: ${{ needs.resolve.outputs.from_stage }}
          TO_STAGE: ${{ needs.resolve.outputs.to_stage }}
          GEOMETRIC_OUTCOME: ${{ steps.geometric.outcome }}
          GEOMETRIC_DECISION: ${{ steps.geometric.outputs.decision }}
        run: |
          set -euo pipefail
          mkdir -p .ddd-audit
          audit='${{ steps.geometric.outputs.audit_path }}'
          [[ -n "$audit" && -f "$audit" ]] || { echo '::error::No existe informe geométrico M06 para construir production_status.'; exit 33; }
          python herramientas/estado_produccion.py \
            --params "$PARAMS" \
            --territory-id "$TERRITORY_ID" \
            --run-id "$RUN_ID" \
            --from-stage "$FROM_STAGE" \
            --to-stage "$TO_STAGE" \
            --execution-outcome success \
            --geometric-outcome "$GEOMETRIC_OUTCOME" \
            --geometric-decision "$GEOMETRIC_DECISION" \
            --geometric-audit "$audit" \
            --output .ddd-audit/production_status.json
          cp "$audit" .ddd-audit/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ddd-audit-${{ github.run_id }}
          path: .ddd-audit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Aplicar puerta geométrica
        if: always()
        run: test '${{ steps.geometric.outcome }}' = success || { echo 'La auditoría geométrica M06 bloquea la cadena.' >&2; exit 32; }

  electoral_source:
    name: Fuente electoral oficial
    needs: [resolve, m06, auditoria]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 7 && fromJSON(needs.resolve.outputs.to_num) >= 7 && (needs.m06.result == 'success' || (needs.m06.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '')) && needs.auditoria.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARAMS: ${{ needs.resolve.outputs.params }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Preparar entorno reproducible
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ddd-production:${{ github.sha }}
          cache-from: type=gha,scope=ddd-production-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-production-${{ github.sha }}
      - id: declaration
        name: Resolver declaración electoral
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ddd-electoral-source
          declaration="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} - "$PARAMS" <<'PY'
          import sys,yaml
          from pathlib import Path
          cfg=yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((cfg.get('meta') or {}).get('electoral_sources_declaration') or '')
          PY
          )"
          echo "path=$declaration" >> "$GITHUB_OUTPUT"
          if [[ -z "$declaration" ]]; then
            docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} - "$PARAMS" <<'PY'
          import json,sys,yaml
          from pathlib import Path
          cfg=yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8')) or {}
          m07=(cfg.get('modulos') or {}).get('modulo_07_agregar_resultados_electorales') or {}
          decision='READY_EXISTING_CONTRACT' if m07.get('election_contract') else 'BLOCK'
          payload={'schema':'ddd-election-source-decision/1.0','decision':decision,'reason':'Sin declaración automática; se conserva contrato electoral existente.' if decision.startswith('READY') else 'No hay declaración electoral oficial ni contrato electoral existente.'}
          Path('.ddd-electoral-source/decision_fuente_electoral.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('.ddd-electoral-source/informe_fuente_electoral.md').write_text('# Comprobación automática de fuente electoral oficial\n\n- decisión: **'+decision+'**\n',encoding='utf-8')
          PY
          fi
      - name: Consultar fuentes oficiales declaradas
        if: ${{ steps.declaration.outputs.path != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-production:${GITHUB_SHA} \
            /app/herramientas/comprobar_fuente_electoral_oficial.py \
            --declaration "/app/${{ steps.declaration.outputs.path }}" \
            --out-dir /app/.ddd-electoral-source
      - name: Publicar decisión y descarga electoral
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddd-electoral-source-${{ github.run_id }}
          path: .ddd-electoral-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Aplicar puerta electoral oficial
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .ddd-electoral-source/decision_fuente_electoral.json || { echo '::error::Falta decisión electoral oficial.'; exit 42; }
          python - <<'PY'
          import json
          d=json.load(open('.ddd-electoral-source/decision_fuente_electoral.json',encoding='utf-8'))
          decision=str(d.get('decision') or '')
          if not decision.startswith('READY'):
              raise SystemExit('Fuente electoral oficial BLOQUEADA: '+decision)
          PY

  m07:
    name: M07 · Agregación electoral
    needs: [resolve, m06, auditoria, electoral_source]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 7 && fromJSON(needs.resolve.outputs.to_num) >= 7 && (needs.m06.result == 'success' || (needs.m06.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '')) && needs.auditoria.result == 'success' && needs.electoral_source.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M07, PREVIOUS_STAGE: M06, PREVIOUS_RESULT: "${{ needs.m06.result }}", CHECKPOINT_RUN_ID: "${{ needs.resolve.outputs.checkpoint_run_id }}"}
    steps: *module_steps

  m08:
    name: M08 · Producto electoral territorial
    needs: [resolve, m07, auditoria]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.from_num) <= 8 && fromJSON(needs.resolve.outputs.to_num) >= 8 && (needs.m07.result == 'success' || (needs.m07.result == 'skipped' && needs.resolve.outputs.checkpoint_run_id != '' && fromJSON(needs.resolve.outputs.from_num) == 8)) && needs.auditoria.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {PARAMS: "${{ needs.resolve.outputs.params }}", RUN_ID: "${{ needs.resolve.outputs.run_id }}", CACHE_DIR: "${{ needs.resolve.outputs.cache_dir }}", RUNS_DIR: "${{ needs.resolve.outputs.runs_dir }}", STAGE: M08, PREVIOUS_STAGE: M07, PREVIOUS_RESULT: "${{ needs.m07.result }}", CHECKPOINT_RUN_ID: "${{ needs.resolve.outputs.checkpoint_run_id }}"}
    steps: *module_steps

  visor:
    name: Visor
    needs: [resolve, m08, auditoria]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'execute' && fromJSON(needs.resolve.outputs.to_num) >= 8 && needs.m08.result == 'success' && needs.auditoria.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency: {group: pages, cancel-in-progress: true}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RUN_ID: ${{ github.run_id }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install --disable-pip-version-check pyproj
      - name: Validar visor
        run: |
          node --check visor/app.js
          python -m py_compile herramientas/preparar_visor_ejecucion.py herramientas/evaluar_publicacion_visor.py
      - name: Recuperar ejecución territorial
        run: |
          rm -rf /tmp/production && mkdir -p /tmp/production
          gh run download "$PRODUCTION_RUN_ID" --pattern 'ddd-*' --dir /tmp/production
          test -n "$(find /tmp/production -type f -print -quit)"
      - name: Acreditar identidad de la ejecución descargada
        run: python herramientas/evaluar_publicacion_visor.py --requested-run-id "$PRODUCTION_RUN_ID" --production-root /tmp/production --phase source --output .ddd-publication/publicacion_visor.json --strict-request
      - name: Empaquetar visor
        run: |
          rm -rf site && mkdir -p site
          cp visor/index.html visor/app.js visor/styles.css site/
          python herramientas/preparar_visor_ejecucion.py --site site --static-registry orchestracion/productos_publicos.json --production-root /tmp/production --production-run-id "$PRODUCTION_RUN_ID"
      - name: Acreditar resultado realmente cargado
        run: python herramientas/evaluar_publicacion_visor.py --requested-run-id "$PRODUCTION_RUN_ID" --registry site/data/viewer-results.json --phase prepared --output .ddd-publication/publicacion_visor.json --production-root /tmp/production --strict-request
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v4
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Registrar evidencia final
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python herramientas/evaluar_publicacion_visor.py --requested-run-id "$PRODUCTION_RUN_ID" --registry site/data/viewer-results.json --viewer-url "$PAGE_URL" --deployment-outcome "$DEPLOYMENT_OUTCOME" --phase final --output .ddd-publication/publicacion_visor.json --production-root /tmp/production
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ddd-publication-${{ github.run_id }}
          path: .ddd-publication/publicacion_visor.json
          if-no-files-found: error
          retention-days: 30

  informe_ejecucion:
    name: Informe de ejecución
    needs: [resolve, official_sources, m01, m02, m03, internal_units, m04, m05, m06, auditoria, electoral_source, m07, m08, visor]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v6
      - name: Registrar contexto
        env:
          TERRITORY_ID: ${{ needs.resolve.outputs.territory_id }}
          FROM_STAGE: ${{ needs.resolve.outputs.from_stage }}
          TO_STAGE: ${{ needs.resolve.outputs.to_stage }}
          PRODUCTION_RESULT: ${{ needs.m08.result == 'success' && 'success' || needs.m07.result == 'success' && needs.resolve.outputs.to_num == '7' && 'success' || 'failure' }}
        run: |
          mkdir -p .ddd-execution-evidence
          python - <<'PY'
          import json,os
          from pathlib import Path
          p={"schema":"ddd-execution-context/1.0","territory_id":os.environ["TERRITORY_ID"],"operation":"producir_resultado_m01_m08","requested_from":os.environ["FROM_STAGE"],"requested_to":os.environ["TO_STAGE"],"workflow_run_id":os.environ["GITHUB_RUN_ID"],"workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"production_job_result":os.environ["PRODUCTION_RESULT"]}
          Path(".ddd-execution-evidence/contexto_ejecucion.json").write_text(json.dumps(p,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Recuperar evidencias
        continue-on-error: true
        uses: actions/download-artifact@v6
        with: {pattern: ddd-*, path: .ddd-execution-evidence/artifacts}
      - name: Generar informe
        run: |
          python herramientas/generar_informe_ejecucion.py --evidence-root .ddd-execution-evidence/artifacts --context .ddd-execution-evidence/contexto_ejecucion.json --out-dir .ddd-execution-report
          test -s .ddd-execution-report/inventario_ejecucion.json
          test -s .ddd-execution-report/informe_ejecucion.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ddd-execution-report-${{ github.run_id }}
          path: .ddd-execution-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
