# PROYECTO: Diputado de Distrito
# FICHERO: bateria-motor.yml
# VERSIÓN: 1.1.4
# CAMBIOS 1.1.4: T-215 (corte 5.0.0, paso 4), nombre visible v5 «VER Verificación del motor» (antes Auxiliar — Batería del Motor).
# NOMBRE DE VERSIÓN: Batería del motor
# FECHA: 2026-11-10
# ESTADO: candidato
# QUÉ HACE: entradas de los 71 territorios (herramientas/bateria_motor.py entradas): reutiliza el estado M03 archivado
#   en R2 si es del contrato vigente (sha256 de orchestracion/archivo_r2.json) y, si no, las reconstruye desde fuente
#   INE; ejecuta M04-M06 con el motor indicado y la validación de producción y deja la matriz territorio × regla como
#   artefacto. Con archivar=true sube a R2 solo la entrada mínima (M01 + grafo M03 + ENTRADAS.json) de cada
#   territorio. No publica ni escribe en main.
# CAMBIOS: 1.1.3 (T-212): el job de cada territorio añade el paso «Indicadores frente al vigente» (bateria_motor.py indicadores): fuera de
#   tolerancia, desvío máximo, partidos judiciales y comarcas partidos, frontera cortada y Polsby-Popper del vigente publicado, el
#   canónico y el ganador, al RESUMEN del paso y al log (sin bajar artefactos) y a INDICADORES.json/md en el artefacto del territorio;
#   el job final aplica «nunca peor que el vigente» y lista los territorios sin vigente comparable.
# CAMBIOS: 1.1.2 (T-181b): el job de competición ya no instala requirements-ensemble.lock entero (subía pandas 3 y geopandas 1.1.4 y
#   el canónico fallaba en 21+ territorios): gerrychain y sus dependencias propias (networkx, rustworkx, scipy, tqdm, six) con
#   `--no-deps` y las versiones del lock del laboratorio, y la comprobación previa falla si cambia cualquier paquete del entorno
#   base (pip freeze antes/después y requirements.lock).
# CAMBIOS: 1.1.1 (T-181): el job de competición instala requirements-ensemble.lock (lock del laboratorio: gerrychain y networkx, que
#   Ponderado importa en el mismo proceso; antes las 10 cadenas fallaban con ModuleNotFoundError y el ganador era el canónico)
#   tras las entradas, y comprueba en ~1 min, antes de competir, la versión de gerrychain y los imports reales de las cadenas.
#   `aceptacion` recibe --cadenas N (candidatos = 1 + N, +1 exhaustivo). El job m05 no cambia.
# CAMBIOS: 1.1.0 (T-208, D-72): entrada `motor: m05|motor2` (m05 por defecto, job idéntico); con motor2, matriz de un job por
#   territorio (hasta 71; timeout 360 min) que ejecuta la competición (`funcion` D8 por defecto, `cadenas` 10) con
#   PYTHONHASHSEED=0, entradas desde R2 o fuente INE y artefacto por territorio, y un job final que une la matriz y aplica el
#   criterio de aceptación de T-194 (válidos, ninguno peor que el canónico, huella real en Soria, Álava y Melilla).
#   Cambios de revisión: aceptación «PARCIAL» sin las tres huellas reales; R2 solo en el paso de entradas.
#   Coste: ~450-650 min de Actions en los 71 (ver la PR). El nombre del flujo no cambia (corte 5.0.0).
#   1.0.0: fichero nuevo (T-132).
# MOTIVO: repetir la batería ante cualquier cambio del motor con un solo botón; sin programación ni vigilantes.
# ANTERIOR: legacy/workflows/bateria-motor_v1.1.3_20261110.yml
name: VER Verificación del motor
run-name: "Batería del motor ${{ inputs.motor == 'motor2' && format('motor2 {0} N={1}', inputs.funcion, inputs.cadenas) || inputs.versiones_m05 }} ${{ inputs.territorios || 'todos' }}"

on:
  workflow_dispatch:
    inputs:
      motor:
        description: 'm05 = batería M04-M06 de siempre; motor2 = competición del motor nuevo (matriz por territorio)'
        required: false
        type: choice
        options: [m05, motor2]
        default: m05
      funcion:
        description: 'Solo motor2: función de calidad (D8 por defecto)'
        required: false
        type: choice
        options: [D8, D5, C, A]
        default: D8
      cadenas:
        description: 'Solo motor2: cadenas por territorio'
        required: false
        type: string
        default: '10'
      territorios:
        description: 'Territorios separados por espacios; vacío = los 71'
        required: false
        type: string
        default: ''
      versiones_m05:
        description: 'Solo m05: versiones del motor base M05 separadas por espacios (7.4.4 vigente; 7.4.3 y 7.4.2 legacy); motor2 la ignora'
        required: false
        type: string
        default: '7.4.4'
      archivar:
        description: 'Solo m05: subir a R2 la entrada mínima de cada territorio; motor2 la ignora'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bateria-motor
  cancel-in-progress: false
  queue: max

jobs:
  bateria:
    name: Batería del motor
    if: ${{ inputs.motor != 'motor2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TERRITORIOS: ${{ inputs.territorios }}
      VERSIONES: ${{ inputs.versiones_m05 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - name: Copias nacionales (INE)
        run: python herramientas/bateria_motor.py nacionales
      - name: Entradas desde fuente
        shell: bash
        run: |
          set -euo pipefail
          r2=(); [[ -n "${R2_ACCOUNT_ID:-}" && -n "${AWS_ACCESS_KEY_ID:-}" ]] && r2=(--desde-r2)
          if [[ -n "$TERRITORIOS" ]]; then read -ra ts <<<"$TERRITORIOS"; python herramientas/bateria_motor.py entradas "${r2[@]}" "${ts[@]}"
          else python herramientas/bateria_motor.py entradas "${r2[@]}" --todos; fi
      - name: Motor y validación
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for v in $VERSIONES; do
            if [[ -n "$TERRITORIOS" ]]; then read -ra ts <<<"$TERRITORIOS"; python herramientas/bateria_motor.py motor --m05 "$v" "${ts[@]}" || rc=1
            else python herramientas/bateria_motor.py motor --m05 "$v" --todos || rc=1; fi
          done
          python herramientas/bateria_motor.py matriz
          cat bateria/MATRIZ.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Archivar entradas en R2
        if: ${{ always() && inputs.archivar }}
        run: python herramientas/bateria_motor.py archivar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bateria-motor-${{ github.run_id }}
          path: |
            bateria/MATRIZ.*
            bateria/ARCHIVO_ENTRADAS.json
            bateria/entradas/*/ENTRADAS.json
            bateria/motor/*/*/RESULTADO.json
            bateria/motor/*/*/VALIDACION.json
            inputs/_nacional/NACIONALES.json
          retention-days: 14

  plan:
    name: Plan del motor 2
    if: ${{ inputs.motor == 'motor2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matriz: ${{ steps.lista.outputs.matriz }}
    env:
      TERRITORIOS: ${{ inputs.territorios }}
      CADENAS: ${{ inputs.cadenas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - id: lista
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CADENAS" =~ ^[0-9]+$ && "$CADENAS" -ge 1 ]] || { echo "::error::cadenas debe ser un entero >= 1"; exit 2; }
          python -m pip install "$(grep -i '^PyYAML==' requirements.lock)"
          read -ra ts <<<"$TERRITORIOS"
          echo "matriz=$(python herramientas/bateria_motor.py lista "${ts[@]}")" >> "$GITHUB_OUTPUT"

  competicion:
    name: Competición ${{ matrix.t }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matriz) }}
    env:
      T: ${{ matrix.t }}
      FUNCION: ${{ inputs.funcion }}
      CADENAS: ${{ inputs.cadenas }}
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - name: Entradas (R2 o fuente INE)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          r2=(); [[ -n "${R2_ACCOUNT_ID:-}" && -n "${AWS_ACCESS_KEY_ID:-}" ]] && r2=(--desde-r2)
          python herramientas/bateria_motor.py entradas "${r2[@]}" "$T"
      - name: Dependencias de las cadenas (sin tocar el lock base) y comprobación rápida
        shell: bash
        run: |
          set -euo pipefail
          # T-181b: requirements-ensemble.lock sube pandas 3 / geopandas 1.1.4 / shapely 2.1.2 y rompe M04-M06 (también el canónico).
          # gerrychain 1.0.0 las declara como dependencias, pero la cadena no las usa: se instala SIN dependencias y solo lo que
          # el lock base no fija (networkx, rustworkx, scipy, tqdm, six, con las versiones del lock del laboratorio).
          python -m pip freeze --all | sort > "$RUNNER_TEMP/antes.txt"
          grep -iE '^(gerrychain|networkx|rustworkx|scipy|tqdm|six)==' requirements-ensemble.lock > "$RUNNER_TEMP/cadenas.txt"
          python -m pip install --no-deps --requirement "$RUNNER_TEMP/cadenas.txt"
          python -m pip freeze --all | sort > "$RUNNER_TEMP/despues.txt"
          cambiados="$(comm -23 "$RUNNER_TEMP/antes.txt" "$RUNNER_TEMP/despues.txt")"
          [[ -z "$cambiados" ]] || { echo "::error::cambian paquetes del entorno base: $cambiados"; exit 1; }
          python - <<'PY'
          import importlib.metadata as m, re
          def pins(f):
              return dict(re.findall(r"(?im)^([A-Za-z0-9_.-]+)==(\S+)", open(f).read()))
          for nombre, ver in pins("requirements.lock").items():
              assert m.version(nombre) == ver, (nombre, m.version(nombre), ver)
          lab = pins("requirements-ensemble.lock")
          for nombre in ("gerrychain", "networkx", "rustworkx", "scipy"):
              assert m.version(nombre) == lab[nombre], (nombre, m.version(nombre), lab[nombre])
          import networkx, shapely
          from gerrychain import Graph, MarkovChain, Partition, updaters
          from gerrychain.proposals import recom
          from gerrychain.tree import bipartition_tree
          from gerrychain.tree.spanning_tree import _ordered_edge_ids
          from ddd_motor2.naturalidad_competicion import cadena
          print("cadenas OK: gerrychain", lab["gerrychain"], "; shapely", shapely.__version__, shapely.geos_version_string)
          PY
      - name: Competición del motor 2
        shell: bash
        run: |
          set -uo pipefail
          python -m ddd_motor2.competir --out bateria --funcion "$FUNCION" --cadenas "$CADENAS" "$T"
          # el veredicto lo da el job final; aquí solo cuenta que haya resultado. competir escribe un RESUMEN.json agregado
          # (una fila: este territorio); se guarda junto a su COMPETICION.json para subirlo en el artefacto del territorio.
          [[ -f bateria/competicion/RESUMEN.json ]] || exit 1
          cp bateria/competicion/RESUMEN.json "bateria/competicion/$T/RESUMEN.json"
      - name: Indicadores frente al vigente (T-212)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          # el veredicto lo da el job final; aquí solo se deja constancia (resumen del paso, log e INDICADORES.* en el artefacto)
          python herramientas/bateria_motor.py indicadores "$T" --out bateria | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Huella real (Soria, Álava y Melilla)
        if: ${{ matrix.t == 'congreso_soria' || matrix.t == 'congreso_alava' || matrix.t == 'melilla' }}
        run: python herramientas/bateria_motor.py huella "$T" --out bateria --funcion "$FUNCION" --cadenas "$CADENAS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bateria-motor2-${{ github.run_id }}-${{ matrix.t }}
          path: |
            bateria/competicion/${{ matrix.t }}
            bateria/entradas/${{ matrix.t }}/ENTRADAS.json
          retention-days: 14

  aceptacion:
    name: Aceptación del motor 2
    needs: [plan, competicion]
    if: ${{ always() && inputs.motor == 'motor2' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TERRITORIOS: ${{ inputs.territorios }}
      CADENAS: ${{ inputs.cadenas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bateria-motor2-${{ github.run_id }}-*
          path: bateria
          merge-multiple: true
      - name: Criterio de aceptación (T-194)
        shell: bash
        run: |
          set -uo pipefail
          read -ra ts <<<"$TERRITORIOS"
          python herramientas/bateria_motor.py aceptacion --out bateria --cadenas "$CADENAS" "${ts[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bateria-motor2-${{ github.run_id }}-aceptacion
          path: |
            bateria/ACEPTACION.*
            bateria/competicion/RESUMEN.*
          retention-days: 30
