# PROYECTO: Diputado de Distrito
# CLASE: interfaz operativa principal
# VERSIÓN: 2.0.0
# NOMBRE DE VERSIÓN: Incorporación electoral desacoplada
# ESTADO: candidato
# QUÉ HACE: consume un producto territorial certificado y resultados electorales preparados.
# NO HACE: generar distritos, repetir auditorías geométricas ni publicar el visor.
name: 04 · Incorporación de Resultados Electorales

on:
  workflow_call:
    inputs:
      territory_id: {required: true, type: string}
      data_edition: {required: true, type: string}
      territorial_run_id: {required: false, type: string, default: ''}
      electoral_package_run_id: {required: false, type: string, default: ''}
      electoral_package_artifact_name: {required: false, type: string, default: ''}
      source_ref: {required: false, type: string, default: ''}
      persist_state: {required: false, type: boolean, default: true}
  workflow_dispatch:
    inputs:
      territory_id:
        description: Territorio
        required: true
        default: Galicia
        type: choice
        options:
          - Andalucía
          - Aragón
          - Principado de Asturias
          - Islas Baleares
          - Canarias
          - Cantabria
          - Castilla-La Mancha
          - Castilla y León
          - Cataluña
          - Comunidad Valenciana
          - Extremadura
          - Galicia
          - Comunidad de Madrid
          - Región de Murcia
          - Comunidad Foral de Navarra
          - País Vasco
          - La Rioja
          - Ceuta
          - Melilla
      data_edition:
        description: Edición de datos
        required: true
        default: '2025'
        type: choice
        options: ['2025']

permissions:
  contents: write
  actions: read

concurrency:
  group: ddd-electoral-prod-${{ inputs.territory_id }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar incorporación electoral
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      params: ${{ steps.resolve.outputs.params }}
      territorial_run_id: ${{ steps.territorial.outputs.run_id }}
      electoral_package_run_id: ${{ steps.electoral.outputs.run_id }}
      electoral_package_artifact_name: ${{ steps.electoral.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Preparar validadores
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - id: resolve
        name: Verificar elegibilidad del territorio
        shell: bash
        env:
          UI_TERRITORY: ${{ inputs.territory_id }}
          UI_EDITION: ${{ inputs.data_edition }}
        run: |
          set -euo pipefail
          python herramientas/catalogo_preparacion.py --root-dir . validate
          row="$(python herramientas/catalogo_preparacion.py resolve             --mode electoral_application --territory "$UI_TERRITORY" --edition "$UI_EDITION")"
          territory_id="$(jq -r '.territory_id' <<<"$row")"
          params="$(jq -r '.contract_path // empty' <<<"$row")"
          test -n "$params" && test -f "$params"
          echo "territory_id=$territory_id" >> "$GITHUB_OUTPUT"
          echo "params=$params" >> "$GITHUB_OUTPUT"

      - id: territorial
        name: Localizar producto territorial certificado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ steps.resolve.outputs.territory_id }}
          PARAMS: ${{ steps.resolve.outputs.params }}
          OVERRIDE_RUN_ID: ${{ inputs.territorial_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$OVERRIDE_RUN_ID" ]]; then
            run_ids=("$OVERRIDE_RUN_ID")
          else
            mapfile -t run_ids < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&status=completed&per_page=100"               --jq '.workflow_runs|sort_by(.created_at)|reverse|.[].id')
          fi
          for run_id in "${run_ids[@]}"; do
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            jq -e --arg n "ddd-state-$run_id-M06" '.artifacts[]|select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
            jq -e --arg n "ddd-audit-$run_id" '.artifacts[]|select(.name==$n and (.expired|not))' <<<"$artifacts" >/dev/null || continue
            tmp="$(mktemp -d)"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "ddd-state-$run_id-M06" --dir "$tmp/state" >/dev/null 2>&1; then
              rm -rf "$tmp"; continue
            fi
            source_dir="$(find "$tmp/state" -type f -path '*/sources/manifest.json' -printf '%h\n' | head -1)"
            test -n "$source_dir" || { rm -rf "$tmp"; continue; }
            if python -m herramientas.seleccionar_checkpoint_productivo               --params "$PARAMS" --package "$source_dir" --state-root "$tmp/state"               --run-id "$run_id" --stage M06 --root-dir . >/dev/null 2>&1; then
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "ddd-audit-$run_id" --dir "$tmp/audit" >/dev/null 2>&1; then
                status="$(find "$tmp/audit" -name production_status.json -type f -print -quit)"
                decision="$(test -n "$status" && jq -r '.decision // empty' "$status" || true)"
                certified="$(test -n "$status" && jq -r '.territory_id // empty' "$status" || true)"
                if [[ "$certified" == "$TERRITORY_ID" && "$decision" =~ ^PASS(_WITH_EXCEPTIONS)?$ ]]; then
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                  rm -rf "$tmp"
                  exit 0
                fi
              fi
            fi
            rm -rf "$tmp"
          done
          echo "::error::No existe un producto territorial certificado y reutilizable para $TERRITORY_ID."
          exit 44

      - id: electoral
        name: Localizar resultados electorales preparados
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERRITORY_ID: ${{ steps.resolve.outputs.territory_id }}
          EDITION: ${{ inputs.data_edition }}
          PARAMS: ${{ steps.resolve.outputs.params }}
          OVERRIDE_RUN_ID: ${{ inputs.electoral_package_run_id }}
          OVERRIDE_ARTIFACT_NAME: ${{ inputs.electoral_package_artifact_name }}
        run: |
          set -euo pipefail
          prefix="ddd-electoral-package-$TERRITORY_ID-$EDITION-"
          if [[ -n "$OVERRIDE_RUN_ID" ]]; then
            run_ids=("$OVERRIDE_RUN_ID")
          else
            mapfile -t run_ids < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100"               --jq '.workflow_runs|sort_by(.created_at)|reverse|.[].id')
          fi
          for run_id in "${run_ids[@]}"; do
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            if [[ -n "$OVERRIDE_ARTIFACT_NAME" && "$run_id" == "$OVERRIDE_RUN_ID" ]]; then
              names=("$OVERRIDE_ARTIFACT_NAME")
            else
              mapfile -t names < <(jq -r --arg p "$prefix" '.artifacts[]|select((.name|startswith($p)) and (.expired|not))|.name' <<<"$artifacts")
            fi
            for artifact_name in "${names[@]}"; do
              tmp="$(mktemp -d)"
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$tmp" >/dev/null 2>&1 &&
                 python herramientas/validar_paquete_electoral.py                    --package "$tmp" --params "$PARAMS" --territory-id "$TERRITORY_ID"                    --edition "$EDITION" --root-dir . >/dev/null 2>&1; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
                rm -rf "$tmp"
                exit 0
              fi
              rm -rf "$tmp"
            done
          done
          echo "::error::No existe un paquete electoral preparado, íntegro y compatible."
          exit 45

  incorporar:
    name: Incorporar resultados
    needs: preparar
    uses: ./.github/workflows/_reutilizable-incorporacion-electoral.yml
    secrets: inherit
    with:
      params: ${{ needs.preparar.outputs.params }}
      territory_id: ${{ needs.preparar.outputs.territory_id }}
      data_edition: ${{ inputs.data_edition }}
      territorial_run_id: ${{ needs.preparar.outputs.territorial_run_id }}
      electoral_package_run_id: ${{ needs.preparar.outputs.electoral_package_run_id }}
      electoral_package_artifact_name: ${{ needs.preparar.outputs.electoral_package_artifact_name }}
      source_ref: ${{ inputs.source_ref }}
      persist_state: ${{ inputs.persist_state }}
