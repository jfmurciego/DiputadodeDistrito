# PROYECTO: Diputado de Distrito
# CLASE: smoke operacional pre-merge
# QUÉ HACE: ejecuta el orquestador 00 real sobre Galicia en modo reutilización,
# sin publicación ni mutación persistente del catálogo.
name: Smoke · 00 Ejecución Completa

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ejecucion-completa-proyecto.yml'
      - '.github/workflows/preparacion-fuentes.yml'
      - '.github/workflows/produccion-distritos.yml'
      - '.github/workflows/preparacion-resultados-electorales.yml'
      - '.github/workflows/incorporacion-resultados-electorales.yml'
      - '.github/workflows/desplegar-visor-publico.yml'
      - '.github/workflows/_reutilizable-generacion-territorial.yml'
      - '.github/workflows/_reutilizable-incorporacion-electoral.yml'
      - 'herramientas/resolver_ejecucion_completa.py'
      - 'herramientas/escribir_manifest_ejecucion_completa.py'
      - '.github/workflows/smoke-ejecucion-completa-pr.yml'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  smoke:
    name: Smoke operacional Galicia · reutilizar progreso
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/ejecucion-completa-proyecto.yml
    secrets: inherit
    with:
      territory_id: Galicia
      data_edition: '2025'
      execution_mode: Reutilizar progreso existente
      publish_result: false
      source_ref: ${{ github.event.pull_request.head.ref }}
      persist_state: false
