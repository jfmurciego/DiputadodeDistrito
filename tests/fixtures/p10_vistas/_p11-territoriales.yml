# VISTA DERIVADA de .github/workflows/p10-fuentes.yml (tipo P11); no editar: python tests/generar_vistas_p10.py
# PROYECTO: Diputado de Distrito
# CLASE: interfaz humana de preparación de fuentes
# VERSIÓN: 1.0.1
# CAMBIOS 1.0.1: T-379 PR 2b (D-163, 2b mínima): `contents: read` en todo el fichero (el push a main va con el token de la app de registro,
#   que no depende de GITHUB_TOKEN: `contents: read` NO es barrera para ese push; sin la app, la credencial falla en vez de caer en github.token);
#   entrada oculta `campana` (workflow_call; vacía = como antes). Con campaña, los jobs (en P30, los pasos) que registran en main se saltan.
#   Con campaña, P10 fuerza `persist_state=false` (P11 y P12): sin registro, `p11_resultado`/`p12_resultado` terminan en verde (PERSISTENCE_NOT_REQUIRED).
# ANTERIOR (1.0.0): legacy/workflows/p10-fuentes_v1.0.0_20261117b.yml
# FECHA: 2026-11-17
# ESTADO: candidato
# CAMBIOS: T-375 (D-136 y D-151, migración paso 6): fichero nuevo; sustituye a preparacion-fuentes.yml 1.4.14 («P10 Fuentes — P11 Territoriales») y preparacion-resultados-electorales.yml 1.0.17 («P10 Fuentes — P12 Electorales»),
#   borrados (copias en legacy/workflows/). Los cinco jobs de P11 y los cuatro de P12 pasan con los MISMOS pasos, comandos, permisos, salidas y registro, con ids `p11_*` y `p12_*`; solo corre el del `tipo` elegido.
# MOTIVO: un solo botón «P10 Fuentes»: `tipo` (P11 territoriales | P12 electorales), `territorio` (UN código por ejecución, como P20/P30, D-148/D-151; varios en paralelo los lanza P00), `eleccion` (vigente | ensayo 2026-11-29; solo P12) y
#   «regenerar aunque exista» (desmarcado). Edición fijada en el código (2025). Reutilizar automático: se reutiliza el paquete registrado si sigue descargable y compatible y se regenera si caducó (P12: antes `exit 44`; el digest nuevo
#   sustituye al registrado; el digest distinto del registrado sigue fallando, código 45). Acepta también ids de época `<t>_hAAAA_MM` (D-150).
# EXCLUSIÓN POR TERRITORIO: `concurrency` de workflow, mismos grupos que antes (`ddd-territorial-prod-<territorio>-<edición>` y `ddd-electoral-prod-<territorio>`, `queue: max`); `ddd-catalog-promotion` sigue en los jobs `*_registrar`.
#   El territorio del grupo es el ID CANÓNICO (aut12) en los dos caminos: el botón recibe el código y la 00 y «Legislatura» pasan `territory_id` (no el nombre del catálogo), así que dos ejecuciones del mismo territorio se excluyen aunque una venga del botón y otra de la 00.
#   Pérdida TRANSITORIA declarada: la 00 sigue pasando el NOMBRE del catálogo a `produccion-distritos.yml` y su reutilizable de generación territorial y `incorporacion-resultados-electorales.yml` (grupos `ddd-territorial-prod-<nombre>-<edición>` y `ddd-electoral-prod-<nombre>`), así que P10 (id canónico) no se excluye con ellos hasta que P20 (#880) y P30 (#866, T-376) —que calculan su grupo con el id canónico resuelto internamente— sustituyan a esos workflows; no hay campañas mientras tanto (D-149).
#   Con la edición vacía (botón) el grupo de P11 usa `2025`, la edición fijada, para coincidir con P30.
# P12 desde el botón: la edición es la fijada en el código (2025: `inputs.data_edition || '2025'` en el resolver).
# workflow_call (entradas técnicas ocultas; la 00 y «Legislatura vigente»): `tipo` territoriales|electorales; `territory_id` el id canónico del territorio (aut12, no «Galicia»); `data_edition` vacía = edición y años del catálogo vigente (solo P11);
#   `eleccion` vacía = vigente; `source_year`, `population_year`, `section_year`, `source_ref`, `recover_run_id` y `recover_artifact_sha256` vacíos = sin valor (solo P11 salvo `source_ref`); `reutilizar_si_ya_preparada`,
#   `persist_state` y `allow_source_gap_success` booleanos (en el botón llegan vacíos: persistir obligatorio, sin hueco de fuente). Salidas = unión de las dos anteriores (las del tipo no ejecutado salen vacías).
# ANTERIOR: ninguna (fichero nuevo); sustituye a legacy/workflows/preparacion-fuentes_v1.4.14_20261116.yml y legacy/workflows/preparacion-resultados-electorales_v1.0.17_20261116.yml
name: P10 Fuentes

on:
  workflow_call:
    inputs:
      campana: {required: false, type: string, default: ''}  # T-379 2b (D-163): id de campaña de P00; no vacía = ruta de campaña (sin registro en main)
      tipo: {required: true, type: string}
      territory_id: {required: true, type: string}
      data_edition: {required: false, type: string, default: ''}
      source_year: {required: false, type: string, default: ''}
      population_year: {required: false, type: string, default: ''}
      section_year: {required: false, type: string, default: ''}
      reutilizar_si_ya_preparada: {required: false, type: boolean, default: true}
      source_ref: {required: false, type: string, default: ''}
      persist_state: {required: false, type: boolean, default: true}
      recover_run_id: {required: false, type: string, default: ''}
      recover_artifact_sha256: {required: false, type: string, default: ''}
      allow_source_gap_success: {required: false, type: boolean, default: false}
      eleccion: {required: false, type: string, default: ''}
    outputs:
      territory_id:
        value: ${{ jobs.resolver.outputs.territory_id }}
      edition:
        value: ${{ jobs.resolver.outputs.edition }}
      artifact_name:
        value: ${{ jobs.territoriales.outputs.artifact_name }}
      artifact_digest:
        value: ${{ jobs.territoriales.outputs.artifact_digest }}
      prepared_source_ref:
        value: ${{ jobs.generation_pending.outputs.prepared_source_ref }}
  workflow_dispatch:
    inputs:
      tipo:
        description: Qué fuentes preparar
        required: true
        default: P11 territoriales
        type: choice
        options:
          - P11 territoriales
          - P12 electorales
      territorio:
        description: Un código de territorio (p. ej. aut13 o nac28)
        required: true
        type: string
      eleccion:
        description: Elección (solo P12; el ensayo no persiste ni registra)
        required: true
        default: vigente
        type: choice
        options:
          - vigente
          - ensayo 2026-11-29
      regenerar:
        description: Regenerar aunque ya exista
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ contains(inputs.tipo, 'electorales') && format('ddd-electoral-prod-{0}', inputs.territory_id || inputs.territorio) || format('ddd-territorial-prod-{0}-{1}', inputs.territory_id || inputs.territorio, inputs.data_edition || '2025') }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read  # T-379 2b (D-163): el push a main va con el token de la app de registro, no con GITHUB_TOKEN
  actions: read

env:
  ELECCIONESDB_SNAPSHOT_SHA256: 668f8eeefe0c19f427367ee2b44f0050c30b93d39f7300fad3d6f381966d91fc

jobs:
  resolver:
    name: Resolver preparación desde catálogo
    runs-on: ubuntu-24.04
    outputs:
      territory_id: ${{ steps.resolve.outputs.territory_id }}
      edition: ${{ steps.resolve.outputs.edition }}
      reuse_enabled: ${{ steps.resolve.outputs.reuse_enabled }}
      registered_run_id: ${{ steps.resolve.outputs.registered_run_id }}
      registered_artifact_name: ${{ steps.resolve.outputs.registered_artifact_name }}
      registered_artifact_sha256: ${{ steps.resolve.outputs.registered_artifact_sha256 }}
      explicit_recovery: ${{ steps.resolve.outputs.explicit_recovery }}
      source_year: ${{ steps.resolve.outputs.source_year }}
      population_year: ${{ steps.resolve.outputs.population_year }}
      section_year: ${{ steps.resolve.outputs.section_year }}
      persist_state: ${{ steps.resolve.outputs.persist_state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: resolve
        env:
          TERRITORY: ${{ inputs.territory_id }}
          EDITION_INPUT: ${{ inputs.data_edition || '' }}
          SOURCE_YEAR_INPUT: ${{ inputs.source_year || '' }}
          POPULATION_YEAR_INPUT: ${{ inputs.population_year || '' }}
          SECTION_YEAR_INPUT: ${{ inputs.section_year || '' }}
          REUSE_INPUT: ${{ toJSON(inputs.reutilizar_si_ya_preparada) }}
          REGENERAR_INPUT: ${{ inputs.regenerar }}
          PERSIST_INPUT: ${{ inputs.campana && 'false' || toJSON(inputs.persist_state) }}
          RECOVERY_RUN_ID: ${{ inputs.recover_run_id || '' }}
          RECOVERY_SHA256: ${{ inputs.recover_artifact_sha256 || '' }}
        run: |
          set -euo pipefail
          python herramientas/catalogo_preparacion.py --root-dir . validate

          # workflow_call hereda el evento del caller; no usar github.event_name para
          # distinguir una ejecución manual directa de una llamada reutilizable.
          # data_edition es obligatoria en workflow_call y no existe en workflow_dispatch.
          if [[ -z "$EDITION_INPUT" ]]; then
            current="$(python herramientas/resolver_preparacion_legislatura.py --root-dir . --territory "$TERRITORY")"
            plan="$(jq -ce '.plans | if length == 1 then .[0] else error("La preparación manual exige exactamente un territorio") end' <<<"$current")"
            EDITION="$(jq -r .project_edition <<<"$plan")"
            population_year="$(jq -r .population_year_selected <<<"$plan")"
            section_year="$(jq -r .section_year_selected <<<"$plan")"
            TERRITORY="$(jq -r .territory_id <<<"$plan")"
            reuse_enabled=true
            [[ "$REGENERAR_INPUT" == true ]] && reuse_enabled=false  # T-375: «regenerar aunque exista» del botón de P10
            persist_requested=true
            RECOVERY_RUN_ID=""
            RECOVERY_SHA256=""
          else
            EDITION="$EDITION_INPUT"
            legacy_year="$SOURCE_YEAR_INPUT"
            population_year="$POPULATION_YEAR_INPUT"
            section_year="$SECTION_YEAR_INPUT"
            [[ -n "$population_year" ]] || population_year="$legacy_year"
            [[ -n "$section_year" ]] || section_year="$legacy_year"
            reuse_enabled="$REUSE_INPUT"
            persist_requested="$PERSIST_INPUT"
          fi

          [[ -n "$EDITION" ]] || { echo "::error::Edición interna no resuelta."; exit 40; }
          [[ -n "$population_year" && -n "$section_year" ]] || {
            echo "::error::Contrato temporal incompleto: faltan años de población o seccionado."
            exit 40
          }
          persist_json="$(python herramientas/evaluar_persistencia_preparacion.py resolve --requested "$persist_requested")"
          echo "persist_state=$(jq -r '.persist_state|tostring' <<<"$persist_json")" >> "$GITHUB_OUTPUT"
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "reuse_enabled=$reuse_enabled" >> "$GITHUB_OUTPUT"
          [[ "$population_year" =~ ^20[0-9]{2}$ ]] || { echo "::error::Año de población inválido: $population_year"; exit 40; }
          [[ "$section_year" =~ ^20[0-9]{2}$ ]] || { echo "::error::Año de seccionado inválido: $section_year"; exit 40; }
          echo "population_year=$population_year" >> "$GITHUB_OUTPUT"
          echo "section_year=$section_year" >> "$GITHUB_OUTPUT"
          if [[ "$population_year" == "$section_year" ]]; then echo "source_year=$population_year" >> "$GITHUB_OUTPUT"; else echo "source_year=" >> "$GITHUB_OUTPUT"; fi
          row="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY" --edition "$EDITION")"
          TERRITORY="$(jq -r .territory_id <<<"$row")"
          python herramientas/resolver_fuentes_territorio.py declaration --territory "$TERRITORY" --edition "$EDITION" --population-year "$population_year" --section-year "$section_year" >/dev/null
          preflight="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY" --edition "$EDITION")"
          echo "territory_id=$TERRITORY" >> "$GITHUB_OUTPUT"
          if [[ -n "$RECOVERY_RUN_ID" || -n "$RECOVERY_SHA256" ]]; then
            echo "explicit_recovery=true" >> "$GITHUB_OUTPUT"
            [[ "$(jq -r '.persist_state|tostring' <<<"$persist_json")" == true ]] || { echo "::error::La recuperación durable exige persist_state=true."; exit 41; }
            [[ "$GITHUB_REF_NAME" == main ]] || { echo "::error::La recuperación durable solo se permite en main."; exit 41; }
            [[ "$reuse_enabled" == true ]] || { echo "::error::La recuperación exige reutilización habilitada."; exit 41; }
            [[ -n "$RECOVERY_RUN_ID" && -n "$RECOVERY_SHA256" ]] || { echo "::error::Recuperación requiere run y SHA-256 juntos."; exit 41; }
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Run de recuperación inválido."; exit 41; }
            RECOVERY_SHA256="${RECOVERY_SHA256#sha256:}"
            [[ "$RECOVERY_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::SHA-256 de recuperación inválido."; exit 41; }
            [[ "$(jq -r '.registered' <<<"$preflight")" == false ]] || { echo "::error::La fuente ya tiene registro durable; se rechaza la recuperación explícita."; exit 41; }
            echo "registered_run_id=$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_name=ddd-source-package-$(jq -r .territory_id <<<"$row")-$EDITION-$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "registered_artifact_sha256=${RECOVERY_SHA256,,}" >> "$GITHUB_OUTPUT"
          else
            echo "explicit_recovery=false" >> "$GITHUB_OUTPUT"
            registered_population_year="$(jq -r '.population_year // .source_year // empty' <<<"$preflight")"
            registered_section_year="$(jq -r '.section_year // .source_year // empty' <<<"$preflight")"
            if [[ "$(jq -r '.registered|tostring' <<<"$preflight")" == true && "$registered_population_year" == "$population_year" && "$registered_section_year" == "$section_year" ]]; then
              echo "registered_run_id=$(jq -r '.run_id // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_name=$(jq -r '.artifact_name // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_sha256=$(jq -r '.artifact_sha256 // empty' <<<"$preflight")" >> "$GITHUB_OUTPUT"
            else
              echo "registered_run_id=" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_name=" >> "$GITHUB_OUTPUT"
              echo "registered_artifact_sha256=" >> "$GITHUB_OUTPUT"
            fi
          fi

  territoriales:
    name: Preparar fuentes territoriales
    needs: resolver
    runs-on: ubuntu-24.04
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ inputs.territory_id }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ needs.resolver.outputs.edition }}
      POPULATION_YEAR: ${{ needs.resolver.outputs.population_year }}
      SECTION_YEAR: ${{ needs.resolver.outputs.section_year }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
      EVIDENCE_DIR: .ddd-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          token: ${{ github.token }}
      - name: Instalar dependencias de resolución territorial
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Instalar entorno geoespacial para reutilización
        if: ${{ needs.resolver.outputs.reuse_enabled == 'true' && needs.resolver.outputs.registered_run_id != '' }}
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Verificar entorno geoespacial para reutilización
        if: ${{ needs.resolver.outputs.reuse_enabled == 'true' && needs.resolver.outputs.registered_run_id != '' }}
        run: python -c "import geopandas, pandas, shapely, pyproj, pyogrio, yaml"
      - name: Generar declaración territorial desde fuentes oficiales
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration \
            --territory "$TERRITORY" \
            --edition "$EDITION" \
            --population-year "$POPULATION_YEAR" \
            --section-year "$SECTION_YEAR" \
            --output "$SOURCE_DECLARATION"
          test -s "$SOURCE_DECLARATION"
      - id: previous
        name: Recuperar fuente territorial registrada
        if: ${{ needs.resolver.outputs.reuse_enabled == 'true' && needs.resolver.outputs.registered_run_id != '' }}
        shell: bash
        env:
          REGISTERED_RUN_ID: ${{ needs.resolver.outputs.registered_run_id }}
          REGISTERED_ARTIFACT_NAME: ${{ needs.resolver.outputs.registered_artifact_name }}
          REGISTERED_ARTIFACT_SHA256: ${{ needs.resolver.outputs.registered_artifact_sha256 }}
          EXPLICIT_RECOVERY: ${{ needs.resolver.outputs.explicit_recovery }}
        run: |
          set -euo pipefail
          arts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REGISTERED_RUN_ID/artifacts?per_page=100")"
          named="$(jq -c --arg n "$REGISTERED_ARTIFACT_NAME" '[.artifacts[]|select(.name==$n)]' <<<"$arts")"
          [[ "$(jq 'length' <<<"$named")" -le 1 ]] || { echo "::error::Artefacto territorial registrado ambiguo: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"; exit 44; }
          match="$(jq -c '[.[]|select(.expired|not)] | if length==1 then .[0] else empty end' <<<"$named")"
          if [[ -z "$match" ]]; then
            # La recuperación exacta solo admite esos bytes. En la reutilización ordinaria,
            # caducado o eliminado no contradice la identidad registrada: se vuelve a adquirir
            # desde la fuente oficial y el registro apuntará al paquete nuevo.
            [[ "$EXPLICIT_RECOVERY" != true ]] || { echo "::error::Artefacto territorial registrado no disponible: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"; exit 44; }
            echo "::warning::Artefacto territorial registrado no disponible (caducado o eliminado): $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID); se prepara de nuevo desde la fuente oficial."
            echo "reused_candidate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_digest="$(jq -r '.digest // empty' <<<"$match" | sed 's/^sha256://')"
          [[ "$actual_digest" == "$REGISTERED_ARTIFACT_SHA256" ]] || { echo "::error::Digest de artefacto territorial no coincide con el registro."; exit 45; }
          rm -rf .ddd-source-package
          gh run download "$REGISTERED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$REGISTERED_ARTIFACT_NAME" --dir .ddd-source-package
          rc=0
          python -m herramientas.seleccionar_paquete_fuentes --package .ddd-source-package --territory-id "$TERRITORY_ID" --edition "$EDITION" --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR" || rc=$?
          if [[ "$rc" == 3 ]]; then
            # T-336: el paquete registrado es de un id de territorio NO canónico: no se reutiliza, se adquiere de nuevo.
            echo "::warning::Paquete registrado $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID) con id de territorio no canónico: se rechaza y se adquiere de nuevo (T-336)."
            {
              echo "### Fuentes del P10: ADQUIRIRÁ (paquete registrado rechazado)"
              echo "- Paquete registrado: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID)"
              echo "- Motivo: territory_id del paquete distinto del canónico $TERRITORY_ID"
            } >> "$GITHUB_STEP_SUMMARY"
            # El paquete viejo NO debe quedar en el directorio de trabajo: la política lo leería y devolvería REUSE.
            rm -rf .ddd-source-package
            echo "reused_candidate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$rc" == 0 ]] || exit "$rc"
          # Cinturón: si se reutiliza, el id de manifiesto y de los 3 documentos es EXACTAMENTE el canónico, o falla.
          python - "$TERRITORY_ID" <<'PY' || { echo "::error::Reutilización de un paquete con id no canónico (T-336)."; exit 46; }
          import sys
          from pathlib import Path
          from herramientas.politica_reutilizacion_fuentes import paquete_territory_mismatch
          m = paquete_territory_mismatch(Path(".ddd-source-package"), sys.argv[1])
          if m:
              print("; ".join(m)); raise SystemExit(1)
          PY
          {
            echo "### Fuentes del P10: REUTILIZÓ"
            echo "- Paquete: $REGISTERED_ARTIFACT_NAME (run $REGISTERED_RUN_ID), territory_id verificado == $TERRITORY_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "run_id=$REGISTERED_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$REGISTERED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "reused_candidate=true" >> "$GITHUB_OUTPUT"
      - name: Instalar entorno geoespacial para el paquete de R2
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - id: r2
        name: Paquete P10 desde R2 (consulta al INE sin descargar)
        if: ${{ steps.previous.outputs.reused_candidate != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_BUCKET || '' }}
        run: |
          python herramientas/p10_desde_r2.py preparar --territory "$TERRITORY_ID" --edition "$EDITION" \
            --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR" --out .ddd-source-package --declaration "$SOURCE_DECLARATION"
      - name: Resumen de fuentes (adquiere)
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        run: |
          echo "### Fuentes del P10: ADQUIERE desde la fuente oficial (sin paquete reutilizable para $TERRITORY_ID)" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        with:
          context: .
          pull: true
          load: true
          tags: ddd-source-preparation:${{ github.sha }}
          cache-from: type=gha,scope=ddd-source-preparation-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=ddd-source-preparation-${{ github.sha }}
      - id: mode
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        run: |
          mode="$(docker run --rm -i -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA} - "$SOURCE_DECLARATION" <<'PY'
          import sys,yaml
          from pathlib import Path
          d=yaml.safe_load((Path('/app')/sys.argv[1]).read_text(encoding='utf-8')) or {}
          print((d.get('default_mode') or {}).get('production') or '')
          PY
          )"
          case "$mode" in official_live|verified_snapshot) ;; *) echo "::error::Modo productivo inválido: $mode"; exit 40;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' && steps.mode.outputs.mode == 'verified_snapshot' }}
        run: bash inputs/partes/reconstruir_fuentes.sh
      - id: acquire
        name: Adquirir y congelar fuentes
        if: ${{ steps.previous.outputs.reused_candidate != 'true' && steps.r2.outputs.desde_r2 != 'true' }}
        run: |
          docker run --rm -v "$PWD:/app" -w /app --entrypoint python ddd-source-preparation:${GITHUB_SHA}             -m herramientas.ejecutar_fuentes_workflow             --declaration "/app/$SOURCE_DECLARATION" --working /app/.ddd-source-package             --checkpoint-out /app/.ddd-source-checkpoint --acquisition-evidence "/app/$EVIDENCE_DIR"             --environment production --acquisition-mode '${{ steps.mode.outputs.mode }}' --root-dir /app
      - name: Publicar diagnóstico de adquisición fallida
        if: ${{ failure() && steps.acquire.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-source-diagnostics-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - id: meta
        name: Identificar paquete territorial
        run: echo "artifact_name=ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
          path: .ddd-source-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  registrar:
    name: Registrar fuentes territoriales preparadas
    needs: [resolver, territoriales]
    outputs:
      artifact_sha256: ${{ steps.register.outputs.artifact_sha256 }}
      package_sha256: ${{ steps.register.outputs.package_sha256 }}
      promotion_sha: ${{ steps.register.outputs.promotion_sha }}
    if: ${{ (needs.territoriales.result == 'success' && needs.resolver.outputs.persist_state == 'true') && !inputs.campana }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ddd-catalog-promotion
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      TERRITORY: ${{ inputs.territory_id }}
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ needs.resolver.outputs.edition }}
      POPULATION_YEAR: ${{ needs.resolver.outputs.population_year }}
      SECTION_YEAR: ${{ needs.resolver.outputs.section_year }}
      ARTIFACT_NAME: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
      ARTIFACT_SHA256: ${{ needs.territoriales.outputs.artifact_digest }}
      TARGET_BRANCH: ${{ github.ref_name }}
      SOURCE_DECLARATION: .ddd-generated-sources/fuentes_territorio.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "::error::Sin la app de registro (DDD_REGISTRO_APP_*): GITHUB_TOKEN es de solo lectura (T-379 2b, D-163)."; exit 1; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - name: Instalar entorno geoespacial de registro
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Verificar entorno geoespacial de registro
        run: python -c "import geopandas, pandas, shapely, pyproj, pyogrio, yaml"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ddd-source-package-${{ needs.resolver.outputs.territory_id }}-${{ needs.resolver.outputs.edition }}-${{ github.run_id }}
          path: .ddd-source-package
      - id: register
        name: Registrar preparación territorial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DECLARATION")"
          python herramientas/resolver_fuentes_territorio.py declaration             --territory "$TERRITORY" --edition "$EDITION" --population-year "$POPULATION_YEAR" --section-year "$SECTION_YEAR" --output "$SOURCE_DECLARATION"
          python -m herramientas.promover_catalogo_tras_preparacion             --root-dir .             --territory-id "$TERRITORY_ID"             --edition "$EDITION"             --package .ddd-source-package             --source-declaration "$SOURCE_DECLARATION"             --run-id "$GITHUB_RUN_ID"             --artifact-name "$ARTIFACT_NAME"             --artifact-sha256 "$ARTIFACT_SHA256"             --source-commit "$GITHUB_SHA"             --persist             --target-branch "$TARGET_BRANCH"             --max-attempts 4 > .ddd-catalog-promotion.json
          echo "artifact_sha256=$(jq -r .artifact_sha256 .ddd-catalog-promotion.json)" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$(jq -r .package_sha256 .ddd-catalog-promotion.json)" >> "$GITHUB_OUTPUT"
          python herramientas/catalogo_preparacion.py --root-dir . validate
          durable="$(python herramientas/preflight_preparacion_fuente.py --root-dir . --kind territorial --territory "$TERRITORY_ID" --edition "$EDITION")"
          [[ "$(jq -r .run_id <<<"$durable")" == "$GITHUB_RUN_ID" ]] || { echo "::error::El registro territorial durable no apunta al run actual."; exit 48; }
          [[ "$(jq -r .artifact_name <<<"$durable")" == "$ARTIFACT_NAME" ]] || { echo "::error::El registro territorial durable no conserva el artefacto esperado."; exit 49; }
          [[ "$(jq -r .artifact_sha256 <<<"$durable")" == "${ARTIFACT_SHA256#sha256:}" ]] || { echo "::error::El registro territorial durable no conserva el SHA-256 esperado."; exit 50; }
          promotion_sha="$(jq -r .promotion_sha .ddd-catalog-promotion.json)"
          [[ "$promotion_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit de promoción inválido."; exit 51; }
          [[ "$(git rev-parse HEAD)" == "$promotion_sha" ]] || { echo "::error::El checkout final no coincide con la promoción durable."; exit 52; }
          echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"

  generation_pending:
    name: Registrar evaluación de generación pendiente
    needs: [resolver, registrar]
    if: ${{ (always() && needs.resolver.result == 'success' && needs.registrar.result == 'success' && needs.resolver.outputs.persist_state == 'true') && !inputs.campana }}
    runs-on: ubuntu-24.04
    outputs:
      prepared_source_ref: ${{ steps.persist.outputs.prepared_source_ref }}
    env:
      TERRITORY_ID: ${{ needs.resolver.outputs.territory_id }}
      EDITION: ${{ needs.resolver.outputs.edition }}
      RUN_ID: ${{ github.run_id }}
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.registrar.outputs.promotion_sha }}
          token: ${{ github.token }}
      - name: Credencial de registro
        shell: bash
        env:
          APP_ID: ${{ secrets.DDD_REGISTRO_APP_ID }}
          APP_KEY: ${{ secrets.DDD_REGISTRO_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_KEY:-}" ]]; then echo "::error::Sin la app de registro (DDD_REGISTRO_APP_*): GITHUB_TOKEN es de solo lectura (T-379 2b, D-163)."; exit 1; fi
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"; key="$(mktemp)"; printf '%s\n' "$APP_KEY" > "$key"
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64)"; rm -f "$key"
          auth=(-H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json")
          inst="$(curl -fsS "${auth[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)"
          token="$(curl -fsS -X POST "${auth[@]}" "$GITHUB_API_URL/app/installations/$inst/access_tokens" | jq -r .token)"
          [[ -n "$token" && "$token" != null ]] || { echo "::error::La app de registro no devolvió token."; exit 1; }
          echo "::add-mask::$token"
          git config --local --unset-all http.https://github.com/.extraheader || true
          for inc in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true); do git config --local --unset-all "$inc" || true; done
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "Registro con la app propia (exenta en el ruleset proteger-main)."
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - id: candidate
        name: Materializar estado PENDING ligado a la fuente acreditada
        shell: bash
        run: |
          set -euo pipefail
          contract_path="$(python herramientas/catalogo_preparacion.py lookup --territory "$TERRITORY_ID" --edition "$EDITION" | jq -r '.contract_path')"
          [[ -n "$contract_path" && "$contract_path" != null ]] || {
            echo "::error::La fuente acreditada no tiene contrato territorial efectivo."
            exit 56
          }
          python - "$TERRITORY_ID" "$EDITION" "$RUN_ID" "$contract_path" <<'PY'
          import json,sys
          from pathlib import Path
          from herramientas.materializar_evidencia_pre_m04 import build_generation_evaluation
          territory_id,edition,run_id,contract_path=sys.argv[1:]
          payload=build_generation_evaluation(
              root_dir=Path("."),
              territory_id=territory_id,
              edition=edition,
              run_id=int(run_id),
              status="PENDING",
              stage="SOURCE_PREPARED",
              reason="Fuente territorial acreditada; habilitación de generación todavía no evaluada.",
          )
          Path(".ddd-generation-pending.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY
          echo "contract_path=$contract_path" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: persist
        name: Persistir diagnóstico con el escritor concurrente común
        env:
          CONTRACT_PATH: ${{ steps.candidate.outputs.contract_path }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          source_ref="$(python -m herramientas.persistir_evidencia_pre_m04_operacional             --root-dir .             --territory-id "$TERRITORY_ID"             --edition "$EDITION"             --run-id "$RUN_ID"             --contract-path "$CONTRACT_PATH"             --candidate-evidence .ddd-generation-pending.json             --source-commit "$SOURCE_COMMIT"             --target-branch "$TARGET_BRANCH"             --result-json .ddd-generation-pending-persistence.json)" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Persistencia PENDING falló (exit $rc); ver .ddd-generation-pending-persistence.json"
            if [[ -f .ddd-generation-pending-persistence.json ]]; then cat .ddd-generation-pending-persistence.json; fi
            exit "$rc"
          fi
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Persistencia PENDING no devolvió un commit durable."
            exit 57
          }
          echo "prepared_source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  resultado:
    name: Verificar resultado durable de preparación
    needs: [resolver, territoriales, registrar, generation_pending]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Exigir registro cuando la persistencia es obligatoria
        env:
          PREPARATION_RESULT: ${{ needs.territoriales.result }}
          REGISTRATION_RESULT: ${{ needs.registrar.result }}
          PERSIST_STATE: ${{ needs.resolver.outputs.persist_state }}
          GENERATION_PENDING_RESULT: ${{ needs.generation_pending.result }}
        run: |
          if [[ "$PERSIST_STATE" == true && "$PREPARATION_RESULT" == success && "$GENERATION_PENDING_RESULT" != success ]]; then
            echo "::error::La fuente fue preparada, pero no quedó persistido su estado PENDING de generación: $GENERATION_PENDING_RESULT"
            exit 56
          fi
          python herramientas/evaluar_persistencia_preparacion.py terminal \
            --preparation-result "$PREPARATION_RESULT" \
            --registration-result "$REGISTRATION_RESULT" \
            --persist-state "$PERSIST_STATE"
